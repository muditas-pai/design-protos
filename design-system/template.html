<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New proto — presentations.ai design system</title>

  <!-- 1) Fonts + icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <!-- 2) Design system -->
  <!--    a) Tailwind utilities with brand tokens (bg-bg-primary-inverted, text-body-base-medium, …) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="pai.tailwind.js"></script>
  <!--    b) Component classes (.button-style, .pai-badge, .pai-input, …) -->
  <link rel="stylesheet" href="pai.css" />
</head>

<!-- `pai` sets the Inter base font + brand text color -->
<body class="pai" style="margin:0; background:#F5F5F7;">

  <main style="max-width:880px; margin:0 auto; padding:48px 24px;">
    <!-- Build your prototype here. Two interchangeable ways to style: -->

    <!-- Component classes (from pai.css) -->
    <button class="button-style button-medium button-primary">Primary button</button>
    <span class="pai-badge pai-badge-pro">PRO</span>

    <!-- Tailwind utilities with brand tokens (from pai.tailwind.js) -->
    <div class="mt-6 p-4 rounded-md bg-bg-elevated shadow-elevation-02">
      <p class="text-body-base-medium text-text-primary">Card on an elevated surface.</p>
      <p class="text-body-sm-regular text-text-secondary mt-1">Secondary supporting copy.</p>
    </div>
  </main>

</body>
</html>
