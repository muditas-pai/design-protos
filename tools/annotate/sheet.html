<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Annotations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================================
     Every note in the repo, each with a picture of what it is about.

     The picture is the real proto in an iframe, scaled and offset so the
     annotated element sits in frame, with a highlight over it. Not a raster:
     a note anchors by CSS selector, so the thing worth showing is the DOM the
     selector resolves against. A PNG could not be re-anchored, re-measured or
     linted, and would go stale without saying so.

     It shows a REGION around the element, not a tight crop. Most judgements
     are about an element in its context — "the subtitle repeats the title"
     cannot be seen from the subtitle alone.
     ========================================================================= */
  :root {
    --ink: #0A1925; --ink-2: #3d4a54; --ink-3: #6b7780; --ink-4: #9aa4ac;
    --rule: #e4e7e9; --paper: #fff; --paper-2: #f7f8f9;
    --mark: #b8860b; --mark-bg: #fdf7e8; --mark-ln: #ecd9a3; --stop: #b42318;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    margin: 0; background: var(--paper-2); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; padding: 18px 24px 15px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(10px);
    box-shadow: 0 1px 0 rgba(10,25,37,.07);
    display: flex; align-items: baseline; gap: 14px;
  }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sp { flex: 1; }
  a.plain {
    position: relative; color: var(--ink-3); font-size: 12px; font-weight: 500;
    text-decoration: none; transition: color .15s;
  }
  a.plain:hover { color: var(--ink); }
  /* 40px target on a 15px-tall link */
  a.plain::after { content: ""; position: absolute; left: -8px; right: -8px; top: 50%;
                   height: 40px; transform: translateY(-50%); }

  .group { padding: 28px 24px 0; }
  .group h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-4); margin: 0 0 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  /* card 12, shot inner 11 (12 minus the 1px ring), so the radii stay concentric */
  .card {
    background: var(--paper); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(10,25,37,.07), 0 1px 2px rgba(10,25,37,.04);
    transition: box-shadow .18s cubic-bezier(.2,0,0,1),
                translate .18s cubic-bezier(.2,0,0,1);
    opacity: 0; translate: 0 6px; animation: rise .32s cubic-bezier(.2,0,0,1) forwards;
  }
  @keyframes rise { to { opacity: 1; translate: 0 0; } }
  .card:hover {
    box-shadow: 0 0 0 1px rgba(10,25,37,.10), 0 6px 18px rgba(10,25,37,.09);
    translate: 0 -2px;
  }

  /* the picture */
  .shot {
    position: relative; height: 190px; background: #fff; overflow: hidden;
    border-radius: 11px 11px 0 0;
  }
  .shot iframe {
    position: absolute; top: 0; left: 0; border: 0;
    transform-origin: 0 0; pointer-events: none;
  }
  /* a hairline over the render, the way an image gets one, so white proto
     content does not bleed into the white card */
  .shot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: 11px 11px 0 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.06);
  }
  .shot .box {
    position: absolute; border: 2px solid var(--mark);
    background: rgba(184,134,11,.14); border-radius: 3px; pointer-events: none;
    box-shadow: 0 0 0 3px rgba(184,134,11,.12);
  }
  .shot .ph {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--stop); font-size: 12px;
    background: var(--paper-2); text-align: center; padding: 0 20px;
  }

  /* the words, which are the point */
  .body { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .note { font-size: 13.5px; line-height: 1.52; color: var(--ink); text-wrap: pretty; }
  .foot {
    display: flex; align-items: center; gap: 7px; margin-top: auto;
    font-size: 10.5px; color: var(--ink-4);
    font-family: ui-monospace, Menlo, monospace;
  }
  .foot a { color: var(--ink-3); text-decoration: none; transition: color .15s; }
  .foot a:hover { color: var(--ink); }
  .tag {
    padding: 2px 7px; border-radius: 5px; background: var(--paper-2); color: var(--ink-3);
    box-shadow: inset 0 0 0 1px rgba(10,25,37,.06);
  }
  .tag.state { color: var(--ink); background: #eef0f2; }
  .tag.warn { background: var(--mark-bg); color: #8a6508; box-shadow: inset 0 0 0 1px var(--mark-ln); }
  .id { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-4); }
  .empty { padding: 60px 24px; color: var(--ink-3); font-size: 13px; }
  .empty code {
    background: #eef0f2; border-radius: 4px; padding: 2px 6px; font-size: 12px;
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; translate: 0 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Annotations</h1>
  <span class="meta" id="count">reading&hellip;</span>
  <span class="sp"></span>
  <a class="plain" href="system.html">How this works &rsaquo;</a>
</header>
<div id="out" class="empty">Loading&hellip;</div>

<script>
(function () {
  "use strict";

  var CARD_W = 320, CARD_H = 190;
  var PAD = 64;          // context around the element, in proto pixels
  var MAX_SCALE = 1.4;   // a tiny element may grow, but not into abstraction
  var MIN_MARK = 14;     // a 1px divider still has to be findable by eye

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* Which slice of the proto to show, and how to fit it in the card.
     Centred on the element, padded for context, clamped to the page. */
  function frame(n) {
    var r = n.rect || [0, 0, 0, 0];
    var vw = (n.viewport && n.viewport[0]) || 1440;
    var vh = (n.viewport && n.viewport[1]) || 900;
    var ex = r[0], ey = r[1], ew = Math.max(r[2], 1), eh = Math.max(r[3], 1);

    var rw = ew + PAD * 2, rh = eh + PAD * 2;
    var scale = Math.min(CARD_W / rw, CARD_H / rh, MAX_SCALE);
    // widen the region to whatever the card can actually hold at that scale,
    // so a short element still shows the row it sits in
    var showW = CARD_W / scale, showH = CARD_H / scale;
    var rx = ex + ew / 2 - showW / 2;
    var ry = ey + eh / 2 - showH / 2;
    rx = Math.max(0, Math.min(rx, Math.max(0, vw - showW)));
    ry = Math.max(0, ry);            // page height is unknown, so only clamp the top

    // The highlight marks the element; it does not measure it. A divider is
    // one pixel tall, and a one-pixel outline is a thing nobody can find, so
    // grow the mark symmetrically to a size the eye can catch.
    var bx = (ex - rx) * scale, by = (ey - ry) * scale;
    var bw = ew * scale, bh = eh * scale;
    if (bw < MIN_MARK) { bx -= (MIN_MARK - bw) / 2; bw = MIN_MARK; }
    if (bh < MIN_MARK) { by -= (MIN_MARK - bh) / 2; bh = MIN_MARK; }

    return { scale: scale, rx: rx, ry: ry, vw: vw, vh: vh,
             box: { x: bx, y: by, w: bw, h: bh } };
  }

  // repo root, relative to this page. Absolute "/" would break on Pages, where
  // the site is served under /design-protos/ rather than at the domain root.
  var ROOT = "../../";

  function card(n, i) {
    var f = frame(n);
    var src = ROOT + n.proto + (n.state || "");
    var el = document.createElement("div");
    el.className = "card";
    // stagger, capped so a long sheet does not take a visible age to settle
    el.style.animationDelay = Math.min(i, 11) * 40 + "ms";

    var problem = "the proto this note was made on no longer exists";

    el.innerHTML =
      '<div class="shot">' +
        (n.proto_exists
          ? '<iframe data-src="' + esc(src) + '" scrolling="no" ' +
                   'style="width:' + f.vw + 'px;height:' + f.vh + 'px;' +
                   'transform:scale(' + f.scale.toFixed(4) + ') ' +
                   'translate(' + (-f.rx).toFixed(1) + 'px,' + (-f.ry).toFixed(1) + 'px)"></iframe>' +
            '<div class="box" style="left:' + f.box.x.toFixed(1) + 'px;top:' + f.box.y.toFixed(1) + 'px;' +
                 'width:' + f.box.w.toFixed(1) + 'px;height:' + f.box.h.toFixed(1) + 'px"></div>'
          : '<div class="ph bad">' + esc(problem) + '</div>') +
      '</div>' +
      '<div class="body">' +
        '<div class="note">' + esc(n.note) + '</div>' +
        '<div class="foot">' +
          '<a href="' + ROOT + esc(n.proto) + (esc(n.state) || "") + '" title="open and press Shift+C">' +
            esc(n.proto.split("/").pop()) + "</a>" +
          (n.state ? '<span class="tag state">' + esc(n.state) + "</span>" : "") +
          '<span class="tag">' + esc(n.tag || "?") + "</span>" +
          (n.stale ? '<span class="tag warn">proto edited since</span>' : "") +
          '<span class="id">' + esc((n.id || "").slice(0, 8)) + "</span>" +
        "</div>" +
      "</div>";
    return el;
  }

  /* Load a proto only when its card is near the viewport. Twenty protos
     booting at once is twenty protos running their own JS. */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var f = e.target.querySelector("iframe[data-src]");
      if (f) { f.src = f.getAttribute("data-src"); f.removeAttribute("data-src"); }
      io.unobserve(e.target);
    });
  }, { rootMargin: "300px" });

  /* Live from the server when there is one, otherwise from the committed
     manifest. The notes are static files either way; the only thing a static
     host cannot do is list a directory and say which folders have a store,
     which is exactly what notes.json answers. */
  function load() {
    return fetch("/_notes", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () {
        return fetch(ROOT + "tools/annotate/notes.json", { cache: "no-store" })
          .then(function (r) { return r.json(); });
      });
  }

  load()
    .then(function (d) {
      var notes = d.notes || [];
      var out = document.getElementById("out");
      if (!notes.length) {
        out.className = "empty";
        out.textContent = "No annotations yet. Open a proto and press Shift+C.";
        document.getElementById("count").textContent = "";
        return;
      }
      var stale = notes.filter(function (n) { return n.stale; }).length;
      document.getElementById("count").textContent =
        notes.length + (notes.length === 1 ? " note" : " notes") +
        (stale ? "  ·  " + stale + " on an edited proto" : "");

      var by = {};
      notes.forEach(function (n) {
        var k = (n.proto || "").replace(/\/[^/]*$/, "");
        (by[k] = by[k] || []).push(n);
      });

      out.className = "";
      out.innerHTML = "";
      Object.keys(by).sort().forEach(function (k) {
        var g = document.createElement("div");
        g.className = "group";
        g.innerHTML = "<h2>" + esc(k) + "</h2>";
        var grid = document.createElement("div");
        grid.className = "grid";
        by[k].forEach(function (n, i) {
          var c = card(n, i);
          grid.appendChild(c);
          io.observe(c);
        });
        g.appendChild(grid);
        out.appendChild(g);
      });
      var spacer = document.createElement("div");
      spacer.style.height = "40px";
      out.appendChild(spacer);
    })
    .catch(function () {
      var out = document.getElementById("out");
      out.className = "empty";
      out.innerHTML = "No notes found. Annotate a proto, or run " +
                      "<code>python3 tools/annotate/serve.py</code> to read them live.";
    });
})();
</script>
</body>
</html>
