  };

  /* ------------------------------------------------------------------- serialize */

  function q(s) {
    return "'" + String(s == null ? '' : s)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '')
      .replace(/\n/g, '\\n')
      // `<\/` is the same character as `</` to JS, but it does not close the inlined
      // script element the spec lives in — and render.py refuses to inline a literal
      // closing script tag at all. Without this, typing one into a wire label produced a
      // save file its own renderer would not take back. Deliberately narrow: `</b>` and
      // friends are untouched, so an export still reads like a hand-authored spec.
      .replace(/<\/(\s*script)/gi, '<\\/$1') + "'";
  }

  function num(v) {
    var n = Number(v);
    if (!isFinite(n)) return '0';
    return (Math.round(n) === n) ? String(Math.round(n)) : String(Math.round(n * 100) / 100);
  }

  function pairs(list) { return '{ ' + list.join(', ') + ' }'; }
  function has(v) { return v !== undefined && v !== null && v !== '' && v !== false; }

  function laneLine(l) {
    var p = ['id: ' + q(l.id)];
    if (has(l.label)) p.push('label: ' + q(l.label));
    if (l.y === 'center') p.push("y: 'center'");                 // not a pixel — pass it through
    else if (has(l.y) && Number(l.y) !== metaNum('padY')) p.push('y: ' + num(l.y));
    if (has(l.gap) && Number(l.gap) !== metaNum('laneGap')) p.push('gap: ' + num(l.gap));
    if (has(l.w)) p.push('w: ' + num(l.w));
    if (has(l.align) && l.align !== 'left') p.push('align: ' + q(l.align));
    return pairs(p);
  }

  function frameLine(f) {
    var p = ['id: ' + q(f.id)];
    if (has(f.label)) p.push('label: ' + q(f.label));
    var ids = (f.nodes || []).map(function (n) { return q(n); });
    p.push('nodes: [' + ids.join(', ') + ']');
    if (has(f.color) && f.color !== 'orange') p.push('color: ' + q(f.color));
    // A PARTIAL pad is legal — layout.js defaults each missing key on its own — so only
    // the keys that are actually there and actually differ are written. Writing all three
    // through num() turned an absent key into a literal 0, and re-rendering the export
    // then lost that side's clearance (30px of caption room, silently, on every export).
    if (f.pad) {
      var dflt = MMLayout.DEFAULTS.framePad;
      var pd = [], pk = ['x', 'top', 'bottom'], i;
      for (i = 0; i < pk.length; i++) {
        var v = f.pad[pk[i]];
        if (v === undefined || v === null || v === '') continue;
        if (Number(v) === dflt[pk[i]]) continue;
        pd.push(pk[i] + ': ' + num(v));
      }
      if (pd.length) p.push('pad: { ' + pd.join(', ') + ' }');
    }
    return pairs(p);
  }

  // A text row whose key EXISTS is written even when it is empty: the key is what makes
  // build() render the row, so dropping an emptied '' would delete the row for good and
  // leave nothing in the browser to type back into.
  function kept(v) { return typeof v === 'string'; }

  function nodeLine(n) {
    var p = ['id: ' + q(n.id), 'lane: ' + q(n.lane), 'kind: ' + q(n.kind)];
    if (has(n.n)) p.push('n: ' + q(n.n));
    if (kept(n.title)) p.push('title: ' + q(n.title));
    if (kept(n.body)) p.push('body: ' + q(n.body));
    if (kept(n.rw)) p.push('rw: ' + q(n.rw));
    if (has(n.w)) p.push('w: ' + num(n.w));
    if (has(n.gapBefore) && Number(n.gapBefore) !== metaNum('rowGap')) p.push('gapBefore: ' + num(n.gapBefore));
    if (has(n.alignWith)) p.push('alignWith: ' + q(n.alignWith));
    if (n.pin) p.push('pin: { x: ' + Math.round(n.pin.x) + ', y: ' + Math.round(n.pin.y) + ' }');
    return pairs(p);
  }

  function edgeLine(e) {
    var p = ['f: ' + q(e.f), 't: ' + q(e.t), 'c: ' + q(e.c)];
    if (has(e.l)) p.push('l: ' + q(e.l));
    if (e.dash) p.push('dash: 1');
    if (has(e.side)) p.push('side: ' + q(e.side));
    if (has(e.bulge) && Number(e.bulge) !== defBulge(e)) p.push('bulge: ' + num(e.bulge));
    if (e.labelAbove) p.push('labelAbove: 1');
    return pairs(p);
  }

  function block(name, items, fn, last) {
    var out = [], i;
    if (!items.length) { out.push('  ' + name + ': []' + (last ? '' : ',')); return out; }
    out.push('  ' + name + ': [');
    for (i = 0; i < items.length; i++) out.push('    ' + fn(items[i]) + (i === items.length - 1 ? '' : ','));
    out.push('  ]' + (last ? '' : ','));
    return out;
  }

  // NODES grouped by lane in LANES order, DECLARATION order within a lane.
  // (It used to sort by visual top. Dragging pins a node without changing its slot, so
  // the visual order of a pinned box says nothing about the flow — sorting on it only
  // reshuffled which node is "first in its lane", silently moving the gapBefore chain.)
  // Nodes whose lane no longer exists keep declaration order at the end.
  function orderedNodes() {
    var ls = lanes(), all = nodes(), out = [], seen = {}, i, j;
    for (i = 0; i < ls.length; i++) {
      for (j = 0; j < all.length; j++) {
        if (all[j].lane !== ls[i].id) continue;
        out.push(all[j]);
        seen[all[j].id] = 1;
      }
    }
    for (i = 0; i < all.length; i++) if (!seen[all[i].id]) out.push(all[i]);
    return out;
  }

  function today() {
    var d = new Date();
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function metaBlock() {
    var m = MM.spec.META || {}, out = [], keys, i, item, parts;
    out.push('  META: {');
    var line = [];
    line.push('    title: ' + q(m.title || ''));
    if (has(m.subtitle)) line.push('    subtitle: ' + q(m.subtitle));
    // hint is written whenever the KEY exists and differs from the default — '' included.
    // An author who deliberately suppressed the hint line had it dropped on export, and the
    // default text came back on the next render with no UI to remove it again.
    if (m.hint !== undefined && m.hint !== null && m.hint !== metaDefault('hint')) {
      line.push('    hint: ' + q(m.hint));
    }
    keys = ['laneGap', 'rowGap', 'padX', 'padY', 'maxWidth'];
    var legendLines = null;
    if (m.legend && m.legend.length) {
      legendLines = ['    legend: ['];
      for (i = 0; i < m.legend.length; i++) {
        item = m.legend[i];
        // a legend row is either a wire colour (`c`) or a node kind (`k`) — writing `c`
        // unconditionally turned every box swatch into `c: ''` on the first export
        parts = has(item.k) ? ['k: ' + q(item.k)] : ['c: ' + q(item.c)];
        if (has(item.label)) parts.push('label: ' + q(item.label));
        if (item.dash) parts.push('dash: true');
        legendLines.push('      ' + pairs(parts) + (i === m.legend.length - 1 ? '' : ','));
      }
      legendLines.push('    ]');
    }
    var tail = [];
    for (i = 0; i < keys.length; i++) {
      if (has(m[keys[i]]) && Number(m[keys[i]]) !== metaDefault(keys[i])) {
        tail.push('    ' + keys[i] + ': ' + num(m[keys[i]]));
      }
    }
    var all = line.slice();
    if (legendLines) all.push(legendLines.join('\n'));
    all = all.concat(tail);
    for (i = 0; i < all.length; i++) out.push(all[i] + (i === all.length - 1 ? '' : ','));
    out.push('  },');
    return out;
  }

  MMEditor.exportSpec = function () {
    if (!ready()) return '';
    MMEditor.syncFromDOM();
    var m = MM.spec.META || {}, frames = MM.spec.FRAMES || [];
    var out = [];
    // The title goes into a // comment, so any newline in it would push the rest of the
    // comment onto its own line as bare code — a syntax error that blanked the whole page,
    // silently, since render.py treats the spec as opaque text.
    var titleComment = String(m.title || 'untitled').replace(/[\r\n]+/g, ' ');
    out.push('// mindmap spec — ' + titleComment + ' — exported ' + today());
    out.push('window.MM_SPEC = {');
    out = out.concat(metaBlock());
    out = out.concat(block('LANES', lanes(), laneLine, false));
    if (frames.length) out = out.concat(block('FRAMES', frames, frameLine, false));
    out = out.concat(block('NODES', orderedNodes(), nodeLine, false));
    out = out.concat(block('EDGES', edges(), edgeLine, true));
    out.push('};');
    return out.join('\n') + '\n';
  };

  MMEditor.copyToClipboard = function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
    }
    legacyCopy(text);
  };

  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { /* clipboard is a convenience, never a blocker */ }
  }

  MMEditor.download = function (filename) {
    if (!ready()) return;
    var text = MMEditor.exportSpec();
    var name = filename || cfg.filename || 'spec.js';
    try {
      var blob = new Blob([text], { type: 'text/javascript' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      if (window.console) console.error('[mindmap] download failed', e);
    }
    MMEditor.copyToClipboard(text);
    flash('Exported ' + name + ' · also copied to clipboard');
  };

  /* ------------------------------------------------------- editing on/off */

  MMEditor.setEditable = function (on) {
    cfg.editable = !!on;
    document.body.classList.toggle('mm-editing', cfg.editable);
    // "E for a clean screenshot" means the toolbar and the drag hint go too, not just the
    // affordances on the boxes. engine.css already had the whole screenshot-mode block
    // hanging off body.editing-off; nothing was ever setting the class.
    document.body.classList.toggle('editing-off', !cfg.editable);
    if (!cfg.editable) {
      MMEditor.toggleConnect(false);
      selectEdge(null);
      selectNode(null);
      hideBar();
    }
    decorate();
    syncExtraButtons();
  };

  function selectEdge(i) { MMEditor.selectEdge(i); }

  /* ------------------------------------------------------------- toolbar */

  function mkBtn(id, label, title, handler) {
    var b = document.createElement('button');
    b.type = 'button';
    b.id = id;
    b.className = 'mm-btn';
    b.setAttribute('data-mm-extra', '1');
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', handler);
    return b;
  }

  function wireToolbar() {
    var tb = $('mm-toolbar');
    var connect = $('mm-btn-connect'), relayout = $('mm-btn-relayout'),
        clearpins = $('mm-btn-clearpins'), exportBtn = $('mm-btn-export');

    if (connect) connect.addEventListener('click', function () { MMEditor.toggleConnect(); });
    if (relayout) relayout.addEventListener('click', function () { MMEditor.syncFromDOM(); MM.redraw(); applySelection(); });
    if (clearpins) clearpins.addEventListener('click', function () {
      pushUndo(); MMLayout.clearAllPins(); MM.redraw(); applySelection();
    });
    if (exportBtn) exportBtn.addEventListener('click', function () { MMEditor.download(); });

    if (!tb || tb.querySelector('[data-mm-extra]')) return;
    tb.appendChild(mkBtn('mm-btn-addnode', '+ Node', 'add a node below the selected one (N)', function () { MMEditor.addNode(); }));
    tb.appendChild(mkBtn('mm-btn-delnode', 'Delete node', 'delete the selected node and its edges (⌘/Ctrl+Delete)', function () { MMEditor.deleteNode(); }));
    tb.appendChild(mkBtn('mm-btn-undo', 'Undo', 'undo (⌘/Ctrl+Z)', function () { MMEditor.undo(); }));
    tb.appendChild(mkBtn('mm-btn-chrome', 'Editing off', 'hide edit chrome for a clean screenshot (E)', function () {
      MMEditor.setEditable(!cfg.editable);
    }));
    syncExtraButtons();
  }

  function syncExtraButtons() {
    var d = $('mm-btn-delnode');
    if (d) d.disabled = !state.selNode;
    var u = $('mm-btn-undo');
    if (u) u.disabled = !undoStack.length;
    var c = $('mm-btn-chrome');
    if (c) c.textContent = cfg.editable ? 'Editing off' : 'Editing on';
  }

  var flashEl = null;
  function flash(msg) {
    if (!flashEl) {
      flashEl = document.createElement('div');
      flashEl.id = 'mm-flash';
      flashEl.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);' +
        'background:#0A1925;color:#fff;font:600 11.5px system-ui,-apple-system,sans-serif;' +
        'padding:7px 14px;border-radius:8px;z-index:9999;pointer-events:none;opacity:0;' +
        'transition:opacity .18s ease';
      document.body.appendChild(flashEl);
    }
    flashEl.textContent = msg;
    flashEl.style.opacity = '1';
    clearTimeout(flashEl._t);
    flashEl._t = setTimeout(function () { flashEl.style.opacity = '0'; }, 2200);
  }

  /* ------------------------------------------------------------ svg clicks */

  function onSvgClick(ev) {
    var hit = ev.target.closest ? ev.target.closest('.mm-wire-hit, .mm-wire') : null;
    if (!hit) return;
    var i = parseInt(hit.getAttribute('data-edge'), 10);
    if (isNaN(i)) return;
    ev.stopPropagation();
    MMEditor.selectEdge(i);
  }

  /* ------------------------------------------------------------- keyboard */

  function onKeyDown(ev) {
    if (!ready()) return;
    // check the focused element too: a key event can be retargeted (or synthesised) at document
    var typing = isTyping(ev.target) || isTyping(document.activeElement);
    var meta = ev.metaKey || ev.ctrlKey;

    // A caret parked in a box's text used to swallow both of these — which is exactly
    // where "+ Node" leaves you, so the first Undo after adding a box was a dead key and
    // ⌘Delete could not remove the box you had just made. Inside one of OUR rows the
    // editor's own undo is the right one anyway (focusin snapshots once per editing
    // session); blur first so the typed text reaches the spec before it is rolled back.
    // A real <input> (the wire-label field) still keeps the browser's undo.
    var row = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest('.mm-t, .mm-d, .mm-rw') : null;

    if (meta && (ev.key === 'z' || ev.key === 'Z') && (!typing || row)) {
      ev.preventDefault();
      if (row && row.blur) row.blur();
      if (ev.shiftKey) MMEditor.redo(); else MMEditor.undo();
      return;
    }
    if (meta && (ev.key === 'Backspace' || ev.key === 'Delete')) {
      var host = row && row.closest ? row.closest('.mm-node') : null;
      var inSelected = host && host.getAttribute('data-id') === state.selNode;
      if (state.selNode && (!typing || inSelected)) {
        ev.preventDefault();
        if (row && row.blur) row.blur();
        MMEditor.deleteNode(state.selNode);
      }
      return;
    }
    if (ev.key === 'Escape') {
      var act = document.activeElement;
      if (typing && act && act.blur) { act.blur(); return; }
      if (state.connect && state.srcId) { setSrc(null); return; }
      if (state.connect) { MMEditor.toggleConnect(false); return; }
      MMEditor.selectEdge(null);
      selectNode(null);
      return;
    }
    if (typing || meta || ev.altKey) return;

    if (state.selEdge !== null) {
      var i = state.selEdge;
      switch (ev.key) {
        case 'Delete': case 'Backspace': ev.preventDefault(); MMEditor.deleteEdge(i); return;
        case 'd': MMEditor.toggleDash(i); return;
        case '[': MMEditor.cycleColor(i, -1); return;
        case ']': MMEditor.cycleColor(i, 1); return;
        case 's': MMEditor.cycleSide(i); return;
        case '-': case '_': MMEditor.nudgeBulge(i, -BULGE_STEP); return;
        case '=': case '+': MMEditor.nudgeBulge(i, BULGE_STEP); return;
        case 'a': MMEditor.toggleLabelAbove(i); return;
      }
    }
    if (ev.key === 'c' || ev.key === 'C') { MMEditor.toggleConnect(); return; }
    if (ev.key === 'e' || ev.key === 'E') { MMEditor.setEditable(!cfg.editable); return; }
    if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); MMEditor.addNode(); return; }
  }

  /* ------------------------------------------------------------------ init */

  MMEditor.init = function (opts) {
    if (!ready()) {
      if (window.console) console.warn('[mindmap] MMEditor.init: engine not ready — read-only');
      return;
    }
    opts = opts || {};
    if (opts.filename) cfg.filename = opts.filename;
    var editable = (opts.editable === undefined) ? true : !!opts.editable;

    if (inited) { MMEditor.setEditable(editable); return; }
    inited = true;

    // Selection styling has to survive every wire rebuild, including renders the
    // editor did not trigger (boot, resize, MM.redraw). One wrapper, applied once.
    if (!MMWires.__mmPatched) {
      var base = MMWires.render;
      MMWires.render = function () {
        base.apply(MMWires, arguments);
        if (inited) applySelection();
      };
      MMWires.__mmPatched = true;
    }

    buildBar();
    wireToolbar();

    MM.canvas.addEventListener('pointerdown', onPointerDown, false);
    MM.canvas.addEventListener('dblclick', onDblClick, false);
    MM.canvas.addEventListener('pointerover', onPointerOver, false);
    MM.canvas.addEventListener('focusin', onFocusIn, false);
    MM.canvas.addEventListener('focusout', onFocusOut, false);
    MM.canvas.addEventListener('input', onInput, false);
    MM.canvas.addEventListener('paste', onPaste, false);
    MM.svg.addEventListener('click', onSvgClick, false);
    document.addEventListener('keydown', onKeyDown, false);
    window.addEventListener('resize', function () { if (state.selEdge !== null) positionBar(); }, false);

    MMEditor.setEditable(editable);
  };

})();

</script>
<script>
window.MMBoot = function () {
  var errs = MMLayout.validate(window.MM_SPEC);
  if (errs.length) MMLayout.showErrors(errs);          // non-fatal; bad edges are skipped
  MMLayout.build(window.MM_SPEC, document.getElementById('mm-canvas'));
  MMLayout.layout();          // measure -> place -> size canvas -> place frames
  MMWires.render();           // draw svg from the LIVE spec
  MMEditor.init();            // attach handlers (no-op if editor.js absent)
};
document.addEventListener('DOMContentLoaded', function () {
  MMBoot();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { MMLayout.layout(); MMWires.render(); });
  }
  window.addEventListener('resize', function () { MMWires.render(); });
});
</script>
</body>
</html>
