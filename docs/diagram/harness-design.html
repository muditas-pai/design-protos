<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design harness — the design up for approval</title>
<style>
/* ===========================================================================
   mindmap engine — engine.css
   Ported from docs/specs/design-harness-diagram.html (the reference diagram).
   CSS owns: colour, radius, per-kind width, typography, border, shadow,
             editor affordances.
   JS owns:  every gap BETWEEN things (laneGap, rowGap, padX/padY, framePad,
             bulge, label offsets) — see MMLayout.DEFAULTS / MMWires.DEFAULTS.
   =========================================================================== */

/* ---------------------------------------------------------------- tokens -- */
:root {
  color-scheme: light;

  /* ink + surface */
  --mm-ink:        #0A1925;
  --mm-ink2:       #4A5B6A;
  --mm-ink3:       #8494B4;
  --mm-line:       #E1E7EC;
  --mm-paper:      #ffffff;

  /* solid accents (also the wire palette in MMWires.COLOR) */
  --mm-navy:       #1C3550;
  --mm-blue:       #0043B8;
  --mm-orange:     #E64A00;
  --mm-green:      #0E8A4D;
  --mm-red:        #C93A2B;
  --mm-violet:     #6B3FA0;
  --mm-gray:       #A6B3BE;

  /* tints — border (-bd) + fill (-bg) per accent */
  --mm-blue-bd:    #B9CFF3;   --mm-blue-bg:    #F7FAFF;
  --mm-violet-bd:  #C6B0E8;   --mm-violet-bg:  #FBF8FF;
  --mm-violet-bd2: #D6C4EE;
  --mm-red-bd:     #EFBDB5;   --mm-red-bg:     #FDF7F6;
  --mm-red-bd2:    #E4C9C4;
  --mm-green-bd:   #A9D8BC;   --mm-green-bg:   #F4FBF7;
  --mm-orange-bd:  #F3B79B;   --mm-orange-bg:  #FFF6F0;
  /* extras (frames may be tinted navy/gray; not used by any node kind) */
  --mm-navy-bd:    #B8C6D4;
  --mm-gray-bd:    #D6DDE3;

  /* geometry owned by CSS */
  --mm-radius:      10px;
  --mm-radius-frame:14px;
  --mm-node-pad:    9px 13px;
  --mm-w-narrow:    218px;   /* brief, file, note   */
  --mm-w-mid:       230px;   /* side, correct       */
  --mm-w-wide:      380px;   /* step/verify/judge/you/harvest */

  /* presentational gutters (page chrome only — NOT diagram spacing) */
  --mm-page-pad-x:  20px;
  --mm-page-pad-t:  32px;
  --mm-page-pad-b:  60px;
  --mm-legend-gap:  20px;
  --mm-bar-gap:     6px;

  /* type scale */
  --mm-font:  system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mm-mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --mm-fs-h1:      22px;
  --mm-fs-sub:     13px;
  --mm-fs-hint:    11.5px;
  --mm-fs-title:   12.5px;
  --mm-fs-body:    11px;
  --mm-fs-rw:      10px;
  --mm-fs-badge:   10px;
  --mm-fs-frame:   12px;
  --mm-fs-legend:  11.5px;
  --mm-fs-ui:      11.5px;

  /* shadows + affordance accents */
  --mm-shadow:      0 1px 3px rgba(10, 25, 37, .06);
  --mm-shadow-lift: 0 3px 10px rgba(10, 25, 37, .10);
  --mm-shadow-drag: 0 4px 14px rgba(10, 25, 37, .13);
  --mm-shadow-bar:  0 6px 22px rgba(10, 25, 37, .14);
  --mm-badge-ink:   #ffffff;
  --mm-focus:       #0043B8;
  --mm-ui-bg:       rgba(255, 255, 255, .90);
  --mm-ui-bd:       #E1E7EC;
  --mm-grip:        rgba(132, 148, 180, .55);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--mm-paper);
  color: var(--mm-ink);
  font-family: var(--mm-font);
}

[hidden] { display: none !important; }

/* ------------------------------------------------------------ page shell -- */
.mm-page {
  position: relative;
  max-width: 1340px;
  /* A canvas wider than max-width used to overflow the centred box, so `margin:0 auto`
     wasted a left gutter exactly as wide as the horizontal scroll it created.
     min-width beats max-width in CSS, so the page grows to hold the canvas instead. */
  min-width: fit-content;
  margin: 0 auto;
  padding: var(--mm-page-pad-t) var(--mm-page-pad-x) var(--mm-page-pad-b);
}

.mm-head { margin: 0 0 18px; }

#mm-title,
.mm-head h1 {
  font-size: var(--mm-fs-h1);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}

.mm-sub {
  color: var(--mm-ink2);
  font-size: var(--mm-fs-sub);
  line-height: 1.5;
  margin: 0 0 6px;
  max-width: 100ch;
}

.mm-hint {
  color: var(--mm-ink3);
  font-size: var(--mm-fs-hint);
  margin: 0;
}

.mm-head:has(.mm-hint:empty) { margin-bottom: 14px; }

/* ---------------------------------------------------------------- canvas -- */
.mm-canvas {
  position: relative;
  min-height: 560px;
  margin: 0 0 12px;
}

.mm-wires {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

/* Wire LABELS sit in their own layer above the boxes. Under them, any label wider
   than the lane gap was cut in half by whatever box it crossed — unreadable, and
   only discoverable by eye. The halo keeps them legible over anything. */
.mm-wire-labels {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 6;
}

/* ----------------------------------------------------------------- nodes -- */
.mm-node {
  position: absolute;
  z-index: 2;
  border-radius: var(--mm-radius);
  background: var(--mm-paper);
  border: 1.5px solid var(--mm-line);
  padding: var(--mm-node-pad);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: var(--mm-shadow);
}

.mm-node:active {
  cursor: grabbing;
  z-index: 5;
  box-shadow: var(--mm-shadow-drag);
}

/* text rows */
.mm-t {
  font-weight: 700;
  font-size: var(--mm-fs-title);
  line-height: 1.3;
  pointer-events: none;
}

.mm-d {
  font-size: var(--mm-fs-body);
  color: var(--mm-ink2);
  line-height: 1.45;
  margin-top: 2px;
  pointer-events: none;
}

.mm-rw {
  font-size: var(--mm-fs-rw);
  color: var(--mm-ink3);
  line-height: 1.4;
  margin-top: 4px;
  pointer-events: none;
}

.mm-t code, .mm-d code, .mm-rw code {
  font-family: var(--mm-mono);
  font-size: 0.94em;
}

/* step-number badge — spec-owned, never typed into (it sits inside the editable title) */
.mm-n {
  display: inline-block;
  background: var(--mm-navy);
  color: var(--mm-badge-ink);
  font-size: var(--mm-fs-badge);
  font-weight: 700;
  border-radius: 5px;
  padding: 1px 7px;
  margin-right: 7px;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

/* ------------------------------------------------------------ node kinds -- */
/* step — the plain numbered stage */
.mm-node.kind-step { width: var(--mm-w-wide); }

/* verify — mechanical / style check */
.mm-node.kind-verify {
  width: var(--mm-w-wide);
  border-color: var(--mm-red-bd);
  background: var(--mm-red-bg);
}
.mm-node.kind-verify .mm-n { background: var(--mm-red); }

/* judge — checks intent, not style */
.mm-node.kind-judge {
  width: var(--mm-w-wide);
  border-color: var(--mm-violet-bd2);
  background: var(--mm-violet-bg);
}
.mm-node.kind-judge .mm-n { background: var(--mm-violet); }

/* you / harvest — the human, and the write-back */
.mm-node.kind-you,
.mm-node.kind-harvest {
  width: var(--mm-w-wide);
  border: 2px solid var(--mm-orange);
  background: var(--mm-orange-bg);
}
.mm-node.kind-you .mm-t,
.mm-node.kind-harvest .mm-t { color: var(--mm-orange); }

/* brief — the input document */
.mm-node.kind-brief {
  width: var(--mm-w-narrow);
  border: 2px solid var(--mm-violet-bd);
  background: var(--mm-violet-bg);
}
.mm-node.kind-brief .mm-t {
  color: var(--mm-violet);
  font-size: var(--mm-fs-title);
}

/* file — something on disk */
.mm-node.kind-file {
  width: var(--mm-w-narrow);
  border-color: var(--mm-blue-bd);
  background: var(--mm-blue-bg);
}
.mm-node.kind-file .mm-t {
  color: var(--mm-blue);
  font-family: var(--mm-mono);
  font-size: 11.5px;
}

/* note — an aside; usually body-only */
.mm-node.kind-note {
  width: var(--mm-w-narrow);
  border-style: dashed;
  background: var(--mm-paper);
}

/* side — owned elsewhere / optional branch */
.mm-node.kind-side {
  width: var(--mm-w-mid);
  border-color: var(--mm-green-bd);
  background: var(--mm-green-bg);
}
.mm-node.kind-side .mm-t { color: var(--mm-green); }

/* correct — the retry loop */
.mm-node.kind-correct {
  width: var(--mm-w-mid);
  border: 2px solid var(--mm-red-bd2);
  background: var(--mm-red-bg);
}
.mm-node.kind-correct .mm-t { color: var(--mm-red); }

/* ---------------------------------------------------------------- frames -- */
.mm-frame {
  position: absolute;
  z-index: 1;
  border: 2px solid var(--mm-orange-bd);
  border-radius: var(--mm-radius-frame);
  pointer-events: none;
}

.mm-frame-label {
  position: absolute;
  z-index: 1;
  font-size: var(--mm-fs-frame);
  font-weight: 700;
  color: var(--mm-orange);
  background: var(--mm-paper);
  padding: 0 8px;
  white-space: nowrap;
  pointer-events: none;
}

.mm-frame[data-color="navy"]   { border-color: var(--mm-navy-bd); }
.mm-frame[data-color="blue"]   { border-color: var(--mm-blue-bd); }
.mm-frame[data-color="orange"] { border-color: var(--mm-orange-bd); }
.mm-frame[data-color="green"]  { border-color: var(--mm-green-bd); }
.mm-frame[data-color="red"]    { border-color: var(--mm-red-bd); }
.mm-frame[data-color="violet"] { border-color: var(--mm-violet-bd); }
.mm-frame[data-color="gray"]   { border-color: var(--mm-gray-bd); }

.mm-frame-label[data-color="navy"]   { color: var(--mm-navy); }
.mm-frame-label[data-color="blue"]   { color: var(--mm-blue); }
.mm-frame-label[data-color="orange"] { color: var(--mm-orange); }
.mm-frame-label[data-color="green"]  { color: var(--mm-green); }
.mm-frame-label[data-color="red"]    { color: var(--mm-red); }
.mm-frame-label[data-color="violet"] { color: var(--mm-violet); }
.mm-frame-label[data-color="gray"]   { color: var(--mm-ink2); }

/* ----------------------------------------------------------------- wires -- */
/* stroke / fill come from inline attributes written by wires.js; CSS only
   adds behaviour + state, and re-points the label halo at the page surface. */
.mm-wire {
  fill: none;
  stroke-linecap: round;
  pointer-events: none;
}

.mm-wire-label {
  stroke: var(--mm-paper);          /* the halo — follows the surface in dark mode */
  paint-order: stroke;
  pointer-events: none;
  user-select: none;
}

.mm-wire-hit {
  fill: none;
  stroke: transparent;
  cursor: pointer;
}

.mm-wire-layer,
.mm-label-layer { pointer-events: none; }

.mm-hit-layer { pointer-events: none; }
body.mm-editing .mm-hit-layer { pointer-events: auto; }

/* ==========================================================================
   EDITING AFFORDANCES
   Everything below is chrome. It exists only while body.mm-editing is set,
   and is switched off wholesale by body.editing-off (screenshot mode).
   Rule of thumb: nothing appears until you hover or select.
   ========================================================================== */

/* --- draggable signal: a quiet lift + a grip dot-grid on hover ------------ */
body.mm-editing .mm-node {
  transition: box-shadow .12s ease, border-color .12s ease;
}

body.mm-editing .mm-node:hover {
  box-shadow: var(--mm-shadow-lift);
}

body.mm-editing .mm-node::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 6px;
  width: 9px;
  height: 11px;
  opacity: 0;
  transition: opacity .12s ease;
  pointer-events: none;
  background-image: radial-gradient(var(--mm-grip) 42%, transparent 44%);
  background-size: 4px 4px;
  background-position: 0 0;
}

body.mm-editing .mm-node:hover::after { opacity: 1; }

/* --- pinned: a small dot in the top-left corner --------------------------- */
body.mm-editing .mm-node.is-pinned::before {
  content: "";
  position: absolute;
  top: -3px;
  left: -3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mm-orange);
  box-shadow: 0 0 0 2px var(--mm-paper);
  pointer-events: none;
}

/* --- text editing: hover hint, then a soft focus ring -------------------- */
body.mm-editing .mm-t,
body.mm-editing .mm-d,
body.mm-editing .mm-rw {
  pointer-events: auto;
  border-radius: 4px;
  outline: none;
}

body.mm-editing [contenteditable="true"]:hover {
  box-shadow: inset 0 0 0 1px var(--mm-line);
}

/* An emptied row collapses to zero height and becomes unclickable — give it a target
   back. Pseudo-element content is not in the DOM, so it never reaches the spec. */
body.mm-editing [contenteditable="true"]:empty::before {
  content: "…";
  color: var(--mm-ink3);
  opacity: .5;
}

/* The row being edited is the ONLY contenteditable one (double-click turns it on), so it
   has to opt back out of the node's user-select:none or the caret cannot select anything. */
body.mm-editing [contenteditable="true"] {
  cursor: text;
  user-select: text;
  -webkit-user-select: text;
}

body.mm-editing [contenteditable="true"]:focus {
  box-shadow: inset 0 0 0 1.5px var(--mm-focus);
  background: color-mix(in srgb, var(--mm-focus) 5%, transparent);
}

/* --- connect mode: crosshair, source ring, target ring -------------------- */
body.mm-connect .mm-node { cursor: crosshair; }

/* clicks must reach the node, not the caret, while wiring */
body.mm-connect .mm-t,
body.mm-connect .mm-d,
body.mm-connect .mm-rw { pointer-events: none; }

body.mm-connect .mm-node:hover,
.mm-node.is-hover-target {
  box-shadow: 0 0 0 2px var(--mm-green), var(--mm-shadow-lift);
}

.mm-node.is-src,
body.mm-connect .mm-node.is-src:hover {
  box-shadow: 0 0 0 2px var(--mm-blue), var(--mm-shadow-lift);
}

/* --- wire selection ------------------------------------------------------- */
.mm-wire.is-selected {
  stroke-width: 4;
  filter: drop-shadow(0 0 4px rgba(0, 67, 184, .35));
}

.mm-wire-hit.is-selected { stroke: rgba(0, 67, 184, .08); }

body.mm-editing .mm-wire-hit:hover { stroke: rgba(10, 25, 37, .05); }

/* --- toolbar (in flow, above the canvas) ---------------------------------- */
/* It used to be position:fixed in the top-right corner. On a 1650px-tall canvas
   that parked a 670px bar permanently over the diagram: scroll down and it washed
   out whatever was behind it, and hovering it hid that content completely. */
.mm-toolbar {
  position: relative;
  z-index: 60;
  display: flex;
  flex-wrap: wrap;
  gap: var(--mm-bar-gap);
  margin: 0 0 14px;
  padding: 5px;
  border: 1px solid var(--mm-ui-bd);
  border-radius: 9px;
  background: var(--mm-ui-bg);
  box-shadow: var(--mm-shadow);
  width: fit-content;
  opacity: .75;
  transition: opacity .15s ease, box-shadow .15s ease;
}

.mm-toolbar:hover,
.mm-toolbar:focus-within {
  opacity: 1;
  box-shadow: var(--mm-shadow-bar);
}

.mm-btn {
  font-family: inherit;
  font-size: var(--mm-fs-ui);
  font-weight: 600;
  line-height: 1;
  color: var(--mm-ink2);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}

.mm-btn:hover {
  color: var(--mm-ink);
  background: color-mix(in srgb, var(--mm-ink) 6%, transparent);
}

.mm-btn:focus-visible {
  outline: 2px solid var(--mm-focus);
  outline-offset: 1px;
}

.mm-btn[aria-pressed="true"],
.mm-btn.is-on {
  color: var(--mm-blue);
  border-color: var(--mm-blue-bd);
  background: var(--mm-blue-bg);
}

.mm-btn-primary {
  color: var(--mm-paper);
  background: var(--mm-navy);
}

.mm-btn-primary:hover {
  color: var(--mm-paper);
  background: color-mix(in srgb, var(--mm-navy) 85%, #000);
}

/* --- edge-style bar (floated next to the selected wire by editor.js) ------ */
#mm-edge-bar {
  position: absolute;
  z-index: 70;
  display: flex;
  align-items: center;
  gap: var(--mm-bar-gap);
  padding: 5px 6px;
  border: 1px solid var(--mm-ui-bd);
  border-radius: 8px;
  background: var(--mm-ui-bg);
  backdrop-filter: saturate(150%) blur(6px);
  -webkit-backdrop-filter: saturate(150%) blur(6px);
  box-shadow: var(--mm-shadow-bar);
  font-size: var(--mm-fs-ui);
  color: var(--mm-ink2);
}

#mm-edge-bar .mm-btn { padding: 4px 8px; }

#mm-edge-bar input[type="text"] {
  font-family: inherit;
  font-size: var(--mm-fs-ui);
  color: var(--mm-ink);
  background: var(--mm-paper);
  border: 1px solid var(--mm-line);
  border-radius: 6px;
  padding: 4px 7px;
  min-width: 150px;
}

#mm-edge-bar input[type="text"]:focus-visible {
  outline: 2px solid var(--mm-focus);
  outline-offset: 0;
}

/* the current wire colour, between the ◀ ▶ cycler buttons (#mm-eb-swatch) */
#mm-edge-bar .mm-chip {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid rgba(10, 25, 37, .12);
}

/* --- validation banner ---------------------------------------------------- */
#mm-errors {
  margin: 0 0 14px;
  padding: 10px 13px;
  border: 1.5px solid var(--mm-red-bd);
  border-radius: 8px;
  background: var(--mm-red-bg);
  color: var(--mm-red);
  font-size: 12px;
  line-height: 1.5;
}

#mm-errors ul { margin: 4px 0 0; padding-left: 18px; }
#mm-errors li { font-family: var(--mm-mono); font-size: 11px; }

/* ---------------------------------------------------------------- legend -- */
.mm-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--mm-legend-gap);
  margin-top: 10px;
  font-size: var(--mm-fs-legend);
  color: var(--mm-ink2);
}

.mm-legend-item,
.mm-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.mm-sw {
  display: block;
  width: 20px;
  border-top: 3px solid;
  flex: 0 0 auto;
}

.mm-sw.dash {
  border-top-style: dashed;
  border-top-width: 2px;
}

/* box swatch — a legend entry for a node KIND rather than a wire colour, so the
   loud boxes on the canvas (the human call, the thing owned elsewhere) get a key
   too. Mirrors the kind borders/fills above; the reference carried four of these. */
.mm-bx {
  display: block;
  width: 19px;
  height: 13px;
  flex: 0 0 auto;
  border: 1.5px solid var(--mm-line);
  border-radius: 3px;
  background: var(--mm-paper);
}

.mm-bx.kind-verify  { border-color: var(--mm-red-bd);     background: var(--mm-red-bg); }
.mm-bx.kind-judge   { border-color: var(--mm-violet-bd2); background: var(--mm-violet-bg); }
.mm-bx.kind-you,
.mm-bx.kind-harvest { border-color: var(--mm-orange);     background: var(--mm-orange-bg); }
.mm-bx.kind-brief   { border-color: var(--mm-violet-bd);  background: var(--mm-violet-bg); }
.mm-bx.kind-file    { border-color: var(--mm-blue-bd);    background: var(--mm-blue-bg); }
.mm-bx.kind-note    { border-style: dashed; }
.mm-bx.kind-side    { border-color: var(--mm-green-bd);   background: var(--mm-green-bg); }
.mm-bx.kind-correct { border-color: var(--mm-red-bd2);    background: var(--mm-red-bg); }

/* ==========================================================================
   SCREENSHOT / PRINT MODE — body.editing-off strips every affordance so the
   page looks exactly like the hand-authored reference.
   ========================================================================== */
body.editing-off .mm-toolbar,
body.editing-off #mm-edge-bar,
body.editing-off .mm-hint,
body.editing-off #mm-errors { display: none !important; }

body.editing-off .mm-node { cursor: default; box-shadow: var(--mm-shadow); }
body.editing-off .mm-node:hover { box-shadow: var(--mm-shadow); }
body.editing-off .mm-node::after,
body.editing-off .mm-node::before { display: none !important; }

body.editing-off .mm-node.is-src,
body.editing-off .mm-node.is-hover-target { box-shadow: var(--mm-shadow); }

body.editing-off .mm-t,
body.editing-off .mm-d,
body.editing-off .mm-rw {
  pointer-events: none;
  box-shadow: none !important;
  background: none !important;
}

body.editing-off .mm-wire.is-selected { stroke-width: 2.5; filter: none; }
body.editing-off .mm-wire-hit,
body.editing-off .mm-wire-hit.is-selected { stroke: transparent !important; }

@media print {
  :root { color-scheme: light; }
  body { background: #fff; }
  .mm-toolbar, #mm-edge-bar, #mm-errors { display: none !important; }
  .mm-node { box-shadow: none; }
  .mm-page { padding-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ==========================================================================
   DARK MODE
   Only surfaces, tints and the wire palette are remapped — the light
   appearance above is untouched. Wire strokes and marker fills are written
   as inline attributes by wires.js, so they are re-pointed here by matching
   on the literal hex.
   ========================================================================== */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;

    --mm-ink:        #E8EEF4;

<script>
/* mindmap engine — layout.js
   window.MMLayout : DOM build, measurement, lane placement, frames, validation.
   Knows nothing about wires or editing. Assigns exactly one global, touches no DOM at load time. */

(function () {
  'use strict';

  var DEFAULTS = {
    laneGap: 120,
    rowGap: 28,
    padX: 24,
    padY: 24,
    minW: 900,
    minH: 560,
    hint: 'Drag any box to move it — connections follow. Double-click its text to edit.',
    framePad: { x: 16, top: 30, bottom: 16 },
    frameLabelDy: 40,
    frameLabelDx: 2
  };

  // Informational only — engine.css is authoritative for widths.
  var KINDS = {
    step: { w: 380 }, verify: { w: 380 }, judge: { w: 380 }, you: { w: 380 }, harvest: { w: 380 },
    brief: { w: 218 }, file: { w: 218 }, note: { w: 218 },
    side: { w: 230 }, correct: { w: 230 }
  };

  // Local copy so layout.js never depends on wires.js loading first; MMWires wins if present.
  var COLOR_KEYS = ['navy', 'orange', 'green', 'blue', 'red', 'violet', 'gray'];
  var MIN_LANE_W = 40;
  var ID_RE = /^[A-Za-z0-9_-]+$/;

  var _measured = {};   // nodeId -> { w, h }
  var _warnedAlign = {};   // nodeId -> 1, so a bad alignWith warns once, not once per frame
  var _needs = {};      // nodeId -> { left, top } room the drawing needs outside the box
  var ZERO_NEED = { left: 0, top: 0 };

  /* ---------------------------------------------------------------- helpers */

  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }

  function colorKeys() {
    return (window.MMWires && window.MMWires.COLOR) ? Object.keys(window.MMWires.COLOR) : COLOR_KEYS;
  }

  function escText(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var ALLOWED_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, CODE: 1, BR: 1 };

  // Inline-HTML allowlist: b/strong/i/em/code/br, no attributes; anything else collapses to its text.
  function walk(node) {
    var out = '';
    for (var c = node.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) {
        out += escText(c.nodeValue);
      } else if (c.nodeType === 1) {
        var tag = c.tagName;
        if (ALLOWED_TAGS[tag]) {
          var lower = tag.toLowerCase();
          out += (lower === 'br') ? '<br>' : '<' + lower + '>' + walk(c) + '</' + lower + '>';
        } else {
          out += walk(c);
        }
      }
    }
    return out;
  }

  function san(html) {
    if (html === undefined || html === null || html === '') return '';
    var box = document.createElement('div');
    box.innerHTML = String(html);
    return walk(box);
  }

  function setHTML(el, html) { if (el) el.innerHTML = san(html); }

  /* --------------------------------------------------------------- validate */

  function validate(spec) {
    var errs = [];
    if (!spec || typeof spec !== 'object') return ['spec is missing — window.MM_SPEC is not an object'];

    var meta = spec.META || {};
    if (!meta.title) errs.push('META.title is required');

    var lanes = spec.LANES || [];
    if (!lanes.length) errs.push('LANES is empty — at least one lane is required');
    var laneSeen = {};
    lanes.forEach(function (ln, i) {
      if (!ln || !ln.id) { errs.push('LANES[' + i + '] has no id'); return; }
      if (laneSeen[ln.id]) errs.push('duplicate lane id "' + ln.id + '"');
      laneSeen[ln.id] = 1;
      if (ln.align && ln.align !== 'left' && ln.align !== 'center') {
        errs.push('lane "' + ln.id + '" has align "' + ln.align + '" (expected left|center)');
      }
    });

    var nodes = spec.NODES || [];
    var nodeSeen = {}, alignRefs = [];
    nodes.forEach(function (n, i) {
      if (!n || !n.id) { errs.push('NODES[' + i + '] has no id'); return; }
      if (!ID_RE.test(n.id)) errs.push('node id "' + n.id + '" is not [A-Za-z0-9_-]+');
      if (nodeSeen[n.id]) errs.push('duplicate node id "' + n.id + '"');
      nodeSeen[n.id] = 1;
      if (!n.lane) errs.push('node "' + n.id + '" has no lane');
      else if (!laneSeen[n.lane]) errs.push('node "' + n.id + '" refers to unknown lane "' + n.lane + '"');
      if (!n.kind) errs.push('node "' + n.id + '" has no kind');
      else if (!KINDS[n.kind]) errs.push('node "' + n.id + '" has unknown kind "' + n.kind + '"');
      if (n.pin && (typeof n.pin.x !== 'number' || typeof n.pin.y !== 'number')) {
        errs.push('node "' + n.id + '" has a malformed pin (expected {x,y} numbers)');
      }
      if (n.alignWith !== undefined) alignRefs.push([n.id, n.alignWith]);
    });
    alignRefs.forEach(function (p) {
      if (!nodeSeen[p[1]]) errs.push('node "' + p[0] + '" aligns with unknown node "' + p[1] + '"');
      else if (p[1] === p[0]) errs.push('node "' + p[0] + '" aligns with itself');
    });

    var keys = colorKeys();
    (spec.EDGES || []).forEach(function (e, i) {
      if (!e || !e.f || !e.t) { errs.push('EDGES[' + i + '] is missing f or t'); return; }
      if (!nodeSeen[e.f]) errs.push('edge ' + i + ' (' + e.f + ' → ' + e.t + ') has unknown source "' + e.f + '"');
      if (!nodeSeen[e.t]) errs.push('edge ' + i + ' (' + e.f + ' → ' + e.t + ') has unknown target "' + e.t + '"');
      if (!e.c) errs.push('edge ' + i + ' (' + e.f + ' → ' + e.t + ') has no colour');
      else if (keys.indexOf(e.c) === -1) {
        errs.push('edge ' + i + ' (' + e.f + ' → ' + e.t + ') has unknown colour "' + e.c + '"');
      }
    });

    var frameSeen = {};
    (spec.FRAMES || []).forEach(function (f, i) {
      if (!f || !f.id) { errs.push('FRAMES[' + i + '] has no id'); return; }
      if (frameSeen[f.id]) errs.push('duplicate frame id "' + f.id + '"');
      frameSeen[f.id] = 1;
      if (!f.nodes || !f.nodes.length) { errs.push('frame "' + f.id + '" has no nodes'); return; }
      f.nodes.forEach(function (id) {
        if (!nodeSeen[id]) errs.push('frame "' + f.id + '" refers to unknown node "' + id + '"');
      });
    });

    return errs;
  }

  function showErrors(errs) {
    var box = document.getElementById('mm-errors');
    if (!box || !errs || !errs.length) return;
    var html = '<strong>' + errs.length + ' spec problem' + (errs.length === 1 ? '' : 's') + '</strong><ul>';
    for (var i = 0; i < errs.length; i++) html += '<li>' + escText(errs[i]) + '</li>';

    box.removeAttribute('hidden');

  /* ------------------------------------------------------------------ build */

  function buildNodeEl(n) {
    var el = document.createElement('div');
    el.className = 'mm-node kind-' + n.kind + (n.pin ? ' is-pinned' : '');
    el.id = 'n-' + n.id;
    el.setAttribute('data-id', n.id);
    el.setAttribute('data-kind', n.kind);
    el.setAttribute('data-lane', n.lane);
    if (n.pin) el.setAttribute('data-pinned', '1');
    if (typeof n.w === 'number') el.style.width = n.w + 'px';

    var html = '';
    // A row exists when its KEY exists — including an empty string. Omitting on '' made an
    // emptied row unrecoverable in the browser (no element left to type back into).
    var hasN = (n.n !== undefined && n.n !== '' && n.n !== null);
    if (n.title !== undefined || hasN) {
      html += '<div class="mm-t" data-field="title">';
      // contenteditable=false so the caret cannot enter the badge and Home+type cannot corrupt it
      if (hasN) html += '<span class="mm-n" data-field="n" contenteditable="false">' + escText(n.n) + '</span>';
      html += san(n.title) + '</div>';
    }
    if (n.body !== undefined) html += '<div class="mm-d" data-field="body">' + san(n.body) + '</div>';

  function buildLegend(meta) {

      // Without the box form the loudest things on the canvas had no key at all.
      var sw = (it.k && KINDS[it.k])

  }

  function build(spec, canvasEl) {
    var canvas = canvasEl || document.getElementById('mm-canvas');
    if (!canvas) throw new Error('MMLayout.build: #mm-canvas not found');
    var svg = document.getElementById('mm-wires');
    var svgLabels = document.getElementById('mm-wire-labels');   // may be absent (old template)

    // Idempotent: wipe everything we previously injected, keep the two wire svgs.
    var kids = Array.prototype.slice.call(canvas.children);

    var meta = spec.META || {};

    var hintEl = document.getElementById('mm-hint');

    var frameEls = {};

      band.id = 'f-' + f.id;
      band.setAttribute('data-frame', f.id);
      band.setAttribute('data-color', col);

      var label = null;
      if (f.label) {
        label = document.createElement('div');

        label.setAttribute('data-color', col);

  /* ---------------------------------------------------------------- measure */

  // Heights are always read from the live DOM — never assumed — so text length can never
  // force the author to retune a position. offsetWidth/offsetHeight (not getBoundingClientRect)
  // so measurement and rectOf() agree exactly and wires land on the painted border.
  function measure() {
    var MM = window.MM;
    if (!MM) return;
    _measured = {};
    for (var id in MM.nodeEl) {

      var el = MM.nodeEl[id];

  function mw(id) { return (_measured[id] && _measured[id].w) || 0; }
  function mh(id) { return (_measured[id] && _measured[id].h) || 0; }

  /* --------------------------------------------------- gutters and overhang */

  // Wire geometry lives in wires.js, but the CANVAS is layout's to size, and a U-turn
  // wire is drawn outside the node bounding box. Without reserving room for it a
  // `side:'left'` loop lands at negative x — off the left edge of the document, where
  // the browser cannot scroll — and a `side:'right'` loop is cut off at the canvas edge.
  // Reading MMWires.DEFAULTS is a constant lookup, not a call; layout still works alone.
  function bulgeDefaults() {
    var W = (window.MMWires && window.MMWires.DEFAULTS) || null;
    return { bulge: W ? W.bulge : 40, bulgeSide: W ? W.bulgeSide : 52 };
  }

  function bulgeOf(e, D) {
    var b = (e.bulge !== undefined) ? e.bulge : (e.side ? D.bulgeSide : D.bulge);
    return isFinite(b) ? b : D.bulge;

  // half the rendered width of an SVG wire label (text-anchor:middle, ~10.5px semibold)
  function halfLabel(s) { return s ? 6 + String(s).length * 3 : 0; }

  // where a labelAbove caption is centred across its source box — mirrors MMWires.labelPos
  function aboveFrac(e) { return (e.side === 'left') ? 0.18 : (e.side === 'right') ? 0.82 : 0.72; }

  // Room each node needs OUTSIDE its own box, to the left of it and above it: a
  // `side:'left'` U-turn plus its label, a `labelAbove` caption, and the band + caption
  // of any frame the node belongs to. Depends only on the spec and the label text —
  // never on where anything currently sits, and never on what is pinned. That is what
  // makes the gutter below immune to dragging.
  function needs(spec) {
    var D = bulgeDefaults();
    var out = {};
    function want(id, left, top) {
      var e = out[id];
      if (!e) return;
      if (left > e.left) e.left = left;
      if (top > e.top) e.top = top;
    }
    (spec.NODES || []).forEach(function (n) { if (n && n.id) out[n.id] = { left: 0, top: 0 }; });

    (spec.EDGES || []).forEach(function (e) {
      if (!e || !out[e.f] || !out[e.t]) return;
      if (e.side === 'left') {
        // the U-turn's control points reach `bulge` left of the leftmost anchor, and the
        // label is centred a little further out again
        var room = bulgeOf(e, D) + (e.labelAbove ? 0 : 4 + halfLabel(e.l));
        want(e.f, room, 0);
        want(e.t, room, 0);
      }
      if (e.labelAbove) {
        // The caption is centred at a.x + a.w*frac with text-anchor:middle, so half of it
        // hangs to the LEFT of that point — on a narrow box at the left edge of the
        // diagram that half was drawn at negative document x, where nothing scrolls.
        // (Rule 7 named labelAbove but only ever reserved the 22px above it.)
        want(e.f, Math.max(0, halfLabel(e.l) - mw(e.f) * aboveFrac(e)), 22);
      }

    (spec.FRAMES || []).forEach(function (f) {
      var pad = f.pad || DEFAULTS.framePad;
      var px = num(pad.x, DEFAULTS.framePad.x);
      var pt = num(pad.top, DEFAULTS.framePad.top);
      // the caption sits frameLabelDy above the topmost member and needs its own line height
      var top = f.label ? Math.max(pt, DEFAULTS.frameLabelDy + 8) : pt;
      (f.nodes || []).forEach(function (id) { want(id, px, top); });
    });

    return out;

  // How far right of every box the wires actually reach. Growing the canvas is safe
  // (no re-placement), so this is measured from the FINAL positions of every node.
  function rightOverhang(spec, pos) {
    var D = bulgeDefaults();
    var W = window.MMWires;

    (spec.EDGES || []).forEach(function (e) {

    //     remove it from its column — excluding pinned nodes made an all-pinned lane

    //     text-length-independent way to sit a one-box hub beside a tall column.

    // --- tops. A pinned node KEEPS ITS SLOT in the cursor: it is drawn at its pin, but the
    //     rest of the lane does not collapse upward into the space it still visually occupies.
    //     `autoTop` is where the box would sit with no pin at all — see the gutter note below.
    var autoTop = {}, tops = {};
    lanes.forEach(function (ln) {
      var cursor = laneTop(ln);
      var first = true;
      bucket[ln.id].forEach(function (n) {
        if (!first) cursor += num(n.gapBefore, rowGap);   // gapBefore is ignored on a lane's first node
        // alignWith: sit level with a box in an EARLIER lane, derived from that box's
        // measured position instead of a hand-counted gapBefore that goes stale the
        // moment any text above it changes. Clamped downward — it never overlaps the
        // box above it in its own lane.
        if (n.alignWith) {
          if (autoTop[n.alignWith] !== undefined) {
            cursor = Math.max(cursor, autoTop[n.alignWith]);
          } else if (!_warnedAlign[n.id]) {
            _warnedAlign[n.id] = 1;          // a drag re-lays out at 60fps — say it once

              '" — unknown, or not in an earlier lane; ignored');
          }

        tops[n.id] = n.pin ? n.pin.y : cursor;
        cursor += mh(n.id);

      });
    });

    // --- provisional rects, plus the pin-free position of every box.
    var pos = {}, auto = {};
    lanes.forEach(function (ln, li) {

      bucket[ln.id].forEach(function (n) {
        var w = mw(n.id), h = mh(n.id);
        var ax = (align === 'center') ? laneX[li] + (laneW[li] - w) / 2 : laneX[li];
        auto[n.id] = { x: ax, y: autoTop[n.id] };
        pos[n.id] = { x: n.pin ? n.pin.x : ax, y: tops[n.id], w: w, h: h };
      });
    });

    // --- the gutter: room reserved left of / above the auto-placed boxes so a U-turn wire,
    //     a labelAbove caption or a frame band never lands at a negative canvas coordinate
    //     (which cannot be scrolled to). It is measured against the PIN-FREE positions on
    //     purpose. Measuring it against live positions meant that pinning a node — which is
    //     all a drag does — dropped that node's demand and collapsed the gutter, so every
    //     other box in the diagram jumped sideways the instant one box was touched.
    var need = needs(spec);
    _needs = need;
    var gut = { left: 0, top: 0 };
    for (var id in auto) {
      if (!Object.prototype.hasOwnProperty.call(auto, id)) continue;
      var nd = need[id];

      gut.top = Math.max(gut.top, nd.top - auto[id].y);

    gut.left = Math.ceil(Math.max(0, gut.left));
    gut.top = Math.ceil(Math.max(0, gut.top));

    // --- write positions, collect extents
    var maxR = 0, maxB = 0;
    var laneInfo = [];
    lanes.forEach(function (ln, li) {
      var align = (ln.align === 'center') ? 'center' : 'left';

        y: laneTop(ln) + gut.top, align: align

        var el = MM.nodeEl[n.id], p = pos[n.id];
        var nd = need[n.id] || ZERO_NEED;
        // A pin is an absolute canvas coordinate, so it is never shifted by the gutter —
        // that shift would be re-recorded on the next drag and drift forever. It is CLAMPED
        // instead, to the room this box's own U-turn wire / caption / frame band needs, so a
        // box can never be parked where its own drawing falls off the canvas and disappears.
        var x = n.pin ? Math.max(p.x, nd.left) : p.x + gut.left;
        var y = n.pin ? Math.max(p.y, nd.top) : p.y + gut.top;
        p.x = x; p.y = y;
        el.style.left = Math.round(x) + 'px';
        el.style.top = Math.round(y) + 'px';
        maxR = Math.max(maxR, x + p.w);
        maxB = Math.max(maxB, y + p.h);
      });
    });

    MM.lanes = laneInfo;
    MM.gutter = gut;
    setSize(Math.ceil(Math.max(maxR, rightOverhang(spec, pos)) + padX), Math.ceil(maxB + padY));

    MM.size = { w: Math.max(DEFAULTS.minW, w), h: Math.max(DEFAULTS.minH, h) };
    MM.canvas.style.width = MM.size.w + 'px';
    MM.canvas.style.height = MM.size.h + 'px';
  }

  /* ----------------------------------------------------------------- frames */

  function frames() {
    var MM = window.MM;

    var meta = MM.spec.META || {};

    var padY = num(meta.padY, DEFAULTS.padY);
    var maxR = MM.size.w - padX, maxB = MM.size.h - padY;

    (MM.spec.FRAMES || []).forEach(function (f) {
      var ent = MM.frameEl && MM.frameEl[f.id];
      if (!ent) return;
      var pad = f.pad || DEFAULTS.framePad;
      var px = num(pad.x, DEFAULTS.framePad.x);
      var pt = num(pad.top, DEFAULTS.framePad.top);
      var pb = num(pad.bottom, DEFAULTS.framePad.bottom);

      // bounding box over the members that actually exist
      var x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity, seen = 0;
      (f.nodes || []).forEach(function (id) {
        var r = rectOf(id);
        if (!r) return;
        seen++;
        x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y);
        x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h);

      if (!seen) { ent.band.hidden = true; if (ent.label) ent.label.hidden = true; return; }
      ent.band.hidden = false;
      if (ent.label) ent.label.hidden = false;

      ent.band.style.left = (x1 - px) + 'px';
      ent.band.style.top = (y1 - pt) + 'px';
      ent.band.style.width = (x2 - x1 + px * 2) + 'px';
      ent.band.style.height = (y2 - y1 + pt + pb) + 'px';

      maxR = Math.max(maxR, x2 + px);
      maxB = Math.max(maxB, y2 + pb);

  /* ------------------------------------------------------------------- misc */

  }

  }

  function layout() {
    measure();
    apply();
    frames();
  }

  function setPin(id, x, y) {
    var MM = window.MM;
    if (!MM) return;
    var n = MM.nodeById[id], el = MM.nodeEl[id];
    if (!n || !el) return;
    n.pin = { x: Math.round(x), y: Math.round(y) };
    el.setAttribute('data-pinned', '1');
    el.classList.add('is-pinned');
    el.style.left = n.pin.x + 'px';
    el.style.top = n.pin.y + 'px';
  }

  function clearPin(id) {
    var MM = window.MM;
    if (!MM) return;
    var n = MM.nodeById[id], el = MM.nodeEl[id];
    if (!n || !el) return;
    delete n.pin;
    el.removeAttribute('data-pinned');
    el.classList.remove('is-pinned');

    DEFAULTS: DEFAULTS,
    KINDS: KINDS,
    validate: validate,
    showErrors: showErrors,
    build: build,
    measure: measure,
    apply: apply,
    layout: layout,

    return out.innerHTML.replace(/(<br>)+$/, '').replace(/\s+$/, '');
  };

  function plainText(html) {
    var d = document.createElement('div');
    d.innerHTML = String(html == null ? '' : html);
    return (d.textContent || '').replace(/ /g, ' ').trim();
  }

  // Wire labels are SVG <text>: wires.js escapes them on the innerHTML path and uses
  // textContent on the in-place path, so < and > are safe to keep — stripping them
  // silently ate characters mid-word in the only free-text field the wire editor has.
  function safeLabel(s) { return String(s == null ? '' : s).replace(/\s+/g, ' '); }

  /* ---------------------------------------------------- DOM -> spec (persist) */

  MMEditor.syncFromDOM = function () {
    if (!ready()) return;
    var els = MM.canvas.querySelectorAll('.mm-node'), i, el, node, t, badge, clone, d, rw;
    for (i = 0; i < els.length; i++) {
      el = els[i];
      node = specNode(el.getAttribute('data-id'));
      if (!node) continue;

      t = el.querySelector('.mm-t');
      if (t) {
        // node.n is SPEC-OWNED and never read back from the DOM. The badge lives inside
        // the contenteditable title, so select-all + retype used to delete it and take the
        // step number with it, irrecoverably — there is no UI to type a number back in.
        clone = t.cloneNode(true);
        var cb = clone.querySelector('.mm-n');
        if (cb && cb.parentNode) cb.parentNode.removeChild(cb);
        node.title = MMEditor.sanitize(clone.innerHTML);
      }

      d = el.querySelector('.mm-d');
      if (d) node.body = MMEditor.sanitize(d.innerHTML);

      rw = el.querySelector('.mm-rw');
      if (rw) node.rw = MMEditor.sanitize(rw.innerHTML);

      if (node.pin) node.pin = { x: Math.round(el.offsetLeft), y: Math.round(el.offsetTop) };
    }
  };

  /* -------------------------------------------------------------- text edits */

  // Rows are NOT contenteditable at rest. A live caret everywhere meant a plain
  // pointerdown on a box landed in the text and started a native text selection instead
  // of a drag, so boxes felt unmovable wherever they had words on them — which is most of
  // them. Now: drag from anywhere, double-click to type. Only the row being edited
  // carries contenteditable, and it is dropped again on blur.
  function decorate() {
    if (!ready()) return;
    var rows = editableRows(), i;
    for (i = 0; i < rows.length; i++) {
      rows[i].removeAttribute('contenteditable');
      if (cfg.editable) rows[i].setAttribute('spellcheck', 'false');
    }
  }

  // Turn one row on and put the caret where the user clicked.
  function beginEdit(row, ev) {
    if (!cfg.editable || !row) return;
    row.setAttribute('contenteditable', 'true');
    row.setAttribute('spellcheck', 'false');
    row.focus();
    if (ev && document.caretRangeFromPoint) {
      var rng = document.caretRangeFromPoint(ev.clientX, ev.clientY);
      if (rng) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(rng);
      }
    }
  }

  function endEdit(row) {
    if (!row) return;
    row.removeAttribute('contenteditable');
  }

  function onDblClick(ev) {
    var row = ev.target.closest && ev.target.closest('.mm-t, .mm-d, .mm-rw');
    if (!row || !cfg.editable || state.connect) return;
    ev.preventDefault();
    beginEdit(row, ev);
  }

  function onFocusIn(ev) {
    var row = ev.target.closest && ev.target.closest('.mm-t, .mm-d, .mm-rw');
    if (!row || !cfg.editable) return;
    // addNode focuses the new title itself; without this the focus would push a SECOND,
    // identical snapshot and the first Undo after "+ Node" would be a silent no-op.
    if (skipFocusUndo) { skipFocusUndo = false; }
    else pushUndo();                                // one undo entry per editing session
    var host = row.closest('.mm-node');
    if (host) lastAnchorId = host.getAttribute('data-id');
  }

  // The badge is inside the editable title, so a select-all + retype can wipe the element.
  // node.n survives (syncFromDOM never reads it back), so put the badge straight back.
  function restoreBadge(row) {
    var host = row.closest && row.closest('.mm-node');
    if (!host || !row.classList.contains('mm-t')) return;
    var node = specNode(host.getAttribute('data-id'));
    if (!node || node.n === undefined || node.n === '' || node.n === null) return;
    if (row.querySelector('.mm-n')) return;
    var span = document.createElement('span');
    span.className = 'mm-n';
    span.setAttribute('data-field', 'n');
    span.setAttribute('contenteditable', 'false');
    span.textContent = String(node.n);
    row.insertBefore(span, row.firstChild);
  }

  function onFocusOut(ev) {
    var row = ev.target.closest && ev.target.closest('.mm-t, .mm-d, .mm-rw');
    if (!row) return;
    MMEditor.syncFromDOM();
    restoreBadge(row);
    endEdit(row);                                   // back to draggable
  }

  function onInput(ev) {
    if (!ev.target.closest || !ev.target.closest('.mm-t, .mm-d, .mm-rw')) return;
    if (inputTimer) clearTimeout(inputTimer);
    inputTimer = setTimeout(function () {
      inputTimer = null;
      MM.redraw();                                  // heights changed — the lane must re-flow
      applySelection();
    }, INPUT_DEBOUNCE);
  }

  function onPaste(ev) {
    var row = ev.target.closest && ev.target.closest('.mm-t, .mm-d, .mm-rw');
    if (!row) return;
    ev.preventDefault();
    var txt = '';
    if (ev.clipboardData) txt = ev.clipboardData.getData('text/plain');
    else if (window.clipboardData) txt = window.clipboardData.getData('Text');

    if (document.execCommand) { document.execCommand('insertText', false, txt); return; }

      rg.deleteContents();
      rg.insertNode(document.createTextNode(txt));
      sel.collapseToEnd();
    }
  }

  /* -------------------------------------------------------------------- drag */

  function onPointerDown(ev) {
    if (!ready() || ev.button > 0) return;
    var el = ev.target.closest ? ev.target.closest('.mm-node') : null;

    if (!el) {                                      // empty canvas — clear everything
      if (ev.target.closest && ev.target.closest('.mm-wire-hit')) return;
      selectEdge(null);
      selectNode(null);
      if (state.connect) setSrc(null);
      return;
    }

    var id = el.getAttribute('data-id');

    if (state.connect) {                            // connect mode owns the click
      ev.preventDefault();
      connectClick(id);
      return;
    }

    // A live caret inside this node means the user is editing text, not dragging.
    var active = document.activeElement;

        active.getAttribute && active.getAttribute('contenteditable') === 'true') {
      lastAnchorId = id;
      return;
    }

    // Document coordinates, not viewport ones: ox/oy are canvas coordinates, which do not
    // move when the page scrolls. Mixing in a viewport coordinate left the box offset from
    // the cursor by the whole scroll distance for the rest of the drag if the user scrolled
    // (two-finger scroll is still delivered while a pointer is down).
    drag = {

    document.addEventListener('pointerup', onPointerUp, true);
    document.addEventListener('pointercancel', onPointerUp, true);

  // Drop an in-flight drag without committing a pin. Used when the DOM under it is
  // about to be replaced (undo / add node / delete node).
  function cancelDrag() {
    if (!drag) return;
    try { drag.el.releasePointerCapture(drag.pid); } catch (e) { /* fine */ }
    drag = null;
    state.dragging = false;
    document.removeEventListener('pointermove', onPointerMove, true);
    document.removeEventListener('pointerup', onPointerUp, true);
    document.removeEventListener('pointercancel', onPointerUp, true);
  }

  function onPointerMove(ev) {
    if (!drag) return;
    var dx = pageX(ev) - drag.sx, dy = pageY(ev) - drag.sy;
    if (!drag.moved) {
      if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
      drag.moved = true;
      state.dragging = true;
      pushUndo();
      var a = document.activeElement;
      if (a && a.blur && drag.el.contains(a)) a.blur();
      var sel = window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();

    }

    // apply() clamps the pin to the same numbers, so the box does not jump on release, and
    // dragging a box to the left edge can no longer push its own wire off the canvas.
    var min = (MMLayout.minRoomOf ? MMLayout.minRoomOf(drag.id) : null) || { left: 0, top: 0 };
    drag.el.style.left = Math.max(min.left, drag.ox + dx) + 'px';

  }

    document.removeEventListener('pointermove', onPointerMove, true);
    document.removeEventListener('pointerup', onPointerUp, true);

    try { d.el.releasePointerCapture(d.pid); } catch (e) { /* fine */ }

    // a box to 0,0 is not something any undo could take back (setPin does not snapshot).
    if (!d.el.isConnected || MM.nodeEl[d.id] !== d.el) return;

    if (!d.moved) {                                 // a click, not a drag
      lastAnchorId = d.id;
      selectNode(d.id);
      return;
    }
    MMLayout.setPin(d.id, Math.round(d.el.offsetLeft), Math.round(d.el.offsetTop));
    lastAnchorId = d.id;
    selectNode(d.id);

    // what re-rendering the exported spec produces. Half-relayouts drifted apart silently.
    MM.redraw();
    applySelection();
  }

  /* ------------------------------------------------------------ node select */

  function selectNode(id) {
    var prev = state.selNode ? nodeElOf(state.selNode) : null;
    if (prev) { prev.classList.remove('is-selected'); prev.style.outline = ''; prev.style.outlineOffset = ''; }
    state.selNode = null;
    if (!id) { syncExtraButtons(); return; }
    var el = nodeElOf(id);
    if (!el) { syncExtraButtons(); return; }
    state.selNode = id;
    el.classList.add('is-selected');
    // inline fallback so selection is visible even if engine.css has no rule for it
    el.style.outline = '2px solid var(--mm-orange, #E64A00)';
    el.style.outlineOffset = '2px';
    syncExtraButtons();
  }
  MMEditor.selectNode = selectNode;

  /* ----------------------------------------------------------- connect mode */

  function setSrc(id) {
    var prev = state.srcId ? nodeElOf(state.srcId) : null;
    if (prev) prev.classList.remove('is-src');
    state.srcId = id || null;
    if (id) { var el = nodeElOf(id); if (el) el.classList.add('is-src'); }
  }

  function connectClick(id) {
    if (state.srcId && !specNode(state.srcId)) setSrc(null);   // undone away since it was armed
    if (!state.srcId) { setSrc(id); return; }
    if (state.srcId === id) { setSrc(null); return; }          // second click on A cancels
    var f = state.srcId, t = id, list = edges(), i;
    for (i = 0; i < list.length; i++) {
      if (list[i].f === f && list[i].t === t && list[i].c === 'navy') {
        if (window.console) console.warn('[mindmap] duplicate edge ignored: ' + f + ' -> ' + t);
        setSrc(null);
        return;
      }
    }
    pushUndo();
    list.push({ f: f, t: t, c: 'navy' });
    setSrc(null);
    MMWires.render();
    selectEdge(list.length - 1);
  }

  MMEditor.toggleConnect = function (on) {
    if (!ready()) return;
    state.connect = (on === undefined) ? !state.connect : !!on;
    document.body.classList.toggle('mm-connect', state.connect);
    if (!state.connect) { setSrc(null); clearHoverTarget(); }
    else { selectEdge(null); selectNode(null); }
    var b = $('mm-btn-connect');
    if (b) { b.classList.toggle('is-on', state.connect); b.setAttribute('aria-pressed', state.connect ? 'true' : 'false'); }
  };

  var hoverEl = null;
  function clearHoverTarget() { if (hoverEl) hoverEl.classList.remove('is-hover-target'); hoverEl = null; }
  function onPointerOver(ev) {
    if (!state.connect) return;
    var el = ev.target.closest ? ev.target.closest('.mm-node') : null;
    if (el === hoverEl) return;
    clearHoverTarget();
    if (el && el.getAttribute('data-id') !== state.srcId) { el.classList.add('is-hover-target'); hoverEl = el; }
  }

  /* ------------------------------------------------------------ edge editing */

  function edgeAt(i) { var e = edges()[i]; return e || null; }

  function applySelection() {
    if (!ready() || !MM.svg) return;
    var was = MM.svg.querySelectorAll('.is-selected'), i;
    for (i = 0; i < was.length; i++) was[i].classList.remove('is-selected');
    if (state.selEdge === null || !edgeAt(state.selEdge)) { hideBar(); return; }
    var sel = MM.svg.querySelectorAll('[data-edge="' + state.selEdge + '"]');
    if (!sel.length) { hideBar(); return; }
    for (i = 0; i < sel.length; i++) sel[i].classList.add('is-selected');
    positionBar();
    syncBar();
  }
  MMEditor.applySelection = applySelection;

  MMEditor.selectEdge = function (i) {
    if (!ready()) return;
    state.selEdge = (i === null || i === undefined || !edgeAt(i)) ? null : i;
    if (state.selEdge !== null) selectNode(null);
    applySelection();
  };

  MMEditor.deleteEdge = function (i) {
    if (!ready() || !edgeAt(i)) return;
    pushUndo();
    edges().splice(i, 1);
    state.selEdge = null;
    MMWires.render();
    applySelection();
  };

  MMEditor.cycleColor = function (i, dir) {
    var e = edgeAt(i); if (!e) return;
    var keys = MMWires.colorKeys(), at = keys.indexOf(e.c);
    if (at < 0) at = 0;
    pushUndo();
    e.c = keys[(at + (dir === -1 ? -1 : 1) + keys.length) % keys.length];
    MMWires.render(); applySelection();
  };

  MMEditor.toggleDash = function (i) {
    var e = edgeAt(i); if (!e) return;
    pushUndo();
    if (e.dash) delete e.dash; else e.dash = 1;
    MMWires.render(); applySelection();
  };

  // side / bulge / labelAbove / label text all feed MMLayout.minRoomOf — the gutter that
  // reserves canvas room for a U-turn wire and its caption. A wire-only render left the
  // gutter at its old value, so switching an edge on the leftmost lane to side:'left' drew
  // the loop at negative canvas x, clipped flat against the edge with nowhere to scroll.
  // MM.redraw() is layout + wires: the same pass a drag commits.
  MMEditor.cycleSide = function (i) {
    var e = edgeAt(i); if (!e) return;
    pushUndo();
    if (e.side === undefined) e.side = 'right';
    else if (e.side === 'right') e.side = 'left';
    else delete e.side;
    MM.redraw(); applySelection();
  };

  MMEditor.nudgeBulge = function (i, delta) {
    var e = edgeAt(i); if (!e) return;
    var base = (e.bulge !== undefined) ? e.bulge : defBulge(e);
    pushUndo();
    e.bulge = Math.max(BULGE_MIN, Math.min(BULGE_MAX, base + delta));
    MM.redraw(); applySelection();
  };

  MMEditor.toggleLabelAbove = function (i) {
    var e = edgeAt(i); if (!e) return;
    pushUndo();
    if (e.labelAbove) delete e.labelAbove; else e.labelAbove = 1;
    MM.redraw(); applySelection();
  };

  MMEditor.setLabel = function (i, text) {
    var e = edgeAt(i); if (!e) return;
    var v = safeLabel(text);
    if (!v.trim()) delete e.l; else e.l = v;
    MM.redraw(); applySelection();
  };

  /* ------------------------------------------------------------- the edge bar */

  function buildBar() {
    bar = $('mm-edge-bar');
    if (!bar) return;
    bar.innerHTML =
      '<span class="mm-eb-tag">wire</span>' +
      '<button type="button" class="mm-btn" data-act="cprev" title="previous colour ([)">◀</button>' +
      '<span class="mm-chip" id="mm-eb-swatch"></span>' +
      '<button type="button" class="mm-btn" data-act="cnext" title="next colour (])">▶</button>' +
      '<button type="button" class="mm-btn" data-act="dash" title="dashed (d)">dash</button>' +
      '<button type="button" class="mm-btn" data-act="side" title="force side (s)">side</button>' +
      '<button type="button" class="mm-btn" data-act="bminus" title="less bulge (-)">−</button>' +
      '<button type="button" class="mm-btn" data-act="bplus" title="more bulge (=)">+</button>' +
      '<button type="button" class="mm-btn" data-act="above" title="label above source (a)">label ↑</button>' +
      '<input type="text" class="mm-eb-label" id="mm-eb-label" placeholder="label">' +
      '<button type="button" class="mm-btn" data-act="del" title="delete (Del)">delete</button>' +
      '<button type="button" class="mm-btn" data-act="close" title="deselect (Esc)">✕</button>';
    barLabel = $('mm-eb-label');

    bar.addEventListener('mousedown', function (ev) {
      if (ev.target.tagName !== 'INPUT') ev.preventDefault();   // keep focus off the buttons
    });
    bar.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!b || state.selEdge === null) return;
      var i = state.selEdge;
      switch (b.getAttribute('data-act')) {
        case 'cprev': MMEditor.cycleColor(i, -1); break;
        case 'cnext': MMEditor.cycleColor(i, 1); break;
        case 'dash': MMEditor.toggleDash(i); break;
        case 'side': MMEditor.cycleSide(i); break;
        case 'bminus': MMEditor.nudgeBulge(i, -BULGE_STEP); break;
        case 'bplus': MMEditor.nudgeBulge(i, BULGE_STEP); break;
        case 'above': MMEditor.toggleLabelAbove(i); break;
        case 'del': MMEditor.deleteEdge(i); break;
        case 'close': MMEditor.selectEdge(null); break;
      }
    });
    barLabel.addEventListener('input', function () {
      if (state.selEdge === null) return;
      MMEditor.setLabel(state.selEdge, barLabel.value);
    });
    barLabel.addEventListener('focus', function () { pushUndo(); });
    barLabel.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === 'Escape') { ev.stopPropagation(); barLabel.blur(); }
    });
  }

  function hideBar() { if (bar) bar.hidden = true; }

  function positionBar() {
    if (!bar) return;
    var p = MM.svg.querySelector('.mm-wire[data-edge="' + state.selEdge + '"]');
    if (!p) { hideBar(); return; }
    var pt = { x: 0, y: 0 };
    try { pt = p.getPointAtLength(p.getTotalLength() / 2); } catch (e) { /* fall back to 0,0 */ }
    bar.hidden = false;
    var host = bar.offsetParent || document.body;
    var hr = host.getBoundingClientRect(), cr = MM.canvas.getBoundingClientRect();
    bar.style.position = 'absolute';
    bar.style.left = Math.round(cr.left - hr.left + pt.x + 8) + 'px';
    bar.style.top = Math.round(cr.top - hr.top + pt.y + 10) + 'px';
  }

  function syncBar() {
    if (!bar) return;
    var e = edgeAt(state.selEdge); if (!e) return;
    var sw = $('mm-eb-swatch');
    if (sw) {
      sw.style.background = MMWires.COLOR[e.c] || '#888';
      sw.title = e.c;
    }
    setOn(bar.querySelector('[data-act="dash"]'), !!e.dash);
    setOn(bar.querySelector('[data-act="above"]'), !!e.labelAbove);
    var sb = bar.querySelector('[data-act="side"]');
    if (sb) { sb.textContent = e.side ? ('side: ' + e.side) : 'side'; setOn(sb, !!e.side); }
    if (barLabel && document.activeElement !== barLabel) barLabel.value = e.l || '';
  }

  function setOn(el, on) { if (el) el.classList.toggle('is-on', !!on); }

  /* --------------------------------------------------------- node add/delete */

  function uniqueId(base) {
    var i = 1, id;
    do { id = base + i; i++; } while (specNode(id));
    return id;
  }

  MMEditor.addNode = function (opts) {
    if (!ready()) return null;
    opts = opts || {};
    var anchor = specNode(state.selNode || lastAnchorId || '');
    var laneId = opts.lane || (anchor ? anchor.lane : (lanes()[0] ? lanes()[0].id : null));
    if (!laneId) { if (window.console) console.warn('[mindmap] no lane to add a node to'); return null; }
    var kind = opts.kind || (anchor && anchor.lane === laneId ? anchor.kind : 'note');
    if (!MMLayout.KINDS || !MMLayout.KINDS[kind]) kind = 'note';

    var node = {
      id: opts.id || uniqueId('node'),
      lane: laneId,
      kind: kind,
      title: opts.title !== undefined ? opts.title : 'NEW NODE',
      body: opts.body !== undefined ? opts.body : 'describe it'
    };
    pushUndo();
    var list = nodes(), at = list.length, i;
    if (anchor && anchor.lane === laneId) {          // insert after the anchor's lane run
      for (i = 0; i < list.length; i++) if (list[i] === anchor) { at = i + 1; break; }
    }
    list.splice(at, 0, node);
    state.selNode = node.id;
    lastAnchorId = node.id;
    rebuild();
    var el = nodeElOf(node.id);
    if (el) {
      var t = el.querySelector('.mm-t');
      if (t && cfg.editable) { skipFocusUndo = true; t.focus(); selectAll(t); }
      el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    return node.id;
  };

  function selectAll(el) {
    try {
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) { /* fine */ }
  }

  MMEditor.deleteNode = function (id) {
    if (!ready()) return;
    id = id || state.selNode;
    if (!id || !specNode(id)) return;
    pushUndo();
    var list = nodes(), i;
    for (i = list.length - 1; i >= 0; i--) if (list[i].id === id) list.splice(i, 1);
    // a dangling alignWith is the same class of breakage as an empty frame: validate()
    // rejects it, so a normal in-browser delete produced a save file render.py --check
    // refuses and the page boots with a red error banner
    for (i = 0; i < list.length; i++) if (list[i].alignWith === id) delete list[i].alignWith;
    var es = edges();
    for (i = es.length - 1; i >= 0; i--) if (es[i].f === id || es[i].t === id) es.splice(i, 1);
    var fr = MM.spec.FRAMES || [], j, k;
    for (j = fr.length - 1; j >= 0; j--) {
      if (!fr[j].nodes) continue;
      for (k = fr[j].nodes.length - 1; k >= 0; k--) if (fr[j].nodes[k] === id) fr[j].nodes.splice(k, 1);
      // a frame with no members is invalid — MMLayout.validate rejects it, so exporting
      // one turned a normal delete into a spec that boots with a red error banner
      if (!fr[j].nodes.length) fr.splice(j, 1);

    if (lastAnchorId === id) lastAnchorId = null;
