<!DOCTYPE html>
<!-- baby-PAI — the shell. One product, driven from one JSON.
     Places: app · editor.  Slots: main · overlay.
     URL:  index.html?state=<scenario>[&place=][&mount=][&overlay=]
     Everything visual comes from ../design-system/pai.css. Nothing is copied. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>" />
  <title>baby-PAI · shell</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <!-- THE design system. Relative path, never a copy. -->
  <link rel="stylesheet" href="../design-system/pai.css" />
  <!-- baby-PAI's own layer: layout only, zero colour literals. -->
  <link rel="stylesheet" href="shell.css" />
</head>

<body class="pai">

  <!-- ══ PLACE: app ══════════════════════════════════════════════════════ -->
  <div class="bp-app" data-place-app>

    <aside class="bp-sidebar">
      <div class="bp-ws">
        <div class="bp-ws-avatar" data-bind="user.workspace_initial"></div>
        <span class="bp-ws-name" data-bind="user.workspace"></span>
        <span class="pai-badge pai-badge-free bp-plan" data-plan-is="free">Free</span>
        <span class="pai-badge pai-badge-pro  bp-plan" data-plan-is="pro">Pro</span>
        <span class="pai-badge pai-badge-gold bp-plan" data-plan-is="gold">Gold</span>
        <span class="pai-badge pai-badge-basic bp-plan" data-plan-is="team">Team</span>
        <i class="ph ph-caret-down bp-caret"></i>
      </div>

      <nav class="bp-nav">
        <a class="bp-nav-item is-active" href="?state=credits-exhausted"><i class="ph ph-house-simple"></i><span>Home</span></a>
        <a class="bp-nav-item" href="?state=credits-exhausted&amp;place=app"><i class="ph ph-file"></i><span>Created by Me</span></a>
      </nav>
      <div class="bp-divider"></div>
      <nav class="bp-nav">
        <div class="bp-nav-label">Projects</div>
        <a class="bp-nav-item"><i class="ph ph-plus"></i><span>Create project</span><span class="pai-badge pai-badge-pro bp-lock">Pro</span></a>
      </nav>
      <div class="bp-divider"></div>
      <nav class="bp-nav">
        <a class="bp-nav-item"><i class="ph ph-layout"></i><span>Templates</span></a>
        <a class="bp-nav-item" href="?state=trial-expiring"><i class="ph ph-presentation-chart"></i><span>Open the editor</span></a>
      </nav>

      <div class="bp-sidebar-foot">
        <nav class="bp-nav">
          <a class="bp-nav-item"><i class="ph ph-gear"></i><span>Workspace settings</span></a>
          <a class="bp-nav-item"><i class="ph ph-user-plus"></i><span>Invite new member</span><span class="pai-badge pai-badge-pro bp-lock">Pro</span></a>
        </nav>
      </div>
    </aside>

    <div class="bp-col">
      <header class="bp-topbar">

        <!-- the credit / plan indicator — the thing 33 explorations each re-invented -->
        <div class="bp-meter">
          <span class="bp-trial-chip">
            <i class="ph-fill ph-fire"></i>
            Trial: <span data-bind="user.trial.days_remaining"></span> days left
          </span>
          <span class="bp-sep bp-trial-only"></span>
          <button class="bp-credit-chip" id="credits-chip" data-testid="credits-chip">
            <i class="ph-fill ph-lightning"></i>
            <span data-bind="user.credits.remaining" data-fmt="num"></span> credits left
          </button>
          <button class="button-style button-small button-primary-brand bp-upgrade" id="topbar-upgrade">Upgrade</button>
        </div>

        <button class="bp-icon-btn" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button>
        <button class="bp-icon-btn" aria-label="Help"><i class="ph ph-question"></i></button>
        <button class="bp-icon-btn" aria-label="Notifications"><i class="ph ph-bell"></i></button>
        <div class="bp-avatar" data-bind="user.initials" role="img"></div>
      </header>

      <div class="bp-slot" data-slot="main" data-place-slot="app"></div>
    </div>
  </div>

  <!-- ══ PLACE: editor ═══════════════════════════════════════════════════ -->
  <div class="bp-editor" data-place-editor>
    <header class="bp-edtop">
      <div class="bp-pill">
        <button class="bp-pill-btn" aria-label="Home"><i class="ph ph-house-simple"></i></button>
        <span class="bp-sep"></span>
        <span class="bp-docname" data-bind="content.decks.0.title"></span>
      </div>
      <div class="bp-pill">
        <span class="bp-trial-chip">
          <i class="ph-fill ph-fire"></i>
          Trial ends <span data-bind="user.trial.ends_on" data-fmt="date"></span>
        </span>
        <span class="bp-sep bp-trial-only"></span>
        <button class="bp-pill-btn" id="editor-credits" data-testid="credits-chip">
          <i class="ph-fill ph-lightning"></i><span data-bind="user.credits.remaining" data-fmt="num"></span>
        </button>
        <span class="bp-sep"></span>
        <button class="bp-pill-btn">Share</button>
        <button class="bp-pill-btn">Present</button>
        <button class="bp-pill-btn">Export</button>
        <div class="bp-avatar" data-bind="user.initials" role="img"></div>
      </div>
    </header>

    <div class="bp-edbody">
      <nav class="bp-film" data-repeat="content.slides">
        <template>
          <button class="bp-film-item">
            <span class="bp-film-n" data-field="n"></span>
            <span class="bp-film-t" data-field="title"></span>
          </button>
        </template>
      </nav>
      <div class="bp-slot" data-slot="main" data-place-slot="editor"></div>
    </div>
  </div>

  <!-- ══ LAYER: overlay — not a place. Takes its host from the scenario. ══ -->
  <div class="bp-overlay" data-slot="overlay" hidden></div>

  <!-- dev affordance: what is mounted where, and how to switch -->
  <div class="bp-ribbon" id="ribbon"></div>

  <!-- ══ the world ═══════════════════════════════════════════════════════ -->
  <script src="baby-pai.js" data-root="."></script>
  <script src="shell.js"></script>

  <!-- Agentation (annotation toolbar — same 4 lines as the other 103 files) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Agentation } from 'agentation';
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  </script>
</body>
</html>
