<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>baby-pai loader verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="../design-system/pai.css" />
<style>
  body { font-family: Inter, sans-serif; margin: 0; background: #F5F5F7; color: #1D2939; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:16px; }
  .card { background:#fff; border:1px solid #E4E7EC; border-radius:12px; padding:14px; }
  .card h4 { margin:0 0 6px; font-size:14px; font-weight:600; }
  .card p { margin:0; font-size:12px; color:#667085; }
  .banner { display:none; background:#FFF4E5; border:1px solid #FEC84B; border-radius:10px; padding:12px 14px; margin-top:12px; font-size:13px; }
  .empty { display:none; text-align:center; padding:64px 24px; }
  .modal-scrim { display:none; position:fixed; inset:0; background:rgba(16,24,40,.55); align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; border-radius:16px; padding:28px; max-width:420px; width:calc(100% - 32px); }

  /* Everything below is driven purely by the body dataset the loader writes. */
  body[data-banner="trial-ending"] .banner { display:block; }
  body[data-docs="none"] .empty { display:block; }
  body[data-docs="none"] .grid  { display:none; }
  body[data-modal="upgrade-gold"] .modal-scrim { display:flex; }
  body[data-credits="empty"] .credit-chip { background:#FEE4E2; color:#B42318; }
  body[data-credits="low"]   .credit-chip { background:#FFF4E5; color:#B54708; }
  body[data-credits="ok"]    .credit-chip { background:#ECFDF3; color:#027A48; }
  body[data-trial="expiring"] .trial-pill { display:inline-flex; }
  .trial-pill { display:none; }
  .credit-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
</style>
</head>
<body class="pai">

  <div class="wrap">
    <div class="topbar">
      <strong data-bind="user.workspace"></strong>
      <span class="pai-badge pai-badge-pro" data-bind="user.plan_id"></span>
      <span class="credit-chip" data-testid="credits-chip">
        <span data-bind="user.credits.remaining" data-fmt="num"></span> /
        <span data-bind="user.credits.included" data-fmt="num"></span> credits
      </span>
      <span class="trial-pill pai-badge pai-badge-gold">
        Trial ends <span data-bind="user.trial.ends_on" data-fmt="date"></span>
      </span>
      <span style="margin-left:auto; font-size:12px; color:#667085;">
        <span data-bind="counts.decks"></span> deck<span data-bind="counts.decks" data-fmt="plural"></span>
      </span>
    </div>

    <div class="banner">
      Your trial ends in <strong data-bind="user.trial.days_remaining"></strong> days.
      <button class="button-style button-small button-primary" onclick="PAI.set('overlays.banner', null)">Dismiss</button>
    </div>

    <div class="empty">
      <h3>Nothing here yet</h3>
      <p>Start with a prompt, a file, or a template.</p>
    </div>

    <div class="grid" data-repeat="content.decks">
      <template>
        <div class="card">
          <h4 data-field="title"></h4>
          <p><span data-field="slides"></span> slides &middot; <span data-field="edited_days_ago" data-fmt="ago"></span></p>
        </div>
      </template>
    </div>
  </div>

  <div class="modal-scrim">
    <div class="modal">
      <h3 style="margin:0 0 8px;">You're out of credits</h3>
      <p style="margin:0 0 18px; font-size:13px; color:#667085;">
        Resets in <span data-bind="user.credits.resets_in_days"></span> days.
      </p>
      <button class="button-style button-medium button-primary" data-testid="modal-primary">Upgrade</button>
      <button class="button-style button-medium button-tertiary" onclick="PAI.set('overlays.modal', null)">Not now</button>
    </div>
  </div>

  <script src="baby-pai.js" data-root="."></script>
</body>
</html>
