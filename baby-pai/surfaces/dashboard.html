<!DOCTYPE html>
<!-- surface: Dashboard / App  ·  mounts at place=app slot=main
     Opened directly it renders on its own (no chrome). Opened through the
     shell it renders inside the chrome. Same bytes either way. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="pai-mount" content="place=app; slot=main" />
  <title>Dashboard · baby-PAI surface</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="../../design-system/pai.css" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg-primary); color: var(--text-primary);
      font-family: "Inter", system-ui, sans-serif; font-size: 14px;
      overflow-y: auto; -webkit-font-smoothing: antialiased;
    }

    /* ── hero ─────────────────────────────────────────────────────────── */
    .hero { padding: 48px 24px 24px; display: flex; flex-direction: column; align-items: center; }
    .hero h1 { margin: 0 0 24px; text-align: center; }
    .prompt {
      width: 100%; max-width: 680px; background: var(--bg-primary);
      border-radius: 6px; padding: 8px; box-shadow: var(--shadow-elevation-03);
    }
    .prompt-field {
      height: 128px; background: var(--bg-secondary);
      border: 1px dashed var(--border-primary); border-radius: 2px; padding: 20px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .prompt-field .ph-text { color: var(--text-tertiary); font-size: 16px; line-height: 1.5; }
    .prompt-field i { color: var(--text-tertiary); font-size: 20px; margin-top: 1px; }
    .pills { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; background: var(--bg-primary);
      border: 0; border-radius: 52px; padding: 4px 16px 4px 4px;
      box-shadow: var(--shadow-elevation-02); cursor: pointer;
      font: 500 14px "Inter", sans-serif; color: var(--text-primary);
      transition: transform 120ms var(--ease-out-strong), box-shadow 160ms var(--ease-out-strong);
    }
    .pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-elevation-03); }
    .pill-ic {
      width: 36px; height: 36px; border-radius: 34px; font-size: 20px;
      display: grid; place-items: center; background: var(--bg-tertiary); color: var(--text-brand);
    }

    /* ── files ─────────────────────────────────────────────────────────── */
    .files { padding: 8px 24px 40px; }
    .files-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .tabs { display: flex; align-items: center; gap: 8px; }
    .chip {
      height: 28px; display: inline-flex; align-items: center; padding: 0 12px;
      background: var(--bg-primary); border-radius: 4px; box-shadow: var(--shadow-elevation-button);
      font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap;
    }
    .chip.is-active { color: var(--text-primary); box-shadow: var(--shadow-elevation-focused); }
    .count { font-size: 12px; color: var(--text-tertiary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--bg-primary); border-radius: 6px; overflow: hidden;
      box-shadow: var(--shadow-elevation-02); cursor: pointer; text-align: left;
      border: 0; padding: 0; font: inherit; display: block;
      transition: box-shadow 220ms var(--ease-out-strong), transform 160ms var(--ease-out-strong);
    }
    .card:hover { box-shadow: var(--shadow-elevation-03); transform: translateY(-2px); }
    .card-body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .card-title {
      font-weight: 500; color: var(--text-primary); line-height: 1.43;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-sub { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; align-items: center; }
    .star { color: var(--bg-warning); font-size: 13px; display: none; }
    .card[data-starred] .star { display: inline-block; }

    /* deck covers — four generic recipes selected by the row's `thumb`,
       replacing the six bespoke .cv1–.cv6 blocks in key-screens/dashboard.html */
    .cover {
      position: relative; aspect-ratio: 366 / 202; overflow: hidden; padding: 14px;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: var(--bg-primary-inverted); color: var(--text-inverted-primary);
    }
    .cover .head { font-weight: 700; font-size: 15px; line-height: 1.18; width: 84%; }
    .cover .marks { position: absolute; inset: 14px 14px auto auto; display: flex; gap: 3px; align-items: flex-end; height: 34px; }
    .cover .marks i { width: 5px; border-radius: 2px; background: currentColor; opacity: 0.55; }
    .cover .marks i:nth-child(1) { height: 40%; }
    .cover .marks i:nth-child(2) { height: 68%; }
    .cover .marks i:nth-child(3) { height: 52%; }
    .cover .marks i:nth-child(4) { height: 88%; }
    .cover .marks i:nth-child(5) { height: 62%; }
    .card[data-thumb="chart"] .cover { background: var(--bg-secondary-inverted); }
    .card[data-thumb="grid"]  .cover { background: var(--bg-tertiary-inverted); }
    .card[data-thumb="text"]  .cover { background: var(--bg-tertiary); color: var(--text-primary); }
    .card[data-thumb="map"]   .cover { background: var(--app-900); }
    .card[data-thumb="photo"] .cover { background: var(--app-700); }
    .card[data-thumb="logo"]  .cover { background: var(--bg-blackout); }
    .card[data-thumb="text"] .cover .head { font-family: "Hedvig Letters Serif", Georgia, serif; font-weight: 400; font-size: 17px; }

    /* ── the empty case is designed, not just the happy one.
          One token in the scenario — "decks": [] — does all of this. ────── */
    .empty { display: none; padding: 8px 24px 64px; }
    .empty-inner {
      max-width: 560px; margin: 0 auto; text-align: center;
      border: 1px dashed var(--border-primary); border-radius: 6px; padding: 40px 24px;
    }
    .empty-inner i { font-size: 34px; color: var(--text-tertiary); }
    .empty-inner h2 { margin: 12px 0 6px; }
    .empty-inner p { margin: 0 0 20px; color: var(--text-secondary); }

    body[data-docs="none"] .files { display: none; }
    body[data-docs="none"] .empty { display: block; }
    /* a brand-new user is not asked to sort a list they do not have */
    body[data-docs="none"] .pills { display: none; }

    @media (max-width: 640px) {
      .hero { padding: 24px 12px 16px; }
      .files, .empty { padding-left: 12px; padding-right: 12px; }
      .grid { grid-template-columns: 1fr; }
      .prompt-field { height: 96px; padding: 14px; }
    }
  </style>
</head>

<body class="pai">

  <section class="hero">
    <h1 class="text-heading-3xl">Start your next presentation</h1>
    <div class="prompt">
      <div class="prompt-field">
        <span class="ph-text">Type here to start, or drop in a file</span>
        <i class="ph ph-upload-simple"></i>
      </div>
    </div>
    <div class="pills">
      <button class="pill"><span class="pill-ic"><i class="ph-fill ph-file-arrow-up"></i></span>Upload &amp; share link</button>
      <button class="pill"><span class="pill-ic"><i class="ph-fill ph-microsoft-powerpoint-logo"></i></span>Import PPT</button>
      <button class="pill"><span class="pill-ic"><i class="ph-fill ph-pencil-ruler"></i></span>Hire an Expert</button>
    </div>
  </section>

  <section class="files">
    <div class="files-head">
      <div class="tabs">
        <span class="chip is-active">Recent</span>
        <span class="chip">Starred</span>
        <span class="chip">Shared with me</span>
      </div>
      <span class="count"><span data-bind="counts.decks"></span> decks</span>
    </div>

    <div class="grid" data-repeat="content.decks">
      <template>
        <button class="card">
          <div class="cover">
            <div class="marks">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="head" data-field="title"></div>
          </div>
          <div class="card-body">
            <div class="card-title" data-field="title"></div>
            <div class="card-sub">
              <i class="ph-fill ph-star star"></i>
              <span data-field="slides" data-fmt="slides"></span> ·
              <span data-field="edited_days_ago" data-fmt="ago"></span>
            </div>
          </div>
        </button>
      </template>
    </div>
  </section>

  <section class="empty">
    <div class="empty-inner">
      <i class="ph ph-sparkle"></i>
      <h2 class="text-heading-xl">No decks yet</h2>
      <p class="text-body-base-regular">Describe what you need above and the first draft appears in about a minute.</p>
      <button class="button-style button-medium button-primary-brand">Start from a prompt</button>
    </div>
  </section>

  <script src="../baby-pai.js" data-root=".."></script>
</body>
</html>
