<!--
  fixture: a screen with a URL setting that is not a state.  ?tone=1|2|3 changes the
  card, and the render must photograph all three or a requirement about it is unjudgeable.
  Deliberately loads nothing from the network so the suite runs offline.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>fixture — clean</title>
<style>
  body { margin: 0; background: #6b7280; font: 16px/1.4 system-ui, sans-serif; }
  body [data-state] { display: none; }
  body[data-state="default"] [data-state~="default"],
  body[data-state="empty"]   [data-state~="empty"] { display: contents; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { width: 400px; background: #fff; border-radius: 12px; padding: 32px; }
  body[data-tone="2"] .card { background: #fde68a; }
  body[data-tone="3"] .card { background: #bfdbfe; }
  /* The trap, planted deliberately. A render that resizes the window to the frame
     (464 + 96 = 560) drops below this breakpoint and captures the narrow layout while
     labelling it 1440. Clipping leaves the window at 1440, so white is what we see. */
  @media (max-width: 767px) { .card { background: #ff0000; } }
  .atlas-unknown-state { position: fixed; top: 0; left: 0; z-index: 9999;
    background: #b91c1c; color: #fff; padding: 12px 20px; font-weight: 700; }
</style>
</head>
<body>
<script>
  window.__atlas = { states: ["default", "empty"], params: { tone: [1, 2, 3] } };
  (function () {
    const S = window.__atlas.states;
    const q = new URLSearchParams(location.search);
    const s = q.get("state");
    document.body.dataset.state = S.includes(s) ? s : S[0];
    document.body.dataset.freeze = q.get("freeze") === "1" ? "1" : "0";
    document.body.dataset.tone = q.get("tone") || "1";
    if (s && !S.includes(s)) {
      const b = document.createElement("div");
      b.textContent = "unknown state: " + s;
      b.className = "atlas-unknown-state";
      document.body.appendChild(b);
    }
  })();
</script>

<div class="wrap">
  <div class="card" data-atlas-frame>
    <h1 data-state="default">The ordinary state</h1>
    <h1 data-state="empty">Nothing here yet</h1>
  </div>
</div>

<script>
  window.__atlasReady = document.fonts.ready
    .then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));
</script>
</body>
</html>
