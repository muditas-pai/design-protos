<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>legacy names — fixture</title>
<link rel="stylesheet" href="../../../design-system/pai.css" />
</head>
<body class="pai">

<!-- Caught: a legacy spelling in a class attribute. -->
<div class="listitem listitem-medium listitem-selected">attribute</div>

<!-- Caught: a legacy spelling set from script, which a class="…" scan misses. -->
<div class="chip-style chip-medium" id="c">script</div>
<script>
  document.getElementById("c").classList.toggle("chip-selected", true);
</script>

<!-- Not caught: the canonical spellings. -->
<div class="listitem listitem-medium is-selected">canonical</div>
<div class="chip-style chip-medium is-selected">canonical</div>

<!-- Not caught: prose naming the legacy spelling, which is documentation.
     .dropdown-menu-closed and .chip-tone-success are mentioned, not used. -->
<p>Legacy names such as .dropdown-menu-closed and .chip-tone-success are kept as aliases.</p>

</body>
</html>
