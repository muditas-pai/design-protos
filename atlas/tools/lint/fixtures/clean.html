<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean fixture — correct by construction</title>

  <!-- Fonts. Only the three weights the type scale publishes (400/500/600);
       template.html also loads 700/800, which is design-system issue #6. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Design system, referenced the way design-system/template.html does:
       Tailwind CDN, then the brand theme, then the component stylesheet.
       The pai.css <link> is what makes adopted_design_system true. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../design-system/pai.css" />

  <style>
    /* Every declaration below is either a published member or a property the
       system is silent about. There is not one colour literal in this file. */

    /* Type scale by value. THE TRAP: the ramp is published only as Tailwind
       class names, so there is no --font-size-heading-2xl to reference.
       1.5rem IS heading-2xl. Writing it is correct and must not be flagged. */
    .hero-title { font-size: 1.5rem; font-weight: 400; }

    /* Colour by token reference — the only correct way to write a colour. */
    .hero-lede { color: var(--text-secondary); }
    .brand-note { color: var(--text-brand); }

    /* Published elevation, referenced as a token. */
    .panel { background: var(--bg-elevated); box-shadow: var(--shadow-elevation-03); }

    /* Silent properties. No radius, padding or gap vocabulary exists, so these
       are proposals (origin "invented"), never errors. */
    .panel { padding: 24px; border-radius: 12px; }
    .row { display: flex; align-items: center; gap: 12px; }

    /* Published easing token on a silent duration. */
    .row { transition: background-color 200ms var(--ease-out-strong); }
  </style>
</head>

<!-- `pai` sets the Inter base font + brand text colour. The surface comes from
     a token utility, not template.html's inline #F5F5F7 (which is a near-miss
     for --bg-tertiary #F5F5F5 and would be an error). -->
<body class="pai bg-bg-tertiary" style="margin:0;">

  <main class="mx-auto p-8" style="max-width:880px;">

    <!-- Heading, type scale by class name. -->
    <h1 class="text-heading-2xl">Workspace settings</h1>

    <!-- Heading, same step of the same ramp written as a value. -->
    <h2 class="hero-title">Plan and billing</h2>

    <!-- Body copy on published text tokens. -->
    <p class="text-body-base-regular text-text-secondary">
      Manage the seats on this workspace and the plan they bill against.
    </p>

    <!-- Brand-coloured text, both ways: token utility and token reference. -->
    <p class="text-body-base-medium text-text-brand">Your renewal is on 14 Aug 2026.</p>
    <p class="brand-note text-body-sm-regular">Billing questions go to the workspace owner.</p>

    <!-- Component classes from pai.css, unmodified. No text-* utility is added
         alongside them, so no utility can out-specify the component's colour. -->
    <div class="row" style="margin-top:16px;">
      <button class="button-style button-medium button-primary">Upgrade plan</button>
      <button class="button-style button-medium button-secondary">Manage seats</button>
      <span class="pai-badge pai-badge-pro">PRO</span>
    </div>

    <!-- Elevated card. Published shadow + published surface + published type,
         all by name. p-6 / rounded-lg are Tailwind's own scale: silent
         properties, so proposals with origin "adopted". -->
    <div class="mt-6 p-6 rounded-lg bg-bg-elevated shadow-elevation-02">
      <p class="text-body-base-medium text-text-primary">Card on an elevated surface.</p>
      <p class="text-body-sm-regular text-text-secondary mt-1">Secondary supporting copy.</p>
    </div>

    <!-- Same thing written in CSS instead of utilities: elevation-03 by token,
         plus an invented padding and radius. -->
    <section class="panel" style="margin-top:24px;">
      <p class="text-body-lg-medium">Seats</p>
      <p class="text-body-base-regular text-text-secondary">7 of 10 used.</p>
    </section>

    <!-- Published gradient. THE TRAP AGAIN: gradients are published only as
         Tailwind class names, so this is the only way to reference one.
         The type step is heading-2xl (24px) rather than body-lg (18px) on
         purpose: white on gradient-01's lightest stop is 3.39:1, which clears
         AA for large text and does not clear it for body. -->
    <div class="mt-6 p-6 rounded-lg bg-gradient-01">
      <p class="text-heading-2xl text-text-white">Try Pro for your whole team.</p>
    </div>

  </main>

</body>
</html>
