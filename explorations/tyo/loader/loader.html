<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loader — tuner</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f4f4f6;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a1a2e;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 32px; }

  /* ============ Loader ============ */
  .loader {
    --blue: #2f2be5;
    width: 120px;
    height: 120px;
    position: relative;
    background: #fff;
    overflow: hidden;
    transform-origin: center;
  }
  .loader .bar {
    position: absolute;
    left: 21px;
    background: var(--blue);
    animation: cascade var(--speed, 1.8s) infinite;
    will-change: top, width, height, opacity;
  }
  .loader .bar:nth-child(2) { animation-delay: calc(var(--speed, 1.8s) / -3); }
  .loader .bar:nth-child(3) { animation-delay: calc(var(--speed, 1.8s) * -2 / 3); }

  /* ============ Config panel ============ */
  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 4px 16px rgba(20, 20, 60, .08);
    display: grid;
    grid-template-columns: 110px 1fr 52px;
    gap: 10px 12px;
    align-items: center;
    width: min(420px, 86vw);
  }
  .panel h2 { grid-column: 1 / -1; margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6b6b80; }
  .panel label { font-weight: 500; }
  .panel output { text-align: right; font-variant-numeric: tabular-nums; color: #6b6b80; }
  .panel input[type=range] { width: 100%; accent-color: #2f2be5; }
  .panel .row-color { display: flex; gap: 8px; align-items: center; grid-column: 2 / -1; }
  .panel input[type=color] { width: 36px; height: 24px; border: none; padding: 0; background: none; cursor: pointer; }
  .panel select { grid-column: 2 / -1; padding: 5px 8px; border: 1px solid #d8d8e2; border-radius: 8px; background: #fafafc; font: inherit; }
  .panel button {
    grid-column: 1 / -1; margin-top: 6px; padding: 7px 0;
    border: 1px solid #d8d8e2; border-radius: 8px; background: #fafafc;
    cursor: pointer; font: inherit;
  }
  .panel button:hover { background: #f0f0f6; }
  .panel code { grid-column: 1 / -1; font-size: 11px; color: #9a9aae; word-break: break-all; }
</style>
</head>
<body>
<div class="stage">
  <div class="loader" id="loader" role="status" aria-label="Loading">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <form class="panel" id="panel">
    <h2>Loader config</h2>

    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0.6" max="4" step="0.1" value="1.8">
    <output for="speed">1.8s</output>

    <label for="hold">Hold / pause</label>
    <input type="range" id="hold" min="0" max="60" step="1" value="31">
    <output for="hold">31%</output>

    <label for="slant">Slant</label>
    <input type="range" id="slant" min="0" max="40" step="1" value="25">
    <output for="slant">25%</output>

    <label for="scale">Size</label>
    <input type="range" id="scale" min="0.5" max="3" step="0.1" value="1">
    <output for="scale">120px</output>

    <label for="easing">Easing</label>
    <select id="easing">
      <option value="cubic-bezier(0.45,0,0.2,1)" selected>Smooth (Figma-like)</option>
      <option value="cubic-bezier(0.7,0,0.3,1)">Snappy</option>
      <option value="cubic-bezier(0.34,1.56,0.64,1)">Overshoot / spring</option>
      <option value="ease-in-out">Ease in-out</option>
      <option value="ease-out">Ease out</option>
      <option value="ease-in">Ease in</option>
      <option value="ease">Ease</option>
      <option value="linear">Linear</option>
      <option value="steps(1,end)">Hard cut (steps)</option>
    </select>

    <label>Color</label>
    <div class="row-color">
      <input type="color" id="color" value="#2f2be5">
      <span id="colorHex">#2f2be5</span>
    </div>

    <button type="button" id="reset">Reset to Figma defaults</button>
    <code id="summary"></code>
  </form>
</div>

<script>
  const loader = document.getElementById('loader');
  const dyn = document.head.appendChild(document.createElement('style'));
  const $ = id => document.getElementById(id);
  const inputs = { speed: $('speed'), hold: $('hold'), slant: $('slant'), scale: $('scale'), easing: $('easing'), color: $('color') };
  const DEFAULTS = { speed: 1.8, hold: 31, slant: 25, scale: 1, easing: 'cubic-bezier(0.45,0,0.2,1)', color: '#2f2be5' };

  // Bar lifecycle states from the Figma prototype frames (120px tile):
  // enter tiny bottom (hidden) -> small mid -> big top -> tiny top (hidden)
  const STATES = [
    { top: 101, w: 20, h: 15, o: 0 },
    { top:  69, w: 45, h: 33, o: 1 },
    { top:  21, w: 72, h: 54, o: 1 },
    { top:  21, w: 16, h: 12, o: 0 },
  ];

  function render() {
    const speed = +inputs.speed.value;
    const hold  = +inputs.hold.value;        // % of each step spent paused
    const slant = +inputs.slant.value;       // parallelogram slant, % of bar height
    const scale = +inputs.scale.value;
    const color = inputs.color.value;

    // Each of the 3 steps spans 33.33% of the cycle; the move occupies
    // the first (100 - hold)% of the step, then the state holds.
    const step = 100 / 3;
    const kf = (s) => `top:${s.top}px;width:${s.w}px;height:${s.h}px;opacity:${s.o};`;
    const ease = `animation-timing-function:${inputs.easing.value};`;
    const arrive = i => (i * step + step * (100 - hold) / 100).toFixed(2);

    dyn.textContent = `
      @keyframes cascade {
        0% { ${kf(STATES[0])} ${ease} }
        ${arrive(0)}%, ${step.toFixed(2)}% { ${kf(STATES[1])} ${ease} }
        ${arrive(1)}%, ${(2 * step).toFixed(2)}% { ${kf(STATES[2])} ${ease} }
        ${arrive(2)}%, 100% { ${kf(STATES[3])} }
      }
      .loader .bar { clip-path: polygon(0% ${slant}%, 100% 0%, 100% ${100 - slant}%, 0% 100%); }
    `;
    loader.style.setProperty('--speed', speed + 's');
    loader.style.setProperty('--blue', color);
    loader.style.transform = `scale(${scale})`;

    // Restart bars so new keyframes apply cleanly
    loader.querySelectorAll('.bar').forEach(b => { b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; });

    document.querySelector('output[for=speed]').textContent = speed.toFixed(1) + 's';
    document.querySelector('output[for=hold]').textContent = hold + '%';
    document.querySelector('output[for=slant]').textContent = slant + '%';
    document.querySelector('output[for=scale]').textContent = Math.round(120 * scale) + 'px';
    $('colorHex').textContent = color;
    $('summary').textContent = `speed:${speed}s hold:${hold}% slant:${slant}% size:${Math.round(120 * scale)}px easing:${inputs.easing.value} color:${color}`;
  }

  Object.values(inputs).forEach(el => el.addEventListener('input', render));
  $('reset').addEventListener('click', () => {
    Object.entries(DEFAULTS).forEach(([k, v]) => inputs[k].value = v);
    render();
  });
  render();
</script>
</body>
</html>
