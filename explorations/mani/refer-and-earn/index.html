<!doctype html>
<!-- exploration: Refer & earn · owner: Mani (@manivasakan-arch)
     Separate link for the referral flows. Same source as community-templates/index.html,
     opened with ?mode=refer so only the Free and Pro referral journeys show. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refer and earn</title>
<script>
  // Keep any extra params (e.g. ?j=p or ?s=refer) and default to a fresh Free user flow.
  var q = new URLSearchParams(location.search);
  q.set('mode', 'refer');
  if (!q.has('j') && !q.has('s')) q.set('j', 'f');
  if (!q.has('keep')) q.set('reset', '');
  location.replace('../community-templates/index.html?' + q.toString().replace('reset=', 'reset'));
</script>
</head>
<body style="font-family:Inter,system-ui,sans-serif;background:#fff;color:#525252;padding:24px">Opening Refer and earn…</body>
</html>
