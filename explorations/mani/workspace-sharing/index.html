<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace sharing</title>
<!-- Dashboard, projects, folders and the Share modal, built on Sharing rules v2 (explorations/mani/sharing-rules/v2). -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .ph, .ph-fill { font-size: 20px; line-height: 1; }

  /* Shell */
  .app { display: flex; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 24px 160px; }
  .ws-sw { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border: 0; background: none; border-radius: var(--r-control); cursor: pointer; text-align: left; }
  .ws-sw:hover { background: rgb(var(--sunken)); }
  .ws-tile { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }
  .ws-tile.team { background: #1baf7a; }
  .ws-sw b { display: block; font-size: 14px; font-weight: 600; }
  .ws-sw small { display: block; font-size: 12px; color: rgb(var(--ink-3)); }
  .ws-sw .ph { margin-left: auto; font-size: 16px; color: rgb(var(--ink-3)); }
  .side .new { width: 100%; margin: 12px 0 8px; }
  .nav-item { width: 100%; border: 0; background: none; cursor: pointer; text-align: left; }
  .nav-item .ph, .nav-item .ph-fill { font-size: 20px; }
  .nav-item .ct { margin-left: auto; font-size: 12px; color: rgb(var(--ink-3)); font-variant-numeric: tabular-nums; }
  .cap { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 4px; padding: 0 4px 0 10px; }
  .cap .icon-btn { width: 28px; height: 28px; }
  .cap .icon-btn .ph { font-size: 16px; }
  .cap a.eyebrow { cursor: pointer; text-decoration: none; border-radius: 4px; transition: color .15s var(--ease); }
  .cap a.eyebrow:hover, .cap a.eyebrow[aria-current] { color: rgb(var(--ink)); }
  .proj-row .acc-i { margin-left: auto; font-size: 14px; color: rgb(var(--ink-3)); }
  .side-empty { padding: 6px 10px; font-size: 13px; color: rgb(var(--ink-3)); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .plan-card { background: rgb(var(--cream)); border-radius: var(--r-card); padding: 12px; margin-bottom: 4px; }
  .plan-card .row { display: flex; justify-content: space-between; font-size: 13px; }
  .plan-card b { font-weight: 600; }
  .plan-card small { display: block; margin-top: 8px; font-size: 12px; color: rgb(var(--ink-2)); }
  .plan-card .progress { margin-top: 6px; }
  .plan-card .see-plans { width: 100%; margin-top: 10px; background: #ECEBFF; color: #3427FF; border: 0; }
  .plan-card .see-plans:hover { background: #DCD9FF; }

  .topbar { justify-content: flex-start; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; flex: 1; max-width: 448px; padding: 0 12px; border: 1px solid rgb(var(--line)); background: rgb(var(--canvas)); border-radius: var(--r-control); color: rgb(var(--ink-3)); cursor: pointer; }
  .search .ph { font-size: 16px; }
  .search .kbd { margin-left: auto; }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .credits { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; color: rgb(var(--ink-2)); }
  .credits .progress { width: 48px; }
  .credits b { color: rgb(var(--ink)); font-weight: 500; }
  .bell { position: relative; }
  .bell .dot { position: absolute; right: 6px; top: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: rgb(var(--brand-600)); color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-weight: 600; }
  .burger { display: none; }

  /* Avatars */
  .av { display: inline-grid; place-items: center; border-radius: 50%; background: rgb(var(--brand-50)); color: rgb(var(--brand-fg)); font-weight: 600; flex-shrink: 0; letter-spacing: 0; }
  .av.own { background: rgb(var(--brand-600)); color: #fff; }
  .av.ext { background: rgb(var(--sunken)); color: rgb(var(--ink-2)); }
  .av.all { background: rgb(var(--good-bg)); color: rgb(var(--good)); }
  .av.priv { background: rgb(var(--warn-bg)); color: rgb(var(--warn)); }
  .stack { display: flex; }
  .stack .av { box-shadow: 0 0 0 2px rgb(var(--canvas)); }
  .stack .av + .av { margin-left: -8px; }

  /* Page header */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: rgb(var(--ink-3)); margin-bottom: 8px; }
  .crumbs a { text-decoration: none; cursor: pointer; }
  .crumbs a:hover { color: rgb(var(--ink)); }
  .crumbs .ph { font-size: 12px; }
  .ph-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .ph-head h1 { margin: 4px 0 0; }
  .ph-head h1.ttl { display: flex; align-items: center; gap: 12px; margin: 0; min-width: 0; }
  .ph-head h1.ttl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-head h1.ttl .ph-fill { font-size: 32px; flex-shrink: 0; }
  .ph-eb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgb(var(--ink-3)); }
  .ph-eb .ph { font-size: 16px; }
  .ph-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: rgb(var(--ink-2)); }
  .acc { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: rgb(var(--ink-2)); white-space: nowrap; max-width: 100%; }
  .acc .ph { font-size: 14px; }
  .acc.pill { height: 24px; padding: 0 8px; border-radius: 99px; background: rgb(var(--sunken)); }
  .acc.pill.pub { background: rgb(var(--good-bg)); color: rgb(var(--good)); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; margin: 40px 0 12px; }
  .sec-h h2 { margin: 0; }

  .note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-card); font-size: 13px; line-height: 18px; color: rgb(var(--ink-2)); background: rgb(var(--sunken)); }
  .note .ph { font-size: 18px; color: rgb(var(--ink-3)); flex-shrink: 0; margin-top: 0; }
  .note b { color: rgb(var(--ink)); font-weight: 600; }
  .note.warn { background: rgb(var(--warn-bg)); color: rgb(var(--ink)); }
  .note.warn .ph { color: rgb(var(--warn)); }
  .note.good { background: rgb(var(--good-bg)); color: rgb(var(--ink)); }
  .note.good .ph { color: rgb(var(--good)); }
  .note.brand { background: rgb(var(--brand-50) / .6); border: 1px solid rgb(var(--brand-600) / .3); color: rgb(var(--ink)); }
  .note.brand .ph { color: rgb(var(--brand-fg)); }
  .note .acts { margin-top: 10px; display: flex; gap: 8px; }
  .mt { margin-top: 24px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid rgb(var(--line)); margin-top: 40px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { position: relative; height: 40px; padding: 0 12px; border: 0; background: none; cursor: pointer; color: rgb(var(--ink-3)); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tabs button:hover { color: rgb(var(--ink-2)); }
  .tabs button.on { color: rgb(var(--ink)); font-weight: 500; }
  .tabs button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 99px; background: rgb(var(--brand-600)); }
  .tabs .n { padding: 0 6px; border-radius: 99px; background: rgb(var(--sunken)); font-size: 12px; font-variant-numeric: tabular-nums; color: rgb(var(--ink-2)); }
  .tab-body { margin-top: 20px; animation: fadeUp .18s var(--ease); }
  .still .deck, .still .pcard, .still .tab-body, .still .hero .bars span { animation: none; }

  /* Cards */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Home, as in the app dashboard (pitchdeckdoclist madhu_ui_v2) */
  .hero { position: relative; overflow: hidden; background: rgb(var(--surface)); border-radius: 16px; padding: 32px; }
  .hero h1 { max-width: 512px; margin: 0; }
  .hero p { max-width: 512px; margin: 8px 0 0; font-size: 16px; line-height: 24px; color: rgb(var(--ink-2)); }
  .hero .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .hero .acts .btn { height: 44px; padding: 0 20px 0 18px; font-size: 14px; }
  .hero .acts .btn .ph { font-size: 20px; }
  .hero .bars { position: absolute; right: -40px; top: 24px; width: 288px; height: 160px; pointer-events: none; }
  .hero .bars span { position: absolute; right: 0; height: 28px; border-radius: 99px; animation: barIn .6s var(--ease) both; }
  .hero .bars span:nth-child(1) { top: 0; width: 260px; background: #3427FF; opacity: .9; }
  .hero .bars span:nth-child(2) { top: 44px; width: 204px; background: #3566FE; opacity: .7; animation-delay: .06s; }
  .hero .bars span:nth-child(3) { top: 88px; width: 148px; background: #3427FF; opacity: .5; animation-delay: .12s; }
  @keyframes barIn { from { transform: translateX(40px); opacity: 0; } }
  @media (max-width: 900px) { .hero .bars { display: none; } }
  @media (max-width: 640px) { .hero { padding: 24px; } }
  .htabs { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 40px; border-bottom: 1px solid rgb(var(--line)); }
  .htabs .tabs { margin: 0 0 -1px; border: 0; }
  .hctl { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .hctl.hide { visibility: hidden; }
  .hctl select.input { height: 36px; width: auto; padding-left: 12px; }
  .vtg { display: flex; padding: 2px; border-radius: var(--r-control); background: rgb(var(--sunken)); }
  .vtg button { width: 32px; height: 32px; border: 0; border-radius: 5px; background: none; color: rgb(var(--ink-3)); display: grid; place-items: center; cursor: pointer; }
  .vtg button .ph { font-size: 16px; }
  .vtg button[aria-checked="true"] { background: rgb(var(--surface)); color: rgb(var(--ink)); box-shadow: 0 1px 2px rgb(9 15 21 / .12); }
  .hbody { margin-top: 20px; }
  .hbody .pgrid { margin-bottom: 16px; }
  .deck { position: relative; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: var(--r-card); overflow: hidden; cursor: pointer; transition: box-shadow .2s var(--ease); animation: fadeUp .25s var(--ease) both; }
  .deck:hover { box-shadow: var(--sh-menu); }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-bottom: 1px solid rgb(var(--line)); background: rgb(var(--sunken)); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .star { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgb(var(--surface) / .9); box-shadow: var(--sh-menu); display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s var(--ease); }
  .star .ph, .star .ph-fill { font-size: 16px; }
  .star.on { opacity: 1; color: #eda100; }
  .deck:hover .star, .star:focus-visible { opacity: 1; }
  .wid { position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 8px; border-radius: 99px; background: rgb(var(--surface) / .92); box-shadow: var(--sh-hairline); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: rgb(var(--good)); }
  .wid .ph { font-size: 14px; }
  .db { display: flex; align-items: flex-start; gap: 8px; padding: 14px; }
  .db .tx { flex: 1; min-width: 0; }
  .db b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db small { display: block; font-size: 13px; color: rgb(var(--ink-3)); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db .acc { margin-top: 8px; }
  .loc { display: inline-flex; align-items: center; gap: 4px; color: rgb(var(--ink-2)); font-weight: 500; text-decoration: none; }
  .loc:hover { color: rgb(var(--ink)); text-decoration: underline; }
  .loc .ph-fill { font-size: 13px; }
  .db .icon-btn { width: 32px; height: 32px; margin: -4px -6px 0 0; }

  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .pcard { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: var(--r-card); cursor: pointer; transition: box-shadow .2s var(--ease); text-align: left; animation: fadeUp .25s var(--ease) both; }
  .pcard:hover { box-shadow: var(--sh-menu); }
  .pcard .top { display: flex; align-items: center; gap: 10px; }
  .pcard .top .ph-fill { font-size: 24px; }
  .pcard .top b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .top .icon-btn { width: 32px; height: 32px; margin: -6px -8px -6px 0; }
  .pcard .bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pcard small { font-size: 13px; color: rgb(var(--ink-3)); }
  .pcard.add { border-style: dashed; background: rgb(var(--canvas)); color: rgb(var(--ink-3)); align-items: center; justify-content: center; flex-direction: row; min-height: 104px; font-size: 13px; }
  .pcard.add:hover { color: rgb(var(--ink)); border-color: rgb(var(--ink-3) / .5); box-shadow: none; }

  .empty { border: 1px dashed rgb(var(--line)); border-radius: var(--r-card); padding: 56px 24px; text-align: center; }
  .empty .ic { width: 44px; height: 44px; border-radius: 50%; background: rgb(var(--sunken)); color: rgb(var(--ink-3)); display: inline-grid; place-items: center; }
  .empty b { display: block; margin-top: 12px; font-weight: 600; }
  .empty small { display: block; max-width: 400px; margin: 4px auto 0; font-size: 13px; color: rgb(var(--ink-3)); }
  .empty .btn { margin-top: 16px; }

  /* Table (Shared with me, Trash) */
  .tbl { border: 1px solid rgb(var(--line)); border-radius: var(--r-card); background: rgb(var(--surface)); overflow-x: auto; }
  .tbl table { width: 100%; min-width: 640px; border-collapse: collapse; }
  .tbl th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--ink-3)); border-bottom: 1px solid rgb(var(--line)); }
  .tbl td { padding: 10px 16px; border-bottom: 1px solid rgb(var(--line)); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr { cursor: pointer; }
  .tbl tbody tr:hover { background: rgb(var(--sunken) / .6); }
  .tbl .nm { display: flex; align-items: center; gap: 12px; }
  .tbl .nm img { width: 64px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 1px rgb(var(--line)); }
  .tbl .fic { width: 64px; height: 36px; border-radius: 4px; background: rgb(var(--sunken)); display: grid; place-items: center; }
  .tbl .muted { color: rgb(var(--ink-3)); font-size: 13px; }
  .tbl .who { display: flex; align-items: center; gap: 8px; font-size: 13px; }

  .files { list-style: none; margin: 0; padding: 0 16px; border: 1px solid rgb(var(--line)); border-radius: var(--r-card); background: rgb(var(--surface)); }
  .files li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .files li + li { border-top: 1px solid rgb(var(--line)); }
  .files .fi { width: 36px; height: 36px; border-radius: var(--r-control); background: rgb(var(--sunken)); display: grid; place-items: center; flex-shrink: 0; }
  .files .tx { flex: 1; min-width: 0; }
  .files b { display: block; font-weight: 500; }
  .files small { display: block; font-size: 13px; color: rgb(var(--ink-3)); }
  .files .icon-btn { width: 32px; height: 32px; }
  .files .icon-btn .ph { font-size: 16px; }

  /* Deck screen */
  /* Editor: exact chrome of the app editor redesign (pitchdeckdoclist, TopMenu / SlideRail / SlideCounter / Floater) */
  .ed { --e-brand: #3427FF; --e-brand-h: #2A1FD6; --e-brand-50: #ECEBFF; --e-ink: #14141F; --e-ink-2: #4E4E5E; --e-ink-3: #6C6C7C; --e-line: #E4E4EC; --e-line-h: rgba(20,20,31,.2); --e-hover: #F3F3F7; --e-canvas: #F8F8FB;
    --e-menu: 0 1px 2px 0 rgba(16,12,60,.06), 0 8px 24px -6px rgba(9,15,21,.16);
    flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; background: var(--e-canvas); color: var(--e-ink);
    font-family: -apple-system, system-ui, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
  .ed svg.hi { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ed svg.hi.s16 { width: 16px; height: 16px; }
  .ed-top { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px; border-bottom: 1px solid var(--e-line); background: #fff; flex: none; }
  .e-ib { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; border: 0; background: none; border-radius: 6px; color: var(--e-ink-2); cursor: pointer; transition: background-color .15s, color .15s; }
  .e-ib:hover:not(:disabled) { background: var(--e-hover); color: var(--e-ink); }
  .e-ib:disabled { opacity: .4; cursor: default; }
  .e-div { width: 1px; height: 24px; margin: 0 4px; background: var(--e-line); flex: none; }
  .e-title { height: 36px; min-width: 0; max-width: 260px; flex: 1; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-weight: 600; color: var(--e-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
  .e-title:hover, .e-title:focus { background: var(--e-hover); }
  .e-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .e-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: background-color .15s, border-color .15s, color .15s; }
  .e-btn.ic-l { padding-left: 12px; }
  .e-btn .ph { font-size: 16px; }
  .e-btn.sec { background: #fff; color: var(--e-ink); border-color: var(--e-line); }
  .e-btn.sec:hover { border-color: var(--e-line-h); background: var(--e-hover); }
  .e-btn.pri { background: var(--e-brand); color: #fff; box-shadow: inset 0 1px 0 0 rgba(255,255,255,.15), 0 1px 2px 0 rgba(16,12,60,.2); }
  .e-btn.pri:hover { background: var(--e-brand-h); }
  .e-btn.ghost { color: var(--e-ink-2); background: none; }
  .e-btn.ghost:hover { color: var(--e-ink); background: var(--e-hover); }
  .e-btn.upg { background: #fff; color: var(--e-brand); border-color: var(--e-brand); }
  .e-btn.upg:hover { background: var(--e-brand-50); }
  .e-btn.sm { height: 32px; padding: 0 12px; gap: 6px; font-size: 13px; line-height: 18px; }
  .e-meter { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 6px; font-size: 13px; line-height: 18px; color: var(--e-ink-2); }
  .e-meter .tr { width: 48px; height: 6px; border-radius: 99px; background: var(--e-line); overflow: hidden; }
  .e-meter .tr span { display: block; height: 100%; background: var(--e-brand); border-radius: 99px; }
  .e-meter b { font-weight: 500; color: var(--e-ink); font-variant-numeric: tabular-nums; }
  .ed-note { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--e-ink-2); background: var(--e-brand-50); border-bottom: 1px solid var(--e-line); }
  .ed-note .ph { font-size: 16px; color: var(--e-brand); }
  .ed-body { flex: 1; min-height: 0; display: flex; }
  .ed-rail { width: 208px; flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--e-line); background: #fff; }
  .ed-rail .rs { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 12px; scrollbar-width: none; }
  .ed-rail .rh { position: sticky; top: 0; z-index: 2; background: #fff; padding: 8px 8px 12px; }
  .ed-rail .rh .e-btn { width: 100%; }
  .ed-rail .rl { display: flex; flex-direction: column; padding: 4px 8px 0 4px; }
  .e-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .e-row .n { width: 14px; flex: none; padding-top: 2px; text-align: right; font-size: 12px; line-height: 16px; letter-spacing: .01em; font-variant-numeric: tabular-nums; color: var(--e-ink-3); }
  .e-row .cd { position: relative; display: block; width: 170px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--e-line); transition: box-shadow .15s; }

document.addEventListener('change', e => {

document.addEventListener('submit', e => {
