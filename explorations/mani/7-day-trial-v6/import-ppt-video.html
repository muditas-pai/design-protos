<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Import PowerPoint</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* Figma FilrWEhw4GFBJqKUpKabCa node 1178-21215 ("free trail", modal frame 1176x620) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .backdrop { position: fixed; inset: 0; background: rgba(10,25,37,0.45); display: flex; align-items: center; justify-content: center; }

  .dp-stack { position: relative; display: flex; gap: 10px; align-items: flex-start; }

  /* entrance: scrim fades, the box rises and settles, close follows */
  @keyframes dp-bd-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dp-box-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  .backdrop { animation: dp-bd-in .25s ease backwards; }
  .dp-box { animation: dp-box-in .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .dp-close { animation: dp-bd-in .3s .15s ease backwards; }
  body.embed { background: transparent; }
  body.embed .backdrop { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  body.embed .tier-bar { display: none; }
  /* bare: inline inside a white canvas (editor blocker). No scrim, no close button. */
  body.bare .backdrop { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.bare .dp-close { display: none; }
  /* embed fit: scale the whole stack down when the frame is smaller than the design */
  .dp-stack { transform: scale(var(--fit, 1)); transform-origin: center center; }
  .dp-close { transition: background 0.15s ease; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 0; border-radius: 24px; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.18); color: #171717; font-size: 15px; }
  .dp-close:hover { background: #ececec; }
  .dp-box { position: relative; width: 1176px; background: #fff; border-radius: 4px; overflow: hidden; flex: none; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.3); }
  .dp-body { display: flex; height: 620px; }

  /* proto switch: tier 1 (trial + 20% off) vs tier 2 (no trial, full price) */
  .tier-bar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 6px 18px -6px rgba(10,25,37,0.35); }
  .tier-bar button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 150px; padding: 6px 16px; border: 0; border-radius: 999px; background: transparent; font-family: inherit; color: #525252; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tier-bar button b { font-size: 12.5px; font-weight: 600; }
  .tier-bar button small { font-size: 10.5px; font-weight: 400; color: #8a8a8a; }
  .tier-bar button:hover:not(.is-on) { background: #f0f2f5; }
  .tier-bar button.is-on { background: #171717; color: #fff; }
  .tier-bar button.is-on small { color: rgba(255,255,255,0.65); }

  /* "before you go" eyebrow: slides in above the modal body when tier 2 is closed */
  .eyebrow { position: absolute; left: 20px; width: 1136px; top: -38px; height: 50px; z-index: 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px 12px; border-radius: 8px 8px 0 0; background: #e8f0fe; color: #1c2b3a; font-size: 12.5px; white-space: nowrap; transform: translateY(38px); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s ease; }
  .eyebrow.is-open { transform: none; opacity: 1; }
  .dp-box { z-index: 1; }
  .card.is-flash { animation: c-flash .9s ease; }
  @keyframes c-flash { 30% { box-shadow: 0 0 0 4px rgba(0,94,255,0.25); } }

  body.tier2 #btn-trial, body.tier2 #note-trial, body.tier2 .or { display: none; }
  body.tier2 .ctas { margin-top: 24px; }

  .closed-note { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; font-size: 14px; }
  .closed-note button { padding: 9px 18px; border: 0; border-radius: 4px; background: #fff; color: #171717; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  body.is-closed .dp-stack { display: none; }
  body.is-closed .closed-note { display: flex; }

  /* left */
  .pane-l { width: 806px; flex: none; padding: 22px 0 0 24px; display: flex; flex-direction: column; }
  .ttl-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; min-height: 30px; }
  .ttl { font-size: 18px; font-weight: 500; line-height: 1.3; }
  .ttl .off { display: none; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
  .dp-pill { position: relative; display: none; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .dp-pill::before { content: ''; position: absolute; left: -3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; background: #00225C; border-radius: 1px; transform: rotate(45deg); z-index: -1; }
  .dp-pill .sep { opacity: 0.5; font-weight: 400; }
  .dp-pill .t { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; opacity: 0.95; font-variant-numeric: tabular-nums; }
  .dp-pill .t i { font-size: 13px; }
  body.offer .ttl .off { display: inline; }
  body.offer .dp-pill { display: inline-flex; animation: pill-in 0.5s 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, pill-bob 1.6s 0.7s ease-in-out infinite, pill-ripple 2.2s 0.7s ease-in-out infinite; }
  @keyframes pill-bob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
  @keyframes pill-in { from { opacity: 0; transform: translateX(-10px) scale(0.9); } to { opacity: 1; transform: none; } }
  @keyframes pill-ripple {
    0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0.55); }
    70%      { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 10px rgba(0,85,237,0); }
    100%     { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0); }
  }

  .preview { position: relative; width: 762px; height: 430px; border-radius: 8px; overflow: hidden; background: #0b1fbb; flex: none; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 8px 24px -12px rgba(10,25,37,0.35); }
  .preview::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; }
  .preview .pv-item { position: absolute; inset: 0; opacity: 0; transform: scale(1.02); transition: opacity .55s ease, transform .9s ease; }
  .preview .pv-item.is-on { opacity: 1; transform: scale(1); }
  .preview img, .preview video { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center; }
  .avail { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-radius: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(10,25,37,0.15); font-size: 12.5px; color: #404040; }
  #avail-pills { display: inline-flex; align-items: center; gap: 8px; }
  .tp-group { display: inline-flex; align-items: center; gap: 6px; }
  .tp-note { font-size: 11.5px; color: #737373; margin-left: 2px; white-space: nowrap; }
  .tp-sep { width: 1px; height: 14px; background: rgba(10,25,37,0.15); margin: 0 2px; }
  .avail .tp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .avail .tp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .avail .tp--pro  { color: #0055ED; }
  .avail .tp--gold { color: #c9932a; }
  .avail .tp--team { color: #171717; }
  .avail .tp--free { color: #16a34a; }

  .tabs-wrap { position: relative; margin: 18px 0 0 -24px; width: 806px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); }
  .tabs { display: flex; gap: 10px; padding: 0 24px; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; scroll-behavior: smooth; touch-action: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #e5e5e5; background: #fff; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #404040; cursor: pointer; white-space: nowrap; overflow: hidden; transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease; }
  .tab i { font-size: 16px; color: #737373; transition: color .2s ease; }
  .tab:hover { border-color: #c9cdd2; color: #171717; }
  .tab:focus, .tab:focus-visible { outline: none; }
  .tab.is-on { background: #fff; border-color: #cfe0ff; color: #0055ED; }
  .tab.is-on i { color: #0055ED; }
  .tab .fill { position: absolute; inset: 0; background: #e8f0fe; transform: scaleX(0); transform-origin: left center; pointer-events: none; }
  .tab > i, .tab > span { position: relative; z-index: 1; }

  .foot-l { margin: auto 0 0 -24px; width: 806px; height: 66px; border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 22px; padding: 0 24px; overflow: hidden; }
  .foot-l .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #404040; white-space: nowrap; flex: none; }
  .foot-l .loved img { height: 16px; width: auto; }
  .sp-wrap { flex: 1; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 34px; width: auto; max-width: 120px; object-fit: contain; }

  /* right */
  .pane-r { width: 370px; flex: none; background: #f5f9ff; border-left: 1px solid rgba(10,25,37,0.06); padding: 64px 20px 0; display: flex; flex-direction: column; }
  .card { position: relative; display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px 18px 14px; cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  .card + .card { margin-top: 12px; }
  @keyframes dp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card, .ctas, .foot-r { animation: dp-rise .4s cubic-bezier(.2,.8,.2,1) backwards; }
  .card:nth-child(1) { animation-delay: .12s; } .card:nth-child(2) { animation-delay: .18s; } .card:nth-child(3) { animation-delay: .24s; } .ctas { animation-delay: .3s; } .foot-r { animation-delay: .36s; }
  .card:active { transform: scale(0.99); }
  .card.is-sel { border-color: #005eff; box-shadow: inset 0 0 0 0.5px #005eff, 0 0 0 3px rgba(0,94,255,0.08); background: #eaf2ff; }
  .card.is-sel .c-cred { background: #d6e5ff; }
  .card:hover:not(.is-sel) { border-color: #c9cdd2; transform: translateY(-1px); box-shadow: 0 4px 12px -6px rgba(10,25,37,0.2); }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #d4d4d4; background: #fff; margin-top: 3px; flex: none; transition: border .15s ease; }
  .card:hover:not(.is-sel) .radio { border-color: #a3a3a3; }
  .is-sel .radio { border: 5px solid #005eff; }
  .c-main { flex: 1; min-width: 0; }
  .c-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .c-name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .c-name i { font-size: 16px; }
  .c-price { font-size: 16px; font-weight: 500; white-space: nowrap; }
  .c-price s { color: #a3a3a3; font-weight: 400; margin-right: 5px; }
  .c-price small { display: block; font-size: 11px; font-weight: 400; color: #737373; text-align: right; margin-top: 2px; }
  .c-cred { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: #e8f0fe; color: #0055ED; font-size: 12px; font-weight: 500; }
  .c-cred i { font-size: 11px; }

  .ctas { margin-top: 20px; }
  .note { margin-top: 7px; text-align: center; font-size: 11.5px; line-height: 1.45; color: #737373; white-space: nowrap; }
  .note b { font-weight: 500; color: #404040; }
  .note .blue { font-weight: 500; color: #005eff; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; border-radius: 4px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .15s ease; }
  .btn:active { transform: translateY(0); }
  .btn--trial { background: #fff; border: 1px solid #e5e5e5; color: #171717; }
  .btn--trial:hover { background: #f5f5f5; border-color: #d4d4d4; color: #171717; }
  .or { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: #a3a3a3; font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: rgba(10,25,37,0.1); }
  .btn--buy { background: #171717; border: 0; color: #fff; }
  .btn--buy:hover { background: #000; box-shadow: 0 2px 8px rgba(10,25,37,0.2); transform: translateY(-1px); }

  .foot-r { margin-top: auto; height: 66px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12px; font-weight: 500; color: #525252; white-space: nowrap; }
  .foot-r span { display: inline-flex; align-items: center; gap: 6px; }
  .foot-r img { height: 18px; width: auto; }

  /* import flow: file bubble + steps behind, modal rises once the slides are read */
  body { background: #fff; }
  .stage { position: relative; max-width: 900px; margin: 0 auto; min-height: 100vh; padding: 56px 32px 40px; display: flex; flex-direction: column; }
  .bubble { align-self: flex-end; background: #f3f4f6; border-radius: 14px; padding: 8px; animation: st-rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .file { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 10px; padding: 10px 14px 10px 10px; min-width: 280px; }
  .file-ic { position: relative; width: 34px; height: 40px; border-radius: 6px; background: #f5f5f5; border: 1px solid #e5e5e5; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #737373; }
  .file-ic .ok { position: absolute; top: -8px; left: -8px; width: 16px; height: 16px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .file-name { font-size: 13px; color: #171717; }
  .steps { margin-top: 44px; display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #171717; opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease; }
  .step.is-in { opacity: 1; transform: none; }
  .step .dot { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; color: #fff; background: #16a34a; }
  .step .dot.spin { background: transparent; border: 2px solid #d4d4d4; border-top-color: #171717; animation: st-spin .8s linear infinite; }
  @keyframes st-spin { to { transform: rotate(360deg); } }
  @keyframes st-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .backdrop { display: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  body.is-plan .backdrop { display: flex; }
  .ttl b { font-weight: 600; }
  .c-ok { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 12.5px; color: #16a34a; }
  .c-ok i { font-size: 14px; }
  .c-ok .lim { color: #737373; margin-left: 4px; }
  .free { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(11,15,20,0.07); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; font-family: inherit; font-size: 13px; color: #525252; cursor: pointer; }
  .free:hover { color: #005eff; }
  .free .sub { color: #a3a3a3; }
  .ctas { margin-top: 24px; }
</style>
</head>
<body>

<div class="stage">
  <div class="bubble">
    <div class="file">
      <span class="file-ic">.pptx<span class="ok"><i class="ph ph-check"></i></span></span>
      <span class="file-name" id="file-name">chetan deck.pptx</span>
    </div>
  </div>
  <div class="steps">
    <div class="step" id="s1"><span class="dot spin"></span>Uploaded your content</div>
    <div class="step" id="s2"><span class="dot spin"></span>Read your slides</div>
  </div>
</div>

<div class="backdrop">
  <div class="closed-note"><span>Modal closed.</span><button type="button" id="reopen">Reopen</button></div>
  <div class="dp-stack">
    <div class="dp-box">
      <div class="dp-body">

      <div class="pane-l">
        <div class="ttl-row">
          <h2 class="ttl" id="ttl">Your PPT has <b id="n-slides">24</b> slides. Free Plan supports up to <b>15</b> slides.</h2>
        </div>
        <div class="preview" id="preview">
          <div class="avail"><span>Available on:</span><span id="avail-pills"></span></div>
        </div>
        <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
        <div class="foot-l">
          <span class="loved"><img src="../pricing/assets/checkout/badge-heart.svg" alt="" />Loved by 12M+ Presenters at</span>
          <span class="sp-wrap"><span class="sp-track" id="sp-track"></span></span>
        </div>
      </div>

      <div class="pane-r">
        <div id="cards"></div>
        <div class="ctas">
          <button type="button" class="btn btn--buy" id="btn-buy">Buy Pro</button>
          <button type="button" class="free" id="btn-free"><i class="ph ph-file-text"></i>Continue with Free Plan<span class="sub">Use only first 15 slides</span></button>
        </div>
        <div class="foot-r">
          <span><img src="../pricing/assets/checkout/badge-gdpr.svg" alt="" />GDPR compliant</span>
          <span><img src="../pricing/assets/checkout/badge-soc2.svg" alt="" />SOC 2 Type II</span>
        </div>
      </div>

      </div>
    </div>
    <button type="button" class="dp-close" id="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>
</div>

<script>
  // Same feature list and media as the feature modal. Plays through on its own, one by one.
  const FEATURES = [
    { key: 'export',    label: 'Export presentations',   icon: 'ph-export',            dots: ['pro','gold','team'], video: 'trigger_export' },
    { key: 'brandkit',  label: 'Brand kit',              icon: 'ph-swatches',          dots: ['pro','gold','team'], video: 'trigger_brandkit', mp4Only: true },
    { key: 'knowledge', label: 'Shared knowledge base',  icon: 'ph-book-open',         dots: ['gold','team'],       video: 'trigger_knowledge', mp4Only: true },
    { key: 'team',      label: 'Collaborations',         icon: 'ph-users-three',       dots: ['team'],              video: 'trigger_assign_invite', mp4Only: true },
    { key: 'ultra',     label: 'Ultra/Pro AI model',     icon: 'ph-sparkle',           dots: ['pro','gold','team'], groups: [{ note: 'Pro model', tiers: ['pro'] }, { note: 'Ultra model', tiers: ['gold','team'] }], img: 'triggeraimodels.jpg' },
    { key: 'analytics', label: 'Analytics',              icon: 'ph-chart-bar',         dots: ['pro','gold','team'], video: 'trigger_analytics' },
    { key: 'projects',  label: 'Projects',               icon: 'ph-folder',            dots: ['pro','gold','team'], img: 'triggerproject.jpg' },
    { key: 'fontpair',  label: 'Color and Font pair',    icon: 'ph-text-aa',           dots: ['pro','gold','team'], video: 'trigger_fontpair', mp4Only: true },
    { key: 'present',   label: 'Meet and present',       icon: 'ph-projector-screen',  dots: ['pro','gold','team'], img: 'triggercolorsmeetandpresent.jpg' },
    { key: 'meetedit',  label: 'Meet and edit',          icon: 'ph-pencil-simple',     dots: ['pro','gold','team'], img: 'triggermeetandedit.jpg' },
  ];
  // ?feat=projects → that feature plays first, then Export and the rest in order
  (function () {
    const want = new URLSearchParams(location.search).get('feat');
    const at = FEATURES.findIndex((f) => f.key === want);
    if (at > 0) FEATURES.unshift(FEATURES.splice(at, 1)[0]);
  })();
  const PLANS = [
    { key: 'pro',  name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  base: 20, off: 16, slides: 60 },
    { key: 'gold', name: 'Gold', icon: 'ph-sketch-logo',       credits: '25,000', base: 50, off: 40, slides: 99 },
    { key: 'team', name: 'Team', icon: 'ph-users-three',   credits: '30,000', base: 60, off: 50, slides: 99 },
  ];
  // file bubble + steps first, then the plan modal
  const q0 = new URLSearchParams(location.search);
  if (q0.get('file')) document.getElementById('file-name').textContent = q0.get('file');
  if (q0.get('slides')) document.getElementById('n-slides').textContent = q0.get('slides');
  const N_SLIDES = Number(document.getElementById('n-slides').textContent) || 24;
  (function () {
    const done = (el) => { el.classList.add('is-in'); const d = el.querySelector('.dot'); d.classList.remove('spin'); d.innerHTML = '<i class="ph ph-check"></i>'; };
    const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
    const fast = q0.get('fast') === '1';
    const t = (ms) => fast ? 0 : ms;
    setTimeout(() => s1.classList.add('is-in'), t(250));
    setTimeout(() => done(s1), t(1000));
    setTimeout(() => s2.classList.add('is-in'), t(1150));
    setTimeout(() => done(s2), t(2100));
    setTimeout(() => document.body.classList.add('is-plan'), t(2500));
  })();
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  const IMG_HOLD = 3500;
  const VIDEO_MAX = 25000; // safety cap only, videos advance on 'ended'
  const MEDIA = '../pricing/assets/feature-modal/';

  // logos marquee
  document.getElementById('sp-track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="../pricing/assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');

  // preview items + tabs
  const preview = document.getElementById('preview');
  const avail = preview.querySelector('.avail');
  const pills = document.getElementById('avail-pills');
  const tabs = document.getElementById('tabs');
  const items = FEATURES.map((f) => {
    const el = document.createElement('div');
    el.className = 'pv-item';
    el.innerHTML = f.video
      ? '<video muted playsinline preload="auto">' + (f.mp4Only ? '' : '<source src="' + MEDIA + f.video + '.webm" type="video/webm" />') + '<source src="' + MEDIA + f.video + '.mp4" type="video/mp4" /></video>'
      : '<img src="' + MEDIA + f.img + '" alt=""' + (f.zoom ? ' style="transform:scale(' + f.zoom + ')"' : '') + ' />';
    preview.insertBefore(el, avail);
    return el;
  });
  // tab strip rendered 3 times so it can scroll forward forever (rewinds one copy width when idle)
  const N = FEATURES.length;
  const COPIES = 3;
  for (let c = 0; c < COPIES; c++) {
    FEATURES.forEach((f, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.dataset.idx = idx;
      b.tabIndex = -1;
      b.innerHTML = '<span class="fill"></span><i class="ph ' + f.icon + '"></i><span>' + f.label + '</span>';
      b.addEventListener('click', () => { manual = true; go(idx, b); b.blur(); });
      tabs.appendChild(b);
    });
  }
  const allTabs = Array.from(tabs.children);
  // strip moves only on its own: no wheel, trackpad, drag or arrow-key scrolling
  tabs.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  tabs.addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
  tabs.tabIndex = -1;
  const tabsFor = (idx) => allTabs.filter((t) => Number(t.dataset.idx) === idx);
  const copyWidth = () => allTabs[N].offsetLeft - allTabs[0].offsetLeft;
  let settleTimer = null;
  function scrollForwardTo(idx, el) {
    clearTimeout(settleTimer);
    const cw = tabs.clientWidth;
    const cur = tabs.scrollLeft;
    let target;
    if (el) {
      target = el.offsetLeft - (cw - el.offsetWidth) / 2;
    } else {
      const cands = tabsFor(idx).map((t) => Math.max(0, t.offsetLeft - (cw - t.offsetWidth) / 2));
      target = cands.find((x) => x >= cur - 1);
      if (target === undefined) target = cands[cands.length - 1];
    }
    tabs.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    settleTimer = setTimeout(() => {
      const w = copyWidth();
      if (tabs.scrollLeft >= w) {
        tabs.style.scrollBehavior = 'auto';
        tabs.scrollLeft = tabs.scrollLeft - w;
        tabs.style.scrollBehavior = '';
      }
    }, 700);
  }

  let i = -1;
  let timer = null;
  let manual = false;
  let fillAnims = [];
  function runFill(ms) {
    fillAnims.forEach((a) => a.cancel());
    fillAnims = tabsFor(i).map((t) => t.querySelector('.fill').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: Math.max(200, ms), easing: 'linear', fill: 'forwards' }));
  }
  function go(n, el) {
    clearTimeout(timer);
    fillAnims.forEach((a) => a.cancel()); fillAnims = [];
    if (i >= 0) {
      items[i].classList.remove('is-on');
      tabsFor(i).forEach((t) => { t.classList.remove('is-on'); t.querySelector('i').className = 'ph ' + FEATURES[i].icon; });
      const v = items[i].querySelector('video');
      if (v) { v.pause(); v.currentTime = 0; }
    }
    i = n % items.length;
    const f = FEATURES[i];
    items[i].classList.add('is-on');
    tabsFor(i).forEach((t) => { t.classList.add('is-on'); t.querySelector('i').className = 'ph-fill ' + f.icon; });
    scrollForwardTo(i, el);
    const pill = (d) => '<span class="tp tp--' + d + '">' + d.toUpperCase() + '</span>';
    pills.innerHTML = f.groups
      ? f.groups.map((g) => '<span class="tp-group">' + g.tiers.map(pill).join('') + '<span class="tp-note">' + g.note + '</span></span>').join('<span class="tp-sep"></span>')
      : f.dots.map(pill).join('');
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    if (v) {
      v.onended = next;
      // fill + safety timer arm only once the clip is really playing, so a slow
      // load never skips a clip or runs the bar ahead of the video
      const start = () => { runFill(Math.round((v.duration - v.currentTime) * 1000)); timer = setTimeout(next, VIDEO_MAX); };
      if (!v.paused && v.readyState >= 3) start(); else v.addEventListener('playing', start, { once: true });
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    } else {
      runFill(IMG_HOLD);
      timer = setTimeout(next, IMG_HOLD);
    }
  }
  tabs.style.scrollBehavior = 'auto'; tabs.scrollLeft = 0; tabs.style.scrollBehavior = '';
  go(0);

  // hover pauses the show, leave resumes it
  preview.addEventListener('mouseenter', () => {
    clearTimeout(timer);
    const v = items[i].querySelector('video');
    if (v) v.pause();
    fillAnims.forEach((a) => a.pause());
  });
  preview.addEventListener('mouseleave', () => {
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    fillAnims.forEach((a) => a.play());
    if (v) {
      v.play().catch(() => {});
      timer = setTimeout(next, isFinite(v.duration) ? Math.min((v.duration - v.currentTime) * 1000 + 500, VIDEO_MAX) : VIDEO_MAX);
    } else {
      const left = fillAnims[0] ? Math.max(200, IMG_HOLD - (fillAnims[0].currentTime || 0)) : IMG_HOLD;
      timer = setTimeout(next, left);
    }
  });

  // plan cards
  const cards = document.getElementById('cards');
  let plan = new URLSearchParams(location.search).get('plan') || 'pro';
  if (!PLANS.some((p) => p.key === plan)) plan = 'pro';
  cards.innerHTML = PLANS.map((p) =>
    '<div class="card' + (p.key === plan ? ' is-sel' : '') + '" data-plan="' + p.key + '" role="radio" aria-checked="' + (p.key === plan) + '" tabindex="0">' +
      '<span class="radio"></span><div class="c-main">' +
      '<div class="c-row"><span class="c-name">' + p.name + ' <i class="ph ' + p.icon + '"></i></span>' +
      '<span class="c-price"><s>$' + p.base + '</s>$' + p.off + '/mo</span></div>' +
      '<span class="c-cred"><i class="ph-fill ph-star-four"></i>' + p.credits + ' Credits</span>' +
      '<span class="c-ok"><i class="ph-fill ph-check-circle"></i>Imports all ' + N_SLIDES + ' slides<span class="lim">Up to ' + p.slides + ' per import</span></span>' +
      '</div></div>'
  ).join('');
  const buyBtn = document.getElementById('btn-buy');
  // tier 1: trial + 20% off on buy. tier 2: no trial, full price until the "before you go" offer.
  const params = new URLSearchParams(location.search);
  const IN_FRAME = window.parent !== window;
  const TITLE = params.get('title') || '';
  if (params.get('embed') === '1') document.body.classList.add('embed');
  if (params.get('bare') === '1') document.body.classList.add('bare');
  (function fitStack(){
    const f = () => { const s = Math.min(1, (innerWidth - 32) / 1216, (innerHeight - 32) / 700); document.documentElement.style.setProperty('--fit', s.toFixed(3)); };
    f(); addEventListener('resize', f);
  })();
  // import flow: buy only, full price, no offer
  let tier = 2;
  let offer = false;
  const hasOff = () => false;
  function paint() {
    document.body.classList.toggle('tier2', tier === 2);
    document.body.classList.toggle('offer', offer);
    document.querySelectorAll('.tier-bar button').forEach((b) => b.classList.toggle('is-on', Number(b.dataset.tier) === tier));
    const p = PLANS.find((x) => x.key === plan);
    buyBtn.textContent = 'Buy ' + p.name + (hasOff() ? ' at 20% OFF' : '');
    cards.querySelectorAll('.card').forEach((c) => {
      const cp = PLANS.find((x) => x.key === c.dataset.plan);
      c.querySelector('.c-price').innerHTML = hasOff() ? '<s>$' + cp.base + '</s>$' + cp.off + '/mo' : '$' + cp.base + '/mo';
    });
  }
  function select(key) {
    plan = key;
    cards.querySelectorAll('.card').forEach((c) => { const on = c.dataset.plan === key; c.classList.toggle('is-sel', on); c.setAttribute('aria-checked', on); });
    paint();
  }
  document.getElementById('dp-close').addEventListener('click', () => {
    if (IN_FRAME) window.parent.postMessage({ type: 'trial-pricing-close' }, '*');
    else location.href = 'dashboard.html';
  });
  document.getElementById('reopen').addEventListener('click', () => document.body.classList.remove('is-closed'));
  cards.querySelectorAll('.card').forEach((c) => {
    c.addEventListener('click', () => select(c.dataset.plan));
    c.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(c.dataset.plan); } });
  });
  select(plan);

  // In the trial flow the host swaps in the matching checkout; standalone we navigate.
  function goCheckout() {
    const query = 'plan=' + plan + '&off=0';
    if (IN_FRAME) window.parent.postMessage({ type: 'trial-plan-selected', kind: 'buy', plan, query }, '*');
    else location.href = 'checkout-buy.html?' + query;
  }
  buyBtn.addEventListener('click', goCheckout);
  document.getElementById('btn-free').addEventListener('click', () => {
    if (IN_FRAME) window.parent.postMessage({ type: 'v6-import-continue' }, '*');
    else location.href = 'editor.html';
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
