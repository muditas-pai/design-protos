<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Import PowerPoint</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* Import from PPT: the create flow reads the file, then stops a free user at the slide limit */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .stage { position: relative; max-width: 900px; margin: 0 auto; min-height: 100vh; padding: 56px 32px 40px; display: flex; flex-direction: column; }
  .close { position: fixed; top: 18px; right: 20px; width: 34px; height: 34px; border-radius: 999px; border: 0; background: #fff; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.12); cursor: pointer; font-size: 16px; color: #171717; display: grid; place-items: center; }
  .close:hover { background: #f5f5f5; }

  /* user bubble: the uploaded file */
  .bubble { align-self: flex-end; background: #f3f4f6; border-radius: 14px; padding: 8px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .file { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 10px; padding: 10px 14px 10px 10px; min-width: 280px; }
  .file-ic { position: relative; width: 34px; height: 40px; border-radius: 6px; background: #f5f5f5; border: 1px solid #e5e5e5; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #737373; }
  .file-ic .ok { position: absolute; top: -8px; left: -8px; width: 16px; height: 16px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .file-name { font-size: 13px; color: #171717; }

  /* assistant steps */
  .steps { margin-top: 44px; display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #171717; opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease; }
  .step.is-in { opacity: 1; transform: none; }
  .step .dot { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; color: #fff; background: #16a34a; }
  .step .dot.spin { background: transparent; border: 2px solid #d4d4d4; border-top-color: #171717; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the limit card: two working versions, ?v=columns (default) and ?v=table */
  .limit { margin-top: auto; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 18px 20px 16px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); opacity: 0; transform: translateY(16px); transition: opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
  .limit.is-in { opacity: 1; transform: none; }
  .limit-t { font-size: 15px; font-weight: 500; }
  .limit-t b { font-weight: 600; }
  .limit-s { font-size: 13px; color: #737373; margin: 3px 0 14px; }
  .cr { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: #e8f0fe; color: #0055ED; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .cr i { font-size: 10px; }
  .tag { padding: 2px 8px; border-radius: 999px; background: #005eff; color: #fff; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  .price { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .price s { color: #a3a3a3; font-weight: 400; margin-right: 5px; }
  .price small { font-size: 12px; font-weight: 400; color: #737373; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; border-radius: 4px; border: 0; background: #171717; color: #fff; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; transition: background .15s ease, transform .12s ease, color .15s ease, border-color .15s ease; }
  .btn:hover { background: #000; }
  .btn:active { transform: scale(0.98); }
  .btn.sm { height: 34px; font-size: 12.5px; }
  .btn.ghost { background: #fff; border: 1px solid #e5e5e5; color: #171717; }
  .btn.ghost:hover { background: #f5f5f5; border-color: #d4d4d4; }
  .free { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(11,15,20,0.07); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; font-family: inherit; font-size: 13px; color: #525252; cursor: pointer; }
  .free:hover { color: #005eff; }
  .free .sub { color: #a3a3a3; }
  .ok { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: #16a34a; }
  .ok i { font-size: 14px; }

  /* columns */
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .col { position: relative; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px 14px 12px; cursor: pointer; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease; }
  .col:hover:not(.is-sel) { border-color: #c9cdd2; }
  .col.is-sel { border-color: #005eff; background: #f5f9ff; box-shadow: inset 0 0 0 0.5px #005eff, 0 0 0 3px rgba(0,94,255,0.08); }
  .col .tag { position: absolute; top: -9px; left: 12px; }
  .col .nm { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; }
  .col .nm i { font-size: 17px; }
  .col .lim { font-size: 12.5px; color: #525252; margin: 6px 0 6px; }
  .col .ok { margin: 8px 0 2px; }
  .col .price { font-size: 20px; margin: 6px 0 0; }
  .col .price small { font-size: 12px; }
  .col .yr { font-size: 11.5px; color: #8a8a8a; margin: 1px 0 10px; }

  /* table */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid rgba(11,15,20,0.07); transition: background .15s ease; }
  td:first-child i { margin-right: 7px; font-size: 14px; vertical-align: -2px; color: #8a8a8a; line-height: 1; }
  th { font-weight: 500; color: #525252; font-size: 12.5px; cursor: pointer; vertical-align: middle; border-top-left-radius: 8px; border-top-right-radius: 8px; }
  th .h { display: flex; align-items: center; gap: 8px; line-height: 16px; }
  th .h i, th .h b, th .h .radio { display: inline-flex; align-items: center; height: 16px; }
  th .radio { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid #c9cdd2; background: #fff; flex-shrink: 0; transition: border .15s ease; }
  th.is-sel .radio { border: 5px solid #005eff; }
  th .h i { font-size: 16px; color: #171717; line-height: 1; }
  th .h b { font-weight: 600; color: #171717; font-size: 13.5px; }
  th { position: relative; height: auto; padding-top: 14px; padding-bottom: 10px; }
  th .h .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
  table { margin-top: 4px; }
  td:first-child, th:first-child { color: #737373; cursor: default; padding-left: 0; width: 25%; }
  th[data-plan], td[data-plan] { width: 25%; }
  td[data-plan] { padding-left: 36px; } /* cell text lines up with the header icon, past the radio */
  table { table-layout: fixed; }
  td:last-child, th:last-child { padding-right: 0; }
  th.is-sel, td.is-sel { background: #eaf2ff; }
  tr:last-child td.is-sel { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  td.is-sel .price { color: #171717; }
  td { color: #171717; cursor: pointer; }
  td .price { font-size: 14px; }
  td .cr { font-size: 11.5px; }
  td .lock { color: #a3a3a3; }
  td .cut { color: #b45309; font-weight: 500; }
  td .all { color: #16a34a; font-weight: 500; }
  table + .btn { margin-top: 14px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<button type="button" class="close" id="close" aria-label="Close"><i class="ph ph-x"></i></button>
<div class="stage">
  <div class="bubble">
    <div class="file">
      <span class="file-ic">.pptx<span class="ok"><i class="ph ph-check"></i></span></span>
      <span class="file-name" id="file-name">chetan deck.pptx</span>
    </div>
  </div>

  <div class="steps">
    <div class="step" id="s1"><span class="dot spin"></span>Uploaded your content</div>
    <div class="step" id="s2"><span class="dot spin"></span>Read your slides</div>
  </div>

  <div class="limit" id="limit">
    <div class="limit-t">Your PPT has <b id="n-slides">24</b> slides. Free Plan supports up to <b>15</b> slides.</div>
    <div class="limit-s" id="limit-s"></div>
    <div id="body"></div>
    <button type="button" class="btn" id="btn-buy" style="margin-top:14px">Buy Pro</button>
    <button type="button" class="free" id="btn-free"><i class="ph ph-file-text"></i>Continue with Free Plan<span class="sub">Use only first 15 slides</span></button>
  </div>
</div>

<script>
  // Steps tick in, then the limit card rises. Options hand off to the host (dashboard / index).
  const IN_FRAME = window.parent !== window;
  const q = new URLSearchParams(location.search);
  if (q.get('file')) document.getElementById('file-name').textContent = q.get('file');
  if (q.get('slides')) document.getElementById('n-slides').textContent = q.get('slides');
  const done = (el) => { el.classList.add('is-in'); const d = el.querySelector('.dot'); d.classList.remove('spin'); d.innerHTML = '<i class="ph ph-check"></i>'; };
  const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
  setTimeout(() => s1.classList.add('is-in'), 250);
  setTimeout(() => done(s1), 1000);
  setTimeout(() => s2.classList.add('is-in'), 1150);
  setTimeout(() => done(s2), 2100);
  setTimeout(() => document.getElementById('limit').classList.add('is-in'), 2500);

  // plans: same model as the pricing page. Two working versions: columns (default) and table.
  const PLANS = [
    { key: 'pro',  name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  slides: 60, limit: 'Up to 60 slides', base: 20, off: 16, yr: 192, ai: 'Pro model' },
    { key: 'gold', name: 'Gold', icon: 'ph-sketch-logo',   credits: '25,000', slides: 99, limit: 'Up to 99 slides', base: 50, off: 40, yr: 480, ai: 'Frontier model' },
    { key: 'team', name: 'Team', icon: 'ph-users-three',   credits: '30,000', slides: 99, limit: 'Up to 99, shared', base: 60, off: 50, yr: 576, ai: 'Frontier model' },
  ];
  const N = Number(document.getElementById('n-slides').textContent) || 24;
  const V = q.get('v') === 'table' ? 'table' : 'columns';
  let plan = q.get('plan') || 'pro';
  if (plan !== 'free' && !PLANS.some((p) => p.key === plan)) plan = 'pro';
  const body = document.getElementById('body');
  const buyBtn = document.getElementById('btn-buy');
  const freeBtn = document.getElementById('btn-free');
  document.getElementById('limit-s').textContent = V === 'table' ? 'Compare the plans and pick one.' : 'Pick a plan to import every slide.';
  const priceHtml = (p) => '<span class="price"><s>$' + p.base + '</s>$' + p.off + '<small>/mo</small></span>';

  if (V === 'columns') {
    body.innerHTML = '<div class="cols">' + PLANS.map((p) =>
      '<div class="col" data-plan="' + p.key + '">' + (p.tag ? '<span class="tag">' + p.tag + '</span>' : '') +
      '<div class="nm"><i class="ph ' + p.icon + '"></i>' + p.name + '</div>' +
      '<div class="lim">' + p.limit + '</div>' +
      '<span class="cr"><i class="ph-fill ph-star-four"></i>' + p.credits + ' Credits</span>' +
      '<div class="ok"><i class="ph-fill ph-check-circle"></i>Imports all ' + N + ' slides</div>' +
      '<span class="price">$' + p.off + '<small>/mo</small></span><div class="yr">$' + p.yr + ' billed yearly</div>' +
      '<button type="button" class="btn sm' + (p.key === 'pro' ? '' : ' ghost') + '" data-buy="' + p.key + '">Buy ' + p.name + '</button>' +
      '</div>').join('') + '</div>';
    buyBtn.style.display = 'none'; // each column buys itself
  } else {
    const cols = PLANS;
    const th = cols.map((c) => '<th data-plan="' + c.key + '" role="radio"><span class="h"><span class="radio"></span><i class="ph ' + c.icon + '"></i><b>' + c.name + '</b>' + (c.tag ? '<span class="tag">' + c.tag + '</span>' : '') + '</span></th>').join('');
    const cell = (c, html) => '<td data-plan="' + c.key + '">' + html + '</td>';
    const rows = [
      ['<i class="ph ph-presentation"></i>This deck (' + N + ' slides)', (c) => '<span class="all">All ' + N + ' slides</span>'],
      ['<i class="ph ph-stack"></i>Slides per import', (c) => '<b>Up to ' + c.slides + '</b>'],
      ['<i class="ph ph-star-four"></i>Credits', (c) => '<span class="cr"><i class="ph-fill ph-star-four"></i>' + c.credits + '</span>'],
      ['<i class="ph ph-sparkle"></i>AI model', (c) => c.ai],
      ['<i class="ph ph-export"></i>Exports', (c) => '<i class="ph-fill ph-check-circle" style="color:#16a34a"></i>'],
      ['<i class="ph ph-tag"></i>Price', (c) => '<span class="price">$' + c.off + '<small>/mo</small></span>'],
    ];
    body.innerHTML = '<table><tr><th></th>' + th + '</tr>' + rows.map((r) => '<tr><td>' + r[0] + '</td>' + cols.map((c) => cell(c, r[1](c))).join('') + '</tr>').join('') + '</table>';
    body.querySelectorAll('td[data-plan]').forEach((td) => td.addEventListener('click', () => select(td.dataset.plan)));
    body.querySelectorAll('th[data-plan]').forEach((th) => th.addEventListener('click', () => select(th.dataset.plan)));
  }
  function select(key) {
    plan = key;
    body.querySelectorAll('[data-plan]').forEach((el) => el.classList.toggle('is-sel', el.dataset.plan === key));
    const p = PLANS.find((x) => x.key === key);
    if (V === 'table') {
      if (p) { buyBtn.textContent = 'Buy ' + p.name; buyBtn.classList.remove('ghost'); freeBtn.style.display = ''; }
      else { buyBtn.textContent = 'Continue with Free Plan, first 15 slides only'; buyBtn.classList.add('ghost'); freeBtn.style.display = 'none'; }
    }
  }
  body.querySelectorAll('.col').forEach((el) => el.addEventListener('click', () => select(el.dataset.plan)));
  select(plan === 'free' && V !== 'table' ? 'pro' : plan);

  const send = (msg, fallback) => { if (IN_FRAME) window.parent.postMessage(msg, '*'); else location.href = fallback; };
  const buy = (key) => send({ type: 'trial-plan-selected', kind: 'buy', plan: key, query: 'plan=' + key }, 'checkout-buy.html?plan=' + key);
  body.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); buy(b.dataset.buy); }));
  buyBtn.addEventListener('click', () => { if (plan === 'free') send({ type: 'v6-import-continue' }, 'editor.html'); else buy(plan); });
  document.getElementById('btn-free').addEventListener('click', () => send({ type: 'v6-import-continue' }, 'editor.html'));
  document.getElementById('close').addEventListener('click', () => send({ type: 'trial-pricing-close' }, 'dashboard.html'));
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
