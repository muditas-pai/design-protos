<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV2 Create Mobile</title>
<link rel="stylesheet" href="../tokens.css">
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "agentation": "https://esm.sh/agentation@3.1.2?deps=react@18.3.1,react-dom@18.3.1"
} }
</script>
<script type="module">
  try {
    const [React, { createRoot }, { Agentation }] = await Promise.all([import("react"), import("react-dom/client"), import("agentation")]);
    const host = document.createElement("div"); host.id = "agentation-host"; document.body.appendChild(host);
    createRoot(host).render(React.createElement(Agentation, { appName: "PV2 create v3 mobile", useHashLocation: true }));
  } catch (e) { console.warn("Agentation failed to load", e); }
</script>
<style>
  body { margin: 0; background: rgb(var(--sunken)); color: rgb(var(--ink)); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: rgb(var(--ink)); color: rgb(var(--canvas)); }
  .bar b { font-size: 13px; font-weight: 600; }
  .bar small { font-size: 12px; color: rgb(var(--canvas) / .65); flex: 1 1 260px; }
  .bar a, .bar button { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid rgb(var(--canvas) / .18); background: transparent; color: rgb(var(--canvas)); font: inherit; font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: rgb(var(--canvas)); color: rgb(var(--ink)); }
  .seg { display: inline-flex; gap: 4px; }
  .wall { display: flex; gap: 40px; padding: 32px 24px 48px; overflow-x: auto; align-items: flex-start; justify-content: safe center; }
  .dev { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .dev h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .dev h2 span { font-weight: 400; color: rgb(var(--ink-3)); }
  .frame { padding: 12px; border-radius: 48px; background: #14141f; box-shadow: var(--sh-dialog); }
  .frame iframe { display: block; border: 0; border-radius: 36px; background: #fff; }
  .frame.android { border-radius: 32px; padding: 10px; } .frame.android iframe { border-radius: 22px; }
  .dev a { font-size: 12px; color: rgb(var(--brand-fg)); text-decoration: none; }
</style>
</head>
<body>
<div class="bar">
  <b>PV2 create v3 · mobile</b>
  <small>One phone layout for A and E. No review bar, no modal: Options opens under the box with the everyday choices, the rest sits behind More options.</small>
  <span class="seg" id="seg"><button data-h="844" aria-pressed="true">Tall phone</button><button data-h="667" aria-pressed="false">Short phone</button></span>
  <a href="./?opt=i">Desktop A</a><a href="./?opt=m">Desktop E</a>
</div>
<div class="wall" id="wall"></div>
<script>
const DEVICES = [["i", "Mobile", "iPhone 14", 390, 844, ""], ["i", "Mobile", "Android", 360, 760, "android"]];
function draw(short) {
  document.getElementById("wall").innerHTML = DEVICES.map(([o, n, d, w, h, c]) => {
    const hh = short ? Math.min(h, c ? 640 : 667) : h;
    return `<div class="dev"><h2>${n} <span>· ${d} ${w}×${hh}</span></h2><div class="frame ${c}"><iframe src="./?opt=${o}" width="${w}" height="${hh}" title="${n} on ${d}"></iframe></div><a href="./?opt=${o}" target="_blank" rel="noopener">Open full page</a></div>`;
  }).join("");
}
document.getElementById("seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  draw(b.dataset.h !== "844");
});
draw(false);
</script>
</body>
</html>
