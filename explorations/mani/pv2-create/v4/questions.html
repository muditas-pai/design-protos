<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV2 Questions v5</title>
<link rel="stylesheet" href="../tokens.css">
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "agentation": "https://esm.sh/agentation@3.1.2?deps=react@18.3.1,react-dom@18.3.1"
} }
</script>
<script type="module">
  // Agentation: desktop only.
  if (!(window.matchMedia && matchMedia("(max-width: 640px)").matches)) {
    try {
      const [React, { createRoot }, { Agentation }] = await Promise.all([import("react"), import("react-dom/client"), import("agentation")]);
      const host = document.createElement("div"); host.id = "agentation-host"; document.body.appendChild(host);
      createRoot(host).render(React.createElement(Agentation, { appName: "PV2 questions v5", useHashLocation: true }));
    } catch (e) { console.warn("Agentation failed to load", e); }
  }
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: rgb(var(--canvas)); color: rgb(var(--ink)); font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
  button { font: inherit; color: inherit; }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .i20 { width: 20px; height: 20px; }

  /* Top bar, same as the PV2 chat screen */
  .topbar { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid rgb(var(--line)); background: rgb(var(--canvas) / .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .topbar-in { width: 100%; max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: rgb(var(--ink-2)); cursor: pointer; }
  .icon-btn:hover { background: rgb(var(--sunken)); color: rgb(var(--ink)); }
  .tier { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border: 1px solid rgb(var(--line)); border-radius: 999px; background: rgb(var(--surface)); font-size: 12px; font-weight: 500; color: rgb(var(--ink-2)); }
  .sp { flex: 1; }

  /* Chat column */
  main { width: min(720px, calc(100vw - 32px)); margin: 0 auto; padding: clamp(16px, 4vh, 32px) 0 0; min-height: calc(100vh - 56px); display: flex; flex-direction: column; }
  .thread { flex: 1; display: flex; flex-direction: column; gap: clamp(14px, 3vh, 24px); padding-bottom: 16px; }
  .me { align-self: flex-end; max-width: 80%; padding: 10px 16px; border-radius: 12px; background: rgb(var(--brand-50)); color: rgb(var(--ink)); animation: rise .2s var(--ease); }
  .thought { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0; border: 0; background: none; color: rgb(var(--ink-3)); font-size: 14px; cursor: pointer; }
  .thought:hover { color: rgb(var(--ink-2)); }
  .thought .i { width: 14px; height: 14px; transform: rotate(-90deg); }
  .ai { margin: 0; color: rgb(var(--ink)); animation: rise .2s var(--ease); }
  .ai + .ai { margin-top: -10px; }
  .working { display: inline-flex; align-items: center; gap: 8px; color: rgb(var(--ink-3)); }
  .spinner { width: 14px; height: 14px; border: 2px solid rgb(var(--brand-600)); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* ---- One card for every question. Same header, same rows, field always last, buttons always in the same spot. ---- */
  .dock { position: sticky; bottom: 0; z-index: 10; padding: 8px 0 clamp(64px, 9vh, 76px); background: linear-gradient(rgb(var(--canvas) / 0), rgb(var(--canvas)) 24px); }
  .qcard { border: 1px solid rgb(var(--line)); border-radius: 12px; background: rgb(var(--surface)); box-shadow: var(--sh-menu); padding: 8px 10px 10px; animation: rise .22s var(--ease); outline: none; }
  .qh { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 8px 4px 12px 12px; }
  .qh h2 { flex: 1; min-width: 0; margin: 0 8px 0 0; font-size: 15px; line-height: 22px; font-weight: 500; }
  .qnav { display: inline-flex; align-items: center; color: rgb(var(--ink-3)); font-size: 13px; font-variant-numeric: tabular-nums; }
  .qh .icon-btn { width: 28px; height: 28px; color: rgb(var(--ink-3)); }
  .qh .icon-btn:hover { color: rgb(var(--ink)); }
  .qnav .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
  .qnav .left { transform: rotate(90deg); }
  .qnav .right { transform: rotate(-90deg); }
  .qopts { display: flex; flex-direction: column; gap: 4px; max-height: clamp(150px, 34vh, 320px); overflow: auto; overscroll-behavior: contain; }
  .opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 10px 14px 10px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; outline: none; transition: background .12s var(--ease), border-color .12s var(--ease); }
  .opt + .opt::before { content: ""; position: absolute; left: 12px; right: 12px; top: -3px; border-top: 1px solid rgb(var(--line)); }
  .opt.act::before, .opt.act + .opt::before, .opt.sel::before, .opt.sel + .opt::before { border-color: transparent; }
  .opt:hover { background: rgb(var(--sunken)); }
  .opt.act { background: rgb(var(--sunken)); border-color: rgb(var(--brand-600) / .55); }
  .num { width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; background: rgb(var(--sunken)); color: rgb(var(--ink-2)); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .num .i { width: 14px; height: 14px; color: rgb(var(--ink-3)); }
  .opt.act .num { background: rgb(var(--line)); color: rgb(var(--ink)); }
  .logo { width: 28px; height: 28px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid rgb(var(--line)); border-radius: 6px; background: #fff; color: rgb(var(--ink-2)); font-size: 13px; font-weight: 700; overflow: hidden; }
  .logo img { width: 16px; height: 16px; display: block; }
  .logo .i { width: 15px; height: 15px; color: rgb(var(--ink-3)); }
  .logo.globe { color: rgb(var(--ink-3)); }
  .lbl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lbl b { font-weight: 400; font-size: 14px; line-height: 20px; color: rgb(var(--ink)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbl small { font-size: 13px; line-height: 18px; color: rgb(var(--ink-3)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { color: rgb(var(--ink-2)); opacity: 0; transition: opacity .12s var(--ease); }
  .opt.act .go, .opt:hover .go { opacity: 1; }
  .empty { padding: 12px 10px; font-size: 13px; color: rgb(var(--ink-3)); }

  /* The field: search on Q1, type your own on Q2. Always the last row. */
  .fld { position: relative; display: flex; align-items: center; gap: 14px; min-height: 52px; margin-top: 6px; padding: 6px 8px 6px 12px; border: 1px solid transparent; border-radius: 10px; transition: border-color .12s var(--ease), background .12s var(--ease); }
  .fld::before { content: ""; position: absolute; left: 12px; right: 12px; top: -5px; border-top: 1px solid rgb(var(--line)); }
  .fld:focus-within { border-color: rgb(var(--brand-600) / .55); }
  /* Company search reads as selected: brand border and soft ring */
  .fld.srch-f { border-color: rgb(var(--line)); margin-top: 10px; }
  .fld.srch-f::before { display: none; }
  .fld.srch-f:focus-within { border-color: rgb(var(--brand-600)); box-shadow: 0 0 0 3px rgb(var(--brand-600) / .12); }
  .fld:focus-within::before { border-color: transparent; }
  .fld input { flex: 1; min-width: 0; height: 32px; border: 0; outline: 0; background: transparent; font: inherit; color: rgb(var(--ink)); }
  .fld input::placeholder { color: rgb(var(--ink-3)); }

  /* Buttons */
  .b { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background .12s var(--ease); }
  .b-skip { background: rgb(var(--sunken)); color: rgb(var(--ink)); }
  .b-skip:hover { background: rgb(var(--line)); }
  .b-go { background: rgb(var(--brand-600)); color: #fff; }
  .b-go:hover { background: rgb(var(--brand-700)); }
  .b-go:disabled { background: rgb(var(--sunken)); color: rgb(var(--ink-off)); cursor: default; }
  .b-ghost { background: transparent; color: rgb(var(--ink-2)); }
  .b-ghost:hover { background: rgb(var(--sunken)); color: rgb(var(--ink)); }
  .b:focus-visible, .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgb(var(--brand-600) / .35); }

  /* B: pick a row, then Continue. Selected row gets a check. Fixed footer: Skip left, Continue right. */
  .ck { width: 18px; height: 18px; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid rgb(var(--line)); border-radius: 50%; color: transparent; transition: all .12s var(--ease); }
  .ck .i { width: 12px; height: 12px; stroke-width: 2.5; }
  .opt.sel { background: rgb(var(--brand-50)); border-color: rgb(var(--brand-600) / .55); }
  .opt.sel .ck { background: rgb(var(--brand-600)); border-color: rgb(var(--brand-600)); color: #fff; }
  .opt.sel .num { background: rgb(var(--surface)); color: rgb(var(--brand-fg)); }
  .qfoot { display: flex; align-items: center; gap: 8px; margin: 6px -6px -6px; padding: 8px 10px; border-top: 1px solid rgb(var(--line)); border-radius: 0 0 12px 12px; background: rgb(var(--canvas)); }
  .qfoot small { flex: 1; min-width: 0; font-size: 12px; color: rgb(var(--ink-3)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* C: options in the card, Skip fixed top right; typing happens in a reply bar under the card, like the prompt box. */
  .reply { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 52px; padding: 6px 6px 6px 14px; border: 1px solid rgb(var(--line)); border-radius: 12px; background: rgb(var(--surface)); box-shadow: var(--sh-menu); transition: border-color .12s var(--ease), box-shadow .12s var(--ease); }
  .reply:focus-within { border-color: rgb(var(--brand-600)); box-shadow: 0 0 0 3px rgb(var(--brand-600) / .12), var(--sh-menu); }
  .reply > .i { color: rgb(var(--ink-3)); }
  .reply input { flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: rgb(var(--ink)); }
  .reply input::placeholder { color: rgb(var(--ink-3)); }
  .sendc { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgb(var(--brand-600)); color: #fff; cursor: pointer; }
  .sendc:disabled { background: rgb(var(--sunken)); color: rgb(var(--ink-off)); cursor: default; }
  .sendc .i { width: 18px; height: 18px; stroke-width: 2; }

  /* Suggested prompt card */
  .sp-card { padding: 4px 6px 6px; }
  .sp-card .qh h2 { font-size: 15px; font-weight: 600; }
  .gaps { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
  .gaps span { height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 999px; background: rgb(var(--warn-bg)); color: rgb(var(--warn)); font-size: 12px; font-weight: 500; }
  .sp-edit { margin: 0 6px; padding: 10px 12px; min-height: 96px; max-height: clamp(110px, 26vh, 220px); overflow: auto; border: 1px solid rgb(var(--line)); border-radius: 8px; background: rgb(var(--surface)); color: rgb(var(--ink)); font-size: 14px; line-height: 22px; outline: none; transition: border-color .12s var(--ease), box-shadow .12s var(--ease); }
  .sp-edit:focus { border-color: rgb(var(--brand-600)); box-shadow: 0 0 0 3px rgb(var(--brand-600) / .12); }
  .sp-edit mark.ph { padding: 1px 3px; border-radius: 4px; background: rgb(var(--brand-50)); color: rgb(var(--brand-fg)); font-weight: 500; cursor: pointer; }
  .orig { margin: 8px 6px 0; padding: 0 6px; font-size: 12px; line-height: 16px; color: rgb(var(--ink-3)); }
  .orig summary { cursor: pointer; width: max-content; padding: 4px 0; }
  .orig summary:hover { color: rgb(var(--ink-2)); }
  .orig p { margin: 2px 0 4px; }
  .b .i { width: 14px; height: 14px; vertical-align: -2px; margin-left: 4px; }
  .closed { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px dashed rgb(var(--line)); border-radius: 12px; color: rgb(var(--ink-3)); font-size: 13px; }
  .linkb { border: 0; background: none; padding: 0; color: rgb(var(--brand-fg)); font-weight: 500; cursor: pointer; text-decoration: none; }

  /* Review bar at the bottom: screens, then layouts */
  .screens { position: fixed; z-index: 60; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: rgb(var(--ink)); box-shadow: var(--sh-dialog); }
  .screens a { height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; color: rgb(var(--canvas) / .7); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .screens a:hover { color: rgb(var(--canvas)); }
  .screens a[aria-current] { background: rgb(var(--canvas)); color: rgb(var(--ink)); }
  .screens a small { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
  .screens .div { width: 1px; height: 18px; margin: 0 6px; background: rgb(var(--canvas) / .2); }
  .screens .lab { padding: 0 4px 0 2px; font-size: 12px; color: rgb(var(--canvas) / .5); }

  /* Short Windows screens: tighter rows, card stays in reach */
  @media (max-height: 720px) {
    .opt { min-height: 52px; padding-top: 7px; padding-bottom: 7px; }
    .qopts { gap: 2px; }
    .fld { min-height: 46px; }
    .qh { min-height: 40px; padding-top: 6px; padding-bottom: 8px; }
    .reply { min-height: 46px; }
    .sendc { width: 32px; height: 32px; }
  }
  @media (max-height: 620px) { .topbar { height: 48px; } .thread { gap: 12px; } }
  @media (max-width: 640px) {
    .topbar { padding: 0 12px; }
    .screens { bottom: 10px; max-width: calc(100vw - 20px); overflow-x: auto; }
    .screens a { padding: 0 10px; }
    .screens .lab { display: none; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="icon-btn" href="./" aria-label="Back to prompt"><svg class="i i20" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <span class="tier">Standard · 10 credits/slide</span>
  <span class="sp"></span>
  <button class="icon-btn" id="theme" aria-label="Toggle theme"><svg class="i i20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
  <a class="icon-btn" href="./" aria-label="Close"><svg class="i i20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div></header>

<main>
  <div class="thread" id="thread" aria-live="polite"></div>
  <div class="dock" id="dock"></div>
</main>

<nav class="screens" aria-label="Screens and layouts" id="screens"></nav>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  caret: '<path d="m6 9 6 6 6-6"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>', arrowUp: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
};
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* Three layouts to compare. Each one is used for both Q1 and Q2, so the two screens always match. */
const LAYOUTS = {
  a: "Inline field",   // Click a row to answer. Field is the last row; its one button (Skip, then Use or Send) sits at its right.
  b: "Pick, then Continue", // Click a row to select it. Field is the last row. Footer always: Skip left, Continue right.
  c: "Reply bar",      // Click a row to answer. Skip fixed top right. Typing happens in a bar under the card with a send button.
};
const qp = new URLSearchParams(location.search);
const P = qp.get("p") === "2" ? 2 : qp.get("p") === "s" ? "s" : 1;
/* Chosen: A, Inline field. B and C stay reachable with ?v=b or ?v=c for reference. */
const V = LAYOUTS[qp.get("v")] ? qp.get("v") : "a";

const PROMPT = "Sales pitch deck for my company targeting a mid-market SaaS prospect covering pain points, our solution differentiators, 3 customer case studies and a clear call to action";
/* Company suggestions with their real logos (favicon service). Top three show first; the rest come up as you type. */
const COMPANIES = [
  ["Google", "google.com"], ["PayPal", "paypal.com"], ["Slack", "slack.com"],
  ["Microsoft", "microsoft.com"], ["Salesforce", "salesforce.com"], ["HubSpot", "hubspot.com"], ["Notion", "notion.so"], ["Stripe", "stripe.com"],
  ["Shopify", "shopify.com"], ["Zoom", "zoom.us"], ["Atlassian", "atlassian.com"], ["Adobe", "adobe.com"], ["Airbnb", "airbnb.com"], ["Spotify", "spotify.com"],
];
const logoURL = (d) => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64`;
const SCREENS = {
  1: { intro: [["thought", "Thought for 38s"]], lead: "A couple of quick questions so the deck fits your company.", qs: [
    { q: "What company is this presentation for?", search: true, ph: "Search a company or type its website", skipAs: "Skip, no specific company" } ],
    done: (a) => a.skipped ? "Kept general, with space for your logo." : `${a.text}’s name, colours and product details go into the deck.` },
  2: { intro: [["thought", "Thought for 38s"], ["ai", "What company is this presentation for?"], ["me", "Slack"], ["thought", "Thought for 1m 41s"]], lead: "Three more so the story lands with this prospect.", qs: [
    { q: "What's Slack's core product category?", ph: "Describe it in a few words", skipAs: "Skip, you pick", opts: [
      ["Workflow automation platform", "Automates handoffs, approvals and busywork"], ["Revenue intelligence software", "Pipeline insight, forecasting and deal risk"], ["Customer success and retention platform", "Keeps customers longer and grows accounts"] ] },
    { q: "Who will be in the room?", ph: "Another role", skipAs: "Skip, mixed audience", opts: [
      ["VP of Sales", "Cares about pipeline and win rates"], ["CFO or finance lead", "Cares about cost and payback"], ["Head of Operations", "Cares about rollout and time saved"], ["IT and security", "Cares about integrations and risk"] ] },
    { q: "Which proof should lead the deck?", ph: "Something else", skipAs: "Skip, balance them", opts: [
      ["Customer case studies", "Three short stories from teams like theirs"], ["ROI and cost savings", "Payback period, cost and hours saved"], ["Live product demo", "Walk through the product step by step"] ] } ],
    done: () => "Building your outline…" },
};
/* Suggested prompt: shown before the questions when the prompt is thin. Placeholders are marked so they are easy to fill. */
SCREENS.s = { intro: [], lead: "Your prompt is a bit short. Here's a clearer version that will give you a better deck.", qs: [{ q: "Suggested prompt" }],
  gaps: ["Missing company name", "No product details", "Differentiators not named"],
  text: "Create a sales pitch deck for [Company name], a provider of [what the company does], targeting mid-market SaaS prospects. Cover common industry pain points, our solution and key differentiators, three customer case studies that show our impact, and a clear call to action for next steps." };
const SC = SCREENS[P];
/* act: row under the mouse or keyboard. sel: picked row in layout B. t: field text. Nothing is picked by default. */
const st = { i: 0, act: -1, sel: -1, t: "", answers: [], closed: false, finished: false };
const cur = () => SC.qs[st.i];

/* Bottom bar: screens, then layouts. Links keep the layout you are on. */
$("#screens").innerHTML = `<a href="./">Prompt box</a><a href="?p=s&v=${V}" ${P === "s" ? 'aria-current="page"' : ""}>Suggested prompt</a><a href="?p=1&v=${V}" ${P === 1 ? 'aria-current="page"' : ""}>Q1 Company</a><a href="?p=2&v=${V}" ${P === 2 ? 'aria-current="page"' : ""}>Q2 Deck details <small>3</small></a>
`;

/* Rows for the current question. Q1 rows come from the search; Q2 rows are its options. */
const looksLikeSite = (v) => /^(https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+\/?$/i.test(v.trim());
function items() {
  const q = cur();
  if (!q.search) return q.opts.map(([t, s], k) => ({ t, s, badge: `<span class="num">${k + 1}</span>`, val: t }));
  const v = st.t.trim().toLowerCase().replace(/^(https?:\/\/)?(www\.)?/, "").replace(/\/$/, "");
  const list = v ? COMPANIES.filter(([n, d]) => n.toLowerCase().includes(v) || d.includes(v)).slice(0, 5) : COMPANIES.slice(0, 3);
  const out = list.map(([n, d]) => ({ t: n, s: d, badge: `<span class="logo"><img src="${logoURL(d)}" alt="" width="16" height="16" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(n[0])}'))"></span>`, val: n }));
  if (v && !list.some(([, d]) => d === v) && (looksLikeSite(v) || !list.length)) out.push({ t: `Use “${v}”`, s: looksLikeSite(v) ? "We'll read the site for name, colors and product" : "We'll look it up from the name", badge: looksLikeSite(v) ? `<span class="logo"><img src="${logoURL(v)}" alt="" width="16" height="16" onerror="this.outerHTML='${ic("globe").replace(/"/g, "&quot;")}'"></span>` : `<span class="logo globe">${ic("globe")}</span>`, val: v, raw: true });
  return out;
}
/* What the button next to the field says. One spot, one button. */
const fieldAction = () => { const t = st.t.trim(); if (!t) return ["Skip", "b-skip", "skip"]; return cur().search ? ["Use", "b-go", "use"] : ["Send", "b-go", "use"]; };
const typedValue = () => { const t = st.t.trim(); if (!t) return ""; if (cur().search) { const it = items(); const hit = it.find((x) => x.t.toLowerCase() === t.toLowerCase()); return hit ? hit.val : t.replace(/^(https?:\/\/)?(www\.)?/, "").replace(/\/$/, ""); } return t; };

function threadHTML() {
  const bits = [`<div class="me">${esc(PROMPT)}</div>`];
  SC.intro.forEach(([k, t]) => bits.push(k === "thought" ? `<button class="thought">${esc(t)}${ic("caret")}</button>` : k === "me" ? `<div class="me">${esc(t)}</div>` : `<p class="ai">${esc(t)}</p>`));
  bits.push(`<p class="ai">${esc(SC.lead)}</p>`);
  if (P === "s") { if (st.answers[0]) bits.push(`<div class="me">${esc(st.answers[0].text)}</div>`, `<p class="ai">${st.answers[0].skipped ? "Your prompt is used as written." : "One question about your company next."}</p>`); return bits.join(""); }
  st.answers.forEach((a, k) => { if (a) bits.push(`<p class="ai">${esc(SC.qs[k].q)}</p>`, `<div class="me">${esc(a.text)}</div>`); });
  if (st.finished) bits.push(`<button class="thought">Thought for 4s${ic("caret")}</button>`, P === 2 ? `<p class="ai working"><span class="spinner"></span>${esc(SC.done(st.answers[0]))}</p>` : `<p class="ai">${esc(SC.done(st.answers[0]))}</p>`);
  return bits.join("");
}
const rowsHTML = () => { const it = items(); return it.length ? it.map((x, k) => `<button class="opt ${st.act === k ? "act" : ""} ${V === "b" && st.sel === k ? "sel" : ""}" role="option" aria-selected="${V === "b" ? st.sel === k : st.act === k}" data-row="${k}">${x.badge}<span class="lbl"><b>${esc(x.t)}</b>${x.s ? `<small>${esc(x.s)}</small>` : ""}</span>${V === "b" ? `<span class="ck">${ic("check")}</span>` : ic("arrowR", "go")}</button>`).join("") : `<div class="empty">No matches. Type a website to use it.</div>`; };
const fieldHTML = () => { const q = cur(), [lbl, cls, act] = fieldAction();
  return `<div class="fld ${q.search ? "srch-f" : ""}"><span class="num">${ic(q.search ? "search" : "pen")}</span><input id="fld" type="text" placeholder="${esc(q.ph)}" value="${esc(st.t)}" autocomplete="off" aria-label="${esc(q.ph)}">${V === "a" ? `<button class="b ${cls}" data-act="${act}">${lbl}</button>` : ""}</div>`; };
const continueOK = () => st.sel >= 0 || !!st.t.trim();
const footHTML = () => `<div class="qfoot"><button class="b b-ghost" data-act="skip">Skip</button><small>${st.sel >= 0 ? `Selected: ${esc(items()[st.sel]?.t || "")}` : st.t.trim() ? `Your answer: ${esc(st.t.trim())}` : ""}</small><button class="b b-go" data-act="continue" ${continueOK() ? "" : "disabled"}>Continue</button></div>`;

function cardHTML() {
  if (P === "s") {
    if (st.answers[0]) return `<div class="closed"><span>Next, one question about your company.</span><a class="linkb" href="?p=1&v=${V}">Go to Q1</a></div>`;
    if (st.closed) return `<div class="closed"><span>Suggestion closed. We'll use your prompt as written.</span><button class="linkb" data-reopen>Show it again</button></div>`;
    const marked = esc(SC.text).replace(/\[([^\]]+)\]/g, '<mark class="ph" title="Fill in">[$1]</mark>');
    return `<section class="qcard sp-card" tabindex="-1" role="group" aria-labelledby="qT">
      <div class="qh"><h2 id="qT">Suggested prompt</h2><button class="icon-btn" data-close aria-label="Close suggestion">${ic("x")}</button></div>
      <div class="gaps">${SC.gaps.map((g) => `<span>${esc(g)}</span>`).join("")}</div>
      <div class="sp-edit" id="spEdit" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Suggested prompt. Edit any word." spellcheck="false">${marked}</div>
      <details class="orig"><summary>Your original</summary><p>${esc(PROMPT)}</p></details>
      <div class="qfoot"><small>Click a highlighted part to fill it in</small><button class="b b-ghost" data-act="keep">Keep my original</button><button class="b b-go" data-act="usep">Use this prompt ${ic("arrowR")}</button></div>
    </section>`;
  }
  if (st.finished) return P === 1 ? `<div class="closed"><span>Next, three questions about the deck.</span><a class="linkb" href="?p=2&v=${V}">Go to Q2</a></div>` : `<div class="closed"><span>All 3 answered.</span><button class="linkb" data-restart>Start over</button></div>`;
  if (st.closed) return `<div class="closed"><span>Questions closed. We'll use sensible defaults.</span><button class="linkb" data-reopen>Answer them</button></div>`;
  const q = cur(), n = SC.qs.length;
  const head = `<div class="qh"><h2 id="qT">${esc(q.q)}</h2>
    ${n > 1 ? `<span class="qnav"><button class="icon-btn" data-prev aria-label="Previous question" ${st.i ? "" : "disabled"}>${ic("caret", "left")}</button><span>${st.i + 1} of ${n}</span><button class="icon-btn" data-next aria-label="Next question" ${st.i < n - 1 ? "" : "disabled"}>${ic("caret", "right")}</button></span>` : ""}
    ${V === "c" ? `<button class="b b-skip" data-act="skip">Skip</button>` : ""}
    <button class="icon-btn" data-close aria-label="Close questions">${ic("x")}</button></div>`;
  const card = `<section class="qcard" tabindex="-1" role="group" aria-labelledby="qT">${head}
    <div class="qopts" id="rows" role="listbox" aria-labelledby="qT">${rowsHTML()}</div>
    ${V !== "c" ? fieldHTML() : ""}${V === "b" ? footHTML() : ""}</section>`;
  if (V !== "c") return card;
  return card + `<div class="reply">${ic(q.search ? "search" : "pen")}<input id="fld" type="text" placeholder="${q.search ? "Or search a company, or paste its website" : "Or type your own answer"}" value="${esc(st.t)}" autocomplete="off" aria-label="Type your answer"><button class="sendc" data-act="use" aria-label="Send" ${st.t.trim() ? "" : "disabled"}>${ic("arrowUp")}</button></div>`;
}
/* Typing only redraws the rows and the buttons, so the caret never jumps. */
function refreshLive() {
  const r = $("#rows"); if (r) r.innerHTML = rowsHTML();
  if (V === "a") { const b = $(".fld .b"), [lbl, cls, act] = fieldAction(); if (b) { b.textContent = lbl; b.className = `b ${cls}`; b.dataset.act = act; } }
  if (V === "b") { const f = $(".qfoot"); if (f) f.outerHTML = footHTML(); }
  if (V === "c") { const s = $(".sendc"); if (s) s.disabled = !st.t.trim(); }
}
function render(focus = true) {
  $("#thread").innerHTML = threadHTML(); $("#dock").innerHTML = cardHTML();
  const f = $("#fld");
  if (f) f.oninput = () => { st.t = f.value; st.act = -1; if (cur().search) st.sel = -1; refreshLive(); };
  /* Q1 opens with the caret in the search field. Q2 waits for a click or a key. */
  /* Question screens start with nothing selected. Arrow keys or a click choose what is selected. */
  if (focus && P !== "s") $(".qcard")?.focus({ preventScroll: true });
  /* Suggested prompt: the box is selected from the start, caret at the end. Same refocus as the company search. */
  const ed = $("#spEdit");
  if (focus && ed) { const put = () => { ed.focus({ preventScroll: true }); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }; put(); [150, 600, 1200].forEach((ms) => setTimeout(() => { if (document.activeElement === document.body && document.body.contains(ed)) put(); }, ms)); }
  scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}
function answer(a) {
  st.answers[st.i] = a;
  const next = SC.qs.findIndex((_, k) => !st.answers[k]);
  if (next === -1) st.finished = true; else Object.assign(st, { i: next, act: -1, sel: -1, t: "" });
  render();
}
const answerRow = (k) => { const x = items()[k]; if (x) answer({ text: x.val }); };
const skip = () => answer({ text: cur().skipAs, skipped: true });
const useTyped = () => { const v = typedValue(); if (v) answer({ text: v }); };
function rowClick(k) { if (V === "b") { st.sel = st.sel === k ? -1 : k; refreshLive(); } else answerRow(k); }
function cont() { if (st.sel >= 0) answerRow(st.sel); else useTyped(); }
const mark = () => $$(".opt").forEach((el, k) => el.classList.toggle("act", k === st.act));

document.addEventListener("click", (e) => {
  const t = e.target;
  const r = t.closest("[data-row]"); if (r) return rowClick(+r.dataset.row);
  const a = t.closest("[data-act]");
  if (a && a.dataset.act === "keep") return answer({ text: PROMPT, skipped: true });
  if (a && a.dataset.act === "usep") return answer({ text: $("#spEdit").innerText.trim().replace(/\s+/g, " ") });
  const ph = t.closest("mark.ph"); if (ph) { const r = document.createRange(); r.selectNodeContents(ph); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); return; }
  if (a) { const k = a.dataset.act; return k === "skip" ? skip() : k === "continue" ? cont() : useTyped(); }
  if (t.closest("[data-prev]")) { Object.assign(st, { i: st.i - 1, act: -1, sel: -1, t: "" }); return render(); }
  if (t.closest("[data-next]")) { Object.assign(st, { i: st.i + 1, act: -1, sel: -1, t: "" }); return render(); }
  if (t.closest("[data-close]")) { st.closed = true; return render(false); }
  if (t.closest("[data-reopen]")) { st.closed = false; return render(); }
  if (t.closest("[data-restart]")) { Object.assign(st, { i: 0, act: -1, sel: -1, t: "", answers: [], finished: false }); return render(); }
  if (t.closest("#theme")) { const h = document.documentElement; h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark"; }
});
/* Keys: arrows move over rows, Enter answers (A, C) or selects then continues (B), 1 to 9 pick, Esc closes, typing goes to the field. */
document.addEventListener("keydown", (e) => {
  if (st.closed || st.finished) return;
  if (P === "s") { if (e.key === "Escape") { st.closed = true; render(false); } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("[data-act=usep]")?.click(); } return; }
  const n = items().length, inField = e.target.id === "fld";
  /* One selection at a time, moved by position. The field sits under the list:
     Up from the field selects the row above it; Down from the last row selects the field again. */
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) {
    e.preventDefault();
    const up = e.key === "ArrowUp", rows = $$(".opt");
    let k;
    if (inField) { if (!up) return; k = n - 1; }
    else if (st.act < 0) k = up ? n - 1 : 0;
    else if (up) k = Math.max(0, st.act - 1);
    else if (st.act === n - 1) { st.act = -1; mark(); return $("#fld")?.focus({ preventScroll: true }); }
    else k = st.act + 1;
    st.act = k; mark(); rows[k]?.focus({ preventScroll: true }); rows[k]?.scrollIntoView?.({ block: "nearest" }); return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (V === "b") { if (st.act >= 0 && st.act !== st.sel) { st.sel = st.act; return refreshLive(); } return continueOK() ? cont() : null; }
    if (st.act >= 0) return answerRow(st.act);
    if (inField && st.t.trim()) return useTyped();
    return;
  }
  if (e.key === "Escape") { st.closed = true; return render(false); }
  if (!inField && !cur().search && /^[1-9]$/.test(e.key) && +e.key <= n) { e.preventDefault(); return rowClick(+e.key - 1); }
  if (!inField && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) $("#fld")?.focus();
});
document.addEventListener("focusin", (e) => { if (e.target.id === "fld") { st.act = -1; mark(); } else { const o = e.target.closest?.(".opt"); if (o) { st.act = +o.dataset.row; mark(); } } });
render();
</script>
</body>
</html>
