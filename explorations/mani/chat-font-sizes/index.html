<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat font sizes</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
<style>
/* Chat create flow (ChatFlowScreenV8, redesign branch on madhu_ui_v2), rebuilt to compare type sizes.
   Values from config/tailwind/pai.tailwind.config.js. The size tabs swap the four text tokens below together:
   body (14/20 today), caption (13/18), heading (18/26). Spacing, icons and controls stay as in the app. */
:root {
  --ink: 20 20 31; --ink-2: 78 78 94; --ink-3: 108 108 124; --ink-off: 163 163 176;
  --canvas: 248 248 251; --surface: 255 255 255; --sunken: 243 243 247; --line: 228 228 236;
  --tint: 236 235 255; --brand: 52 39 255; --brand-hover: 42 31 214;
  --pai-brand: 52 39 255; /* read by createPaiLoader (ResearchSpinner's BRAND_THEMED) */
  --shadow-menu: 0 1px 2px 0 rgba(16,12,60,.06), 0 8px 24px -6px rgba(9,15,21,.16);
  --shadow-btn: inset 0 1px 0 0 rgba(255,255,255,.15), 0 1px 2px 0 rgba(16,12,60,.2);
  --ease: cubic-bezier(.2,0,0,1);
  /* Size tokens (current = 14) */
  --body: 14px; --body-lh: 20px; --cap: 13px; --cap-lh: 18px; --head: 18px; --head-lh: 26px; --title: 24px; --title-lh: 32px;
}
:root[data-size="13"] { --body: 13px; --body-lh: 18px; --cap: 12px; --cap-lh: 16px; --head: 17px; --head-lh: 24px; --title: 22px; --title-lh: 30px; }
:root[data-size="15"] { --body: 15px; --body-lh: 22px; --cap: 14px; --cap-lh: 20px; --head: 19px; --head-lh: 28px; --title: 25px; --title-lh: 32px; }
:root[data-size="16"] { --body: 16px; --body-lh: 24px; --cap: 15px; --cap-lh: 22px; --head: 20px; --head-lh: 28px; --title: 26px; --title-lh: 34px; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: -apple-system, system-ui, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; background: rgb(var(--canvas)); color: rgb(var(--ink)); -webkit-font-smoothing: antialiased; }
.body { font-size: var(--body); line-height: var(--body-lh); }
.cap { font-size: var(--cap); line-height: var(--cap-lh); }
.ttl { font-size: var(--title); line-height: var(--title-lh); letter-spacing: -.015em; }
.head { font-size: var(--head); line-height: var(--head-lh); letter-spacing: -.005em; }
button { font: inherit; }

.screen { position: fixed; inset: 0 0 52px; display: flex; flex-direction: column; overflow: hidden; text-wrap: pretty; }
/* Header: 56px, max-w-5xl, back / theme / close */
header { position: sticky; top: 0; z-index: 30; flex: none; border-bottom: 1px solid rgb(var(--line)); background: rgb(var(--canvas) / .85); backdrop-filter: blur(8px); }
header .in { max-width: 1024px; height: 56px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
.icon-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: rgb(var(--ink-2)); background: none; border: 0; cursor: pointer; transition: background-color .15s, color .15s; }
.icon-btn:hover { background: rgb(var(--sunken)); color: rgb(var(--ink)); }
.icon-btn svg { width: 20px; height: 20px; }

/* Thread */
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 80px; }
.col { max-width: 752px; margin: 0 auto; padding-top: 16px; display: flex; flex-direction: column; }
.user-row { display: flex; justify-content: flex-end; margin-bottom: 48px; }
.bubble { max-width: 612px; border-radius: 12px; background: rgb(var(--tint)); padding: 12px 16px; overflow-wrap: anywhere; }
.bubble p { margin: 0; }
/* ResearchProgress: flex mb-4 > max-w-[85%] px-1 py-1; the active segment container adds mb-1 (4 + 16 = 20px under it). */
.bot { max-width: 85%; width: 100%; padding: 4px; margin-bottom: 20px; }
.thought { margin-bottom: 10px; padding: 4px 8px; }
.thought .row { height: 32px; display: flex; align-items: center; gap: 8px; color: rgb(var(--ink-2)); cursor: pointer; }
.chev { width: 16px; height: 16px; color: rgb(var(--ink-3)); flex: none; }
.active-head { height: 32px; display: flex; align-items: center; min-width: 0; }
.logo { width: 24px; height: 24px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: rgb(var(--brand)); }
.phrase { margin-left: 12px; display: inline-block; white-space: nowrap; color: rgb(var(--ink-2)); }
.phrase > span { display: inline-block; opacity: 0; transition-property: opacity; transition-timing-function: cubic-bezier(.23,1,.32,1); }
.phrase > span.on { opacity: 1; }
.timer { margin-left: 4px; color: rgb(var(--ink-3)); font-variant-numeric: tabular-nums; }
.chunk { display: flex; margin-top: 4px; animation: fade .25s both; }
.rail { width: 24px; flex: none; display: flex; flex-direction: column; align-items: center; }
.rail .seg { width: 1px; height: 6px; }
.rail .dot { margin: 5px 0; width: 6px; height: 6px; border-radius: 9999px; background: rgb(var(--ink-3)); }
.chunk .txt { flex: 1; min-width: 0; padding-left: 12px; padding-bottom: 4px; min-height: 28px; display: flex; align-items: center; }
.chunk .h { font-weight: 500; }
.chunk.done .h { font-weight: 400; color: rgb(var(--ink-2)); }
/* Shimmer text (.timeline-shimmer, redesign override) */
.shimmer-text { background-image: linear-gradient(90deg, #4E4E5E 0%, #4E4E5E 18%, #A3A3B0 50%, #4E4E5E 82%, #4E4E5E 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.2s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.notif { margin-bottom: 16px; }
.notif .card { display: inline-flex; max-width: 100%; flex-wrap: wrap; align-items: center; column-gap: 24px; row-gap: 8px; border-radius: 12px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 12px 16px; box-shadow: var(--shadow-menu); animation: fade .25s both; }
.notif .t { font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; border-radius: 6px; font-weight: 500; border: 0; cursor: pointer; transition: background-color .15s, color .15s, transform .12s; }
.btn:active { transform: scale(.98); }
.btn-sm { height: 32px; padding: 0 12px; gap: 6px; }
.btn-md { height: 36px; padding: 0 14px; gap: 8px; }
.btn-primary { background: rgb(var(--brand)); color: #fff; box-shadow: var(--shadow-btn); }
.btn-primary:hover { background: rgb(var(--brand-hover)); }
.btn-ghost { background: transparent; color: rgb(var(--ink-2)); }
.btn-ghost:hover { background: rgb(var(--sunken)); color: rgb(var(--ink)); }
.btn svg { width: 16px; height: 16px; }

.question { margin-bottom: 48px; padding: 4px; max-width: 85%; }
.question p { margin: 0; }
.stream-word { opacity: 0; animation: fade .3s forwards; }

/* Docked company card */
.dock { flex: none; padding: 0 24px 20px; animation: dockIn .22s var(--ease) both; }
@keyframes dockIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.dock .w { max-width: 752px; margin: 0 auto; padding: 4px; }
.dock .card { border-radius: 12px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 24px; box-shadow: var(--shadow-menu); animation: cardUp .4s cubic-bezier(.22,1,.36,1) both; }
@keyframes cardUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.dock .title { margin: 0 0 16px; font-weight: 600; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: rgb(var(--ink-3)); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 6px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 0 12px 0 36px; color: rgb(var(--ink)); font: inherit; font-size: var(--body); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: rgb(var(--ink-3)); }
.search input:hover { border-color: rgb(20 20 31 / .2); }
.search input:focus { border-color: rgb(var(--brand)); box-shadow: 0 0 0 2px rgb(var(--brand) / .2); }
.list { margin-top: 12px; display: flex; flex-direction: column; }
.co { display: flex; width: 100%; align-items: center; gap: 12px; border-radius: 6px; padding: 8px 10px; cursor: pointer; border: 0; background: none; text-align: left; transition: background-color .15s; }
.co:hover, .co.sel { background: rgb(var(--sunken)); }
.co .chip { width: 28px; height: 28px; flex: none; border-radius: 6px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); display: flex; align-items: center; justify-content: center; }
.co .chip img { width: 16px; height: 16px; border-radius: 2px; }
.co .nm { color: rgb(var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
.co .dm { color: rgb(var(--ink-3)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
.foot-row { margin-top: 16px; display: flex; align-items: center; justify-content: flex-end; }
.cont { overflow: hidden; max-width: 0; transition: max-width .22s var(--ease); }
.cont.on { max-width: 180px; }
.cont .btn { margin-left: 12px; padding-right: 12px; }

/* After Continue: Q&A bubble, research timeline, fast-editor status (MessageBubble / ClipEBlock / ResearchProgress). */
.qa .q { font-weight: 500; margin: 0; }
.qa .a { margin-top: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dchip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 2px 8px; color: rgb(var(--ink)); text-decoration: none; }
.dchip img { width: 16px; height: 16px; border-radius: 2px; flex: none; }
.dchip.src { color: rgb(var(--ink-2)); }
.chunk .rail .seg.line, .chunk .rail .tail { background: rgb(var(--line)); }
.chunk .rail .tail { width: 1px; flex: 1; }
.chunk .txt.col { flex-direction: column; align-items: stretch; justify-content: flex-start; }
.chunk .hrow { display: flex; align-items: center; gap: 6px; min-height: 28px; }
.chunk .bodytxt { color: rgb(var(--ink-2)); padding: 4px 0; }
.chunk .srcs { display: flex; align-items: center; gap: 4px; color: rgb(var(--ink-3)); margin-top: 8px; }
.chunk .srcs svg { width: 14px; height: 14px; }
.fold { overflow: hidden; display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s cubic-bezier(.23,1,.32,1), opacity .28s cubic-bezier(.23,1,.32,1); }
.fold > div { min-height: 0; }
.fold.shut { grid-template-rows: 0fr; opacity: 0; }

/* "Building your deck" (DeckBuildingScreen.jsx, redesign): fixed over the chat, 300px list + 3-col grid. */
.build { position: fixed; inset: 0 0 52px; z-index: 40; display: flex; flex-direction: column; overflow-y: auto; background: rgb(var(--canvas)); animation: buildIn .28s cubic-bezier(.2,0,0,1) both; }
@keyframes buildIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.build header .in { max-width: 1152px; }
.build main { max-width: 1152px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 40px; padding: 40px 24px 64px; }
.build h1 { margin: 0; font-weight: 600; color: rgb(var(--ink)); }
.bcount { margin-top: 12px; display: flex; justify-content: space-between; color: rgb(var(--ink-3)); font-variant-numeric: tabular-nums; }
.btrack { margin-top: 8px; height: 6px; border-radius: 9999px; background: rgb(var(--line)); overflow: hidden; }
.btrack > div { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(135deg, rgb(52 39 255), rgb(53 102 254)); transition: width .5s cubic-bezier(.2,0,0,1); }
.bstatus { position: relative; margin-top: 16px; height: calc(var(--body-lh) * 2); overflow: hidden; }
.bstatus p { position: absolute; left: 0; right: 0; top: 0; margin: 0; color: rgb(var(--ink-2)); transition: transform .28s cubic-bezier(.2,0,0,1), opacity .28s cubic-bezier(.2,0,0,1); }
.bstatus p.enter { transform: translateY(14px); opacity: 0; }
.bstatus p.exit { transform: translateY(-14px); opacity: 0; }
.blist { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.blist li { display: flex; align-items: center; gap: 10px; border-radius: 6px; padding: 6px 8px; color: rgb(var(--ink-3)); transition: background-color .15s; }
.blist li.done, .blist li.active { color: rgb(var(--ink)); }
.blist li.active { background: rgb(236 235 255 / .7); }
.blist .ic { position: relative; width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
.blist .ic .pend { width: 8px; height: 8px; border-radius: 9999px; background: rgb(var(--line)); }
.blist .ic .ring { width: 16px; height: 16px; border-radius: 9999px; border: 2px solid rgb(var(--brand)); border-top-color: transparent; animation: spin .8s linear infinite; }
.blist .ic .ok { width: 20px; height: 20px; border-radius: 9999px; background: #DCFCE7; color: #15803D; display: flex; align-items: center; justify-content: center; animation: pop .35s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
.blist .tt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; }
.bcell { position: relative; aspect-ratio: 16 / 9; }
.bph { position: absolute; inset: 0; border-radius: 12px; border: 1px solid rgb(var(--line)); background: rgb(var(--sunken)); }
.bph.shine { background: linear-gradient(110deg, #ececec 8%, #f4f4f4 18%, #ececec 33%); background-size: 200% 100%; animation: shine 1.5s linear infinite; }
@keyframes shine { to { background-position-x: -200%; } }
.bprev { position: absolute; inset: 0; border-radius: 12px; border: 1px solid rgb(var(--line)); background: #fff; overflow: hidden; box-shadow: 0 0 0 1px rgb(20 20 31 / .06), 0 1px 2px 0 rgb(16 12 60 / .09); animation: prevIn .4s cubic-bezier(.2,0,0,1) both; container-type: inline-size; }
@keyframes prevIn { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
/* Mini slide inside a finished card (stand-in for the cloned real slide) */
.ms { position: absolute; inset: 0; padding: 9cqw 9cqw; display: flex; flex-direction: column; gap: 3cqw; font-family: -apple-system, system-ui, sans-serif; }
.ms .k { font-size: 3.4cqw; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #C8553D; }
.ms .t { font-size: 6.6cqw; line-height: 1.15; font-weight: 600; color: #1F1D1A; letter-spacing: -.02em; }
.ms .l { height: 2.4cqw; border-radius: 9999px; background: #E9DFCF; }
.ms.dark { background: #1F1D1A; }
.ms.dark .t { color: #F7F3EC; font-size: 8.4cqw; }
.ms .bars { margin-top: auto; display: flex; align-items: flex-end; gap: 3cqw; height: 26cqw; }
.ms .bars i { flex: 1; border-radius: 1cqw 1cqw 0 0; background: #E9DFCF; }
.ms .bars i:nth-child(3n) { background: #C8553D; }

/* All-screens view + embedded frames (proto only) */
.allgrid { position: fixed; inset: 0 0 52px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; background: #E9E9EF; }
.allgrid figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.allgrid figcaption { font: 600 12px/16px -apple-system, system-ui, sans-serif; color: rgb(var(--ink-2)); }
.allgrid .frame { position: relative; width: 100%; aspect-ratio: 1440 / 900; overflow: hidden; border-radius: 10px; border: 1px solid rgb(var(--line)); background: rgb(var(--canvas)); box-shadow: var(--shadow-menu); }
.allgrid iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform: scale(var(--k, .5)); transform-origin: top left; }
.embed .proto, .embed #agentation-root { display: none; }
.embed .screen, .embed .build { bottom: 0; }

/* Proto footer (not part of the design): size tabs + Replay */
.proto { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; background: rgb(20 20 31); color: #fff; font: 500 12px/16px -apple-system, system-ui, sans-serif; white-space: nowrap; }
.proto .tabs { display: flex; gap: 2px; }
.proto a, .proto button { color: rgb(255 255 255 / .72); text-decoration: none; background: transparent; border: 0; border-radius: 8px; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font: inherit; cursor: pointer; }
.proto a:hover, .proto button:hover { background: rgb(255 255 255 / .1); color: #fff; }
.proto [aria-selected="true"] { background: #fff !important; color: rgb(20 20 31) !important; }
.proto .tag { font-size: 11px; opacity: .7; }
.proto .sep { width: 1px; height: 18px; margin: 0 4px; background: rgb(255 255 255 / .18); }
.proto .replay { color: #fff; }
@media (prefers-reduced-motion: reduce) { .shimmer-text { animation: none; color: rgb(var(--ink-2)); background: none; } }
</style>
</head>
<body>
<div class="screen">
  <header><div class="in">
    <button class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg></button>
    <div style="display:flex;gap:4px">
      <button class="icon-btn" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg></button>
      <button class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"/></svg></button>
    </div>
  </div></header>
  <div class="scroll"><div class="col" id="thread">
    <div class="user-row"><div class="bubble body"><p>Research presentation on the impact of social media on teenage mental health covering literature review methodology survey findings analysis limitations and recommendations for a university psychology course</p></div></div>
  </div></div>
  <div id="dock"></div>
</div>

<nav class="proto" aria-label="Font size">
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="sep"></span>
  <a href="?all" id="allbtn" class="replay">All screens</a>
  <button type="button" class="replay" id="replay"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>Replay</button>
</nav>

<script src="createPaiLoader.js"></script>
<script>
// All-screens view (?all): the four moments side by side, each a live frame of this page held at its checkpoint.
const ALL_VIEW = new URLSearchParams(location.search).has("all");
if (ALL_VIEW) {
  document.querySelector(".screen").remove();
  const NAMES = ["Thinking", "Company", "Research", "Building your deck"];
  const grid = document.createElement("div");
  grid.className = "allgrid";
  grid.innerHTML = NAMES.map((n, i) => `<figure><figcaption>${i + 1} · ${n}</figcaption><div class="frame"><iframe src="?screen=${i + 1}&embed${location.hash}" title="${n}"></iframe></div></figure>`).join("");
  document.body.prepend(grid);
  const fit = () => grid.querySelectorAll(".frame").forEach((fr) => { fr.style.setProperty("--k", fr.clientWidth / 1440); });
  addEventListener("resize", fit);
  requestAnimationFrame(fit);
}
// Size: from the hash (#13 / #14 / #15 / #16), default 14 = current.
const SIZES = [["13", "Old"], ["14", "Current"], ["15", ""], ["16", ""]];
const size = SIZES.some(([s]) => "#" + s === location.hash) ? location.hash.slice(1) : "14";
document.documentElement.dataset.size = size;
document.getElementById("tabs").innerHTML = SIZES.map(([s, tag]) => `<button type="button" role="tab" data-size="${s}" aria-selected="${s === size}">${s}px${tag ? ` <span class="tag">${tag}</span>` : ""}</button>`).join("");
// Size tabs apply live to whatever is on screen (no reload); in the all-screens view they also reach every frame.
function setSize(sz) {
  document.documentElement.dataset.size = sz;
  document.querySelectorAll("#tabs [data-size]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.size === sz)));
  history.replaceState(null, "", location.pathname + location.search + "#" + sz);
  document.querySelectorAll("iframe").forEach((f) => { try { f.contentDocument.documentElement.dataset.size = sz; } catch (e) {} });
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-size]");
  if (b) setSize(b.dataset.size);
});
document.getElementById("replay").onclick = () => location.reload();
{
  const all = document.getElementById("allbtn");
  if (new URLSearchParams(location.search).has("all")) { all.textContent = "Single screen"; all.href = location.pathname; }
  all.addEventListener("click", (e) => { e.preventDefault(); location.href = all.getAttribute("href") + "#" + document.documentElement.dataset.size; });
}

// ?screen=1..4 jumps straight to one moment and holds there (used by the all-screens view):
// 1 thinking, 2 company pick, 3 research, 4 building. Everything before it runs instantly.
const params = new URLSearchParams(location.search);
const TARGET = Number(params.get("screen")) || 0;
const EMBED = params.has("embed");
let FAST = TARGET > 0;
if (EMBED) document.documentElement.classList.add("embed");
const checkpoint = (n) => {
  if (TARGET !== n) return Promise.resolve();
  FAST = false;
  return new Promise(() => {});
};

const thread = document.getElementById("thread");
const wait = (ms) => new Promise((r) => setTimeout(r, FAST ? 0 : ms));
const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>`;
// Appends to the thread and keeps it pinned to the bottom, as the chat scroller does.
const add = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); const el = t.content.firstElementChild; thread.appendChild(el); requestAnimationFrame(() => { const sc = thread.closest(".scroll"); sc.scrollTop = sc.scrollHeight; }); return el; };

(async () => {
  if (ALL_VIEW) return;
  await wait(500);
  add(`<div class="thought"><div class="row body">Thought for 1s${CHEV}</div></div>`);
  await wait(500);
  add(`<div class="thought"><div class="row body">Thought for 1s${CHEV}</div></div>`);
  await wait(400);
  // Active segment header, as ClipEBlock renders it: ResearchSpinner (createPaiLoader on a 120px tile scaled to 22px)
  // + CyclingLabel (shuffled generic pool, 700ms fade-in, 3300ms hold, 180ms fade-out) + the elapsed timer.
  const live = add(`<div class="bot"><div class="active-head"><span class="logo"><span style="width:22px;height:22px;position:relative"><span data-mount style="position:absolute;top:0;left:0;width:120px;height:120px;transform:scale(${22 / 120});transform-origin:top left"></span></span></span><span class="phrase body" data-p></span><span class="timer body" data-s>1s</span></div>
    <div class="chunk"><div class="rail"><span class="seg"></span><span class="dot"></span></div><div class="txt"><span class="h body shimmer-text" data-h>Checking who this deck is for</span></div></div></div>`);
  const loader = window.createPaiLoader(live.querySelector("[data-mount]"), { config: { color: "rgb(var(--pai-brand, 0 85 237))", scale: 1, background: "transparent" } });
  const CYCLE = ["idle", "thinking", "reasoning", "searching"];
  let step = 0;
  loader.setPhase(CYCLE[0]);
  const POOL = ["On the right track", "Pieces are clicking", "Working behind the scenes", "Making steady progress on this", "Letting it simmer", "Thinking it over"];
  const phrases = ["Pieces are clicking", ...POOL.filter((p) => p !== "Pieces are clicking").sort(() => Math.random() - 0.5)];
  const pEl = live.querySelector("[data-p]");
  let pi = 0, cycling = true;
  const showPhrase = () => {
    pEl.innerHTML = `<span class="shimmer-text" style="transition-duration:700ms">${phrases[pi % phrases.length]}...</span>`;
    requestAnimationFrame(() => requestAnimationFrame(() => pEl.firstElementChild.classList.add("on")));
  };
  (async () => {
    showPhrase();
    while (cycling) {
      await wait(700 + 3300);
      if (!cycling) break;
      pEl.firstElementChild.style.transitionDuration = "180ms";
      pEl.firstElementChild.classList.remove("on");
      await wait(180);
      if (!cycling) break;
      pi += 1;
      step += 1;
      loader.setPhase(CYCLE[step % CYCLE.length]);
      showPhrase();
    }
  })();
  let sec = 1;
  const tick = setInterval(() => { sec += 1; live.querySelector("[data-s]").textContent = sec + "s"; }, 1000);
  await wait(900);
  const notif = add(`<div class="notif"><div class="card body"><span class="t">Get notified when your deck is ready?</span><button class="btn btn-primary btn-sm cap">Yes, notify me</button></div></div>`);
  await checkpoint(1);
  // Long enough to see two phrase swaps and the logo morph into the spinners.
  await wait(11500);
  cycling = false;
  loader.destroy();
  // Step done -> question in the thread, card docks at the bottom.
  clearInterval(tick);
  notif.remove();
  live.outerHTML = `<div class="thought"><div class="row body">Thought for ${sec}s${CHEV}</div></div>`;
  const q = add(`<div class="question"><p class="body"></p></div>`);
  const words = "What company is this presentation for?".split(" ");
  q.firstElementChild.innerHTML = words.map((w, i) => `<span class="stream-word" style="animation-delay:${i * 60}ms">${w}</span>`).join(" ");
  await wait(words.length * 60 + 200);
  const cos = [["Google", "google.com"], ["PayPal", "paypal.com"], ["Slack", "slack.com"]];
  document.getElementById("dock").innerHTML = `<div class="dock"><div class="w"><div class="card">
    <p class="title head">What company is this presentation for?</p>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg><input type="text" placeholder="www.company-name.com" autocomplete="off"></div>
    <div class="list">${cos.map(([n, d]) => `<button class="co" type="button" data-d="${d}"><span class="chip"><img src="https://www.google.com/s2/favicons?domain=${d}&sz=32" alt=""></span><span style="flex:1;min-width:0"><p class="nm body">${n}</p><p class="dm cap">${d}</p></span></button>`).join("")}</div>
    <div class="foot-row"><button class="btn btn-ghost btn-md body">Skip</button><span class="cont" id="cont"><button class="btn btn-primary btn-md body">Continue<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></button></span></div>
  </div></div></div>`;
  document.querySelectorAll(".co").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".co").forEach((x) => x.classList.toggle("sel", x === b));
    document.querySelector(".search input").value = b.dataset.d;
    document.getElementById("cont").classList.add("on");
  }));
  // Skip goes on to the same loading screen, just without a company.
  document.querySelector(".foot-row .btn-ghost").addEventListener("click", () => runResearch(null, null));
  document.querySelector("#cont .btn").addEventListener("click", () => {
    const sel = document.querySelector(".co.sel");
    if (sel) runResearch(sel.querySelector(".nm").textContent, sel.dataset.d);
  });
  if (TARGET >= 2) {
    await wait(400);
    document.querySelectorAll(".co")[1].click();
    await checkpoint(2);
    document.querySelector("#cont .btn").click();
  }
})();

// ---------- After Continue (ChatFlowScreenV8 handleServerOptionSelect -> ResearchProgress -> fast editor) ----------
const GENERIC = ["On the right track", "Pieces are clicking", "Working behind the scenes", "Making steady progress on this", "Letting it simmer", "Thinking it over"];
const RESEARCH = ["Researching", "Digging in", "Pulling threads together", "Picking up the patterns", "Following up on a few leads", "Working through the details now", ...GENERIC];
const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
const CYCLE = ["idle", "thinking", "reasoning", "searching"];

// One active segment header: ResearchSpinner + CyclingLabel (fitContent, shimmer) + timer, as in ClipEBlock.
function activeHeader(host, pool, startStep) {
  host.innerHTML = `<div class="active-head"><span class="logo"><span style="width:22px;height:22px;position:relative"><span data-mount style="position:absolute;top:0;left:0;width:120px;height:120px;transform:scale(${22 / 120});transform-origin:top left"></span></span></span><span class="phrase body" data-p></span><span class="timer body" data-s>0s</span></div>`;
  const loader = window.createPaiLoader(host.querySelector("[data-mount]"), { config: { color: "rgb(var(--pai-brand, 0 85 237))", scale: 1, background: "transparent" } });
  let step = startStep, i = 0, alive = true, sec = 0;
  loader.setPhase(CYCLE[step % CYCLE.length]);
  const list = shuffle(pool), pEl = host.querySelector("[data-p]");
  const show = () => {
    pEl.innerHTML = `<span class="shimmer-text" style="transition-duration:700ms">${list[i % list.length]}...</span>`;
    requestAnimationFrame(() => requestAnimationFrame(() => pEl.firstElementChild && pEl.firstElementChild.classList.add("on")));
  };
  show();
  (async () => {
    while (alive) {
      await wait(4000);
      if (!alive) return;
      pEl.firstElementChild.style.transitionDuration = "180ms";
      pEl.firstElementChild.classList.remove("on");
      await wait(180);
      if (!alive) return;
      i += 1; step += 1;
      loader.setPhase(CYCLE[step % CYCLE.length]);
      show();
    }
  })();
  const t = setInterval(() => { sec += 1; host.querySelector("[data-s]").textContent = sec + "s"; }, 1000);
  return { stop() { alive = false; clearInterval(t); loader.destroy(); return Math.max(1, sec); } };
}

const SRC_CHEV = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>`;
const fav = (d) => `https://www.google.com/s2/favicons?domain=${d}&sz=32`;

async function runResearch(name, domain) {
  document.getElementById("dock").innerHTML = "";
  // Q&A user bubble with the DomainChip
  if (domain) add(`<div class="user-row"><div class="bubble qa"><p class="q body">Q: What company is this presentation for?</p><div class="a"><span class="body">A:</span><a class="dchip cap" href="https://${domain}" target="_blank" rel="noopener"><img src="${fav(domain)}" alt="">${domain}</a></div></div></div>`);
  const block = add(`<div class="bot"><div data-done></div><div data-live></div><div data-chunks></div></div>`);
  const done = block.querySelector("[data-done]"), liveHost = block.querySelector("[data-live]"), chunks = block.querySelector("[data-chunks]");
  const notif = add(`<div class="notif"><div class="card body"><span class="t">Get notified when your deck is ready?</span><button class="btn btn-primary btn-sm cap">Yes, notify me</button></div></div>`);

  // A segment = active header + one chunk; when the next tool starts it folds into "Thought for Ns".
  const segment = async (pool, startStep, chunkHTML, ms, cp) => {
    const head = activeHeader(liveHost, pool, startStep);
    chunks.innerHTML = chunkHTML;
    if (cp) await checkpoint(cp);
    await wait(ms);
    const secs = head.stop();
    const h = chunks.querySelector("[data-h]");
    if (h) { h.classList.remove("shimmer-text"); h.textContent = h.dataset.done || h.textContent; h.closest(".chunk").classList.add("done"); }
    await wait(400);
    chunks.innerHTML = "";
    done.insertAdjacentHTML("beforeend", `<div class="thought" style="padding-left:4px"><div class="row body">Thought for ${secs}s${CHEV}</div></div>`);
    liveHost.innerHTML = "";
  };
  const chunk = (heading, doneLabel, extra = "") => `<div class="chunk"><div class="rail"><span class="seg"></span><span class="dot"></span></div><div class="txt col"><div class="hrow"><span class="h body shimmer-text" data-h data-done="${doneLabel}">${heading}</span></div>${extra}</div></div>`;

  await segment(RESEARCH, 1, chunk("Understanding the brief", "Understanding the brief", `<div class="bodytxt body">A university psychology deck on social media and teen mental health${name ? `, for ${name}` : ""}.</div>`), 3200);
  if (domain) {
    await segment(RESEARCH, 2, chunk(`Searching for ${name}`, `Searched ${name}`), 3000);
    await segment(RESEARCH, 3, chunk(`Fetching <a class="dchip src cap" href="https://${domain}" target="_blank" rel="noopener"><img src="${fav(domain)}" alt="">${domain}</a>`, "Fetched"), 2600);
  } else {
    await segment(RESEARCH, 2, chunk("Researching", "Researched"), 3000);
  }
  await segment(RESEARCH, 0, chunk("Deep researching", "Deep researching", `<div class="bodytxt body">social media use and adolescent anxiety depression studies 2020 to 2026 meta analysis…</div><div class="srcs body">${SRC_CHEV}6 sources</div>`), 4600, 3);

  // Fast-editor status (outline started): FALLBACK_PHRASES ("Thinking..." + generics) until the first slide, then the editor opens.
  const fe = activeHeader(liveHost, ["Thinking", ...GENERIC], 1);
  await wait(6000);
  fe.stop();
  notif.remove();
  showBuilding();
}

// ---------- "Building your deck" (DeckBuildingScreen): slides render in parallel, so rows can tick out of order ----------
const SLIDE_TITLES = ["Social Media and Teen Mental Health", "Why this question matters now", "What the research already says", "How we ran the study", "Who took part", "Screen time by platform", "Anxiety and depression findings", "Sleep and self-esteem", null, "Patterns across age groups", "Where the evidence is thin", "Limitations of this study", null, null, null];
const SLIDE_PHRASES = ["Designing outline", "Putting the pieces in place", "Stitching this together", "Building the flow", "Plugging away at the details", "Sharpening the message", ...GENERIC];
// Render order: mostly in sequence, with a few late slides finishing early (9, 13, 14, 15 like the real stream).
const ORDER = [0, 1, 8, 2, 3, 12, 13, 14, 4, 5, 6, 7, 9, 10, 11];

async function showBuilding() {
  const N = SLIDE_TITLES.length;
  const title = (i) => SLIDE_TITLES[i] || `Slide ${i + 1}`;
  const el = document.createElement("div");
  el.className = "build";
  el.innerHTML = `<header><div class="in"><div></div><button class="icon-btn" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg></button></div></header>
    <main><section>
      <h1 class="ttl">Building your deck</h1>
      <div class="bcount cap" aria-live="polite"><span data-idx>Slide 1 of ${N}</span><span data-pct>0%</span></div>
      <div class="btrack"><div data-bar></div></div>
      <div class="bstatus body" data-status></div>
      <ol class="blist">${Array.from({ length: N }, (_, i) => `<li class="cap" data-row="${i}"><span class="ic"><span class="pend"></span></span><span class="tt">${title(i)}</span></li>`).join("")}</ol>
    </section>
    <div class="bgrid" aria-label="Slides as they finish">${Array.from({ length: N }, (_, i) => `<div class="bcell" data-cell="${i}"><div class="bph"></div></div>`).join("")}</div></main>`;
  document.body.appendChild(el);
  const $ = (q) => el.querySelector(q);
  const done = new Set();
  let status = "";
  const setStatus = (text) => {
    if (text === status) return;
    status = text;
    const box = $("[data-status]");
    const old = box.querySelector("p:not(.exit)");
    if (old) { old.classList.add("exit"); setTimeout(() => old.remove(), 300); }
    const p = document.createElement("p");
    p.className = "enter";
    p.textContent = text;
    box.appendChild(p);
    requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("enter")));
  };
  const mini = (i) => i === 0
    ? `<div class="ms dark"><span class="k">Psychology 210</span><span class="t">${title(i)}</span></div>`
    : `<div class="ms"><span class="k">Section ${String(i).padStart(2, "0")}</span><span class="t">${title(i)}</span>${i % 3 === 1 ? `<div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div>` : `<span class="l" style="width:80%"></span><span class="l" style="width:64%"></span><span class="l" style="width:72%"></span>`}</div>`;
  const paint = () => {
    const active = [...Array(N).keys()].find((i) => !done.has(i));
    for (let i = 0; i < N; i++) {
      const row = $(`[data-row="${i}"]`), cell = $(`[data-cell="${i}"]`);
      const state = done.has(i) ? "done" : i === active ? "active" : "pend";
      if (row.dataset.state !== state) {
        row.dataset.state = state;
        row.className = "cap " + (state === "pend" ? "" : state);
        row.querySelector(".ic").innerHTML = state === "done" ? `<span class="ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.75 6 6 9-13.5"/></svg></span>` : state === "active" ? `<span class="ring"></span>` : `<span class="pend"></span>`;
        cell.innerHTML = state === "done" ? `<div class="bprev">${mini(i)}</div>` : `<div class="bph${state === "active" ? " shine" : ""}"></div>`;
      }
    }
    const pct = Math.round((done.size / N) * 100);
    $("[data-idx]").textContent = `Slide ${Math.min(done.size + 1, N)} of ${N}`;
    $("[data-pct]").textContent = pct + "%";
    $("[data-bar]").style.width = pct + "%";
    if (done.size === N) setStatus("Finalizing your deck…");
    else setStatus(`Writing “${title(active)}”`);
  };
  // Warm-up: slides phrases every 2.2s, bar creeps to 5%.
  const pool = shuffle(SLIDE_PHRASES.slice(1));
  setStatus("Designing outline...");
  paint();
  setStatus("Designing outline...");
  for (let k = 0; k < 3; k++) {
    $("[data-bar]").style.width = (k + 1) * 1.6 + "%";
    $("[data-pct]").textContent = Math.round((k + 1) * 1.6) + "%";
    await wait(2200);
    setStatus(pool[k] + "...");
  }
  await wait(1200);
  for (const [n, i] of ORDER.entries()) {
    done.add(i);
    paint();
    if (n === 5) await checkpoint(4);
    await wait(900);
  }
  // The app now selects slide 1, waits for the deck to settle and enters Present mode ("Your presentation is ready!").
}
</script>
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Agentation } from 'agentation';
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  </script>
</body>
</html>
