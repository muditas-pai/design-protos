<!doctype html>
<!-- exploration: Refer & earn, Pro reward line copy options · owner: Mani (@manivasakan-arch) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reward line options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  :root { --t1:#171717; --t2:#525252; --t3:#737373; --t4:#A3A3A3; --line:rgba(11,15,20,.09); --brand:#005EFF; --brand-bg:#EBF2FF; }
  body { margin:0; font:14px/1.45 Inter,system-ui,sans-serif; color:var(--t1); background:#FAFAFA; padding:40px 24px 80px; }
  h1 { font-size:22px; font-weight:500; margin:0 0 6px; } .sub { color:var(--t2); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 400px)); gap:20px; max-width:840px; }
  .opt { background:#fff; border-radius:8px; box-shadow:0 0 0 1px var(--line), 0 1px 2px var(--line); padding:18px 20px 12px; }
  .opt h2 { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); margin:0 0 2px; }
  .opt .ref { font-size:12px; color:var(--t4); margin-bottom:8px; }
  .row { display:flex; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line); }
  .row > i { font-size:18px; color:var(--t1); flex:none; }
  .row b { display:flex; align-items:center; gap:6px; font-weight:500; font-size:14px; }
  .row span.d { color:var(--t2); font-size:13px; }
  .row.off > i, .row.off .tx { opacity:.55; }
  .tag { font-size:11px; color:var(--t4); width:34px; flex:none; text-transform:uppercase; letter-spacing:.04em; }
  .pro { display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 6px; border-radius:9px; background:var(--brand-bg); color:var(--brand); font-size:10px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
  .pro i { font-size:10px; }
  @media (max-width: 720px) { .grid { grid-template-columns:1fr; } }
</style></head><body>
<h1>“You get 10%” row: pick one</h1>
<p class="sub">Each option shown as Free (locked, faded) and Pro (active, no badge). Current: “You get · 10% cash back when your friend upgrades to Pro”.</p>
<div class="grid" id="g"></div>
<script>
const O = [
  ['1 · Concrete amount', 'Like Hotjar and Wise: say the money, not the %', 'Earn $18 per friend', 'Cash back when they upgrade to Pro yearly. $2 on monthly.'],
  ['2 · Pro bonus', 'Like Bolt: Pro users earn on top of credits', 'Plus 10% cash back', 'When a friend you invited upgrades to Pro.'],
  ['3 · The moment', 'Like v0: tie it to what the friend does', 'When they go Pro', 'You earn 10% of their plan, paid to you in cash.'],
  ['4 · Plain and short', 'Like Square: one clear rule', 'You get 10% in cash', 'Of what your friend pays when they upgrade to Pro.'],
  ['5 · Up to', 'Like Faire: lead with the ceiling', 'Earn up to $18 cash', 'For every friend who upgrades to Pro.'],
  ['6 · Both win', 'Mirrors the credits row above', 'They go Pro, you get paid', '10% of their Pro plan comes back to you in cash.'],
];
const badge = '<span class="pro"><i class="ph-fill ph-crown-simple"></i>Pro</span>';
document.getElementById('g').innerHTML = O.map(([n, ref, t, d]) => `<div class="opt"><h2>${n}</h2><div class="ref">${ref}</div>
  <div class="row off"><span class="tag">Free</span><i class="ph-fill ph-coins"></i><div class="tx"><b>${t} ${badge}</b><span class="d">${d}</span></div></div>
  <div class="row"><span class="tag">Pro</span><i class="ph-fill ph-coins"></i><div class="tx"><b>${t}</b><span class="d">${d}</span></div></div></div>`).join('');
</script>
<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
</script>
</body></html>
