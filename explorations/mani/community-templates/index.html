<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community Templates · Publish flow</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --bg2: #FAFAFA;
    --bg3: #F5F5F5;
    --bg4: #E5E5E5;
    --t1: #171717;
    --t2: #525252;
    --t3: #737373;
    --t4: #A3A3A3;
    --ink: #0A1925;
    --ink-h: #23303B;
    --line: rgba(11, 15, 20, 0.09);
    --line2: rgba(11, 15, 20, 0.20);
    --line3: rgba(11, 15, 20, 0.06);
    --blue: #2563EB;
    --blue-bg: #EFF4FF;
    --green: #16A34A;
    --green-bg: #ECFDF3;
    --amber: #B45309;
    --amber-bg: #FFF7E6;
    --red: #DC2626;
    --sage: #A5B592;
    --sage-l: #DDE4D3;
    --sage-d: #6F8060;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; color: var(--t1); background: #D4D4D4;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .ph, .ph-fill, .ph-bold { line-height: 1; }

  /* ── Buttons ───────────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: var(--ink-h); }
  .btn-primary[disabled] { background: #9BA3AB; cursor: not-allowed; }
  .btn-outline { border: 1px solid var(--line2); background: #fff; }
  .btn-outline:hover { background: var(--bg3); }
  .btn-ghost:hover { background: var(--bg3); }
  .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
  .btn-lg { height: 40px; padding: 0 18px; font-size: 14px; }
  .link { color: var(--blue); font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
  .link:hover { text-decoration: underline; }
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; color: var(--t2); background: #fff; }
  .icon-btn:hover { background: var(--bg3); }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Form ──────────────────────────────────────────────── */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 12px; font-weight: 500; color: var(--t2); display: flex; justify-content: space-between; }
  .label .hint { color: var(--t4); font-weight: 400; }
  .input, .textarea, .select { width: 100%; border: 1px solid var(--line2); border-radius: 6px; padding: 7px 10px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,25,37,.08); }
  .textarea { resize: none; line-height: 1.5; }
  .input-group { display: flex; align-items: stretch; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .input-group:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,25,37,.08); }
  .input-group .prefix { padding: 0 2px 0 10px; display: flex; align-items: center; color: var(--t3); background: #fff; }
  .input-group input { border: 0; outline: none; flex: 1; padding: 7px 10px 7px 0; min-width: 0; }
  .input-group .suffix { display: flex; align-items: center; padding: 0 10px; font-size: 12px; }
  .toggle { width: 30px; height: 18px; border-radius: 9px; background: var(--bg4); position: relative; transition: background .2s; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
  .toggle.on { background: var(--ink); }
  .toggle.on::after { transform: translateX(12px); }
  .check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; flex: none; background: #fff; transition: background .15s, border-color .15s; }
  .check.on { background: var(--ink); border-color: var(--ink); }
  .check.on::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line2); font-size: 12px; background: #fff; transition: background .15s, border-color .15s; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip .x { font-size: 11px; color: var(--t3); }
  .chip.dashed { border-style: dashed; color: var(--t3); }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-gray { background: var(--bg3); color: var(--t2); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }

  /* ── Avatar ────────────────────────────────────────────── */
  .avatar { border-radius: 50%; background: #3F5A4A; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex: none; background-size: cover; background-position: center; overflow: hidden; }

  /* ── Slides (scale with container) ─────────────────────── */
  .slide { container-type: inline-size; aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: var(--sage); color: #111; font-family: Inter, sans-serif; width: 100%; }
  .slide * { line-height: 1.1; }
  .slide .big { position: absolute; left: 6cqw; top: 9cqw; font-size: 16cqw; font-weight: 400; letter-spacing: -0.05em; line-height: .86; }
  .slide .rule { position: absolute; left: 6cqw; right: 6cqw; bottom: 7cqw; border-top: .18cqw solid rgba(0,0,0,.6); }
  .slide .foot { position: absolute; left: 6cqw; bottom: 3.2cqw; display: flex; gap: 3cqw; font-size: 1.5cqw; }
  .slide .foot span::before { content: "●"; margin-right: .8cqw; font-size: 1cqw; vertical-align: middle; }
  .slide .kicker { position: absolute; left: 6cqw; top: 6cqw; font-size: 1.8cqw; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
  .slide .h { position: absolute; left: 6cqw; top: 10cqw; font-size: 6.5cqw; font-weight: 400; letter-spacing: -0.03em; }
  .slide.dark { background: var(--ink); color: #fff; }
  .slide.light { background: var(--sage-l); }
  .slide.white { background: #F7F7F2; }
  .slide .tiles { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqw; display: grid; grid-template-columns: repeat(3,1fr); gap: 2cqw; }
  .slide .tile { background: rgba(255,255,255,.6); border-radius: .8cqw; padding: 2.4cqw; }
  .slide .tile b { display: block; font-size: 5cqw; font-weight: 400; letter-spacing: -0.03em; }
  .slide .tile small { font-size: 1.5cqw; opacity: .7; }
  .slide .bars { position: absolute; right: 6cqw; bottom: 8cqw; display: flex; align-items: flex-end; gap: 1.2cqw; height: 22cqw; }
  .slide .bars i { width: 3.2cqw; background: var(--sage-d); border-radius: .4cqw .4cqw 0 0; }
  .slide .logo { position: absolute; right: 6cqw; top: 6cqw; width: 14cqw; height: 14cqw; border-radius: 1.4cqw; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 3.4cqw; font-weight: 700; letter-spacing: -.02em; }
  .slide .people { position: absolute; left: 6cqw; bottom: 9cqw; display: flex; gap: 5cqw; }
  .slide .person { display: flex; flex-direction: column; gap: 1.2cqw; font-size: 2cqw; }
  .slide .person i { width: 11cqw; height: 11cqw; border-radius: 50%; background: var(--sage-d); display: flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: 3.4cqw; }
  .slide .quote { position: absolute; left: 6cqw; right: 12cqw; top: 12cqw; font-size: 5.4cqw; letter-spacing: -0.02em; font-weight: 300; line-height: 1.12; }
  .slide .attr { position: absolute; left: 6cqw; bottom: 8cqw; font-size: 1.9cqw; opacity: .75; }
  .slide mark { background: transparent; color: inherit; }
  .slide mark.hl { outline: .35cqw solid #F59E0B; outline-offset: .5cqw; border-radius: .3cqw; background: rgba(245,158,11,.14); }
  .slide mark.masked { background: rgba(37,99,235,.14); outline: .3cqw dashed var(--blue); outline-offset: .5cqw; border-radius: .3cqw; }

  /* ── Editor (background) ───────────────────────────────── */
  #editor { position: fixed; inset: 0; background: var(--bg2); display: flex; flex-direction: column; }
  .ed-top { height: 48px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; gap: 10px; flex: none; }
  .ed-top .deck { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .ed-top .sp { flex: 1; }
  .ed-body { flex: 1; display: flex; min-height: 0; }
  .ed-rail { width: 184px; background: #fff; border-right: 1px solid var(--line); padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .ed-rail .th { display: flex; gap: 6px; align-items: flex-start; font-size: 11px; color: var(--t3); }
  .ed-rail .th .slide { border-radius: 3px; outline: 1px solid var(--line); }
  .ed-rail .th.on .slide { outline: 2px solid var(--ink); }
  .ed-canvas { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 60px 90px; position: relative; }
  .ed-canvas .slide { max-width: 860px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 2px; }
  .ed-tools { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: flex; gap: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .ed-tools .btn { height: 30px; }

  /* ── Modal ─────────────────────────────────────────────── */
  .overlay { position: fixed; inset: 0; background: rgba(10,15,20,.42); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px 64px; animation: fade .2s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .mwrap { position: relative; max-width: 100%; animation: pop .28s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  .x-out { position: absolute; top: -6px; right: -44px; width: 32px; height: 32px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.15); transition: transform .15s; }
  .x-out:hover { transform: scale(1.06); }
  .modal { background: #fff; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.22); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .m-head { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 500; flex: none; }
  .m-head .back { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .m-head .back:hover { background: var(--bg3); }
  .m-head .steps { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t3); font-weight: 400; }
  .m-head .dots { display: flex; gap: 4px; }
  .m-head .dots i { width: 16px; height: 3px; border-radius: 2px; background: var(--bg4); }
  .m-head .dots i.on { background: var(--ink); }
  .m-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex: none; }
  .m-foot .note { font-size: 12px; color: var(--t3); display: flex; align-items: center; gap: 6px; margin-right: auto; }

  /* Share modal */
  .share { display: flex; min-height: 440px; }
  .share-nav { width: 180px; border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; flex: none; }
  .share-nav button { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; color: var(--t2); text-align: left; }
  .share-nav button:hover { background: var(--bg3); }
  .share-nav button.on { background: var(--bg3); color: var(--t1); font-weight: 500; }
  .share-main { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
  .live-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
  .comm-card { border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 16px; display: grid; grid-template-columns: 1fr 1fr 88px; gap: 16px; align-items: center; position: relative; overflow: hidden; }
  .comm-card h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .reward-line b { display: block; color: var(--blue); font-size: 13px; font-weight: 600; }
  .reward-line small { color: var(--t3); font-size: 11px; }
  .coins { position: relative; width: 88px; height: 72px; }
  .coins i { position: absolute; width: 34px; height: 12px; border-radius: 50%; background: linear-gradient(180deg,#E8EDF4,#B9C3CF); box-shadow: inset 0 -2px 0 #9AA6B4; }
  .section-title { font-size: 12px; color: var(--t2); font-weight: 500; }
  .adv { border-top: 1px solid var(--line); padding-top: 12px; }

  /* Mask step */
  .mask { display: grid; grid-template-columns: 1fr 340px; min-height: 0; flex: 1; }
  .mask-left { padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg2); border-right: 1px solid var(--line); min-width: 0; }
  .mask-left .slide { border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .strip button { width: 92px; flex: none; border-radius: 3px; outline: 1px solid var(--line); position: relative; }
  .strip button.on { outline: 2px solid var(--ink); }
  .strip button .flag { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: #F59E0B; color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .strip button .flag.done { background: var(--blue); }
  .mask-right { display: flex; flex-direction: column; min-height: 0; }
  .scan-note { margin: 12px 14px 4px; padding: 10px 12px; border-radius: 8px; background: var(--amber-bg); color: #7A4A0B; font-size: 12px; line-height: 1.45; display: flex; gap: 8px; }
  .mask-list { overflow: auto; padding: 6px 6px 10px; }
  .mrow { display: flex; gap: 10px; padding: 10px 8px; border-radius: 8px; cursor: pointer; transition: background .15s; }
  .mrow:hover { background: var(--bg2); }
  .mrow.on { background: var(--bg3); }
  .mrow .t { font-weight: 500; font-size: 12.5px; }
  .mrow .t span { color: var(--t4); font-weight: 400; }
  .mrow .swap { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--t3); flex-wrap: wrap; }
  .mrow .swap s { color: var(--t4); }
  .mrow .swap .off { color: var(--t2); }
  .mrow .rep { border: 1px solid var(--line2); border-radius: 5px; padding: 3px 7px; font-size: 12px; width: 140px; background: #fff; outline: none; }
  .mrow .rep:focus { border-color: var(--ink); }
  .mrow.unchecked .rep { display: none; }

  /* Details step */
  .details { display: grid; grid-template-columns: 1fr 360px; flex: 1; min-height: 0; }
  .stack { background: var(--bg2); border-right: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 40px; }
  .stack-inner { position: relative; width: 100%; max-width: 440px; }
  .stack-inner .slide { border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .stack-inner .ghost { position: absolute; left: 0; right: 0; top: 0; }
  .stack-inner .g1 { transform: translateY(-14px) scale(.92); opacity: .55; }
  .stack-inner .g2 { transform: translateY(-7px) scale(.96); opacity: .8; }
  .stack-inner .front { position: relative; }
  .det-form { padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tags input { border: 1px dashed var(--line2); border-radius: 13px; height: 26px; padding: 0 10px; width: 100px; outline: none; font-size: 12px; }
  .as-row { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }
  .as-row .who { flex: 1; line-height: 1.35; }
  .as-row .who b { font-weight: 500; display: block; font-size: 12.5px; }
  .as-row .who span { color: var(--t3); }
  .seg { display: flex; border: 1px solid var(--line2); border-radius: 6px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; height: 26px; border-radius: 4px; font-size: 12px; color: var(--t2); }
  .seg button.on { background: var(--ink); color: #fff; }

  /* Profile setup */
  .psetup { display: grid; grid-template-columns: 1fr 340px; flex: 1; min-height: 0; }
  .ps-form { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .ps-intro h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .ps-intro p { margin: 0; color: var(--t3); line-height: 1.5; }
  .photo-row { display: flex; align-items: center; gap: 14px; }
  .photo-row .avatar { width: 56px; height: 56px; font-size: 20px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ps-prev { background: var(--bg2); border-left: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .ps-prev .cap { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
  .pcard { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .pcard .cover { height: 64px; background: linear-gradient(120deg, var(--sage-l), var(--sage)); }
  .pcard .body { padding: 0 14px 14px; }
  .pcard .avatar { width: 56px; height: 56px; font-size: 20px; margin-top: -28px; border: 3px solid #fff; }
  .pcard .nm { font-weight: 600; font-size: 14px; margin-top: 6px; }
  .pcard .hd { color: var(--t3); font-size: 12px; }
  .pcard .hl { font-size: 12px; margin-top: 6px; color: var(--t2); }
  .pcard .bio { font-size: 12px; margin-top: 8px; color: var(--t2); line-height: 1.5; min-height: 18px; }
  .pcard .tp { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
  .pcard .tp span { font-size: 10.5px; padding: 2px 7px; border-radius: 9px; background: var(--bg3); color: var(--t2); }
  .pcard .lk { display: flex; gap: 8px; margin-top: 10px; color: var(--t3); font-size: 14px; }
  .pcard .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .pcard .mini div { aspect-ratio: 16/9; border-radius: 4px; background: var(--bg3); border: 1px dashed var(--line2); }
  .handle-status { font-size: 11.5px; display: flex; align-items: center; gap: 4px; }
  .handle-status.ok { color: var(--green); }
  .handle-status.bad { color: var(--red); }
  .handle-status.wait { color: var(--t3); }

  /* Live step */
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 22px; }
  .live h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .live h2 i { color: var(--green); font-size: 20px; }
  .steps-r { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .steps-r div { display: flex; gap: 10px; }
  .steps-r .n { width: 18px; height: 18px; border-radius: 50%; background: var(--bg3); font-size: 10px; display: flex; align-items: center; justify-content: center; color: var(--t2); flex: none; margin-top: 1px; }
  .post { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .post-top { display: flex; gap: 10px; padding: 10px; align-items: center; border-bottom: 1px solid var(--line); }
  .post-top .slide { width: 72px; border-radius: 3px; flex: none; }
  .post-top b { font-weight: 500; font-size: 12.5px; display: block; }
  .post-top span { color: var(--t3); font-size: 11px; }
  .post textarea { border: 0; outline: none; padding: 12px; font-size: 12.5px; line-height: 1.55; resize: none; min-height: 150px; color: var(--t2); }
  .post-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--bg2); }

  /* ── Pages (community) ─────────────────────────────────── */
  #page { position: fixed; inset: 0; background: #fff; overflow: auto; display: none; }
  .c-nav { height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; }
  .brand .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .brand small { font-weight: 400; color: var(--t3); }
  .c-nav nav { display: flex; gap: 18px; color: var(--t2); }
  .c-nav nav a:hover, .c-nav nav a.on { color: var(--t1); }
  .c-nav .sp { flex: 1; }
  .search { display: flex; align-items: center; gap: 6px; height: 32px; width: 240px; padding: 0 10px; border-radius: 6px; background: var(--bg3); color: var(--t3); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .viewer-bar { background: var(--blue-bg); color: #1E40AF; font-size: 12px; padding: 8px 24px; display: flex; align-items: center; gap: 8px; justify-content: center; }

  .prof-cover { height: 150px; background: linear-gradient(120deg, var(--sage-l) 0%, var(--sage) 60%, #8FA27C 100%); position: relative; }
  .prof-head { display: flex; gap: 20px; align-items: flex-end; margin-top: -48px; position: relative; }
  .prof-head .avatar { width: 112px; height: 112px; font-size: 38px; border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .prof-head .who { flex: 1; padding-bottom: 6px; }
  .prof-head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .prof-head .hd { color: var(--t3); margin-top: 2px; }
  .prof-head .acts { display: flex; gap: 8px; padding-bottom: 8px; }
  .prof-meta { display: grid; grid-template-columns: 1fr 360px; gap: 40px; margin-top: 18px; }
  .prof-meta .bio { color: var(--t2); line-height: 1.6; font-size: 13.5px; max-width: 560px; }
  .prof-meta .hl { font-weight: 500; margin-bottom: 6px; }
  .prof-links { display: flex; gap: 14px; margin-top: 12px; color: var(--t2); flex-wrap: wrap; }
  .prof-links a { display: inline-flex; align-items: center; gap: 5px; }
  .prof-links a:hover { color: var(--t1); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stats div { padding: 12px 14px; border-right: 1px solid var(--line); }
  .stats div:last-child { border-right: 0; }
  .stats b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .stats span { font-size: 11.5px; color: var(--t3); }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 28px; }
  .tabs button { height: 40px; color: var(--t3); font-weight: 500; position: relative; display: flex; align-items: center; gap: 6px; }
  .tabs button.on { color: var(--t1); }
  .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
  .tabs .cnt { font-size: 11px; background: var(--bg3); color: var(--t2); padding: 1px 6px; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 22px 0 60px; }
  .tcard { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .tcard .th { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); position: relative; transition: box-shadow .2s, transform .2s var(--ease); }
  .tcard:hover .th { box-shadow: 0 8px 24px rgba(0,0,0,.08); transform: translateY(-2px); }
  .tcard .th .badge { position: absolute; top: 8px; left: 8px; z-index: 2; }
  .tcard .meta { display: flex; justify-content: space-between; align-items: flex-start; }
  .tcard .meta b { font-weight: 500; }
  .tcard .meta small { display: block; color: var(--t3); font-size: 12px; margin-top: 2px; }
  .tcard.add .th { aspect-ratio: 16/9; border: 1.5px dashed var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--t3); background: var(--bg2); }

  /* Rewards */
  .rw { padding: 22px 0 60px; display: flex; flex-direction: column; gap: 20px; }
  .rw-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .rw-card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .rw-card .k { color: var(--t3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .rw-card .v { font-size: 26px; font-weight: 600; letter-spacing: -.03em; margin-top: 8px; }
  .rw-card .s { color: var(--t3); font-size: 12px; margin-top: 4px; }
  .how { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; background: var(--bg2); border-radius: 10px; padding: 18px; }
  .how div { display: flex; gap: 10px; }
  .how .n { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex: none; }
  .how b { font-weight: 500; display: block; margin-bottom: 2px; }
  .how span { color: var(--t3); font-size: 12px; line-height: 1.45; }
  table.act { width: 100%; border-collapse: collapse; }
  table.act th { text-align: left; font-weight: 500; color: var(--t3); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.act td { padding: 12px 10px; border-bottom: 1px solid var(--line3); }
  .empty { border: 1px dashed var(--line2); border-radius: 10px; padding: 32px; text-align: center; color: var(--t3); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .empty i { font-size: 26px; color: var(--t4); }

  /* Template page */
  .tp-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 36px; padding: 24px 0 60px; }
  .crumbs { color: var(--t3); font-size: 12px; display: flex; gap: 6px; align-items: center; padding-top: 20px; }
  .crumbs a:hover { color: var(--t1); }
  .viewer .slide { border-radius: 8px; border: 1px solid var(--line); }
  .viewer .vstrip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 12px; }
  .viewer .vstrip button { border-radius: 3px; outline: 1px solid var(--line); overflow: hidden; }
  .viewer .vstrip button.on { outline: 2px solid var(--ink); }
  .viewer .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .tp-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 80px; align-self: start; }
  .tp-side h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .creator { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .creator .avatar { width: 36px; height: 36px; font-size: 13px; }
  .creator .w { flex: 1; line-height: 1.35; }
  .creator .w b { font-weight: 500; display: block; }
  .creator .w span { font-size: 12px; color: var(--t3); }
  .tp-side .desc { color: var(--t2); line-height: 1.6; }
  .tp-side .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--t2); }
  .tp-side .facts div { display: flex; align-items: center; gap: 6px; }
  .gift { display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: var(--blue-bg); color: #1E3A8A; font-size: 12.5px; line-height: 1.45; }
  .gift i { font-size: 18px; color: var(--blue); }

  /* Signup modal */
  .su { padding: 26px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
  .su h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
  .su p { margin: 0; color: var(--t3); line-height: 1.5; }
  .su .g { width: 100%; height: 40px; border: 1px solid var(--line2); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
  .su .g:hover { background: var(--bg2); }
  .su .or { display: flex; align-items: center; gap: 10px; color: var(--t4); font-size: 11px; width: 100%; }
  .su .or::before, .su .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ── Toast ─────────────────────────────────────────────── */
  #toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: tin .3s var(--ease); pointer-events: auto; }
  .toast i { font-size: 15px; }
  .toast .g { color: #4ADE80; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

  /* ── Flow bar (proto navigation) ───────────────────────── */
  #flow { position: fixed; left: 12px; bottom: 12px; z-index: 90; background: rgba(23,23,23,.92); color: #fff; border-radius: 10px; padding: 6px; display: flex; align-items: center; gap: 2px; font-size: 11.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); backdrop-filter: blur(8px); max-width: calc(100vw - 100px); overflow-x: auto; }
  #flow button { height: 26px; padding: 0 8px; border-radius: 6px; color: rgba(255,255,255,.7); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  #flow button:hover { background: rgba(255,255,255,.1); color: #fff; }
  #flow button.on { background: #fff; color: var(--t1); }
  #flow .n { opacity: .55; font-variant-numeric: tabular-nums; }
  #flow .sep { width: 1px; height: 16px; background: rgba(255,255,255,.18); margin: 0 4px; flex: none; }
  #flow.min > :not(.tog) { display: none; }
</style>
</head>
<body>

<div id="editor"></div>
<div id="page"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="flow"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const DEFAULT_STATE = () => ({
  profile: null,               // set after profile setup
  draft: {                     // profile form draft
    name: 'Joe Thomas', handle: 'joe-t', headline: 'Ops lead at a logistics startup',
    bio: 'I build the decks my team runs on every month. Clean structure, no fluff.',
    linkedin: 'linkedin.com/in/joethomas', x: '', website: '',
    topics: ['Business', 'Reports'], photo: null,
  },
  mask: {
    client:  { on: true,  rep: 'Client Name' },
    logo:    { on: true,  rep: 'Logo' },
    revenue: { on: true,  rep: '$0.0M ARR' },
    team:    { on: false, rep: 'Team Member' },
    quote:   { on: true,  rep: 'Job title, company' },
  },
  tpl: {
    title: 'KPI Report',
    desc: 'A KPI report deck template gives recurring performance reviews a fixed structure, so each cycle\'s numbers land in the same place and can be compared at a glance. It separates the metrics that matter from the noise, forcing whoever builds it to lead with results rather than activity.\n\nAnd it saves the team from rebuilding slides every month, turning reporting into a fill-in exercise instead of a design project.',
    tags: ['KPI', 'Monthly Report'],
    category: 'Reports',
    access: 'free',
  },
  published: false,
  uses: 0,
  events: [],                  // reward activity
  visitorView: false,
  profileTab: 'templates',
  maskSel: 'client',
  tplSlide: 0,
});
let S = DEFAULT_STATE();
try { const saved = sessionStorage.getItem('ct-state'); if (saved) S = Object.assign(DEFAULT_STATE(), JSON.parse(saved)); } catch (e) {}
function save() { try { sessionStorage.setItem('ct-state', JSON.stringify(S)); } catch (e) {} }

const ORIG = {
  client: 'Northwind Logistics',
  logo: 'NW',
  revenue: '$1.48M ARR',
  team: 'Priya Raman, Tom Beck',
  quote: 'Dana Ortiz, Head of Ops, Northwind',
};
const MASK_META = [
  { key: 'client',  label: 'Client name',       slide: 8,  origText: 'Northwind Logistics' },
  { key: 'logo',    label: 'Client logo',       slide: 8,  origText: 'Northwind logo' },
  { key: 'revenue', label: 'Revenue',           slide: 9,  origText: '$1.48M ARR' },
  { key: 'team',    label: 'Team names',        slide: 10, origText: 'Priya Raman, Tom Beck' },
  { key: 'quote',   label: 'Quote attribution', slide: 11, origText: 'Dana Ortiz, Head of Ops, Northwind' },
];
const SLIDE_NOS = [1, 3, 5, 8, 9, 10, 11, 12];

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => (n || '?').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const P = () => S.profile || S.draft;

function avatar(size, p = P()) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;` + (p.photo ? `background-image:url(${p.photo});` : '');
  return `<span class="avatar" style="${st}">${p.photo ? '' : esc(initials(p.name))}</span>`;
}
function toast(msg, icon = 'ph-fill ph-check-circle g') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="${icon}"></i><span>${msg}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

/* values used by slides. mode: 'orig' | 'masked' | 'review' (review = show masked with outline + highlight pending) */
function vals(mode) {
  const out = {};
  for (const m of MASK_META) {
    const st = S.mask[m.key];
    const useRep = mode !== 'orig' && st.on;
    const text = useRep ? (st.rep || ' ') : ORIG[m.key];
    let cls = '';
    if (mode === 'review') cls = st.on ? 'masked' : 'hl';
    out[m.key] = cls ? `<mark class="${cls}">${esc(text)}</mark>` : esc(text);
  }
  return out;
}

function slideHTML(no, mode = 'orig') {
  const v = vals(mode);
  switch (no) {
    case 1: return `<div class="slide"><div class="big">KPI<br>REPORT</div><div class="rule"></div><div class="foot"><span>${v.client}</span><span>June 2026</span></div></div>`;
    case 3: return `<div class="slide dark"><div class="kicker">02 · Marketing</div><div class="h" style="top:28cqw;font-size:9cqw">Pipeline<br>& reach</div></div>`;
    case 5: return `<div class="slide light"><div class="kicker">03 · Summary</div><div class="h">Q2 at a glance</div><div class="tiles"><div class="tile"><b>94%</b><small>On-time delivery</small></div><div class="tile"><b>+18%</b><small>New accounts</small></div><div class="tile"><b>3.2d</b><small>Avg. cycle time</small></div></div></div>`;
    case 8: return `<div class="slide"><div class="kicker">Prepared for</div><div class="h" style="top:12cqw;font-size:7cqw;max-width:60cqw">${v.client}</div><div class="logo">${v.logo}</div><div class="rule"></div><div class="foot"><span>Monthly business review</span><span>Confidential</span></div></div>`;
    case 9: return `<div class="slide white"><div class="kicker">Revenue</div><div class="h" style="top:14cqw;font-size:10cqw">${v.revenue}</div><div class="attr" style="bottom:8cqw">Up 12% on last quarter</div><div class="bars"><i style="height:40%"></i><i style="height:52%"></i><i style="height:48%"></i><i style="height:66%"></i><i style="height:74%"></i><i style="height:100%"></i></div></div>`;
    case 10: {
      const names = (S.mask.team.on ? [S.mask.team.rep, S.mask.team.rep] : ORIG.team.split(', '));
      const wrap = t => mode === 'review' ? `<mark class="${S.mask.team.on ? 'masked' : 'hl'}">${esc(t)}</mark>` : esc(t);
      const ini = t => S.mask.team.on && mode !== 'orig' ? '?' : initials(t);
      const realNames = mode === 'orig' ? ORIG.team.split(', ') : names;
      return `<div class="slide light"><div class="kicker">The team</div><div class="h">Who ran the quarter</div><div class="people">${realNames.map(n => `<div class="person"><i>${ini(n)}</i>${wrap(n)}</div>`).join('')}</div></div>`;
    }
    case 11: return `<div class="slide dark"><div class="quote">“Fastest close we’ve had in three years. The monthly view made it obvious where to push.”</div><div class="attr">${v.quote}</div></div>`;
    case 12: return `<div class="slide"><div class="big" style="font-size:12cqw;top:14cqw">Thank<br>you</div><div class="rule"></div><div class="foot"><span>Questions</span><span>Next review: July</span></div></div>`;
  }
  return '';
}

/* ═══════════════════════════════════════════════════════════
   EDITOR (background)
   ═══════════════════════════════════════════════════════════ */
function renderEditor() {
  $('#editor').innerHTML = `
    <div class="ed-top">
      <button class="icon-btn" style="border:0"><i class="ph ph-house"></i></button>
      <div class="deck">Monthly Business Review <i class="ph ph-caret-down" style="color:var(--t3);font-size:11px"></i></div>
      <span style="color:var(--t4);font-size:12px">Saved</span>
      <div class="sp"></div>
      ${avatar(26)}
      <button class="btn btn-ghost" data-go="share"><i class="ph ph-share-network"></i>Share</button>
      <button class="btn btn-ghost"><i class="ph ph-play"></i>Present</button>
      <button class="btn btn-primary"><i class="ph ph-export"></i>Export as PPT</button>
    </div>
    <div class="ed-body">
      <div class="ed-rail">
        <button class="btn btn-outline btn-sm" style="width:100%"><i class="ph ph-plus"></i>New slide</button>
        ${SLIDE_NOS.map((n, i) => `<div class="th ${i === 0 ? 'on' : ''}"><span style="width:14px">${n}</span>${slideHTML(n)}</div>`).join('')}
      </div>
      <div class="ed-canvas">
        ${slideHTML(1)}
        <div class="ed-tools">
          <button class="btn btn-ghost"><i class="ph ph-plus-square"></i>Insert</button>
          <button class="btn btn-ghost"><i class="ph ph-palette"></i>Theme</button>
          <button class="btn btn-ghost"><i class="ph ph-sparkle"></i>Edit with AI</button>
        </div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════
   MODAL SHELL
   ═══════════════════════════════════════════════════════════ */
function openModal(width, inner, { onClose = () => go('editor'), height } = {}) {
  $('#modal-root').innerHTML = `
    <div class="overlay">
      <div class="mwrap" style="width:${width}px">
        <button class="x-out" aria-label="Close"><i class="ph ph-x"></i></button>
        <div class="modal" ${height ? `style="height:${height}px"` : ''}>${inner}</div>
      </div>
    </div>`;
  $('.x-out').onclick = onClose;
  $('.overlay').addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) onClose(); });
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function stepHead(title, backTo) {
  // Steps: Profile (only if first time) → Mask → Details
  const first = S._firstTime;
  const list = first ? ['profile-setup', 'mask', 'details'] : ['mask', 'details'];
  const idx = list.indexOf(ROUTE);
  return `<div class="m-head">
    ${backTo ? `<button class="back" data-go="${backTo}" aria-label="Back"><i class="ph ph-arrow-left"></i></button>` : ''}
    <span>${title}</span>
    ${idx >= 0 ? `<div class="steps">Step ${idx + 1} of ${list.length}<div class="dots">${list.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div></div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   1 · SHARE MODAL
   ═══════════════════════════════════════════════════════════ */
function renderShare() {
  const pub = S.published;
  const commCard = pub ? `
    <div class="comm-card" style="grid-template-columns:auto 1fr auto;background:#fff">
      ${slideHTML(1, 'masked').replace('class="slide"', 'class="slide" style="width:96px;border-radius:3px"')}
      <div>
        <div style="font-weight:600;display:flex;align-items:center;gap:6px">“${esc(S.tpl.title)}” is on Community <span class="badge badge-green"><i class="ph-fill ph-circle" style="font-size:6px"></i>Live</span></div>
        <div style="color:var(--t3);font-size:12px;margin-top:4px">${S.uses} uses · ${S.events.filter(e => e.type === 'signup').length} sign ups · ${creditsEarned()} credits earned</div>
      </div>
      <button class="btn btn-outline btn-sm" data-go="profile">View</button>
    </div>` : `
    <div class="comm-card">
      <div>
        <h4>Publish to Community.<br>Earn rewards.</h4>
        <button class="btn btn-sm" style="background:var(--blue);color:#fff" id="publish-now">Publish now</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="reward-line"><b>200 credits</b><small>for every new sign up</small></div>
        <div class="reward-line"><b>10% cash</b><small>from every new subscription</small></div>
      </div>
      <div class="coins">

const TOPICS = ['Business', 'Reports', 'Marketing', 'Finance', 'Sales', 'Startups', 'Education', 'Design', 'Product'];
let handleTimer = null, handleOK = true;

function renderProfileSetup(editMode = false) {
  const d = editMode ? { ...S.profile } : S.draft;
  S._edit = editMode ? d : null;
  const back = editMode ? null : 'share';
  const closeEdit = () => { if (ROUTE === 'profile' || ROUTE === 'template') { closeModal(); renderPage(); } else go(ROUTE); };
  openModal(900, `
    ${editMode ? `<div class="m-head">Edit community profile</div>` : stepHead('Create your community profile', back)}
    <div class="psetup">
      <div class="ps-form">
        ${editMode ? '' : `<div class="ps-intro"><h3>First, a home for your templates</h3><p>Everything you publish lives on your profile. People who like one template can find the rest, and every sign up from your page earns you rewards.</p></div>`}
        <div class="photo-row">

          </div>
        </div>

    $('#pcard').innerHTML = `

        <div class="bio">${esc(d.bio)}</div>
        ${d.topics.length ? `<div class="tp">${d.topics.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
        <div class="lk">${d.linkedin ? '<i class="ph-fill ph-linkedin-logo"></i>' : ''}${d.x ? '<i class="ph ph-x-logo"></i>' : ''}${d.website ? '<i class="ph ph-globe-simple"></i>' : ''}</div>
        <div class="mini"><div></div><div></div></div>
        <div style="font-size:11px;color:var(--t4);margin-top:6px">Your templates show here</div>
      </div>`;
    $('#ps-av').innerHTML = avatar(56, d);
    $('#ps-photo-rm').style.display = d.photo ? '' : 'none';
    const okName = d.name.trim().length > 1;
    $('#ps-save').disabled = !(okName && (editMode || handleOK));
  };
  upd();

  const bind = (id, key, after) => { $(id).addEventListener('input', e => { d[key] = e.target.value; after && after(); upd(); save(); }); };
  bind('#f-name', 'name');
  bind('#f-headline', 'headline');
  bind('#f-bio', 'bio', () => $('#bio-count').textContent = `${d.bio.length}/160`);

    }, 600);
  };
}

/* ═══════════════════════════════════════════════════════════
   3 · MASK SENSITIVE DATA
   ═══════════════════════════════════════════════════════════ */
function renderMask() {
  openModal(1040, `
    ${stepHead('Before publishing, mask sensitive data', S._firstTime ? 'profile-setup' : 'share')}
    <div class="mask">
      <div class="mask-left">
        <div id="mask-main"></div>
        <div class="strip" id="mask-strip"></div>
        <div style="font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:12px">
          <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;outline:1.5px solid #F59E0B;background:rgba(245,158,11,.14)"></span>Still visible</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;outline:1.5px dashed var(--blue);background:rgba(37,99,235,.14)"></span>Masked in template</span>
        </div>
      </div>
      <div class="mask-right">
        <div class="scan-note"><i class="ph-fill ph-shield-warning" style="font-size:16px;color:var(--amber)"></i><span>We scanned 12 slides and found <b>5 things</b> that look private. Checked items get replaced in the public template. Your original deck is not changed.</span></div>
        <div class="mask-list" id="mask-list"></div>
      </div>
    </div>
    <div class="m-foot">
      <span class="note" id="mask-count"></span>
      <button class="btn btn-ghost" id="mask-skip">Skip</button>
      <button class="btn btn-primary" data-go="details">Continue</button>
    </div>`, { height: 600 });

  const drawList = () => {
    $('#mask-list').innerHTML = MASK_META.map(m => {
      const st = S.mask[m.key];
      return `<div class="mrow ${S.maskSel === m.key ? 'on' : ''} ${st.on ? '' : 'unchecked'}" data-k="${m.key}">
        <span class="check ${st.on ? 'on' : ''}" data-chk="${m.key}" style="margin-top:1px"></span>
        <div style="flex:1;min-width:0">
          <div class="t">${m.label} <span>· Slide ${m.slide}</span></div>
          <div class="swap">
            ${st.on ? `<s>${esc(m.origText)}</s><i class="ph ph-arrow-right" style="font-size:11px"></i><input class="rep" data-rep="${m.key}" value="${esc(st.rep)}">` : `<span class="off">${esc(m.origText)}</span><span class="badge badge-amber" style="height:18px">Stays visible</span>`}
          </div>
        </div>
      </div>`;
    }).join('');
    const n = MASK_META.filter(m => S.mask[m.key].on).length;
    $('#mask-count').innerHTML = `<i class="ph ph-shield-check"></i>${n} of ${MASK_META.length} items masked`;
    $$('#mask-list .mrow').forEach(r => r.onclick = e => {
      if (e.target.matches('input')) return;
      const k = r.dataset.k;
      if (e.target.closest('[data-chk]')) { S.mask[k].on = !S.mask[k].on; }
      S.maskSel = k; save(); drawList(); drawPreview();
    });
    $$('#mask-list .rep').forEach(inp => {
      const select = () => { if (S.maskSel !== inp.dataset.rep) { S.maskSel = inp.dataset.rep; $$('#mask-list .mrow').forEach(r => r.classList.toggle('on', r.dataset.k === S.maskSel)); } };
      inp.addEventListener('input', e => { S.mask[inp.dataset.rep].rep = e.target.value; select(); save(); drawPreview(); });
      inp.addEventListener('focus', () => { select(); drawPreview(); });
    });
  };
  const drawPreview = () => {
    const cur = MASK_META.find(m => m.key === S.maskSel) || MASK_META[0];
    $('#mask-main').innerHTML = slideHTML(cur.slide, 'review');
    $('#mask-strip').innerHTML = SLIDE_NOS.map(n => {
      const items = MASK_META.filter(m => m.slide === n || (m.key === 'client' && n === 1));
      const pending = items.some(m => !S.mask[m.key].on);
      const flag = items.length ? `<span class="flag ${pending ? '' : 'done'}"><i class="ph-bold ${pending ? 'ph-exclamation-mark' : 'ph-check'}"></i></span>` : '';
      return `<button class="${n === cur.slide ? 'on' : ''}" data-slide="${n}">${flag}${slideHTML(n, 'masked')}</button>`;
    }).join('');
    $$('#mask-strip button').forEach(b => b.onclick = () => {
      const n = +b.dataset.slide;
      const hit = MASK_META.find(m => m.slide === n);
      if (hit) { S.maskSel = hit.key; save(); drawList(); drawPreview(); }
      else $('#mask-main').innerHTML = slideHTML(n, 'review'), $$('#mask-strip button').forEach(x => x.classList.toggle('on', x === b));
    });
  };
  drawList(); drawPreview();
  $('#mask-skip').onclick = () => {
    const pending = MASK_META.filter(m => S.mask[m.key].on).length;
    if (pending) { MASK_META.forEach(m => S.mask[m.key].on = false); save(); toast('Publishing without masking. Everything stays as is.', 'ph ph-warning'); }
    go('details');
  };
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
const ROUTES = [
  ['editor', 'Editor'],
  ['share', 'Share'],
  ['profile-setup', 'Create profile'],
  ['mask', 'Mask data'],
  ['details', 'Details'],
  ['live', 'Live + share'],
  ['profile', 'Profile'],
  ['template', 'Template (visitor)'],
  ['rewards', 'Rewards'],
];
let ROUTE = 'editor';

function ensurePrereqs(r) {
  // deep links: fill in what earlier steps would have produced
  const idx = ROUTES.findIndex(x => x[0] === r);
  if (idx >= 3 && !S.profile) { S.profile = JSON.parse(JSON.stringify(S.draft)); S._firstTime = true; }
  if (idx >= 6 && !S.published) { S.published = true; S.publishedAt = Date.now(); }
  if (r === 'profile-setup') S._firstTime = true;
}

function go(r, push = true) {
  ensurePrereqs(r);
  if (r === 'rewards') { S.profileTab = 'rewards'; S.visitorView = false; r = 'profile'; }
  ROUTE = r;
  save();
  const pageMode = r === 'profile' || r === 'template';
  $('#page').style.display = pageMode ? 'block' : 'none';
  $('#editor').style.display = pageMode ? 'none' : 'flex';
  closeModal();
  renderEditor();
  if (r === 'share') renderShare();
  if (r === 'profile-setup') renderProfileSetup(false);
  if (r === 'mask') renderMask();
  if (r === 'details') renderDetails();
  if (r === 'live') renderLive();
  if (r === 'profile') { renderProfile(); $('#page').scrollTop = 0; }
  if (r === 'template') { renderTemplate(); $('#page').scrollTop = 0; }
  if (push) {
    const u = new URL(location.href);
    const shown = r === 'profile' && S.profileTab === 'rewards' ? 'rewards' : r;
    u.searchParams.set('s', shown);
    u.searchParams.delete('reset');
    history.replaceState(null, '', u);
  }
  renderFlow();
}
function renderPage() { if (ROUTE === 'profile') renderProfile(); if (ROUTE === 'template') renderTemplate(); }

function renderFlow() {
  const cur = ROUTE === 'profile' && S.profileTab === 'rewards' && !S.visitorView ? 'rewards' : ROUTE;
  const min = $('#flow').classList.contains('min');
  $('#flow').innerHTML = `
    <button class="tog" title="Toggle flow bar" id="flow-tog"><i class="ph ${min ? 'ph-list' : 'ph-caret-left'}"></i>${min ? 'Flow' : ''}</button>
    <span class="sep"></span>
    ${ROUTES.map(([k, l], i) => `<button class="${k === cur ? 'on' : ''}" data-flow="${k}"><span class="n">${i + 1}</span>${l}</button>`).join('')}
    <span class="sep"></span>
    <button id="flow-reset" title="Start over as a new user"><i class="ph ph-arrow-counter-clockwise"></i>Reset</button>`;
  $$('[data-flow]').forEach(b => b.onclick = () => {
    const k = b.dataset.flow;
    if (k === 'profile') { S.profileTab = 'templates'; S.visitorView = false; }
    go(k);
  });
  $('#flow-tog').onclick = () => { $('#flow').classList.toggle('min'); renderFlow(); };
  $('#flow-reset').onclick = () => { S = DEFAULT_STATE(); save(); go('editor'); toast('Reset. You are a first time publisher again.', 'ph ph-arrow-counter-clockwise'); };
}

// Global data-go delegation
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go]');
  if (!el) return;
  e.preventDefault();
  const r = el.dataset.go;
  if (r === 'profile') { S.profileTab = 'templates'; S.visitorView = false; }
  if (r === 'share' && ROUTE === 'profile') { /* from "publish another deck" */ }
  go(r);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) $('.x-out')?.click();
});

// Boot
(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.has('reset')) { S = DEFAULT_STATE(); save(); }
  const s = q.get('s');
  go(ROUTES.some(r => r[0] === s) ? s : 'editor');
})();
</script>
