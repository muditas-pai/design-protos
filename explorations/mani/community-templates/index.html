  /* Template (visitor) */

  /* Login (invite) */
  .login { position: fixed; inset: 0; display: grid; grid-template-columns: 45fr 55fr; background: #fff; }

  .auth { display: flex; flex-direction: column; gap: 12px; }
  .auth button { height: 44px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 1px 2px var(--line3); position: relative; display: flex; align-items: center; justify-content: center; font-weight: 500; transition: background .15s; }

  .login .r .band .lg { display: flex; align-items: center; gap: 44px; }

  /* Onboarding */
  .onb { position: fixed; inset: 0; background: #F6F6F6; }
  .onb .back-c { position: absolute; top: 16px; left: 80px; width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: var(--e1); display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 3; }

  .role .grid button { height: 40px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 1px var(--line2); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 15px; transition: box-shadow .15s, background .15s; }

  .ctx { position: fixed; inset: 0; display: grid; grid-template-columns: 752fr 528fr; }
  .ctx .l { background: #F6F6F6; padding: 108px 56px 40px 80px; display: flex; flex-direction: column; min-height: 0; }

  .sample { font-size: 13px; color: var(--t3); margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .gen { margin-top: 10px; }

  .gen .spin2 { width: 16px; height: 16px; border-radius: 50%; border: 2px dotted var(--brand); animation: spin 1.2s linear infinite; }
  .gen ol { list-style: none; margin: 16px 0 0; padding: 0 0 0 8px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .gen ol::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 1px; background: var(--line2); }
  .gen li { display: flex; align-items: center; gap: 18px; font-size: 15px; color: var(--t2); opacity: 0; transform: translateY(4px); transition: opacity .35s, transform .35s var(--ease); }

  .gen li.cur { color: var(--t4); }

  /* Present */
  .present { position: fixed; inset: 0; background: #0B0F14; display: flex; flex-direction: column; }

  /* Credits popup */

  /* Rewards dashboard */
  .dash { position: fixed; inset: 0; display: flex; background: #fff; }

  .side nav a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 6px; color: var(--t2); }
  .side nav a:hover { background: var(--bg3); }

  .side nav a i { font-size: 18px; }

  .dmain { flex: 1; overflow: auto; position: relative; }
  .dtop { position: sticky; top: 0; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 10px 16px; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); z-index: 4; }
  .trial { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px; border-radius: 4px; box-shadow: var(--e1); }
  .trial .btn { height: 28px; }
  .dtop > i { font-size: 20px; color: var(--t2); }
  .rwrap { max-width: 720px; margin: 0 auto; padding: 8px 20px 80px; }
  .rwrap h2 { margin: 12px 0 24px; font-size: 20px; font-weight: 500; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .kpi { border-radius: 4px; box-shadow: var(--e1); padding: 16px 16px 18px; }
  .kpi b { font-size: 24px; font-weight: 400; display: block; letter-spacing: -.01em; }
  .kpi small { display: block; color: var(--t2); font-size: 12px; }
  .refer { display: grid; grid-template-columns: 1fr 1fr; margin-top: 24px; border-radius: 4px; box-shadow: var(--e1); overflow: hidden; }
  .refer .a { padding: 24px 22px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }

  .refer .b { display: flex; flex-direction: column; }

  .refer .gets div { display: flex; gap: 14px; color: var(--t2); }
  .refer .gets div b { color: var(--t1); font-weight: 400; display: block; }
  .refer .gets i { font-size: 16px; color: var(--t1); margin-top: 2px; }
  .refer .art { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; overflow: hidden; }
  .refer .art img { width: 100%; max-width: 340px; }
  .brk { border-radius: 4px; box-shadow: var(--e1); overflow: hidden; }

  .state-tog { display: flex; gap: 4px; padding: 3px; border-radius: 6px; background: var(--bg3); font-size: 12px; }

  /* Dashboard home + community page */
  .dhome { max-width: 900px; margin: 0 auto; padding: 8px 24px 80px; }

  .recent { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cm-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; margin-top: 24px; }
  .cm-hero h2 { margin: 12px 0 20px; font-size: 28px; font-weight: 500; line-height: 1.25; letter-spacing: -.01em; }

// upd(): caller redraws its preview and save button. Guarded so late timers never touch a closed form.
function bindProfileFields(d, editMode, upd) {
  const bind = (id, key, after) => $(id).addEventListener('input', e => { d[key] = e.target.value; after && after(); upd(); save(); });
  bind('#f-name', 'name');
  bind('#f-headline', 'headline');
  bind('#f-bio', 'bio', () => $('#bio-count').textContent = `${d.bio.length}/160`);
  bind('#f-linkedin', 'linkedin'); bind('#f-x', 'x'); bind('#f-website', 'website');
  if (!editMode) $('#f-handle').addEventListener('input', e => {
    const clean = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    e.target.value = clean; d.handle = clean;
    const st = $('#h-status');
    clearTimeout(handleTimer);
    handleOK = false;
    if (clean.length < 3) { st.className = 'handle-status bad'; st.innerHTML = '<i class="ph-bold ph-x"></i>At least 3 characters'; upd(); return; }
    st.className = 'handle-status wait'; st.innerHTML = 'Checking…';
    upd();
    handleTimer = setTimeout(() => {
      if (!$('#h-status')) return;
      const taken = TAKEN.includes(clean);
      handleOK = !taken;
      st.className = 'handle-status ' + (taken ? 'bad' : 'ok');
      st.innerHTML = taken ? `<i class="ph-bold ph-x"></i>Taken. Try ${clean}-${Math.floor(Math.random() * 90 + 10)}` : '<i class="ph-bold ph-check"></i>Available';
      upd();
    }, 450);
  });
  $$('#f-topics .chip').forEach(c => c.onclick = () => {
    const t = c.dataset.topic;
    if (d.topics.includes(t)) d.topics = d.topics.filter(x => x !== t);
    else if (d.topics.length < 3) d.topics.push(t);
    else { toast('Pick up to 3 topics', 'ph ph-info'); return; }
    $$('#f-topics .chip').forEach(x => x.classList.toggle('on', d.topics.includes(x.dataset.topic)));
    upd(); save();
  });
  $$('#f-covers [data-cover]').forEach(b => b.onclick = () => {
    d.cover = b.dataset.cover;
    $$('#f-covers [data-cover]').forEach(x => x.classList.toggle('on', x === b));
    upd(); save();
  });
  $('#ps-photo').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); const k = 240; c.width = c.height = k;
        const m = Math.min(im.width, im.height);
        c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, k, k);
        if (!$('#ps-av')) return;
        d.photo = c.toDataURL('image/jpeg', 0.85); upd(); save();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  $('#ps-photo-rm').onclick = () => { d.photo = null; upd(); save(); };
}
function refreshPhotoRow(d) {
  $('#ps-av').innerHTML = avatar(56, d);
  $('#ps-photo-rm').style.display = d.photo ? '' : 'none';

function startDraft(editMode) {
  // Always work on a copy, so Cancel or closing throws edits away. Saves write it back.
  const d = JSON.parse(JSON.stringify(editMode ? S.profile : (S.profile || S.draft)));

  return d;
}

function renderMask() {
  openModal(`
    ${stepHead('Before publishing, mask sensitive data', S._firstTime ? 'profile-setup' : 'share')}
    <div class="card" style="width:1112px">
      <div class="mask">
        <div class="mask-left">
          <div id="mask-main"></div>
          <div class="strip" id="mask-strip"></div>
        </div>
        <div class="mask-list" id="mask-list"></div>
      </div>
      <div class="f-foot">
        <span class="note" id="mask-count"></span>
        <button class="btn btn-outline btn-lg" id="mask-skip">Skip</button>
        <button class="btn btn-primary btn-lg" id="mask-continue">Continue</button>
      </div>
    </div>`, { height: 600 });

  let viewSlide = (MASK_META.find(m => m.key === S.maskSel) || MASK_META[0]).slide;
  const drawList = () => {
    $('#mask-list').innerHTML = MASK_META.map(m => {
      const st = S.mask[m.key];
      return `<div class="mrow ${S.maskSel === m.key ? 'on' : ''}" data-k="${m.key}">
        <span class="check ${st.on ? 'on' : ''}" data-chk="${m.key}"></span>
        <div style="flex:1;min-width:0">
          <div class="t">${m.label} <span>• Slide ${m.slide + 1}</span></div>
          <div class="swap">${st.on
            ? `<s>${esc(m.orig)}</s><i class="ph ph-arrow-right"></i><input class="rep" data-rep="${m.key}" value="${esc(st.rep)}">`
            : `<span>${esc(m.orig)}</span>`}</div>
        </div>
      </div>`;
    }).join('');
    const n = MASK_META.filter(m => S.mask[m.key].on).length;
    $('#mask-count').innerHTML = `<i class="ph ph-shield-check"></i>${n} of ${MASK_META.length} items masked. Your original deck does not change.`;
    $$('#mask-list .mrow').forEach(r => r.onclick = e => {
      if (e.target.matches('input')) return;
      const k = r.dataset.k;
      if (e.target.closest('[data-chk]')) S.mask[k].on = !S.mask[k].on;
      S.maskSel = k; viewSlide = MASK_META.find(m => m.key === k).slide; save(); drawList(); drawPreview();
    });
    $$('#mask-list .rep').forEach(inp => {
      const select = () => { if (S.maskSel !== inp.dataset.rep) { S.maskSel = inp.dataset.rep; viewSlide = MASK_META.find(m => m.key === S.maskSel).slide; $$('#mask-list .mrow').forEach(r => r.classList.toggle('on', r.dataset.k === S.maskSel)); drawPreview(); } };
      inp.addEventListener('input', e => { S.mask[inp.dataset.rep].rep = e.target.value; select(); save(); });
      inp.addEventListener('focus', select);
    });
  };
  const drawPreview = () => {
    $('#mask-main').innerHTML = img(KPI[viewSlide].src);
    $('#mask-strip').innerHTML = KPI.map((s, i) => {
      const items = MASK_META.filter(m => m.slide === i);
      const pending = items.some(m => !S.mask[m.key].on);
      const flag = items.length ? `<span class="flag ${pending ? '' : 'done'}"><i class="ph-bold ${pending ? 'ph-exclamation-mark' : 'ph-check'}"></i></span>` : '';
      return `<button class="${i === viewSlide ? 'on' : ''}" data-slide="${i}" title="${esc(s.name)}">${img(s.src)}${flag}</button>`;
    }).join('');
    $$('#mask-strip button').forEach(b => b.onclick = () => {
      viewSlide = +b.dataset.slide;
      const hit = MASK_META.find(m => m.slide === viewSlide);
      if (hit) { S.maskSel = hit.key; save(); drawList(); }
      drawPreview();
    });
  };
  drawList(); drawPreview();
  $('#mask-continue').onclick = () => { S.maskSkipped = false; save(); go('details'); };
  $('#mask-skip').onclick = () => { S.maskSkipped = true; save(); toast('Skipped masking. Slides go out as they are.', 'ph ph-warning'); go('details'); };
}

      <div class="bar">
        <div class="prog" style="--dur:${dur}ms">${KPI.map((_, i) => `<i class="${i < presentIdx ? 'done' : i === presentIdx ? 'cur' : ''}"></i>`).join('')}</div>
        <div class="ctl">
          <span class="pager"><button id="pp"><i class="ph ph-caret-left"></i></button>${presentIdx + 1}/${KPI.length}<button id="pn"><i class="ph ph-caret-right"></i></button></span>
          <span class="sp"></span>
          <button class="btn btn-outline" data-go="visitor-editor"><i class="ph ph-pencil-simple"></i>Go to Editor</button>
          <button class="btn btn-outline" id="p-restart"><i class="ph ph-arrow-counter-clockwise"></i>Restart</button>

          <button class="icon-btn sm" style="width:30px;height:30px"><i class="ph ph-dots-three-vertical"></i></button>
          <button class="btn btn-outline"><i class="ph ph-share-fat"></i>Share</button>
          <button class="btn btn-primary"><i class="ph ph-microsoft-powerpoint-logo"></i>Export as PPT</button>
        </div>
      </div>
    </div>`;
    $('#pp').onclick = () => { clearTimers(); presentIdx = Math.max(0, presentIdx - 1); draw(); };
    $('#pn').onclick = () => { clearTimers(); presentIdx = Math.min(KPI.length - 1, presentIdx + 1); draw(); };
    $('#p-restart').onclick = () => { clearTimers(); presentIdx = 0; draw(); };
    later(() => {
      if (presentIdx < KPI.length - 1) { presentIdx++; draw(); }
      else go('visitor-editor');
    }, dur);
  };
  presentIdx = 0; draw();
}

        <div class="t">Refer and continue earning</div>
        <div class="ref-row"><span>https://presentations.ai/ref/you</span><button class="btn btn-primary btn-sm" id="cr-copy"><i class="ph ph-copy"></i>Copy</button></div>
        <div class="t" style="margin-top:4px">Or share via</div>
        <div class="share-ic">${['linkedin-logo', 'x-logo', 'facebook-logo', 'whatsapp-logo', 'envelope-simple'].map(i => `<button class="icon-btn sm"><i class="ph ph-${i}"></i></button>`).join('')}</div>
      </div>
    </div>`;
  $('#cr-x').onclick = () => $('#credits').remove();
  $('#cr-copy').onclick = () => toast('Referral link copied');
  $('#ed-share').onclick = () => toast('This is the visitor’s own copy now', 'ph ph-info');
}

/* ═══════════════════════════════════════════════════════════
   R1 · REWARDS (dashboard)
   ═══════════════════════════════════════════════════════════ */
function renderRewards() {
  const mine = myTemplates();
  const newCredits = S.signups.length * 200;
  const credits = creditsTotal();
  const cash = S.later ? 68 : 0;
  const statusCell = r => {
    const map = { capped: 'soft-gray', available: 'soft-green', pending: 'soft-amber' };
    return `<span class="pill ${map[r.status]}">${r.status}</span>${r.note ? `<small>${r.note}</small>` : ''}`;
  };
  const newRows = S.signups.map(s => ({ ev: 'Sign Up', src: S.tpl.title + ' (Community)', via: s.via, date: 'Today', status: 'available', credits: '+ 200', cash: '-', fresh: Date.now() - s.at < 8000 }));
  const rows = newRows.concat(S.later ? FIGMA_BREAKDOWN : []);
  const tog = `<div class="state-tog" title="Proto only"><button data-later="0" class="${S.later ? '' : 'on'}">Just published</button><button data-later="1" class="${S.later ? 'on' : ''}">Few weeks later</button></div>`;
  $('#screen').innerHTML = dashShell('rewards', `
      <div class="rwrap">
        <h2>Rewards</h2>
        <div class="kpis">
          <div class="kpi"><b>${credits.toLocaleString()}</b><small>Credits from sign ups</small><small>${S.later ? '+800 credits by 30 Sep, 2026' : newCredits ? `+${newCredits} from ${esc(S.tpl.title)}` : 'Share a template to start earning'}</small></div>
          <div class="kpi"><b>$${cash.toFixed(2)}</b><small>Cash available</small><a class="link" href="#" onclick="return false" style="margin-top:4px">Redeem now</a></div>
        </div>
        <div class="refer">
          <div class="a">
            <h3>Refer your friends,<br>earn credits</h3>
            <div style="margin-bottom:10px">Your referral link</div>
            <div class="ref-row" style="box-shadow:0 1px 4px -1px var(--line), inset 0 0 0 1px var(--line)"><span style="color:var(--t2)">${refUrl()}</span><button class="btn btn-primary btn-sm" id="rf-copy"><i class="ph ph-copy"></i>Copy</button></div>
            <div style="margin:20px 0 10px">Or share via</div>
            <div class="share-ic">${['linkedin-logo', 'x-logo', 'facebook-logo', 'whatsapp-logo', 'envelope-simple'].map(i => `<button class="icon-btn sm"><i class="ph ph-${i}"></i></button>`).join('')}</div>
          </div>
          <div class="b">
            <div class="gets">
              <div><i class="ph-fill ph-gift"></i><span><b>You get</b>200 points per referral + 1,000 bonus points when they upgrade</span></div>
              <div><i class="ph-fill ph-heart"></i><span><b>They get</b>200 credits on signup + 20% off Pro</span></div>
            </div>
            <div class="art"><img src="${A}hand-envelope.png" alt=""></div>
          </div>
        </div>
        <div class="sec-h" style="margin-top:56px"><h3>Your Templates</h3><button class="btn btn-outline" data-go="share"><i class="ph ph-plus"></i>New Template</button></div>
        ${mine.length ? `<div class="tgrid" style="padding-bottom:0">${mine.map(tcard).join('')}</div>` : '<div class="empty"><i class="ph ph-squares-four" style="font-size:24px"></i>No templates yet. Publish a deck from its Share menu.<button class="btn btn-outline btn-sm" data-go="share">Publish a deck</button></div>'}
        <div class="sec-h" style="margin-top:56px"><h3>Breakdown</h3></div>
        ${rows.length ? `<div class="brk"><table>
          <thead><tr><th>Event</th><th>Source</th><th>Date</th><th>Status</th><th>Credits</th><th style="text-align:right">Cash</th></tr></thead>
          <tbody>${rows.map(r => `<tr class="${r.fresh ? 'new' : ''}"><td class="ev">${r.ev}</td><td>${esc(r.src)}${r.via ? ` •<small>${r.via}</small>` : ''}</td><td>${r.date}</td><td>${statusCell(r)}</td><td>${r.credits}</td><td style="text-align:right">${r.cash}</td></tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty"><i class="ph ph-hand-coins" style="font-size:24px"></i>No sign ups yet. When someone signs up from your template link, it shows here.${S.published ? '<button class="btn btn-outline btn-sm" data-go="template">Preview your template link</button>' : ''}</div>`}
      </div>`, tog);
  $('#rf-copy').onclick = () => toast('Referral link copied');
  $$('[data-later]').forEach(b => b.onclick = () => { S.later = b.dataset.later === '1'; save(); renderRewards(); });
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
const ROUTES = [
  ['A · Page first', [['dashboard', 'Dashboard'], ['community', 'Community tab'], ['create-page', 'Create page'], ['my-page', 'Your page']]],
  ['Publish', [['editor', 'Editor'], ['share', 'Share'], ['profile-setup', 'Create page'], ['mask', 'Mask data'], ['details', 'Details'], ['live', 'Live + share'], ['profile', 'Profile']]],
  ['Visitor signs up', [['template', 'Template link'], ['login', 'Sign up'], ['role', 'Role'], ['context', 'Your context'], ['generating', 'Generating'], ['present', 'Present'], ['visitor-editor', '200 credits']]],
  ['Rewards', [['rewards', 'Rewards']]],
];
const FLAT = ROUTES.flatMap(g => g[1].map(r => r[0]));
const MODAL_ROUTES = ['share', 'profile-setup', 'mask', 'details', 'live', 'create-page'];
let ROUTE = 'editor';

function ensurePrereqs(r) {
  const idx = FLAT.indexOf(r);
  if (r === 'profile-setup') { S._firstTime = true; S.profile = null; }
  const visitor = idx >= FLAT.indexOf('template') && idx <= FLAT.indexOf('visitor-editor');
  const needsProfile = (idx >= FLAT.indexOf('mask') && idx <= FLAT.indexOf('profile')) || visitor;
  const needsPublish = r === 'live' || visitor;
  if (r === 'my-page' && !S.profile) S.profile = JSON.parse(JSON.stringify(S.draft));
  if (needsProfile && !S.profile) { S.profile = JSON.parse(JSON.stringify(S.draft)); S._firstTime = true; }
  if (needsPublish && !S.published) { S.published = true; S.publishedAt = Date.now(); }
  if (r === 'template') S._credited = false;   // a new visitor journey starts at the link
}

function renderRoute() {
  const r = ROUTE;
  if (MODAL_ROUTES.includes(r)) {
    if (r === 'create-page') renderCommunity(); else renderPublisherEditor();
    ({ 'create-page': () => renderPageModal({ from: 'dashboard', edit: !!S.profile }), share: renderShare, 'profile-setup': () => renderPageModal({ from: 'share' }), mask: renderMask, details: renderDetails, live: renderLive })[r]();
  } else {
    closeModal();
    ({ dashboard: renderDashboard, community: renderCommunity, 'my-page': renderCommunity, editor: renderPublisherEditor, profile: renderProfile, template: renderTemplate, login: renderLogin, role: renderRole, context: renderContext, generating: renderGenerating, present: renderPresent, 'visitor-editor': renderVisitorEditor, rewards: renderRewards })[r]();
  }
}

function go(r) {
  if (!FLAT.includes(r)) r = 'editor';
  if (r === 'community' && S.profile) r = 'my-page';
  clearTimers();
  ensurePrereqs(r);
  ROUTE = r;
  save();
  closeModal();
  renderRoute();
  const u = new URL(location.href);
  u.searchParams.set('s', r);
  u.searchParams.delete('reset');
  history.replaceState(null, '', u);
  renderFlow();
  const pg = $('.page, .dmain'); if (pg) pg.scrollTop = 0;
}

/* Flow bar: pick a journey, then step through it. Proto navigation only. */
const JOURNEYS = [
  { id: 'a', label: 'Page first', hint: 'Create the page from the dashboard, publish later', fresh: true,
    steps: ['dashboard', 'community', 'create-page', 'my-page', 'editor', 'share', 'mask', 'details', 'live', 'profile'] },
  { id: 'b', label: 'No page yet', hint: 'Publish from Share, create the page on the way', fresh: true,
    steps: ['editor', 'share', 'profile-setup', 'mask', 'details', 'live', 'profile'] },
  { id: 'v', label: 'Visitor', hint: 'Someone opens the template link and signs up',
    steps: ['template', 'login', 'role', 'context', 'generating', 'present', 'visitor-editor'] },
  { id: 'r', label: 'Rewards', hint: 'Credits and cash from sign ups', steps: ['rewards'] },
];
const LABEL = Object.fromEntries(ROUTES.flatMap(g => g[1]));
LABEL.community = 'Community tab'; LABEL['my-page'] = 'Your page';
function currentJourney() {
  const j = JOURNEYS.find(x => x.id === S.journey);
  if (j && j.steps.includes(ROUTE)) return j;
  const found = JOURNEYS.find(x => x.steps.includes(ROUTE)) || JOURNEYS[0];
  S.journey = found.id; save();
  return found;
}
function renderFlow() {
  const min = $('#flow').classList.contains('min');
  const j = currentJourney();
  const i = Math.max(0, j.steps.indexOf(ROUTE));
  $('#flow').innerHTML = `
    <button class="tog" title="${min ? 'Show' : 'Hide'} flow bar" id="flow-tog"><i class="ph ${min ? 'ph-path' : 'ph-caret-left'}"></i>${min ? 'Flow' : ''}</button>
    <div class="jr">${JOURNEYS.map(x => `<button class="${x.id === j.id ? 'on' : ''}" data-j="${x.id}" title="${x.hint}">${x.label}</button>`).join('')}</div>
    ${j.steps.length > 1 ? `
    <div class="stepper">
      <button class="arr" id="fl-prev" ${i === 0 ? 'disabled' : ''} aria-label="Previous step"><i class="ph ph-caret-left"></i></button>
      <span class="now"><span class="ct">${i + 1}/${j.steps.length}</span>${LABEL[ROUTE] || ''}</span>
      <button class="arr" id="fl-next" ${i === j.steps.length - 1 ? 'disabled' : ''} aria-label="Next step"><i class="ph ph-caret-right"></i></button>
      <span class="dots">${j.steps.map((k, n) => `<button class="${n === i ? 'on' : n < i ? 'past' : ''}" data-step="${k}" title="${n + 1}. ${LABEL[k]}"></button>`).join('')}</span>
    </div>` : ''}`;
  const step = k => { if (k === 'profile') S.visitorView = false; if (k === 'rewards' && !S.published) S.later = true; go(k); };
  $$('[data-j]').forEach(b => b.onclick = () => {
    const x = JOURNEYS.find(y => y.id === b.dataset.j);
    if (x.fresh) { S = DEFAULT_STATE(); }
    S.journey = x.id; save();
    step(x.steps[0]);
    toast(x.hint, 'ph ph-path');
  });
  $$('[data-step]').forEach(b => b.onclick = () => step(b.dataset.step));
  $('#fl-prev') && ($('#fl-prev').onclick = () => step(j.steps[i - 1]));
  $('#fl-next') && ($('#fl-next').onclick = () => step(j.steps[i + 1]));
  $('#flow-tog').onclick = () => { $('#flow').classList.toggle('min'); renderFlow(); };
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go]');
  if (!el) return;
  e.preventDefault();
  const r = el.dataset.go;
  if (r === 'profile') S.visitorView = el.hasAttribute('data-visitor');
  go(r);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#modal-root').innerHTML) $('.x-out')?.click();
  else $('#credits')?.remove();
});

(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.has('reset')) { S = DEFAULT_STATE(); save(); }
  go(q.get('s') || 'dashboard');
})();
</script>
