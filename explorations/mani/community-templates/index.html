<script>
/* Flow bar can be dragged by its grip so you can see what is behind it. Position is a per-viewer convenience. */
(function () {
  const KEY = 'ct-flow-pos';
  const flow = document.getElementById('flow');
  const clamp = (x, y) => [Math.min(Math.max(8, x), innerWidth - flow.offsetWidth - 8), Math.min(Math.max(8, y), innerHeight - flow.offsetHeight - 8)];
  const place = (x, y) => { [x, y] = clamp(x, y); Object.assign(flow.style, { left: x + 'px', top: y + 'px', bottom: 'auto' }); return [x, y]; };
  const reset = () => { Object.assign(flow.style, { left: '', top: '', bottom: '' }); try { localStorage.removeItem(KEY); } catch (e) {} };
  try { const p = JSON.parse(localStorage.getItem(KEY) || 'null'); if (p) requestAnimationFrame(() => place(p[0], p[1])); } catch (e) {}
  let start = null;
  flow.addEventListener('pointerdown', e => {
    if (!e.target.closest('#flow-grip')) return;
    e.preventDefault();
    const r = flow.getBoundingClientRect();
    start = { dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
    flow.setPointerCapture(e.pointerId); flow.classList.add('dragging');
  });
  flow.addEventListener('pointermove', e => { if (start && e.pointerId === start.id) place(e.clientX - start.dx, e.clientY - start.dy); });
  const end = e => {
    if (!start || e.pointerId !== start.id) return;
    start = null; flow.classList.remove('dragging');
    const r = flow.getBoundingClientRect();
    try { localStorage.setItem(KEY, JSON.stringify([r.left, r.top])); } catch (err) {}
  };
  flow.addEventListener('pointerup', end); flow.addEventListener('pointercancel', end);
  // While dragging, the pointer is captured by the bar, so a double-click lands on #flow itself
  flow.addEventListener('dblclick', e => { if (e.target === flow || e.target.closest('#flow-grip')) reset(); });
  addEventListener('resize', () => { if (flow.style.top) { const r = flow.getBoundingClientRect(); place(r.left, r.top); } });
})();
</script>

const SOCIALS = { instagram: ['ph-instagram-logo', 'Instagram', 'instagram.com/you'], youtube: ['ph-youtube-logo', 'YouTube', 'youtube.com/@you'], github: ['ph-github-logo', 'GitHub', 'github.com/you'], dribbble: ['ph-dribbble-logo', 'Dribbble', 'dribbble.com/you'], behance: ['ph-behance-logo', 'Behance', 'behance.net/you'], medium: ['ph-medium-logo', 'Medium', 'medium.com/@you'], threads: ['ph-threads-logo', 'Threads', 'threads.net/@you'], tiktok: ['ph-tiktok-logo', 'TikTok', 'tiktok.com/@you'] };
const moreLinkIcons = (p, tag = 'i') => (p.more || []).filter(m => m.v).map(m => `<i class="ph ${SOCIALS[m.k][0]}"></i>`).join('');
// upd(): caller redraws its preview and save button. Guarded so late timers never touch a closed form.
function bindProfileFields(d, editMode, upd) {
  const bind = (id, key, after) => $(id).addEventListener('input', e => { d[key] = e.target.value; after && after(); upd(); save(); });
  bind('#f-name', 'name');
  bind('#f-headline', 'headline');
  bind('#f-bio', 'bio', () => $('#bio-count').textContent = `${d.bio.length}/160`);
  bind('#f-linkedin', 'linkedin'); bind('#f-x', 'x'); bind('#f-website', 'website');
  if (!d.more) d.more = [];
  let picking = false;
  const drawMore = focusKey => {
    const box = $('#f-more'); if (!box) return;
    const left = Object.keys(SOCIALS).filter(k => !d.more.some(m => m.k === k));
    box.innerHTML = d.more.map((m, i) => `<div class="more-row"><div class="input-group"><span class="prefix" style="padding-right:8px"><i class="ph ${SOCIALS[m.k][0]}"></i></span><input data-more="${i}" value="${esc(m.v)}" placeholder="${SOCIALS[m.k][2]}"></div><button class="icon-btn" data-more-rm="${i}" aria-label="Remove ${SOCIALS[m.k][1]}"><i class="ph ph-x"></i></button></div>`).join('')
      + (picking ? `<div class="more-pick">${left.map(k => `<button class="chip sm" data-more-add="${k}"><i class="ph ${SOCIALS[k][0]}"></i>${SOCIALS[k][1]}</button>`).join('')}<button class="link" id="more-cancel" style="font-size:13px">Cancel</button></div>`
        : left.length ? `<button class="link more-add" id="more-open"><i class="ph ph-plus"></i>Add another link</button>` : '');
    $$('#f-more [data-more]').forEach(inp => inp.addEventListener('input', e => { d.more[+inp.dataset.more].v = e.target.value; upd(); save(); }));
    $$('#f-more [data-more-rm]').forEach(b => b.onclick = () => { d.more.splice(+b.dataset.moreRm, 1); upd(); save(); drawMore(); });
    $$('#f-more [data-more-add]').forEach(b => b.onclick = () => { d.more.push({ k: b.dataset.moreAdd, v: '' }); picking = false; save(); drawMore(b.dataset.moreAdd); });
    $('#more-open') && ($('#more-open').onclick = () => { picking = true; drawMore(); });
    $('#more-cancel') && ($('#more-cancel').onclick = () => { picking = false; drawMore(); });
    if (focusKey) $(`#f-more [data-more="${d.more.length - 1}"]`)?.focus();
  };
  drawMore();
  if (!editMode) $('#f-handle').addEventListener('input', e => {
    const clean = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    e.target.value = clean; d.handle = clean;
    const st = $('#h-status');
    clearTimeout(handleTimer);
    handleOK = false;
    if (clean.length < 3) { st.className = 'handle-status bad'; st.innerHTML = '<i class="ph-bold ph-x"></i>At least 3 characters'; upd(); return; }
    st.className = 'handle-status wait'; st.innerHTML = 'Checking…';
    upd();
    handleTimer = setTimeout(() => {
      if (!$('#h-status')) return;
      const taken = TAKEN.includes(clean);
      handleOK = !taken;
      st.className = 'handle-status ' + (taken ? 'bad' : 'ok');
      st.innerHTML = taken ? `<i class="ph-bold ph-x"></i>Taken. Try ${clean}-${Math.floor(Math.random() * 90 + 10)}` : '<i class="ph-bold ph-check"></i>Available';
      upd();
    }, 450);
  });
  $$('#f-topics .chip').forEach(c => c.onclick = () => {
    const t = c.dataset.topic;
    if (d.topics.includes(t)) d.topics = d.topics.filter(x => x !== t);
    else if (d.topics.length < 3) d.topics.push(t);
    else { toast('Pick up to 3 topics', 'ph ph-info'); return; }
    $$('#f-topics .chip').forEach(x => x.classList.toggle('on', d.topics.includes(x.dataset.topic)));
    upd(); save();
  });
  $$('#f-covers [data-cover]').forEach(b => b.onclick = () => {
    d.cover = b.dataset.cover;
    $$('#f-covers [data-cover]').forEach(x => x.classList.toggle('on', x === b));
    upd(); save();
  });
  $('#ps-photo').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); const k = 240; c.width = c.height = k;
        const m = Math.min(im.width, im.height);
        c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, k, k);
        if (!$('#ps-av')) return;
        d.photo = c.toDataURL('image/jpeg', 0.85); upd(); save();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  $('#ps-photo-rm').onclick = () => { d.photo = null; upd(); save(); };
}

function startDraft(editMode) {

  const d = JSON.parse(JSON.stringify(editMode ? S.profile : (S.profile || S.draft)));

  handleOK = d.handle.length >= 3 && !TAKEN.includes(d.handle);
  return d;
}

  let viewSlide = (MASK_META.find(m => m.key === S.maskSel) || MASK_META[0]).slide;
  const count = () => MASK_META.filter(m => S.mask[m.key].on).length;
  const drawFoot = () => {
    const n = count(), all = n === MASK_META.length;
    $('#mask-count').innerHTML = n ? `<i class="ph ph-shield-check"></i>${n} of ${MASK_META.length} hidden in the template` : '<i class="ph ph-warning" style="color:var(--amber)"></i>Nothing hidden. Everything goes out as it is.';
    $('#mask-continue').textContent = n ? `Hide ${n} item${n === 1 ? '' : 's'} and continue` : 'Continue without hiding';
    $('#mk-all').textContent = all ? 'Show all' : 'Hide all';
  };
  const drawList = () => {
    $('#mask-list').innerHTML = MASK_META.map(m => {
      const st = S.mask[m.key];
      return `<div class="mk-row ${S.maskSel === m.key ? 'sel' : ''} ${st.on ? '' : 'open'}" data-k="${m.key}">
        <span class="mk-ic"><i class="ph ${ICON[m.key]}"></i></span>
        <div class="mk-tx">
          <div class="t">${m.label}<span>Slide ${m.slide + 1}</span></div>
          ${st.on
            ? `<div class="swap"><s>${esc(m.orig)}</s><i class="ph ph-arrow-right"></i><input class="rep" data-rep="${m.key}" value="${esc(st.rep)}" aria-label="Replace ${esc(m.label)} with"></div>`
            : `<div class="swap"><span class="orig">${esc(m.orig)}</span><span class="pub"><i class="ph ph-eye"></i>Will be public</span></div>`}
        </div>
        <button class="toggle ${st.on ? 'on' : ''}" data-chk="${m.key}" aria-label="Hide ${esc(m.label)}"></button>
      </div>`;
    }).join('');
    drawFoot();
    $$('#mask-list .mk-row').forEach(r => r.onclick = e => {
      if (e.target.matches('input')) return;
      const k = r.dataset.k;
      if (e.target.closest('[data-chk]')) S.mask[k].on = !S.mask[k].on;
      S.maskSel = k; viewSlide = MASK_META.find(m => m.key === k).slide; save(); drawList(); drawPreview();
    });
    $$('#mask-list .rep').forEach(inp => {
      const select = () => { if (S.maskSel !== inp.dataset.rep) { S.maskSel = inp.dataset.rep; viewSlide = MASK_META.find(m => m.key === S.maskSel).slide; $$('#mask-list .mk-row').forEach(r => r.classList.toggle('sel', r.dataset.k === S.maskSel)); drawPreview(); } };
      inp.addEventListener('input', e => { S.mask[inp.dataset.rep].rep = e.target.value; select(); save(); drawPreview(); });
      inp.addEventListener('focus', select);
    });
  };
  const drawPreview = () => {
    const here = MASK_META.filter(m => m.slide === viewSlide);
    $('#mk-stage').innerHTML = img(KPI[viewSlide].src) + here.map(m => {
      const [x, y, w, h] = SPOT[m.key], on = S.mask[m.key].on;
      return `<button class="mk-spot ${on ? 'on' : ''} ${S.maskSel === m.key ? 'sel' : ''} ${y < 15 ? 'below' : ''}" data-spot="${m.key}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">
        <span class="lb">${on ? `<i class="ph-fill ph-eye-slash"></i>${esc(S.mask[m.key].rep || 'Hidden')}` : `<i class="ph ph-eye"></i>${esc(m.label)}`}</span></button>`;
    }).join('') + `<span class="mk-cap">Slide ${viewSlide + 1} · ${esc(KPI[viewSlide].name)}${here.length ? '' : ' · nothing to hide here'}</span>`;
    $$('#mk-stage [data-spot]').forEach(b => b.onclick = () => { S.maskSel = b.dataset.spot; save(); drawList(); drawPreview(); $(`#mask-list [data-rep="${b.dataset.spot}"]`)?.focus(); });
    $('#mask-strip').innerHTML = KPI.map((s, i) => {
      const items = MASK_META.filter(m => m.slide === i);
      const open = items.some(m => !S.mask[m.key].on);
      const flag = items.length ? `<span class="flag ${open ? '' : 'done'}"><i class="ph-bold ${open ? 'ph-exclamation-mark' : 'ph-check'}"></i></span>` : '';
      return `<button class="${i === viewSlide ? 'on' : ''}" data-slide="${i}" title="${esc(s.name)}">${img(s.src)}${flag}</button>`;
    }).join('');
    $$('#mask-strip button').forEach(b => b.onclick = () => {
      viewSlide = +b.dataset.slide;
      const hit = MASK_META.find(m => m.slide === viewSlide);
      if (hit) { S.maskSel = hit.key; save(); drawList(); }
      drawPreview();
    });
  };
  drawList(); drawPreview();
  $('#mk-all').onclick = () => { const all = count() === MASK_META.length; MASK_META.forEach(m => { S.mask[m.key].on = !all; }); save(); drawList(); drawPreview(); };
  $('#mask-continue').onclick = () => { S.maskSkipped = count() === 0; save(); go('details'); };
  $('#mask-skip').onclick = () => { S.maskSkipped = true; save(); toast('Skipped masking. Slides go out as they are.', 'ph ph-warning'); go('details'); };
}

function creatorStats(key) {
  const list = key === 'co' ? teamItems() : galleryItems().filter(t => byKey(t) === key);
  return { n: list.length, uses: list.reduce((a, t) => a + t.uses, 0), followers: (FOLLOWERS[key] || 0) + (S.follows[key] ? 1 : 0) };
}
function followBtn(key, big = false) {
  if (key === 'me') return '';
  const on = !!S.follows[key];
  return `<button class="btn ${on ? 'btn-outline' : 'btn-primary'} ${big ? '' : 'btn-sm'}" data-follow="${key}">${on ? '<i class="ph ph-check"></i>Following' : '<i class="ph ph-plus"></i>Follow'}</button>`;
}
const fmtK = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n);
let hcTimer = null, hcKey = null, hcEl = null;
function hideHover() { clearTimeout(hcTimer); hcKey = null; hcEl = null; $('#hc')?.remove(); }
function showHover(el) {
  const key = el.dataset.creator;
  clearTimeout(hcTimer);
  if (hcEl === el && $('#hc')) return;
  $('#hc')?.remove();
  hcKey = key; hcEl = el;
  const c = key === 'me' ? P() : key === 'co' ? TEAM() : CREATORS[key];
  if (!c) return;
  const st = creatorStats(key);
  const card = document.createElement('div');
  card.id = 'hc';
  card.innerHTML = `<div class="hc-top">${avatar(48, c)}<div><b>${esc(c.name)}</b><span>${esc(c.headline || '@' + c.handle)}</span></div></div>
    <div class="hc-stats"><div><b>${st.n}</b>Templates</div><div><b>${fmtK(st.uses)}</b>Uses</div><div><b>${fmtK(st.followers)}</b>Followers</div></div>
    ${c.team ? `<a href="#" class="hc-team" data-go="company"><img src="${A}ws-foursquare.jpg" alt="">Member of ${esc(S.company.name)}</a>` : ''}
    <div class="hc-acts">${CREATORS[key] ? `<button class="btn btn-outline btn-sm" data-go="creator" data-cr="${key}">View page</button>` : ''}${key === 'co' ? `<button class="btn btn-outline btn-sm" data-go="company">Team page</button>${followBtn('co')}` : key === 'me' ? (S.journey === 'v' ? '<button class="btn btn-outline btn-sm" data-go="profile" data-visitor>View page</button>' : '<button class="btn btn-outline btn-sm" data-go="profile">Your page</button>') : followBtn(key)}</div>`;
  document.body.appendChild(card);
  // Keep the card fully on screen: below the name if it fits, otherwise above
  const r = el.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
  const top = r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;
  card.style.top = Math.max(8, top) + 'px';
  card.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
}

const TEAM = () => ({ name: S.company.name, handle: S.company.slug, headline: S.company.on ? 'Team page' : 'Team page · unclaimed', photo: A + 'ws-foursquare.jpg' });
const CO_DOMAIN = 'foursquare.com';
function renderClaimModal({ from = 'settings' } = {}) {
  const co = S.company, st = S._claim || (S._claim = { step: 'email', email: 'joe@' + CO_DOMAIN });
  const inShare = from === 'share';
  const close = () => { S._claim = null; go(inShare ? 'details' : 'ws-settings'); };
  const preview = `<div class="cl-prev">
      <div class="cv" style="background:${co.cover}"></div>
      <img class="lg" src="${A}ws-foursquare.jpg" alt="">
      <b>${esc(co.name)}</b><span>presentations.ai/${esc(co.slug)}</span>
      <span class="pill ${st.step === 'done' ? 'soft-green' : 'soft-gray'}">${st.step === 'done' ? 'Claimed' : 'Unclaimed'}</span>
      <div class="cl-tpls">${GALLERY.filter(t => t.team).map(t => coverHTML(t, 'th')).join('')}</div>
      <small>${GALLERY.filter(t => t.team).length} templates from your teammates are already here</small>
    </div>`;
  const body = st.step === 'email' ? `
      <h3>Confirm you work at ${esc(co.name)}</h3>
      <p>${esc(co.name)}’s page already exists on Community. Anyone with an <b>@${CO_DOMAIN}</b> email can claim it and manage it.</p>
      <div class="field"><label class="label">Work email</label><input class="input" id="cl-email" value="${esc(st.email)}" autocomplete="off"></div>
      <div class="cl-err" id="cl-err"></div>
      <button class="btn btn-primary btn-lg" id="cl-send" style="width:100%">Send code</button>`
    : `
      <h3>Check your email</h3>
      <p>We sent a 6-digit code to <b>${esc(st.email)}</b>. <button class="link" id="cl-change">Change email</button></p>
      <div class="field"><label class="label">Code <span class="hint">Proto: any 6 digits</span></label><input class="input cl-code" id="cl-code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></div>
      <div class="cl-err" id="cl-err"></div>
      <button class="btn btn-primary btn-lg" id="cl-verify" style="width:100%" disabled>${inShare ? 'Verify, claim and publish' : 'Verify and claim'}</button>
      <button class="link" id="cl-resend" style="align-self:center;font-weight:400;color:var(--t3)">Resend code</button>`;
  openModal(`
    ${inShare ? stepHead(`Claim ${esc(co.name)}’s page to publish`, 'details') : `<div class="f-head">Claim ${esc(co.name)}’s page</div>`}
    <div class="card" style="width:820px">
      <div class="cl">
        <div class="cl-form">${body}</div>
        ${preview}
      </div>
      <div class="f-foot"><span class="note"><i class="ph ph-shield-check"></i>Teammates can still publish here. You decide what shows.</span></div>
    </div>`, { onClose: close });
  const err = m => { $('#cl-err').textContent = m; };
  if (st.step === 'email') {
    const inp = $('#cl-email');
    inp.oninput = () => { st.email = inp.value.trim(); err(''); inp.style.boxShadow = ''; };
    const send = () => {
      if (!/^\S+@\S+\.\S+$/.test(st.email)) { err('Enter a valid email'); inp.style.boxShadow = 'inset 0 0 0 1px var(--red)'; return; }
      if (!st.email.toLowerCase().endsWith('@' + CO_DOMAIN)) { err(`Use your @${CO_DOMAIN} email to claim this page`); inp.style.boxShadow = 'inset 0 0 0 1px var(--red)'; return; }
      st.step = 'code'; save(); renderClaimModal({ from }); toast(`Code sent to ${esc(st.email)}`, 'ph ph-envelope-simple');
    };
    $('#cl-send').onclick = send;
    inp.onkeydown = e => { if (e.key === 'Enter') send(); };
    inp.focus();
  } else {
    const code = $('#cl-code');
    code.oninput = () => { code.value = code.value.replace(/\D/g, ''); $('#cl-verify').disabled = code.value.length !== 6; err(''); };
    $('#cl-change').onclick = () => { st.step = 'email'; save(); renderClaimModal({ from }); };
    $('#cl-resend').onclick = () => toast(`New code sent to ${esc(st.email)}`, 'ph ph-envelope-simple');
    $('#cl-verify').onclick = () => {
      const b = $('#cl-verify'); b.innerHTML = '<span class="spin"></span>Verifying'; b.disabled = true;
      later(() => {
        S.company.on = true; S.company.claimedBy = st.email; S._claim = null; save();
        toast(`You now manage ${esc(co.name)}’s page`);
        if (inShare) { S.published = true; S.publishedAt = Date.now(); save(); go('live'); } else go('company');
      }, 900);
    };
    code.focus();
  }
}

   Friend signs up with the inviter's link and gets their own
   workspace with 200 credits.
   Free inviter: 200 credits per friend, up to 2,000.
   Pro inviter: 10% of the friend's first payment, in cash.
   ═══════════════════════════════════════════════════════════ */
const REF_BONUS = 200, REF_MAX = 2000, REF_CUT = 0.1;
const PRO_PLANS = [
  { id: 'year', label: 'Yearly', price: 180, per: '$15/mo, billed $180 yearly', save: 'Save $60' },
  { id: 'month', label: 'Monthly', price: 20, per: '$20/mo, billed monthly' },
];
const REF_SEED = [
  { who: 'sam@northwind.co', status: 'invited', when: 'Yesterday' },
  { who: 'Marcus Lee', status: 'joined', when: '3 days ago' },
];
const REF_SEED_MAX = ['Marcus Lee', 'Sofia Alvarez', 'Ken Watanabe', 'Amara Okafor', 'Liam Chen', 'Nora Haddad', 'Diego Ruiz', 'Hana Kim', 'Omar Farouk', 'Elena Rossi']
  .map((who, i) => ({ who, status: 'joined', when: i < 2 ? `${i + 2} days ago` : `${i} weeks ago` }));
const REF_SEED_PRO = [
  { who: 'sam@northwind.co', status: 'invited', when: 'Yesterday' },
  { who: 'Sofia Alvarez', status: 'joined', when: '4 days ago' },
  { who: 'Marcus Lee', status: 'upgraded', when: '2 weeks ago', pay: 180, plan: 'Yearly', payout: 'pending', payDate: '21 Oct' },
  { who: 'Ken Watanabe', status: 'upgraded', when: '2 months ago', pay: 180, plan: 'Yearly', payout: 'paid' },
];
const isPro = () => S.plan === 'pro';
const money = n => '$' + n.toFixed(2);
const friendFirst = () => (S.friend.name || '').trim().split(/\s+/)[0] || 'Your friend';
const friendHandle = () => (S.friend.name || 'you').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'you';

// Newest first. Free: credits worked out oldest first so the 2,000 cap applies in order.
// Pro: cash is 10% of the first payment, only once the friend upgrades.
function refRows() {
  const seed = S.refMax ? REF_SEED_MAX : isPro() ? REF_SEED_PRO : REF_SEED;
  const rows = S.refs.concat(seed).map(r => ({ ...r }));
  let total = 0;
  for (let i = rows.length - 1; i >= 0; i--) {
    const r = rows[i];
    r.cash = isPro() && r.status === 'upgraded' ? r.pay * REF_CUT : null;
    if (r.status === 'invited') { r.got = null; continue; }
    r.got = Math.min(REF_BONUS, REF_MAX - total);
    total += r.got;
  }
  return rows;
}
const refEarned = () => refRows().reduce((n, r) => n + (r.got || 0), 0);
const refCash = () => refRows().reduce((n, r) => n + (r.cash || 0), 0);

function creditFriend() {
  if (S._refCredited) return;
  S._refCredited = true;
  S.refs = S.refs.filter(r => r.who !== S.friend.name);
  S.refs.unshift({ who: S.friend.name, status: 'joined', when: 'Just now', at: Date.now() });
  save();
}
const friendRow = () => S.refs.find(x => x.who === S.friend.name);
const friendIsPro = () => friendRow()?.status === 'upgraded';
function upgradeFriend(pay) {
  if (!friendRow()) S._refCredited = false;
  creditFriend();
  const r = friendRow();
  if (r.status === 'upgraded') return;   // first payment only, counted once
  Object.assign(r, { status: 'upgraded', pay, plan: pay === 20 ? 'Monthly' : 'Yearly', payout: 'pending', payDate: '4 Nov', when: 'Just now', at: Date.now() });
  save();
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
const ROUTES = [
  ['A · Page first', [['dashboard', 'Dashboard'], ['community', 'Community page'], ['create-page', 'Create page'], ['my-page', 'Your page']]],
  ['Publish', [['editor', 'Editor'], ['share', 'Share'], ['share-community', 'Community tab'], ['share-updated', 'Update live'], ['profile-setup', 'Create page'], ['team-claim', 'Claim team page'], ['mask', 'Mask data'], ['details', 'Details'], ['live', 'Live + share'], ['gallery', 'On Community'], ['profile', 'Profile'], ['manage', 'Manage template']]],
  ['Visitor signs up', [['template', 'Template link'], ['login', 'Sign up'], ['role', 'Role'], ['context', 'Your context'], ['generating', 'Generating'], ['present', 'Present'], ['visitor-editor', '200 credits']]],
  ['Rewards', [['notifs', 'Notifications'], ['rewards', 'Rewards'], ['redeem', 'Redeem cash']]],

const FLAT = ROUTES.flatMap(g => g[1].map(r => r[0]));
const MODAL_ROUTES = ['share', 'share-community', 'share-updated', 'profile-setup', 'mask', 'details', 'live', 'create-page', 'team-claim', 'ws-claim', 'redeem', 'manage'];
let ROUTE = 'editor';

function ensurePrereqs(r) {
  const idx = FLAT.indexOf(r);
  if (r === 'profile-setup') { S._firstTime = true; S.profile = null; }
  const visitor = idx >= FLAT.indexOf('template') && idx <= FLAT.indexOf('visitor-editor');
  const needsProfile = (idx >= FLAT.indexOf('mask') && idx <= FLAT.indexOf('profile') && r !== 'gallery') || visitor;
  const needsPublish = r === 'live' || visitor || (r === 'gallery' && S.journey === 'v');
  if (r === 'my-page' && !S.profile) S.profile = JSON.parse(JSON.stringify(S.draft));
  if (needsProfile && !S.profile) { S.profile = JSON.parse(JSON.stringify(S.draft)); S._firstTime = true; }
  if (needsPublish && !S.published) { S.published = true; S.publishedAt = Date.now(); }
  if (r === 'template') S._credited = false;   // a new visitor journey starts at the link
  if (r === 'redeem') S._pay = null;
  if (r === 'share-community' || r === 'share-updated') { S._shc = null; if (!S.profile) S.profile = JSON.parse(JSON.stringify(S.draft)); if (!S.published) { S.published = true; S.publishedAt = Date.now() - 2 * 864e5; } }
  if (r === 'share-updated' && !S.updatedAt) publishUpdate();
  if (S.journey === 'm' && S.published && (r === 'mask' || r === 'details') && !S._upd) S._upd = r === 'details' && !S.slidesChanged ? 'details' : 'slides';
  if (['editor', 'share', 'live', 'gallery'].includes(r) || (S.journey !== 'm' && !['mask', 'details', 'team-claim'].includes(r))) S._upd = null;
  if (S.journey === 'c' && (r === 'gallery' || r === 'creator')) {
    if (!S.profile) S.profile = JSON.parse(JSON.stringify(S.draft));
    if (!S.published) { S.published = true; S.publishedAt = Date.now(); }
  }
  if (r === 'manage') { S._mg = null; if (!S.profile) S.profile = JSON.parse(JSON.stringify(S.draft)); if (!S.published) { S.published = true; S.publishedAt = Date.now(); } }
  if (r === 'notifs') {
    if (!S.profile) S.profile = JSON.parse(JSON.stringify(S.draft));
    if (!S.published) { S.published = true; S.publishedAt = Date.now() - 3600e3; }
    if (!S.signups.length) S.signups.push({ who: 'Priya Raman', via: 'Google', role: 'Sales', at: Date.now() - 600e3 });
    S.notifSeen = 0;
  }
  if (r === 'team-claim') { S.publishAs = 'team'; S.company.on = false; S._claim = null; }
  if (r === 'ws-claim') { S.company.on = false; S._claim = null; }
  if (r === 'live' && S.publishAs === 'team' && !S.company.on) S.company.on = true;
  if (r === 'ref-login') S._refCredited = false;
  if (r === 'refer-joined') creditFriend();
  if (r === 'ref-upgrade' || r === 'refer-paid') S.plan = 'pro';
  if (r === 'refer-paid' && !S.refs.some(x => x.who === S.friend.name && x.status === 'upgraded')) upgradeFriend(PRO_PLANS.find(p => p.id === S.friendPlan).price);
}

function renderRoute() {
  const r = ROUTE;
  if (MODAL_ROUTES.includes(r)) {
    if (r === 'manage' && S._mgFrom === 'rewards') renderRewards(); else if (r === 'manage' && S._mgFrom === 'profile') renderProfile(); else if (r === 'create-page' || r === 'manage') renderCommunity(); else if (r === 'ws-claim') renderWsSettings(); else if (r === 'redeem') renderRewards(); else renderPublisherEditor();
    ({ 'create-page': () => renderPageModal({ from: 'dashboard', edit: !!S.profile }), share: renderShare, 'share-community': renderShareCommunity, 'share-updated': renderShareCommunity, 'profile-setup': () => renderPageModal({ from: 'share' }), 'team-claim': () => renderClaimModal({ from: 'share' }), 'ws-claim': () => renderClaimModal({ from: 'settings' }), redeem: () => renderPayout({ redeem: true }), manage: renderManage, mask: renderMask, details: renderDetails, live: renderLive })[r]();
  } else {
    closeModal();
    ({ dashboard: renderDashboard, community: renderCommunity, 'my-page': renderCommunity, editor: renderPublisherEditor, profile: renderProfile, template: renderTemplate, login: renderLogin, role: renderRole, context: renderContext, generating: renderGenerating, present: renderPresent, 'visitor-editor': renderVisitorEditor, rewards: renderRewards,
      gallery: renderGallery, notifs: () => { renderDashboard(); later(openNotifs, 60); }, creator: renderCreator, 'ws-settings': renderWsSettings, company: renderCompany, refer: renderRefer, 'ref-login': () => renderLogin({ ref: true }), 'ref-setup': () => renderRole({ back: 'ref-login', next: 'ref-home' }), 'ref-home': renderRefHome, 'refer-joined': () => renderRefer({ joined: true }), 'ref-upgrade': renderRefUpgrade, 'refer-paid': () => renderRefer({ paid: true }) })[r]();
  }
}

function go(r) {
  if (!FLAT.includes(r)) r = 'editor';
  if (r === 'community' && S.profile) r = 'my-page';
  clearTimers();
  hideHover();
  closeNotifs();
  ensurePrereqs(r);
  ROUTE = r;
  save();
  closeModal();
  renderRoute();
  const u = new URL(location.href);
  u.searchParams.set('s', r);
  u.searchParams.delete('reset');
  u.searchParams.delete('plan');
  u.searchParams.delete('j');
  history.replaceState(null, '', u);
  renderFlow();
  const pg = $('.page, .dmain'); if (pg) pg.scrollTop = 0;
}

/* Flow bar: pick a journey, then step through it. Proto navigation only. */
const JOURNEYS = [
  { id: 'e', group: 'me', label: 'Has a page', hint: 'Page already set up, publish a deck from Share', fresh: true,
    init: s => { s.profile = JSON.parse(JSON.stringify(s.draft)); },
    steps: ['editor', 'share', 'mask', 'details', 'live', 'gallery', 'template', 'profile', 'manage'] },
  { id: 'a', group: 'me', label: 'No page · from dashboard', hint: 'Create the page from the dashboard, publish later', fresh: true,
    steps: ['dashboard', 'community', 'create-page', 'my-page', 'editor', 'share', 'mask', 'details', 'live', 'gallery', 'template', 'profile', 'manage'] },
  { id: 'b', group: 'me', label: 'No page · from Share', hint: 'Publish from Share, create the page on the way', fresh: true,
    steps: ['editor', 'share', 'profile-setup', 'mask', 'details', 'live', 'gallery', 'template', 'profile'] },
  { id: 'm', group: 'me', label: 'Edit or unpublish', hint: 'Template is live and you edited the deck. Update it, edit details or unpublish from the Publish to Community tab in Share', fresh: true,
    init: s => { s.slidesChanged = true; s.profile = JSON.parse(JSON.stringify(s.draft)); s.published = true; s.publishedAt = Date.now() - 2 * 864e5; s.uses = 38; s.signups = [{ who: 'Priya Raman', via: 'Google', role: 'Sales', at: Date.now() - 6e5 }, { who: 'Ken Ito', via: 'Email', role: 'Finance', at: Date.now() - 9e6 }]; },
    steps: ['editor', 'share', 'share-community', 'mask', 'details', 'share-updated', 'template'] },
  { id: 'v', group: 'other', label: 'Visitor', hint: 'Someone opens the template link and signs up',
    steps: ['gallery', 'template', 'login', 'role', 'context', 'generating', 'present', 'visitor-editor'] },
  { id: 'r', group: 'other', label: 'Rewards', hint: 'Notifications, then Rewards in Settings, redeem to PayPal or bank', init: s => { s.plan = 'pro'; }, steps: ['notifs', 'rewards', 'redeem'] },
  { id: 'c', group: 'other', label: 'Creators', hint: 'Browse Community and open another creator’s page', init: s => { s.viewCreator = 'dana'; }, fresh: true, steps: ['gallery', 'creator'] },
  { id: 'ts', group: 'team', label: 'From settings', hint: 'Claim the Foursquare page in Workspace settings', fresh: true,
    steps: ['dashboard', 'ws-settings', 'ws-claim', 'company'] },
  { id: 'tb', group: 'team', label: 'From Share', hint: 'Pick Foursquare in the last publish step, claim the page there', fresh: true,
    init: s => { s.profile = JSON.parse(JSON.stringify(s.draft)); s.publishAs = 'team'; },
    steps: ['editor', 'share', 'mask', 'details', 'team-claim', 'live', 'gallery', 'template', 'company'] },
  { id: 'f', label: 'Free user', group: 'refer', hint: 'Free user invites a friend. Both get 200 credits', fresh: true, plan: 'free',
    steps: ['dashboard', 'refer', 'ref-login', 'ref-setup', 'ref-home', 'refer-joined'] },
  { id: 'p', label: 'Pro user', group: 'refer', hint: 'Pro user invites a friend. Earns 10% cash when they upgrade', fresh: true, plan: 'pro',
    steps: ['dashboard', 'refer', 'ref-login', 'ref-setup', 'ref-home', 'ref-upgrade', 'refer-paid', 'redeem'] },
];
const LABEL = Object.fromEntries(ROUTES.flatMap(g => g[1]));
LABEL.community = 'Community page'; LABEL['my-page'] = 'Your page';
function currentJourney() {
  const j = JOURNEYS.find(x => x.id === S.journey);
  if (j && j.steps.includes(ROUTE) && (!j.plan || j.plan === S.plan)) return j;
  const found = JOURNEYS.find(x => x.steps.includes(ROUTE) && (!x.plan || x.plan === S.plan)) || JOURNEYS.find(x => x.steps.includes(ROUTE)) || JOURNEYS[0];
  S.journey = found.id; save();
  return found;
}
function renderFlow() {
  const min = $('#flow').classList.contains('min');
  const j = currentJourney();
  const i = Math.max(0, j.steps.indexOf(ROUTE));
  $('#flow').innerHTML = `
    <span class="grip" id="flow-grip" title="Drag to move. Double-click to reset."><i class="ph ph-dots-six-vertical"></i></span>
    <button class="tog" title="${min ? 'Show' : 'Hide'} flow bar" id="flow-tog"><i class="ph ${min ? 'ph-path' : 'ph-caret-left'}"></i>${min ? 'Flow' : ''}</button>
    ${(REFER_ONLY ? [['Refer & earn', 'refer']] : COMMUNITY_ONLY ? [['Your page', 'me'], ['Team page', 'team'], ['Visitor', 'other']] : [['Your page', 'me'], ['Team page', 'team'], ['More', 'other'], ['Refer a friend', 'refer']]).map(([g, k]) => [g, JOURNEYS.filter(x => x.group === k && !(COMMUNITY_ONLY && x.id === 'r'))]).map(([g, list]) => `
    <span class="jg">${g}</span><div class="jr">${list.map(x => `<button class="${x.id === j.id ? 'on' : ''}" data-j="${x.id}" title="${x.hint}">${x.label}</button>`).join('')}</div>`).join('')}
    ${j.steps.length > 1 ? `
    <div class="stepper">
      <button class="arr" id="fl-prev" ${i === 0 ? 'disabled' : ''} aria-label="Previous step"><i class="ph ph-caret-left"></i></button>
      <span class="now"><span class="ct">${i + 1}/${j.steps.length}</span>${LABEL[ROUTE] || ''}</span>
      <button class="arr" id="fl-next" ${i === j.steps.length - 1 ? 'disabled' : ''} aria-label="Next step"><i class="ph ph-caret-right"></i></button>
      <span class="dots">${j.steps.map((k, n) => `<button class="${n === i ? 'on' : n < i ? 'past' : ''}" data-step="${k}" title="${n + 1}. ${LABEL[k]}"></button>`).join('')}</span>
    </div>` : ''}`;
  const step = k => { if (k === 'creator' && !S.viewCreator) S.viewCreator = 'dana'; if (k === 'profile') S.visitorView = false; if (k === 'company') S.coVisitor = false; if (k === 'template') S.viewTpl = 'mine';
    if (k === 'gallery') { S.gCat = 'All'; S.gQ = ''; if (!S.published) { if (!S.profile) S.profile = JSON.parse(JSON.stringify(S.draft)); S.published = true; S.publishedAt = Date.now(); } } if (k === 'rewards' && !S.published) S.later = true; go(k); };
  $$('[data-j]').forEach(b => b.onclick = () => {
    const x = JOURNEYS.find(y => y.id === b.dataset.j);
    if (x.fresh) { S = DEFAULT_STATE(); }
    if (x.plan) S.plan = x.plan;
    if (x.init) x.init(S);
    S.journey = x.id; save();
    step(x.steps[0]);
    toast(x.hint, 'ph ph-path');
  });
  $$('[data-step]').forEach(b => b.onclick = () => step(b.dataset.step));
  $('#fl-prev') && ($('#fl-prev').onclick = () => step(j.steps[i - 1]));
  $('#fl-next') && ($('#fl-next').onclick = () => step(j.steps[i + 1]));
  $('#flow-tog').onclick = () => { $('#flow').classList.toggle('min'); renderFlow(); };
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go]');
  if (!el) return;
  e.preventDefault();
  const r = el.dataset.go;
  if (r === 'profile') S.visitorView = el.hasAttribute('data-visitor');
  if (r === 'template') { S.viewTpl = el.dataset.tpl || 'mine'; S.tplSlide = 0; }
  if (r === 'gallery') { S.gCat = el.dataset.gcat || 'All'; S.gQ = ''; }
  if (r === 'company') S.coVisitor = S.journey === 'v';
  if (r === 'creator' && el.dataset.cr) S.viewCreator = el.dataset.cr;
  if (r === 'manage' && ROUTE !== 'manage') S._mgFrom = ROUTE;
  go(r);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#notifs')) closeNotifs();
  else if ($('#modal-root').innerHTML) $('.x-out')?.click();
  else $('#credits')?.remove();
});

(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.has('reset')) { S = DEFAULT_STATE(); save(); }
  S.tpl.cat = S.tpl.cat || 'Reports';
  if (q.get('s') === 'template') S.viewTpl = 'mine';
  // ?j=<journey id> opens that flow at its first step (links for review)
  const jj = JOURNEYS.find(x => x.id === q.get('j'));
  if (jj) { if (jj.plan) S.plan = jj.plan; if (jj.init) jj.init(S); S.journey = jj.id; save(); go(q.get('s') || jj.steps[0]); return; }
  if (q.get('plan') === 'pro' || q.get('plan') === 'free') { S.plan = q.get('plan'); S.journey = S.plan === 'pro' ? 'p' : 'f'; save(); }
  if (REFER_ONLY && !JOURNEYS.find(x => x.id === S.journey && x.group === 'refer')) { S.journey = S.plan === 'pro' ? 'p' : 'f'; save(); }
  if (COMMUNITY_ONLY && !JOURNEYS.find(x => x.id === S.journey && x.group !== 'refer' && x.id !== 'r')) { S.journey = 'a'; save(); }
  go(q.get('s') || 'dashboard');
})();
</script>
