<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upload modal · v2 · DS elements</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../../../../design-system/pai.css" />
<style>
  :root{
    /* dashboard card tokens (key-screens/dashboard.html) */
    --surface:#ffffff; --fg:#171717; --fg-2:#525252; --fg-3:#a3a3a3;
    --d2:rgba(11,15,20,0.09); --inner:rgba(255,255,255,0.8);
    --ease:cubic-bezier(0.23,1,0.32,1);
    --sh-card:0 1px 2px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
    --sh-card-hover:0 8px 24px -6px var(--d2), 0 2px 6px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
    --navy:#0A1925;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.5;
    min-height:100vh;background:radial-gradient(120% 120% at 50% 0%,#20364d 0%,#0A1925 60%);
    display:grid;place-items:center;padding:24px}
  button{font-family:inherit}

  .modal-shell{position:relative;width:min(640px,calc(100vw - 32px));animation:pop .5s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 24px 48px rgba(0,0,0,.4))}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .modal-close{position:absolute;top:0;right:-52px;width:36px;height:36px;border-radius:999px;border:1px solid var(--d2);background:#fff;color:var(--fg);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(10,25,37,.14)}
  .modal-close:hover{background:#f5f5f5}
  @media (max-width:740px){.modal-close{top:-48px;right:0}}
  .panel{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(10,25,37,.28);padding:clamp(24px,3vw,34px);max-height:92vh;overflow:auto}

  .p-h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--navy);line-height:1.2}
  .p-sub{margin-top:5px;font-size:13.5px;color:var(--fg-2)}

  .strip-wrap{margin-top:22px}
  .tab-count{margin-left:6px;font-size:10.5px;font-weight:600;background:rgba(11,15,20,0.08);color:var(--fg-2);border-radius:999px;padding:1px 7px;line-height:16px}
  .tab-item-selected .tab-count{background:var(--fg);color:#fff}

  .panes>div{display:none;margin-top:18px}
  .panes>div.active{display:block}

  /* upload pane */
  .dropzone{border:1.5px dashed rgba(26,26,26,.20);border-radius:12px;padding:30px 20px;text-align:center;background:#fafafa;transition:.15s ease}
  .dropzone:hover{border-color:var(--navy);background:#f2f5f9}
  .dz-icon{width:48px;height:48px;border-radius:999px;background:#fff;border:1px solid var(--d2);display:grid;place-items:center;margin:0 auto 10px;color:var(--navy)}
  .dz-icon i{font-size:22px}
  .dz-ttl{font-size:15px;font-weight:700}
  .dz-sub{font-size:12.5px;color:var(--fg-2);margin:2px 0 13px}
  .dz-fmt{margin-top:12px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-3)}

  .hint{font-size:12px;color:var(--fg-3);margin-top:8px}

  /* presentations pane — card anatomy from the dashboard key screen */
  .lib-search{margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-height:340px;overflow:auto;padding:2px 4px 6px 2px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .card{position:relative;background:var(--surface);border-radius:6px;overflow:hidden;box-shadow:var(--sh-card);cursor:pointer;
    transition:box-shadow 220ms var(--ease),transform 160ms var(--ease);border:0;text-align:left;padding:0}
  .card:hover{box-shadow:var(--sh-card-hover);transform:translateY(-2px)}
  .card.sel{box-shadow:0 0 0 2px var(--navy), var(--sh-card)}
  .card-body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px}
  .card-title{font-size:14px;font-weight:500;color:var(--fg);line-height:1.43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:12px;color:var(--fg-2);line-height:1.33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:999px;background:var(--navy);color:#fff;display:none;place-items:center;font-size:13px;z-index:1}
  .card.sel .card-check{display:grid}

  /* deck covers — mock slides, same treatment as the dashboard key screen */
  .cover{position:relative;aspect-ratio:366/202;overflow:hidden;padding:14px;display:flex;flex-direction:column}
  .cover>*{position:relative;z-index:1}
  .cover .eyebrow{font-size:7px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
  .cover .head{font-weight:700;line-height:1.16}
  .cv1{background:linear-gradient(135deg,#0a1c38,#0e2a52);color:#fff;justify-content:flex-end}
  .cv1 .eyebrow{position:absolute;top:14px;left:14px;color:rgba(255,255,255,.5)}
  .cv1 .head{font-family:"Hedvig Letters Serif",Georgia,serif;font-weight:400;font-size:14px;width:78%}
  .cv1 .rule{position:absolute;top:13px;right:14px;width:38px;height:4px;border-radius:2px;background:#ff5a3c}
  .cv2{background:#fbf3e3;color:#2a1d0c}
  .cv2 .eyebrow{color:#b4791b}
  .cv2 .head{font-size:12px;width:84%;margin-top:5px}
  .cv2 .bars{position:absolute;left:14px;right:14px;bottom:12px;height:40%;display:flex;align-items:flex-end;gap:5px}
  .cv2 .bars i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(#f1ad3c,#d97b12)}
  .cv2 .bars i:nth-child(1){height:38%}.cv2 .bars i:nth-child(2){height:62%}.cv2 .bars i:nth-child(3){height:48%}
  .cv2 .bars i:nth-child(4){height:84%}.cv2 .bars i:nth-child(5){height:70%}.cv2 .bars i:nth-child(6){height:100%}
  .cv3{background:linear-gradient(120deg,#7c3aed,#2563eb);color:#fff;justify-content:center}
  .cv3 .eyebrow{position:absolute;top:14px;left:14px;color:rgba(255,255,255,.7)}
  .cv3 .head{font-size:17px;font-weight:800;letter-spacing:-.4px;width:86%}
  .cv3 .orb{position:absolute;right:-24px;top:-24px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 32% 32%,rgba(255,255,255,.4),transparent 62%);z-index:0}
  .cv4{background:#f6f6f4;color:#111}
  .cv4 .eyebrow{color:#9a9a96}
  .cv4 .head{font-size:14px;font-weight:700;width:82%;margin-top:auto;letter-spacing:-.2px}
  .cv4 .tick{position:absolute;top:14px;right:14px;width:16px;height:16px;border-radius:50%;border:2px solid #111}
  .cv5{background:linear-gradient(160deg,#0f3d2e,#14543c);color:#fff;justify-content:flex-end}
  .cv5 .eyebrow{position:absolute;top:14px;left:14px;color:rgba(255,255,255,.55)}
  .cv5 .head{font-size:13px;font-weight:700;width:68%}
  .cv5 .donut{position:absolute;top:18px;right:15px;width:48px;height:48px;border-radius:50%;
    background:conic-gradient(#7fe7b0 0 64%,rgba(255,255,255,.18) 64% 100%);
    -webkit-mask:radial-gradient(closest-side,transparent 58%,#000 60%);
    mask:radial-gradient(closest-side,transparent 58%,#000 60%)}
  .cv6{background:#111114;color:#fff;justify-content:flex-end}
  .cv6::before{content:"";position:absolute;inset:0;z-index:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px),
               repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px)}
  .cv6 .eyebrow{position:absolute;top:14px;left:14px;color:rgba(255,255,255,.5)}
  .cv6 .head{font-size:15px;font-weight:800;letter-spacing:-.4px;width:84%}
  .cv6 .dot{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}

  /* text fields: stock design-system inputs (component gallery look) */
  .panel .pai-input:hover:not(:focus):not(:disabled),
  .panel .pai-textarea:hover:not(:focus):not(:disabled){box-shadow:var(--shadow-elevation-input-hover)}

  /* message */
  .msg-lbl{margin:22px 0 10px;display:flex;align-items:center;gap:7px;color:var(--fg-3)}
  .msg-lbl i{font-size:14px;color:var(--navy)}
  .msg-lbl .opt{font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg-3)}

  .cta{width:100%;margin-top:24px}
  .cta i{margin-left:8px;transition:transform .2s ease}
  .cta:hover i{transform:translateX(3px)}
</style>
</head>
<body>
  <div class="modal-shell">
    <button class="modal-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="panel">
      <h1 class="p-h1">Upload your deck</h1>
      <p class="p-sub">An expert designs every slide, start to finish.</p>

      <div class="strip-wrap">
        <div class="tabs-strip tabs-strip-medium tabs-track" id="strip">
          <button class="tab-item tab-item-medium tab-item-selected"><span class="tab-item-label" data-label="Upload a file">Upload a file</span></button>
          <button class="tab-item tab-item-medium"><span class="tab-item-label" data-label="Paste a link">Paste a link</span></button>
          <button class="tab-item tab-item-medium"><span class="tab-item-label" data-label="Your presentations">Your presentations</span><span class="tab-count">12</span></button>
          <span class="tabs-indicator tabs-indicator-glide"></span>
        </div>
      </div>

      <div class="panes" id="panes">
        <div class="active">
          <div class="dropzone">
            <div class="dz-icon"><i class="ph-bold ph-upload-simple"></i></div>
            <div class="dz-ttl">Drag &amp; drop your deck</div>
            <div class="dz-sub">or</div>
            <button class="button-style button-medium button-primary"><i class="ph-bold ph-folder-open"></i><span class="button-label">Choose a file</span></button>
            <div class="dz-fmt">.PPTX · .PDF · .KEY · .ZIP · one file</div>
          </div>
        </div>
        <div>
          <input class="pai-input pai-input--lg" type="url" placeholder="Google Slides, Notion, Figma, or Canva link..." />
          <p class="hint">Make sure the link is viewable by anyone with it.</p>
        </div>
        <div>
          <div class="lib-search"><input class="pai-input" type="search" placeholder="Search your presentations..." /></div>
          <div class="grid" id="grid">
            <button class="card">
              <div class="cover cv1"><span class="eyebrow">Strategic alignment</span><span class="rule"></span><div class="head">Alignment on a High-Growth 2026 Future</div></div>
              <div class="card-body"><div class="card-title">Cognizant Q4 Board Update and 2026 Strategic Priorities</div><div class="card-sub">In Created by me • Updated 8 days ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
            <button class="card">
              <div class="cover cv6"><span class="eyebrow">Monthly review</span><span class="dot"></span><div class="head">Coco Cola Monthly Management Meeting</div></div>
              <div class="card-body"><div class="card-title">Coco Cola Monthly Management Meeting</div><div class="card-sub">In Designer • Updated 2 years ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
            <button class="card">
              <div class="cover cv3"><span class="eyebrow">Pitch</span><span class="orb"></span><div class="head">Investor Pitch Deck for Pfizer</div></div>
              <div class="card-body"><div class="card-title">Investor Pitch Deck for Pfizer</div><div class="card-sub">In Created by me • Updated 1 year ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
            <button class="card">
              <div class="cover cv2"><span class="eyebrow">Q4 performance</span><div class="head">McLaren Group Q4 Review and 2026 Strategic Priorities</div><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
              <div class="card-body"><div class="card-title">McLaren Group Q4 Review and 2026 Strategic Priorities</div><div class="card-sub">In Created by me • Updated 1 month ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
            <button class="card">
              <div class="cover cv5"><span class="eyebrow">Marketing</span><span class="donut"></span><div class="head">Customer Reviews in Marketing</div></div>
              <div class="card-body"><div class="card-title">Customer Reviews in Marketing</div><div class="card-sub">In Issues Audit Files • Updated 1 year ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
            <button class="card">
              <div class="cover cv4"><span class="eyebrow">Digital strategy</span><span class="tick"></span><div class="head">McLaren Digital Strategy &amp; Q4 Performance Update</div></div>
              <div class="card-body"><div class="card-title">McLaren Digital Strategy &amp; Q4 Performance Update</div><div class="card-sub">In Created by me • Updated 2 months ago</div></div>
              <span class="card-check"><i class="ph-bold ph-check"></i></span>
            </button>
          </div>
        </div>
      </div>

      <div class="msg-lbl"><i class="ph-bold ph-chat-teardrop-text"></i><span class="text-overline-small">Message for your designer</span><span class="opt">optional</span></div>
      <textarea class="pai-textarea" placeholder="Goal, audience, anything to keep or avoid..."></textarea>

      <button class="button-style button-large button-primary cta">Proceed to payment <i class="ph-bold ph-arrow-right"></i></button>
    </div>
  </div>

<script>
  /* DS tabs: one bar glides under the selected item (from design-system/components.html) */
  (function(){
    var strip=document.getElementById('strip');
    var bar=strip.querySelector('.tabs-indicator');
    var items=[].slice.call(strip.querySelectorAll('.tab-item'));
    var panes=[].slice.call(document.getElementById('panes').children);
    function move(el){bar.style.width=el.offsetWidth+'px';bar.style.transform='translateX('+el.offsetLeft+'px)';}
    items.forEach(function(el,i){
      el.addEventListener('click',function(){
        items.forEach(function(o){o.classList.remove('tab-item-selected');});
        el.classList.add('tab-item-selected');
        move(el);
        panes.forEach(function(p,j){p.classList.toggle('active',i===j);});
      });
    });
    function init(){move(strip.querySelector('.tab-item-selected')||items[0]);}
    requestAnimationFrame(init);
    window.addEventListener('resize',init);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(init);
  })();

  /* pick one presentation */
  document.querySelectorAll('#grid .card').forEach(function(c){
    c.addEventListener('click',function(){
      var was=c.classList.contains('sel');
      document.querySelectorAll('#grid .card').forEach(function(x){x.classList.remove('sel');});
      if(!was)c.classList.add('sel');
    });
  });
</script>

<script type="importmap">
{ "imports": { "agentation": "https://esm.sh/agentation" } }
</script>
<script type="module">
  import { mountAgentation } from 'agentation';
  mountAgentation();
</script>
</body>
</html>
