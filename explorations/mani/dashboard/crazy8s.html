<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>crazy8s · Get most out of Pro button animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f6f8;
    font-family: "Inter", system-ui, sans-serif; color: #171717;
  }
  .round-head { max-width: 720px; margin: 48px auto 8px; padding: 0 24px; }
  .round-head h1 { font: 600 18px/1.3 "Inter", sans-serif; margin: 0 0 4px; }
  .round-head p { font: 400 13px/1.5 "Inter", sans-serif; color: #737373; margin: 0; }
  section {
    max-width: 720px; margin: 0 auto; padding: 56px 24px;
    border-bottom: 1px solid rgba(11,15,20,0.06);
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .tag { align-self: flex-start; font: 600 12px/1 "Inter", sans-serif; color: #737373; letter-spacing: 0.04em; }

  /* ── shared button (identical in every variant) ─────────────────────── */
  .wrap { position: relative; display: inline-flex; }
  .pro-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 14px 0 16px;
    border: 1px solid rgba(11,15,20,0.10);
    border-radius: 16px;
    background: linear-gradient(90deg, #d7e3fd 0%, #e8effe 55%, #fbfcfe 100%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 1px 3px rgba(11,15,20,0.06);
    font: 500 16px/1 "Inter", sans-serif; color: #171717;
    cursor: pointer;
  }
  .rocket { font-size: 18px; line-height: 1; }
  .divider { width: 1px; height: 22px; background: rgba(11,15,20,0.14); }
  .pro-btn i { font-size: 18px; color: #171717; }

  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --a: 360deg; } }

  .ring::before, .ring2::after {
    content: ''; position: absolute; inset: -2px; border-radius: 18px;
    padding: 2px; pointer-events: none;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  /* 01 · Comet tail — the round 1 pick, unchanged */
  .v1.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 250deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.55) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: spin 3s linear infinite;
  }

  /* 02 · Twin comets — two heads chasing each other half a lap apart */
  .v2.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, rgba(0,94,255,0.0) 80deg, rgba(0,94,255,0.5) 140deg,
      #005EFF 172deg, #E6EFFF 180deg, transparent 181deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.5) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: spin 3s linear infinite;
  }

  /* 03 · Silk tail — thinner line, tail stretches half the lap, slower */
  .v3.ring::before {
    padding: 1.5px;
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 170deg,
      rgba(0,94,255,0.0) 180deg, rgba(0,94,255,0.25) 260deg,
      rgba(0,94,255,0.6) 330deg, #005EFF 354deg, #E6EFFF 360deg);
    animation: spin 4.6s linear infinite;
  }

  /* 04 · Particle comet — star head with glow dots trailing on the path */
  .v4 .p {
    position: absolute; top: 0; left: 0;
    offset-path: border-box; offset-rotate: 0deg;
    animation: lap 3s linear infinite;
  }
  .v4 .head {
    font-size: 13px; line-height: 1; color: #005EFF;
    text-shadow: 0 0 7px rgba(0,94,255,0.9), 0 0 12px rgba(230,239,255,0.9);
  }
  .v4 .dot {
    width: 5px; height: 5px; border-radius: 999px; background: #4a86f7;
    box-shadow: 0 0 6px 1px rgba(0,94,255,0.5);
  }
  .v4 .d1 { animation-delay: -0.10s; opacity: 0.7; scale: 0.9; }
  .v4 .d2 { animation-delay: -0.20s; opacity: 0.45; scale: 0.7; }
  .v4 .d3 { animation-delay: -0.30s; opacity: 0.25; scale: 0.5; }
  @keyframes lap { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  /* 05 · Pulse lap — one quick lap, a beat of rest, then again */
  .v5.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 250deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.55) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: pulse-lap 3.4s cubic-bezier(0.6, 0, 0.3, 1) infinite;
  }
  @keyframes pulse-lap {
    0%        { --a: 0deg;   opacity: 0; }
    6%        { opacity: 1; }
    52%       { --a: 360deg; opacity: 1; }
    58%, 100% { --a: 360deg; opacity: 0; }
  }

  /* 06 · Beam glow — thicker luminous band with soft outer bloom */
  .v6.ring::before {
    inset: -3px; border-radius: 19px; padding: 3px;
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 240deg,
      rgba(0,94,255,0.0) 250deg, rgba(0,94,255,0.5) 315deg,
      #005EFF 350deg, #E6EFFF 360deg);
    filter: drop-shadow(0 0 6px rgba(0,94,255,0.55));
    animation: spin 3s linear infinite;
  }

  /* 07 · Counter orbit — main comet plus a fainter one circling opposite */
  .v7.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 250deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.55) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: spin 3s linear infinite;
  }
  .v7.ring2::after {
    padding: 1.5px;
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 265deg,
      rgba(0,94,255,0.0) 275deg, rgba(0,94,255,0.35) 330deg,
      rgba(74,134,247,0.7) 360deg);
    animation: spin 4.2s linear infinite reverse;
  }

  /* 08 · Ember trail — comet sheds tiny sparks that fade behind it */
  .v8.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 250deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.55) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: spin 3s linear infinite;
  }
  .v8 .ember {
    position: absolute; top: 0; left: 0; width: 4px; height: 4px;
    border-radius: 999px; background: #4a86f7;
    box-shadow: 0 0 5px 1px rgba(0,94,255,0.5);
    offset-path: border-box; offset-rotate: 0deg;
    animation: lap 3s linear infinite, ember-fade 3s linear infinite;
  }
  .v8 .e1 { animation-delay: -0.16s; }
  .v8 .e2 { animation-delay: -0.30s; }
  @keyframes ember-fade {
    0%, 100% { opacity: 0.7; scale: 1; }
    50%      { opacity: 0.25; scale: 0.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring::before, .ring2::after, .v4 .p, .v8 .ember { animation: none; }
  }
</style>
</head>
<body>

<div class="round-head">
  <h1>Round 2 &middot; comet tail family</h1>
  <p>Variant 1 is the round 1 pick. 2 to 8 riff on the same orbiting-light style, all Brand Blue.</p>
</div>

<section>
  <span class="tag">01 &middot; Comet tail (pick)</span>
  <div class="wrap ring v1">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">02 &middot; Twin comets</span>
  <div class="wrap ring v2">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">03 &middot; Silk tail</span>
  <div class="wrap ring v3">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">04 &middot; Particle comet</span>
  <div class="wrap v4">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <span class="p head">&#10022;</span>
    <span class="p dot d1"></span><span class="p dot d2"></span><span class="p dot d3"></span>
  </div>
</section>

<section>
  <span class="tag">05 &middot; Pulse lap</span>
  <div class="wrap ring v5">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">06 &middot; Beam glow</span>
  <div class="wrap ring v6">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">07 &middot; Counter orbit</span>
  <div class="wrap ring ring2 v7">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">08 &middot; Ember trail</span>
  <div class="wrap ring v8">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <span class="ember e1"></span><span class="ember e2"></span>
  </div>
</section>

</body>
</html>
