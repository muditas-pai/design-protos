<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>crazy8s · Get most out of Pro button animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f6f8;
    font-family: "Inter", system-ui, sans-serif; color: #171717;
  }
  .round-head {
    max-width: 720px; margin: 48px auto 8px; padding: 0 24px;
  }
  .round-head h1 { font: 600 18px/1.3 "Inter", sans-serif; margin: 0 0 4px; }
  .round-head p { font: 400 13px/1.5 "Inter", sans-serif; color: #737373; margin: 0; }
  section {
    max-width: 720px; margin: 0 auto; padding: 56px 24px;
    border-bottom: 1px solid rgba(11,15,20,0.06);
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .tag { align-self: flex-start; font: 600 12px/1 "Inter", sans-serif; color: #737373; letter-spacing: 0.04em; }

  /* ── shared button (identical in every variant) ─────────────────────── */
  .wrap { position: relative; display: inline-flex; }
  .pro-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 14px 0 16px;
    border: 1px solid rgba(11,15,20,0.10);
    border-radius: 16px;
    background: linear-gradient(90deg, #d7e3fd 0%, #e8effe 55%, #fbfcfe 100%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 1px 3px rgba(11,15,20,0.06);
    font: 500 16px/1 "Inter", sans-serif; color: #171717;
    cursor: pointer;
  }
  .rocket { font-size: 18px; line-height: 1; }
  .divider { width: 1px; height: 22px; background: rgba(11,15,20,0.14); }
  .pro-btn i { font-size: 18px; color: #171717; }

  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --a: 360deg; } }

  /* ring helper: paints only a thin band around the button edge */
  .ring::before {
    content: ''; position: absolute; inset: -2px; border-radius: 18px;
    padding: 2px; pointer-events: none;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  /* 01 · Comet tail — bright head, long fading tail, smooth orbit */
  .v1.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 250deg,
      rgba(0,94,255,0.0) 260deg, rgba(0,94,255,0.55) 320deg,
      #005EFF 352deg, #E6EFFF 360deg);
    animation: spin 3s linear infinite;
  }

  /* 02 · Twinkle relay — three fixed stars sparkle in sequence, no travel */
  .v2 .tw {
    position: absolute; font-size: 12px; color: #005EFF; line-height: 1;
    text-shadow: 0 0 6px rgba(0,94,255,0.8);
    opacity: 0; scale: 0.4;
    animation: tw 2.4s ease-in-out infinite;
  }
  .v2 .tw1 { top: -7px; left: 14%; }
  .v2 .tw2 { top: -8px; right: 22%; animation-delay: 0.8s; }
  .v2 .tw3 { bottom: -8px; left: 55%; animation-delay: 1.6s; }
  @keyframes tw {
    0%, 28%, 100% { opacity: 0; scale: 0.4; rotate: 0deg; }
    10%           { opacity: 1; scale: 1.2; rotate: 40deg; }
    20%           { opacity: 0.6; scale: 0.9; rotate: 70deg; }
  }

  /* 03 · Shooting star — glyph bursts round the line, rests, goes again */
  .v3 .shoot {
    position: absolute; top: 0; left: 0; font-size: 13px; line-height: 1;
    color: #005EFF; text-shadow: 0 0 7px rgba(0,94,255,0.9);
    offset-path: border-box; offset-rotate: 0deg;
    animation: shoot 3.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes shoot {
    0%       { offset-distance: 0%; opacity: 0; }
    6%       { opacity: 1; }
    58%      { offset-distance: 100%; opacity: 1; }
    64%, 100%{ offset-distance: 100%; opacity: 0; }
  }

  /* 04 · Silk shimmer — soft white light sweeps the edge, no glyph */
  .v4.ring::before {
    background: conic-gradient(from var(--a),
      transparent 0deg, transparent 290deg,
      rgba(255,255,255,0.9) 325deg, transparent 360deg);
    animation: spin 2.6s linear infinite;
    padding: 1.5px;
  }

  /* 05 · Corner pops — four-point sparks pop at the corners in turn */
  .v5 .pop {
    position: absolute; width: 14px; height: 14px; pointer-events: none;
    opacity: 0; animation: pop 3.2s ease-in-out infinite;
  }
  .v5 .pop::before {
    content: '\2726'; position: absolute; inset: 0;
    font-size: 14px; line-height: 1; color: #005EFF;
    text-shadow: 0 0 8px rgba(0,94,255,0.9);
  }
  .v5 .p1 { top: -8px; left: -6px; }
  .v5 .p2 { top: -8px; right: -6px; animation-delay: 0.8s; }
  .v5 .p3 { bottom: -8px; right: -6px; animation-delay: 1.6s; }
  .v5 .p4 { bottom: -8px; left: -6px; animation-delay: 2.4s; }
  @keyframes pop {
    0%, 20%, 100% { opacity: 0; scale: 0.3; rotate: 0deg; }
    8%            { opacity: 1; scale: 1.15; rotate: 25deg; }
    14%           { opacity: 0.4; scale: 0.8; rotate: 45deg; }
  }

  /* 06 · Dash chase — crisp golden dash runs the outline (SVG stroke) */
  .v6 svg { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); pointer-events: none; }
  .v6 rect {
    fill: none; stroke: url(#dashGrad); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 14 86; stroke-dashoffset: 0;
    animation: chase 2.8s linear infinite;
  }
  @keyframes chase { to { stroke-dashoffset: -100; } }

  /* 07 · Halo breath — the outline itself breathes a warm glow, no travel */
  .v7 .pro-btn { animation: halo 2.4s ease-in-out infinite; }
  @keyframes halo {
    0%, 100% { box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 1px 3px rgba(11,15,20,0.06),
                           0 0 0 0 rgba(0,94,255,0); }
    50%      { box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 1px 3px rgba(11,15,20,0.06),
                           0 0 18px 2px rgba(0,94,255,0.45); }
  }

  /* 08 · Aurora line — brand blue-violet gradient flows along the border */
  .v8.ring::before {
    background: conic-gradient(from var(--a),
      #005EFF 0deg, #0043B8 130deg, #0055ED 230deg, #005EFF 360deg);
    animation: spin 4s linear infinite;
    padding: 1.5px; opacity: 0.85;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring::before, .tw, .shoot, .pop, .v6 rect, .v7 .pro-btn { animation: none; }
  }
</style>
</head>
<body>

<div class="round-head">
  <h1>Round 1 &middot; Get most out of Pro &middot; outline animation</h1>
  <p>Button identical in all 8. Only the star / outline treatment varies.</p>
</div>

<svg width="0" height="0" aria-hidden="true">
  <defs>
    <linearGradient id="dashGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005EFF" />
      <stop offset="1" stop-color="#0043B8" />
    </linearGradient>
  </defs>
</svg>

<section>
  <span class="tag">01 &middot; Comet tail</span>
  <div class="wrap ring v1">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">02 &middot; Twinkle relay</span>
  <div class="wrap v2">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <span class="tw tw1">&#10022;</span><span class="tw tw2">&#10022;</span><span class="tw tw3">&#10022;</span>
  </div>
</section>

<section>
  <span class="tag">03 &middot; Shooting star</span>
  <div class="wrap v3">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <span class="shoot">&#10022;</span>
  </div>
</section>

<section>
  <span class="tag">04 &middot; Silk shimmer</span>
  <div class="wrap ring v4">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">05 &middot; Corner pops</span>
  <div class="wrap v5">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <span class="pop p1"></span><span class="pop p2"></span><span class="pop p3"></span><span class="pop p4"></span>
  </div>
</section>

<section>
  <span class="tag">06 &middot; Dash chase</span>
  <div class="wrap v6">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
    <svg><rect x="1" y="1" width="calc(100% - 2px)" height="calc(100% - 2px)" rx="17" pathLength="100" /></svg>
  </div>
</section>

<section>
  <span class="tag">07 &middot; Halo breath</span>
  <div class="wrap v7">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

<section>
  <span class="tag">08 &middot; Aurora line</span>
  <div class="wrap ring v8">
    <button class="pro-btn" type="button"><span class="rocket">&#128640;</span>Get most out of Pro<span class="divider"></span><i class="ph ph-caret-down"></i></button>
  </div>
</section>

</body>
</html>
