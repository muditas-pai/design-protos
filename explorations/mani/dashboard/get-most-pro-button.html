<!doctype html>
<html lang="en" data-offer-theme="v3">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get most out of Pro · button · mani</title>
<!-- Standalone button proto. Design from AMJ-26 Handoff node 2837-1490
     (rebuilt from screenshot reference: Figma MCP seat limit was hit),
     plus a star that travels the button's outer line. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center;
    background: #f5f6f8; font-family: "Inter", system-ui, sans-serif;
  }

  .pro-btn-wrap { position: relative; display: inline-flex; }

  .pro-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 14px 0 16px;
    border: 1px solid rgba(11,15,20,0.10);
    border-radius: 16px;
    background: linear-gradient(90deg, #d7e3fd 0%, #e8effe 55%, #fbfcfe 100%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 1px 3px rgba(11,15,20,0.06);
    font: 500 16px/1 "Inter", sans-serif; color: #171717;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 160ms ease;
  }
  .pro-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.65), 0 6px 16px -6px rgba(11,15,20,0.25);
  }
  .pro-btn:active { transform: translateY(0) scale(0.985); }

  .rocket { font-size: 18px; line-height: 1; }
  .divider { width: 1px; height: 22px; background: rgba(11,15,20,0.14); }
  .pro-btn i { font-size: 18px; color: #171717; }

  /* ── star on the outer line ────────────────────────────────────────────
     Sparks ride the button's border with an offset-path motion path, so
     the loop follows the rounded corners exactly. The glyph twinkles as
     it travels and pulls a couple of soft glow dots behind it. */
  .orbit {
    position: absolute; inset: -1px; border-radius: 16px;
    pointer-events: none;
  }
  .spark {
    position: absolute; top: 0; left: 0;
    offset-path: border-box; offset-rotate: 0deg;
    animation: orbit 3.2s linear infinite;
  }
  .star {
    font-size: 13px; line-height: 1; color: #ffb928;
    text-shadow: 0 0 6px rgba(255,185,40,0.9), 0 0 14px rgba(255,255,255,0.9);
    animation: orbit 3.2s linear infinite, twinkle 0.8s ease-in-out infinite;
  }
  .trail {
    width: 5px; height: 5px; border-radius: 999px;
    background: #ffd469;
    box-shadow: 0 0 6px 2px rgba(255,196,64,0.55);
  }
  .t1 { animation-delay: -0.12s; opacity: 0.65; transform: scale(0.8); }
  .t2 { animation-delay: -0.24s; opacity: 0.35; transform: scale(0.55); }
  @keyframes orbit {
    from { offset-distance: 0%; }
    to   { offset-distance: 100%; }
  }
  @keyframes twinkle {
    0%, 100% { scale: 1; }
    50%      { scale: 1.45; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spark { animation: none; display: none; }
  }
</style>
</head>
<body>

<div class="pro-btn-wrap">
  <button class="pro-btn" type="button">
    <span class="rocket" aria-hidden="true">&#128640;</span>
    Get most out of Pro
    <span class="divider" aria-hidden="true"></span>
    <i class="ph ph-caret-down" aria-hidden="true"></i>
  </button>
  <span class="orbit" aria-hidden="true">
    <span class="spark star">&#10022;</span>
    <span class="spark trail t1"></span>
    <span class="spark trail t2"></span>
  </span>
</div>

</body>
</html>
