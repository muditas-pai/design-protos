<style>
  :root { --bg: #f4f4f4; --dot: #cfcfcf; --ink: #1f1f1f; --line: #6e6e6e; }

  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  header { max-width: 1240px; margin: 0 auto; padding: 36px 16px 8px; }
  h1 { font-size: 28px; margin: 0 0 6px; font-weight: 800; }
  .sub { color: #555; font-size: 14px; margin: 0 0 14px; }
  .back { display: inline-block; font: 600 13px Inter; color: var(--ink); text-decoration: none; background: #fff; border: 1.5px solid #ccc; border-radius: 999px; padding: 6px 12px; margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin: 12px 0 0; }

  .sw { width: 16px; height: 12px; border-radius: 3px; border: 2px solid; display: inline-block; }
  nav.toc { max-width: 1240px; margin: 14px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav.toc a { font: 600 12px Inter; color: var(--ink); background: #fff; border: 1px solid #ddd; border-radius: 999px; padding: 5px 10px; text-decoration: none; }
  nav.toc a.hot { border-color: #dc2626; color: #b91c1c; }
  main { max-width: 1240px; margin: 0 auto; padding: 10px 16px 90px; }
  .flow { margin-top: 30px; background: #fff; border: 1px solid #e3e3e3; border-radius: 14px; overflow: hidden; }
  .fhead { padding: 16px 20px 10px; border-bottom: 1px solid #eee; }
  .fhead h2 { margin: 0; font-size: 18px; }
  .fhead h2 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; margin-right: 8px; vertical-align: 1px; }
  .fhead p { margin: 6px 0 0; color: #555; font-size: 13px; }
  .scroll { overflow-x: auto; }
  .canvas { position: relative; padding: 28px 24px 30px; min-width: 900px;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 22px 22px; }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .g { display: grid; gap: 34px 54px; align-items: center; justify-items: center; }
  .nd { position: relative; z-index: 1; border: 2.5px solid var(--line); background: #fff; border-radius: 6px; padding: 9px 11px; font-size: 13px; line-height: 1.35; text-align: center; width: 190px; }
  .nd.start { background: #111; color: #fff; border-color: #111; border-radius: 999px; font-weight: 600; }
  .nd.ok { background: #d3f2d0; border-color: #7dd87a; }
  .nd.no { background: #fde2e2; border-color: #ef8f8f; }
  .nd.warn { background: #fff3a8; border-color: #e2c73a; }
  .nd.info { background: #cfe3fb; border-color: #5aa5f5; text-align: left; }
  .nd.priv { background: #fbe0c6; border-color: #f5a55a; }
  .dia { position: relative; z-index: 1; width: 128px; height: 128px; display: grid; place-items: center; }
  .dia::before { content: ""; position: absolute; inset: 18px; background: #fff; border: 2.5px solid var(--line); transform: rotate(45deg); border-radius: 5px; }
  .dia span { position: relative; font-size: 12px; font-weight: 700; text-align: center; max-width: 96px; line-height: 1.25; }
  .elabel { font: 700 11px Inter, sans-serif; fill: #333; paint-order: stroke; stroke: #f4f4f4; stroke-width: 4px; }
  .loops { padding: 12px 20px 16px; border-top: 1px solid #eee; display: grid; gap: 8px; }
  .lh { border-radius: 8px; padding: 9px 12px; font-size: 13px; line-height: 1.5; }
  .lh.red { background: #fdeeee; border: 1px solid #f2a7a7; }
  .lh.amb { background: #fff5e6; border: 1px solid #f5c67a; }
  .lh.ok { background: #effbf2; border: 1px solid #b7e4c4; }
  .lh b.t { margin-right: 4px; }
  .lh .fix { display: block; margin-top: 3px; }
  .lh .fix::before { content: "Suggested fix: "; font-weight: 700; }
  .summary { margin-top: 30px; background: #fff; border: 2px solid #111; border-radius: 14px; padding: 16px 20px; }
  .summary h2 { margin: 0 0 8px; font-size: 18px; }
  .summary ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
</style>

<header>
  <a class="back" href="./">← Back to v2 rules</a><a class="back" href="./#kid">🧒 Kid version</a>
  <h1>Sharing flows v2</h1>

  <div class="legend">

</header>
<nav class="toc" id="toc"></nav>
<main id="flows"></main>

<script>
const F = [

  { id:'widget', title:'Widget and export', story:'Mani posts a widget on Twitter. Michael in the USA sees it.', cols:5,
    nodes:[

const main = document.getElementById('flows'), toc = document.getElementById('toc');
const NS = 'http://www.w3.org/2000/svg';
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');

F.forEach((f, i) => {
  const hot = f.loops.some(l => l[0] === 'red');
  toc.insertAdjacentHTML('beforeend', `<a href="#${f.id}" class="${hot ? 'hot' : ''}">${i + 1}. ${f.title}${hot ? ' 🔴' : ''}</a>`);
  const nodes = f.nodes.map(([id, pos, type, text]) => type === 'dia'
    ? `<div class="dia" id="${f.id}-${id}" style="grid-area:${pos}"><span>${esc(text)}</span></div>`
    : `<div class="nd ${type}" id="${f.id}-${id}" style="grid-area:${pos}">${esc(text)}</div>`).join('');
  const loops = f.loops.map(([sev, t, fix]) => {
    const icon = sev === 'red' ? '🔴' : sev === 'amb' ? '🟠' : '🟢';
    const label = sev === 'red' ? 'Loophole:' : sev === 'amb' ? 'Check:' : '';
    return `<div class="lh ${sev}"><b class="t">${icon} ${label}</b>${esc(t)}${fix ? `<span class="fix">${esc(fix)}</span>` : ''}</div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend', `
    <section class="flow" id="${f.id}">
      <div class="fhead"><h2><span class="n">${i + 1}</span>${f.title}</h2><p>${esc(f.story)}</p></div>
      <div class="scroll"><div class="canvas"><svg class="wires"></svg>
        <div class="g" style="grid-template-columns:repeat(${f.cols}, auto)">${nodes}</div>
      </div></div>
      <div class="loops">${loops}</div>
    </section>`);
});

main.insertAdjacentHTML('beforeend', `
  <section class="summary">
    <h2>Loopholes found while drawing: all decided ✅</h2>
    <ol>
      <li>🟢 <b>Widget on someone else's private file</b> (flow 5): by design.</li>
      <li>🟢 <b>Removing people to downgrade</b> (flow 8): by design.</li>
      <li>🟢 <b>Who opens one file to the whole workspace</b> (flow 4): anyone who can edit it.</li>
      <li>🟢 <b>Deleting a folder</b> (flow 7): warn with the count, and alert each creator.</li>
      <li>🟢 <b>Country pricing</b> (flow 5): set by the card's billing country.</li>

      <li>🟢 <b>Deleting the workspace</b> (flow 14): the warning lists the live widgets that will stop.</li>
    </ol>
  </section>`);

function box(canvas, el) {
  const c = canvas.getBoundingClientRect(); let r = el.getBoundingClientRect();
  if (el.classList.contains('dia')) { const k = (128 - 92 * Math.SQRT2) / 2; r = { left: r.left + k, top: r.top + k, right: r.right - k, bottom: r.bottom - k }; }
  return { l: r.left - c.left, t: r.top - c.top, r: r.right - c.left, b: r.bottom - c.top, cx: (r.left + r.right) / 2 - c.left, cy: (r.top + r.bottom) / 2 - c.top };
}
function pts(a, b, t) {
  const g = 8;
  if (t === 'v') { const x1 = a.cx, y1 = a.b, x2 = b.cx, y2 = b.t - g; if (Math.abs(x1 - x2) < 2) return [[x1, y1], [x1, y2]]; const ym = (y1 + y2) / 2; return [[x1, y1], [x1, ym], [x2, ym], [x2, y2]]; }
  if (t === 'h') { const x1 = a.r, y1 = a.cy, x2 = b.l - g, y2 = b.cy; if (Math.abs(y1 - y2) < 2) return [[x1, y1], [x2, y1]]; const xm = (x1 + x2) / 2; return [[x1, y1], [xm, y1], [xm, y2], [x2, y2]]; }
  if (t === 'vl') return [[a.cx, a.b], [a.cx, b.cy], [b.r + g, b.cy]];
  return [[a.cx, a.b], [a.cx, b.cy], [b.l - g, b.cy]];
}
function round(p, rad = 12) {
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const r = Math.min(rad, Math.hypot(x1 - x0, y1 - y0) / 2, Math.hypot(x2 - x1, y2 - y1) / 2);
    d += ` L${x1 - Math.sign(x1 - x0) * r},${y1 - Math.sign(y1 - y0) * r} Q${x1},${y1} ${x1 + Math.sign(x2 - x1) * r},${y1 + Math.sign(y2 - y1) * r}`;
  }
  const l = p[p.length - 1]; return d + ` L${l[0]},${l[1]}`;
}
function draw() {
  F.forEach(f => {
    const sec = document.getElementById(f.id), canvas = sec.querySelector('.canvas'), svg = sec.querySelector('svg');
    svg.innerHTML = `<defs><marker id="m-${f.id}" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/></marker></defs>`;
    f.edges.forEach(([a, b, t, label]) => {
      const ea = document.getElementById(`${f.id}-${a}`), eb = document.getElementById(`${f.id}-${b}`);
      if (!ea || !eb) return;
      const p = pts(box(canvas, ea), box(canvas, eb), t);
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', round(p)); path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#6e6e6e');
      path.setAttribute('stroke-width', '2.5'); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('marker-end', `url(#m-${f.id})`);
      svg.appendChild(path);
      if (label) {
        const [x0, y0] = p[0], [x1, y1] = p[1], horiz = Math.abs(y1 - y0) < 2;
        const tx = document.createElementNS(NS, 'text'); tx.setAttribute('class', 'elabel');
        tx.setAttribute('x', x0 + 8); tx.setAttribute('y', horiz ? y0 - 8 : y0 + 18); tx.textContent = label; svg.appendChild(tx);
      }
    });
  });
}
const redraw = () => requestAnimationFrame(draw);
addEventListener('resize', redraw); document.fonts.ready.then(redraw); redraw();
</script>
