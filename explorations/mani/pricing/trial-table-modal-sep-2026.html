<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trial table modal · Sep 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .backdrop { position: fixed; inset: 0; background: rgba(10,25,37,0.45); display: flex; align-items: center; justify-content: center; padding: 32px; }

  .dp-stack { position: relative; }
  .dp-close { position: absolute; top: -14px; right: -46px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid rgba(10,25,37,0.12); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(10,25,37,0.15); z-index: 2; font-size: 15px; color: #171717; }
  .dp-box { position: relative; width: 1240px; max-width: calc(100vw - 120px); background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.18); display: flex; flex-direction: column; }
  .dp-main { padding: 34px 44px 24px; }

  .dp-footer { border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 34px; padding: 0 44px; height: 62px; overflow: hidden; }
  .dp-footer .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: #171717; white-space: nowrap; }
  .dp-footer .loved i { color: #e02d2d; font-size: 16px; }
  .sp-wrap { position: relative; overflow: hidden; flex: 1; height: 100%; display: flex; align-items: center; }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: flex; align-items: center; gap: 36px; width: max-content; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 26px; width: auto; object-fit: contain; }
  .sp-fade { pointer-events: none; position: absolute; top: 0; bottom: 0; width: 72px; }
  .sp-fade--l { left: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }

  /* table */
  .tb { width: calc(100% + 16px); border-collapse: separate; border-spacing: 8px 0; margin-left: -8px; }
  .tb th, .tb td { padding: 11px 14px; font-size: 14px; text-align: center; vertical-align: middle; }
  .tb td:first-child, .tb th:first-child { text-align: left; padding-left: 0; }
  .tb td:first-child { font-weight: 500; color: #171717; white-space: nowrap; font-size: 14.5px; }
  .tb td:first-child i { font-size: 17px; margin-right: 11px; vertical-align: -3px; color: #5f6b76; }
  .tb .title-cell { vertical-align: top; padding-top: 16px; width: 26%; }
  .ref-title { font-size: 28px; font-weight: 500; line-height: 1.35; letter-spacing: -0.02em; }
  .ref-title .t-blue { color: #0055ED; }
  .tb .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tb .lock { color: #9aa4ad; font-size: 13px; white-space: nowrap; }
  .tb .lock i { font-size: 15px; vertical-align: -2px; margin-right: 6px; }
  .tb .yes { color: #0a8a3a; font-size: 18px; }
  .tb .no { color: #b6bec5; font-size: 16px; }

  /* gold card column */
  .tb th.gcard, .tb td.gcard { background: linear-gradient(180deg, #fffdf6, #fdf6e3); border-left: 1px solid rgba(201,147,42,0.45); border-right: 1px solid rgba(201,147,42,0.45); }
  .tb thead th.gcard { border-top: 1px solid rgba(201,147,42,0.45); border-radius: 12px 12px 0 0; position: relative; }
  .tb tbody tr:last-child td.gcard { border-bottom: 1px solid rgba(201,147,42,0.45); border-radius: 0 0 12px 12px; padding-bottom: 18px; }
  .badge-best { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #0055ED; color: #fff; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px; white-space: nowrap; z-index: 1; }

  /* plan header */
  .tb-head { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 6px 12px; }
  .p-name { font-size: 19px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .p-name i { font-size: 20px; }
  .p-price { font-size: 27px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .p-price s { font-weight: 500; color: #9aa4ad; margin-right: 6px; }
  .p-price .p-mo { font-size: 27px; font-weight: 600; }
  .p-per { font-size: 13px; color: #6b6b6b; font-weight: 400; margin-top: -3px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; font-family: inherit; font-size: 14px; font-weight: 500; height: 42px; width: 100%; max-width: 280px; border-radius: 8px; cursor: pointer; background: #fff; border: 1px solid #171717; color: #171717; margin-top: 8px; }
  .btn:hover { background: #f5f5f5; }
  .btn--gold { border: 0; background: linear-gradient(90deg,#dcb05e 0%,#ca9e4c 30%,#c39643 65%,#b8893a 100%); color: #fff; }
  .btn--gold:hover { filter: brightness(1.05); }
  .b-try { margin-top: 8px; background: none; border: 0; color: #0055ED; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .pill-x { background: #e8f0fe; color: #0055ED; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; margin-left: 8px; vertical-align: 1px; }
</style>
</head>
<body>

<div class="backdrop">
  <div class="dp-stack">
    <button type="button" class="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="dp-box">
      <div class="dp-main">
        <table class="tb">
          <thead>
            <tr>
              <th class="title-cell"><div class="ref-title">Try free for 7 days,<br>or buy today and<br><span class="t-blue">save 20%</span></div></th>
              <th>
                <div class="tb-head">
                  <span class="p-name">Pro <i class="ph ph-rocket-launch"></i></span>
                  <span class="p-price"><s>$20</s>$16<span class="p-mo">/mo</span></span>
                  <span class="p-per">when you buy today</span>
                  <button type="button" class="btn">Get Pro</button>
                  <button type="button" class="b-try">or try free for 7 days, no discount</button>
                </div>
              </th>
              <th class="gcard">
                <span class="badge-best">Best for you</span>
                <div class="tb-head">
                  <span class="p-name">Gold <i class="ph ph-sketch-logo"></i></span>
                  <span class="p-price"><s>$50</s>$40<span class="p-mo">/mo</span></span>
                  <span class="p-per">when you buy today</span>
                  <button type="button" class="btn btn--gold">Get Gold</button>
                  <button type="button" class="b-try">or try free for 7 days, no discount</button>
                </div>
              </th>
              <th>
                <div class="tb-head">
                  <span class="p-name">Team <i class="ph ph-users-three"></i></span>
                  <span class="p-price"><s>$60</s>$50<span class="p-mo">/mo</span></span>
                  <span class="p-per">when you buy today</span>
                  <button type="button" class="btn">Get Team</button>
                  <button type="button" class="b-try">or try free for 7 days, no discount</button>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="dp-footer">
        <span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>
        <span class="sp-wrap">
          <span class="sp-track" id="logo-track"></span>
          <span class="sp-fade sp-fade--l"></span><span class="sp-fade sp-fade--r"></span>
        </span>
      </div>
    </div>
  </div>
</div>

<script>
  const yes = '<i class="ph-fill ph-check-circle yes"></i>';
  const no = '<i class="ph ph-x no"></i>';
  const lock = '<span class="lock"><i class="ph ph-lock-simple"></i>Unlocks on upgrade</span>';
  const pillX = (t) => '<span class="pill-x">' + t + '</span>';
  const r = (icon, name, a, b, c) =>
    '<tr><td><i class="ph ' + icon + '"></i>' + name + '</td>' +
    '<td>' + a + '</td><td class="gcard">' + b + '</td><td>' + c + '</td></tr>';

  document.getElementById('rows').innerHTML =
    r('ph-star-four', 'Credits during your trial', '<span class="num">500</span> Credits', '<span class="num">1,000</span> Credits', '<span class="num">1,200</span> Credits') +
    r('ph-stack-plus', 'Credits when you upgrade', '<span class="num">5,000</span> Credits', '<span class="num">25,000</span> Credits' + pillX('5x Pro'), '<span class="num">30,000</span> Credits' + pillX('6x Pro')) +
    r('ph-export', 'Export to PPT', lock, lock, lock) +
    r('ph-swatches', 'Brand kit', yes, yes, yes) +
    r('ph-book-open', 'Shared project knowledge', no, yes, yes) +
    r('ph-users-three', 'Collaborations', no, no, yes) +
    r('ph-sparkle', 'Ultra/Pro AI models', yes, yes, yes) +
    r('ph-chart-bar', 'Analytics', yes, yes, yes);

  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  document.getElementById('logo-track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
