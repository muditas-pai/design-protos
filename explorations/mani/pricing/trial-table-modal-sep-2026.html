<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trial table modal · Sep 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .backdrop { position: fixed; inset: 0; background: rgba(10,25,37,0.45); display: flex; align-items: center; justify-content: center; }

  .dp-stack { position: relative; display: flex; gap: 10px; align-items: flex-start; }
  .dp-close { transition: background 0.15s ease; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 0; border-radius: 24px; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 1px 2px rgba(11,15,20,0.09), inset 0 0 0 1px rgba(255,255,255,0.8); font-size: 16px; color: #171717; flex: none; }
  .dp-close:hover { background: #ececec; }
  .dp-box { position: relative; width: 1080px; height: 672px; background: #fff; border-radius: 4px; overflow: hidden; flex: none; }

  /* title */
  .ttl { position: absolute; left: 30px; top: 30px; width: 200px; font-size: 20px; font-weight: 500; line-height: normal; color: #171717; }
  .ttl .t-blue { color: #005eff; }

  /* feature labels */
  .feats { position: absolute; left: 30px; top: 264px; width: 240px; display: flex; flex-direction: column; gap: 20px; }
  .feats .f { display: flex; gap: 10px; align-items: center; width: 240px; }
  .feats .f i { font-size: 20px; color: #171717; flex: none; }
  .feats .f span { font-size: 14px; font-weight: 400; line-height: 1.43; color: #171717; }

  /* plan cards */
  .plan { position: absolute; top: 30px; height: 564px; width: 260px; border-radius: 4px; }
  .plan--pro { left: 250px; }
  .plan--team { left: 790px; }
  .plan--gold { left: 514px; width: 272px; border: 2px solid #e8d3a3; background: linear-gradient(118.8deg, #fff 3.93%, #fffdf7 77.6%, #f7ecd2 105.89%); box-shadow: 0 1px 1px rgba(11,15,20,0.09); }
  .badge-best { position: absolute; top: -11px; right: 14px; background: #005eff; color: #fff; font-size: 12px; font-weight: 500; line-height: 1; padding: 3px 10px; border-radius: 4px; white-space: nowrap; z-index: 1; }

  .p-top { position: absolute; left: 10px; top: 30px; width: 240px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .plan--gold .p-top { left: 12px; top: 28px; }
  .p-id { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .p-name { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; color: #171717; }
  .p-name i { font-size: 18px; }
  .p-pricing { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .p-price { display: flex; gap: 4px; align-items: center; font-size: 24px; font-weight: 400; line-height: 1.3; letter-spacing: -0.24px; }
  .p-price s { color: #a3a3a3; }
  .p-per { font-size: 12px; font-weight: 400; line-height: 1.33; color: #525252; text-align: center; }
  .p-ctas { display: flex; flex-direction: column; gap: 16px; align-items: center; width: 100%; }
  .btn { display: flex; align-items: center; justify-content: center; height: 36px; width: 100%; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.43; border-radius: 4px; cursor: pointer; background: transparent; border: 1px solid #0b0f14; color: #171717; box-shadow: 0 0 0 1px rgba(11,15,20,0.06), 0 1px 2px rgba(11,15,20,0.09); transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, filter 0.18s ease; }
  .btn:hover { background: #171717; color: #fff; box-shadow: 0 2px 8px rgba(10,25,37,0.2); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn--gold { border: 0; color: #fff; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0) 55%), linear-gradient(90deg, #dcb05e 0%, #ca9e4c 30%, #c39643 65%, #b8893a 100%); box-shadow: 0 3px 12px rgba(202,158,76,0.45), 0 1px 2px rgba(11,15,20,0.09); position: relative; overflow: hidden; }
  .btn--gold:hover { filter: brightness(1.1); color: #fff; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0) 55%), linear-gradient(90deg, #dcb05e 0%, #ca9e4c 30%, #c39643 65%, #b8893a 100%); box-shadow: 0 5px 16px rgba(202,158,76,0.6), 0 1px 2px rgba(11,15,20,0.09); transform: translateY(-1px); }
  .btn--gold::before { content: ''; position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.32) 50%, transparent 100%); transform: translateX(-180%) skewX(-20deg); pointer-events: none; animation: gold-shimmer 2.8s ease-in-out 0.15s infinite; }
  @keyframes gold-shimmer {
    0%   { transform: translateX(-180%) skewX(-20deg); }
    55%  { transform: translateX(320%)  skewX(-20deg); }
    100% { transform: translateX(320%)  skewX(-20deg); }
  }
  .b-try { background: none; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.43; color: #005eff; text-decoration: underline; text-decoration-thickness: from-font; text-underline-position: from-font; width: 100%; }
  .b-try:hover { color: #003C9E; text-decoration-thickness: 1.5px; }

  .p-vals { position: absolute; left: 10px; top: 234px; width: 240px; display: flex; flex-direction: column; gap: 20px; }
  .plan--gold .p-vals { left: 12px; top: 232px; }
  .p-vals .v { display: flex; gap: 4px; align-items: center; justify-content: center; width: 240px; min-height: 20px; font-size: 14px; font-weight: 500; line-height: 1.43; color: #171717; }
  .p-vals .v.v-lock { gap: 10px; font-weight: 400; color: #a3a3a3; }
  .p-vals .v.v-lock i { font-size: 20px; color: #a3a3a3; }
  .p-vals .v .yes { font-size: 20px; color: #21a45d; }
  .p-vals .v .no { font-size: 20px; color: #737373; }
  .pill-x { background: #e6efff; color: #005eff; font-size: 12px; font-weight: 500; line-height: 1; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

  /* row separators */
  .row-sep { position: absolute; left: 30px; right: 30px; height: 1px; background: rgba(10,25,37,0.06); }
  .plan--gold .row-sep { left: 12px; right: 12px; background: rgba(184,137,58,0.14); }

  /* footer */
  .dp-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; background: #fff; }
  .dp-footer::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(10,25,37,0.08); }
  .dp-footer .loved { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; color: #525252; white-space: nowrap; }
  .dp-footer .loved i { color: #e02d2d; font-size: 18px; }
  .sp-wrap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 803px; height: 48px; overflow: hidden; display: flex; align-items: center; }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: flex; align-items: center; gap: 32px; width: max-content; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo { flex: none; display: flex; align-items: center; }
  .sp-logo img { height: 26px; width: auto; object-fit: contain; }
  .sp-fade { pointer-events: none; position: absolute; top: 0; bottom: 0; }
  .sp-fade--l { left: 0; width: 116px; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; width: 93px; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }
</style>
</head>
<body>

<div class="backdrop">
  <div class="dp-stack">
    <div class="dp-box">
      <div class="ttl">Try free for 7 days, or buy today and <span class="t-blue">save 20%</span></div>

      <div id="row-seps"></div>

      <div class="feats" id="feats"></div>

      <div class="plan plan--pro" id="plan-pro"></div>
      <div class="plan plan--gold" id="plan-gold">
        <span class="badge-best">Best for you</span>
      </div>
      <div class="plan plan--team" id="plan-team"></div>

      <div class="dp-footer">
        <span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>
        <span class="sp-wrap">
          <span class="sp-track" id="logo-track"></span>
          <span class="sp-fade sp-fade--l"></span><span class="sp-fade sp-fade--r"></span>
        </span>
      </div>
    </div>
    <button type="button" class="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>
</div>

<script>
  const FEATS = [
    ['ph-star-four', 'Credits during your trial'],
    ['ph-star-four', 'Credits when you upgrade'],
    ['ph-microsoft-powerpoint-logo', 'Export to PPT'],
    ['ph-swatches', 'Brand kit'],
    ['ph-book-open-text', 'Shared project knowledge'],
    ['ph-users-three', 'Collaborations'],
    ['ph-sparkle', 'Ultra/Pro AI models'],
    ['ph-chart-bar', 'Analytics'],
  ];
  // separator line between each pair of feature rows (rows start y264, 40px pitch)
  document.getElementById('row-seps').innerHTML = FEATS.slice(1).map((_, i) =>
    '<div class="row-sep" style="top:' + (294 + i * 40) + 'px"></div>'
  ).join('');

  document.getElementById('feats').innerHTML = FEATS.map((f) =>
    '<div class="f"><i class="ph ' + f[0] + '"></i><span>' + f[1] + '</span></div>'
  ).join('');

  const yes = '<i class="ph-fill ph-check-circle yes"></i>';
  const no = '<i class="ph ph-x no"></i>';
  const lockRow = '<div class="v v-lock"><i class="ph ph-lock"></i>Unlocks on upgrade</div>';
  const v = (html) => '<div class="v">' + html + '</div>';

  const planHtml = (name, icon, base, off, gold, vals) =>
    '<div class="p-top">' +
      '<div class="p-id">' +
        '<div class="p-name">' + name + ' <i class="ph ph-' + icon + '"></i></div>' +
        '<div class="p-pricing">' +
          '<div class="p-price"><s>$' + base + '</s><span>$' + off + '/mo</span></div>' +
          '<div class="p-per">when you buy today</div>' +
        '</div>' +
      '</div>' +
      '<div class="p-ctas">' +
        '<button type="button" class="btn' + (gold ? ' btn--gold' : '') + '" onclick="location.href=\'checkout-buy-sep-2026.html?plan=' + name.toLowerCase() + '\'">Get ' + name + '</button>' +
        '<button type="button" class="b-try" onclick="location.href=\'checkout-trial-sep-2026.html?plan=' + name.toLowerCase() + '\'">or try free for 7 days, no discount</button>' +
      '</div>' +
    '</div>' +
    '<div class="p-vals">' + vals.join('') + '</div>';

  document.getElementById('plan-pro').innerHTML = planHtml('Pro', 'rocket-launch', 20, 16, false, [
    v('500 Credits'), v('5,000 Credits'), lockRow, v(yes), v(no), v(no), v(yes), v(yes),
  ]);
  document.getElementById('plan-gold').innerHTML += planHtml('Gold', 'sketch-logo', 50, 40, true, [
    v('1,000 Credits'), v('25,000 Credits<span class="pill-x">5x Pro</span>'), lockRow, v(yes), v(yes), v(no), v(yes), v(yes),
  ]);
  document.getElementById('plan-team').innerHTML = planHtml('Team', 'users-three', 60, 50, false, [
    v('1,200 Credits'), v('30,000 Credits<span class="pill-x">6x Pro</span>'), lockRow, v(yes), v(yes), v(yes), v(yes), v(yes),
  ]);

  // separators inside the gold card (its background covers the page-wide ones)
  document.getElementById('plan-gold').innerHTML += FEATS.slice(1).map((_, i) =>
    '<div class="row-sep" style="top:' + (262 + i * 40) + 'px"></div>'
  ).join('');

  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  document.getElementById('logo-track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<span class="sp-logo"><img src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' /></span>'
  ).join('');
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
