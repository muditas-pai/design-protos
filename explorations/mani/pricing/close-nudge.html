<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Close Nudge · $60 off Pro Annual</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #8b8b8b;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .cn-stack {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    transform: translateY(8px) scale(0.98);
    opacity: 0;
    animation: cn-pop 0.3s cubic-bezier(0.34, 1.35, 0.64, 1) 0.05s forwards;
  }
  @keyframes cn-pop {
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Eyebrow strip — blue tinted, slides up out from behind box top */
  .cn-eyebrow {
    width: 1000px;
    height: 40px;
    background: #e0ebfd;
    border-radius: 4px 4px 0 0;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    font-size: 14px;
    color: #161616;
    line-height: 1.43;
    position: relative;
    z-index: 0;
    transform: translateY(44px);
    opacity: 0;
    animation: cn-strip 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
  }
  @keyframes cn-strip {
    to { transform: translateY(0); opacity: 1; }
  }
  .cn-eyebrow .gift { font-size: 18px; line-height: 1; }

  /* Main box — split layout */
  .cn-box {
    position: relative;
    z-index: 1;
    width: 1040px;
    height: 600px;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    box-shadow:
      0 0 0 1px rgba(10,25,37,0.09),
      0 1px 2px 0 rgba(10,25,37,0.09),
      0 4px 6px 0 rgba(10,25,37,0.09),
      0 24px 40px -16px rgba(10,25,37,0.09),
      inset 0 0 0 1px rgba(255,255,255,0.8);
  }

  /* Close button — floats outside the card, top-right */
  .cn-close {
    position: absolute;
    top: 46px; right: -44px;
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff;
    border: 0; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    color: #171717;
    z-index: 4;
    transition: background 0.15s, transform 0.15s;
  }
  .cn-close:hover { background: #f4f6fa; transform: scale(1.06); }
  .cn-close i { font-size: 14px; }

  /* ── LEFT: title + feature list ── */
  .cn-left {
    width: 350px;
    flex-shrink: 0;
    padding: 40px 32px;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(10,25,37,0.07);
  }
  .cn-title {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.4px;
    line-height: 1.3;
    color: #171717;
    margin-bottom: 36px;
  }
  .cn-title .accent { color: #005eff; white-space: nowrap; }
  .cn-title[data-price-loading="true"]  .cn-sym, .cn-title[data-price-loading="true"]  .cn-digit-track { filter: blur(6px); }
  .cn-title[data-price-loading="false"] .cn-sym, .cn-title[data-price-loading="false"] .cn-digit-track { filter: blur(0); }
  .cn-sym { transition: filter 2s ease-out; }
  .cn-digits { display: inline-flex; vertical-align: baseline; height: 30px; }
  .cn-digit {
    display: inline-block; position: relative;
    width: 17px; height: 30px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
  }
  .cn-digit-track {
    display: block; transform: translateY(0);
    transition: transform 3.2s cubic-bezier(0.33, 1, 0.68, 1), filter 2.4s ease-out;
  }
  .cn-digit:nth-child(2) .cn-digit-track {
    transition: transform 3.5s cubic-bezier(0.33, 1, 0.68, 1), filter 2.6s ease-out;
  }
  .cn-digit-track > span {
    display: block; height: 30px; line-height: 30px;
    text-align: center; font-weight: 600; color: #005eff;
  }

  .cn-feat-list { display: flex; flex-direction: column; gap: 8px; }
  .cn-feat-item {
    display: flex; align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 4px;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    color: #171717;
    line-height: 1.4;
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: background 0.15s ease;
  }
  .cn-feat-item:hover { background: #fafafa; }
  .cn-feat-item.is-active { background: #f5f5f5; cursor: default; }
  .cn-feat-item i { font-size: 21px; color: #171717; flex-shrink: 0; line-height: 1; }

  /* ── RIGHT: visual + detail ── */
  .cn-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cn-visual {
    height: 380px;
    flex-shrink: 0;
    background: #eceef0;
    border-bottom: 1px solid rgba(10,25,37,0.07);
    overflow: hidden;
    position: relative;
  }
  .cn-visual img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 1;
    transform: translateX(0);
    filter: blur(0);
    transition: opacity 0.28s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), filter 0.28s ease;
  }
  .cn-visual img.is-swapping { opacity: 0; transform: translateX(-14px); filter: blur(6px); }
  .cn-visual img.is-entering { opacity: 0; transform: translateX(14px); filter: blur(6px); transition: none; }

  .cn-detail {
    flex: 1;
    padding: 28px 40px 32px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .cn-detail-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: #171717;
    margin-bottom: 8px;
  }
  .cn-detail-sub {
    font-size: 14px;
    line-height: 1.55;
    color: #525252;
    max-width: 460px;
  }
  .cn-detail-text { transition: opacity 0.22s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
  .cn-detail-text.is-swapping { opacity: 0; transform: translateY(4px); }

  /* Footer row: timer pill + CTA */
  .cn-footer {
    margin-top: auto;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 14px;
  }
  .cn-timer-pill {
    height: 32px;
    padding: 0 16px 0 12px;
    background: #005eff;
    color: #fff;
    border-radius: 999px 0 0 999px;
    display: inline-flex; align-items: center;
    gap: 6px;
    font-size: 13px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    position: relative;
    white-space: nowrap;
    margin-right: 8px;
    animation: cn-pill-glow 2.2s ease-in-out infinite;
  }
  .cn-timer-pill i { font-size: 15px; line-height: 1; }
  .cn-timer-pill::after {
    content: ''; position: absolute;
    left: calc(100% - 1px); top: 0;
    width: 12px; height: 32px;
    background: #005eff;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  @keyframes cn-pill-glow {
    0%, 100% { box-shadow: 0 0 0 0   rgba(0, 94, 255, 0.45); }
    70%      { box-shadow: 0 0 0 8px rgba(0, 94, 255, 0); }
    100%     { box-shadow: 0 0 0 0   rgba(0, 94, 255, 0); }
  }

  .cn-cta {
    position: relative;
    height: 48px;
    padding: 0 32px;
    background: #0a1925;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 500;
    border: 0; border-radius: 4px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(10,25,37,0.06), 0 1px 2px rgba(10,25,37,0.09);
    transition: background 0.3s ease;
    overflow: hidden;
  }
  .cn-cta::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 60%; height: 100%;
    background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.32) 50%, transparent 100%);
    transform: translateX(-180%) skewX(-20deg);
    pointer-events: none;
    animation: cn-shimmer 2.8s ease-in-out 1.4s infinite;
  }
  @keyframes cn-shimmer {
    0%   { transform: translateX(-180%) skewX(-20deg); }
    55%  { transform: translateX(320%)  skewX(-20deg); }
    100% { transform: translateX(320%)  skewX(-20deg); }
  }
  .cn-cta:hover { background: #23303B; }

  @media (max-width: 1100px) {
    .cn-eyebrow, .cn-box { width: calc(100vw - 48px); }
    .cn-box { height: auto; flex-direction: column; }
    .cn-left { width: 100%; border-right: 0; border-bottom: 1px solid rgba(10,25,37,0.07); }
    .cn-close { right: 8px; top: 48px; }
  }
</style>
</head>
<body>

  <div class="cn-stack">
    <!-- Eyebrow strip -->
    <div class="cn-eyebrow">
      <span class="gift" aria-hidden="true">🎁</span>
      <p>Before you go, a special discount, just for you for the next hour.</p>
    </div>

    <!-- Main box -->
    <div class="cn-box" role="dialog" aria-modal="true" aria-labelledby="cn-title">

      <!-- LEFT: title + feature list -->
      <div class="cn-left">
        <h1 class="cn-title" id="cn-title" data-price-loading="true">
          Get <span class="accent"><span class="cn-sym">$</span><span class="cn-digits"><span class="cn-digit" data-target="6"><span class="cn-digit-track"></span></span><span class="cn-digit" data-target="0"><span class="cn-digit-track"></span></span></span> off</span> Pro Annual and access premium features
        </h1>

        <div class="cn-feat-list" id="cn-feat-list">
          <button type="button" class="cn-feat-item is-active" data-feat="export">
            <i class="ph-fill ph-export"></i><span>Export presentations</span>
          </button>
          <button type="button" class="cn-feat-item" data-feat="ai">
            <i class="ph ph-sparkle"></i><span>Advanced AI models</span>
          </button>
          <button type="button" class="cn-feat-item" data-feat="analytics">
            <i class="ph ph-chart-bar"></i><span>Analytics</span>
          </button>
          <button type="button" class="cn-feat-item" data-feat="knowledge">
            <i class="ph ph-book-open"></i><span>Shared knowledge base</span>
          </button>
          <button type="button" class="cn-feat-item" data-feat="team">
            <i class="ph ph-users-three"></i><span>Invite team members</span>
          </button>
          <button type="button" class="cn-feat-item" data-feat="projects">
            <i class="ph ph-folder"></i><span>Projects</span>
          </button>
        </div>
      </div>

      <!-- RIGHT: visual + detail -->
      <div class="cn-right">
        <div class="cn-visual" aria-hidden="true">
          <img id="cn-visual-img" src="assets/v5/preview-v2.png" alt="" />
        </div>

        <div class="cn-detail">
          <div class="cn-detail-text" id="cn-detail-text">
            <h2 class="cn-detail-title" id="cn-detail-title">Export presentations</h2>
            <p class="cn-detail-sub" id="cn-detail-sub">Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.</p>
          </div>

          <div class="cn-footer">
            <span class="cn-timer-pill">
              <i class="ph-fill ph-clock"></i>
              <span>Ends in <span id="cn-timer">59:59</span> min</span>
            </span>
            <button class="cn-cta" type="button">Buy Pro Annual at $60 off</button>
          </div>
        </div>
      </div>

      <!-- Close (floats outside the card, top-right) -->
      <button class="cn-close" type="button" aria-label="Close">
        <i class="ph ph-x"></i>
      </button>
    </div>
  </div>

  <script>
    (function () {
      const FEATURES = {
        export: {
          title: 'Export presentations',
          sub: 'Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.',
          img: 'assets/v5/preview-v2.png',
        },
        ai: {
          title: 'Advanced AI models',
          sub: 'Build sharper decks with the latest frontier AI models from OpenAI, Anthropic, and Google.',
          img: 'assets/v5/preview-ai-models.png',
        },
        analytics: {
          title: 'Analytics',
          sub: 'Track views, engagement, and viewer location. See exactly how your deck performs after you share it.',
          img: 'assets/v5/preview-analytics.png',
        },
        knowledge: {
          title: 'Shared knowledge base',
          sub: 'Upload your files once. The AI references them on every slide, so your decks stay accurate and on-message.',
          img: 'assets/v5/preview-shared-knowledge.png',
        },
        team: {
          title: 'Invite team members',
          sub: 'Bring your team into one workspace to co-edit decks in real time, with comments.',
          img: 'assets/v5/preview-invite-team.png',
        },
        projects: {
          title: 'Projects',
          sub: 'Group related decks into shared spaces, so everyone knows where the latest version lives.',
          img: 'assets/v5/preview-projects.png',
        },
      };

      // Feature switching — swap visual + detail text with a soft slide/blur
      const list = document.getElementById('cn-feat-list');
      const visualImg = document.getElementById('cn-visual-img');
      const detailText = document.getElementById('cn-detail-text');
      const detailTitle = document.getElementById('cn-detail-title');
      const detailSub = document.getElementById('cn-detail-sub');

      list.addEventListener('click', (e) => {
        const item = e.target.closest('.cn-feat-item');
        if (!item || item.classList.contains('is-active')) return;

        list.querySelectorAll('.cn-feat-item').forEach((el) => {
          const active = el === item;
          el.classList.toggle('is-active', active);
          const icon = el.querySelector('i');
          icon.className = icon.className.replace(active ? /\bph\b/ : /\bph-fill\b/, active ? 'ph-fill' : 'ph');
        });

        const feat = FEATURES[item.dataset.feat];

        visualImg.classList.add('is-swapping');
        detailText.classList.add('is-swapping');
        setTimeout(() => {
          visualImg.src = feat.img;
          visualImg.classList.remove('is-swapping');
          visualImg.classList.add('is-entering');
          detailTitle.textContent = feat.title;
          detailSub.textContent = feat.sub;
          detailText.classList.remove('is-swapping');
          requestAnimationFrame(() => requestAnimationFrame(() => visualImg.classList.remove('is-entering')));
        }, 280);
      });

      // $60 digit roll — tracks 0-9, roll to target with blur reveal
      const title = document.getElementById('cn-title');
      document.querySelectorAll('.cn-digit').forEach((digit) => {
        const track = digit.querySelector('.cn-digit-track');
        for (let i = 0; i <= 9; i++) {
          const s = document.createElement('span');
          s.textContent = i;
          track.appendChild(s);
        }
      });
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.querySelectorAll('.cn-digit').forEach((digit) => {
          const target = +digit.dataset.target;
          digit.querySelector('.cn-digit-track').style.transform = `translateY(${-target * 30}px)`;
        });
        title.dataset.priceLoading = 'false';
      }));

      // Countdown timer
      let remaining = 59 * 60 + 59;
      const timerEl = document.getElementById('cn-timer');
      setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    })();
  </script>

  <!-- Agentation: visual feedback toolbar (bottom-right). React is loaded via esm.sh CDN. -->
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
    createRoot(document.getElementById('agentation-root'))
      .render(React.createElement(Agentation));
  </script>
</body>
</html>
