<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feature modal · Pricing · Sep 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #e9e9e9;
    color: #171717;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .dp-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,25,37,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .dp-stack { position: relative; }
  .dp-close {
    position: absolute;
    top: -14px; right: -14px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1px solid rgba(10,25,37,0.12);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(10,25,37,0.15);
    z-index: 2;
    font-size: 14px; color: #171717;
  }
  .dp-close:hover { background: #f5f5f5; }
  .dp-box {
    position: relative;
    width: 978px; height: 620px;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09),
                0 24px 40px -16px rgba(10,25,37,0.18);
    display: grid;
    grid-template-columns: 342px 1fr;
    grid-template-rows: 1fr 58px;
  }

  /* ── Left rail ── */
  .dp-left {
    grid-column: 1; grid-row: 1;
    padding: 28px 20px 16px 28px;
    overflow-y: auto;
  }
  .dp-left::-webkit-scrollbar { width: 0; }
  .dp-title {
    font-size: 24px; font-weight: 500;
    line-height: 32px; letter-spacing: -0.02em;
    margin-bottom: 22px;
    max-width: 260px;
  }
  .dp-feat-item {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%;
    padding: 9px 10px;
    background: transparent;
    border: 0; border-radius: 6px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: #171717;
  }
  .dp-feat-item:hover { background: #f7f7f7; }
  .dp-feat-item.is-active { background: #f2f2f2; }
  .dp-feat-item > i { font-size: 18px; line-height: 22px; flex-shrink: 0; }
  .dp-feat-item .txt { min-width: 0; }
  .dp-feat-item .row { display: flex; align-items: center; gap: 8px; }
  .dp-feat-item .lbl {
    font-size: 14.5px; font-weight: 500; line-height: 22px;
    white-space: nowrap;
  }
  .dp-dots { display: inline-flex; align-items: center; gap: 3px; }
  .dp-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dp-dot--pro  { background: #0055ED; }
  .dp-dot--gold { background: #c9932a; }
  .dp-dot--team { background: #171717; }
  .dp-feat-item .sub {
    display: none;
    font-size: 12.5px; line-height: 18px;
    color: #6b6b6b;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .dp-feat-item.is-active .sub { display: -webkit-box; }

  /* ── Right side ── */
  .dp-right {
    grid-column: 2; grid-row: 1;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .dp-preview {
    height: 300px;
    background: #0b1fbb;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .dp-preview img, .dp-preview video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .dp-detail { padding: 22px 30px 0; }
  .dp-desc {
    font-size: 14.5px; line-height: 22px;
    color: #525252;
    max-width: 560px;
  }
  .dp-desc b { color: #171717; font-weight: 600; }

  /* ── Tier row ── */
  .dp-tiers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding: 8px 30px 0;
    margin-top: auto;
    margin-bottom: 22px;
  }
  .dp-tier {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    position: relative;
    padding-top: 26px;
  }
  .dp-tier-badge {
    position: absolute; top: 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: #0055ED;
    border-radius: 4px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .dp-credits {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .dp-credits i { font-size: 18px; }
  .dp-tier-btn {
    width: 100%;
    height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    background: #fff;
    border: 1px solid #171717;
    color: #171717;
  }
  .dp-tier-btn:hover { background: #f5f5f5; }
  .dp-tier-btn--gold {
    border: 0;
    background: linear-gradient(90deg, #dcb05e 0%, #ca9e4c 30%, #c39643 65%, #b8893a 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .dp-tier-btn--gold::after {
    content: '';
    position: absolute; top: 0; bottom: 0; left: -75%;
    width: 40%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
    animation: gold-shimmer 2.8s ease-in-out infinite;
  }
  @keyframes gold-shimmer {
    0%   { left: -75%; }
    60%  { left: 125%; }
    100% { left: 125%; }
  }
  .dp-tier-btn--gold:hover { filter: brightness(1.04); }

  /* ── Footer ── */
  .dp-footer {
    grid-column: 1 / -1; grid-row: 2;
    border-top: 1px solid rgba(10,25,37,0.08);
    display: flex; align-items: center;
    gap: 34px;
    padding: 0 30px;
    overflow: hidden;
  }
  .dp-footer .loved {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: #171717;
    white-space: nowrap;
  }
  .dp-footer .loved i { color: #e02d2d; font-size: 15px; }
  .dp-logos {
    display: flex; align-items: center;
    gap: 34px;
    flex: 1;
    justify-content: space-between;
  }
  .dp-logo {
    font-size: 14px; font-weight: 600; color: #444;
    letter-spacing: 0;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
    opacity: 0.85;
  }
  .dp-logo i { font-size: 16px; }
  .dp-logo--mck { font-family: Georgia, serif; font-weight: 400; font-size: 12px; line-height: 1.15; text-align: left; }
</style>
</head>
<body>

<div class="dp-backdrop" id="dp-backdrop">
  <div class="dp-stack">
    <button type="button" class="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="dp-box">

      <div class="dp-left">
        <h2 class="dp-title">Choose the plan that fits your work</h2>

        <button type="button" class="dp-feat-item is-active" data-feat="export" data-video="trigger_export" data-dots="pro,gold,team" data-icon-active="ph-fill ph-export" data-icon-inactive="ph ph-export">
          <i class="ph-fill ph-export"></i>
          <span class="txt"><span class="row"><span class="lbl">Export presentations</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="brandkit" data-preview="assets/feature-modal/triggerbrandkit.jpg" data-icon-active="ph-fill ph-swatches" data-icon-inactive="ph ph-swatches">
          <i class="ph ph-swatches"></i>
          <span class="txt"><span class="row"><span class="lbl">Brand kit</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="knowledge" data-preview="assets/feature-modal/triggerprojectknowledge.jpg" data-icon-active="ph-fill ph-book-open" data-icon-inactive="ph ph-book-open">
          <i class="ph ph-book-open"></i>
          <span class="txt"><span class="row"><span class="lbl">Shared knowledge base</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="team" data-video="trigger_invite_members" data-icon-active="ph-fill ph-users-three" data-icon-inactive="ph ph-users-three">
          <i class="ph ph-users-three"></i>
          <span class="txt"><span class="row"><span class="lbl">Collaborations</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="ultra" data-preview="assets/feature-modal/triggeraimodels.jpg" data-icon-active="ph-fill ph-sparkle" data-icon-inactive="ph ph-sparkle">
          <i class="ph ph-sparkle"></i>
          <span class="txt"><span class="row"><span class="lbl">Ultra/Pro AI model</span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="analytics" data-video="trigger_analytics" data-icon-active="ph-fill ph-chart-bar" data-icon-inactive="ph ph-chart-bar">
          <i class="ph ph-chart-bar"></i>
          <span class="txt"><span class="row"><span class="lbl">Analytics</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="projects" data-preview="assets/feature-modal/triggerproject.jpg" data-icon-active="ph-fill ph-folder" data-icon-inactive="ph ph-folder">
          <i class="ph ph-folder"></i>
          <span class="txt"><span class="row"><span class="lbl">Projects</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="fontpair" data-preview="assets/feature-modal/triggerfonts.jpg" data-icon-active="ph-fill ph-text-aa" data-icon-inactive="ph ph-text-aa">
          <i class="ph ph-text-aa"></i>
          <span class="txt"><span class="row"><span class="lbl">Color and Font pair</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
        <button type="button" class="dp-feat-item" data-feat="present" data-preview="assets/feature-modal/triggercolorsmeetandpresent.jpg" data-icon-active="ph-fill ph-projector-screen" data-icon-inactive="ph ph-projector-screen">
          <i class="ph ph-projector-screen"></i>
          <span class="txt"><span class="row"><span class="lbl">Meet and present</span>
            <span class="dp-dots"><span class="dp-dot dp-dot--pro"></span><span class="dp-dot dp-dot--gold"></span><span class="dp-dot dp-dot--team"></span></span></span>
            <span class="sub"></span></span>
        </button>
      </div>

      <div class="dp-right">
        <div class="dp-preview" id="dp-preview"></div>
        <div class="dp-detail">
          <p class="dp-desc"><b id="dp-desc-title">Export presentations.</b> <span id="dp-desc-body"></span></p>
        </div>
        <div class="dp-tiers">
          <div class="dp-tier">
            <span class="dp-credits"><i class="ph-fill ph-star-four"></i>5,000</span>
            <button type="button" class="dp-tier-btn">Pro $20/mo</button>
          </div>
          <div class="dp-tier">
            <span class="dp-tier-badge">Best for you</span>
            <span class="dp-credits"><i class="ph-fill ph-star-four"></i>25,000</span>
            <button type="button" class="dp-tier-btn dp-tier-btn--gold">Gold $50/mo</button>
          </div>
          <div class="dp-tier">
            <span class="dp-tier-badge">Unlimited seats</span>
            <span class="dp-credits"><i class="ph-fill ph-star-four"></i>30,000</span>
            <button type="button" class="dp-tier-btn">Team $60/mo</button>
          </div>
        </div>
      </div>

      <div class="dp-footer">
        <span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>
        <span class="dp-logos">
          <span class="dp-logo" style="font-family: 'Product Sans', Inter, sans-serif;"><span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span></span>
          <span class="dp-logo" style="color:#EB1000"><i class="ph-fill ph-triangle" style="transform:rotate(180deg)"></i>Adobe</span>
          <span class="dp-logo"><i class="ph ph-infinity"></i>Meta</span>
          <span class="dp-logo dp-logo--mck">McKinsey<br />&amp; Company</span>
          <span class="dp-logo" style="font-weight:700; letter-spacing:-0.02em;">amazon</span>
          <span class="dp-logo"><i class="ph-fill ph-notion-logo"></i>Notion</span>
        </span>
      </div>

    </div>
  </div>
</div>

<script>
  const DESCS = {
    export:    'Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.',
    brandkit:  'Add your logo, fonts, and colors once, and every deck comes out on-brand.',
    knowledge: 'Upload your files once. The AI references them on every slide, so your decks stay accurate and on-message.',
    team:      'Bring your team into one workspace to co-edit decks in real time, with comments.',
    ultra:     'Our most powerful model, for the highest quality content and design output.',
    analytics: 'Track views, engagement, and viewer location. See exactly how your deck performs after you share it.',
    projects:  'Group related decks into shared spaces, so everyone knows where the latest version lives.',
    fontpair:  'Set your brand fonts and colors once, and they apply across every deck you create.',
    present:   'Present live to remote audiences in real time, straight from the editor.',
  };

  const preview   = document.getElementById('dp-preview');
  const descTitle = document.getElementById('dp-desc-title');
  const descBody  = document.getElementById('dp-desc-body');
  const items     = Array.from(document.querySelectorAll('.dp-feat-item'));

  function renderPreview(item) {
    const vid = item.dataset.video;
    if (vid) {
      preview.innerHTML =
        '<video autoplay loop muted playsinline>' +
        '<source src="assets/feature-modal/' + vid + '.webm" type="video/webm" />' +
        '<source src="assets/feature-modal/' + vid + '.mp4" type="video/mp4" />' +
        '</video>';
    } else {
      preview.innerHTML = '<img src="' + item.dataset.preview + '" alt="" />';
    }
  }

  function activate(item) {
    items.forEach((it) => {
      const active = it === item;
      it.classList.toggle('is-active', active);
      const icon = it.querySelector('i');
      icon.className = active ? it.dataset.iconActive : it.dataset.iconInactive;
    });
    const key = item.dataset.feat;
    const label = item.querySelector('.lbl').textContent;
    item.querySelector('.sub').textContent = DESCS[key];
    descTitle.textContent = label + '.';
    descBody.textContent = ' ' + DESCS[key];
    renderPreview(item);
  }

  items.forEach((item) => item.addEventListener('click', () => activate(item)));
  activate(items[0]);
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
