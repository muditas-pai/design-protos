<html lang="en">
<head>

<title>crazy8s · Feature modal plan row · Round 1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; padding: 48px 24px 120px; }
  .page { width: 1042px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: #666; margin-bottom: 40px; max-width: 700px; }
  .variant { margin-bottom: 64px; }
  .v-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5f6b76; margin-bottom: 12px; }
  .backdrop { background: rgba(10,25,37,0.45); border-radius: 8px; padding: 32px; display: flex; justify-content: center; }

  .dp-stack { position: relative; }
  .dp-close { position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid rgba(10,25,37,0.12); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(10,25,37,0.15); z-index: 2; font-size: 14px; color: #171717; }
  .dp-box { position: relative; width: 978px; height: 620px; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.18); display: grid; grid-template-columns: 342px 1fr; grid-template-rows: 1fr 58px; }

  .dp-left { grid-column: 1; grid-row: 1; padding: 28px 20px 16px 28px; overflow-y: auto; }
  .dp-left::-webkit-scrollbar { width: 0; }
  .dp-title { font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: -0.02em; margin-bottom: 22px; max-width: 260px; }
  .dp-feat-item { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 9px 10px; background: transparent; border: 0; border-radius: 6px; cursor: pointer; text-align: left; font-family: inherit; color: #171717; }
  .dp-feat-item:hover { background: #f7f7f7; }
  .dp-feat-item.is-active { background: #f2f2f2; }
  .dp-feat-item > i { font-size: 18px; line-height: 22px; flex-shrink: 0; }
  .dp-feat-item .txt { min-width: 0; }
  .dp-feat-item .row { display: flex; align-items: center; gap: 8px; }
  .dp-feat-item .lbl { font-size: 14.5px; font-weight: 500; line-height: 22px; white-space: nowrap; }
  .dp-dots { display: inline-flex; align-items: center; gap: 3px; }
  .dp-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dp-dot--pro  { background: #0055ED; }
  .dp-dot--gold { background: #c9932a; }
  .dp-dot--team { background: #171717; }
  .dp-feat-item .sub { display: none; font-size: 12.5px; line-height: 18px; color: #6b6b6b; margin-top: 2px; }
  .dp-feat-item.is-active .sub { display: block; }
  .dp-feat-item .chips { display: none; gap: 6px; margin-top: 8px; }
  .dp-feat-item.is-active .chips { display: flex; }
  .dp-chip { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; border-radius: 999px; padding: 3px 9px; }
  .dp-chip--pro  { color: #0055ED; background: #e8f0fe; }
  .dp-chip--gold { color: #a2782b; background: #faf0d7; }
  .dp-chip--team { color: #3d3d3d; background: #e9e9e9; }

  .dp-right { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-width: 0; }
  .dp-preview { height: 300px; background: #0b1fbb; overflow: hidden; position: relative; flex-shrink: 0; }
  .dp-preview img, .dp-preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dp-tier-zone { margin-top: auto; margin-bottom: auto; padding: 12px 30px 0; }

  .dp-footer { grid-column: 1 / -1; grid-row: 2; border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 34px; padding: 0 30px; overflow: hidden; }
  .dp-footer .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #171717; white-space: nowrap; }
  .dp-footer .loved i { color: #e02d2d; font-size: 15px; }
  .sp-wrap { position: relative; overflow: hidden; flex: 1; height: 100%; display: flex; align-items: center; }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: flex; align-items: center; gap: 32px; width: max-content; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 26px; width: auto; object-fit: contain; }
  .sp-fade { pointer-events: none; position: absolute; top: 0; bottom: 0; width: 72px; }
  .sp-fade--l { left: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }

  /* shared tier atoms */
  .credits { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; background: #0055ED; border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; font-family: inherit; font-size: 14px; font-weight: 500; height: 40px; border-radius: 6px; cursor: pointer; background: #fff; border: 1px solid #171717; color: #171717; }
  .btn:hover { background: #f5f5f5; }
  .btn--gold { border: 0; background: linear-gradient(90deg,#dcb05e 0%,#ca9e4c 30%,#c39643 65%,#b8893a 100%); color: #fff; }
  .btn--gold:hover { filter: brightness(1.05); }

  /* 01 mini cards */
  .v1-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .v1-card { border: 1px solid rgba(10,25,37,0.12); border-radius: 8px; padding: 14px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  .v1-card--gold { border-color: #e8d3a3; background: linear-gradient(150deg,#fff 30%,#fdf6e4 100%); box-shadow: 0 6px 16px -8px rgba(184,137,58,0.4); }
  .v1-badge { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); }
  .v1-plan { font-size: 13px; font-weight: 600; }
  .v1-card .credits { font-size: 19px; }
  .v1-price { font-size: 11.5px; color: #6b6b6b; text-align: center; }
  .v1-card .btn { width: 100%; height: 32px; font-size: 13px; }

  /* 02 comparison strip */
  .v2-table { width: 100%; border: 1px solid rgba(10,25,37,0.1); border-radius: 8px; overflow: hidden; border-collapse: separate; border-spacing: 0; }
  .v2-table td, .v2-table th { padding: 8px 14px; font-size: 13px; text-align: center; border-left: 1px solid rgba(10,25,37,0.07); }
  .v2-table td:first-child, .v2-table th:first-child { border-left: 0; text-align: left; color: #6b6b6b; font-weight: 400; font-size: 12px; width: 104px; }
  .v2-table th { font-weight: 600; font-size: 13.5px; padding-top: 10px; }
  .v2-table .gold-col { background: #fdf6e4; }
  .v2-table .btn { height: 30px; font-size: 12.5px; width: 100%; }
  .v2-tag { display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #0055ED; margin-left: 5px; }

  /* 03 stacked rows */
  .v3-row { display: flex; align-items: center; gap: 12px; border: 1px solid rgba(10,25,37,0.1); border-radius: 8px; padding: 7px 14px; }
  .v3-row + .v3-row { margin-top: 7px; }
  .v3-row--gold { border-color: #e8d3a3; background: linear-gradient(90deg,#fff 40%,#fdf6e4 100%); }
  .v3-plan { font-size: 13.5px; font-weight: 600; width: 44px; }
  .v3-row .credits { font-size: 14px; width: 104px; }
  .v3-note { font-size: 12px; color: #6b6b6b; flex: 1; white-space: nowrap; }
  .v3-row .btn { height: 31px; font-size: 12.5px; padding: 0 16px; }

  /* 04 gold hero center */
  .v4-row { display: flex; align-items: stretch; gap: 12px; justify-content: center; }
  .v4-side { flex: 1; border: 1px solid rgba(10,25,37,0.1); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; }
  .v4-hero { flex: 1.3; border: 1.5px solid #e0c98e; border-radius: 10px; padding: 16px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: linear-gradient(160deg,#fffdf7 20%,#f7ecd2 100%); box-shadow: 0 10px 24px -10px rgba(184,137,58,0.45); position: relative; margin-top: -6px; }
  .v4-hero .badge { position: absolute; top: -10px; }
  .v4-side .credits { font-size: 16px; }
  .v4-hero .credits { font-size: 22px; }
  .v4-side .btn, .v4-hero .btn { width: 100%; height: 32px; font-size: 13px; }
  .v4-mini { font-size: 11px; color: #8a8a8a; white-space: nowrap; }

  /* 05 segmented toggle */
  .v5-seg { display: grid; grid-template-columns: repeat(3,1fr); background: #f2f2f2; border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .v5-opt { border: 0; border-radius: 6px; background: transparent; font-family: inherit; padding: 7px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6b6b6b; }
  .v5-opt .credits { font-size: 14px; color: #171717; }
  .v5-opt small { font-size: 11px; }
  .v5-opt.on { background: #fff; box-shadow: 0 1px 4px rgba(10,25,37,0.14); }
  .v5-opt.on small { color: #b8893a; font-weight: 600; }
  .v5-cta { display: flex; align-items: center; gap: 14px; }
  .v5-cta .btn { flex: 0 0 210px; height: 38px; }
  .v5-hint { font-size: 12px; color: #6b6b6b; }

  /* 06 credit ladder */
  .v6-row { display: flex; align-items: flex-end; gap: 16px; }
  .v6-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .v6-bar { width: 100%; border-radius: 8px 8px 0 0; background: #eef2f6; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px 0 7px; }
  .v6-col:nth-child(1) .v6-bar { height: 60px; }
  .v6-col:nth-child(2) .v6-bar { height: 104px; background: linear-gradient(180deg,#fdf6e4,#f3e3ba); }
  .v6-col:nth-child(3) .v6-bar { height: 82px; }
  .v6-bar .credits { font-size: 16px; }
  .v6-col .btn { width: 100%; height: 32px; font-size: 12.5px; margin-top: -1px; border-radius: 0 0 8px 8px; }
  .v6-badge-row { height: 20px; }

  /* 07 inline chips */
  .v7-row { display: flex; flex-direction: column; gap: 10px; }
  .v7-line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .v7-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(10,25,37,0.14); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; background: #fff; font-family: inherit; }
  .v7-chip .credits { font-size: 13px; }
  .v7-chip small { color: #6b6b6b; font-weight: 400; }
  .v7-chip.gold { border-color: #d9b96b; background: #fdf6e4; box-shadow: 0 0 0 3px rgba(217,185,107,0.18); }
  .v7-foot { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  .v7-foot .btn { padding: 0 22px; height: 36px; }

  /* 08 radio list + summary */
  .v8-wrap { display: flex; gap: 18px; }
  .v8-list { flex: 1.2; display: flex; flex-direction: column; }
  .v8-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .v8-item.on { border-color: #e8d3a3; background: #fdf9ee; }
  .v8-radio { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #b3b3b3; flex-shrink: 0; position: relative; }
  .v8-item.on .v8-radio { border-color: #b8893a; }
  .v8-item.on .v8-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #b8893a; }
  .v8-plan { font-size: 13.5px; font-weight: 600; width: 44px; }
  .v8-item .credits { font-size: 13px; color: #525252; font-weight: 500; }
  .v8-item .badge { margin-left: auto; }
  .v8-panel { flex: 1; border: 1px solid rgba(10,25,37,0.1); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 7px; background: #fafafa; }
  .v8-panel .row { display: flex; justify-content: space-between; font-size: 12.5px; color: #525252; }
  .v8-panel .row b { color: #171717; font-weight: 600; }
  .v8-panel .btn { margin-top: 6px; height: 36px; }
</style>
</head>

<div class="page">
  <h1>Feature modal · plan row, 8 ways · in the actual modal</h1>
  <p class="page-sub">Each variant is the full Sep 2026 feature modal with the tier row swapped. Feature rail is clickable in every one. Reply with a pick (e.g. "the ladder one") to branch round 2.</p>

</div>

          <div class="row"><span>Plan</span><b>Gold</b></div>
          <div class="row"><span>Credits</span><b>25,000 / mo</b></div>
          <div class="row"><span>Price</span><b>$50/mo</b></div>
          <button class="btn btn--gold">Get Gold</button>
        </div>
      </div>` },
  ];

  const host = document.getElementById('variants');
  const tpl = document.getElementById('tpl-modal');

  VARIANTS.forEach((v) => {
    const node = tpl.content.cloneNode(true);
    const root = node.querySelector('.variant');
    root.querySelector('.v-label').textContent = v.label;
    root.querySelector('.dp-tier-zone').innerHTML = v.html;

    const left = root.querySelector('.dp-left');
    FEATURES.forEach((f, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dp-feat-item' + (i === 0 ? ' is-active' : '');
      b.dataset.key = f.key;
      const dots = f.dots.map((d) => '<span class="dp-dot dp-dot--' + d + '"></span>').join('');
      b.innerHTML =
        '<i class="' + (i === 0 ? 'ph-fill ' : 'ph ') + f.icon + '"></i>' +
        '<span class="txt"><span class="row"><span class="lbl">' + f.label + '</span>' +
        (dots ? '<span class="dp-dots">' + dots + '</span>' : '') +
        '</span><span class="sub"></span>' +
        (f.dots.length ? '<span class="chips">' + f.dots.map((d) => '<span class="dp-chip dp-chip--' + d + '">' + d.toUpperCase() + '</span>').join('') + '</span>' : '') +
        '</span>';
      left.appendChild(b);
    });

    const track = root.querySelector('.sp-track');
    track.innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
      '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
    ).join('');

    const preview = root.querySelector('.dp-preview');
    const items = Array.from(left.querySelectorAll('.dp-feat-item'));

    function activate(item) {
      const f = FEATURES.find((x) => x.key === item.dataset.key);
      items.forEach((it) => {
        const on = it === item;
        it.classList.toggle('is-active', on);
        const ic = FEATURES.find((x) => x.key === it.dataset.key).icon;
        it.querySelector('i').className = (on ? 'ph-fill ' : 'ph ') + ic;
      });
      item.querySelector('.sub').textContent = DESCS[f.key];
      preview.innerHTML = f.video
        ? '<video autoplay loop muted playsinline><source src="assets/feature-modal/' + f.video + '.webm" type="video/webm" /><source src="assets/feature-modal/' + f.video + '.mp4" type="video/mp4" /></video>'
        : '<img src="assets/feature-modal/' + f.img + '" alt="" />';
    }
    items.forEach((it) => it.addEventListener('click', () => activate(it)));
    activate(items[0]);

    host.appendChild(node);
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
