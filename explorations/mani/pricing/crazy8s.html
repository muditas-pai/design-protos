<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>crazy8s · Table bottom options · Round 7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; padding: 48px 24px 120px; }
  .page { width: 1042px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: #666; margin-bottom: 40px; max-width: 720px; }
  .variant { margin-bottom: 64px; }
  .v-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5f6b76; margin-bottom: 12px; }
  .backdrop { background: rgba(10,25,37,0.45); border-radius: 8px; padding: 32px; display: flex; justify-content: center; }

  .dp-stack { position: relative; }
  .dp-close { position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid rgba(10,25,37,0.12); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(10,25,37,0.15); z-index: 2; font-size: 14px; color: #171717; }
  .dp-box { position: relative; width: 978px; height: 620px; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.18); display: grid; grid-template-rows: 1fr 58px; }
  .dp-main { padding: 22px 30px 6px; overflow: auto; }
  .tb-title { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 14px; }

  .dp-footer { border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 34px; padding: 0 30px; overflow: hidden; }
  .dp-footer .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #171717; white-space: nowrap; }
  .dp-footer .loved i { color: #e02d2d; font-size: 15px; }
  .sp-wrap { position: relative; overflow: hidden; flex: 1; height: 100%; display: flex; align-items: center; }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: flex; align-items: center; gap: 32px; width: max-content; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 26px; width: auto; object-fit: contain; }
  .sp-fade { pointer-events: none; position: absolute; top: 0; bottom: 0; width: 72px; }
  .sp-fade--l { left: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }

  /* shared table */
  .tb { width: 100%; border-collapse: separate; border-spacing: 0; }
  .tb th, .tb td { padding: 7px 12px; font-size: 13px; text-align: center; vertical-align: middle; }
  .tb td:first-child, .tb th:first-child { text-align: left; padding-left: 0; }
  .tb td:first-child { font-weight: 500; color: #171717; white-space: nowrap; }
  .tb td:first-child i { font-size: 15px; margin-right: 9px; vertical-align: -2px; color: #5f6b76; }
  .tb tbody tr + tr td { border-top: 1px solid rgba(10,25,37,0.06); }
  .tb .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tb .lock { color: #9aa4ad; font-size: 12px; white-space: nowrap; }
  .tb .lock i { font-size: 13px; vertical-align: -2px; margin-right: 4px; }
  .tb .yes { color: #0a8a3a; font-size: 15px; }
  .tb .no { color: #c2c9cf; font-size: 14px; }
  .tb td.hi, .tb th.hi { background: #fdf3da; }
  .tb thead th.hi { border-radius: 10px 10px 0 0; }
  .tb tbody tr:last-child td.hi { border-radius: 0 0 10px 10px; }
  .tb-head { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 2px 6px; }
  .tb-head .p-name { font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .tb-head .p-name i { font-size: 17px; }
  .tb-head .btn { width: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-family: inherit; font-size: 12px; font-weight: 500; height: 32px; border-radius: 7px; cursor: pointer; background: #fff; border: 1px solid #171717; color: #171717; }
  .btn:hover { background: #f5f5f5; }
  .btn--gold { border: 0; background: linear-gradient(90deg,#dcb05e 0%,#ca9e4c 30%,#c39643 65%,#b8893a 100%); color: #fff; }
  .btn--gold:hover { filter: brightness(1.05); }
  .btn--dark { border: 0; background: #171717; color: #fff; }
  .btn--dark:hover { background: #000; }
  .try-cap { font-size: 10px; color: #9aa4ad; }

  /* stacked price */
  .p-stack { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .p-stack s { font-weight: 400; font-size: 11.5px; color: #9aa4ad; }
  .p-big { font-size: 20px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 4px; }
  .p-mo { font-size: 11px; font-weight: 400; color: #6b6b6b; }
  .p-per { font-size: 10.5px; color: #6b6b6b; font-weight: 400; }

  /* bottom treatments */
  .tb-note { font-size: 11.5px; color: #6b6b6b; margin-top: 10px; line-height: 16px; }
  .bt-chips { display: flex; gap: 10px; margin-top: 12px; }
  .bt-chips .chip { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; font-weight: 500; color: #444; background: #f6f7f9; border-radius: 8px; padding: 9px 12px; }
  .bt-chips .chip i { font-size: 15px; color: #5f6b76; }
  .bt-bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: #f6f7f9; border-radius: 10px; padding: 11px 16px; font-size: 12.5px; color: #444; }
  .bt-bar i.lead { font-size: 19px; color: #0a8a3a; flex: none; }
  .bt-bar .bar-link { margin-left: auto; color: #0055ED; font-weight: 500; white-space: nowrap; text-decoration: none; }
  .bt-bar .bar-link:hover { text-decoration: underline; }
  .bt-offer { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: #fdf3da; border: 1px solid rgba(201,147,42,0.3); border-radius: 10px; padding: 11px 16px; font-size: 12.5px; color: #5b4a1e; }
  .bt-offer i.lead { font-size: 19px; color: #b8893a; flex: none; }
  .bt-offer b { font-weight: 600; }
  .bt-offer .timer { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; color: #8a5b00; background: #fff; border-radius: 7px; padding: 4px 10px; white-space: nowrap; }
  .bt-faq { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 14px; font-size: 12px; }
  .bt-faq a { color: #0055ED; font-weight: 500; text-decoration: none; }
  .bt-faq a:hover { text-decoration: underline; }
  .bt-faq .dot { color: #c2c9cf; }
  .bt-quote { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 16px; border-left: 3px solid #fdf3da; background: #fffdf6; border-radius: 0 10px 10px 0; }
  .bt-quote .q-txt { font-size: 12.5px; color: #444; font-style: italic; line-height: 17px; }
  .bt-quote .q-who { font-size: 11px; color: #8a949d; white-space: nowrap; margin-left: auto; }
  .bt-incl { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 13px; font-size: 12px; color: #444; }
  .bt-incl .lead-txt { font-weight: 600; color: #171717; }
  .bt-incl .inc { display: inline-flex; align-items: center; gap: 5px; }
  .bt-incl .inc i { color: #0a8a3a; font-size: 14px; }
</style>
</head>
<body>
<div class="page">
  <h1>crazy8s · Round 7 · Bottom of the table, 7 ways</h1>
  <p class="page-sub">Branching off pick 02 (icon next to plan name, stacked INR prices). Table stays identical; only the strip under the table changes. Variant 1 is the current plain note.</p>
  <div id="variants"></div>
</div>

<script>
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  const yes = '<i class="ph-fill ph-check-circle yes"></i>';
  const no = '<i class="ph ph-x no"></i>';
  const lock = '<span class="lock"><i class="ph ph-lock-simple"></i>Unlocks on upgrade</span>';

  const GLYPH_AFTER = { pro: 'ph-rocket-launch', gold: 'ph-sketch-logo', team: 'ph-users-three' };
  const icoAfter = (t) => '<i class="ph ' + GLYPH_AFTER[t] + '"></i>';
  const pStack = (b, o) => '<span class="p-stack"><s>' + b + '/mo</s><span class="p-big">' + o + '<span class="p-mo">/mo</span></span><span class="p-per">when you buy today</span></span>';

  const headCell = (plan, t, b, o, opts) => {
    const g = opts && opts.gold;
    return '<th class="' + ((opts && opts.cls) || '') + '"><div class="tb-head">' +
      '<span class="p-name">' + plan + ' ' + icoAfter(t) + '</span>' + pStack(b, o) +
      '<button type="button" class="btn ' + (g ? 'btn--gold' : 'btn--dark') + '">Buy now and save 20%</button>' +
      '<button type="button" class="btn" style="margin-top:2px">Try free for 7 days</button>' +
      '<span class="try-cap">no discount, full price later</span>' +
      '</div></th>';
  };
  const r = (icon, name, a, b, c) =>
    '<tr><td><i class="ph ' + icon + '"></i>' + name + '</td>' +
    '<td>' + a + '</td><td class="hi">' + b + '</td><td>' + c + '</td></tr>';

  const bodyRows = () =>
    r('ph-star-four', 'Credits during your trial', '<span class="num">500</span>', '<span class="num">1,000</span>', '<span class="num">1,200</span>') +
    r('ph-stack-plus', 'Credits when you upgrade', '<span class="num">5,000</span>', '<span class="num">25,000</span>', '<span class="num">30,000</span>') +
    r('ph-export', 'Export to PPT', lock, lock, lock) +
    r('ph-swatches', 'Brand kit', yes, yes, yes) +
    r('ph-book-open', 'Shared knowledge base', no, yes, yes) +
    r('ph-users-three', 'Collaborations', no, no, yes) +
    r('ph-sparkle', 'Ultra/Pro AI models', yes, yes, yes) +
    r('ph-chart-bar', 'Analytics', yes, yes, yes);

  const TABLE =
    '<div class="tb-title">Start your 7-day free trial today</div>' +
    '<table class="tb"><thead><tr><th></th>' +
    headCell('Pro', 'pro', '&#8377;25,000', '&#8377;20,000') +
    headCell('Gold', 'gold', '&#8377;62,500', '&#8377;50,000', { gold: true, cls: 'hi' }) +
    headCell('Team', 'team', '&#8377;1,87,500', '&#8377;1,50,000') +
    '</tr></thead><tbody>' + bodyRows() + '</tbody></table>';

  const BOTTOMS = [
    { label: '01 · Pick: plain note', html:
      '<div class="tb-note">Your trial comes with its own credits for 7 days. Upgrade any time and your plan\'s full credits land in your workspace, and Export to PPT unlocks. The 20% discount applies only when you buy today.</div>' },

    { label: '02 · Reassurance chips: three quick facts', html:
      '<div class="bt-chips">' +
      '<span class="chip"><i class="ph ph-calendar-x"></i>Cancel anytime in your trial</span>' +
      '<span class="chip"><i class="ph ph-stack-plus"></i>Full credits added on upgrade</span>' +
      '<span class="chip"><i class="ph ph-seal-percent"></i>20% off only when you buy today</span>' +
      '</div>' },

    { label: '03 · Guarantee bar with help link', html:
      '<div class="bt-bar"><i class="ph-fill ph-shield-check lead"></i>' +
      '<span>Try any plan free for 7 days, cancel anytime. Upgrade and your plan\'s full credits land in your workspace.</span>' +
      '<a class="bar-link" href="#">Questions? Talk to us</a></div>' },

    { label: '04 · Offer strip with countdown', html:
      '<div class="bt-offer"><i class="ph-fill ph-gift lead"></i>' +
      '<span>Your <b>20% discount</b> is reserved for the next hour. It applies only when you buy today, trials renew at full price.</span>' +
      '<span class="timer js-timer">59:56</span></div>' },

    { label: '05 · FAQ links row', html:
      '<div class="bt-faq"><a href="#">What happens after my trial?</a><span class="dot">·</span>' +
      '<a href="#">When am I charged?</a><span class="dot">·</span>' +
      '<a href="#">Can I switch plans later?</a></div>' },

    { label: '06 · Social proof quote', html:
      '<div class="bt-quote"><span class="q-txt">"We bought on day two. The 20% off made it an easy call, and our whole team was presenting by Friday."</span>' +
      '<span class="q-who">Priya S., Design lead</span></div>' },

    { label: '07 · Everything-included strip', html:
      '<div class="bt-incl"><span class="lead-txt">Every plan includes:</span>' +
      '<span class="inc"><i class="ph-fill ph-check-circle"></i>Unlimited decks</span>' +
      '<span class="inc"><i class="ph-fill ph-check-circle"></i>AI images</span>' +
      '<span class="inc"><i class="ph-fill ph-check-circle"></i>100+ templates</span>' +
      '<span class="inc"><i class="ph-fill ph-check-circle"></i>Priority support</span>' +
      '</div>' },
  ];

  const track = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');

  document.getElementById('variants').innerHTML = BOTTOMS.map((v) =>
    '<div class="variant"><div class="v-label">' + v.label + '</div>' +
    '<div class="backdrop"><div class="dp-stack">' +
    '<button type="button" class="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>' +
    '<div class="dp-box"><div class="dp-main">' + TABLE + v.html + '</div>' +
    '<div class="dp-footer"><span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>' +
    '<span class="sp-wrap"><span class="sp-track">' + track + '</span>' +
    '<span class="sp-fade sp-fade--l"></span><span class="sp-fade sp-fade--r"></span></span></div>' +
    '</div></div></div></div>'
  ).join('');

  // live countdown on the offer strip
  let left = 59 * 60 + 56;
  setInterval(() => {
    left = Math.max(0, left - 1);
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const s = String(left % 60).padStart(2, '0');
    document.querySelectorAll('.js-timer').forEach((el) => { el.textContent = m + ':' + s; });
  }, 1000);
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
