        '<div>' + ROWS_TRY + '</div>' +
        '<div class="band"><div class="b-txt"><b>Skip the trial, save 20% today</b><span>Instant discount on any plan when you buy now. Pro $16, Gold $40, Team $48.</span></div>' +
        '<button type="button" class="btn">Buy at 20% off</button></div>' },

    { label: '05 · Two-path choice cards', tier:
        '<div class="path">' +
        '<div class="path-card"><b><i class="ph ph-calendar-check"></i>Start free trial</b>' +
        '<span class="p-sub">Full access to every plan feature for 7 days. $0 due today, cancel anytime.</span>' +
        '<span class="p-price">$0 <span style="font-size:12px;font-weight:400;color:#6b6b6b">due today</span></span>' +
        '<button type="button" class="btn">Start 7-day free trial</button></div>' +
        '<div class="path-card hot"><span class="path-tag">Save 20% today</span><b><i class="ph ph-lightning"></i>Buy now</b>' +
        '<span class="p-sub">Skip the trial, get 20% off instantly. Pro, Gold or Team.</span>' +
        '<span class="p-price"><s>$20</s>from $16/mo</span>' +
        '<button type="button" class="btn btn--blue">Buy at 20% off</button></div>' +
        '</div>' },

    { label: '06 · Both prices on every row', tier:
        '<div>' +
        '<div class="v3-row"><span class="v3-plan">Pro</span>' + chip('5,000') + '<span class="bp-price"><span class="bp-now"><s>$20</s>$16/mo</span><span class="bp-if">if you buy today</span></span><button type="button" class="btn">Try Pro free</button></div>' +
        '<div class="v3-row"><span class="v3-plan">Gold</span>' + chip('25,000') + '<span class="bp-price"><span class="bp-now"><s>$50</s>$40/mo</span><span class="bp-if">if you buy today</span></span><button type="button" class="btn btn--gold">Try Gold free</button></div>' +
        '<div class="v3-row"><span class="v3-plan">Team</span>' + chip('30,000') + '<span class="bp-price"><span class="bp-now"><s>$60</s>$48/mo</span><span class="bp-if">if you buy today</span></span><button type="button" class="btn">Try Team free</button></div>' +
        '</div><div class="bp-cap">20% instant discount locks in when you buy today. Or try free first at full price later.</div>' },

    { label: '07 · Buy-first with timer, trial as fallback (click link)', buyFirst: true, tier:
        '<div>' + ROWS_SWAP + '</div>' +
        '<span class="bf-link">Not ready to buy? <a href="#">Start your 7-day free trial instead</a></span>' },

    { label: '08 · Skip-trial checkbox (tick it)', tier:
        '<label class="skip"><input type="checkbox" class="js-skip" />' +
        '<span class="s-txt">Skip the trial, apply my <b>20% instant discount</b> now</span>' +
        '<span class="s-save">SAVE 20%</span></label>' +
        '<div>' + ROWS_SWAP + '</div>',
      swapTitle: true },

    { label: '09 · Comparison table: buy now vs trial per plan', table: true, tier: (() => {
        const head = (plan, base, off, gold, hi) =>
          '<th' + (hi ? ' class="hi"' : '') + '><div class="tb-head">' +
          '<span class="p-name">' + (gold ? '<i class="ph-fill ph-crown" style="color:#c9932a"></i>' : '') + plan + '</span>' +
          '<span class="p-price"><s>$' + base + '</s>$' + off + '/mo<span class="p-per"> · 20% off</span></span>' +
          '<button type="button" class="btn ' + (gold ? 'btn--gold' : 'btn--dark') + '">Buy now, 20% off</button>' +
          '<button type="button" class="b-try">Start free trial · full price later</button>' +
          '</div></th>';
        const r = (icon, name, a, b, c) =>
          '<tr><td><i class="ph ' + icon + '"></i>' + name + '</td><td>' + a + '</td><td class="hi">' + b + '</td><td>' + c + '</td></tr>';
        const yes = '<i class="ph-fill ph-check-circle yes"></i>';
        const no = '<i class="ph ph-x no"></i>';
        const lock = '<span class="lock"><i class="ph ph-lock-simple"></i>Full plan only</span>';
        return '<div class="tb-title">Start your 7-day free trial today</div>' +
          '<table class="tb"><thead><tr><th></th>' +
          head('Pro', 20, 16) + head('Gold', 50, 40, true, true) + head('Team', 60, 48) +
          '</tr></thead><tbody>' +
          r('ph-star-four', 'Trial credits (7 days)', '<span class="num">500</span>', '<span class="num">1,000</span>', '<span class="num">1,200</span>') +
          r('ph-stack-plus', 'Full credits on upgrade', '<span class="num">5,000</span>', '<span class="num">25,000</span>', '<span class="num">30,000</span>') +
          r('ph-export', 'Export to PPT', lock, lock, lock) +
          r('ph-swatches', 'Brand kit', yes, yes, yes) +
          r('ph-book-open', 'Shared knowledge base', no, yes, yes) +
          r('ph-users-three', 'Collaborations', no, no, yes) +
          r('ph-sparkle', 'Ultra/Pro AI models', yes, yes, yes) +
          r('ph-chart-bar', 'Analytics', yes, yes, yes) +
          '</tbody></table>' +
          '<div class="tb-note">Trial credits last your 7-day trial. When you upgrade, your plan\'s full credits are added to your workspace. Export to PPT unlocks on the full plan.</div>';
      })() },
  ];

  const host = document.getElementById('variants');
  const tpl = document.getElementById('tpl-modal');

  VARIANTS.forEach((v) => {
    const node = tpl.content.cloneNode(true);
    const root = node.querySelector('.variant');
    root.querySelector('.v-label').textContent = v.label;
    const box = root.querySelector('.dp-box');
    const stack = root.querySelector('.dp-stack');
    const title = root.querySelector('.dp-title');
    root.querySelector('.dp-tier-zone').innerHTML = v.tier;
    if (v.table) {
      box.classList.add('is-table');
      host.appendChild(node);
      return;
    }

    const setMode = (buy) => {
      box.classList.toggle('buy-mode', buy);
      if (v.swapTitle || v.buyFirst) {
        title.innerHTML = buy ? BUY_TITLE : TRIAL_TITLE;
        title.classList.remove('swap');
        void title.offsetWidth;
        title.classList.add('swap');
      }
    };

    if (v.buyFirst) {
      title.innerHTML = BUY_TITLE;
      box.classList.add('buy-mode');
      stack.classList.add('show-pill');
      const timerEl = root.querySelector('.dp-timer');
      let secs = 59 * 60 + 56;
      const tick = () => {
        timerEl.textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
        if (secs-- > 0) setTimeout(tick, 1000);
      };
      tick();
      root.querySelector('.bf-link a').addEventListener('click', (e) => {
        e.preventDefault();
        setMode(false);
        stack.classList.remove('show-pill');
      });
    } else {
      title.textContent = TRIAL_TITLE;
    }

    const swLink = root.querySelector('.js-buy');
    if (swLink) swLink.addEventListener('click', () => setMode(true));
    const segTrial = root.querySelector('.js-seg-trial');
    const segBuy = root.querySelector('.js-seg-buy');
    if (segTrial && segBuy) {
      segTrial.addEventListener('click', () => { segTrial.classList.add('on'); segBuy.classList.remove('on'); setMode(false); });
      segBuy.addEventListener('click', () => { segBuy.classList.add('on'); segTrial.classList.remove('on'); setMode(true); });
    }
    const skip = root.querySelector('.js-skip');
    if (skip) skip.addEventListener('change', () => setMode(skip.checked));

    const left = root.querySelector('.dp-left');
    FEATURES.forEach((f, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'dp-feat-item' + (i === 0 ? ' is-active' : '');
      b.dataset.key = f.key;
      const dots = f.dots.map((d) => '<span class="dp-dot dp-dot--' + d + '"></span>').join('');
      b.innerHTML =
        '<i class="' + (i === 0 ? 'ph-fill ' : 'ph ') + f.icon + '"></i>' +
        '<span class="txt"><span class="row"><span class="lbl">' + f.label + '</span>' +
        (dots ? '<span class="dp-dots">' + dots + '</span>' : '') +
        '</span><span class="sub"></span></span>';
      left.appendChild(b);
    });

    const track = root.querySelector('.sp-track');
    track.innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
      '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
    ).join('');

    const preview = root.querySelector('.dp-preview');
    const items = Array.from(left.querySelectorAll('.dp-feat-item'));
    let currentKey = null;
    let inView = false;
    function renderPreview() {
      const f = FEATURES.find((x) => x.key === currentKey);
      if (!inView || !f) { preview.innerHTML = ''; return; }
      preview.innerHTML = f.video
        ? '<video autoplay loop muted playsinline><source src="assets/feature-modal/' + f.video + '.webm" type="video/webm" /><source src="assets/feature-modal/' + f.video + '.mp4" type="video/mp4" /></video>'
        : '<img src="assets/feature-modal/' + f.img + '" alt="" />';
    }
    function activate(item) {
      const f = FEATURES.find((x) => x.key === item.dataset.key);
      items.forEach((it) => {
        const on = it === item;
        it.classList.toggle('is-active', on);
        const ic = FEATURES.find((x) => x.key === it.dataset.key).icon;
        it.querySelector('i').className = (on ? 'ph-fill ' : 'ph ') + ic;
      });
      item.querySelector('.sub').textContent = DESCS[f.key];
      currentKey = f.key;
      renderPreview();
    }
    items.forEach((it) => it.addEventListener('click', () => activate(it)));
    // mount media only while this modal is near the viewport, so 8 videos
    // don't fight over the browser's per-host connection limit
    new IntersectionObserver((entries) => {
      entries.forEach((e) => { inView = e.isIntersecting; renderPreview(); });
    }, { rootMargin: '200px 0px' }).observe(box);
    activate(items[0]);

    host.appendChild(node);
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
