<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plan and billing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<style>
  /* Settings > Plan and billing, and the cancel-renewal flow, rebuilt from pitchdeckdoclist:
     listing/core/screens/views/settings/Settings.jsx (shell), settings/billings/BillingSettings.jsx,
     CancelRenewalFlow.jsx, CreditHistoryPopup.jsx, TrialActivatePopup, NudgeFeaturePopup (the
     cancel offer, pricingNew/upgradePopup) and ExpiryBanner. Copy from en.json. Every state and
     every step has its own link (?state=…&open=…&step=…). Nothing navigates. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --surface: #ffffff; --canvas: #f8f8fb; --sunken: #f3f3f7; --line: #e4e4ec; --line2: #d4d4de;
    --brand: #3427ff; --brand-hover: #2a1fd6; --tint: #ecebff;
    --ink: #14141f; --ink2: #4e4e5e; --ink3: #6c6c7c; --ink-off: #a3a3b0; --gray-500: #6b7280;
    --good: #15803d; --good-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --scrim: rgba(16,12,60,0.45); --navy: #0b0a3a;
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
  i[class*="ph-"] { display: block; line-height: 1; font-style: normal; }
  svg.hi { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .tab { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }

  /* ---------- app shell (dashboard host) ---------- */
  .app { display: flex; height: 100vh; }
  .expiry { position: fixed; inset: 0 0 auto 0; z-index: 60; display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; background: var(--navy); color: #fff; font-size: 12px; }
  .expiry[hidden] { display: none; }
  .expiry .crown { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: linear-gradient(135deg, #3427ff, #3566fe); }
  .expiry .crown i { font-size: 15px; }
  .expiry button { border: 0; background: none; color: #fff; font-weight: 600; text-decoration: underline; cursor: pointer; }
  body.expired .app { padding-top: 40px; }
  aside.side { display: flex; flex-direction: column; gap: 4px; width: 256px; flex: none; padding: 12px; border-right: 1px solid var(--line); background: var(--surface); }
  .ws { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 6px; }
  .ws .av { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 700; font-size: 13px; }
  .ws b { display: block; font-size: 14px; font-weight: 600; }
  .ws small { display: block; font-size: 12px; line-height: 16px; color: var(--ink3); }
  .ws i { margin-left: auto; color: var(--ink3); }
  .newdeck { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; margin: 8px 0; border: 0; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 500; cursor: pointer; }
  .snav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--ink2); text-align: left; cursor: pointer; }
  .snav:hover { background: var(--sunken); color: var(--ink); }
  .snav i { font-size: 20px; }
  .side .grp { margin: 14px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
  .col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px; height: 56px; flex: none; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); }
  .search { display: flex; align-items: center; gap: 8px; width: min(448px, 100%); height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); color: var(--ink3); }
  .search kbd { margin-left: auto; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; font: 500 11px 'Inter', sans-serif; }
  .meter { display: flex; align-items: center; gap: 8px; margin-left: auto; margin-right: 8px; font-size: 13px; color: var(--ink2); }
  .meter .tr { width: 48px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .meter .tr span { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
  .meter b { font-weight: 600; color: var(--ink); }
  .ib { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 6px; background: none; color: var(--ink2); cursor: pointer; }
  .ib:hover { background: var(--sunken); color: var(--ink); }
  .ib i { font-size: 20px; }
  .me { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: 4px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; }
  .scroll { flex: 1; overflow-y: auto; }

  /* ---------- Settings shell (Settings.jsx) ---------- */
  main.set { width: 100%; max-width: 1152px; margin: 0 auto; padding: 32px 24px 96px; }
  main.set h1 { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; }
  .sgrid { display: grid; grid-template-columns: 220px 1fr; gap: 24px; margin-top: 24px; }
  .setnav { display: flex; flex-direction: column; }
  .setnav .g { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .setnav .gl { padding: 0 10px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-500); }
  .setnav button { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--ink2); text-align: left; cursor: pointer; }
  .setnav button:hover { background: var(--sunken); color: var(--ink); }
  .setnav button.on { background: var(--sunken); color: var(--ink); font-weight: 500; }
  .setnav svg { width: 20px; height: 20px; }
  .content { display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 768px; padding-bottom: 80px; animation: up .18s ease; }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } }

  /* ds primitives */
  section.sec { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .sh { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sh h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.005em; }
  .sh .d { margin-top: 2px; color: var(--ink2); }
  .sh .d s { color: var(--gray-500); }
  .sh .r { display: flex; flex-wrap: wrap; gap: 8px; }
  .sb { margin-top: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
  .badge.brand { background: var(--tint); color: var(--brand); }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.neutral { background: var(--sunken); color: var(--ink2); }
  .badge svg { width: 12px; height: 12px; stroke-width: 2; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid transparent; border-radius: 6px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .btn.lg { height: 44px; padding: 0 20px; }
  .btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn.pri { background: var(--brand); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(16,12,60,0.2); }
  .btn.pri:hover { background: var(--brand-hover); }
  .btn.sec { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .btn.sec:hover { background: var(--sunken); border-color: rgba(108,108,124,0.4); }
  .btn.ghost { background: none; color: var(--ink2); }
  .btn.ghost:hover { background: var(--sunken); color: var(--ink); }
  .btn[disabled] { background: var(--sunken); border-color: transparent; color: var(--ink-off); box-shadow: none; cursor: not-allowed; }
  .btn .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 999px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* plan card body */
  .pbody { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .cap { font-size: 13px; line-height: 18px; color: var(--gray-500); }
  .disc { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
  .hold { position: relative; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--warn); }
  .hold svg { width: 14px; height: 14px; }
  .hold .why { display: inline-flex; border: 0; background: none; color: var(--warn); cursor: help; }
  .hold .tip { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: 300px; padding: 6px 8px; border-radius: 6px; background: var(--ink); color: var(--canvas); font-size: 12px; line-height: 16px; font-weight: 500; box-shadow: 0 8px 24px -6px rgba(16,12,60,0.16); opacity: 0; pointer-events: none; transition: opacity .15s ease .2s; }
  .hold .why:hover + .tip, .hold .why:focus-visible + .tip { opacity: 1; }
  .callout { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 6px; background: rgba(254,226,226,0.4); }
  .callout svg { width: 20px; height: 20px; fill: var(--bad); stroke: #fff; color: var(--bad); }
  .callout b { display: block; font-weight: 600; color: var(--bad); }
  .callout span { font-size: 13px; line-height: 18px; color: var(--ink2); }

  /* trial banner */
  .trial { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px; border: 1px solid rgba(52,39,255,0.3); border-radius: 12px; background: rgba(236,235,255,0.6); }
  .trial .tile { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: 6px; background: linear-gradient(135deg, #3427ff, #3566fe); color: #fff; }
  .trial .tile i { font-size: 20px; }
  .trial .tx { flex: 1; min-width: 240px; }
  .trial .tx b { display: block; font-weight: 600; }
  .trial .tx span { font-size: 13px; line-height: 18px; color: var(--ink2); }

  /* upgrade ladder (CreditPlansV2 redesign rows) */
  .ladder { display: flex; flex-direction: column; gap: 12px; }
  .prow { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; cursor: pointer; transition: border-color .15s ease; }
  .prow:hover { border-color: var(--line2); }
  .prow .tile { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: 6px; background: var(--tint); color: var(--brand); }
  .prow .tile svg { width: 20px; height: 20px; }
  .prow .mid { flex: 1; min-width: 0; }
  .prow .l1 { font-weight: 600; }
  .prow .l1 .dot { color: var(--gray-500); font-weight: 400; }
  .prow .l1 .cr { color: var(--brand); font-weight: 500; }
  .prow .l2 { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; color: var(--ink2); }
  .prow .l2 svg { width: 14px; height: 14px; color: var(--ink3); }
  .prow .pr { text-align: right; }
  .prow .pr b { font-size: 18px; line-height: 26px; font-weight: 600; }
  .prow .pr small { display: block; font-size: 12px; line-height: 16px; color: var(--gray-500); }
  .prow .chev { width: 20px; height: 20px; color: var(--ink-off); }

  /* invoices */
  table.inv { width: 100%; border-collapse: collapse; }
  table.inv td { padding: 10px 0; border-top: 1px solid var(--line); }
  table.inv tr:first-child td { border-top: 0; }
  table.inv td.dt { color: var(--ink2); }
  table.inv td.em { font-size: 13px; color: var(--gray-500); }
  table.inv td.am { text-align: right; padding-right: 16px; }
  table.inv td.st { width: 1%; }

  /* credits */
  .cmeter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .cmeter span { display: block; height: 100%; border-radius: 999px; background: var(--brand); animation: fill .8s cubic-bezier(.2,0,0,1); }
  @keyframes fill { from { width: 0; } }
  .crow { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--gray-500); }
  .cbtns { display: flex; gap: 8px; margin-top: 16px; }
  .need { margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-500); }
  ul.packs { list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  ul.packs li + li { border-top: 1px solid var(--line); }
  .pack { display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px 20px; border: 0; background: none; text-align: left; cursor: pointer; }
  .pack:hover { background: var(--sunken); }
  .pack img { width: 48px; height: 48px; object-fit: contain; }
  .pack .mid { flex: 1; }
  .pack .mid b { display: block; font-size: 18px; line-height: 26px; font-weight: 600; }
  .pack .mid span { color: var(--ink3); }
  .pack .pr { display: flex; align-items: center; gap: 10px; }
  .pack .pr s { color: var(--gray-500); }
  .pack .pr b { font-size: 24px; line-height: 32px; font-weight: 600; }
  .pack .chev { width: 24px; height: 24px; color: var(--ink-off); }

  /* ---------- ds Dialog ---------- */
  .ov { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--scrim); backdrop-filter: blur(2px); animation: fade .18s ease; }
  .ov[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .dlg { position: relative; width: 100%; max-height: calc(100vh - 24px); overflow-y: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 2px 6px rgba(16,12,60,0.08), 0 24px 64px -12px rgba(16,12,60,0.28); animation: pop .2s cubic-bezier(.2,0,0,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.985); } }
  .dlg .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 8px; }
  .dlg h3 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
  .dlg h3 .acc { color: var(--brand); }
  .dlg .ds { margin-top: 4px; color: var(--ink2); }
  .dlg .bd { padding: 12px 24px 24px; }
  .xb { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; margin: -4px -8px 0 0; border: 0; border-radius: 6px; background: none; color: var(--ink2); cursor: pointer; }
  .xb:hover { background: var(--sunken); color: var(--ink); }
  .xb svg { width: 20px; height: 20px; }
  .acts { display: flex; gap: 10px; margin-top: 24px; }
  .acts .btn { flex: 1 1 0; }
  .lrows { display: flex; flex-direction: column; gap: 8px; }
  .lrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .lrow .n { display: flex; align-items: center; gap: 12px; font-weight: 500; }
  .lrow img { width: 40px; height: 40px; object-fit: contain; }
  .reasons { display: flex; flex-direction: column; }
  .reasons label { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 6px; cursor: pointer; }
  .reasons label:hover { background: var(--sunken); }
  .reasons input { width: 16px; height: 16px; accent-color: var(--brand); }
  textarea.other { display: block; width: 100%; margin-top: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); font: inherit; resize: none; outline: none; }
  textarea.other:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(52,39,255,0.2); }

  /* credit history */
  table.hist { width: 100%; border-collapse: collapse; }
  table.hist th { padding: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); text-align: left; }
  table.hist td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.hist th:last-child, table.hist td:last-child { text-align: right; }
  table.hist td .ev { font-size: 15px; }
  table.hist td small { display: block; font-size: 13px; color: var(--ink3); }
  table.hist td.dt { color: var(--ink2); }

  /* trial activate */
  .sum { padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
  .sum .l { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: var(--ink2); }
  .sum .l b { color: var(--ink); font-weight: 500; }
  .sum .l.dis span:last-child { color: var(--good); }
  .sum hr { margin: 8px 0; border: 0; border-top: 1px solid var(--line); }
  .sum .l.tot { color: var(--ink); font-weight: 600; font-size: 16px; }
  .consent { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; font-size: 13px; line-height: 18px; color: var(--ink2); cursor: pointer; }
  .consent input { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--brand); }
  .consent a { color: var(--brand); }

  /* success */
  .won { padding: 40px; text-align: center; }
  .won .ok { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
  .won .ok svg { width: 32px; height: 32px; stroke-width: 2; }
  .won h3 { margin-top: 16px; }
  .won p { margin-top: 6px; color: var(--ink2); }
  .won .btn { width: 260px; margin-top: 24px; }
  .won .foot { margin-top: 14px; font-size: 13px; color: var(--gray-500); }

  /* ---------- the cancel offer: NudgeFeaturePopup shell (.pn-up-*) ---------- */
  .nf { position: relative; width: 940px; max-width: calc(100vw - 24px); height: 542px; overflow: hidden; border-radius: 16px; background: var(--surface); box-shadow: 0 2px 6px rgba(9,15,21,0.09), 0 24px 64px -12px rgba(9,15,21,0.28); animation: pop .2s cubic-bezier(.2,0,0,1); }
  .nf::after { content: ''; position: absolute; top: 0; left: 340px; width: 1px; height: 100%; background: var(--line); pointer-events: none; z-index: 2; }
  .nf .left { position: absolute; top: 30px; left: 30px; bottom: 30px; width: 280px; display: flex; flex-direction: column; gap: 16px; z-index: 3; }
  .nf h3 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; }
  .nf h3 .acc { color: var(--brand); }
  .nf .feats { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 4px; scrollbar-width: thin; -webkit-mask-image: linear-gradient(to bottom, black 0%, black 92%, transparent 100%); mask-image: linear-gradient(to bottom, black 0%, black 92%, transparent 100%); }
  .nf .fi { display: flex; align-items: center; gap: 10px; width: 100%; flex: none; padding: 8px 10px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; transition: background .15s ease; }
  .nf .fi:hover { background: var(--sunken); }
  .nf .fi.on { background: var(--sunken); font-weight: 500; cursor: default; }
  .nf .fi i { font-size: 20px; color: var(--ink2); }
  .nf .fi.on i { color: var(--brand); }
  .nf .prev { position: absolute; top: 0; left: 340px; width: 600px; height: 338px; background: var(--sunken) center/cover no-repeat; overflow: hidden; z-index: 1; }
  .nf .prev img { display: block; width: 100%; height: 100%; object-fit: contain; animation: fade .55s ease; }
  .nf .capn { position: absolute; left: 370px; top: 368px; width: 540px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
  .nf .capn b { font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -0.005em; }
  .nf .capn span { max-width: 460px; color: var(--ink2); }
  .nf .bar { position: absolute; left: 370px; right: 30px; top: 466px; height: 48px; display: flex; gap: 12px; z-index: 3; }
  .nf .cta { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 0; min-width: 0; height: 48px; border: 1px solid transparent; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .nf .cta.out { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .nf .cta.out:hover { background: var(--sunken); border-color: var(--line2); }
  .nf .cta.main { flex: 1.6 1 0; background: var(--brand); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(9,15,21,0.2); }
  .nf .cta.main:hover { background: var(--brand-hover); }

    x: 'M6 18 18 6M6 6l12 12',

  const hi = (k, cls) => '<svg class="hi' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + HI[k] + '"/></svg>';

  /* ---------- plans (pricingV2Config) and the states the billing screen supports ---------- */
  const PLANS = {
    basic: { name: 'Basic', annual: 48, credits: 1000, icon: 'bolt' },

    gold: { name: 'Gold', annual: 600, credits: 25000, icon: 'sparkles' },
  };
  // free: no billing record · paid: plan + renewal · cancel: renewal off · trial: 7-day Pro trial
  const STATES = {
    free:            { label: 'Free', plan: null },
    basic:           { label: 'Basic', plan: 'basic', cadence: 'year', balance: 640 },
    pro:             { label: 'Pro', plan: 'pro', cadence: 'year', balance: 3200 },
    'pro-discount':  { label: 'Pro, 20% applied', plan: 'pro', cadence: 'year', balance: 3200, discount: true },
    gold:            { label: 'Gold', plan: 'gold', cadence: 'year', balance: 18400 },
    team:            { label: 'Team', plan: 'pro', cadence: 'year', balance: 21000, team: true },
    weekly:          { label: 'Weekly', plan: 'pro', cadence: 'week', price: 2.99, credits: 100, balance: 60 },
    cancelled:       { label: 'Renewal off', plan: 'pro', cadence: 'year', balance: 3200, cancel: true },

  const S = { state: 'pro', dialog: null, step: null, reasons: [], other: '', feat: 0, consent: false, coupon: false, busy: null };

  const num = (n) => n.toLocaleString('en-US');
  const kfmt = (n) => (n >= 1000 ? (Math.round(n / 100) / 10).toString().replace(/\.0$/, '') + 'k' : String(Math.floor(n)));
  const TODAY = new Date(2026, 9, 30);
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

    const s = st();
    if (s.trial) return addDays(TODAY, s.hold ? 7 : 6);

  /* ---------- the billing screen (BillingSettings.jsx) ---------- */

      '<button type="button" class="btn pri" data-a="activate">Activate full plan now</button></div>';

      [paidOn()].concat(s.cadence === 'week' ? [addDays(paidOn(), -7)] : s.discount || s.cancel ? [] : []).map((d) =>
        '<tr><td class="dt">' + fmtShort(d) + '</td><td class="em">mani@company.com</td><td class="am tab">' + money(price()) + '</td><td class="st"><span class="badge good">Paid</span></td></tr>').join('') +
      '</tbody></table></div></section>';

  const ov = document.getElementById('ov');

    if (s.discount) return ['offer'];
    const steps = s.trial ? ['lose', 'feedback', 'offer'] : ['reminder', 'stays', 'feedback', 'offer'];
    return s.cadence === 'week' ? steps.filter((x) => x !== 'offer') : steps;
  };
  const keepRows = (badge) => [['icon_presentations.png', '12 Presentations'], ['icon_newdecks.png', 'Generating New Decks'], ['icon_credits.png', num(st().balance) + ' Unused Credits']]
    .map((r) => '<div class="lrow"><span class="n"><img src="assets/billing/' + r[0] + '" alt="" />' + r[1] + '</span>' + badge + '</div>').join('');
  const twoBtns = '<div class="acts"><button type="button" class="btn sec lg" data-a="cnext">Continue to cancel</button><button type="button" class="btn pri lg" data-a="keep">Keep my plan</button></div>';
  const dlg = (w, inner) => '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" style="max-width:' + w + 'px">' + inner + '</div>';
  const head = (t, d, x) => '<div class="hd"><div><h3 id="dlg-t">' + t + '</h3>' + (d ? '<p class="ds">' + d + '</p>' : '') + '</div>' + (x ? '<button type="button" class="xb" data-a="close" aria-label="Close">' + hi('x') + '</button>' : '') + '</div>';
  const FEATS = [
    ['ph-export', 'triggerbrandkit.jpg', 'Export presentations', 'Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.', 'export.png'],
    ['ph-swatches', 'triggerbrandkit.jpg', 'Brand Kit', 'Add your logo, fonts, and colors once, and every deck comes out on-brand.'],
    ['ph-book-open', 'triggerprojectknowledge.jpg', 'Shared knowledge base', 'Upload your files once. The AI references them on every slide, so your decks stay accurate and on-message.'],
    ['ph-users-three', 'triggercollaborations.jpg', 'Collaborations', 'Invite your team to co-edit decks in real time, leave comments, and assign slides to the right teammate.'],
    ['ph-sparkle', 'triggeraimodels.jpg', 'Ultra AI model', 'Our most powerful model, for the highest quality content and design output.'],
    ['ph-chart-bar', 'analytics.jpg', 'Analytics', 'Track views, engagement, and viewer location. See exactly how your deck performs after you share it.'],
    ['ph-folder', 'triggerproject.jpg', 'Projects', 'Group related decks into shared spaces, so everyone knows where the latest version lives.'],
    ['ph-text-aa', 'triggerfonts.jpg', 'Color and Font pair', 'Set your brand colors and fonts once, and every deck you create stays on-brand.'],
    ['ph-presentation-chart', 'triggercolorsmeetandpresent.jpg', 'Meet and present', 'Present live to remote audiences in real time, straight from the editor.'],
    ['ph-cards', 'triggerverylongslides.jpg', 'Slide count', 'Generate longer decks, up to 21+ slides in one go, without splitting your story.'],
    ['ph-star-four', 'triggerpromodelupgrade.jpg', 'Pro AI model', 'Enhanced quality on every generation: smarter content, sharper design.'],
  ];
  FEATS[0][1] = 'export.png';
  const REASONS = ['Too expensive', 'Not using it enough', 'Missing features I need', 'Found a better alternative', 'Technical issues or bugs', 'Taking a temporary break', 'Other'];

  const drawDialog = () => {
    const s = st(), p = plan(), d = S.dialog;
    if (!d) { ov.hidden = true; ov.innerHTML = ''; return; }
    ov.hidden = false;
    if (d === 'cancel') {
      const k = S.step;
      if (k === 'lose') ov.innerHTML = dlg(448, head('By cancelling, you’ll lose access to') + '<div class="bd"><div class="lrows">' + keepRows('<span class="badge neutral">' + hi('lock') + 'Locked</span>') + '</div>' + twoBtns + '</div>');
      else if (k === 'reminder') ov.innerHTML = dlg(448, head('Worried about being charged next year without notice?', 'Keep your plan and we’ll email you a reminder before your renewal, so there are no surprises.') + '<div class="bd">' + twoBtns + '</div>');
      else if (k === 'stays') ov.innerHTML = dlg(448, head('Nothing changes today, you’re on ' + p.name + ' until <span class="acc">' + fmtLong(endDate()) + '</span>', 'Cancelling only stops next year’s renewal. You keep full ' + p.name + ' access until then, here’s what stays yours:') +
        '<div class="bd"><div class="lrows">' + keepRows('<span class="badge good">' + hi('check') + 'Till ' + fmtLong(endDate()) + '</span>') + '</div>' + twoBtns + '</div>');
      else if (k === 'feedback') ov.innerHTML = dlg(448, head(s.trial ? 'What’s making you leave?' : 'Mind sharing why you’re cancelling?', s.trial ? 'Pick any that apply:' : 'It helps us improve. Pick any that apply.') +
        '<div class="bd"><div class="reasons">' + REASONS.map((r) => '<label><input type="checkbox" data-r="' + r + '"' + (S.reasons.includes(r) ? ' checked' : '') + ' />' + r + '</label>').join('') + '</div>' +
        (S.reasons.includes('Other') ? '<textarea class="other" rows="3" placeholder="Share details to help us improve…" id="other">' + S.other + '</textarea>' : '') + twoBtns + '</div>');
      else if (k === 'offer') {
        const f = FEATS[S.feat], save = Math.round(p.annual * 0.2);
        const title = s.trial ? 'Before you cancel, here’s <span class="acc">20%</span> off to stay on ' + p.name + '.' : 'Before you cancel, here’s <span class="acc">20%</span> off your next renewal.';
        ov.innerHTML = '<div class="nf" role="dialog" aria-modal="true" aria-labelledby="nf-t"><div class="left"><h3 id="nf-t">' + title + '</h3><div class="feats">' +
          FEATS.map((x, i) => '<button type="button" class="fi' + (i === S.feat ? ' on' : '') + '" data-a="feat" data-v="' + i + '"><i class="ph' + (i === S.feat ? '-fill' : '') + ' ' + x[0] + '"></i>' + x[2] + '</button>').join('') + '</div></div>' +
          '<div class="prev" style="background-image:url(assets/billing/nudge/dots.jpg)"><img src="assets/billing/nudge/' + f[1] + '" alt="" /></div>' +
          '<div class="capn"><b>' + f[2] + '</b><span>' + f[3] + '</span></div>' +
          '<div class="bar"><button type="button" class="cta out" data-a="docancel">Continue to cancel</button>' +
          '<button type="button" class="cta main" data-a="stay">' + (s.trial ? 'Keep ' + p.name + ' at 20% off' : 'Stay on ' + p.name + ', save 20% off') +
          '<span class="brk" role="tooltip"><b>' + (s.trial ? 'Your discount if you stay' : 'Your discount for next renewal') + '</b><span class="l"><span>' + p.name + ' Annual</span><span>' + money(p.annual) + '</span></span>' +
          '<span class="l g"><span>Loyalty discount</span><span>-' + money(save) + '</span></span><span class="l t"><span>You pay</span><span>' + money(p.annual - save) + '/year</span></span></span></button></div></div>';
      }
    } else if (d === 'history') {
      const H = [['New slides', 'Mani', 'Oct 29, 2026', 40], ['Rewrite with AI', 'Mani', 'Oct 28, 2026', 10], ['New presentation', 'Mani', 'Oct 24, 2026', 100], ['Image generation', 'Mani', 'Oct 22, 2026', 30], ['New slides', 'Mani', 'Oct 15, 2026', 20]];
      ov.innerHTML = dlg(576, head('Credit History', '', true) + '<div class="bd"><table class="hist"><thead><tr><th style="width:52%">Event</th><th style="width:30%">Date</th><th>Credits</th></tr></thead><tbody>' +
        (st().plan ? H : H.slice(2, 3)).map((h) => '<tr><td><span class="ev">' + h[0] + '</span><small>by ' + h[1] + '</small></td><td class="dt">' + h[2] + '</td><td class="tab">' + h[3] + '</td></tr>').join('') + '</tbody></table></div>');
    } else if (d === 'activate') {
      const off = S.coupon ? Math.round(p.annual * 0.2) : 0, renew = fmtLong(addDays(endDate(), 365));
      ov.innerHTML = dlg(500, head('Unlock your full plan early', 'Skip the wait. Activate now to get all ' + num(p.credits) + ' ' + p.name + ' credits today instead of on day 7.', true) +
        '<div class="bd"><div class="sum"><div class="l"><b>' + p.name + ' Plan</b><b>' + money(p.annual) + '</b></div><div class="l"><span>Full plan credits unlock (' + num(p.credits) + ')</span><span></span></div>' +
        (off ? '<div class="l dis"><span>Discount (20% off applied)</span><span>-' + money(off) + '</span></div>' : '') + '<hr /><div class="l tot"><span>Due today:</span><span>' + money(p.annual - off) + '</span></div></div>' +
        '<label class="consent"><input type="checkbox" id="consent"' + (S.consent ? ' checked' : '') + ' /><span>I agree to the <a href="#" onclick="return false">Terms</a>. Renews at ' + money(p.annual) + '/year on ' + renew + '</span></label>' +
        '<div class="acts" style="justify-content:flex-end"><button type="button" class="btn ghost lg" data-a="close" style="flex:0 0 auto">Cancel</button><button type="button" class="btn pri lg" data-a="pay"' + (S.consent ? '' : ' disabled') + '>' +
        (S.busy === 'pay' ? '<span class="spin"></span>' : '') + (S.coupon ? 'Activate now and get 20% off' : 'Activate full plan now') + '</button></div></div>');
    } else if (d === 'success') {
      ov.innerHTML = dlg(600, '<div class="won"><span class="ok">' + hi('check') + '</span><h3>Payment Successful</h3><p>You will receive a confirmation email with the order details.</p><p class="tab">Your Order ID: 4F7K-29QX</p>' +
        '<button type="button" class="btn pri lg" data-a="done">Continue</button><p class="foot">You can review all your invoices in the Settings > Billing section.</p></div>');
    }
  };
  const openCancel = (step) => { const steps = stepsFor(); S.dialog = 'cancel'; S.step = step && steps.includes(step) ? step : steps[0]; S.reasons = []; S.other = ''; S.feat = 0; drawDialog(); };

  /* ---------- toast ---------- */
  let tt;
  const toast = (t) => { const el = document.getElementById('toast'); document.getElementById('toast-t').textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 3200); };

  /* ---------- wiring ---------- */
  const setState = (k) => { S.state = k; S.dialog = null; drawBilling(); drawDialog(); paintProto(); };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b) { if (e.target === ov && S.dialog && S.dialog !== 'success') { S.dialog = null; drawDialog(); } return; }
    const a = b.dataset.a, v = b.dataset.v, s = st();
    if (a === 'nav') return toast(v + ' is outside this proto.');
    if (a === 'plans') return toast('Opens the plans (pricing screen).');
    if (a === 'renew') return toast('Opens the plans with 20% off your first year, for returning subscribers.');
    if (a === 'buy') return s.plan && !s.expired ? toast('Opens the credit packs.') : toast('Opens the plans (pricing screen).');
    if (a === 'pack') return toast('Opens checkout for ' + num(Number(v)) + ' credits.');
    if (a === 'history') { S.dialog = 'history'; return drawDialog(); }
    if (a === 'activate') { S.dialog = 'activate'; S.coupon = false; S.consent = false; return drawDialog(); }
    if (a === 'cancel') return openCancel();
    if (a === 'close' || a === 'keep') { S.dialog = null; return drawDialog(); }
    if (a === 'cnext') { const steps = stepsFor(), i = steps.indexOf(S.step); if (i < steps.length - 1) { S.step = steps[i + 1]; return drawDialog(); } }
    if (a === 'cnext' || a === 'docancel') {
      // Payment.cancelSubscriptionRenewal: renewal off, access stays to the end date (a trial just ends)
      S.dialog = null; drawDialog();
      if (s.trial) { setState('free'); return toast('Your auto-renewal has been cancelled.'); }
      setState('cancelled'); return toast('Your auto-renewal has been cancelled.');
    }
    if (a === 'stay') {
      if (s.trial) { S.dialog = 'activate'; S.coupon = true; S.consent = false; return drawDialog(); }
      setState('pro-discount'); return toast('Your 20% renewal discount has been applied');
    }
    if (a === 'reactivate') { setState('pro'); return toast('Cancellation removed'); }
    if (a === 'feat') { S.feat = Number(v); return drawDialog(); }
    if (a === 'pay') { S.busy = 'pay'; drawDialog(); setTimeout(() => { S.busy = null; S.dialog = 'success'; drawDialog(); }, 900); return; }
    if (a === 'done') { setState('pro'); return; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset.r) { const r = e.target.dataset.r; S.reasons = e.target.checked ? S.reasons.concat(r) : S.reasons.filter((x) => x !== r); if (r === 'Other') drawDialog(); }
    if (e.target.id === 'consent') { S.consent = e.target.checked; drawDialog(); }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'other') S.other = e.target.value; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.dialog && S.dialog !== 'success') { S.dialog = null; drawDialog(); } });

  /* ---------- proto controls ---------- */
  const proto = document.getElementById('proto');
  document.getElementById('proto-t').addEventListener('click', () => proto.classList.toggle('shut'));
  const paintProto = () => {
    document.getElementById('proto-b').innerHTML = '<b>Workspace</b>' + Object.keys(STATES).map((k) => '<button type="button" class="' + (k === S.state ? 'on' : '') + '" data-st="' + k + '">' + STATES[k].label + '</button>').join('');
  };
  document.getElementById('proto-b').addEventListener('click', (e) => { const b = e.target.closest('[data-st]'); if (b) setState(b.dataset.st); });

  /* ---------- deep links: ?state=…&open=cancel|history|activate&step=… ---------- */
  const q = new URLSearchParams(location.search);
  if (STATES[q.get('state')]) S.state = q.get('state');
  drawNav(); drawBilling(); paintProto();
  if (q.get('open') === 'cancel') openCancel(q.get('step'));
  if (q.get('open') === 'history') { S.dialog = 'history'; drawDialog(); }
  if (q.get('open') === 'activate') { S.dialog = 'activate'; S.coupon = q.get('coupon') === '1'; drawDialog(); }
  if (q.get('open') === 'success') { S.dialog = 'success'; drawDialog(); }
  if (q.get('feat')) { S.feat = Number(q.get('feat')) || 0; drawDialog(); }
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
