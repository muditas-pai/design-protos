<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get most out of Pro, editor top bar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* The editor key screen runs underneath, untouched, in a frame. This proto only adds the middle
     of its top bar: the plan button with a light running round it, the trial pill, and the menu
     that button opens. Activate Now hands over to the plan picker, v5.1. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #171717; --ink2: #525252; --ink3: #737373;
    --line: #e5e5e5; --line2: #ececec; --soft: #fafbfc;
    --blue: #005EFF; --blue-soft: #eef4ff; --halo: #e6efff;
    --green: #16a34a; --green-soft: #e7f6ec;
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #f4f5f7; -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the editor, as it is */
  .editor { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* the top bar middle. The editor bar is 60px with 12px of top padding and 36px pills,
     so this group lines up with the pills either side of it. */
  .bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: flex-start; gap: 10px; }

  /* the light running round the button */
  .pro-wrap { position: relative; padding: 1.5px; border-radius: 9.5px; overflow: hidden; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .pro-wrap::before { content: ''; position: absolute; inset: -60%; background: conic-gradient(from 0deg, rgba(0,94,255,0) 0deg, rgba(0,94,255,0) 230deg, #74A6FF 290deg, #005EFF 330deg, rgba(0,94,255,0) 360deg); animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  /* and a slow breath under it, so the button is noticed without moving */
  .pro-wrap::after { content: ''; position: absolute; inset: 0; border-radius: 9.5px; box-shadow: 0 0 0 0 rgba(0,94,255,0.4); animation: breathe 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,94,255,0.32); } 55% { box-shadow: 0 0 0 7px rgba(0,94,255,0); } }

  .pro-btn { position: relative; display: flex; align-items: center; height: 36px; padding: 0; border: 0; border-radius: 8px; background: var(--blue-soft); font-family: inherit; cursor: pointer; }
  .pro-btn .lbl { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .pro-btn .lbl i { font-size: 16px; color: var(--blue); }
  .pro-btn .sep { width: 1px; height: 36px; background: rgba(0,94,255,0.16); }
  .pro-btn .car { display: grid; place-items: center; width: 34px; height: 36px; font-size: 12px; color: var(--ink2); transition: transform .22s ease; }
  .pro-btn:hover { background: #e4eeff; }
  .pro-btn[aria-expanded="true"] .car { transform: rotate(180deg); }

  /* trial pill, white, with the one action in blue */
  .trial { display: flex; align-items: center; height: 36px; padding: 0 0 0 12px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 1px 2px rgba(10,25,37,0.1); }
  .trial .t { display: inline-flex; align-items: center; gap: 7px; padding-right: 12px; font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; }
  .trial .t i { font-size: 15px; color: #f97316; }
  .act { display: inline-flex; align-items: center; gap: 7px; height: 30px; margin-right: 3px; padding: 0 13px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: 600 13.5px 'Inter', sans-serif; cursor: pointer; transition: background .15s ease, transform .12s ease; }
  .act i { font-size: 14px; }
  .act:hover { background: #0052e0; }
  .act:active { transform: scale(0.97); }

  /* the menu the plan button opens */
  .menu { position: fixed; top: 54px; z-index: 21; width: 420px; padding: 10px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 18px 40px -12px rgba(10,25,37,0.3); transform-origin: top left; animation: menu-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
  .menu[hidden] { display: none; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-8px) scale(0.97); } }
  .menu .row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 8px; background: none; border: 0; width: 100%; font-family: inherit; text-align: left; cursor: default; }
  .menu .row.todo { cursor: pointer; transition: background .15s ease; }
  .menu .row.todo:hover { background: var(--soft); }
  .menu .row .mk { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .menu .row.done .mk { background: var(--green); color: #fff; font-size: 18px; }
  .menu .row.todo .mk { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .menu .row .nm { flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--ink); }
  .menu .row.done .nm { color: var(--ink); }
  .menu .chip { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .menu .chip.earned { background: var(--green-soft); color: #15803d; }
  .menu .chip.earn { display: inline-flex; align-items: center; gap: 5px; background: var(--halo); color: var(--blue); }
  .menu .chip.earn i { font-size: 11px; }
  .menu .row .go { flex: none; width: 18px; font-size: 15px; color: var(--ink3); opacity: 0; transition: opacity .15s ease, transform .15s ease; }
  .menu .row.todo:hover .go { opacity: 1; transform: translateX(2px); }
  .menu .row { animation: row-in .34s cubic-bezier(.22,1,.36,1) backwards; }
  .menu .row:nth-child(1) { animation-delay: .04s; } .menu .row:nth-child(2) { animation-delay: .09s; }
  .menu .row:nth-child(3) { animation-delay: .14s; } .menu .row:nth-child(4) { animation-delay: .19s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

  .dim { position: fixed; inset: 0; z-index: 19; }
  .dim[hidden] { display: none; }

  /* once the plan is paid for, the trial pill goes and the button speaks for the plan */
  body.paid .trial { display: none; }

  /* the coach mark sits under the menu and points back at the button */
  .coach { position: fixed; z-index: 22; width: 292px; padding: 16px 18px; border-radius: 10px; background: var(--ink); color: #fff; box-shadow: 0 14px 30px -10px rgba(10,25,37,0.5); animation: coach-in .36s .2s cubic-bezier(.2,.8,.2,1) backwards; }
  .coach[hidden] { display: none; }
  @keyframes coach-in { from { opacity: 0; transform: translateY(-8px); } }
  .coach::after { content: ''; position: absolute; top: -5px; left: 26px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .coach b { display: block; font-size: 14px; font-weight: 600; }
  .coach p { margin-top: 6px; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.78); }
  .coach button { margin-top: 14px; height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: #fff; color: var(--ink); font: 600 12.5px 'Inter', sans-serif; cursor: pointer; }
  .coach button:hover { background: #ececec; }
  body.coaching .dim { background: rgba(10,25,37,0.3); }

  /* the post payment modal */
  .won-scrim { position: fixed; inset: 0; z-index: 44; display: flex; align-items: center; justify-content: center; padding: 28px; background: rgba(10,25,37,0.5); animation: fade-in .25s ease backwards; }
  .won-scrim[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes won-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
  .won { position: relative; width: 460px; padding: 28px 28px 24px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 44px -16px rgba(10,25,37,0.32); animation: won-in .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .won .eyebrow { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--green-soft); color: #15803d; font-size: 11.5px; font-weight: 600; }
  .won .eyebrow i { font-size: 12px; }
  .won .t { margin-top: 14px; font-size: 24px; font-weight: 500; letter-spacing: -0.018em; }
  .won .s { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }
  .won ul { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .won li { display: flex; align-items: flex-start; gap: 12px; animation: row-in .45s cubic-bezier(.22,1,.36,1) backwards; }
  .won li:nth-child(1) { animation-delay: .16s; } .won li:nth-child(2) { animation-delay: .22s; }
  .won li:nth-child(3) { animation-delay: .28s; } .won li:nth-child(4) { animation-delay: .34s; }
  .won li:nth-child(5) { animation-delay: .40s; }
  .won li i { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 7px; background: var(--halo); color: var(--blue); font-size: 16px; }
  .won li b { display: block; font-size: 13.5px; font-weight: 500; }
  .won li span { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: var(--ink2); }
  .won .acts { margin-top: 24px; display: flex; gap: 10px; }
  .won .acts button { height: 44px; border: 0; border-radius: 8px; font: 600 14px 'Inter', sans-serif; cursor: pointer; }
  .won .acts .go { flex: 1; background: var(--blue); color: #fff; }
  .won .acts .go:hover { background: #0052e0; }
  .won .acts .later { flex: none; width: 104px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #d4d4d4; }
  .won .acts .later:hover { background: var(--soft); }

  /* the picker opens over the editor in its own frame */
  .pick { position: fixed; inset: 0; z-index: 40; display: none; }
  .pick.is-open { display: block; }
  .pick iframe { width: 100%; height: 100%; border: 0; }
  .pick .x { position: fixed; top: 18px; right: 18px; z-index: 41; width: 32px; height: 32px; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-size: 16px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 6px 18px -6px rgba(10,25,37,0.4); }
  .pick .x:hover { background: #f0f2f5; }

  @media (prefers-reduced-motion: reduce) {
    .pro-wrap::before, .pro-wrap::after, .menu, .menu .row, .coach, .won, .won li { animation: none; }
  }
  @media (max-width: 1100px) {
    .bar { left: 12px; right: 12px; transform: none; justify-content: center; flex-wrap: wrap; }
    .menu { left: 12px !important; right: 12px; width: auto; }
    .coach { left: 12px !important; right: 12px; width: auto; }
    .won { width: 100%; }
  }
</style>
</head>
<body>

<iframe class="editor" src="../../../key-screens/editor.html" title="Editor"></iframe>

<div class="bar">
  <div class="pro-wrap">
    <button type="button" class="pro-btn" id="pro-btn" aria-haspopup="true" aria-expanded="false">
      <span class="lbl"><i class="ph-fill ph-rocket-launch"></i>Get most out of Pro</span>
      <span class="sep"></span>
      <span class="car"><i class="ph ph-caret-down"></i></span>
    </button>
  </div>
  <div class="trial">
    <span class="t"><i class="ph-fill ph-fire"></i>Trial: 320 credits left</span>
    <button type="button" class="act" id="activate"><i class="ph-fill ph-rocket-launch"></i>Activate now</button>
  </div>
</div>

<div class="dim" id="dim" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="coach" id="coach" hidden></div>

<div class="won-scrim" id="won-scrim" hidden><div class="won" id="won"></div></div>

<div class="pick" id="pick"><iframe id="pick-frame" title="Choose a plan"></iframe><button type="button" class="x" id="pick-close" aria-label="Close"><i class="ph ph-x"></i></button></div>

<script>
  // Steps worth 50 credits each. The ones still to do lead the list, the finished ones sit
  // under them and say what they earned. On trial there are four, on a paid plan three.
  const TRIAL_STEPS = [
    { t: 'Set up your Brand Kit', done: true },
    { t: 'Create using a template', done: true },
    { t: 'Create a project', done: false },
    { t: 'Invite a team member', done: false },
  ];
  const PAID_STEPS = [
    { t: 'Set up your Brand Kit', done: true },
    { t: 'Create using a template', done: true },
    { t: 'Create a project and add knowledge', done: false },
  ];
  const menu = document.getElementById('menu'), dim = document.getElementById('dim'), proBtn = document.getElementById('pro-btn');
  const coach = document.getElementById('coach');
  let steps = TRIAL_STEPS;
  const left = () => steps.filter((s) => !s.done).length;
  const stepsHTML = () => steps
    .map((s, i) => Object.assign({}, s, { n: i + 1 }))
    .sort((a, b) => (a.done === b.done ? a.n - b.n : (a.done ? 1 : -1)))
    .map((s) => s.done
      ? '<div class="row done"><span class="mk"><i class="ph-bold ph-check"></i></span><span class="nm">' + s.t + '</span>' +
        '<span class="chip earned">Earned 50 credits</span></div>'
      : '<button type="button" class="row todo"><span class="mk">' + s.n + '</span>' +
        '<span class="nm">' + s.t + '</span><span class="chip earn"><i class="ph-fill ph-star-four"></i>Earn +50</span>' +
        '<span class="go"><i class="ph ph-arrow-right"></i></span></button>').join('');
  const drawMenu = () => { menu.innerHTML = stepsHTML(); };
  drawMenu();

  // a step is work in the editor, so picking one closes the menu and leaves you in it
  menu.addEventListener('click', (e) => { if (e.target.closest('.row.todo')) closeMenu(); });

  // the menu hangs from the left edge of the button
  const place = () => {
    const r = proBtn.getBoundingClientRect();
    menu.style.left = Math.max(12, r.left) + 'px';
    coach.style.left = Math.max(12, r.left) + 'px';
    coach.style.top = (menu.getBoundingClientRect().bottom + 10) + 'px';
  };
  const openMenu = () => { menu.hidden = false; dim.hidden = false; place(); proBtn.setAttribute('aria-expanded', 'true'); };
  const closeMenu = () => {
    menu.hidden = true; dim.hidden = true; coach.hidden = true;
    document.body.classList.remove('coaching');
    proBtn.setAttribute('aria-expanded', 'false');
  };
  proBtn.addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
  dim.addEventListener('click', closeMenu);
  addEventListener('resize', () => { if (!menu.hidden) place(); });

  // the plan picker opens over the editor, v5.1
  const pick = document.getElementById('pick'), pickFrame = document.getElementById('pick-frame');
  const openPick = () => { pickFrame.src = 'trial-choose-plan-sep-2026-v5.1.html?tier=2'; pick.classList.add('is-open'); closeMenu(); };
  const closePick = () => { pick.classList.remove('is-open'); pickFrame.src = 'about:blank'; };
  document.getElementById('activate').addEventListener('click', openPick);
  document.getElementById('pick-close').addEventListener('click', closePick);
  addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'checkout-close') closePick();
    if (e.data.type === 'checkout-paid') { closePick(); paid(e.data.plan); }
  });

  // ---- after payment ----------------------------------------------------------------
  // The same five points fill the modal and, from then on, this button's menu, so the
  // promise and the place to find it match.
  const TOP5 = {
    pro: [
      ['ph-sparkle', 'Advanced AI models', 'On every deck you make'],
      ['ph-paint-brush-broad', 'Brand Kit', 'Your fonts, colours and logo on every slide'],
      ['ph-strategy', 'Research and planning', 'We read your sources before we write'],
      ['ph-chart-bar', 'Analytics', 'See which slides people spend time on'],
      ['ph-microsoft-powerpoint-logo', 'PowerPoint and PDF export', 'Editable, with no watermark'],
    ],
    gold: [
      ['ph-sparkle', 'Frontier AI models', 'The strongest models we offer'],
      ['ph-paint-brush-broad', 'Advanced brand controls', 'Lock type, colour and layout across a deck'],
      ['ph-book-open', 'Shared project knowledge', 'Every deck reads from the same sources'],
      ['ph-gauge', 'Priority AI generation', 'Your decks go to the front of the queue'],
      ['ph-rocket-launch', 'Everything in Pro', 'Brand Kit, research, analytics and exports'],
    ],
    team: [
      ['ph-users-three', 'Unlimited collaborators', 'Seats are included, not counted'],
      ['ph-paint-brush-broad', 'Shared Brand Kit', 'One brand for everyone in the workspace'],
      ['ph-book-open', 'Shared project knowledge', 'Every deck reads from the same sources'],
      ['ph-sparkle', 'Frontier AI models and agents', 'The strongest models we offer'],
      ['ph-chart-bar', 'Team analytics', 'See how your team\u2019s decks are read'],
    ],
  };
  const NAME = { pro: 'Pro', gold: 'Gold', team: 'Team' };
  const CREDITS = { pro: '5,000', gold: '25,000', team: '30,000' };
  let plan = 'pro';
  const wonScrim = document.getElementById('won-scrim'), won = document.getElementById('won');

  // payment went through: the trial pill goes, the button speaks for the plan, the modal says what it adds
  const paid = (p) => {
    plan = NAME[p] ? p : 'pro';
    document.body.classList.add('paid');
    closeMenu();
    proBtn.querySelector('.lbl').innerHTML = '<i class="ph-fill ph-rocket-launch"></i>Get most out of ' + NAME[plan];
    steps = PAID_STEPS;
    drawMenu();
    won.innerHTML =
      '<span class="eyebrow"><i class="ph-fill ph-check-circle"></i>Payment complete</span>' +
      '<div class="t">Get more out of ' + NAME[plan] + '</div>' +
      '<div class="s">' + NAME[plan] + ' is on from today. ' + CREDITS[plan] + ' credits are on your account. Here are the five things it adds.</div>' +
      '<ul>' + TOP5[plan].map((f) => '<li><i class="ph ' + f[0] + '"></i><div><b>' + f[1] + '</b><span>' + f[2] + '</span></div></li>').join('') + '</ul>' +
      '<div class="acts"><button type="button" class="go" id="won-go">Start creating</button>' +
      '<button type="button" class="later" id="won-later">Not now</button></div>';
    wonScrim.hidden = false;
    document.getElementById('won-go').addEventListener('click', dismissWon);
    document.getElementById('won-later').addEventListener('click', dismissWon);
  };

  // the modal closes, the menu opens and the coach mark points back at the button
  const dismissWon = () => {
    wonScrim.hidden = true;
    coach.innerHTML = '<b>We\u2019ve got you covered</b>' +
      '<p>Open this menu anytime to see what ' + NAME[plan] + ' covers. ' +
      (left() === 1 ? '1 step left adds 50 credits.' : left() + ' steps left add 50 credits each.') + '</p>' +
      '<button type="button" id="coach-ok">Got it</button>';
    openMenu();
    coach.hidden = false;
    document.body.classList.add('coaching');
    place();
    document.getElementById('coach-ok').addEventListener('click', closeMenu);
  };
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (pick.classList.contains('is-open')) { closePick(); return; }
    if (!menu.hidden) closeMenu();
  });

  // ?menu=1 opens the menu on load, ?paid=pro|gold|team jumps to the post payment step
  const q = new URLSearchParams(location.search);
  if (NAME[q.get('paid')]) paid(q.get('paid'));
  else if (q.get('menu') === '1') openMenu();
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
