<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free to Pro, all on the editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* One screen the whole way. A free user upgrades from the editor top bar, the plans open over
     the editor, checkout opens over the editor, and what is left to do lands in the top bar menu.
     Nothing navigates: every step is a layer on this page. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #171717; --ink2: #525252; --ink3: #737373;
    --line: #e5e5e5; --line2: #ececec; --soft: #fafbfc;
    --blue: #005EFF; --blue-soft: #eef4ff; --halo: #e6efff;
    --green: #16a34a; --green-soft: #e7f6ec;
    --gold: #C08E2A; --gold-line: #e7d6ab; --gold-bg: linear-gradient(180deg, #fffdf6 0%, #fdf5e4 100%);
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #f8f8fb; -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the editor, sidebar and canvas taken from the community flow */
  .ed-strip { position: fixed; left: 11px; top: 60px; bottom: 56px; width: 180px; z-index: 5; display: flex; flex-direction: column; overflow: hidden; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.07), 0 1px 2px rgba(10,25,37,0.08); }
  .ed-strip .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 0; color: var(--ink3); font-size: 15px; }
  .ed-strip .hd span { display: flex; align-items: center; gap: 8px; }
  .ed-new { display: flex; align-items: center; justify-content: center; gap: 7px; height: 28px; margin: 6px 8px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: 500 12px 'Inter', sans-serif; color: var(--ink); cursor: pointer; }
  .ed-new:hover { background: var(--soft); }
  .ed-strip .list { flex: 1; border-top: 1px solid var(--line2); padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .ed-strip .th { position: relative; cursor: pointer; }
  .ed-strip .th img { display: block; width: 100%; border-radius: 4px; }
  .ed-strip .th .n { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 4px; background: rgba(0,0,0,0.4); color: #fff; font-size: 12px; font-weight: 500; display: grid; place-items: center; }
  .ed-strip .th.on img { box-shadow: 0 0 0 2px rgba(11,15,20,0.48); }
  /* the canvas takes everything to the right of the strip */
  .ed-canvas { position: fixed; left: 203px; right: 11px; top: 60px; bottom: 56px; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
  .ed-canvas img { max-width: 100%; max-height: 100%; width: auto; border-radius: 6px; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .ed-bottom { position: fixed; bottom: 11px; left: calc(50% + 96px); transform: translateX(-50%); z-index: 6; }

  /* the editor top bar: floating pills on the canvas, no strip behind them and no offer timer */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 0 11px; }
  .grp { display: flex; align-items: center; height: 36px; padding: 0 3px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08); }
  .grp .sp { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .ib { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ink); font-size: 16px; cursor: pointer; }
  .ib:hover { background: var(--soft); }
  /* Careful with class names here: .ph belongs to Phosphor, so never style it as a layout hook.
     The glyphs only need an upright box with no leading of their own. */
  i[class*="ph-"] { display: block; margin: 0; line-height: 1; font-style: normal; }
  .tb { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border: 0; border-radius: 6px; background: none; font: 500 13.5px 'Inter', sans-serif; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .tb:hover { background: var(--soft); }
  .tb i { font-size: 15px; }
  .tb--dark { background: var(--ink); color: #fff; }
  .tb--dark:hover { background: #000; }
  .deck { max-width: 180px; padding: 0 10px; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { display: flex; align-items: center; gap: 4px; padding: 0 6px 0 3px; }
  .av .f { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; background: #f97316; color: #fff; font-size: 11px; font-weight: 600; }
  .av .n { font-size: 12px; font-weight: 600; color: var(--ink2); }
  .gap { flex: 1 1 auto; }

  /* free: credits and the one upgrade action, no plan button */
  .cred-grp .c { display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 13.5px; white-space: nowrap; }
  /* the sparkle is the emoji, not the icon font, so it keeps its own colour */
  .emo { font-size: 14px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  /* the house gradient, the same one the offer pill uses on the pricing page */
  .act { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border: 0; border-radius: 6px; background: linear-gradient(96deg, #00225C 0%, #003C9E 24%, #0055ED 50%, #0F60EF 66%, #1C6BF3 78%, #2A75F6 86%, #3F82FA 92%, #5990FC 96%, #74A6FF 100%); color: #fff; font: 600 13.5px 'Inter', sans-serif; cursor: pointer; transition: filter .15s ease, transform .12s ease; }
  .act i { font-size: 14px; }
  .act:hover { filter: brightness(1.08); }
  .act:active { transform: scale(0.97); }
  /* paid: the credits chip goes, the plan button arrives */
  .pro-wrap { display: none; }
  body.paid .pro-wrap { display: block; }
  body.paid .cred-grp { display: none; }

  /* the light running round the plan button */
  .pro-wrap { position: relative; padding: 1.5px; border-radius: 9.5px; overflow: hidden; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .pro-wrap::before { content: ''; position: absolute; inset: -60%; background: conic-gradient(from 0deg, rgba(0,94,255,0) 0deg, rgba(0,94,255,0) 230deg, #74A6FF 290deg, #005EFF 330deg, rgba(0,94,255,0) 360deg); animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .pro-wrap::after { content: ''; position: absolute; inset: 0; border-radius: 9.5px; animation: breathe 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,94,255,0.32); } 55% { box-shadow: 0 0 0 7px rgba(0,94,255,0); } }
  .pro-btn { position: relative; display: flex; align-items: center; height: 36px; border: 0; border-radius: 8px; background: var(--blue-soft); font-family: inherit; cursor: pointer; }
  .pro-btn .lbl { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .pro-btn .lbl i { font-size: 16px; color: var(--blue); }
  .pro-btn .sep { width: 1px; height: 36px; background: rgba(0,94,255,0.16); }
  .pro-btn .car { display: flex; align-items: center; justify-content: center; width: 34px; height: 36px; font-size: 12px; color: var(--ink2); transition: transform .22s ease; }
  .pro-btn:hover { background: #e4eeff; }
  .pro-btn[aria-expanded="true"] .car { transform: rotate(180deg); }

  /* the menu the plan button opens */
  .menu { position: fixed; top: 56px; z-index: 21; width: 430px; padding: 10px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 18px 40px -12px rgba(10,25,37,0.3); transform-origin: top left; animation: menu-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
  .menu[hidden] { display: none; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-8px) scale(0.97); } }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: 0; border-radius: 8px; background: none; font-family: inherit; text-align: left; }
  .row.todo { cursor: pointer; transition: background .15s ease; }
  .row.todo:hover { background: var(--soft); }
  .row .mk { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 999px; font-size: 14px; font-weight: 600; line-height: 1; }
  .row.done .mk { background: var(--green); color: #fff; font-size: 18px; }
  .row.todo .mk { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .row .nm { flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--ink); }
  .chip { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .chip.earned { background: var(--green-soft); color: #15803d; }
  .chip.earn { display: inline-flex; align-items: center; gap: 5px; background: var(--halo); color: var(--blue); }
  .chip.earn i { font-size: 11px; }
  .row .go { flex: none; width: 18px; font-size: 15px; color: var(--ink3); opacity: 0; transition: opacity .15s ease, transform .15s ease; }
  .row.todo:hover .go { opacity: 1; transform: translateX(2px); }
  .row { animation: row-in .34s cubic-bezier(.22,1,.36,1) backwards; }
  .row:nth-child(1) { animation-delay: .04s; } .row:nth-child(2) { animation-delay: .09s; }
  .row:nth-child(3) { animation-delay: .14s; } .row:nth-child(4) { animation-delay: .19s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

  .dim { position: fixed; inset: 0; z-index: 19; }
  .dim[hidden] { display: none; }
  body.coaching .dim { background: rgba(10,25,37,0.3); }

  /* the coach mark sits under the menu and points back at the button */
  .coach { position: fixed; z-index: 22; width: 300px; padding: 16px 18px; border-radius: 10px; background: var(--ink); color: #fff; box-shadow: 0 14px 30px -10px rgba(10,25,37,0.5); animation: coach-in .36s .2s cubic-bezier(.2,.8,.2,1) backwards; }
  .coach[hidden] { display: none; }
  @keyframes coach-in { from { opacity: 0; transform: translateY(-8px); } }
  .coach::after { content: ''; position: absolute; top: -5px; left: 26px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .coach b { display: block; font-size: 14px; font-weight: 600; }
  .coach p { margin-top: 6px; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.78); }
  .coach button { margin-top: 14px; height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: #fff; color: var(--ink); font: 600 12.5px 'Inter', sans-serif; cursor: pointer; }
  .coach button:hover { background: #ececec; }

  /* ---- every step after this is a layer over the same editor ---- */
  .layer { position: fixed; inset: 0; z-index: 44; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(10,25,37,0.5); overflow-y: auto; animation: fade-in .25s ease backwards; }
  .layer[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
  .sheet { position: relative; margin: auto; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 44px -16px rgba(10,25,37,0.32); animation: rise .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .x { position: absolute; top: 0; left: calc(100% + 10px); width: 30px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.12); }
  .x:hover { background: #f0f2f5; }

  /* the plans step is the big pricing page, shown over this editor in a transparent frame.
     It brings its own scrim, so this layer adds no background of its own. */
  #l-plans:not([hidden]) { background: none; padding: 0; display: block; overflow: hidden; }
  #l-plans iframe { width: 100%; height: 100%; border: 0; background: transparent; }

  /* buttons and the credits line, shared with checkout */
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font: 600 14px 'Inter', sans-serif; cursor: pointer; transition: filter .15s ease, transform .12s ease, background .15s ease; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(0.985); }
  .btn--out { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #d4d4d4; }
  .btn--out:hover { filter: none; background: var(--soft); box-shadow: inset 0 0 0 1px #a3a3a3; }
  .btn--gold { background: linear-gradient(100deg, #E8C070 0%, #D8AA48 48%, #C08E2A 100%); }
  .btn--dark { background: var(--ink); }
  .btn--dark:hover { filter: none; background: #000; }
  .cred { display: flex; align-items: center; gap: 9px; margin-top: 22px; }
  .cred > i { font-size: 17px; }
  .cred b { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
  .cred span { font-size: 13.5px; color: var(--ink2); }
  .cred .x5 { margin-left: 2px; padding: 2px 8px; border-radius: 999px; background: var(--halo); color: var(--blue); font-size: 11.5px; font-weight: 600; }

  /* checkout */
  .co { width: 820px; display: grid; grid-template-columns: 320px 1fr; }
  .co-l { padding: 26px 24px; border-right: 1px solid var(--line2); background: var(--soft); border-radius: 10px 0 0 10px; }
  .co-r { padding: 26px 24px; }
  .co h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.012em; }
  .co .sum { margin-top: 18px; }
  .co .sum .l { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 13.5px; color: var(--ink2); }
  .co .sum .l b { font-weight: 500; color: var(--ink); }
  .co .sum .tot { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .co .sum .tot b { font-size: 22px; font-weight: 500; letter-spacing: -0.015em; }
  .co .cred { margin-top: 16px; }
  .fld { margin-top: 14px; }
  .fld label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink2); }
  .fld input, .fld select { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: 400 14px 'Inter', sans-serif; color: var(--ink); }
  .fld input:focus, .fld select:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--halo); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .co .btn { margin-top: 20px; }
  .legal { margin-top: 12px; font-size: 11.5px; line-height: 1.5; color: var(--ink3); }

  /* what is left to do, straight after checkout. Same points as the top bar menu. */
  .won { width: 500px; padding: 28px 24px 24px; }
  .won .eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; padding: 4px 11px; border-radius: 999px; background: var(--green-soft); color: #15803d; font-size: 11.5px; font-weight: 600; }
  .won .eyebrow i { font-size: 12px; }
  .won .t { margin: 14px 0 0 4px; font-size: 24px; font-weight: 500; letter-spacing: -0.018em; }
  .won .s { margin: 8px 4px 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }
  .won .list { margin-top: 18px; }
  .won .acts { margin: 22px 4px 0; display: flex; gap: 10px; }
  .won .acts button { height: 44px; border: 0; border-radius: 8px; font: 600 14px 'Inter', sans-serif; cursor: pointer; }
  .won .acts .go { flex: 1; background: var(--blue); color: #fff; }
  .won .acts .go:hover { background: #0052e0; }
  .won .acts .later { flex: none; width: 104px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #d4d4d4; }
  .won .acts .later:hover { background: var(--soft); }

  @media (prefers-reduced-motion: reduce) {
    .pro-wrap::before, .pro-wrap::after, .menu, .row, .coach, .layer, .sheet { animation: none; }
  }
  @media (max-width: 1240px) { .bar .hide-sm { display: none; } }
  @media (max-width: 1180px) {
    .co { width: auto; max-width: 100%; grid-template-columns: 1fr; }
    .co-l { border-right: 0; border-bottom: 1px solid var(--line2); border-radius: 10px 10px 0 0; }
    .won { width: auto; max-width: 100%; }
    .x { left: auto; right: 0; top: -40px; }
    .menu, .coach { left: 12px !important; right: 12px; width: auto; }
  }
</style>
</head>
<body>

<div class="ed-strip">
  <div class="hd"><span><i class="ph ph-list-bullets"></i><i class="ph ph-film-strip"></i></span><i class="ph ph-arrows-in-simple"></i></div>
  <button type="button" class="ed-new"><i class="ph ph-plus"></i>New slide</button>
  <div class="list" id="strip"></div>
</div>
<div class="ed-canvas"><img id="canvas" src="assets/editor/ed-slide-1.jpg" alt="Slide 1" /></div>
<div class="grp ed-bottom">
  <button type="button" class="tb"><i class="ph ph-plus"></i>Insert</button>
  <span class="sp"></span>
  <button type="button" class="tb"><i class="ph ph-palette"></i>Theme</button>
  <span class="sp"></span>
  <button type="button" class="tb"><i class="ph ph-magic-wand"></i>Edit with AI</button>
  <span class="sp"></span>
  <button type="button" class="ib" aria-label="More"><i class="ph ph-dots-three-vertical"></i></button>
</div>

<div class="bar">
  <div class="grp">
    <button type="button" class="ib" aria-label="Home"><i class="ph ph-house"></i></button>
    <span class="sp"></span>
    <span class="deck">Scaling Operations</span>
  </div>
  <span class="gap"></span>

  <div class="pro-wrap">
    <button type="button" class="pro-btn" id="pro-btn" aria-haspopup="true" aria-expanded="false">
      <span class="lbl"><i class="ph-fill ph-rocket-launch"></i>Get most out of Pro</span>
      <span class="sep"></span>
      <span class="car"><i class="ph ph-caret-down"></i></span>
    </button>
  </div>

  <div class="grp cred-grp">
    <span class="c"><span class="emo">✨</span>Credits: 160 left</span>
    <button type="button" class="act" id="upgrade"><i class="ph-fill ph-rocket-launch"></i>Upgrade</button>
  </div>

  <div class="grp av hide-sm"><span class="f">M</span><span class="n">+2</span></div>

  <div class="grp">
    <button type="button" class="tb hide-sm">Share</button>
    <span class="sp"></span>
    <button type="button" class="tb"><i class="ph ph-play"></i>Present</button>
    <span class="sp"></span>
    <button type="button" class="ib hide-sm" aria-label="Analytics"><i class="ph ph-chart-bar"></i></button>
    <span class="sp hide-sm"></span>
    <button type="button" class="tb tb--dark"><i class="ph-fill ph-microsoft-powerpoint-logo"></i>Export as PPT</button>
    <span class="sp"></span>
    <button type="button" class="ib" aria-label="More"><i class="ph ph-dots-three-vertical"></i></button>
  </div>
</div>

<div class="dim" id="dim" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="coach" id="coach" hidden></div>

<div class="layer" id="l-plans" hidden><iframe id="plans-frame" title="Choose a plan"></iframe></div>
<div class="layer" id="l-co" hidden><div class="sheet co" id="co"></div></div>
<div class="layer" id="l-won" hidden><div class="sheet won" id="won"></div></div>

<script>
  // the deck behind everything, the same five screens as the community flow
  const DECK = ['ed-slide-1', 'ed-slide-2', 'ed-slide-3', 'ed-canvas', 'ed-slide-5'].map((n) => 'assets/editor/' + n + '.jpg');
  const strip = document.getElementById('strip'), canvas = document.getElementById('canvas');
  let slide = 0;
  const drawStrip = () => {
    strip.innerHTML = DECK.map((src, i) =>
      '<div class="th' + (i === slide ? ' on' : '') + '" data-slide="' + i + '"><span class="n">' + (i + 1) + '</span>' +
      '<img src="' + src + '" alt="Slide ' + (i + 1) + '" /></div>').join('');
    canvas.src = DECK[slide];
    canvas.alt = 'Slide ' + (slide + 1);
  };
  drawStrip();
  strip.addEventListener('click', (e) => {
    const th = e.target.closest('[data-slide]');
    if (!th) return;
    slide = Number(th.dataset.slide);
    drawStrip();
  });

  // ---- the numbers checkout and the top bar need. The points live on the pricing page. ----
  const PLANS = [
    { key: 'pro',  name: 'Pro',  price: 20, year: 240, credits: '5,000' },
    { key: 'gold', name: 'Gold', price: 50, year: 600, credits: '25,000', x: '5x Pro' },
    { key: 'team', name: 'Team', price: 60, year: 720, credits: '30,000' },
  ];
  const byKey = (k) => PLANS.find((p) => p.key === k) || PLANS[0];

  // ---- the steps. One list, used by the modal after checkout and by the top bar menu ----
  const STEPS = [
    { t: 'Set up your Brand Kit', done: true },
    { t: 'Create using a template', done: true },
    { t: 'Create a project and add knowledge', done: false },
    { t: 'Invite a team member', done: false },
  ];
  const left = () => STEPS.filter((s) => !s.done).length;
  // the ones still to do lead, the finished ones sit under them
  const rowsHTML = () => STEPS
    .map((s, i) => Object.assign({}, s, { n: i + 1 }))
    .sort((a, b) => (a.done === b.done ? a.n - b.n : (a.done ? 1 : -1)))
    .map((s) => s.done
      ? '<div class="row done"><span class="mk"><i class="ph-bold ph-check"></i></span><span class="nm">' + s.t + '</span>' +
        '<span class="chip earned">Earned 50 credits</span></div>'
      : '<button type="button" class="row todo"><span class="mk">' + s.n + '</span><span class="nm">' + s.t + '</span>' +
        '<span class="chip earn"><i class="ph-fill ph-star-four"></i>Earn +50</span>' +
        '<span class="go"><i class="ph ph-arrow-right"></i></span></button>').join('');

  // ---- layers over the editor. Nothing navigates. ----------------------------------
  const L = { plans: document.getElementById('l-plans'), co: document.getElementById('l-co'), won: document.getElementById('l-won') };
  const closeLayers = () => Object.keys(L).forEach((k) => { L[k].hidden = true; });
  const openLayer = (k) => { closeLayers(); L[k].hidden = false; };
  Object.keys(L).forEach((k) => L[k].addEventListener('click', (e) => { if (e.target === L[k] && k !== 'won') L[k].hidden = true; }));

  // the big pricing page, over this editor. It reports the pick back here, so checkout and
  // everything after it stay on this screen.
  const plansFrame = document.getElementById('plans-frame');
  const openPlans = () => {
    if (!plansFrame.src || plansFrame.src.endsWith('about:blank')) plansFrame.src = 'trial-choose-plan-sep-2026-v6.html?tier=2&embed=1';
    openLayer('plans');
  };
  addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'picker-close') { closeLayers(); plansFrame.src = 'about:blank'; }
    if (e.data.type === 'pick-plan') { plansFrame.src = 'about:blank'; openCheckout(e.data.plan); }
  });

  const cred = (p) => '<div class="cred"><i class="ph-fill ph-star-four"></i><b>' + p.credits + '</b><span>Credits</span>' +
    (p.x ? '<span class="x5">' + p.x + '</span>' : '') + '</div>';

  // checkout, over the editor
  const co = document.getElementById('co');
  const openCheckout = (k) => {
    const p = byKey(k);
    co.innerHTML =
      '<div class="co-l"><h2>' + p.name + '</h2>' + cred(p) +
        '<div class="sum">' +
          '<div class="l"><span>Plan</span><b>' + p.name + ', annual</b></div>' +
          '<div class="l"><span>Per month</span><b>$' + p.price + '</b></div>' +
          '<div class="l tot"><span>Billed today</span><b>$' + p.year + '</b></div>' +
        '</div>' +
        '<div class="legal">Renews at $' + p.year + ' a year unless cancelled. You can cancel anytime</div>' +
      '</div>' +
      '<div class="co-r"><h2>Payment</h2>' +
        '<div class="fld"><label>Card number</label><input value="4242 4242 4242 4242" inputmode="numeric" /></div>' +
        '<div class="two"><div class="fld"><label>Expiry</label><input value="04 / 29" /></div>' +
        '<div class="fld"><label>CVC</label><input value="123" /></div></div>' +
        '<div class="fld"><label>Name on card</label><input value="Mani Vasakan" /></div>' +
        '<div class="two"><div class="fld"><label>Country</label><select><option>India</option><option>United States</option><option>United Kingdom</option></select></div>' +
        '<div class="fld"><label>ZIP code</label><input value="600001" /></div></div>' +
        '<button type="button" class="btn" data-pay="' + p.key + '">Pay $' + p.year + '</button>' +
        '<div class="legal">By paying you agree to the Terms of Service and the Refund Policy</div>' +
      '</div>' +
      '<button type="button" class="x" data-close aria-label="Close"><i class="ph ph-x"></i></button>';
    openLayer('co');
  };

  // what is left to do, straight after checkout. The same points the menu will hold.
  let plan = 'pro';
  const NAME = { pro: 'Pro', gold: 'Gold', team: 'Team' };
  const paid = (k) => {
    plan = NAME[k] ? k : 'pro';
    const p = byKey(plan);
    document.body.classList.add('paid');
    proBtn.querySelector('.lbl').innerHTML = '<i class="ph-fill ph-rocket-launch"></i>Get most out of ' + p.name;
    drawMenu();
    document.getElementById('won').innerHTML =
      '<span class="eyebrow"><i class="ph-fill ph-check-circle"></i>Payment complete</span>' +
      '<div class="t">Get most out of ' + p.name + '</div>' +
      '<div class="s">' + p.name + ' is on from today. ' + p.credits + ' credits are on your account, and ' +
      left() + ' steps left add 50 credits each.</div>' +
      '<div class="list">' + rowsHTML() + '</div>' +
      '<div class="acts"><button type="button" class="go" data-dismiss>Start creating</button>' +
      '<button type="button" class="later" data-dismiss>Not now</button></div>';
    openLayer('won');
  };

  // ---- the top bar menu and the coach mark ------------------------------------------
  const menu = document.getElementById('menu'), dim = document.getElementById('dim'), coach = document.getElementById('coach');
  const proBtn = document.getElementById('pro-btn');
  const drawMenu = () => { menu.innerHTML = rowsHTML(); };
  const place = () => {
    const r = proBtn.getBoundingClientRect();
    menu.style.left = Math.max(12, r.left) + 'px';
    coach.style.left = Math.max(12, r.left) + 'px';
    coach.style.top = (menu.getBoundingClientRect().bottom + 10) + 'px';
  };
  const openMenu = () => { menu.hidden = false; dim.hidden = false; place(); proBtn.setAttribute('aria-expanded', 'true'); };
  const closeMenu = () => {
    menu.hidden = true; dim.hidden = true; coach.hidden = true;
    document.body.classList.remove('coaching');
    proBtn.setAttribute('aria-expanded', 'false');
  };
  proBtn.addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
  dim.addEventListener('click', closeMenu);
  addEventListener('resize', () => { if (!menu.hidden) place(); });
  // a step is work in the editor, so picking one closes the menu and leaves you in it
  menu.addEventListener('click', (e) => { if (e.target.closest('.row.todo')) closeMenu(); });

  const dismissWon = () => {
    L.won.hidden = true;
    coach.innerHTML = '<b>We’ve got you covered</b>' +
      '<p>Open this menu anytime to see what ' + NAME[plan] + ' covers. ' +
      (left() === 1 ? '1 step left adds 50 credits.' : left() + ' steps left add 50 credits each.') + '</p>' +
      '<button type="button" id="coach-ok">Got it</button>';
    openMenu();
    coach.hidden = false;
    document.body.classList.add('coaching');
    place();
    document.getElementById('coach-ok').addEventListener('click', closeMenu);
  };

  // ---- one place for every click in the layers ---------------------------------------
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { closeLayers(); return; }
    const buy = e.target.closest('[data-buy]');
    if (buy) { openCheckout(buy.dataset.buy); return; }
    const pay = e.target.closest('[data-pay]');
    if (pay) { closeLayers(); paid(pay.dataset.pay); return; }
    if (e.target.closest('[data-dismiss]')) dismissWon();
  });
  document.getElementById('upgrade').addEventListener('click', () => { closeMenu(); openPlans(); });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!L.plans.hidden || !L.co.hidden) { closeLayers(); return; }
    if (!menu.hidden) closeMenu();
  });

  // ?step=plans|checkout|paid opens straight on that layer, so each one is linkable
  const q = new URLSearchParams(location.search);
  const step = q.get('step'), want = NAME[q.get('plan')] ? q.get('plan') : 'pro';
  if (step === 'plans') openPlans();
  else if (step === 'checkout') openCheckout(want);
  else if (step === 'paid') paid(want);
  else if (q.get('menu') === '1') { document.body.classList.add('paid'); drawMenu(); openMenu(); }
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
