<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get most out of Pro, editor top bar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* The editor key screen runs underneath, untouched, in a frame. This proto only adds the middle
     of its top bar: the plan button with a light running round it, the trial pill, and the menu
     that button opens. Activate Now hands over to the plan picker, v5.1. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #171717; --ink2: #525252; --ink3: #737373;
    --line: #e5e5e5; --line2: #ececec; --soft: #fafbfc;
    --blue: #005EFF; --blue-soft: #eef4ff; --halo: #e6efff;
    --green: #16a34a; --green-soft: #e7f6ec;
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #f4f5f7; -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the editor, as it is */
  .editor { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* the top bar middle. The editor bar is 60px with 12px of top padding and 36px pills,
     so this group lines up with the pills either side of it. */
  .bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: flex-start; gap: 10px; }

  /* the light running round the button */
  .pro-wrap { position: relative; padding: 1.5px; border-radius: 9.5px; overflow: hidden; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .pro-wrap::before { content: ''; position: absolute; inset: -60%; background: conic-gradient(from 0deg, rgba(0,94,255,0) 0deg, rgba(0,94,255,0) 230deg, #74A6FF 290deg, #005EFF 330deg, rgba(0,94,255,0) 360deg); animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  /* and a slow breath under it, so the button is noticed without moving */
  .pro-wrap::after { content: ''; position: absolute; inset: 0; border-radius: 9.5px; box-shadow: 0 0 0 0 rgba(0,94,255,0.4); animation: breathe 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,94,255,0.32); } 55% { box-shadow: 0 0 0 7px rgba(0,94,255,0); } }

  .pro-btn { position: relative; display: flex; align-items: center; height: 36px; padding: 0; border: 0; border-radius: 8px; background: var(--blue-soft); font-family: inherit; cursor: pointer; }
  .pro-btn .lbl { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .pro-btn .lbl i { font-size: 16px; color: var(--blue); }
  .pro-btn .sep { width: 1px; height: 36px; background: rgba(0,94,255,0.16); }
  .pro-btn .car { display: grid; place-items: center; width: 34px; height: 36px; font-size: 12px; color: var(--ink2); transition: transform .22s ease; }
  .pro-btn:hover { background: #e4eeff; }
  .pro-btn[aria-expanded="true"] .car { transform: rotate(180deg); }

  /* trial pill, white, with the one action in blue */
  .trial { display: flex; align-items: center; height: 36px; padding: 0 0 0 12px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 1px 2px rgba(10,25,37,0.1); }
  .trial .t { display: inline-flex; align-items: center; gap: 7px; padding-right: 12px; font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; }
  .trial .t i { font-size: 15px; color: #f97316; }
  .act { display: inline-flex; align-items: center; gap: 7px; height: 30px; margin-right: 3px; padding: 0 13px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: 600 13.5px 'Inter', sans-serif; cursor: pointer; transition: background .15s ease, transform .12s ease; }
  .act i { font-size: 14px; }
  .act:hover { background: #0052e0; }
  .act:active { transform: scale(0.97); }

  /* the menu the plan button opens */
  .menu { position: fixed; top: 54px; z-index: 21; width: 420px; padding: 10px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 18px 40px -12px rgba(10,25,37,0.3); transform-origin: top left; animation: menu-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
  .menu[hidden] { display: none; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-8px) scale(0.97); } }
  .menu .row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 8px; background: none; border: 0; width: 100%; font-family: inherit; text-align: left; cursor: default; }
  .menu .row.todo { cursor: pointer; transition: background .15s ease; }
  .menu .row.todo:hover, .menu .row.is-next { background: var(--soft); }
  .menu .row .mk { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .menu .row.done .mk { background: var(--green); color: #fff; font-size: 18px; }
  .menu .row.todo .mk { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .menu .row .nm { flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--ink); }
  .menu .row.done .nm { color: var(--ink); }
  .menu .chip { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .menu .chip.earned { background: var(--green-soft); color: #15803d; }
  .menu .chip.earn { display: inline-flex; align-items: center; gap: 5px; background: var(--halo); color: var(--blue); }
  .menu .chip.earn i { font-size: 11px; }
  .menu .row .go { flex: none; width: 18px; font-size: 15px; color: var(--ink3); opacity: 0; transition: opacity .15s ease, transform .15s ease; }
  .menu .row.is-next .go, .menu .row.todo:hover .go { opacity: 1; transform: translateX(2px); }
  .menu .row { animation: row-in .34s cubic-bezier(.22,1,.36,1) backwards; }
  .menu .row:nth-child(1) { animation-delay: .04s; } .menu .row:nth-child(2) { animation-delay: .09s; }
  .menu .row:nth-child(3) { animation-delay: .14s; } .menu .row:nth-child(4) { animation-delay: .19s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

  .dim { position: fixed; inset: 0; z-index: 19; }
  .dim[hidden] { display: none; }

  /* the picker opens over the editor in its own frame */
  .pick { position: fixed; inset: 0; z-index: 40; display: none; }
  .pick.is-open { display: block; }
  .pick iframe { width: 100%; height: 100%; border: 0; }
  .pick .x { position: fixed; top: 18px; right: 18px; z-index: 41; width: 32px; height: 32px; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-size: 16px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 6px 18px -6px rgba(10,25,37,0.4); }
  .pick .x:hover { background: #f0f2f5; }

  @media (prefers-reduced-motion: reduce) {
    .pro-wrap::before, .pro-wrap::after, .menu, .menu .row { animation: none; }
  }
  @media (max-width: 1100px) {
    .bar { left: 12px; right: 12px; transform: none; justify-content: center; flex-wrap: wrap; }
    .menu { left: 12px !important; right: 12px; width: auto; }
  }
</style>
</head>
<body>

<iframe class="editor" src="../../../key-screens/editor.html" title="Editor"></iframe>

<div class="bar">
  <div class="pro-wrap">
    <button type="button" class="pro-btn" id="pro-btn" aria-haspopup="true" aria-expanded="false">
      <span class="lbl"><i class="ph-fill ph-rocket-launch"></i>Get most out of Pro</span>
      <span class="sep"></span>
      <span class="car"><i class="ph ph-caret-down"></i></span>
    </button>
  </div>
  <div class="trial">
    <span class="t"><i class="ph-fill ph-fire"></i>Trial: 320 credits left</span>
    <button type="button" class="act" id="activate"><i class="ph-fill ph-rocket-launch"></i>Activate now</button>
  </div>
</div>

<div class="dim" id="dim" hidden></div>
<div class="menu" id="menu" hidden></div>

<div class="pick" id="pick"><iframe id="pick-frame" title="Choose a plan"></iframe><button type="button" class="x" id="pick-close" aria-label="Close"><i class="ph ph-x"></i></button></div>

<script>
  // Four steps, each worth 50 credits. Done ones say what they earned, the next one is the
  // row that is open, the rest wait their turn.
  const STEPS = [
    { t: 'Set up your Brand Kit', done: true },
    { t: 'Create using a template', done: true },
    { t: 'Create a project', done: false },
    { t: 'Invite a team member', done: false },
  ];
  const menu = document.getElementById('menu'), dim = document.getElementById('dim'), proBtn = document.getElementById('pro-btn');
  const next = STEPS.findIndex((s) => !s.done);
  menu.innerHTML = STEPS.map((s, i) => s.done
    ? '<div class="row done"><span class="mk"><i class="ph-bold ph-check"></i></span><span class="nm">' + s.t + '</span>' +
      '<span class="chip earned">Earned 50 credits</span></div>'
    : '<button type="button" class="row todo' + (i === next ? ' is-next' : '') + '"><span class="mk">' + (i + 1) + '</span>' +
      '<span class="nm">' + s.t + '</span><span class="chip earn"><i class="ph-fill ph-star-four"></i>Earn +50</span>' +
      '<span class="go"><i class="ph ph-arrow-right"></i></span></button>').join('');

  // the menu hangs from the left edge of the button
  const place = () => {
    const r = proBtn.getBoundingClientRect();
    menu.style.left = Math.max(12, r.left) + 'px';
  };
  const openMenu = () => { menu.hidden = false; dim.hidden = false; place(); proBtn.setAttribute('aria-expanded', 'true'); };
  const closeMenu = () => { menu.hidden = true; dim.hidden = true; proBtn.setAttribute('aria-expanded', 'false'); };
  proBtn.addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
  dim.addEventListener('click', closeMenu);
  addEventListener('resize', () => { if (!menu.hidden) place(); });

  // the plan picker opens over the editor, v5.1
  const pick = document.getElementById('pick'), pickFrame = document.getElementById('pick-frame');
  const openPick = () => { pickFrame.src = 'trial-choose-plan-sep-2026-v5.1.html?tier=2'; pick.classList.add('is-open'); closeMenu(); };
  const closePick = () => { pick.classList.remove('is-open'); pickFrame.src = 'about:blank'; };
  document.getElementById('activate').addEventListener('click', openPick);
  document.getElementById('pick-close').addEventListener('click', closePick);
  addEventListener('message', (e) => {
    if (e.data && (e.data.type === 'checkout-close' || e.data.type === 'checkout-paid')) closePick();
  });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (pick.classList.contains('is-open')) { closePick(); return; }
    if (!menu.hidden) closeMenu();
  });

  // ?menu=1 opens the menu on load, so the state is linkable
  if (new URLSearchParams(location.search).get('menu') === '1') openMenu();
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
