<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free to Pro, all on the editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* One screen the whole way. A free user upgrades from the editor top bar, the plans open over
     the editor, checkout opens over the editor, and what is left to do lands in the top bar menu.
     Nothing navigates: every step is a layer on this page. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #171717; --ink2: #525252; --ink3: #737373;
    --line: #e5e5e5; --line2: #ececec; --soft: #fafbfc;
    --blue: #005EFF; --blue-soft: #eef4ff; --halo: #e6efff;
    --green: #16a34a; --green-soft: #e7f6ec;
    --gold: #C08E2A; --gold-line: #e7d6ab; --gold-bg: linear-gradient(180deg, #fffdf6 0%, #fdf5e4 100%);
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: #f8f8fb; -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the editor, sidebar and canvas taken from the community flow */
  .ed-strip { position: fixed; left: 11px; top: 60px; bottom: 56px; width: 180px; z-index: 5; display: flex; flex-direction: column; overflow: hidden; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.07), 0 1px 2px rgba(10,25,37,0.08); }
  .ed-strip .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 0; color: var(--ink3); font-size: 15px; }
  .ed-strip .hd span { display: flex; align-items: center; gap: 8px; }
  .ed-new { display: flex; align-items: center; justify-content: center; gap: 7px; height: 28px; margin: 6px 8px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font: 500 12px 'Inter', sans-serif; color: var(--ink); cursor: pointer; }
  .ed-new:hover { background: var(--soft); }
  .ed-strip .list { flex: 1; border-top: 1px solid var(--line2); padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .ed-strip .th { position: relative; cursor: pointer; }
  .ed-strip .th img { display: block; width: 100%; border-radius: 4px; }
  .ed-strip .th .n { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 4px; background: rgba(0,0,0,0.4); color: #fff; font-size: 12px; font-weight: 500; display: grid; place-items: center; }
  .ed-strip .th.on img { box-shadow: 0 0 0 2px rgba(11,15,20,0.48); }
  /* the canvas takes everything to the right of the strip */
  .ed-canvas { position: fixed; left: 203px; right: 11px; top: 60px; bottom: 56px; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
  .ed-canvas img { max-width: 100%; max-height: 100%; width: auto; border-radius: 6px; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .ed-bottom { position: fixed; bottom: 11px; left: calc(50% + 96px); transform: translateX(-50%); z-index: 6; }

  /* the editor top bar: floating pills on the canvas, no strip behind them and no offer timer */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 0 11px; }
  .grp { display: flex; align-items: center; height: 36px; padding: 0 3px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08); }
  .grp .sp { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .ib { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--ink); font-size: 16px; cursor: pointer; }
  .ib:hover { background: var(--soft); }
  /* Careful with class names here: .ph belongs to Phosphor, so never style it as a layout hook.
     The glyphs only need an upright box with no leading of their own. */
  i[class*="ph-"] { display: block; margin: 0; line-height: 1; font-style: normal; }
  .tb { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border: 0; border-radius: 4px; background: none; font: 500 13.5px 'Inter', sans-serif; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .tb:hover { background: var(--soft); }
  .tb i { font-size: 15px; }
  .tb--dark { background: var(--ink); color: #fff; }
  .tb--dark:hover { background: #000; }
  .deck { max-width: 180px; padding: 0 10px; font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { display: flex; align-items: center; gap: 4px; padding: 0 6px 0 3px; }
  .av .f { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; background: #f97316; color: #fff; font-size: 11px; font-weight: 600; }
  .av .n { font-size: 12px; font-weight: 600; color: var(--ink2); }
  .gap { flex: 1 1 auto; }

  /* free: credits and the one upgrade action, no plan button */
  .cred-grp .c { display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 13.5px; white-space: nowrap; }
  /* the sparkle is the emoji, not the icon font, so it keeps its own colour */
  .emo { font-size: 15px; line-height: 1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  /* the house gradient, the same one the offer pill uses on the pricing page */
  .act { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border: 0; border-radius: 4px; background: linear-gradient(96deg, #00225C 0%, #003C9E 24%, #0055ED 50%, #0F60EF 66%, #1C6BF3 78%, #2A75F6 86%, #3F82FA 92%, #5990FC 96%, #74A6FF 100%); color: #fff; font: 600 13.5px 'Inter', sans-serif; cursor: pointer; transition: filter .15s ease, transform .12s ease; }
  .act i { font-size: 14px; }
  .act:hover { filter: brightness(1.08); }
  .act:active { transform: scale(0.97); }
  /* paid: the credits chip goes, the plan button arrives */
  .pro-wrap { display: none; }
  body.paid .pro-wrap { display: block; }
  body.paid .cred-grp { display: none; }

  /* The light running round the plan button, as a stroke on the button's own outline.
     A conic gradient cannot do this evenly on a wide pill: it sweeps fast along the long edges
     and stalls at the ends. A dashed stroke travels the perimeter itself, so the line is 1px
     everywhere and moves at one speed. pathLength normalises the dash to 100 units, so the
     same numbers hold whatever the button's width turns out to be. */
  .pro-wrap { position: relative; border-radius: 4px; box-shadow: 0 1px 2px rgba(10,25,37,0.1); }
  .ring { position: absolute; inset: 0; pointer-events: none; }
  .ring svg { position: absolute; left: 0.5px; top: 0.5px; width: calc(100% - 1px); height: calc(100% - 1px); overflow: visible; }
  .ring rect { fill: none; stroke-width: 1; stroke-linecap: round; }
  .ring .rest { stroke: #dde8fa; }
  /* One hard dash reads as a worm crawling round the edge. Three stacked dashes do instead: a
     short bright head with two longer, fainter lengths trailing it, all moving together, which
     gives the light a tail that fades out behind it. */
  .ring .h1, .ring .h2, .ring .h3 { stroke: var(--blue); }
  .ring .h1 { stroke-dasharray: 5 95; animation: run1 3.2s linear infinite; }
  .ring .h2 { stroke-dasharray: 15 85; opacity: 0.4; animation: run2 3.2s linear infinite; }
  .ring .h3 { stroke-dasharray: 30 70; opacity: 0.14; animation: run3 3.2s linear infinite; }
  @keyframes run1 { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: -100; } }
  @keyframes run2 { from { stroke-dashoffset: 6; }   to { stroke-dashoffset: -94; } }
  @keyframes run3 { from { stroke-dashoffset: 20; }  to { stroke-dashoffset: -80; } }

  /* the blue washes in from the left and clears to white under the caret */
  .pro-btn { position: relative; display: flex; align-items: center; height: 36px; border: 0; border-radius: 4px; background: linear-gradient(90deg, #cadcf7 0%, #dde9fc 38%, #eff5fe 68%, #ffffff 100%); font-family: inherit; cursor: pointer; transition: filter .15s ease; }
  .pro-btn:hover { filter: saturate(1.1) brightness(1.02); }
  .pro-btn .lbl { display: inline-flex; align-items: center; gap: 9px; padding: 0 14px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .pro-btn .sep { width: 1px; height: 20px; background: rgba(10,25,37,0.14); }
  .pro-btn .car { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; font-size: 13px; color: var(--ink); transition: transform .22s ease; }
  .pro-btn:hover { background: #e4eeff; }
  .pro-btn[aria-expanded="true"] .car { transform: rotate(180deg); }

  /* the menu the plan button opens */
  .menu { position: fixed; top: 56px; z-index: 21; width: 430px; padding: 10px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 18px 40px -12px rgba(10,25,37,0.3); transform-origin: top left; animation: menu-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
  .menu[hidden] { display: none; }
  .menu::before { content: ''; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-8px) scale(0.97); } }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: 0; border-radius: 6px; background: none; font-family: inherit; text-align: left; }
  .row.todo { cursor: pointer; transition: background .15s ease; }
  .row.todo:hover { background: var(--soft); }
  .row .mk { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 999px; font-size: 14px; font-weight: 600; line-height: 1; }
  .row.done .mk { background: var(--green); color: #fff; font-size: 18px; }
  .row.todo .mk { background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); }
  .row .nm { flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--ink); }
  .chip { flex: none; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .chip.earned { background: var(--green-soft); color: #15803d; }
  .chip.earn { background: var(--halo); color: var(--blue); }
  /* the arrow says the row is the action, so it stays put and only leans in on hover */
  .row .go { flex: none; width: 18px; font-size: 15px; color: var(--ink3); transition: transform .15s ease, color .15s ease; }
  .row.todo:hover .go { transform: translateX(3px); color: var(--ink); }
  .row { animation: row-in .34s cubic-bezier(.22,1,.36,1) backwards; }
  .row:nth-child(1) { animation-delay: .04s; } .row:nth-child(2) { animation-delay: .09s; }
  .row:nth-child(3) { animation-delay: .14s; } .row:nth-child(4) { animation-delay: .19s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

  .dim { position: fixed; inset: 0; z-index: 19; }
  .dim[hidden] { display: none; }
  body.coaching .dim { background: rgba(10,25,37,0.3); }

  /* the coach mark sits under the menu and points back at the button */
  .coach { position: fixed; z-index: 22; width: 300px; padding: 16px 18px; border-radius: 6px; background: var(--ink); color: #fff; box-shadow: 0 14px 30px -10px rgba(10,25,37,0.5); animation: coach-in .36s .2s cubic-bezier(.2,.8,.2,1) backwards; }
  .coach[hidden] { display: none; }
  @keyframes coach-in { from { opacity: 0; transform: translateY(-8px); } }
  .coach::after { content: ''; position: absolute; top: -5px; left: 26px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .coach b { display: block; font-size: 14px; font-weight: 600; }
  .coach p { margin-top: 6px; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.78); }

  /* ---- every step after this is a layer over the same editor ---- */
  .layer { position: fixed; inset: 0; z-index: 44; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(10,25,37,0.5); overflow-y: auto; animation: fade-in .25s ease backwards; }
  .layer[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
  .sheet { position: relative; z-index: 1; margin: auto; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 44px -16px rgba(10,25,37,0.32); animation: rise .45s cubic-bezier(.2,.8,.2,1) backwards; }

  /* the plans step is the big pricing page, shown over this editor in a transparent frame.
     It brings its own scrim, so this layer adds no background of its own. */
  /* the pricing page and the checkout are both shown over this editor in transparent frames,
     so the layer they sit in adds no background or padding of its own */
  #l-plans:not([hidden]), #l-co:not([hidden]) { background: none; padding: 0; display: block; overflow: hidden; }
  #l-plans iframe, #l-co iframe { width: 100%; height: 100%; border: 0; background: transparent; }

  /* confetti bursts over the card, once, as it lands. It never takes a click. */
  .confetti { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .confetti i { position: absolute; top: 50%; left: 50%; width: 9px; height: 14px; border-radius: 1px; opacity: 0; animation: pop 1.5s cubic-bezier(.16,.84,.44,1) forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(0.4); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); }
  }

  /* what is left to do, straight after checkout. Same points as the top bar menu, as four boxes.
     House modal rules: the close floats outside the card at its top right, and the card carries
     no footer buttons, picking a box is the action. */
  /* the card stays inside the viewport and scrolls its step list, so the close outside it is
     always reachable however short the screen is */
  .won { width: 560px; max-height: calc(100vh - 56px); padding: 28px; display: flex; flex-direction: column; }
  /* the close springs open from nothing once the card has landed, and nudges on hover */
  .won .close { position: absolute; top: 0; left: calc(100% + 10px); width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-size: 15px; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.12); transform-origin: center; transition: background .15s ease, transform .18s cubic-bezier(.2,.9,.3,1.4); animation: x-open .42s .24s cubic-bezier(.2,1.1,.3,1.25) backwards; }
  .won .close:hover { background: #f0f2f5; transform: scale(1.12); }
  .won .close:active { transform: scale(0.94); }
  .won .close i { transition: transform .22s cubic-bezier(.2,.9,.3,1.4); }
  .won .close:hover i { transform: rotate(90deg); }
  @keyframes x-open { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
  .won .eyebrow { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--green-soft); color: #15803d; font-size: 11.5px; font-weight: 600; }
  .won .eyebrow i { font-size: 13px; }
  .won .t { margin-top: 14px; font-size: 24px; font-weight: 500; letter-spacing: -0.018em; }
  .won .s { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }

  /* the payment, confirmed on the same card: what was bought, what was charged, what renews
     and where the receipt went. Typeform and Flodesk put the receipt line under the title and
     the money in a summary block, which is what this follows. */

  /* every step is its own box, stacked down the card */
  .steps-card { margin-top: 20px; min-height: 0; display: flex; flex-direction: column; }
  .steps-h { margin-bottom: 12px; }
  .steps-h b { display: block; font-size: 15px; font-weight: 500; }
  .steps-h span { display: block; margin-top: 4px; font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
  .steps-card .list { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 2px; margin: -2px; }
  .steps-card .row { border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .steps-card .row.todo { transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
  .steps-card .row.todo:hover { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 3px var(--halo); transform: translateY(-1px); }
  .steps-card .row.done { background: var(--soft); border-color: var(--line2); }
  .steps-card .row.done .nm { color: var(--ink2); }

  @media (prefers-reduced-motion: reduce) {
    .ring rect, .menu, .row, .coach, .layer, .sheet, .won .close { animation: none; }
  }
  @media (max-width: 1240px) { .bar .hide-sm { display: none; } }
  @media (max-width: 1180px) {
    .won { width: auto; max-width: 100%; }
    .won .close { left: auto; right: 0; top: -40px; }
    .menu, .coach { left: 12px !important; right: 12px; width: auto; }
  }
</style>
</head>
<body>

<div class="ed-strip">
  <div class="hd"><span><i class="ph ph-list-bullets"></i><i class="ph ph-film-strip"></i></span><i class="ph ph-arrows-in-simple"></i></div>
  <button type="button" class="ed-new"><i class="ph ph-plus"></i>New slide</button>
  <div class="list" id="strip"></div>
</div>
<div class="ed-canvas"><img id="canvas" src="assets/editor/ed-slide-1.jpg" alt="Slide 1" /></div>
<div class="grp ed-bottom">
  <button type="button" class="tb"><i class="ph ph-plus"></i>Insert</button>
  <span class="sp"></span>
  <button type="button" class="tb"><i class="ph ph-palette"></i>Theme</button>
  <span class="sp"></span>
  <button type="button" class="tb"><i class="ph ph-magic-wand"></i>Edit with AI</button>
  <span class="sp"></span>
  <button type="button" class="ib" aria-label="More"><i class="ph ph-dots-three-vertical"></i></button>
</div>

<div class="bar">
  <div class="grp">
    <button type="button" class="ib" aria-label="Home"><i class="ph ph-house"></i></button>
    <span class="sp"></span>
    <span class="deck">Scaling Operations</span>
  </div>
  <span class="gap"></span>

  <div class="pro-wrap">
    <span class="ring" aria-hidden="true"><svg><rect class="rest" rx="3.5" ry="3.5" width="100%" height="100%" pathLength="100"></rect><rect class="h3" rx="3.5" ry="3.5" width="100%" height="100%" pathLength="100"></rect><rect class="h2" rx="3.5" ry="3.5" width="100%" height="100%" pathLength="100"></rect><rect class="h1" rx="3.5" ry="3.5" width="100%" height="100%" pathLength="100"></rect></svg></span>
    <button type="button" class="pro-btn" id="pro-btn" aria-haspopup="true" aria-expanded="false">
      <span class="lbl"><span class="emo">🚀</span>Get most out of Pro</span>
      <span class="sep"></span>
      <span class="car"><i class="ph ph-caret-down"></i></span>
    </button>
  </div>

  <div class="grp cred-grp">
    <span class="c"><span class="emo">✨</span>Credits: 160 left</span>
    <button type="button" class="act" id="upgrade"><i class="ph-fill ph-rocket-launch"></i>Upgrade</button>
  </div>

  <div class="grp av hide-sm"><span class="f">M</span><span class="n">+2</span></div>

  <div class="grp">
    <button type="button" class="tb hide-sm">Share</button>
    <span class="sp"></span>
    <button type="button" class="tb"><i class="ph ph-play"></i>Present</button>
    <span class="sp"></span>
    <button type="button" class="ib hide-sm" aria-label="Analytics"><i class="ph ph-chart-bar"></i></button>
    <span class="sp hide-sm"></span>
    <button type="button" class="tb tb--dark"><i class="ph-fill ph-microsoft-powerpoint-logo"></i>Export as PPT</button>
    <span class="sp"></span>
    <button type="button" class="ib" aria-label="More"><i class="ph ph-dots-three-vertical"></i></button>
  </div>
</div>

<div class="dim" id="dim" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="coach" id="coach" hidden></div>

<div class="layer" id="l-plans" hidden><iframe id="plans-frame" title="Choose a plan"></iframe></div>
<div class="layer" id="l-co" hidden><iframe id="co-frame" title="Checkout"></iframe></div>
<div class="layer" id="l-won" hidden><div class="confetti" id="confetti"></div><div class="sheet won" id="won"></div></div>

<script>
  // the deck behind everything, the same five screens as the community flow
  const DECK = ['ed-slide-1', 'ed-slide-2', 'ed-slide-3', 'ed-canvas', 'ed-slide-5'].map((n) => 'assets/editor/' + n + '.jpg');
  const strip = document.getElementById('strip'), canvas = document.getElementById('canvas');
  let slide = 0;
  const drawStrip = () => {
    strip.innerHTML = DECK.map((src, i) =>
      '<div class="th' + (i === slide ? ' on' : '') + '" data-slide="' + i + '"><span class="n">' + (i + 1) + '</span>' +
      '<img src="' + src + '" alt="Slide ' + (i + 1) + '" /></div>').join('');
    canvas.src = DECK[slide];
    canvas.alt = 'Slide ' + (slide + 1);
  };
  drawStrip();
  strip.addEventListener('click', (e) => {
    const th = e.target.closest('[data-slide]');
    if (!th) return;
    slide = Number(th.dataset.slide);
    drawStrip();
  });

  // ---- the numbers the top bar needs. Prices and points live on the pricing page. ----
  const NAME = { pro: 'Pro', gold: 'Gold', team: 'Team' };
  const CREDITS = { pro: '5,000', gold: '25,000', team: '30,000' };
  const YEAR = { pro: 240, gold: 600, team: 720 };
  const MONTH = { pro: 20, gold: 50, team: 60 };
  const DAY = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const inAYear = () => { const d = new Date(); return d.getDate() + ' ' + DAY[d.getMonth()] + ' ' + (d.getFullYear() + 1); };

  // ---- the steps. One list, used by the modal after checkout and by the top bar menu ----
  const STEPS = [
    { t: 'Set up your Brand Kit', done: false },
    { t: 'Create a project and add knowledge', done: false },
    { t: 'Invite a team member', done: false },
    { t: 'Publish a template to the community', done: false },
    { t: 'Publish your deck as a public link', done: false },
  ];
  const left = () => STEPS.filter((s) => !s.done).length;
  const done = () => STEPS.filter((s) => s.done).length;
  // the ones still to do lead, the finished ones sit under them
  let todoN = 0;
  const rowsHTML = () => (todoN = 0, STEPS
    .map((s, i) => Object.assign({}, s, { n: i + 1 }))
    .sort((a, b) => (a.done === b.done ? a.n - b.n : (a.done ? 1 : -1)))
    .map((s) => s.done
      ? '<div class="row done"><span class="mk"><i class="ph ph-check"></i></span><span class="nm">' + s.t + '</span>' +
        '<span class="chip earned">Earned 50 credits</span></div>'
      : '<button type="button" class="row todo"><span class="mk">' + (++todoN) + '</span><span class="nm">' + s.t + '</span>' +
        '<span class="chip earn">Earn +50</span>' +
        '<span class="go"><i class="ph ph-arrow-right"></i></span></button>').join(''));

  // ---- layers over the editor. Nothing navigates. ----------------------------------
  const L = { plans: document.getElementById('l-plans'), co: document.getElementById('l-co'), won: document.getElementById('l-won') };
  const closeLayers = () => Object.keys(L).forEach((k) => { L[k].hidden = true; });
  const openLayer = (k) => { closeLayers(); L[k].hidden = false; };
  Object.keys(L).forEach((k) => L[k].addEventListener('click', (e) => { if (e.target === L[k] && k !== 'won') L[k].hidden = true; }));

  // the big pricing page, over this editor. It reports the pick back here, so checkout and
  // everything after it stay on this screen.
  const plansFrame = document.getElementById('plans-frame');
  const openPlans = () => {
    if (!plansFrame.src || plansFrame.src.endsWith('about:blank')) plansFrame.src = 'trial-choose-plan-sep-2026-v6.html?tier=2&embed=1';
    openLayer('plans');
  };
  addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'picker-close') { closeLayers(); plansFrame.src = 'about:blank'; }
    if (e.data.type === 'pick-plan') { plansFrame.src = 'about:blank'; openCheckout(e.data.plan, e.data.off); }
    if (e.data.type === 'checkout-close') { closeLayers(); coFrame.src = 'about:blank'; }
    if (e.data.type === 'checkout-paid') { coFrame.src = 'about:blank'; paid(e.data.plan); }
  });

  // the real checkout, the same one the pricing page opens, over this editor
  const coFrame = document.getElementById('co-frame');
  const openCheckout = (k, off) => {
    coFrame.src = 'checkout-buy-sep-2026.html?plan=' + (NAME[k] ? k : 'pro') + '&off=' + (off || 0);
    openLayer('co');
  };

  // what is left to do, straight after checkout. The same points the menu will hold.
  let plan = 'pro';
  const paid = (k) => {
    plan = NAME[k] ? k : 'pro';
    document.body.classList.add('paid');
    proBtn.querySelector('.lbl').innerHTML = '<span class="emo">\uD83D\uDE80</span>Get most out of ' + NAME[plan];
    drawMenu();
    document.getElementById('won').innerHTML =
      '<button type="button" class="close" data-dismiss aria-label="Close"><i class="ph ph-x"></i></button>' +
      '<span class="eyebrow"><i class="ph-fill ph-check-circle"></i>Payment complete</span>' +
      '<div class="t">You\u2019re on ' + NAME[plan] + '</div>' +
      '<div class="s">' + CREDITS[plan] + ' credits are on your account. $' + YEAR[plan] +
      ' billed today, renews ' + inAYear() + '.</div>' +
      '<div class="steps-card">' +
        '<div class="steps-h"><b>Earn ' + (left() * 50) + ' more credits</b>' +
        '<span>' + left() + ' steps, 50 credits each' +
        (done() ? '. You have earned ' + (done() * 50) + ' so far.' : '. Claim them whenever you like.') + '</span></div>' +
        '<div class="list">' + rowsHTML() + '</div>' +
      '</div>';
    openLayer('won');
    burst();
  };

  // one burst of confetti behind the card, skipped when motion is turned down
  const CONF = ['#005EFF', '#74A6FF', '#16a34a', '#C08E2A', '#f97316', '#111827'];
  const burst = () => {
    const box = document.getElementById('confetti');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { box.innerHTML = ''; return; }
    box.innerHTML = Array.from({ length: 44 }, (_, i) => {
      const a = (Math.PI * 2 * i) / 44 + Math.random() * 0.3;
      const d = 180 + Math.random() * 320;
      return '<i style="background:' + CONF[i % CONF.length] +
        ';--dx:' + Math.round(Math.cos(a) * d) + 'px' +
        ';--dy:' + Math.round(Math.sin(a) * d * 0.72) + 'px' +
        ';--rot:' + Math.round(Math.random() * 720 - 360) + 'deg' +
        ';animation-delay:' + Math.round(Math.random() * 120) + 'ms"></i>';
    }).join('');
  };

  // ---- the top bar menu and the coach mark ------------------------------------------
  const menu = document.getElementById('menu'), dim = document.getElementById('dim'), coach = document.getElementById('coach');
  const proBtn = document.getElementById('pro-btn');
  const drawMenu = () => { menu.innerHTML = rowsHTML(); };
  const place = () => {
    const r = proBtn.getBoundingClientRect();
    menu.style.left = Math.max(12, r.left) + 'px';
    coach.style.left = Math.max(12, r.left) + 'px';
    coach.style.top = (menu.getBoundingClientRect().bottom + 10) + 'px';
  };
  // the menu does not cover the page: a click anywhere else closes it
  const openMenu = () => { menu.hidden = false; place(); proBtn.setAttribute('aria-expanded', 'true'); };
  const closeMenu = () => {
    menu.hidden = true; dim.hidden = true; coach.hidden = true;
    document.body.classList.remove('coaching');
    proBtn.setAttribute('aria-expanded', 'false');
  };
  proBtn.addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
  dim.addEventListener('click', closeMenu);
  document.addEventListener('mousedown', (e) => {
    if (menu.hidden || document.body.classList.contains('coaching')) return;
    if (!e.target.closest('.menu') && !e.target.closest('.pro-wrap')) closeMenu();
  });

  // hovering the button opens the menu, and the pointer can cross to it without it shutting.
  // While the coach mark is up the menu stays put: that one is dismissed on purpose.
  let hoverOut;
  const hoverOpen = () => { clearTimeout(hoverOut); if (menu.hidden) openMenu(); };
  const hoverShut = () => {
    clearTimeout(hoverOut);
    hoverOut = setTimeout(() => { if (!document.body.classList.contains('coaching')) closeMenu(); }, 220);
  };
  [document.querySelector('.pro-wrap'), menu].forEach((el) => {
    el.addEventListener('mouseenter', hoverOpen);
    el.addEventListener('mouseleave', hoverShut);
  });
  addEventListener('resize', () => { if (!menu.hidden) place(); });
  // a step is work in the editor, so picking one closes the menu and leaves you in it
  menu.addEventListener('click', (e) => { if (e.target.closest('.row.todo')) closeMenu(); });

  const dismissWon = () => {
    L.won.hidden = true;
    coach.innerHTML = '<b>We’ve got you covered</b>' +
      '<p>Open this menu anytime to see what ' + NAME[plan] + ' covers. ' +
      (left() === 1 ? '1 step left adds 50 credits.' : left() + ' steps left add 50 credits each.') + '</p>';
    openMenu();
    coach.hidden = false;
    dim.hidden = false;
    document.body.classList.add('coaching');
    place();
  };

  // the pricing page and the checkout close and buy for themselves, so the only click left
  // to catch here is the one that dismisses the step list
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-dismiss]')) { dismissWon(); return; }
    if (!L.won.hidden && e.target.closest('.row.todo')) dismissWon();
  });
  document.getElementById('upgrade').addEventListener('click', () => { closeMenu(); openPlans(); });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!L.plans.hidden || !L.co.hidden) { closeLayers(); return; }
    if (!menu.hidden) closeMenu();
  });

  // ?step=plans|checkout|paid opens straight on that layer, so each one is linkable
  const q = new URLSearchParams(location.search);
  const step = q.get('step'), want = NAME[q.get('plan')] ? q.get('plan') : 'pro';
  if (step === 'plans') openPlans();
  else if (step === 'checkout') openCheckout(want);
  else if (step === 'paid') paid(want);
  else if (q.get('menu') === '1') { document.body.classList.add('paid'); drawMenu(); openMenu(); }
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
