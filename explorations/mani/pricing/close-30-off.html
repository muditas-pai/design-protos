<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>30% off close modal · Presentation Pass · close-intent modal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:#000;color:#171717;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{position:relative;width:860px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 24px 48px -16px rgba(0,0,0,.5);padding:48px;animation:in .32s cubic-bezier(.22,1,.36,1)}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .x{position:absolute;top:0;right:-44px;width:32px;height:32px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;font-size:14px;color:#171717;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.4,.64,1)}
  .x:hover{transform:scale(1.08) rotate(90deg)}
  h1{font-size:36px;font-weight:500;letter-spacing:-0.5px;color:#171717}

  /* banner */
  .ban{position:relative;margin-top:24px;height:394px;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a1a8a}
  .ban .stripes{position:absolute;inset:-20px;background:
    linear-gradient(90deg,#03071f 0%,#0b1a8f 6%,#0a0d3a 9%,#1a34d6 14%,#050b3d 18%,#2f5bff 24%,#0b1a8f 27%,#0a1f9c 31%,#1e3ee0 34%,#0b1a8f 39%,#3b6bff 43%,#0d1c9a 47%,#2a4de6 52%,#101d9b 56%,#4a7aff 60%,#0b1a8f 63%,#2f5bff 67%,#1a2fbe 72%,#5b83ff 76%,#0e1c94 80%,#3b6bff 84%,#2a4de6 88%,#6a90ff 93%,#3b6bff 100%);
    filter:blur(6px) saturate(1.15)}
  .ban .glow{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 35%,rgba(0,0,0,.35))}
  .ban .dots{position:absolute;left:0;top:0;bottom:0;width:48%;background-image:radial-gradient(rgba(255,255,255,.55) 1.1px,transparent 1.6px);background-size:9px 9px;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 55%,transparent 100%);mask-image:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 55%,transparent 100%);mix-blend-mode:overlay}

  /* coupon card */
  .card{position:relative;z-index:1;width:640px;height:190px;background:#fff;border-radius:8px;display:flex;align-items:stretch;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);overflow:hidden}
  .card .ic{width:185px;background:#e3edff;display:grid;place-items:center;position:relative;flex:none}
  .card .ic i{font-size:72px;color:#0055ED}
  .card .tear{position:absolute;right:-9px;top:0;bottom:0;width:18px;background-image:radial-gradient(circle at 50% 50%,#fff 6px,transparent 6.5px);background-size:18px 18px;background-position:0 -9px;background-repeat:repeat-y;z-index:2}
  .card .tx{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:36px}
  .card .tx b{font-size:52px;font-weight:600;color:#0055ED;letter-spacing:-1.4px;line-height:1.05}
  .card .tx span{font-size:18px;color:#171717;margin-top:8px}
  .card .tx span s{color:#8a8a8a;margin-right:4px}
  .card .tx span em{font-style:normal;color:#737373}

  p{font-size:20px;color:#171717;line-height:1.55;margin-top:24px;max-width:640px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
  .btn{height:70px;border-radius:6px;font:500 20px Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid #e5e5e5;background:#fff;color:#171717}
  .btn:hover{background:#fafafa}
  .btn.navy{background:linear-gradient(180deg,#1c3550,#0A1925);color:#fff;border:0;position:relative;overflow:hidden;font-weight:600}
  .btn.navy:hover{background:linear-gradient(180deg,#2f4763,#23303B)}
  .btn.navy::before{content:"";position:absolute;top:0;left:0;width:60%;height:100%;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.3) 50%,transparent 100%);transform:translateX(-180%) skewX(-20deg);animation:sh 2.8s ease-in-out 1.4s infinite;pointer-events:none}
  @keyframes sh{0%{transform:translateX(-180%) skewX(-20deg)}55%{transform:translateX(320%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
  /* ticket modal */
  .tm{width:970px;padding:56px 100px 60px;text-align:center}
  .tm h1{font-size:32px;letter-spacing:-0.4px}
  .tm .s{font-size:16px;color:#525252;margin-top:6px}
  .ticket{position:relative;width:660px;height:380px;margin:36px auto 0;filter:drop-shadow(0 12px 28px rgba(10,25,37,.14))}
  .ticket svg.shape{position:absolute;inset:0;width:100%;height:100%}
  .ticket .face{position:absolute;inset:32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0}
  .ticket .cap{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#4b5563}
  .ticket .big{font-size:76px;font-weight:800;letter-spacing:-2px;color:#0055ED;line-height:1;padding-right:70px}
  .ticket .serial{position:absolute;left:14px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:center;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.14em;color:#374151;white-space:nowrap}
  .ticket .stamp{position:absolute;right:26px;top:80px;width:170px;height:170px}
  .ticket .stamp .ring{position:absolute;inset:0;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ticket .stamp .star{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;color:#0b0f14}
  .ticket .stamp .lines{position:absolute;left:-60px;bottom:4px;width:96px;height:54px}
  .tm .row2{margin-top:60px}
  [hidden]{display:none !important}
  .tabs{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
  .tab{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:999px;padding:7px 14px;font:600 12.5px Inter,sans-serif;color:#ddd;cursor:pointer}
  .tab.is-active{background:#fff;color:#171717;border-color:#fff}
  .card .tx b{font-size:40px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em}
  .card .tx span:empty{display:none}
</style>
</head>
<body>
  <div class="tabs" id="tabs">
    <button class="tab is-active" data-o="0">A · Before you go</button>
    <button class="tab" data-o="1">B · One thing</button>
    <button class="tab" data-o="2">C · Was it the price?</button>
    <button class="tab" data-o="3">D · Saved for 7 days</button>
    <button class="tab" data-o="4">E · Ship for less</button>
    <button class="tab" data-o="5">F · Still deciding</button>
    <button class="tab" data-o="6">G · Any plan, $ shown</button>
    <button class="tab" data-o="7">H · One deck pays</button>
    <button class="tab" data-o="8">I · Not this time</button>
  </div>
  <div class="modal" id="m1" role="dialog" aria-modal="true" aria-labelledby="t">
    <h1 id="t" data-k="title">Before you go...</h1>

    <div class="ban">
      <div class="stripes"></div>
      <div class="glow"></div>
      <div class="dots"></div>
      <div class="card">
        <div class="ic"><i class="ph-fill ph-ticket" id="ic"></i><span class="tear"></span></div>
        <div class="tx">
          <b data-k="big">Presentation Pass</b>
          <span data-k="sub"><s>Pro $240/yr</s> US$19.99 once <em>every feature for 7 days</em></span>
        </div>
      </div>
    </div>

    <p data-k="body">Everything in the app for a week, then it simply ends. No subscription, nothing renews.<br>Yours whenever you're ready.</p>

    <div class="row2"><button class="btn" type="button" data-k="no">Done</button><button class="btn navy" type="button" data-k="cta">Get the pass for US$19.99</button></div>
    <button class="x" type="button" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>


<script>
  var OPTS = [
    { icon: 'ph-gift', title: 'Before you go...', big: '30% off<br>Pro &amp; Gold', sub: '',
      body: 'Take 30% off your first year on either plan. Same features, same credits, a smaller bill.<br>It stays on your account, so use it whenever you\'re ready.', no: 'No thanks', cta: 'Claim 30% off' },
    { icon: 'ph-gift', title: 'One thing before you go', big: '30% off<br>your first year', sub: '',
      body: 'We would rather you try it than leave. Pick Pro or Gold and the discount applies at checkout.<br>No code, nothing to remember.', no: 'Maybe later', cta: 'Pick a plan at 30% off' },
    { icon: 'ph-gift', title: 'Was it the price?', big: 'Save $72<br>to $180', sub: '',
      body: 'Every feature, every credit, 30% less for your first year.<br>Still not right? Close this and nothing changes.', no: 'Not for me', cta: 'Get 30% off' },
    { icon: 'ph-gift', title: 'Thanks for looking', big: '30% off<br>Pro or Gold', sub: '',
      body: 'Your discount is waiting on your account for the next 7 days.<br>Come back when the next deck is due and it will still be here.', no: 'Done', cta: 'Claim 30% off' },
    { icon: 'ph-gift', title: 'Ship the next deck for less', big: '30% off<br>Pro &amp; Gold', sub: '',
      body: 'Exports, Brand Kit and frontier AI, at 30% less for your first year.<br>Nothing changes about the plan, only the price.', no: 'Not now', cta: 'Claim 30% off' },
    { icon: 'ph-gift', title: 'Still deciding?', big: 'First year<br>30% off', sub: '',
      body: 'Take the time you need. The discount is on your account, and it applies the moment you pick Pro or Gold.<br>No code, no expiry today.', no: 'I\'ll pass', cta: 'Claim 30% off' },
    { icon: 'ph-gift', title: 'Let us make it easier', big: '30% off<br>any plan', sub: '',
      body: 'Pro for $168 or Gold for $420 this year, instead of $240 and $600.<br>Every feature, every credit, no code.', no: 'No thanks', cta: 'Pick a plan at 30% off' },
    { icon: 'ph-gift', title: 'One deck can pay for this', big: '30% off<br>Pro &amp; Gold', sub: '',
      body: 'A single client deck is worth more than a year of Pro at $168.<br>Try it at 30% off and see for yourself.', no: 'Maybe later', cta: 'Claim 30% off' },
    { icon: 'ph-gift', title: 'Not this time?', big: 'Come back<br>at 30% off', sub: '',
      body: 'No hard feelings. Your 30% off Pro or Gold stays on your account for whenever the next presentation lands.<br>Nothing to do now.', no: 'Done', cta: 'Claim 30% off' }
  ];
  function apply(i) { var o = OPTS[i]; document.querySelectorAll('[data-k]').forEach(function (el) { el.innerHTML = o[el.dataset.k]; }); document.getElementById('ic').className = 'ph-fill ' + (o.icon || 'ph-gift'); }
  document.getElementById('tabs').addEventListener('click', function (e) { var t = e.target.closest('.tab'); if (!t) return;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('is-active', b === t); }); apply(+t.dataset.o); });
  apply(0);
  var q = new URLSearchParams(location.search).get('o'); if (q) { document.querySelector('.tab[data-o="' + q + '"]')?.click(); }
</script>
<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
</script>
</body>
</html>
