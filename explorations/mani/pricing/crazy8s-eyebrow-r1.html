<title>crazy8s · Eyebrow ripples · Round 6</title>

<style>
  /* Figma FilrWEhw4GFBJqKUpKabCa node 1178-21215 ("free trail", modal frame 1176x620) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  /* static editor screen behind the modal, design context only */
  body { background: #e5e7eb url(assets/checkout/editor-bg.jpg) center top / cover no-repeat; }
  .backdrop { position: fixed; inset: 0; background: rgba(10,25,37,0.45); display: flex; align-items: center; justify-content: center; }

  .dp-stack { position: relative; display: flex; gap: 10px; align-items: flex-start; }

  /* entrance: scrim fades, the box rises and settles, close follows */
  @keyframes dp-bd-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dp-box-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  .backdrop { animation: dp-bd-in .25s ease backwards; }
  .dp-box { animation: dp-box-in .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .dp-close { animation: dp-bd-in .3s .15s ease backwards; }
  .dp-close { transition: background 0.15s ease; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 0; border-radius: 24px; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.18); color: #171717; font-size: 15px; }
  .dp-close:hover { background: #ececec; }
  .dp-box { position: relative; width: 1176px; background: #fff; border-radius: 4px; overflow: hidden; flex: none; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.3); }
  .dp-body { display: flex; height: 620px; }

  /* proto switch: tier 1 (trial + 20% off) vs tier 2 (no trial, full price) */
  .tier-bar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 6px 18px -6px rgba(10,25,37,0.35); }
  .tier-bar button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 150px; padding: 6px 16px; border: 0; border-radius: 999px; background: transparent; font-family: inherit; color: #525252; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tier-bar button b { font-size: 12.5px; font-weight: 600; }
  .tier-bar button small { font-size: 10.5px; font-weight: 400; color: #8a8a8a; }
  .tier-bar button:hover:not(.is-on) { background: #f0f2f5; }
  .tier-bar button.is-on { background: #171717; color: #fff; }
  .tier-bar button.is-on small { color: rgba(255,255,255,0.65); }

  /* "before you go" eyebrow: slides in above the modal body when tier 2 is closed */
  .eyebrow { position: absolute; left: 20px; width: 1136px; top: -38px; height: 50px; z-index: 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px 12px; border-radius: 8px 8px 0 0; background: #0B1FBB; color: #fff; font-size: 13px; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; transform: translateY(38px); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s ease; }
  .eyebrow.is-open { transform: none; opacity: 1; }
  .dp-box { z-index: 1; }
  .card.is-flash { animation: c-flash .9s ease; }
  @keyframes c-flash { 30% { box-shadow: 0 0 0 4px rgba(0,94,255,0.25); } }

  body.tier2 #btn-trial, body.tier2 #note-trial, body.tier2 .or { display: none; }
  body.tier2 .ctas { margin-top: 24px; }

  .closed-note { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; font-size: 14px; }
  .closed-note button { padding: 9px 18px; border: 0; border-radius: 4px; background: #fff; color: #171717; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  body.is-closed .dp-stack { display: none; }
  body.is-closed .closed-note { display: flex; }

  /* left */
  .pane-l { width: 806px; flex: none; padding: 22px 0 0 24px; display: flex; flex-direction: column; }
  .ttl-row { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 14px; min-height: 30px; }
  .dp-pill { order: -1; }
  .dp-pill .t b { font-weight: 700; }
  .dp-pill .t .soft { font-weight: 400; opacity: 0.85; }
  .ttl.is-swap { animation: dp-rise .45s cubic-bezier(.2,.8,.2,1) both; }
  body.offer .ttl { font-size: 24px; letter-spacing: -0.01em; }
  .ttl { font-size: 18px; font-weight: 500; line-height: 1.3; }
  .ttl .off { display: none; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
  .dp-pill { position: relative; isolation: isolate; display: none; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .dp-pill::before { content: ''; position: absolute; left: 22px; bottom: -4px; width: 9px; height: 9px; background: #00225C; border-radius: 1px; transform: rotate(45deg); z-index: -1; }
  .dp-pill .sep { opacity: 0.5; font-weight: 400; }
  .dp-pill .t { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; opacity: 0.95; font-variant-numeric: tabular-nums; }
  .dp-pill .t i { font-size: 13px; }
  body.offer .ttl .off { display: inline; }
  body.offer .dp-pill { display: inline-flex; animation: pill-in 0.5s 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, pill-bob 1.6s 0.7s ease-in-out infinite, pill-ripple 2.2s 0.7s ease-in-out infinite; }
  @keyframes pill-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes pill-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes pill-ripple {
    0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0.55); }
    70%      { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 10px rgba(0,85,237,0); }
    100%     { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0); }
  }

  .preview { position: relative; margin: auto 0; width: 762px; height: 430px; border-radius: 8px; overflow: hidden; background: #0b1fbb; flex: none; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 8px 24px -12px rgba(10,25,37,0.35); }
  .preview::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; }
  .preview .pv-item { position: absolute; inset: 0; opacity: 0; transform: scale(1.02); transition: opacity .55s ease, transform .9s ease; }
  .preview .pv-item.is-on { opacity: 1; transform: scale(1); }
  .preview img, .preview video { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center; }
  .avail { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-radius: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(10,25,37,0.15); font-size: 12.5px; color: #404040; }
  #avail-pills { display: inline-flex; align-items: center; gap: 8px; }
  .tp-group { display: inline-flex; align-items: center; gap: 6px; }
  .tp-note { font-size: 11.5px; color: #737373; margin-left: 2px; white-space: nowrap; }
  .tp-sep { width: 1px; height: 14px; background: rgba(10,25,37,0.15); margin: 0 2px; }
  .avail .tp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .avail .tp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .avail .tp--pro  { color: #0055ED; }
  .avail .tp--gold { color: #c9932a; }
  .avail .tp--team { color: #171717; }
  .avail .tp--free { color: #16a34a; }

  .tabs-wrap { position: relative; margin: 20px 0 20px -24px; width: 806px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); }
  .tabs { display: flex; gap: 10px; padding: 0 24px; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; scroll-behavior: smooth; touch-action: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #e5e5e5; background: #fff; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #404040; cursor: pointer; white-space: nowrap; overflow: hidden; transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease; }
  .tab i { font-size: 16px; color: #737373; transition: color .2s ease; }
  .tab:hover { border-color: #c9cdd2; color: #171717; }
  .tab:focus, .tab:focus-visible { outline: none; }
  .tab.is-on { background: #fff; border-color: #cfe0ff; color: #0055ED; }
  .tab.is-on i { color: #0055ED; }
  .tab .fill { position: absolute; inset: 0; background: #e8f0fe; transform: scaleX(0); transform-origin: left center; pointer-events: none; }
  .tab > i, .tab > span { position: relative; z-index: 1; }

  .foot-l { margin: 0 0 0 -24px; width: 806px; height: 66px; border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 22px; padding: 0 24px; overflow: hidden; }
  .foot-l .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #404040; white-space: nowrap; flex: none; }
  .foot-l .loved img { height: 16px; width: auto; }
  .sp-wrap { flex: 1; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; animation: sp-marquee 120s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 34px; width: auto; max-width: 120px; object-fit: contain; }

  /* right */
  .pane-r { width: 370px; flex: none; background: #f5f9ff; border-left: 1px solid rgba(10,25,37,0.06); padding: 22px 20px 0; display: flex; flex-direction: column; }
  .card { position: relative; display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px 18px 14px; cursor: pointer; }
  .card + .card { margin-top: 12px; }
  @keyframes dp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card, .ctas, .foot-r { animation: dp-rise .4s cubic-bezier(.2,.8,.2,1) backwards; }
  .card:nth-child(1) { animation-delay: .12s; } .card:nth-child(2) { animation-delay: .18s; } .card:nth-child(3) { animation-delay: .24s; } .ctas { animation-delay: .3s; } .foot-r { animation-delay: .36s; }
  .card.is-sel { border-color: #005eff; box-shadow: inset 0 0 0 0.5px #005eff, 0 0 0 3px rgba(0,94,255,0.08); background: #eaf2ff; }
  .card.is-sel .c-cred { background: #d6e5ff; }
  .card:hover:not(.is-sel) { border-color: #c9cdd2; }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #d4d4d4; background: #fff; margin-top: 3px; flex: none; }
  .card:hover:not(.is-sel) .radio { border-color: #a3a3a3; }
  .is-sel .radio { border: 5px solid #005eff; }
  .c-main { flex: 1; min-width: 0; }
  .c-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .c-name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .c-name i { font-size: 16px; }
  .c-price { font-size: 16px; font-weight: 500; white-space: nowrap; }
  .c-price s { color: #a3a3a3; font-weight: 400; margin-right: 5px; }
  .c-price small { display: block; font-size: 11px; font-weight: 400; color: #737373; text-align: right; margin-top: 2px; }
  .c-cred { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: #e8f0fe; color: #0055ED; font-size: 12px; font-weight: 500; }
  .c-cred i { font-size: 11px; }

  .ctas { margin-top: 20px; }
  .note { margin-top: 7px; text-align: center; font-size: 11.5px; line-height: 1.45; color: #737373; white-space: nowrap; }
  .note b { font-weight: 500; color: #404040; }
  .note .blue { font-weight: 500; color: #005eff; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; border-radius: 4px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .15s ease; }
  .btn:active { transform: translateY(0); }
  .btn--trial { background: #fff; border: 1px solid #e5e5e5; color: #171717; }
  .btn--trial:hover { background: #f5f5f5; border-color: #d4d4d4; color: #171717; }
  .or { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: #a3a3a3; font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: rgba(10,25,37,0.1); }
  .btn--buy { background: #171717; border: 0; color: #fff; }
  .btn--buy:hover { background: #000; box-shadow: 0 2px 8px rgba(10,25,37,0.2); transform: translateY(-1px); }

  .foot-r { margin-top: auto; height: 66px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12px; font-weight: 500; color: #525252; white-space: nowrap; }
  .foot-r span { display: inline-flex; align-items: center; gap: 6px; }
  .foot-r img { height: 18px; width: auto; }

  /* responsive: fluid widths, panes stack under 900px, page scrolls when the box is taller than the window */
  .backdrop { overflow-y: auto; padding: 16px; align-items: flex-start; }
  .dp-stack { margin: auto; max-width: 100%; }
  .dp-box { width: min(1176px, calc(100vw - 70px)); }
  .eyebrow { width: auto; left: 10px; right: 48px; overflow: hidden; text-overflow: ellipsis; } /* 10px inset each side of the box, 38px for gap + close button */
  .pane-l { width: auto; flex: 1 1 0; min-width: 0; padding-right: 20px; }
  .preview { width: 100%; height: auto; aspect-ratio: 762 / 430; }
  .tabs-wrap, .foot-l { width: calc(100% + 44px); }
  @media (max-width: 900px) {
    .dp-body { flex-direction: column; height: auto; }
    .pane-r { width: 100%; padding: 20px 20px 0; border-left: 0; border-top: 1px solid rgba(10,25,37,0.06); }
    .foot-r { height: 56px; }
    .tier-bar button { min-width: 120px; padding: 5px 12px; }
  }
  @media (max-width: 520px) {
    .dp-box { width: calc(100vw - 32px); }
    .dp-stack { flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
    .ttl-row { flex-wrap: wrap; }
    .eyebrow { right: 20px; white-space: normal; height: auto; padding-top: 8px; text-align: center; }
    .note { white-space: normal; }
  }

  /* close: the video side folds away and the plan column becomes a small offer card */
  /* close, card lift: the plan column lifts off the surface, glides left into place as the box narrows, then settles.
     The video side is frozen at its size, dims and fades underneath */
  body.offer .dp-box { width: 460px; }
  body.offer .pane-l { padding: 0; overflow: hidden; pointer-events: none; opacity: 0; filter: brightness(.7); }
  body.offer .pane-l .tabs-wrap, body.offer .pane-l .foot-l { width: 806px; }
  body.offer .pane-l .preview { width: 762px; height: 430px; aspect-ratio: auto; }
  body.offer .pane-l .sp-track { animation-play-state: paused; }
  body.offer .pane-r { width: 460px; padding: 22px 28px 0; border-left-color: transparent; animation: card-lift 1s cubic-bezier(.65,0,.35,1) both; }
  .dp-box { transition: width .8s cubic-bezier(.65,0,.35,1) .1s; }
  .pane-r { position: relative; z-index: 2; transition: width .8s cubic-bezier(.65,0,.35,1) .1s, padding .8s cubic-bezier(.65,0,.35,1) .1s, border-color .2s ease .3s; }
  .pane-l { transition: opacity .5s ease .25s, filter .4s ease, padding .8s cubic-bezier(.65,0,.35,1) .1s; }
  @keyframes card-lift { 0% { transform: none; box-shadow: none; } 35% { transform: translateY(-10px) scale(1.015); box-shadow: 0 30px 50px -20px rgba(10,25,37,0.45); } 100% { transform: none; box-shadow: none; } }
  .ttl-sub { display: none; margin: -6px 0 14px; font-size: 13px; line-height: 1.4; color: #525252; }
  body.offer .ttl-sub { display: block; animation: dp-rise .4s .2s cubic-bezier(.2,.8,.2,1) both; }
  .c-price s { display: inline-block; }
  .c-price .c-num { display: inline-block; font-variant-numeric: tabular-nums; }
  .odo { display: inline-flex; vertical-align: baseline; height: 1em; line-height: 1; overflow: hidden; }
  .odo .dg { display: block; height: 1em; overflow: hidden; }
  .odo .st { display: flex; flex-direction: column; transition: transform .95s cubic-bezier(.65,0,.3,1); will-change: transform; }
  .odo .st span { display: block; height: 1em; line-height: 1; }
  .c-price.is-drop s { animation: s-in .45s 1.05s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes s-in { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }

  /* crazy8s: variant bar, top right */
  .var-bar { position: fixed; top: 16px; right: 16px; z-index: 20; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 6px 18px -6px rgba(10,25,37,0.35); }
  .var-bar button { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 64px; padding: 5px 8px; border: 0; border-radius: 999px; background: transparent; font-family: inherit; color: #525252; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .var-bar button b { font-size: 12px; font-weight: 600; }
  .var-bar button small { font-size: 10px; color: #8a8a8a; }
  .var-bar button:hover:not(.is-on) { background: #f0f2f5; }
  .var-bar button.is-on { background: #005EFF; color: #fff; }
  .var-bar button.is-on small { color: rgba(255,255,255,0.75); }
  .var-bar button.replay { background: #0A1925; color: #fff; }
  body.no-anim .dp-box, body.no-anim .pane-l, body.no-anim .pane-r, body.no-anim .eyebrow { transition: none !important; animation: none !important; }

  /* eyebrow, center glow family: blue band, light concentrated behind the copy */
  .eyebrow b { font-weight: 700; }
  .eyebrow { color: #fff; }
  .eyebrow::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  body.v1 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v2 .eyebrow { background: radial-gradient(95% 320% at 50% 50%, #1C6BF3 0%, #0B1FBB 72%); }
  /* 3 ripple rings: fine concentric rings roll out from the centre */
  body.v3 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v3 .eyebrow::before { background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.16) 0 2px, transparent 2px 28px); animation: rings 3s linear infinite; }
  @keyframes rings { from { transform: scale(1); opacity: 1; } to { transform: scale(1.3); opacity: .15; } }

  /* 4 sonar: one ring at a time swells out from the centre and fades, two staggered */
  body.v4 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v4 .eyebrow::before, body.v4 .eyebrow::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; left: 50%; top: 50%; inset: auto; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); animation: sonar 2.6s ease-out infinite; }
  body.v4 .eyebrow::after { animation-delay: 1.3s; }
  @keyframes sonar { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(14); opacity: 0; } }

  /* 5 wave: soft light bands roll across the band like water */
  body.v5 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v5 .eyebrow::before { background: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 40px, rgba(255,255,255,0.14) 60px, rgba(255,255,255,0) 80px); background-size: 160px 100%; filter: blur(3px); animation: wave 4s linear infinite; }
  @keyframes wave { from { background-position: 0 0; } to { background-position: 160px 0; } }

  /* 6 drop: rings spread from the gift icon at the left of the copy */
  body.v6 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v6 .eyebrow::before, body.v6 .eyebrow::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; left: calc(50% - 150px); top: 50%; inset: auto; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.75); animation: sonar 2.8s ease-out infinite; }
  body.v6 .eyebrow::after { animation-delay: .9s; }

  /* 7 breathing glow: the light behind the copy swells and settles */
  body.v7 .eyebrow { background: #0B1FBB; }
  body.v7 .eyebrow::before { background: radial-gradient(50% 220% at 50% 50%, #2F7BFF 0%, rgba(11,31,187,0) 68%); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scaleX(.9); } 50% { opacity: 1; transform: scaleX(1.1); } }

  /* 8 shockwave: one strong ring bursts out when the band opens, then a faint ripple idles */
  body.v8 .eyebrow { background: radial-gradient(55% 220% at 50% 50%, #2F7BFF 0%, #0B1FBB 62%); }
  body.v8 .eyebrow::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; left: 50%; top: 50%; inset: auto; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }
  body.v8 .eyebrow.is-open::after { animation: shock 1.1s .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes shock { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(22); opacity: 0; } }
  body.v8 .eyebrow::before { background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0 2px, transparent 2px 30px); animation: rings 4s 1.4s linear infinite; opacity: 0; }
  body.v8 .eyebrow.is-open::before { opacity: 1; transition: opacity .6s 1.4s ease; }
</style>
</head>
<body>

<div class="var-bar" role="tablist" aria-label="Eyebrow ripple">
  <button type="button" data-v="1"><b>1</b><small>Center glow</small></button>
  <button type="button" data-v="2"><b>2</b><small>Wide soft</small></button>
  <button type="button" data-v="3"><b>3</b><small>Rings</small></button>
  <button type="button" data-v="4"><b>4</b><small>Sonar</small></button>
  <button type="button" data-v="5"><b>5</b><small>Wave</small></button>
  <button type="button" data-v="6"><b>6</b><small>Drop</small></button>
  <button type="button" data-v="7"><b>7</b><small>Breathing</small></button>
  <button type="button" data-v="8"><b>8</b><small>Shockwave</small></button>
  <button type="button" class="replay" id="replay"><b>Replay</b><small>close again</small></button>
</div>
<div class="tier-bar" role="tablist" aria-label="Pricing tier">
  <button type="button" data-tier="1" class="is-on"><b>Tier 1</b><small>7 day trial + 20% off</small></button>
  <button type="button" data-tier="2"><b>Tier 2</b><small>No trial, full price</small></button>
</div>

<div class="backdrop">
  <div class="closed-note"><span>Modal closed.</span><button type="button" id="reopen">Reopen</button></div>
  <div class="dp-stack">
    <div class="eyebrow" id="eyebrow" aria-live="polite"><span>🎁</span><span>Before you go, <b>20% off</b> for the next hour.</span></div>
    <div class="dp-box">
      <div class="dp-body">

      <div class="pane-l">
        <div class="preview" id="preview">
          <div class="avail"><span>Available on:</span><span id="avail-pills"></span></div>
        </div>
        <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
        <div class="foot-l">
          <span class="loved"><img src="assets/checkout/badge-heart.svg" alt="" />Loved by 12M+ Presenters at</span>
          <span class="sp-wrap"><span class="sp-track" id="sp-track"></span></span>
        </div>
      </div>

      <div class="pane-r">
        <div class="ttl-row">
          <h2 class="ttl" id="ttl">Choose your plan</h2>
          <div class="dp-pill"><span class="t"><i class="ph-fill ph-clock"></i><b>Offer</b><span class="soft">ends in</span><span id="dp-timer">59:56</span></span></div>
        </div>
        <p class="ttl-sub">Offer applied on every plan for the next hour.</p>
        <div id="cards"></div>
        <div class="ctas">
          <button type="button" class="btn btn--trial" id="btn-trial">Start your 7 day free trial</button>
          <p class="note" id="note-trial"></p>
          <div class="or">OR</div>
          <button type="button" class="btn btn--buy" id="btn-buy">Buy Pro at 20% OFF</button>
        </div>
        <div class="foot-r">
          <span><img src="assets/checkout/badge-gdpr.svg" alt="" />GDPR compliant</span>
          <span><img src="assets/checkout/badge-soc2.svg" alt="" />SOC 2 Type II</span>
        </div>
      </div>

      </div>
    </div>
    <button type="button" class="dp-close" id="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>
</div>

<script>
  // Same feature list and media as the feature modal. Plays through on its own, one by one.
  const FEATURES = [
    { key: 'export',    label: 'Export presentations',   icon: 'ph-export',            dots: ['pro','gold','team'], video: 'trigger_export' },
    { key: 'brandkit',  label: 'Brand kit',              icon: 'ph-swatches',          dots: ['pro','gold','team'], video: 'trigger_brandkit', mp4Only: true },
    { key: 'knowledge', label: 'Shared knowledge base',  icon: 'ph-book-open',         dots: ['gold','team'],       video: 'trigger_knowledge', mp4Only: true },
    { key: 'team',      label: 'Collaborations',         icon: 'ph-users-three',       dots: ['team'],              video: 'trigger_assign_invite', mp4Only: true },
    { key: 'ultra',     label: 'Ultra/Pro AI model',     labelFor: { pro: 'Pro AI model', gold: 'Ultra AI model', team: 'Ultra AI model' }, icon: 'ph-sparkle',           dots: ['pro','gold','team'], groups: [{ note: 'Pro model', tiers: ['pro'] }, { note: 'Ultra model', tiers: ['gold','team'] }], img: 'triggeraimodels.jpg' },
    { key: 'analytics', label: 'Analytics',              icon: 'ph-chart-bar',         dots: ['pro','gold','team'], video: 'trigger_analytics' },
    { key: 'projects',  label: 'Projects',               icon: 'ph-folder',            dots: ['pro','gold','team'], img: 'triggerproject.jpg' },
    { key: 'fontpair',  label: 'Color and Font pair',    icon: 'ph-text-aa',           dots: ['pro','gold','team'], video: 'trigger_fontpair', mp4Only: true },
    { key: 'present',   label: 'Meet and present',       icon: 'ph-projector-screen',  dots: ['pro','gold','team'], img: 'triggercolorsmeetandpresent.jpg' },
    { key: 'meetedit',  label: 'Meet and edit',          icon: 'ph-pencil-simple',     dots: ['pro','gold','team'], img: 'triggermeetandedit.jpg' },
  ];
  const PLANS = [
    { key: 'pro',  name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  base: 20, off: 16 },
    { key: 'gold', name: 'Gold', icon: 'ph-sketch-logo',       credits: '25,000', base: 50, off: 40 },
    { key: 'team', name: 'Team', icon: 'ph-users-three',   credits: '30,000', base: 60, off: 50 },
  ];
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  const IMG_HOLD = 3500;
  const VIDEO_MAX = 25000; // safety cap only, videos advance on 'ended'
  const MEDIA = 'assets/feature-modal/';

  // logos marquee
  document.getElementById('sp-track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');

  // preview items + tabs
  const preview = document.getElementById('preview');
  const avail = preview.querySelector('.avail');
  const pills = document.getElementById('avail-pills');
  const tabs = document.getElementById('tabs');
  const items = FEATURES.map((f) => {
    const el = document.createElement('div');
    el.className = 'pv-item';
    el.innerHTML = f.video
      ? '<video muted playsinline preload="auto">' + (f.mp4Only ? '' : '<source src="' + MEDIA + f.video + '.webm" type="video/webm" />') + '<source src="' + MEDIA + f.video + '.mp4" type="video/mp4" /></video>'
      : '<img src="' + MEDIA + f.img + '" alt=""' + (f.zoom ? ' style="transform:scale(' + f.zoom + ')"' : '') + ' />';
    preview.insertBefore(el, avail);
    return el;
  });
  // tab strip rendered 3 times so it can scroll forward forever (rewinds one copy width when idle)
  const N = FEATURES.length;
  const COPIES = 3;
  for (let c = 0; c < COPIES; c++) {
    FEATURES.forEach((f, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.dataset.idx = idx;
      b.tabIndex = -1;
      b.innerHTML = '<span class="fill"></span><i class="ph ' + f.icon + '"></i><span class="lbl">' + f.label + '</span>';
      b.addEventListener('click', () => { manual = true; go(idx, b); b.blur(); });
      tabs.appendChild(b);
    });
  }
  const allTabs = Array.from(tabs.children);
  // strip moves only on its own: no wheel, trackpad, drag or arrow-key scrolling
  tabs.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  tabs.addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
  tabs.tabIndex = -1;
  const tabsFor = (idx) => allTabs.filter((t) => Number(t.dataset.idx) === idx);
  const copyWidth = () => allTabs[N].offsetLeft - allTabs[0].offsetLeft;
  let settleTimer = null;
  function scrollForwardTo(idx, el) {
    clearTimeout(settleTimer);
    const cw = tabs.clientWidth;
    const cur = tabs.scrollLeft;
    let target;
    if (el) {
      target = el.offsetLeft - (cw - el.offsetWidth) / 2;
    } else {
      const cands = tabsFor(idx).map((t) => Math.max(0, t.offsetLeft - (cw - t.offsetWidth) / 2));
      target = cands.find((x) => x >= cur - 1);
      if (target === undefined) target = cands[cands.length - 1];
    }
    tabs.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    settleTimer = setTimeout(() => {
      const w = copyWidth();
      if (tabs.scrollLeft >= w) {
        tabs.style.scrollBehavior = 'auto';
        tabs.scrollLeft = tabs.scrollLeft - w;
        tabs.style.scrollBehavior = '';
      }
    }, 700);
  }

  let i = -1;
  let timer = null;
  let manual = false;
  let fillAnims = [];
  function runFill(ms) {
    fillAnims.forEach((a) => a.cancel());
    fillAnims = tabsFor(i).map((t) => t.querySelector('.fill').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: Math.max(200, ms), easing: 'linear', fill: 'forwards' }));
  }
  function go(n, el) {
    clearTimeout(timer);
    fillAnims.forEach((a) => a.cancel()); fillAnims = [];
    if (i >= 0) {
      items[i].classList.remove('is-on');
      tabsFor(i).forEach((t) => { t.classList.remove('is-on'); t.querySelector('i').className = 'ph ' + FEATURES[i].icon; });
      const v = items[i].querySelector('video');
      if (v) { v.pause(); v.currentTime = 0; }
    }
    i = n % items.length;
    const f = FEATURES[i];
    items[i].classList.add('is-on');
    tabsFor(i).forEach((t) => { t.classList.add('is-on'); t.querySelector('i').className = 'ph-fill ' + f.icon; });
    scrollForwardTo(i, el);
    const pill = (d) => '<span class="tp tp--' + d + '">' + d.toUpperCase() + '</span>';
    pills.innerHTML = f.groups
      ? f.groups.map((g) => '<span class="tp-group">' + g.tiers.map(pill).join('') + '<span class="tp-note">' + g.note + '</span></span>').join('<span class="tp-sep"></span>')
      : f.dots.map(pill).join('');
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    if (v) {
      v.onended = next;
      // fill + safety timer arm only once the clip is really playing, so a slow
      // load never skips a clip or runs the bar ahead of the video
      const start = () => { runFill(Math.round((v.duration - v.currentTime) * 1000)); timer = setTimeout(next, VIDEO_MAX); };
      if (!v.paused && v.readyState >= 3) start(); else v.addEventListener('playing', start, { once: true });
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    } else {
      runFill(IMG_HOLD);
      timer = setTimeout(next, IMG_HOLD);
    }
  }
  go(0);

  // hover pauses the show, leave resumes it
  function pauseShow() {
    clearTimeout(timer);
    const v = items[i].querySelector('video');
    if (v) v.pause();
    fillAnims.forEach((a) => a.pause());
  }
  preview.addEventListener('mouseenter', pauseShow);
  preview.addEventListener('mouseleave', () => {
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    fillAnims.forEach((a) => a.play());
    if (v) {
      v.play().catch(() => {});
      timer = setTimeout(next, isFinite(v.duration) ? Math.min((v.duration - v.currentTime) * 1000 + 500, VIDEO_MAX) : VIDEO_MAX);
    } else {
      const left = fillAnims[0] ? Math.max(200, IMG_HOLD - (fillAnims[0].currentTime || 0)) : IMG_HOLD;
      timer = setTimeout(next, left);
    }
  });

  // plan cards
  const cards = document.getElementById('cards');
  let plan = new URLSearchParams(location.search).get('plan') || 'pro';
  if (!PLANS.some((p) => p.key === plan)) plan = 'pro';
  cards.innerHTML = PLANS.map((p) =>
    '<div class="card' + (p.key === plan ? ' is-sel' : '') + '" data-plan="' + p.key + '" role="radio" aria-checked="' + (p.key === plan) + '" tabindex="0">' +
      '<span class="radio"></span><div class="c-main">' +
      '<div class="c-row"><span class="c-name">' + p.name + ' <i class="ph ' + p.icon + '"></i></span>' +
      '<span class="c-price"><s>$' + p.base + '</s>$' + p.off + '/mo</span></div>' +
      '<span class="c-cred"><i class="ph-fill ph-star-four"></i>' + p.credits + ' Credits</span>' +
      '</div></div>'
  ).join('');
  const buyBtn = document.getElementById('btn-buy');
  // tier 1: trial + 20% off on buy. tier 2: no trial, full price until the "before you go" offer.
  const params = new URLSearchParams(location.search);
  let tier = params.get('tier') === '2' ? 2 : 1;
  let offer = false; // tier 2 only: set when the user tries to close
  const hasOff = () => tier === 1 || offer;
  // odometer: one column per digit, a 0 to 9 stack twice over so a falling price can roll through 9 on the way down
  function odo(from, to) {
    const len = Math.max(String(from).length, String(to).length);
    const A = String(from).padStart(len, '0'), B = String(to).padStart(len, '0');
    const stack = '01234567890123456789'.split('').map((d) => '<span>' + d + '</span>').join('');
    return '<span class="odo">' + A.split('').map((ch, k) => {
      const o = Number(ch), n = Number(B[k]);
      return '<span class="dg"><span class="st" data-from="' + (10 + o) + '" data-to="' + (n <= o ? 10 + n : n) + '">' + stack + '</span></span>';
    }).join('') + '</span>';
  }
  function paintPrice(c, cp, anim) {
    const el = c.querySelector('.c-price');
    if (!hasOff()) { el.innerHTML = '$' + cp.base + '/mo'; return; }
    if (!anim) { el.classList.remove('is-drop'); el.innerHTML = '<s>$' + cp.base + '</s><span class="c-num">$' + cp.off + '</span>/mo'; return; }
    el.innerHTML = '<s>$' + cp.base + '</s><span class="c-num">$' + odo(cp.base, cp.off) + '</span>/mo';
    el.classList.remove('is-drop'); void el.offsetWidth; el.classList.add('is-drop');
    const cols = Array.from(el.querySelectorAll('.st'));
    cols.forEach((st) => { st.style.transition = 'none'; st.style.transform = 'translateY(-' + st.dataset.from + 'em)'; });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      cols.forEach((st, k) => { st.style.transition = ''; st.style.transitionDelay = (k * 0.07) + 's'; st.style.transform = 'translateY(-' + st.dataset.to + 'em)'; });
    }));
  }
  function paint(anim) {
    document.body.classList.toggle('tier2', tier === 2);
    document.body.classList.toggle('offer', offer);
    document.querySelectorAll('.tier-bar button').forEach((b) => b.classList.toggle('is-on', Number(b.dataset.tier) === tier));
    const p = PLANS.find((x) => x.key === plan);
    buyBtn.textContent = 'Buy ' + p.name + (hasOff() ? ' at 20% OFF' : '');
    cards.querySelectorAll('.card').forEach((c) => {
      const cp = PLANS.find((x) => x.key === c.dataset.plan);
      paintPrice(c, cp, anim);
    });
    const ttl = document.getElementById('ttl');
    const html = offer ? '<span class="off">20% off</span>, just for you' : 'Choose your plan';
    if (ttl.innerHTML !== html) { ttl.innerHTML = html; ttl.classList.remove('is-swap'); void ttl.offsetWidth; ttl.classList.add('is-swap'); }
  }
  let timerId = null, left = 59 * 60 + 56;
  function startTimer() {
    clearInterval(timerId); left = 59 * 60 + 56;
    const el = document.getElementById('dp-timer');
    const tick = () => { el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); if (left > 0) left--; };
    tick(); timerId = setInterval(tick, 1000);
  }
  // tab labels that depend on the plan (the AI model tab reads Pro or Ultra)
  function paintLabels() {
    allTabs.forEach((t) => { const f = FEATURES[Number(t.dataset.idx)]; if (f.labelFor) t.querySelector('.lbl').textContent = f.labelFor[plan]; });
  }
  function select(key) {
    plan = key;
    paintLabels();
    cards.querySelectorAll('.card').forEach((c) => { const on = c.dataset.plan === key; c.classList.toggle('is-sel', on); c.setAttribute('aria-checked', on); });
    const p = PLANS.find((x) => x.key === key);
    document.getElementById('note-trial').textContent = 'No discount, full price $' + p.base + '/mo after the trial';
    paint();
  }
  function setTier(t) {
    tier = t; offer = false; clearInterval(timerId);
    document.getElementById('eyebrow').classList.remove('is-open');
    document.body.classList.remove('is-closed');
    const u = new URL(location.href); u.searchParams.set('tier', t); history.replaceState(null, '', u);
    paint();
  }
  document.querySelectorAll('.tier-bar button').forEach((b) => b.addEventListener('click', () => setTier(Number(b.dataset.tier))));
  document.getElementById('dp-close').addEventListener('click', () => {
    if (tier === 2 && !offer) {
      // first close on tier 2: keep the modal, drop the offer eyebrow, apply 20% to the cards
      offer = true;
      document.getElementById('eyebrow').classList.add('is-open');
      pauseShow();
      paint(true); startTimer();
      return;
    }
    document.body.classList.add('is-closed');
  });
  document.getElementById('reopen').addEventListener('click', () => setTier(tier));
  if (params.get('closed') === '1') document.body.classList.add('is-closed'); // back from a closed checkout
  cards.querySelectorAll('.card').forEach((c) => {
    c.addEventListener('click', () => select(c.dataset.plan));
    c.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(c.dataset.plan); } });
  });
  select(plan);
  // crazy8s: which eyebrow color is on. ?v=1..8, number keys switch, Replay resets tier 2 and closes again
  let variant = Number(params.get('v')) || 1;
  function setVariant(v) {
    variant = Math.min(8, Math.max(1, v));
    document.body.className = document.body.className.replace(/\bv\d\b/g, '').trim();
    document.body.classList.add('v' + variant);
    document.querySelectorAll('.var-bar button[data-v]').forEach((b) => b.classList.toggle('is-on', Number(b.dataset.v) === variant));
    const u = new URL(location.href); u.searchParams.set('v', variant); history.replaceState(null, '', u);
  }
  document.querySelectorAll('.var-bar button[data-v]').forEach((b) => b.addEventListener('click', () => setVariant(Number(b.dataset.v))));
  document.addEventListener('keydown', (e) => { if (e.key >= '1' && e.key <= '8' && !e.metaKey && !e.ctrlKey) setVariant(Number(e.key)); });
  document.getElementById('replay').addEventListener('click', () => {
    document.body.classList.add('no-anim'); setTier(2); document.body.classList.remove('is-closed');
    setTimeout(() => { document.body.classList.remove('no-anim'); document.getElementById('dp-close').click(); }, 900);
  });
  setVariant(variant);

  document.getElementById('btn-trial').addEventListener('click', () => { location.href = 'checkout-trial-sep-2026.html?plan=' + plan; });
  buyBtn.addEventListener('click', () => { location.href = 'checkout-buy-sep-2026.html?plan=' + plan + (tier === 2 ? '&off=' + (offer ? 20 : 0) : ''); });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
