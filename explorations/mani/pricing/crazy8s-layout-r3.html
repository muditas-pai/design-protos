<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>crazy8s · Pane layout · Round 3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* Figma FilrWEhw4GFBJqKUpKabCa node 1178-21215 ("free trail", modal frame 1176x620) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .backdrop { position: fixed; inset: 0; background: rgba(10,25,37,0.45); display: flex; align-items: center; justify-content: center; }

  .dp-stack { position: relative; display: flex; gap: 10px; align-items: flex-start; }

  /* entrance: scrim fades, the box rises and settles, close follows */
  @keyframes dp-bd-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dp-box-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
  .backdrop { animation: dp-bd-in .25s ease backwards; }
  .dp-box { animation: dp-box-in .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .dp-close { animation: dp-bd-in .3s .15s ease backwards; }
  .dp-close { transition: background 0.15s ease; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: 0; border-radius: 24px; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.18); color: #171717; font-size: 15px; }
  .dp-close:hover { background: #ececec; }
  .dp-box { position: relative; width: 1176px; background: #fff; border-radius: 4px; overflow: hidden; flex: none; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.3); }
  .dp-body { display: flex; min-height: 620px; }

  /* proto switch: tier 1 (trial + 20% off) vs tier 2 (no trial, full price) */
  .tier-bar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 6px 18px -6px rgba(10,25,37,0.35); }
  .tier-bar button { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 150px; padding: 6px 16px; border: 0; border-radius: 999px; background: transparent; font-family: inherit; color: #525252; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tier-bar button b { font-size: 12.5px; font-weight: 600; }
  .tier-bar button small { font-size: 10.5px; font-weight: 400; color: #8a8a8a; }
  .tier-bar button:hover:not(.is-on) { background: #f0f2f5; }
  .tier-bar button.is-on { background: #171717; color: #fff; }
  .tier-bar button.is-on small { color: rgba(255,255,255,0.65); }

  /* "before you go" eyebrow: slides in above the modal body when tier 2 is closed */
  .eyebrow { position: absolute; left: 20px; width: 1136px; top: -38px; height: 50px; z-index: 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px 12px; border-radius: 8px 8px 0 0; background: #e8f0fe; color: #1c2b3a; font-size: 12.5px; white-space: nowrap; transform: translateY(38px); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s ease; }
  .eyebrow.is-open { transform: none; opacity: 1; }
  .dp-box { z-index: 1; }
  .card.is-flash { animation: c-flash .9s ease; }
  @keyframes c-flash { 30% { box-shadow: 0 0 0 4px rgba(0,94,255,0.25); } }

  body.tier2 #btn-trial, body.tier2 #note-trial, body.tier2 .or { display: none; }
  body.tier2 .ctas { margin-top: 24px; }

  .closed-note { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #fff; font-size: 14px; }
  .closed-note button { padding: 9px 18px; border: 0; border-radius: 4px; background: #fff; color: #171717; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  body.is-closed .dp-stack { display: none; }
  body.is-closed .closed-note { display: flex; }

  /* left */
  .pane-l { width: 806px; flex: none; padding: 22px 0 0 24px; display: flex; flex-direction: column; }
  .ttl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 30px; }
  .ttl { font-size: 18px; font-weight: 500; line-height: 1.3; }
  .pv-ttl-row { min-height: 30px; margin-bottom: 12px; display: flex; align-items: center; }
  .pv-ttl { display: block; }
  .pv-ttl.is-swap { animation: dp-rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .ttl-sub { display: none; margin: -10px 0 18px; font-size: 13px; line-height: 1.4; color: #404040; }
  body.offer .ttl-sub { display: block; animation: dp-rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .ttl .off, .ttl-sub .off { display: none; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#005EFF 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 600; }
  .dp-pill { position: relative; display: none; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; line-height: 1.3; background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#005EFF 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%); color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .dp-pill::before { content: ''; position: absolute; left: -3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; background: #00225C; border-radius: 1px; transform: rotate(45deg); z-index: -1; }
  .dp-pill .sep { opacity: 0.5; font-weight: 400; }
  .dp-pill .t { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; opacity: 0.95; font-variant-numeric: tabular-nums; }
  .dp-pill .t i { font-size: 13px; }
  body.offer .ttl .off, body.offer .ttl-sub .off { display: inline; }
  body.offer .dp-pill { display: inline-flex; animation: pill-in 0.5s 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.25) both, pill-bob 1.6s 0.7s ease-in-out infinite, pill-ripple 2.2s 0.7s ease-in-out infinite; }
  @keyframes pill-bob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
  @keyframes pill-in { from { opacity: 0; transform: translateX(-10px) scale(0.9); } to { opacity: 1; transform: none; } }
  @keyframes pill-ripple {
    0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0.55); }
    70%      { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 10px rgba(0,85,237,0); }
    100%     { box-shadow: 0 4px 14px rgba(0,0,0,0.14), 0 0 0 0 rgba(0,85,237,0); }
  }

  .preview { position: relative; width: 762px; height: 430px; border-radius: 8px; overflow: hidden; background: #0b1fbb; flex: none; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 8px 24px -12px rgba(10,25,37,0.35); }
  .preview::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; }
  .preview .pv-item { position: absolute; inset: 0; opacity: 0; transform: scale(1.02); transition: opacity .55s ease, transform .9s ease; }
  .preview .pv-item.is-on { opacity: 1; transform: scale(1); }
  .preview img, .preview video { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center; }
  .avail > span:first-child { display: inline-flex; align-items: center; gap: 5px; }
  .avail > span:first-child i { font-size: 13px; color: #737373; }
  .avail { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-radius: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(10,25,37,0.15); font-size: 12.5px; color: #404040; }
  #avail-pills { display: inline-flex; align-items: center; gap: 8px; }
  .tp-group { display: inline-flex; align-items: center; gap: 6px; }
  .tp-note { font-size: 11.5px; color: #737373; margin-left: 2px; white-space: nowrap; }
  .tp-sep { width: 1px; height: 14px; background: rgba(10,25,37,0.15); margin: 0 2px; }
  .avail .tp { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .avail .tp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .avail .tp--pro  { color: #005EFF; }
  .avail .tp--gold { color: #c9932a; }
  .avail .tp--team { color: #171717; }
  .avail .tp--free { color: #16a34a; }

  .tabs-wrap { position: relative; margin: 0 0 14px -24px; width: 806px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 40px), transparent 100%); }
  .tabs { display: flex; gap: 22px; padding: 0 24px; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; scroll-behavior: smooth; touch-action: none; }
  .tabs::-webkit-scrollbar { display: none; }
  /* v2 (Mudita's comments): text tabs above the media, bottom border doubles as the progress bar */
  .tab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 2px; border: 0; border-bottom: 2px solid #ebedf0; border-radius: 0; background: transparent; font-family: inherit; font-size: 13.5px; font-weight: 500; color: #525252; cursor: pointer; white-space: nowrap; transition: color .2s ease, border-color .2s ease; }
  .tab i { font-size: 16px; color: #737373; transition: color .2s ease; }
  .tab:hover { color: #171717; border-bottom-color: #d4d4d4; }
  .tab:focus, .tab:focus-visible { outline: none; }
  .tab.is-on { color: #005EFF; border-bottom-color: #cfe0ff; }
  .tab.is-on i { color: #005EFF; }
  .tab .fill { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: #005EFF; transform: scaleX(0); transform-origin: left center; pointer-events: none; }
  .tab > i, .tab > span { position: relative; z-index: 1; }
  /* v2: features the selected plan does not include go quiet and say which plan has them */
  .tab.is-off { color: #a3a3a3; }
  .tab.is-off i { color: #c4c4c4; }
  .tab.is-off.is-on { color: #737373; border-bottom-color: #e5e5e5; }
  .tab.is-off.is-on i { color: #737373; }
  .tab.is-off .fill { background: #a3a3a3; }
  .tab .only { display: none; align-items: center; gap: 4px; margin-left: 2px; padding: 2px 7px; border-radius: 999px; background: #f0f0f0; color: #737373; font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; }
  .tab .only i { font-size: 11px; color: inherit; }
  .tab.is-off .only { display: inline-flex; }
  .tab.is-off:hover, .tab.is-off:hover i { color: #525252; }
  /* v2: the pill strip on the media only appears when a feature is not on every paid plan */
  .avail { display: none; }
  .avail.is-on { display: inline-flex; animation: dp-rise .35s cubic-bezier(.2,.8,.2,1) both; }

  .foot-l { margin: auto 0 0 -24px; width: 806px; height: 66px; border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 22px; padding: 0 24px; overflow: hidden; }
  .foot-l .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #404040; white-space: nowrap; flex: none; }
  .foot-l .loved img { height: 16px; width: auto; }
  .sp-wrap { flex: 1; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 34px; width: auto; max-width: 120px; object-fit: contain; }

  /* right */
  .pane-r { width: 370px; flex: none; background: #f5f9ff; border-left: 1px solid rgba(10,25,37,0.06); padding: 22px 20px 0; display: flex; flex-direction: column; }
  .card { position: relative; display: flex; align-items: flex-start; gap: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px 18px 14px; cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  .card + .card { margin-top: 12px; }
  @keyframes dp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card, .ctas, .foot-r { animation: dp-rise .4s cubic-bezier(.2,.8,.2,1) backwards; }
  .card:nth-child(1) { animation-delay: .12s; } .card:nth-child(2) { animation-delay: .18s; } .card:nth-child(3) { animation-delay: .24s; } .ctas { animation-delay: .3s; } .foot-r { animation-delay: .36s; }
  .card:active { transform: scale(0.99); }
  .card.is-sel { border-color: #005eff; box-shadow: inset 0 0 0 0.5px #005eff, 0 0 0 3px rgba(0,94,255,0.08); background: #eaf2ff; }
  .card.is-sel .c-cred { background: #d6e5ff; }
  .card:hover:not(.is-sel) { border-color: #c9cdd2; transform: translateY(-1px); box-shadow: 0 4px 12px -6px rgba(10,25,37,0.2); }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #d4d4d4; background: #fff; margin-top: 3px; flex: none; transition: border .15s ease; }
  .card:hover:not(.is-sel) .radio { border-color: #a3a3a3; }
  .is-sel .radio { border: 5px solid #005eff; }
  .c-main { flex: 1; min-width: 0; }
  .c-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .c-name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .c-name i { font-size: 16px; }
  .c-price { font-size: 16px; font-weight: 500; white-space: nowrap; }
  .c-price s { color: #a3a3a3; font-weight: 400; margin-right: 5px; }
  .c-price small { display: block; font-size: 11px; font-weight: 400; color: #737373; text-align: right; margin-top: 2px; }
  .c-cred { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: #e8f0fe; color: #005EFF; font-size: 12px; font-weight: 500; }
  .c-cred i { font-size: 11px; }

  .ctas { margin-top: 20px; }
  .note { margin-top: 7px; text-align: center; font-size: 11.5px; line-height: 1.45; color: #737373; white-space: nowrap; }
  .note b { font-weight: 500; color: #404040; }
  .note .blue { font-weight: 500; color: #005eff; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; border-radius: 4px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .15s ease; }
  .btn:active { transform: translateY(0); }
  .btn--trial { background: #fff; border: 1.5px solid #005EFF; color: #005EFF; }
  .btn--trial:hover { background: #eaf2ff; color: #0052e0; border-color: #0052e0; }
  .or { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: #a3a3a3; font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: rgba(10,25,37,0.1); }
  .btn--buy { background: #005eff; border: 0; color: #fff; }
  .btn--buy:hover { background: #0052e0; box-shadow: 0 2px 8px rgba(0,94,255,0.3); transform: translateY(-1px); }

  .foot-r { margin-top: auto; height: 66px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12px; font-weight: 500; color: #525252; white-space: nowrap; }
  .foot-r span { display: inline-flex; align-items: center; gap: 6px; }
  .foot-r img { height: 18px; width: auto; }

  /* crazy8s: variant bar, sits under the tier bar */
  .var-bar { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 6px 18px -6px rgba(10,25,37,0.35); }
  .var-bar button { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 70px; padding: 5px 10px; border: 0; border-radius: 999px; background: transparent; font-family: inherit; color: #525252; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .var-bar button b { font-size: 12px; font-weight: 600; }
  .var-bar button small { font-size: 10px; color: #8a8a8a; }
  .var-bar button:hover:not(.is-on) { background: #f0f2f5; }
  .var-bar button.is-on { background: #005EFF; color: #fff; }
  .var-bar button.is-on small { color: rgba(255,255,255,0.75); }

  /* shared left side pieces */
  .l-head { margin-bottom: 12px; }
  .pv-ttl-row { gap: 10px; margin-bottom: 0; }
  .l-body { display: flex; gap: 18px; align-items: flex-start; }
  .pv-col { flex: 1 1 0; min-width: 0; }
  .nav { cursor: pointer; }
  .nav .only { display: none; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; background: #f0f0f0; color: #737373; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .nav .only i { font-size: 11px; }
  .nav.is-off .only { display: inline-flex; }


  /* responsive: fluid widths, panes stack under 900px, page scrolls when the box is taller than the window */
  .backdrop { overflow-y: auto; padding: 16px; align-items: flex-start; }
  .dp-stack { margin: auto; max-width: 100%; }
  .dp-box { width: min(1176px, calc(100vw - 70px)); }
  .eyebrow { width: auto; right: 58px; overflow: hidden; text-overflow: ellipsis; } /* 20px inset + gap + close button */
  .pane-l { width: auto; flex: 1 1 0; min-width: 0; padding-right: 20px; }
  .preview { width: 100%; height: auto; aspect-ratio: 762 / 430; }
  .tabs-wrap, .foot-l { width: calc(100% + 44px); }
  @media (max-width: 900px) {
    .dp-body { flex-direction: column; height: auto; }
    .pane-r { width: 100%; padding: 20px 20px 0; border-left: 0; border-top: 1px solid rgba(10,25,37,0.06); }
    .foot-r { height: 56px; }
    .tier-bar button { min-width: 120px; padding: 5px 12px; }
  }
  @media (max-width: 520px) {
    .dp-box { width: calc(100vw - 32px); }
    .dp-stack { flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
    .ttl-row { flex-wrap: wrap; }
    .eyebrow { right: 20px; white-space: normal; height: auto; padding-top: 8px; text-align: center; }
    .note { white-space: normal; }
  }

  /* crazy8s r3: eight pane layouts. Media, text and nav move around the pane. */
  .tabs-wrap, .avail, .avail.is-on { display: none; }
  .l-grid { flex: 1 1 auto; min-height: 0; display: grid; gap: 14px 18px; align-content: start; grid-template-areas: "head" "media"; }
  .l-head { grid-area: head; margin: 0; }
  .l-media { grid-area: media; min-width: 0; }
  .l-side { grid-area: side; min-width: 0; display: none; }
  .l-top { grid-area: top; display: none; }
  .l-bottom { grid-area: bottom; display: none; }
  .l-side > *, .l-top > *, .l-bottom > * { display: none; }
  .ov-desc { font-size: 13px; line-height: 1.5; color: #525252; max-width: 560px; }
  .ov-desc.is-swap { animation: dp-rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .l-desc { display: none; margin-top: 4px; }
  .m-desc { display: none; margin-top: 12px; }
  .ov-lock { display: none; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: #f0f0f0; color: #737373; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .ov-lock i { font-size: 12px; }
  .ov-lock.is-on { display: inline-flex; }
  .ov-count { font-size: 12px; font-weight: 600; color: #737373; font-variant-numeric: tabular-nums; }
  .ov-ttl { font-size: 18px; font-weight: 500; line-height: 1.3; }
  .ov-ttl.is-swap { animation: dp-rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .ov-plans { display: flex; gap: 4px; }
  .pp { padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; background: #f0f0f0; color: #a3a3a3; }
  .pp.is-in { background: #e8f0fe; color: #005EFF; }
  .pp.is-cur { box-shadow: 0 0 0 1.5px #005EFF; }
  .tp-ctl { display: flex; gap: 6px; }

      b.dataset.idx = idx;
      b.tabIndex = -1;
      // v2: no "Available on" pill on the media. Tabs that are not on every paid plan say so inline.
      b.innerHTML = '<span class="fill"></span><i class="ph ic ' + f.icon + '"></i><span class="lbl">' + f.label + '</span><span class="only"><i class="ph ph-lock-simple"></i><span></span></span>';
      b.addEventListener('click', () => { manual = true; go(idx, b); b.blur(); });
      tabs.appendChild(b);
    });
  }
  const allTabs = Array.from(tabs.children);
  // every overlay nav row shares the nav contract with the tabs: .nav[data-idx] with a .fill
  const navRow = (idx, inner, attrs) => '<button type="button" class="nav" data-idx="' + idx + '"' + (attrs || '') + '>' + inner + '</button>';
  const onlyTag = '<span class="only"><i class="ph ph-lock-simple"></i><span></span></span>';
  function bindNav(b) { b.addEventListener('click', () => { manual = true; go(Number(b.dataset.idx)); b.blur(); }); }
  const ICON = (f) => '<i class="ph ic ' + f.icon + '"></i>';
  const FILL = '<span class="fill"></span>';
  const LBL = (f) => '<span class="lbl">' + f.label + '</span>';
  document.querySelectorAll('.nav-row').forEach((row) => {
    const kind = row.dataset.nav;
    row.innerHTML = FEATURES.map((f, idx) => {
      if (kind === 'list' || kind === 'cards') return navRow(idx, FILL + ICON(f) + LBL(f) + onlyTag);
      if (kind === 'steps') return navRow(idx, FILL + '<span class="num">' + (idx + 1) + '</span>' + LBL(f));
      if (kind === 'thumbs') return navRow(idx, '<span class="th">' + (f.video ? '<video muted playsinline preload="auto" src="' + MEDIA + f.video + '.mp4"></video>' : '<img src="' + MEDIA + f.img + '" alt="" />') + FILL + '</span>' + LBL(f), ' title="' + f.label + '"');
      if (kind === 'check') return navRow(idx, FILL + '<span class="ck"><i class="ph-bold ph-check chk"></i><i class="ph-bold ph-lock-simple lk"></i></span>' + LBL(f) + onlyTag);
      if (kind === 'edit') return navRow(idx, FILL + LBL(f) + onlyTag);
      return navRow(idx, FILL);
    }).join('');
    row.querySelectorAll('.nav').forEach(bindNav);
  });
  document.querySelectorAll('.nav-prev').forEach((b) => b.addEventListener('click', () => { manual = true; go((i - 1 + FEATURES.length) % FEATURES.length); }));
  document.querySelectorAll('.nav-next').forEach((b) => b.addEventListener('click', () => { manual = true; go(i + 1); }));
  const navsFor = (idx) => Array.from(document.querySelectorAll('.nav[data-idx="' + idx + '"]'));
  // strip moves only on its own: no wheel, trackpad, drag or arrow-key scrolling
  tabs.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  tabs.addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
  tabs.tabIndex = -1;
  const tabsFor = (idx) => allTabs.filter((t) => Number(t.dataset.idx) === idx);
  const copyWidth = () => allTabs[N].offsetLeft - allTabs[0].offsetLeft;
  let settleTimer = null;
  function scrollForwardTo(idx, el) {
    clearTimeout(settleTimer);
    const cw = tabs.clientWidth;
    const cur = tabs.scrollLeft;
    let target;
    if (el) {
      target = el.offsetLeft - (cw - el.offsetWidth) / 2;
    } else {
      const cands = tabsFor(idx).map((t) => Math.max(0, t.offsetLeft - (cw - t.offsetWidth) / 2));
      target = cands.find((x) => x >= cur - 1);
      if (target === undefined) target = cands[cands.length - 1];
    }
    tabs.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    settleTimer = setTimeout(() => {
      const w = copyWidth();
      if (tabs.scrollLeft >= w) {
        tabs.style.scrollBehavior = 'auto';
        tabs.scrollLeft = tabs.scrollLeft - w;
        tabs.style.scrollBehavior = '';
      }
    }, 700);
  }

  let i = -1;
  let timer = null;
  let manual = false;
  let fillAnims = [];
  function runFill(ms) {
    fillAnims.forEach((a) => a.cancel());
    fillAnims = navsFor(i).filter((t) => t.querySelector('.fill')).map((t) => t.querySelector('.fill').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: Math.max(200, ms), easing: 'linear', fill: 'forwards' }));
  }
  function go(n, el) {
    clearTimeout(timer);
    fillAnims.forEach((a) => a.cancel()); fillAnims = [];
    if (i >= 0) {
      items[i].classList.remove('is-on');
      navsFor(i).forEach((t) => { t.classList.remove('is-on'); const ic = t.querySelector('i.ic'); if (ic) ic.className = 'ph ic ' + FEATURES[i].icon; });
      const v = items[i].querySelector('video');
      if (v) { v.pause(); v.currentTime = 0; }
    }
    i = n % items.length;
    const f = FEATURES[i];
    items[i].classList.add('is-on');
    navsFor(i).forEach((t) => { t.classList.add('is-on'); const ic = t.querySelector('i.ic'); if (ic) ic.className = 'ph-fill ic ' + f.icon; });
    document.querySelectorAll('.l-grid .nav').forEach((t) => t.classList.toggle('is-done', Number(t.dataset.idx) < i));
    scrollForwardTo(i, el);
    paintAvail();
    paintTitle();
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    if (v) {
      v.onended = next;
      // fill + safety timer arm only once the clip is really playing, so a slow
      // load never skips a clip or runs the bar ahead of the video
      const start = () => { runFill(Math.round((v.duration - v.currentTime) * 1000)); timer = setTimeout(next, VIDEO_MAX); };
      if (!v.paused && v.readyState >= 3) start(); else v.addEventListener('playing', start, { once: true });
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    } else {
      runFill(IMG_HOLD);
      timer = setTimeout(next, IMG_HOLD);
    }
  }
  // v2: what the selected plan includes. Features outside it go quiet with an "Only on X" tag,
  // and the media strip repeats it while one of those is on screen.
  const PLAN_NAME = { pro: 'Pro', gold: 'Gold', team: 'Team' };
  function paintTabs() {
    FEATURES.forEach((f, idx) => {
      const has = f.dots.includes(plan);
      const only = f.onlyFor && f.onlyFor[plan] ? f.onlyFor[plan] : (has ? '' : 'Only on ' + PLAN_NAME[f.dots[0]]);
      navsFor(idx).forEach((t) => {
        t.classList.toggle('is-off', !!only);
        const l = t.querySelector('.lbl'); if (l) l.textContent = f.labelFor ? f.labelFor[plan] : f.label;
        if (t.hasAttribute('title')) t.title = f.labelFor ? f.labelFor[plan] : f.label;
        const o = t.querySelector('.only > span'); if (o) o.textContent = only;
      });
    });
    paintAvail();
    paintTitle();
  }
  function paintTitle() {
    if (i < 0) return;
    const f = FEATURES[i];
    const h = document.getElementById('pv-ttl');
    const label = f.labelFor ? f.labelFor[plan] : f.label;
    h.textContent = label;
    h.classList.remove('is-swap'); void h.offsetWidth; h.classList.add('is-swap');
    const only = f.onlyFor && f.onlyFor[plan] ? f.onlyFor[plan] : (f.dots.includes(plan) ? '' : 'Only on ' + PLAN_NAME[f.dots[0]]);
    document.querySelectorAll('.ov-ttl').forEach((t) => { t.textContent = label; t.classList.remove('is-swap'); void t.offsetWidth; t.classList.add('is-swap'); });
    document.querySelectorAll('.ov-desc').forEach((p) => { p.textContent = f.desc; p.classList.remove('is-swap'); void p.offsetWidth; p.classList.add('is-swap'); });
    document.querySelectorAll('.ov-count').forEach((c) => { c.textContent = (i + 1) + ' / ' + FEATURES.length; });
    document.querySelectorAll('.ov-lock').forEach((l) => { l.classList.toggle('is-on', !!only); l.querySelector('span').textContent = only; });
    document.querySelectorAll('.ov-plans').forEach((el) => { el.innerHTML = ['pro', 'gold', 'team'].map((d) => '<span class="pp' + (f.dots.includes(d) ? ' is-in' : '') + (d === plan ? ' is-cur' : '') + '">' + d.toUpperCase() + '</span>').join(''); });
    document.querySelectorAll('.ov-plan').forEach((el) => { el.textContent = PLAN_NAME[plan]; });
    const inc = FEATURES.filter((x) => x.dots.includes(plan)).length;
    document.querySelectorAll('.ov-inc').forEach((el) => { el.textContent = inc + ' of ' + FEATURES.length; });
    // panel layout: the three features that play next
    const up = document.querySelector('.upnext-l');
    up.innerHTML = [1, 2, 3].map((k) => {
      const idx = (i + k) % FEATURES.length; const g = FEATURES[idx];
      const off = !g.dots.includes(plan) || (g.onlyFor && g.onlyFor[plan]);
      return '<button type="button" class="nav' + (off ? ' is-off' : '') + '" data-idx="' + idx + '"><i class="ph ' + g.icon + '"></i><span class="lbl">' + (g.labelFor ? g.labelFor[plan] : g.label) + '</span>' + (off ? '<i class="ph ph-lock-simple"></i>' : '') + '</button>';
    }).join('');
    up.querySelectorAll('.nav').forEach(bindNav);
  }
  function paintAvail() {
    if (i < 0) return;
    const f = FEATURES[i];
    const has = f.dots.includes(plan);
    const pill = (d) => '<span class="tp tp--' + d + '">' + d.toUpperCase() + '</span>';
    avail.classList.toggle('is-on', !has);
    document.getElementById('avail-plan').textContent = PLAN_NAME[plan];
    if (!has) pills.innerHTML = f.dots.map(pill).join('');
  }
  go(0);

  // hover pauses the show, leave resumes it
  preview.addEventListener('mouseenter', () => {
    clearTimeout(timer);
    const v = items[i].querySelector('video');
    if (v) v.pause();
    fillAnims.forEach((a) => a.pause());
  });
  preview.addEventListener('mouseleave', () => {
    const v = items[i].querySelector('video');
    const next = () => { manual = false; go(i + 1); };
    fillAnims.forEach((a) => a.play());
    if (v) {
      v.play().catch(() => {});
      timer = setTimeout(next, isFinite(v.duration) ? Math.min((v.duration - v.currentTime) * 1000 + 500, VIDEO_MAX) : VIDEO_MAX);
    } else {
      const left = fillAnims[0] ? Math.max(200, IMG_HOLD - (fillAnims[0].currentTime || 0)) : IMG_HOLD;
      timer = setTimeout(next, left);
    }
  });

  // plan cards
  const cards = document.getElementById('cards');
  cards.innerHTML = PLANS.map((p) =>
    '<div class="card' + (p.key === plan ? ' is-sel' : '') + '" data-plan="' + p.key + '" role="radio" aria-checked="' + (p.key === plan) + '" tabindex="0">' +
      '<span class="radio"></span><div class="c-main">' +
      '<div class="c-row"><span class="c-name">' + p.name + ' <i class="ph ' + p.icon + '"></i></span>' +
      '<span class="c-price"><s>$' + p.base + '</s>$' + p.off + '/mo</span></div>' +
      '<span class="c-cred"><i class="ph-fill ph-star-four"></i>' + p.credits + ' Credits</span>' +
      '</div></div>'
  ).join('');
  const buyBtn = document.getElementById('btn-buy');
  // tier 1: trial + 20% off on buy. tier 2: no trial, full price until the "before you go" offer.
  const params = new URLSearchParams(location.search);
  let tier = params.get('tier') === '2' ? 2 : 1;
  let offer = false; // tier 2 only: set when the user tries to close
  const hasOff = () => tier === 1 || offer;
  function paint() {
    document.body.classList.toggle('tier2', tier === 2);
    document.body.classList.toggle('offer', offer);
    document.querySelectorAll('.tier-bar button').forEach((b) => b.classList.toggle('is-on', Number(b.dataset.tier) === tier));
    const p = PLANS.find((x) => x.key === plan);
    buyBtn.textContent = 'Buy ' + p.name + (hasOff() ? ' at 20% OFF' : '');
    cards.querySelectorAll('.card').forEach((c) => {
      const cp = PLANS.find((x) => x.key === c.dataset.plan);
      c.querySelector('.c-price').innerHTML = hasOff() ? '<s>$' + cp.base + '</s>$' + cp.off + '/mo' : '$' + cp.base + '/mo';
    });
    paintTabs();
  }
  let timerId = null, left = 59 * 60 + 56;
  function startTimer() {
    clearInterval(timerId); left = 59 * 60 + 56;
    const el = document.getElementById('dp-timer');
    const tick = () => { el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); if (left > 0) left--; };
    tick(); timerId = setInterval(tick, 1000);
  }
  function select(key) {
    plan = key;
    cards.querySelectorAll('.card').forEach((c) => { const on = c.dataset.plan === key; c.classList.toggle('is-sel', on); c.setAttribute('aria-checked', on); });
    const p = PLANS.find((x) => x.key === key);
    document.getElementById('note-trial').textContent = 'No discount, full price $' + p.base + '/mo after the trial';
    paint();
  }
  function setTier(t) {
    tier = t; offer = false; clearInterval(timerId);
    document.getElementById('eyebrow').classList.remove('is-open');
    document.body.classList.remove('is-closed');
    const u = new URL(location.href); u.searchParams.set('tier', t); history.replaceState(null, '', u);
    paint();
  }
  document.querySelectorAll('.tier-bar button').forEach((b) => b.addEventListener('click', () => setTier(Number(b.dataset.tier))));
  document.getElementById('dp-close').addEventListener('click', () => {
    if (tier === 2 && !offer) {
      // first close on tier 2: keep the modal, drop the offer eyebrow, apply 20% to the cards
      offer = true;
      document.getElementById('eyebrow').classList.add('is-open');
      paint(); startTimer();
      cards.querySelectorAll('.card').forEach((c) => { c.classList.remove('is-flash'); void c.offsetWidth; c.classList.add('is-flash'); });
      return;
    }
    document.body.classList.add('is-closed');
  });
  document.getElementById('reopen').addEventListener('click', () => setTier(tier));
  // crazy8s: which pane layout is on. ?v=1..8, number keys switch
  let variant = Number(params.get('v')) || 1;
  function setVariant(v) {
    variant = Math.min(8, Math.max(1, v));
    document.body.className = document.body.className.replace(/\bv\d\b/g, '').trim();
    document.body.classList.add('v' + variant);
    document.querySelectorAll('.var-bar button').forEach((b) => b.classList.toggle('is-on', Number(b.dataset.v) === variant));
    const u = new URL(location.href); u.searchParams.set('v', variant); history.replaceState(null, '', u);
  }
  document.querySelectorAll('.var-bar button').forEach((b) => b.addEventListener('click', () => setVariant(Number(b.dataset.v))));
  document.addEventListener('keydown', (e) => { if (e.key >= '1' && e.key <= '8' && !e.metaKey && !e.ctrlKey) setVariant(Number(e.key)); });
  setVariant(variant);
  if (params.get('closed') === '1') document.body.classList.add('is-closed'); // back from a closed checkout
  cards.querySelectorAll('.card').forEach((c) => {
    c.addEventListener('click', () => select(c.dataset.plan));
    c.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(c.dataset.plan); } });
  });
  select(plan);

  document.getElementById('btn-trial').addEventListener('click', () => { location.href = 'checkout-trial-sep-2026.html?plan=' + plan; });
  buyBtn.addEventListener('click', () => { location.href = 'checkout-buy-sep-2026.html?plan=' + plan + (tier === 2 ? '&off=' + (offer ? 20 : 0) : ''); });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
