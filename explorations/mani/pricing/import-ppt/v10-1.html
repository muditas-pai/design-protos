<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Import PowerPoint, big deck</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* Import from PPT: the create flow reads the file, then stops a free user at the slide limit with radio rows and one CTA (v3) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; color: #171717; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .stage { position: relative; max-width: 900px; margin: 0 auto; min-height: 100vh; padding: 56px 32px 40px; display: flex; flex-direction: column; }
  .close { position: fixed; top: 18px; right: 20px; width: 34px; height: 34px; border-radius: 999px; border: 0; background: #fff; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.12); cursor: pointer; font-size: 16px; color: #171717; display: grid; place-items: center; }
  .close:hover { background: #f5f5f5; }

  /* user bubble: the uploaded file */
  .bubble { align-self: flex-end; background: #f3f4f6; border-radius: 14px; padding: 8px; }
  .file { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 10px; padding: 10px 14px 10px 10px; min-width: 280px; }
  .file-ic { position: relative; width: 34px; height: 40px; border-radius: 6px; background: #f5f5f5; border: 1px solid #e5e5e5; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #737373; }
  .file-ic .ok { position: absolute; top: -8px; left: -8px; width: 16px; height: 16px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .file-name { font-size: 13px; color: #171717; }

  /* assistant steps */
  .steps { margin-top: 44px; display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #171717; opacity: 0; transform: translateY(6px); transition: opacity .3s ease, transform .3s ease; }
  .step.is-in { opacity: 1; transform: none; }
  .step .dot { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; color: #fff; background: #16a34a; }
  .step .dot.spin { background: transparent; border: 2px solid #d4d4d4; border-top-color: #171717; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the limit card */
  .limit { --px: 22px; --pt: 20px; margin-top: auto; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 20px 22px 18px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); opacity: 0; transform: translateY(16px); transition: opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
  .limit.is-in { opacity: 1; transform: none; }
  .limit-t { font-size: 16px; font-weight: 500; line-height: 1.45; letter-spacing: -0.01em; }
  .limit-t b { font-weight: 600; }
  .limit-s { font-size: 13px; color: #737373; margin: 3px 0 16px; }

  .cr { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: #e8f0fe; color: #0055ED; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .cr i { font-size: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 20px; border-radius: 4px; border: 0; background: #005EFF; color: #fff; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; transition: background .15s ease, transform .12s ease; }
  .btn:hover { background: #0055ED; }
  .btn:active { transform: scale(0.98); }
  /* continue free: secondary button under the buy CTA */
  .btn.sec { background: #fff; border: 1px solid #d4d4d4; color: #171717; }
  .btn.sec:hover { background: #f5f5f5; }
  .btn.free { margin-top: 8px; }
  .btn.free .m { color: #8a8a8a; font-weight: 400; }

  /* radio rows: pick one plan, the open row lists its v6 points, one CTA buys it */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { position: relative; border: 1px solid #e5e5e5; border-radius: 6px; background: #fff; cursor: pointer; transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease; }
  .row:focus-visible { outline: 2px solid #005eff; outline-offset: 2px; }
  .row:hover:not(.is-sel) { border-color: #c9cdd2; }
  .row.is-sel { border-color: #005eff; background: #eaf2ff; box-shadow: inset 0 0 0 .5px #005eff; }
  .hd { display: flex; align-items: center; gap: 12px; padding: 15px 16px; }
  .hd .push { margin-left: auto; }
  .radio { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid #c9cdd2; background: #fff; flex: none; transition: border .15s ease; }
  .row.is-sel .radio { border: 5px solid #005eff; }
  .nm { display: inline-flex; align-items: center; gap: 5px; font-size: 16px; font-weight: 500; }
  .nm i { font-size: 16px; }
  .lim { font-size: 13px; color: #737373; white-space: nowrap; }
  .pr { font-size: 12.5px; color: #525252; white-space: nowrap; }
  .pr s { margin-right: 5px; font-size: 13px; color: #a3a3a3; }
  .pr b { font-size: 16px; font-weight: 500; color: #171717; }
  /* open and close share one duration and curve, so as one row opens and the other closes the heights trade
     in lockstep and the card grows or shrinks by the difference only, no bounce. The card sits at the bottom, so it grows upward by that difference */
  .bd { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.32,.72,0,1); }
  .bd > div { overflow: hidden; min-height: 0; opacity: 0; transition: opacity .18s ease; }
  .row.is-sel > .bd { grid-template-rows: 1fr; }
  .row.is-sel > .bd > div { opacity: 1; transition: opacity .32s ease .12s; }
  .pts { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin: 0 16px 0 44px; padding: 14px 0 16px; border-top: 1px solid rgba(0,94,255,0.14); }
  .pts li { display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 1.4; color: #404040; }
  .pts li i { font-size: 16px; flex: none; }
  .pts li.f-lead { grid-column: 1 / -1; font-weight: 500; color: #171717; margin-bottom: 2px; }
  /* points drift in after the row has started opening; transform and opacity only, nothing that moves layout */
  .row.is-sel .pts li, .row.is-sel .line { animation: feat-in .4s cubic-bezier(.22,1,.36,1) .12s backwards; }
  .row.is-sel .pts li:nth-child(2) { animation-delay: .16s; }
  .row.is-sel .pts li:nth-child(3) { animation-delay: .20s; }
  .row.is-sel .pts li:nth-child(4) { animation-delay: .24s; }
  .row.is-sel .pts li:nth-child(5) { animation-delay: .28s; }
  .row.is-sel .pts li:nth-child(6) { animation-delay: .32s; }
  .row.is-sel .pts li:nth-child(7) { animation-delay: .36s; }
  @keyframes feat-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .radio { transition: border-width .2s cubic-bezier(.32,.72,0,1), border-color .2s ease; }
  .tile { transition: background-color .25s ease, color .25s ease; }
  @media (prefers-reduced-motion: reduce) {
    .bd, .bd > div, .row.is-sel > .bd > div { transition: none; }
    .row.is-sel .pts li, .row.is-sel .line { animation: none; }
  }

  /* v4 green ticks: one column of ticks, a slightly smaller card */
  .s-ticks .pts { grid-template-columns: 1fr; padding: 12px 0 14px; gap: 8px; }
  .s-ticks .pts li i { color: #16a34a; }
  .s-ticks .limit { padding: 16px 18px 14px; }
  .s-ticks .limit-s { margin-bottom: 12px; }
  .s-ticks .rows { gap: 6px; }
  .s-ticks .btn { height: 38px; margin-top: 14px; }
  .s-ticks .btn.free { margin-top: 6px; }

  /* v5 icon tile: bigger plan icon, points read as one dotted line under the plan name */
  .tile { width: 36px; height: 36px; border-radius: 8px; background: #f0f2f5; display: grid; place-items: center; font-size: 18px; color: #404040; flex: none; }
  .row.is-sel .tile { background: #005eff; color: #fff; }
  .s-tile .hd { gap: 12px; padding: 14px; }
  .meta { display: flex; flex-direction: column; gap: 3px; }
  .meta .lim { font-size: 12.5px; }
  .line { padding: 0 16px 14px 96px; font-size: 13px; color: #404040; line-height: 1.7; }
  .line .lead { font-weight: 500; color: #171717; }
  .line span + span::before { content: '·'; margin: 0 8px; color: #a3a3a3; }

  /* v6.1: no radio, no selected state; each row buys itself. Pro leads solid, the others are outlined */
  .s-buyrow .row { cursor: default; }
  .s-buyrow .row:hover { border-color: #c9cdd2; }
  .s-buyrow .hd .pr { margin-left: auto; margin-right: 16px; }
  .row-buy { width: 120px; height: 36px; margin: 0; padding: 0; font-size: 13px; flex: none; }
  .row-buy:not(.is-lead) { background: #fff; border: 1px solid #0A1925; color: #0A1925; }
  .row-buy:not(.is-lead):hover { background: #f4f6f8; }
  .s-buyrow .btn.free { margin-top: 18px; }

  /* positive meter from the crazy 8s: quiet slate for Free, brand blue for what a plan adds */
  .limit-t .win { color: #0055ED; }
  /* no subtitle and no card around the meter: the bar reads as part of the title line, with the split labels under it */
  .limit-t { margin-bottom: 16px; }
  .meter { margin-bottom: 0; }
  .legend { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 12.5px; color: #525252; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { font-weight: 600; color: #171717; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .d-slate { background: #c5cfdc; } .d-blue { background: #005eff; }
  .legend .pb b, .under .pb b { color: #0055ED; }
  /* one solid bar: the two shares butt together, squared off inside a 2px corner */
  .bar { position: relative; display: flex; height: 8px; border-radius: 2px; overflow: hidden; }
  .bar.thick { height: 8px; }
  .bar span { border-radius: 0; }
  /* one continuous sweep left to right: the bar is revealed by a moving clip edge, so the pill ends keep
     their shape (scaleX used to squash them) and Free hands over to the plan colour without a second start.
     The insets sit outside the bar so the plan glow is never clipped. */
  .bar { clip-path: inset(-12px -12px -12px -12px); animation: sweep 1.05s cubic-bezier(.33,1,.68,1) .18s backwards; }
  @keyframes sweep {
    from { clip-path: inset(-12px 100% -12px -12px); }
    to   { clip-path: inset(-12px -12px -12px -12px); }
  }
  .c-free { background: linear-gradient(90deg, #d5dde8, #c5cfdc); }
  .c-plan { background: linear-gradient(96deg, #00225C 0%, #003C9E 24%, #0055ED 50%, #1C6BF3 78%, #5990FC 100%); box-shadow: 0 2px 8px -2px rgba(0,85,237,.45); }
  .split { position: relative; }
  .split::after { content: ''; position: absolute; top: -3px; bottom: -3px; left: var(--at); width: 2px; margin-left: -1px; border-radius: 2px; background: #0A1925; transform-origin: center; animation: tick .32s cubic-bezier(.22,1,.36,1) .46s backwards; }
  @keyframes tick { from { opacity: 0; transform: scaleY(.4); } }
  .under span { animation: lbl .45s cubic-bezier(.22,1,.36,1) backwards; }
  .under span:first-child { animation-delay: .26s; }
  .under span.pb { animation-delay: .5s; }
  @keyframes lbl { from { opacity: 0; transform: translateY(6px); } }
  /* the counts run while the bar fills, so the numbers must not jitter on width */
  .under b { font-variant-numeric: tabular-nums; }
  .scale { position: relative; height: 14px; margin-top: 7px; font-size: 11px; color: #a3a3a3; font-variant-numeric: tabular-nums; }
  .scale span { position: absolute; top: 0; }
  .scale .r { right: 0; }
  .scale .m { transform: translateX(-50%); color: #525252; font-weight: 500; white-space: nowrap; }
  .under { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: #525252; }
  .under span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .under b { font-weight: 600; color: #171717; font-size: 13px; }
  .under .num { font-style: normal; }
  .under .pb { align-items: flex-end; text-align: right; }
  @media (prefers-reduced-motion: reduce) { .bar, .split::after, .under span { animation: none; } }

  /* row features: an info icon next to the plan line, its points on hover */
  .fx { display: inline-flex; align-items: center; gap: 5px; color: #8a8a8a; font-size: 12.5px; cursor: default; }
  .fx i { font-size: 14px; }
  .fx:hover { color: #525252; }
  /* title and meter sit on a tint that bleeds to the card edges, so the line under them runs end to end */
  .top { margin: calc(var(--pt) * -1) calc(var(--px) * -1) 18px; padding: var(--pt) var(--px) 18px; background: #fafbfc; border-bottom: 1px solid #ececec; border-radius: 13px 13px 0 0; }  /* 13, not 14: it sits inside the card's 1px border */
  /* plan line reads: name, dot, credits in brand blue; features sit under it behind the info icon */
  /* plan name and its credit pill share the first line of the row, as in v3 */
  .ln { display: flex; align-items: center; gap: 8px; }
  .lim .dv { margin: 0 8px; color: #c9cdd2; }
  /* the bubble still lives on the row, so it cannot be clipped, but it is placed under the info icon and points at it */
  .tip { position: absolute; left: 12px; bottom: calc(100% + 10px); z-index: 5; width: max-content; max-width: 320px; padding: 10px 12px; border-radius: 8px; background: #0A1925; color: #fff; box-shadow: 0 12px 28px -10px rgba(10,25,37,.5); opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity .16s ease, transform .16s ease, visibility .16s; pointer-events: none; }
  .tip .lead { display: block; margin-bottom: 8px; font-size: 12px; color: rgba(255,255,255,0.6); }
  .tip span.f { display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 1.9; }
  .tip span.f i { font-size: 16px; color: rgba(255,255,255,0.75); }
  .tip::after { content: ''; position: absolute; top: 100%; left: var(--arrow, 16px); margin-left: -6px; border: 6px solid transparent; border-top-color: #0A1925; }
  /* the icon sits inside the plan line, the bubble hangs off the row, so match up the tree */
  .hd:has(.fx:hover) .tip, .hd:has(.fx:focus-visible) .tip { opacity: 1; visibility: visible; transform: none; }


  /* checkout opens over this screen in a frame, no page change */
  .co { position: fixed; inset: 0; z-index: 50; display: none; }
  .co.is-open { display: block; }
  .co iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  /* proto switch: v1 table, v2 columns, v3 to v5 radio rows */
  .ver-bar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.10); }
  .ver-bar a { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 120px; padding: 6px 16px; border-radius: 999px; color: #525252; text-decoration: none; }
  .ver-bar a b { font-size: 12.5px; font-weight: 600; }
  .ver-bar a small { font-size: 10.5px; color: #8a8a8a; }
  .ver-bar a:hover:not(.is-on) { background: #f0f2f5; }
  .ver-bar a.is-on { background: #171717; color: #fff; }
  .ver-bar a.is-on small { color: rgba(255,255,255,0.65); }
  .stage { padding-top: 88px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) {
    .stage { padding: 80px 16px 32px; }
    .ver-bar a { min-width: 0; padding: 5px 12px; }
    .ver-bar a small { display: none; }
    .limit { padding: 16px 14px 14px; --px: 14px; --pt: 16px; }
    .hd { flex-wrap: wrap; row-gap: 6px; padding: 12px; }
    .hd .lim { display: none; }
    .meta .lim { display: block; }
    .pts { grid-template-columns: 1fr; margin: 0 12px; }
    .line { padding: 0 12px 12px; }
  }

</style>
</head>
<body>
<nav class="ver-bar" aria-label="Version">
  <a href="v2.html"><b>v2</b><small>Three columns</small></a>
  <a href="v3.html"><b>v3</b><small>Radio rows</small></a>
  <a href="v6-1.html"><b>v6.1</b><small>Buy in row</small></a>
  <a href="v10.html"><b>v10</b><small>Labels under</small></a>
  <a href="v10-1.html" class="is-on" aria-current="page"><b>v10.1</b><small>Big deck</small></a>
  <a href="v11.html"><b>v11</b><small>Close nudge</small></a>
</nav>
<button type="button" class="close" id="close" aria-label="Close"><i class="ph ph-x"></i></button>
<div class="stage">
  <div class="bubble">
    <div class="file">
      <span class="file-ic">.pptx<span class="ok"><i class="ph ph-check"></i></span></span>
      <span class="file-name" id="file-name">q3 board deck.pptx</span>
    </div>
  </div>

  <div class="steps">
    <div class="step is-in"><span class="dot"><i class="ph ph-check"></i></span>Uploaded your content</div>
    <div class="step is-in"><span class="dot"><i class="ph ph-check"></i></span>Read your slides</div>
  </div>

  <div class="limit" id="limit">
    <div class="top">
      <div class="limit-t" id="limit-t"></div>
      <div id="meter"></div>
    </div>
    <div id="body"></div>
    <button type="button" class="btn sec free" id="btn-free">Continue with Free Plan<span class="m">Use only first 12 slides</span></button>
  </div>
</div>

<script>requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('limit').classList.add('is-in')));</script>
<div class="co" id="co"><iframe id="co-frame" title="Checkout"></iframe></div>

<script>
  const STYLE = 'buyrow';
  // Standalone copy of the 7 day trial import screen, labels under (v10): positive meter from the crazy 8s, Buy in each row. ?file= ?slides= ?plan=pro|gold
  const q = new URLSearchParams(location.search);
  // keep ?file= ?slides= ?plan= when switching versions
  document.querySelectorAll('.ver-bar a').forEach((a) => { a.href = a.getAttribute('href') + location.search; });
  if (q.get('file')) document.getElementById('file-name').textContent = q.get('file');
  const N = Math.max(13, Number(q.get('slides')) || 65);
  document.querySelectorAll('.n-slides').forEach((el) => { el.textContent = N; });

  // same plan numbers as the v6 picker
  const PLANS = [
    { key: 'pro',  name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  base: 20, slides: 60,
      feats: [['ph-sparkle', 'Advanced AI models'], ['ph-paint-brush-broad', 'Brand Kit'], ['ph-strategy', 'Research and planning'], ['ph-chart-bar', 'Analytics']] },
    { key: 'gold', name: 'Gold', icon: 'ph-sketch-logo',   credits: '25,000', base: 50, slides: 99, lead: 'Everything in Pro, plus',
      feats: [['ph-sparkle', 'Frontier AI models'], ['ph-paint-brush-broad', 'Advanced brand controls'], ['ph-book-open', 'Shared project knowledge'], ['ph-gauge', 'Priority AI generation']] },
    { key: 'team', name: 'Team', icon: 'ph-users-three',  credits: '20,000', base: 60, slides: 150, lead: 'Everything in Gold, plus',
      feats: [['ph-users-three', 'Unlimited collaborators'], ['ph-paint-brush-broad', 'Shared Brand Kit'], ['ph-book-open', 'Shared project knowledge'], ['ph-sparkle', 'Frontier AI models and agents'], ['ph-chart-bar', 'Team analytics'], ['ph-headset', 'Priority support']] },
  ];

  // a 65 slide deck is over Pro's 60, so only the plans that can take the whole deck are offered
  const FITS = PLANS.filter((c) => c.slides >= N);
  const names = FITS.map((c) => c.name).join(' or ');
  document.getElementById('limit-t').innerHTML = 'Import <span class="win">all <span class="n-slides">' + N + '</span> slides</span> with ' + names + '.';

  const body = document.getElementById('body');
  let sel = FITS.some((p) => p.key === q.get('plan')) ? q.get('plan') : FITS[0].key;
  document.body.classList.add('s-' + STYLE);
  // v6 wears the v5 icon tile rows, just without the points
  if (STYLE === 'simple' || STYLE === 'buyrow') document.body.classList.add('s-tile');
  const nm = (c) => '<span class="nm">' + c.name + '<i class="ph ' + c.icon + '"></i></span>';
  const cr = (c) => '<span class="cr"><i class="ph-fill ph-star-four"></i>' + c.credits + ' Credits</span>';
  const pr = (c) => '<span class="pr push"><b>$' + c.base + '</b>/mo</span>';
  const pts = (c, tick) => '<ul class="pts">' + (c.lead ? '<li class="f-lead">' + c.lead + '</li>' : '') +
    c.feats.map((f) => '<li><i class="' + (tick ? 'ph-fill ph-check-circle' : 'ph ' + f[0]) + '"></i>' + f[1] + '</li>').join('') + '</ul>';
  // v3 baseline, v4 green ticks, v5 icon tile: same rows, different head and open body
  const HEAD = {
    base:  (c) => '<span class="radio"></span>' + nm(c) + cr(c) + '<span class="lim">Up to ' + c.slides + ' slides per import</span>' + pr(c),
    simple: (c) => HEAD.tile(c),
    ticks: (c) => '<span class="radio"></span>' + nm(c) + cr(c) + pr(c),
    tile:  (c) => '<span class="radio"></span><span class="tile"><i class="ph ' + c.icon + '"></i></span><span class="meta"><span class="nm">' + c.name + '</span><span class="lim">' + c.credits + ' Credits, up to ' + c.slides + ' slides</span></span>' + pr(c),
  };
  const BODY = {
    base:  (c) => pts(c),
    simple: () => '',
    ticks: (c) => pts(c, true),
    tile:  (c) => '<div class="line">' + (c.lead ? '<span class="lead">' + c.lead + '</span>' : '') + c.feats.map((f) => '<span>' + f[1] + '</span>').join('') + '</div>',
  };
  // the row stays one line; its plan points live in a bubble on the info icon
  const fx = (c) => 'Up to ' + c.slides + ' slides<span class="dv">\u00b7</span><span class="fx" tabindex="0">+' + c.feats.length + ' more features<i class="ph ph-info"></i></span>';
  const tip = (c) => '<span class="tip" role="tooltip">' + (c.lead ? '<span class="lead">' + c.lead + '</span>' : '') +
    c.feats.map((f) => '<span class="f"><i class="ph ' + f[0] + '"></i>' + f[1] + '</span>').join('') + '</span>';
  const lead = sel;
  // meter: Free share against what a plan adds; split line sits in the middle of the 8px gap, 3px clear on each side
  const FREE = 12, MORE = N - FREE, R = FREE / N;
  const AT = (R * 100).toFixed(2) + '%';
  const bar = (cls) => '<div class="bar ' + cls + '"><span class="c-free" style="flex:' + FREE + '"></span><span class="c-plan" style="flex:' + MORE + '"></span></div>';
  document.getElementById('meter').innerHTML = '<div class="meter">' +
    '<div class="split" style="--at:' + AT + '">' + bar('thick') + '</div>' +
    '<div class="under"><span><b><i class="num" data-to="' + FREE + '">0</i> slides</b>on Free</span><span class="pb"><b>+<i class="num" data-to="' + MORE + '">0</i> slides</b>with ' + names + '</span></div>' + '</div>';
  body.innerHTML = '<div class="rows">' + FITS.map((c) =>
    '<div class="row" data-plan="' + c.key + '"><div class="hd">' +
    '<span class="tile"><i class="ph ' + c.icon + '"></i></span><span class="meta"><span class="ln"><span class="nm">' + c.name + '</span><span class="cr"><i class="ph-fill ph-star-four"></i>' + c.credits + ' Credits</span></span><span class="lim">' + fx(c) + '</span></span>' + tip(c) + pr(c) +
    '<button type="button" class="btn row-buy' + (c.key === lead ? ' is-lead' : '') + '" data-buy="' + c.key + '">Buy ' + c.name + '</button>' +
    '</div></div>').join('') + '</div>';

  // the sweep is 1.05s of ease-out after a .18s wait; the split is crossed once the eased progress passes R
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const CROSS = 180 + 1050 * (1 - Math.pow(1 - R, 1 / 3));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const countUp = (el, at, dur) => {
    const to = Number(el.dataset.to);
    if (still) { el.textContent = to; return; }
    const t0 = performance.now() + at;
    const tick = (now) => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(easeOut(t) * to);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const nums = document.querySelectorAll('.under .num');
  countUp(nums[0], 180, CROSS - 180);
  countUp(nums[1], CROSS, 1230 - CROSS);

  // full price, no discount; checkout opens with off=0. Free and close replay the flow in this standalone page.
  const co = document.getElementById('co'), coFrame = document.getElementById('co-frame');
  const openCheckout = (key) => { coFrame.src = '../checkout-buy-sep-2026.html?plan=' + key + '&off=0'; co.classList.add('is-open'); };
  addEventListener('message', (e) => {
    if (e.data && e.data.type === 'checkout-close') { co.classList.remove('is-open'); coFrame.src = 'about:blank'; }
  });
  // the bubble sits on the row (never clipped) but lines its arrow up with the info icon it belongs to
  body.querySelectorAll('.fx').forEach((el) => {
    const row = el.closest('.row'), tip = row.querySelector('.tip'), ic = el.querySelector('i');
    const place = () => {
      const a = ic.getBoundingClientRect(), r = row.getBoundingClientRect();
      const mid = a.left + a.width / 2 - r.left;
      const left = Math.max(12, Math.min(mid - 28, r.width - tip.offsetWidth - 12));
      tip.style.left = left + 'px';
      // sit just above the icon itself, not above the whole row
      tip.style.bottom = (r.bottom - a.top + 8) + 'px';
      tip.style.setProperty('--arrow', (mid - left) + 'px');
    };
    el.addEventListener('mouseenter', place);
    el.addEventListener('focus', place);
  });
  body.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', () => openCheckout(b.dataset.buy)));
  document.getElementById('btn-free').addEventListener('click', () => location.reload());
  document.getElementById('close').addEventListener('click', () => location.reload());
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
