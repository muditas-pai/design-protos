<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positive Gate Crazy 8s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  /* round 2, gone wild: 8 bold takes on the import gate, told as a gain. Pro and Gold only, full price, no red, outline icons only */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #e9ecf0; color: #171717; -webkit-font-smoothing: antialiased; padding: 32px 28px 60px; }
  h1 { font-size: 20px; font-weight: 600; }
  .intro { font-size: 13px; color: #525252; margin: 4px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1500px; }
  .cell { background: #f7f8fa; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 0 0 1px rgba(10,25,37,0.06); }
  .lbl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .lbl b { font-size: 13px; font-weight: 600; }
  .lbl span { font-size: 12px; color: #737373; }
  .lbl .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #171717; color: #fff; font-size: 11px; font-weight: 600; flex: none; }

  .card { position: relative; overflow: hidden; background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 16px; padding: 22px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); }
  .cta { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 44px; margin-top: 16px; border: 0; border-radius: 10px; background: #0055ED; color: #fff; font: 600 14.5px 'Inter', sans-serif; cursor: pointer; transition: transform .12s ease, background-color .2s ease; }
  .cta:hover { background: #004bd1; }
  .cta:active { transform: scale(.98); }
  .cta i { transition: transform .2s ease; }
  .cta:hover i { transform: translateX(3px); }
  .sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 8px; border: 1px solid #d4d4d4; border-radius: 4px; background: #fff; color: #171717; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .sec:hover { background: #f5f5f5; }
  .sec .m { color: #8a8a8a; font-weight: 400; }
  [data-k] { cursor: pointer; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }

  /* ============ 1 deck fan: the deck fans open, plans are two tickets ============ */
  .w1 .fan { position: relative; height: 150px; margin: -4px -22px 14px; background: radial-gradient(120% 90% at 50% 100%, #e8f0ff 0%, #fff 70%); }
  .w1 .fan i { position: absolute; left: 50%; bottom: 18px; width: 120px; height: 72px; margin-left: -60px; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,0.08), 0 10px 22px -10px rgba(10,25,37,0.35); transform-origin: 50% 220%; animation: fan .9s cubic-bezier(.22,1,.36,1) backwards; }
  .w1 .fan i::before { content: ''; position: absolute; left: 12px; right: 40px; top: 14px; height: 7px; border-radius: 4px; background: #d6e5ff; }
  .w1 .fan i::after { content: ''; position: absolute; left: 12px; right: 20px; top: 28px; height: 30px; border-radius: 4px; background: linear-gradient(135deg, #eef4ff, #dbe8ff); }
  .w1 .fan i.dark { background: #0b1f3f; }
  .w1 .fan i.dark::before { background: #3a5b92; }
  .w1 .fan i.dark::after { background: linear-gradient(135deg, #22406f, #0b1f3f); }
  @keyframes fan { from { transform: rotate(0deg); opacity: 0; } }
  .w1 .count { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 6px 14px -6px rgba(22,163,74,.7); white-space: nowrap; }
  .w1 h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  .w1 .sub { text-align: center; font-size: 13px; color: #737373; margin: 4px 0 16px; }
  .w1 .tix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .w1 .tk { position: relative; padding: 14px 16px 12px; border-radius: 12px; border: 1.5px dashed #d4d4d4; background: #fff; transition: border-color .2s, background-color .2s, transform .2s; }
  .w1 .tk.is-sel { border-style: solid; border-color: #0055ED; background: #f5f9ff; transform: translateY(-2px); }
  .w1 .tk::before, .w1 .tk::after { content: ''; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 999px; background: #f7f8fa; box-shadow: inset 0 0 0 1.5px #d4d4d4; }
  .w1 .tk::before { left: -8px; }
  .w1 .tk::after { right: -8px; }
  .w1 .tk.is-sel::before, .w1 .tk.is-sel::after { box-shadow: inset 0 0 0 1.5px #0055ED; }
  .w1 .tk b { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .w1 .tk small { display: block; font-size: 12px; color: #737373; margin-top: 3px; }
  .w1 .tk .p { margin-top: 10px; font-size: 20px; font-weight: 700; }
  .w1 .tk .p span { font-size: 12px; font-weight: 500; color: #737373; }

  /* ============ 2 midnight: dark premium card, glowing edge ============ */
  .w2.card { background: radial-gradient(120% 80% at 0% 0%, #13306a 0%, #0A1925 55%); border: 0; color: #fff; }
  .w2.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, #5990FC, transparent 40%, transparent 60%, #FFB27A); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .w2 .glow { position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; border-radius: 999px; background: radial-gradient(circle, rgba(89,144,252,.45), transparent 65%); filter: blur(8px); animation: drift 6s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes drift { to { transform: translate(-30px, 20px); } }
  .w2 .eyebrow { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #9ec0ff; }
  .w2 h3 { position: relative; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 6px; }
  .w2 h3 span { background: linear-gradient(90deg, #9ec0ff, #fff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .w2 .sub { position: relative; font-size: 13px; color: rgba(255,255,255,.65); margin-bottom: 18px; }
  .w2 .opts { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .w2 .op { padding: 14px; border-radius: 12px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: background-color .2s, box-shadow .2s; }
  .w2 .op.is-sel { background: rgba(89,144,252,.18); box-shadow: inset 0 0 0 1.5px #5990FC, 0 10px 30px -12px rgba(89,144,252,.8); }
  .w2 .op b { display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
  .w2 .op b em { font-style: normal; font-size: 18px; }
  .w2 .op b em small { font-size: 11px; color: rgba(255,255,255,.6); font-weight: 500; }
  .w2 .op span { display: block; font-size: 12px; color: rgba(255,255,255,.6); margin-top: 4px; }
  .w2 .cta { background: #fff; color: #0A1925; }
  .w2 .cta:hover { background: #eef3ff; }
  .w2 .sec { background: transparent; border-color: rgba(255,255,255,.2); color: #fff; }
  .w2 .sec:hover { background: rgba(255,255,255,.06); }
  .w2 .sec .m { color: rgba(255,255,255,.5); }

  /* ============ 3 odometer: the count rolls from 15 up to the whole deck ============ */
  .w3 .odo { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 20px 0 18px; margin: -22px -22px 16px; background: linear-gradient(180deg, #f5f9ff, #fff); }
  .w3 .digits { display: flex; gap: 4px; }
  .w3 .dg { width: 54px; height: 76px; border-radius: 10px; background: #0A1925; color: #fff; overflow: hidden; box-shadow: inset 0 -20px 30px -20px rgba(0,0,0,.6), 0 10px 20px -10px rgba(10,25,37,.6); }
  .w3 .dg ul { list-style: none; transition: transform 1.4s cubic-bezier(.22,1,.36,1); }
  .w3 .dg li { height: 76px; display: grid; place-items: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .w3 .odo-l { font-size: 13px; color: #525252; line-height: 1.5; }
  .w3 .odo-l b { display: block; font-size: 15px; color: #171717; }
  .w3 .odo-l .up { color: #16a34a; font-weight: 600; }
  .w3 .pl { display: flex; gap: 8px; }
  .w3 .pl div { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5e5e5; font-size: 14px; font-weight: 600; transition: border-color .2s, background-color .2s; }
  .w3 .pl div.is-sel { border-color: #0055ED; background: #f5f9ff; box-shadow: inset 0 0 0 .5px #0055ED; }
  .w3 .pl div span { font-weight: 500; color: #525252; font-size: 13px; }

  /* ============ 4 before and after: drag the line, Free on the left, the whole deck on the right ============ */
  .w4 h3 { font-size: 17px; font-weight: 700; }
  .w4 .sub { font-size: 13px; color: #737373; margin: 3px 0 14px; }
  .w4 .ba { position: relative; height: 128px; border-radius: 12px; overflow: hidden; user-select: none; touch-action: none; cursor: ew-resize; }
  .w4 .ba .side { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; gap: 5px; padding: 12px 12px 34px; }
  .w4 .ba .after { background: linear-gradient(135deg, #eaf2ff, #f6f9ff); }
  .w4 .ba .after i { border-radius: 4px; background: linear-gradient(135deg, #5990FC, #0055ED); }
  .w4 .ba .before { background: #f4f4f5; clip-path: inset(0 var(--r, 50%) 0 0); }
  .w4 .ba .before i { border-radius: 4px; background: #d4d4d8; }
  .w4 .ba .before i.later { background: transparent; box-shadow: inset 0 0 0 1px #e4e4e7; }
  .w4 .ba .tag { position: absolute; bottom: 8px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .w4 .ba .before .tag { left: 10px; background: #fff; color: #525252; }
  .w4 .ba .after .tag { right: 10px; background: #0055ED; color: #fff; }
  .w4 .ba .handle { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(10,25,37,.15); }
  .w4 .ba .knob { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 999px; background: #fff; box-shadow: 0 4px 12px rgba(10,25,37,.25); display: grid; place-items: center; font-size: 15px; color: #0A1925; }
  .w4 .seg { display: flex; gap: 8px; margin-top: 14px; }
  .w4 .seg div { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #e5e5e5; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; transition: border-color .2s, background-color .2s; }
  .w4 .seg div.is-sel { border-color: #0055ED; background: #f5f9ff; box-shadow: inset 0 0 0 .5px #0055ED; }
  .w4 .seg span { color: #525252; font-weight: 500; font-size: 13px; }

  /* ============ 5 boarding pass: the import as a trip to the full deck, plans as cabin class ============ */
  .w5.card { padding: 0; }
  .w5 .pass { display: grid; grid-template-columns: 1fr 120px; }
  .w5 .main { padding: 20px 22px 18px; }
  .w5 .stub { position: relative; padding: 20px 16px; background: #0A1925; color: #fff; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
  .w5 .stub::before { content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; border-left: 2px dashed #fff; }
  .w5 .route { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
  .w5 .route div small { display: block; font-size: 10.5px; letter-spacing: .08em; color: #8a8a8a; font-weight: 600; }
  .w5 .route div b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .w5 .route .line { flex: 1; position: relative; height: 2px; background: repeating-linear-gradient(90deg, #c9cdd2 0 6px, transparent 6px 12px); }
  .w5 .route .line i { position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); color: #0055ED; font-size: 20px; animation: fly 2.4s cubic-bezier(.45,0,.2,1) infinite; }
  @keyframes fly { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
  .w5 .cls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .w5 .cls div { padding: 10px 12px; border-radius: 10px; border: 1px solid #e5e5e5; transition: border-color .2s, background-color .2s; }
  .w5 .cls div.is-sel { border-color: #0055ED; background: #f5f9ff; box-shadow: inset 0 0 0 .5px #0055ED; }
  .w5 .cls small { display: block; font-size: 10.5px; letter-spacing: .06em; color: #8a8a8a; font-weight: 600; }
  .w5 .cls b { font-size: 15px; }
  .w5 .cls span { float: right; font-size: 13px; font-weight: 600; }
  .w5 .stub small { font-size: 10px; letter-spacing: .08em; color: rgba(255,255,255,.55); font-weight: 600; }
  .w5 .stub b { display: block; font-size: 22px; font-weight: 800; }
  .w5 .stub .bars { height: 34px; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 4px, #fff 4px 5px, transparent 5px 8px); opacity: .85; border-radius: 2px; }
  .w5 .acts { padding: 0 22px 18px; }
  .w5 .cta { margin-top: 0; }

  /* ============ 6 assistant: the product speaks, plans are quick replies ============ */
  .w6 .chat { display: flex; gap: 10px; align-items: flex-start; }
  .w6 .av { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-size: 17px; background: conic-gradient(from 200deg, #0055ED, #5990FC, #FFB27A, #0055ED); }
  .w6 .bub { padding: 12px 14px; border-radius: 4px 14px 14px 14px; background: #f4f6f8; font-size: 14px; line-height: 1.55; animation: pop .45s cubic-bezier(.22,1,.36,1) backwards; }
  .w6 .bub + .bub { margin-top: 6px; animation-delay: .5s; }
  .w6 .bub b { font-weight: 600; }
  .w6 .replies { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0 44px; }
  .w6 .rp { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #d6e5ff; background: #fff; font-size: 13.5px; font-weight: 500; animation: pop .45s cubic-bezier(.22,1,.36,1) backwards; transition: background-color .2s, border-color .2s, color .2s; }
  .w6 .rp:nth-child(1) { animation-delay: .9s; }
  .w6 .rp:nth-child(2) { animation-delay: 1s; }
  .w6 .rp.is-sel { background: #0055ED; border-color: #0055ED; color: #fff; }
  .w6 .rp em { font-style: normal; opacity: .7; }
  .w6 .ctas { margin-left: 44px; }

  /* ============ 7 orbit: the deck at the centre, what the plan adds circles it ============ */
  .w7 .sky { position: relative; height: 200px; margin: -22px -22px 16px; overflow: hidden; background: radial-gradient(90% 90% at 50% 50%, #eaf2ff 0%, #fff 70%); }
  .w7 .ring { position: absolute; left: 50%; top: 50%; border-radius: 999px; border: 1px dashed #c7d8fb; transform: translate(-50%, -50%); }
  .w7 .r1 { width: 150px; height: 150px; }
  .w7 .r2 { width: 250px; height: 180px; }
  .w7 .core { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 999px; background: linear-gradient(135deg, #0055ED, #5990FC); color: #fff; display: grid; place-items: center; text-align: center; box-shadow: 0 0 0 8px rgba(0,85,237,.1), 0 14px 30px -10px rgba(0,85,237,.7); }
  .w7 .core b { display: block; font-size: 24px; font-weight: 800; line-height: 1; }
  .w7 .core small { font-size: 10px; opacity: .85; }
  .w7 .spin { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: orbit 18s linear infinite; }
  .w7 .spin.b { animation-duration: 26s; animation-direction: reverse; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .w7 .moon { position: absolute; transform: translate(-50%, -50%); }
  .w7 .moon span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px #d6e5ff, 0 6px 14px -8px rgba(10,25,37,.35); font-size: 11.5px; font-weight: 500; white-space: nowrap; animation: orbit 18s linear infinite reverse; }
  .w7 .spin.b .moon span { animation-duration: 26s; animation-direction: normal; }
  .w7 .moon i { color: #005eff; }
  .w7 h3 { font-size: 17px; font-weight: 700; text-align: center; }
  .w7 .sub { font-size: 13px; color: #737373; text-align: center; margin: 3px 0 14px; }
  .w7 .sw { display: flex; padding: 4px; border-radius: 12px; background: #f0f2f5; }
  .w7 .sw div { flex: 1; padding: 10px 0; border-radius: 9px; text-align: center; font-size: 14px; font-weight: 600; color: #525252; transition: background-color .2s, color .2s, box-shadow .2s; }
  .w7 .sw div small { display: block; font-size: 11.5px; font-weight: 500; color: #8a8a8a; }
  .w7 .sw div.is-sel { background: #fff; color: #171717; box-shadow: 0 2px 8px rgba(10,25,37,.12); }

  /* ============ 8 approved: a green stamp lands on the deck ============ */
  .w8 .desk { position: relative; display: flex; align-items: center; gap: 22px; padding: 20px; margin-bottom: 16px; border-radius: 12px; background: repeating-linear-gradient(0deg, #fafafa 0 22px, #f4f4f5 22px 23px); }
  .w8 .doc { position: relative; width: 104px; height: 70px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px #e5e5e5, 4px 4px 0 #eef2f7, 8px 8px 0 #e3e9f2; flex: none; }
  .w8 .doc::before { content: ''; position: absolute; left: 10px; right: 30px; top: 12px; height: 7px; border-radius: 4px; background: #d6e5ff; }
  .w8 .doc::after { content: ''; position: absolute; left: 10px; right: 14px; top: 26px; height: 30px; border-radius: 4px; background: #eef4ff; }
  .w8 .stamp { position: absolute; left: 44px; top: -10px; padding: 6px 10px; border: 3px solid #16a34a; border-radius: 8px; color: #16a34a; font-size: 14px; font-weight: 800; letter-spacing: .04em; transform: rotate(-12deg); background: rgba(255,255,255,.88); animation: stamp .55s cubic-bezier(.2,1.6,.4,1) .4s backwards; white-space: nowrap; }
  @keyframes stamp { from { transform: rotate(-12deg) scale(2.6); opacity: 0; } }
  .w8 .desk p { font-size: 13px; color: #525252; line-height: 1.55; }
  .w8 .desk p b { display: block; font-size: 17px; color: #171717; font-weight: 700; }
  .w8 .rw { display: flex; flex-direction: column; gap: 8px; }
  .w8 .rw > div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5e5e5; transition: border-color .2s, background-color .2s; }
  .w8 .rw > div.is-sel { border-color: #0055ED; background: #f5f9ff; box-shadow: inset 0 0 0 .5px #0055ED; }
  .w8 .rw .rd { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid #c9cdd2; flex: none; transition: border .2s; }
  .w8 .rw .is-sel .rd { border: 5px solid #0055ED; }
  .w8 .rw .tx b { display: block; font-size: 14px; }
  .w8 .rw .tx span { font-size: 12.5px; color: #737373; }
  .w8 .rw em { margin-left: auto; font-style: normal; font-weight: 600; }

  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    body { padding: 20px 16px 40px; }
    .card { padding: 18px 16px; }
    .w5 .pass { grid-template-columns: 1fr; }
    .w5 .stub { display: none; }
    .w1 .tix, .w2 .opts, .w5 .cls { grid-template-columns: 1fr; }
    .w6 .replies, .w6 .ctas { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>Import gate, positive, round 2: gone wild</h1>
<p class="intro">24-slide deck, Free covers 15. Every card sells the whole deck as the win. Pro and Gold only, full price, outline icons. Click the plans; card 4 drags.</p>

<div class="grid" id="grid"></div>

<script>
  const N = 24, FREE = 15;
  const PLANS = {
    pro:  { name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  cap: 60, price: 20, feats: ['Advanced AI models', 'Brand Kit'] },
    gold: { name: 'Gold', icon: 'ph-sketch-logo',   credits: '15,000', cap: 99, price: 50, feats: ['Frontier AI models', 'Advanced brand controls'] },
  };
  const K = Object.keys(PLANS);
  const cta = '<button class="cta" data-cta><span>Get Pro</span><i class="ph ph-arrow-right"></i></button>';
  const free = '<button class="sec"><i class="ph ph-paper-plane-tilt"></i>Continue with Free Plan<span class="m">Use first ' + FREE + ' slides</span></button>';
  const each = (fn) => K.map((k) => fn(PLANS[k], k)).join('');

  const V = [
    { t: 'Deck fan', d: 'the deck fans open with a green "all 24 fit" badge, plans are two tickets',
      html: () => '<div class="fan">' + Array.from({ length: 7 }, (_, i) => '<i class="' + (i === 3 ? 'dark' : '') + '" style="transform:rotate(' + ((i - 3) * 11) + 'deg);animation-delay:' + (i * .05) + 's"></i>').join('') + '<span class="count">All ' + N + ' slides fit</span></div>' +
        '<h3>Bring your whole deck in.</h3><div class="sub">Pick a plan and every slide comes with you.</div>' +
        '<div class="tix">' + each((p, k) => '<div class="tk" data-k="' + k + '"><b>' + p.name + '<i class="ph ' + p.icon + '"></i></b><small>' + p.credits + ' credits, up to ' + p.cap + ' slides</small><div class="p">$' + p.price + '<span>/mo</span></div></div>') + '</div>' + cta + free },

    { t: 'Midnight', d: 'dark premium card with a glowing edge, the whole deck as the headline',
      html: () => '<div class="glow"></div><div class="eyebrow"><i class="ph ph-sparkle"></i>READY TO IMPORT</div>' +
        '<h3>All <span>' + N + ' slides</span>,<br>exactly as you made them.</h3><div class="sub">Choose the plan that brings the full deck in.</div>' +
        '<div class="opts">' + each((p, k) => '<div class="op" data-k="' + k + '"><b>' + p.name + '<em>$' + p.price + '<small>/mo</small></em></b><span>' + p.credits + ' credits, up to ' + p.cap + ' slides per import</span></div>') + '</div>' + cta + free },

    { t: 'Odometer', d: 'the slide count rolls up from 15 to the whole deck',
      html: () => '<div class="odo"><div class="digits"><div class="dg"><ul data-d0><li>1</li><li>2</li></ul></div><div class="dg"><ul data-d1>' + Array.from({ length: 10 }, (_, i) => '<li>' + ((5 + i) % 10) + '</li>').join('') + '</ul></div></div>' +
        '<div class="odo-l"><b>slides import</b>Free starts at ' + FREE + '.<br><span class="up">Pro and Gold bring in all ' + N + '.</span></div></div>' +
        '<div class="pl">' + each((p, k) => '<div data-k="' + k + '">' + p.name + '<span>$' + p.price + '/mo</span></div>') + '</div>' + cta + free },

    { t: 'Before and after', d: 'drag the line: Free on the left, the whole deck on the right',
      html: () => '<h3>See the difference.</h3><div class="sub">Drag to compare Free with Pro and Gold.</div>' +
        '<div class="ba" data-ba><div class="side after">' + '<i></i>'.repeat(N) + '<span class="tag">Pro and Gold: all ' + N + '</span></div>' +
        '<div class="side before">' + Array.from({ length: N }, (_, i) => '<i' + (i >= FREE ? ' class="later"' : '') + '></i>').join('') + '<span class="tag">Free: first ' + FREE + '</span></div>' +
        '<div class="handle"><span class="knob"><i class="ph ph-arrows-left-right"></i></span></div></div>' +
        '<div class="seg">' + each((p, k) => '<div data-k="' + k + '">' + p.name + '<span>$' + p.price + '/mo</span></div>') + '</div>' + cta + free },

    { t: 'Boarding pass', d: 'the import as a trip to the full deck, plans as cabin class',
      html: () => '<div class="pass"><div class="main"><div class="route"><div><small>FROM</small><b>.pptx</b></div><div class="line"><i class="ph ph-airplane-tilt"></i></div><div><small>TO</small><b>' + N + '/' + N + '</b></div></div>' +
        '<div class="cls">' + each((p, k) => '<div data-k="' + k + '"><small>' + (k === 'pro' ? 'CLASS' : 'FIRST CLASS') + '</small><b>' + p.name + '</b><span>$' + p.price + '/mo</span></div>') + '</div></div>' +
        '<div class="stub"><div><small>SLIDES</small><b>' + N + '</b></div><div><small>SEAT</small><b data-seat>PRO</b></div><div class="bars"></div></div></div><div class="acts">' + cta + free + '</div>' },

    { t: 'Assistant reply', d: 'the product speaks, plans are quick replies',
      html: () => '<div class="chat"><span class="av"><i class="ph ph-sparkle"></i></span><div><div class="bub">I read all <b>' + N + ' slides</b>. Nice deck.</div><div class="bub">Free brings in the first ' + FREE + '. Want the whole thing? Pick a plan and I will import every slide.</div></div></div>' +
        '<div class="replies">' + each((p, k) => '<span class="rp" data-k="' + k + '"><i class="ph ' + p.icon + '"></i>' + p.name + ' <em>$' + p.price + '/mo</em></span>') + '</div><div class="ctas">' + cta + free + '</div>' },

    { t: 'Orbit', d: 'the deck at the centre, what the plan adds circles it',
      html: () => '<div class="sky"><div class="ring r1"></div><div class="ring r2"></div><div data-orbit></div><div class="core"><div><b>' + N + '</b><small>slides</small></div></div></div>' +
        '<h3>Your full deck, plus a lot more.</h3><div class="sub">Every slide comes in. Here is what comes with it.</div>' +
        '<div class="sw">' + each((p, k) => '<div data-k="' + k + '">' + p.name + '<small>$' + p.price + '/mo, ' + p.credits + ' credits</small></div>') + '</div>' + cta + free },

    { t: 'Approved', d: 'a green stamp lands on the deck: all 24 in',
      html: () => '<div class="desk"><div class="doc"><span class="stamp">ALL ' + N + ' IN</span></div><p><b>Your deck is good to go.</b>Pro and Gold import every slide, with room to spare.</p></div>' +
        '<div class="rw">' + each((p, k) => '<div data-k="' + k + '"><span class="rd"></span><span class="tx"><b>' + p.name + '</b><span>' + p.credits + ' credits, up to ' + p.cap + ' slides</span></span><em>$' + p.price + '/mo</em></div>') + '</div>' + cta + free },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = V.map((v, i) => '<div class="cell"><div class="lbl"><span class="n">' + (i + 1) + '</span><b>' + v.t + '</b><span>· ' + v.d + '</span></div><div class="card w' + (i + 1) + '">' + v.html() + '</div></div>').join('');

  // every card: pick Pro or Gold, the button and plan-bound parts follow
  grid.querySelectorAll('.card').forEach((card) => {
    const pick = (k) => {
      const p = PLANS[k];
      card.querySelectorAll('[data-k]').forEach((el) => el.classList.toggle('is-sel', el.dataset.k === k));
      card.querySelector('[data-cta] span').textContent = 'Get ' + p.name;
      const seat = card.querySelector('[data-seat]');
      if (seat) seat.textContent = p.name.toUpperCase();
      const orb = card.querySelector('[data-orbit]');
      if (orb) {
        const at = (deg, rx, ry, txt, ic) => '<div class="moon" style="left:' + (Math.cos(deg) * rx).toFixed(1) + 'px;top:' + (Math.sin(deg) * ry).toFixed(1) + 'px"><span><i class="ph ' + ic + '"></i>' + txt + '</span></div>';
        orb.innerHTML = '<div class="spin">' + at(0, 75, 75, p.feats[0], 'ph-sparkle') + at(Math.PI, 75, 75, p.credits + ' credits', 'ph-coins') + '</div>' +
          '<div class="spin b">' + at(Math.PI / 2, 125, 90, p.feats[1], 'ph-paint-brush-broad') + at(-Math.PI / 2, 125, 90, 'Up to ' + p.cap + ' slides', 'ph-stack') + '</div>';
      }
    };
    card.querySelectorAll('[data-k]').forEach((el) => el.addEventListener('click', () => pick(el.dataset.k)));
    pick('pro');
  });

  // 3: roll the odometer from 15 up to the whole deck
  setTimeout(() => grid.querySelectorAll('.w3').forEach((c) => {
    c.querySelector('[data-d0]').style.transform = 'translateY(-76px)';
    c.querySelector('[data-d1]').style.transform = 'translateY(' + (-76 * (((N % 10) - 5 + 10) % 10)) + 'px)';
  }), 600);

  // 4: drag the divider
  grid.querySelectorAll('[data-ba]').forEach((ba) => {
    const set = (x) => { const r = ba.getBoundingClientRect(); const pct = Math.min(92, Math.max(8, (x - r.left) / r.width * 100)); ba.style.setProperty('--x', pct + '%'); ba.style.setProperty('--r', (100 - pct) + '%'); };
    let on = false;
    ba.addEventListener('pointerdown', (e) => { on = true; ba.setPointerCapture(e.pointerId); set(e.clientX); });
    ba.addEventListener('pointermove', (e) => { if (on) set(e.clientX); });
    ba.addEventListener('pointerup', () => { on = false; });
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
