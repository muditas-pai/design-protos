<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positive Gate Crazy 8s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  /* round 5: branches of round 4's #1 (blue and green bar) and #3 (slide segments). Positive, Pro and Gold, any deck size via ?slides= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #e9ecf0; color: #171717; -webkit-font-smoothing: antialiased; padding: 32px 28px 60px; }
  h1 { font-size: 20px; font-weight: 600; }
  .intro { font-size: 13px; color: #525252; margin: 4px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1500px; }
  .cell { background: #f7f8fa; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 0 0 1px rgba(10,25,37,0.06); }
  .lbl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .lbl b { font-size: 13px; font-weight: 600; }
  .lbl span { font-size: 12px; color: #737373; }
  .lbl .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #171717; color: #fff; font-size: 11px; font-weight: 600; flex: none; }
  .lbl .from { padding: 1px 7px; border-radius: 999px; background: #e8f0fe; color: #0055ED; font-size: 11px; font-weight: 500; }

  .card { background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 22px 22px 16px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); }
  .head { font-size: 16px; font-weight: 600; letter-spacing: -.005em; }
  .head .win { color: #0055ED; }
  .sub { font-size: 13px; color: #737373; margin: 4px 0 16px; }

  /* meter panel: lighter than round 4, one hairline, more air */
  .meter { padding: 14px 16px 12px; margin-bottom: 16px; border-radius: 10px; background: #fafbfc; box-shadow: inset 0 0 0 1px #eef0f3; }
  .legend { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 12.5px; color: #525252; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { font-weight: 600; color: #171717; font-variant-numeric: tabular-nums; }
  .legend .g b { color: #15803d; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .d-blue { background: #005eff; } .d-green { background: #22c55e; } .d-grey { background: #c9cdd2; }
  .scale { position: relative; height: 14px; margin-top: 7px; font-size: 11px; color: #a3a3a3; font-variant-numeric: tabular-nums; }
  .scale span { position: absolute; top: 0; }
  .scale .r { right: 0; }
  .scale .m { transform: translateX(-50%); color: #525252; font-weight: 500; white-space: nowrap; }

  /* the bar (from #1) */
  .bar { position: relative; display: flex; gap: 3px; height: 8px; }
  .bar span { border-radius: 999px; transform-origin: left; animation: grow .8s cubic-bezier(.22,1,.36,1) backwards; }
  .bar span + span { animation-delay: .35s; }
  .bar.thick { height: 12px; }
  @keyframes grow { from { transform: scaleX(0); } }
  .c-blue { background: linear-gradient(90deg, #0055ED, #5990FC); }
  .c-green { background: linear-gradient(90deg, #4ade80, #16a34a); }
  .c-soft { background: #d6e5ff; }
  .c-grey { background: #d4d4d4; }

  /* labels sitting under each part of the bar */
  .under { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; color: #525252; }
  .under span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .under b { font-weight: 600; color: #171717; font-size: 13px; }
  .under .g b { color: #15803d; }
  .under .g { align-items: flex-end; text-align: right; }

  /* pills above each part */
  .over { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .over span { display: flex; }
  .over em { font-style: normal; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .over .b em { background: #eaf2ff; color: #0055ED; }
  .over .g { justify-content: flex-end; }
  .over .g em { background: #f0fdf4; color: #15803d; box-shadow: inset 0 0 0 1px #dcfce7; }

  /* the segments (from #3) */
  .segs { display: grid; gap: 3px; }
  .segs i { height: 14px; border-radius: 3px; background: #d4d4d4; animation: seg .45s cubic-bezier(.22,1,.36,1) backwards; }
  .segs.tall i { height: 22px; border-radius: 4px; }
  .segs i.p { background: #005eff; }
  .segs i.pg { background: #22c55e; }
  @keyframes seg { from { transform: scaleY(.2); opacity: 0; } }
  /* 7: the extra segments light up one by one after the free ones */
  .segs.light i.p { animation: none; background: #d4d4d4; transition: background-color .25s ease; }
  .segs.light.on i.p { background: #005eff; }
  /* split tick between the free share and the rest */
  .split { position: relative; }
  .split::after { content: ''; position: absolute; top: -5px; bottom: -5px; left: var(--at); width: 2px; margin-left: -2.5px; border-radius: 2px; background: #0A1925; }

  /* plans, v8 style */
  .plans { display: flex; flex-direction: column; gap: 8px; }
  .plan { display: flex; align-items: center; gap: 12px; border: 1px solid #e5e5e5; background: #fff; border-radius: 10px; padding: 12px 14px; transition: border-color .2s ease; }
  .plan:hover { border-color: #c9cdd2; }
  .plan .ic { width: 30px; height: 30px; border-radius: 8px; background: #f0f2f5; color: #404040; display: grid; place-items: center; font-size: 15px; flex: none; transition: background-color .2s, color .2s; }
  .plan .body { flex: 1; min-width: 0; }
  .plan .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .gtag { font-size: 11px; font-weight: 500; color: #16a34a; background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .plan .meta { font-size: 12.5px; color: #525252; margin-top: 2px; }
  .plan .price { text-align: right; white-space: nowrap; }
  /* buy in the row, same as v6.1: one size, Pro leads solid, Gold outlined */
  .buy { width: 120px; height: 36px; flex: none; border: 0; border-radius: 4px; background: #005EFF; color: #fff; font: 500 13px 'Inter', sans-serif; cursor: pointer; }
  .buy:hover { background: #0055ED; }
  .buy.out { background: #fff; border: 1px solid #0A1925; color: #0A1925; }
  .buy.out:hover { background: #f4f6f8; }
  .plans + .sec { margin-top: 14px; }
  .plan .now { font-size: 16px; font-weight: 500; }
  .plan .per { font-size: 12.5px; color: #737373; }
  .plan .bill { font-size: 11.5px; color: #737373; display: block; margin-top: 1px; }
  .cta { display: block; width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; background: #0055ED; color: #fff; font: 600 14.5px 'Inter', sans-serif; cursor: pointer; transition: background-color .2s ease; }
  .cta:hover { background: #004bd1; }
  .sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 8px; border: 1px solid #d4d4d4; border-radius: 4px; background: #fff; color: #171717; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .sec:hover { background: #f5f5f5; }
  .sec .m { color: #8a8a8a; font-weight: 400; }

  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    body { padding: 20px 16px 40px; }
    .card { padding: 18px 14px 14px; }
    .plan .bill, .gtag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>Import gate, positive, round 5: bar and segments</h1>
<p class="intro">Built from round 4's #1 (blue and green bar) and #3 (slide segments). Add <code>?slides=200</code> to see a big deck.</p>

<div class="grid" id="grid"></div>

<script>
  const N = Math.max(13, Number(new URLSearchParams(location.search).get('slides')) || 24), FREE = 12, MORE = N - FREE;
  const PLANS = {
    pro:  { name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  cap: 60, price: 20 },
    gold: { name: 'Gold', icon: 'ph-sketch-logo',   credits: '15,000', cap: 99, price: 50 },
  };
  const K = Object.keys(PLANS);
  const AT = (FREE / N * 100).toFixed(2) + '%';
  const head = '<div class="head">Import <span class="win">all ' + N + ' slides</span> with Pro or Gold.</div><div class="sub">Free imports the first ' + FREE + '. Pro and Gold import every slide.</div>';
  const plans = '<div class="plans">' + K.map((k) => { const p = PLANS[k];
    return '<div class="plan"><span class="ic"><i class="ph ' + p.icon + '"></i></span><div class="body">' +
      '<div class="name">' + p.name + ' <span class="gtag">Imports all ' + N + ' slides</span></div>' +
      '<div class="meta">' + p.credits + ' credits, up to ' + p.cap + ' slides per import</div></div>' +
      '<div class="price"><span class="now">$' + p.price + '</span><span class="per">/mo</span></div>' +
      '<button class="buy' + (k === 'pro' ? '' : ' out') + '">Buy ' + p.name + '</button></div>'; }).join('') + '</div>';
  const end = '<button class="sec"><i class="ph ph-paper-plane-tilt"></i>Continue with Free Plan<span class="m">Use first ' + FREE + ' slides</span></button>';
  const card = (meter) => head + '<div class="meter">' + meter + '</div>' + plans + end;
  const bar = (a, b, cls) => '<div class="bar ' + (cls || '') + '"><span class="' + a + '" style="flex:' + FREE + '"></span><span class="' + b + '" style="flex:' + MORE + '"></span></div>';
  const scale = (mid) => '<div class="scale"><span>1</span><span class="m" style="left:' + Math.min(80, Math.max(20, FREE / N * 100)) + '%">' + mid + '</span><span class="r">' + N + '</span></div>';
  const legend = (l, r) => '<div class="legend">' + l + r + '</div>';
  const L = { free: '<span><i class="dot d-blue"></i><b>' + FREE + '</b> on Free</span>', freeG: '<span><i class="dot d-grey"></i><b>' + FREE + '</b> on Free</span>',
    more: '<span class="g"><i class="dot d-green"></i><b>+' + MORE + '</b> with Pro or Gold</span>', moreB: '<span><i class="dot d-blue"></i><b>+' + MORE + '</b> with Pro or Gold</span>' };
  // segments: one per slide up to 30, bigger decks share blocks so the row never grows
  const S = Math.min(N, 30), SF = Math.max(1, Math.round(FREE / N * S));
  const segs = (on, cls, cols) => '<div class="segs ' + (cls || '') + '" style="grid-template-columns:repeat(' + (cols || S) + ',1fr)">' +
    Array.from({ length: S }, (_, i) => '<i class="' + (i >= SF ? on : '') + '" style="animation-delay:' + (i * .018).toFixed(3) + 's"></i>').join('') + '</div>';

  const V = [
    { f: '#1', t: 'Blue and green, polished', d: 'lighter panel, split tick, green count',
      html: () => card(legend(L.free, L.more) + '<div class="split" style="--at:' + AT + '">' + bar('c-blue', 'c-green') + '</div>' + scale('Free limit ' + FREE)) },
    { f: '#1', t: 'Labels under the bar', d: 'each part names itself, no legend above',
      html: () => card(bar('c-blue', 'c-green', 'thick') +
        '<div class="under"><span><b>' + FREE + ' slides</b>on Free</span><span class="g"><b>+' + MORE + ' slides</b>with Pro or Gold</span></div>') },
    { f: '#1', t: 'Pills over the bar', d: 'small tags sit on each part',
      html: () => card('<div class="over"><span class="b"><em>' + FREE + ' on Free</em></span><span class="g"><em>+' + MORE + ' with Pro or Gold</em></span></div>' +
        bar('c-blue', 'c-green', 'thick') + scale('')) },
    { f: '#1', t: 'Soft Free, bold plan', d: 'Free share is light, the plan part carries the colour',
      html: () => card(legend('<span><i class="dot" style="background:#b9d1ff"></i><b>' + FREE + '</b> on Free</span>', L.more) + bar('c-soft', 'c-green') + scale('Free limit ' + FREE)) },
    { f: '#3', t: 'Segments, polished', d: 'grey for Free, blue for the rest, split tick',
      html: () => card(legend(L.freeG, L.moreB) + '<div class="split" style="--at:' + (SF / S * 100).toFixed(2) + '%">' + segs('p') + '</div>' + scale('Free limit ' + FREE)) },
    { f: '#3', t: 'Segments in green', d: 'the extra slides are green, reads as a gain',
      html: () => card(legend(L.freeG, L.more) + segs('pg') + scale('Free limit ' + FREE)) },
    { f: '#3', t: 'Segments light up', d: 'Free blocks show first, then the rest fill in blue one by one',
      html: () => card(legend(L.freeG, L.moreB) + segs('p', 'light') + scale('Free limit ' + FREE)) },
    { f: '#1 + #3', t: 'Tall slide blocks', d: 'taller blocks read as slides, bar colours from #1',
      html: () => card(legend(L.free, L.more) + segs('pg', 'tall') + scale('')) },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = V.map((v, i) => '<div class="cell"><div class="lbl"><span class="n">' + (i + 1) + '</span><b>' + v.t + '</b><span class="from">' + v.f + '</span><span>· ' + v.d + '</span></div><div class="card">' + v.html() + '</div></div>').join('');
  // 8: blue for the free blocks so the tall row matches #1
  grid.querySelectorAll('.segs.tall i:not(.pg)').forEach((i) => { i.style.background = '#005eff'; });

  // 7: light the extra blocks one by one
  grid.querySelectorAll('.segs.light').forEach((row) => {
    row.querySelectorAll('i.p').forEach((i, n) => { i.style.transitionDelay = (0.6 + n * 0.07).toFixed(2) + 's'; });
    setTimeout(() => row.classList.add('on'), 150);
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
