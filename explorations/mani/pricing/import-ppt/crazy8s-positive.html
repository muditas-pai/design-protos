<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positive Gate Crazy 8s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* 8 takes on the v8 import gate, told as a gain: what Pro brings in, never what gets removed. No red anywhere */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #e9ecf0; color: #171717; -webkit-font-smoothing: antialiased; padding: 32px 28px 60px; }
  h1 { font-size: 20px; font-weight: 600; }
  .intro { font-size: 13px; color: #525252; margin: 4px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1500px; }
  .cell { background: #f7f8fa; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 0 0 1px rgba(10,25,37,0.06); }
  .lbl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .lbl b { font-size: 13px; font-weight: 600; }
  .lbl span { font-size: 12px; color: #737373; }
  .lbl .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #171717; color: #fff; font-size: 11px; font-weight: 600; flex: none; }

  /* card chrome, same as v8 */
  .card { background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 20px 22px 16px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); }
  .head { font-size: 15.5px; font-weight: 600; }
  .head .win { color: #0055ED; }
  .sub { font-size: 13px; color: #737373; margin: 4px 0 14px; }
  .panel { padding: 14px 16px; margin-bottom: 14px; border-radius: 10px; background: #fafafa; box-shadow: inset 0 0 0 1px #f0f0f0; }

  .plan { display: flex; align-items: center; gap: 12px; border: 1.5px solid #0055ED; background: #f5f9ff; border-radius: 10px; padding: 12px 14px; }
  .plan .ic { width: 30px; height: 30px; border-radius: 8px; background: #0055ED; color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
  .plan .body { flex: 1; min-width: 0; }
  .plan .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .gtag { font-size: 11px; font-weight: 500; color: #16a34a; background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .plan .meta { font-size: 12.5px; color: #525252; margin-top: 2px; }
  .plan .price { text-align: right; white-space: nowrap; }
  .plan .now { font-size: 16px; font-weight: 600; }
  .plan .per { font-size: 12px; color: #737373; }
  .plan .bill { font-size: 11.5px; color: #737373; display: block; margin-top: 1px; }
  .cta { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px; background: #0055ED; color: #fff; font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .cta:hover { background: #004bd1; }
  .sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 8px; border: 1px solid #d4d4d4; border-radius: 4px; background: #fff; color: #171717; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .sec:hover { background: #f5f5f5; }
  .sec .m { color: #8a8a8a; font-weight: 400; }

  /* shared meter bits */
  .mtop { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 12.5px; color: #525252; }
  .mtop span { display: inline-flex; align-items: center; gap: 7px; }
  .mtop b { font-weight: 600; color: #171717; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .d-blue { background: #005eff; } .d-green { background: #16a34a; } .d-grey { background: #d4d4d4; }
  .bar { display: flex; gap: 3px; height: 8px; }
  .bar span { border-radius: 999px; transform-origin: left; animation: grow .7s cubic-bezier(.22,1,.36,1) backwards; }
  .bar span + span { animation-delay: .25s; }
  .bar .blue { background: linear-gradient(90deg, #0055ED, #5990FC); }
  .bar .green { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .bar .grey { background: #ececec; }
  @keyframes grow { from { transform: scaleX(0); } }
  .scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #a3a3a3; font-variant-numeric: tabular-nums; }

  /* 2 compare tiles */
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .vs div { padding: 12px 14px; border-radius: 10px; background: #fafafa; box-shadow: inset 0 0 0 1px #f0f0f0; }
  .vs div.on { background: #f0fdf4; box-shadow: inset 0 0 0 1px #bbf7d0; }
  .vs small { display: block; font-size: 11.5px; color: #737373; margin-bottom: 4px; }
  .vs b { font-size: 18px; font-weight: 600; }
  .vs .on b { color: #15803d; }
  .vs em { font-style: normal; font-size: 12.5px; color: #525252; margin-left: 4px; }

  /* 3 ring */
  .ringrow { display: flex; align-items: center; gap: 16px; }
  .ring { width: 64px; height: 64px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .trk { stroke: #eef2f7; }
  .ring .arc { stroke: #16a34a; stroke-linecap: round; stroke-dasharray: 176; animation: ring 1s cubic-bezier(.22,1,.36,1) .2s backwards; }
  @keyframes ring { from { stroke-dashoffset: 176; } }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
  .ringrow p { font-size: 13px; color: #525252; line-height: 1.5; }
  .ringrow p b { color: #171717; font-weight: 600; }

  /* 4 toggle */
  .seg { display: inline-flex; padding: 3px; border-radius: 8px; background: #f0f2f5; margin-bottom: 12px; }
  .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; font: 500 12.5px 'Inter', sans-serif; color: #525252; cursor: pointer; }
  .seg button.on { background: #fff; color: #171717; box-shadow: 0 1px 3px rgba(10,25,37,0.12); }
  .tog .bar .fill { background: linear-gradient(90deg, #0055ED, #5990FC); transition: flex-grow .5s cubic-bezier(.22,1,.36,1); animation: none; }
  .tog .bar .rest { background: #ececec; transition: flex-grow .5s cubic-bezier(.22,1,.36,1); animation: none; }

  /* 5 celebrate */
  .yay { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .yay .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #15803d; font-size: 19px; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chips span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #f5f9ff; box-shadow: inset 0 0 0 1px #d6e5ff; font-size: 12.5px; color: #404040; }
  .chips i { color: #005eff; font-size: 14px; }

  /* 6 deck stack */
  .stackrow { display: flex; align-items: center; gap: 18px; }
  .stack { position: relative; width: 84px; height: 58px; flex: none; }
  .stack i { position: absolute; width: 70px; height: 44px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px #e5e5e5, 0 2px 6px rgba(10,25,37,0.08); }
  .stack i:nth-child(1) { left: 14px; top: 0; background: #eef4ff; }
  .stack i:nth-child(2) { left: 7px; top: 7px; background: #f5f9ff; }
  .stack i:nth-child(3) { left: 0; top: 14px; display: grid; place-items: center; font-style: normal; font-size: 15px; font-weight: 600; }
  .stack .plus { position: absolute; right: -8px; top: -8px; padding: 2px 7px; border-radius: 999px; background: #16a34a; color: #fff; font-size: 11px; font-weight: 600; box-shadow: 0 0 0 2px #fff; }
  .stackrow p { font-size: 13px; color: #525252; line-height: 1.55; }
  .stackrow p b { color: #171717; font-weight: 600; }

  /* 8 checklist */
  .ticks { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 9px 18px; margin-bottom: 14px; }
  .ticks li { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #404040; }
  .ticks li i { color: #16a34a; font-size: 16px; }
  .ticks li b { font-weight: 600; color: #171717; }

  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    body { padding: 20px 16px 40px; }
    .card { padding: 16px 14px 14px; }
    .vs, .ticks { grid-template-columns: 1fr; }
    .plan .bill { display: none; }
  }
</style>
</head>
<body>
<h1>Import gate, positive: 8 directions</h1>
<p class="intro">Same moment as v8 (24-slide deck, Free covers 15), told as what Pro brings in. No "removed", no red, full price.</p>

<div class="grid" id="grid"></div>

<script>
  const N = 24, FREE = 15, MORE = N - FREE, PRO = 60;
  const plan = (tag) => '<div class="plan"><span class="ic"><i class="ph-fill ph-rocket-launch"></i></span><div class="body">' +
    '<div class="name">Pro' + (tag === false ? '' : ' <span class="gtag">' + (tag || 'Imports all ' + N + ' slides') + '</span>') + '</div>' +
    '<div class="meta">5,000 credits, up to ' + PRO + ' slides per import</div></div>' +
    '<div class="price"><span class="now">$20</span><span class="per">/mo</span><span class="bill">billed annually</span></div></div>';
  const cta = (t) => '<button class="cta">' + (t || 'Get Pro') + '</button>';
  const free = '<button class="sec"><i class="ph ph-paper-plane-tilt"></i>Continue with Free Plan<span class="m">Use first ' + FREE + ' slides</span></button>';
  const bar = (a, b, ca, cb) => '<div class="bar"><span class="' + ca + '" style="flex:' + a + '"></span><span class="' + cb + '" style="flex:' + b + '"></span></div>';

  const V = [
    { t: 'Gain meter', d: 'same meter as v8, the extra slides are green and belong to Pro',
      html: () => '<div class="head">Bring in <span class="win">all ' + N + ' slides</span> with Pro.</div><div class="sub">Free covers the first ' + FREE + '. Pro adds the other ' + MORE + '.</div>' +
        '<div class="panel"><div class="mtop"><span><i class="dot d-blue"></i><b>' + FREE + '</b> included on Free</span><span><i class="dot d-green"></i><b>+' + MORE + '</b> with Pro</span></div>' +
        bar(FREE, MORE, 'blue', 'green') + '<div class="scale"><span>1</span><span>' + N + '</span></div></div>' + plan() + cta() + free },
    { t: 'Free vs Pro tiles', d: 'two numbers side by side, Pro tile carries the win',
      html: () => '<div class="head">Your deck has ' + N + ' slides.</div><div class="sub">Pick how much of it to bring in.</div>' +
        '<div class="vs"><div><small>Free Plan</small><b>' + FREE + '</b><em>slides</em></div><div class="on"><small>Pro</small><b>All ' + N + '</b><em>slides</em></div></div>' + plan(false) + cta() + free },
    { t: 'Complete ring', d: 'a full green ring: Pro fits the whole deck',
      html: () => '<div class="head">Pro fits your <span class="win">whole deck</span>.</div><div class="sub">Every slide comes in, just as you made it.</div>' +
        '<div class="panel ringrow"><div class="ring"><svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="28"/><circle class="arc" cx="32" cy="32" r="28"/></svg><b>' + N + '/' + N + '</b></div>' +
        '<p><b>All ' + N + ' slides</b> import on Pro.<br>Free starts you with the first ' + FREE + '.</p></div>' + plan() + cta() + free },
    { t: 'Try the switch', d: 'flip Free and Pro, the meter fills to the whole deck on Pro',
      cls: 'tog',
      html: () => '<div class="head">See your deck on each plan.</div><div class="sub">Switch to compare.</div>' +
        '<div class="panel"><div class="seg"><button data-p="free">Free</button><button data-p="pro" class="on">Pro</button></div>' +
        '<div class="mtop"><span><i class="dot d-blue"></i><b data-count>' + N + ' of ' + N + '</b>&nbsp;slides import</span><span data-note>Whole deck</span></div>' +
        '<div class="bar"><span class="fill" style="flex:' + N + '"></span><span class="rest" style="flex:0"></span></div></div>' + plan() + cta() + free },
    { t: 'Celebrate the deck', d: 'lead with the win, then what Pro adds',
      html: () => '<div class="yay"><span class="ic"><i class="ph-fill ph-confetti"></i></span><div><div class="head">Your ' + N + '-slide deck is ready.</div><div class="sub" style="margin:2px 0 0">Import all of it with Pro, and keep building.</div></div></div>' +
        '<div class="chips"><span><i class="ph ph-stack"></i>All ' + N + ' slides</span><span><i class="ph ph-sparkle"></i>Advanced AI models</span><span><i class="ph ph-paint-brush-broad"></i>Brand Kit</span><span><i class="ph ph-chart-bar"></i>Analytics</span></div>' + plan(false) + cta() + free },
    { t: 'Deck stack', d: 'the deck as one object with a green +' + MORE + ', same size for any deck',
      html: () => '<div class="head">Import the full deck with Pro.</div><div class="sub">Nothing to trim, nothing to redo.</div>' +
        '<div class="panel stackrow"><div class="stack"><i></i><i></i><i>' + N + '</i><span class="plus">+' + MORE + '</span></div>' +
        '<p><b>' + FREE + ' slides</b> come in on Free.<br><b>' + MORE + ' more</b> come with Pro, the whole deck.</p></div>' + plan() + cta() + free },
    { t: 'Room to grow', d: 'Pro meter: this deck, plus space for bigger decks later',
      html: () => '<div class="head">Pro fits this deck, <span class="win">with room to spare</span>.</div><div class="sub">Up to ' + PRO + ' slides per import.</div>' +
        '<div class="panel"><div class="mtop"><span><i class="dot d-blue"></i><b>' + N + '</b> this deck</span><span><i class="dot d-grey"></i><b>' + (PRO - N) + '</b> more room</span></div>' +
        bar(N, PRO - N, 'blue', 'grey') + '<div class="scale"><span>1</span><span>' + PRO + '</span></div></div>' + plan('Fits up to ' + PRO + ' slides') + cta() + free },
    { t: 'What Pro adds', d: 'a short checklist, all ' + N + ' slides is the first tick',
      html: () => '<div class="head">Pro imports <span class="win">all ' + N + ' slides</span>, and more.</div><div class="sub">Here is what comes with it.</div>' +
        '<ul class="ticks"><li><i class="ph-fill ph-check-circle"></i><b>All ' + N + ' slides</b></li><li><i class="ph-fill ph-check-circle"></i>5,000 credits</li><li><i class="ph-fill ph-check-circle"></i>Advanced AI models</li><li><i class="ph-fill ph-check-circle"></i>Brand Kit</li></ul>' + plan(false) + cta() + free },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = V.map((v, i) => '<div class="cell"><div class="lbl"><span class="n">' + (i + 1) + '</span><b>' + v.t + '</b><span>· ' + v.d + '</span></div><div class="card ' + (v.cls || '') + '">' + v.html() + '</div></div>').join('');

  // 4: the switch fills the meter to the whole deck on Pro, the Free share on Free
  grid.querySelectorAll('.tog').forEach((card) => {
    const fill = card.querySelector('.fill'), rest = card.querySelector('.rest');
    card.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => {
      const pro = b.dataset.p === 'pro';
      card.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('on', x === b));
      fill.style.flexGrow = pro ? N : FREE; rest.style.flexGrow = pro ? 0 : MORE;
      card.querySelector('[data-count]').textContent = (pro ? N : FREE) + ' of ' + N;
      card.querySelector('[data-note]').textContent = pro ? 'Whole deck' : 'First ' + FREE + ' slides';
    }));
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
