<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positive Gate Crazy 8s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  /* round 4: the v8 card, told positively, Pro and Gold. Eight simple bars, no red, nothing "removed" */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #e9ecf0; color: #171717; -webkit-font-smoothing: antialiased; padding: 32px 28px 60px; }
  h1 { font-size: 20px; font-weight: 600; }
  .intro { font-size: 13px; color: #525252; margin: 4px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1500px; }
  .cell { background: #f7f8fa; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 0 0 1px rgba(10,25,37,0.06); }
  .lbl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .lbl b { font-size: 13px; font-weight: 600; }
  .lbl span { font-size: 12px; color: #737373; }
  .lbl .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #171717; color: #fff; font-size: 11px; font-weight: 600; flex: none; }

  /* v8 card chrome */
  .card { background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 20px 22px 16px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); }
  .head { font-size: 15.5px; font-weight: 600; }
  .head .win { color: #0055ED; }
  .sub { font-size: 13px; color: #737373; margin: 4px 0 14px; }
  .panel { padding: 14px 16px 12px; margin-bottom: 14px; border-radius: 10px; background: #fafafa; box-shadow: inset 0 0 0 1px #f0f0f0; }
  .top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 12.5px; color: #525252; }
  .top span { display: inline-flex; align-items: center; gap: 7px; }
  .top b { font-weight: 600; color: #171717; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .d-grey { background: #a3a3a3; } .d-blue { background: #005eff; } .d-green { background: #16a34a; }
  .scale { position: relative; height: 14px; margin-top: 6px; font-size: 11px; color: #a3a3a3; font-variant-numeric: tabular-nums; }
  .scale span { position: absolute; top: 0; }
  .scale .end { right: 0; }
  .scale .mid { transform: translateX(-50%); color: #525252; font-weight: 500; }

  /* bars */
  .bar { display: flex; gap: 3px; height: 8px; }
  .bar span { border-radius: 999px; transform-origin: left; animation: grow .7s cubic-bezier(.22,1,.36,1) backwards; }
  .bar span + span { animation-delay: .2s; }
  @keyframes grow { from { transform: scaleX(0); } }
  .c-blue { background: linear-gradient(90deg, #0055ED, #5990FC); }
  .c-green { background: linear-gradient(90deg, #4ade80, #16a34a); }
  .c-grey { background: #d4d4d4; }
  .c-track { background: #ececec; }
  .c-soft { background: #cfe0ff; }

  /* 2 two bars */
  .pair { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: 12.5px; color: #525252; }
  .pair + .pair { margin-top: 10px; }
  .pair b { font-weight: 600; color: #171717; text-align: right; }
  .pair .bar { height: 8px; }

  /* 3 segments */
  .segs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
  .segs i { height: 14px; border-radius: 3px; animation: grow .4s cubic-bezier(.22,1,.36,1) backwards; }

  /* 4 marker on a full bar */
  .mk { position: relative; }
  .mk .pin { position: absolute; top: -4px; width: 2px; height: 16px; margin-left: -1px; border-radius: 2px; background: #0A1925; }
  .mk .end { position: absolute; right: -2px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 999px; background: #16a34a; color: #fff; display: grid; place-items: center; font-size: 11px; box-shadow: 0 0 0 3px #fafafa; }

  /* 6 slider */
  .sl { position: relative; height: 22px; display: flex; align-items: center; }
  .sl .trk { position: absolute; left: 0; right: 0; height: 6px; border-radius: 999px; background: #e5e5e5; }
  .sl .fil { position: absolute; left: 0; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #0055ED, #5990FC); transition: width .5s cubic-bezier(.22,1,.36,1); }
  .sl .knob { position: absolute; width: 20px; height: 20px; margin-left: -10px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1.5px #0055ED, 0 2px 6px rgba(10,25,37,.2); transition: left .5s cubic-bezier(.22,1,.36,1); }
  .sl .tip { position: absolute; bottom: 26px; transform: translateX(-50%); padding: 2px 7px; border-radius: 6px; background: #0A1925; color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; transition: left .5s cubic-bezier(.22,1,.36,1); }
  .p6 { padding-top: 34px; }

  /* 7 slide squares */
  .sq { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .sq i { aspect-ratio: 16 / 10; border-radius: 3px; animation: grow .35s cubic-bezier(.22,1,.36,1) backwards; }

  /* plans, v8 style */
  .plans { display: flex; flex-direction: column; gap: 8px; }
  .plan { display: flex; align-items: center; gap: 12px; border: 1px solid #e5e5e5; background: #fff; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .plan:hover:not(.is-sel) { border-color: #c9cdd2; }
  .plan.is-sel { border-color: #0055ED; background: #f5f9ff; box-shadow: inset 0 0 0 .5px #0055ED; }
  .plan .ic { width: 30px; height: 30px; border-radius: 8px; background: #f0f2f5; color: #404040; display: grid; place-items: center; font-size: 15px; flex: none; transition: background-color .2s, color .2s; }
  .plan.is-sel .ic { background: #0055ED; color: #fff; }
  .plan .body { flex: 1; min-width: 0; }
  .plan .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .gtag { font-size: 11px; font-weight: 500; color: #16a34a; background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .plan .meta { font-size: 12.5px; color: #525252; margin-top: 2px; }
  .plan .price { text-align: right; white-space: nowrap; }
  .plan .now { font-size: 16px; font-weight: 600; }
  .plan .per { font-size: 12px; color: #737373; }
  .plan .bill { font-size: 11.5px; color: #737373; display: block; margin-top: 1px; }
  .cta { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px; background: #0055ED; color: #fff; font: 600 14.5px 'Inter', sans-serif; cursor: pointer; }
  .cta:hover { background: #004bd1; }
  .sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 8px; border: 1px solid #d4d4d4; border-radius: 4px; background: #fff; color: #171717; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .sec:hover { background: #f5f5f5; }
  .sec .m { color: #8a8a8a; font-weight: 400; }

  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    body { padding: 20px 16px 40px; }
    .card { padding: 16px 14px 14px; }
    .plan .bill, .gtag { display: none; }
    .pair { grid-template-columns: 76px 1fr 36px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>Import gate, positive, round 4: simple bars</h1>
<p class="intro">Your v8 card, told as a gain, with Pro and Gold. 24-slide deck, Free covers 15. Each card tries one bar. No red, nothing "removed".</p>

<div class="grid" id="grid"></div>

<script>
  const N = 24, FREE = 15, MORE = N - FREE;
  const PLANS = {
    pro:  { name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  cap: 60, price: 20 },
    gold: { name: 'Gold', icon: 'ph-sketch-logo',   credits: '15,000', cap: 99, price: 50 },
  };
  const K = Object.keys(PLANS);
  const head = '<div class="head">Import <span class="win">all ' + N + ' slides</span> with Pro or Gold.</div><div class="sub">Free imports the first ' + FREE + '. Pro and Gold import every slide.</div>';
  const plans = '<div class="plans">' + K.map((k) => { const p = PLANS[k];
    return '<div class="plan" data-k="' + k + '"><span class="ic"><i class="ph ' + p.icon + '"></i></span><div class="body">' +
      '<div class="name">' + p.name + ' <span class="gtag">Imports all ' + N + ' slides</span></div>' +
      '<div class="meta">' + p.credits + ' credits, up to ' + p.cap + ' slides per import</div></div>' +
      '<div class="price"><span class="now">$' + p.price + '</span><span class="per">/mo</span><span class="bill">billed annually</span></div></div>'; }).join('') + '</div>';
  const end = '<button class="cta" data-cta>Get Pro</button><button class="sec"><i class="ph ph-paper-plane-tilt"></i>Continue with Free Plan<span class="m">Use first ' + FREE + ' slides</span></button>';
  const bar = (parts) => '<div class="bar">' + parts.map((p) => '<span class="' + p[1] + '" style="flex:' + p[0] + '"></span>').join('') + '</div>';
  const mid = (at, txt) => '<span class="mid" style="left:' + Math.min(78, Math.max(22, at / N * 100)) + '%">' + txt + '</span>';
  const card = (panel) => head + '<div class="panel">' + panel + '</div>' + plans + end;

  const V = [
    { t: 'Blue and green', d: 'your v8 bar, the extra slides are green and come with a plan',
      html: () => card('<div class="top"><span><i class="dot d-blue"></i><b>' + FREE + '</b> on Free</span><span><i class="dot d-green"></i><b>+' + MORE + '</b> with Pro or Gold</span></div>' +
        bar([[FREE, 'c-blue'], [MORE, 'c-green']]) + '<div class="scale"><span>1</span>' + mid(FREE, 'Free limit ' + FREE) + '<span class="end">' + N + '</span></div>') },
    { t: 'Two bars', d: 'one bar per plan type, the paid one is full',
      html: () => card('<div class="pair"><span>Free</span>' + bar([[FREE, 'c-grey'], [MORE, 'c-track']]) + '<b>' + FREE + '</b></div>' +
        '<div class="pair"><span>Pro or Gold</span>' + bar([[N, 'c-blue']]) + '<b>' + N + '</b></div>') },
    { t: 'Slide segments', d: 'one small block per slide, the last ' + MORE + ' come with a plan',
      html: () => card('<div class="top"><span><i class="dot d-grey"></i><b>' + FREE + '</b> on Free</span><span><i class="dot d-blue"></i><b>+' + MORE + '</b> with Pro or Gold</span></div>' +
        '<div class="segs">' + Array.from({ length: N }, (_, i) => '<i style="background:' + (i < FREE ? '#d4d4d4' : '#005eff') + ';animation-delay:' + (i * .02).toFixed(2) + 's"></i>').join('') + '</div>' +
        '<div class="scale"><span>1</span>' + mid(FREE, 'Free limit ' + FREE) + '<span class="end">' + N + '</span></div>') },
    { t: 'Full bar, one marker', d: 'the whole deck in blue, Free limit is just a small pin',
      html: () => card('<div class="top"><span><i class="dot d-blue"></i><b>All ' + N + '</b> with Pro or Gold</span></div>' +
        '<div class="mk">' + bar([[N, 'c-blue']]) + '<span class="pin" style="left:' + (FREE / N * 100) + '%"></span><span class="end"><i class="ph ph-check"></i></span></div>' +
        '<div class="scale"><span>1</span>' + mid(FREE, 'Free limit ' + FREE) + '<span class="end">' + N + '</span></div>') },
    { t: 'Room in the plan', d: 'bar follows the picked plan: this deck against its limit',
      html: () => card('<div class="top"><span><i class="dot d-blue"></i><b>' + N + '</b> this deck</span><span><i class="dot d-grey"></i><b data-room></b> more room on <span data-pn></span></span></div>' +
        '<div class="bar"><span class="c-blue" style="flex:' + N + '"></span><span class="c-track" data-roombar></span></div>' +
        '<div class="scale"><span>1</span><span class="end" data-cap></span></div>') },
    { t: 'Slider', d: 'a simple range, the knob sits on the whole deck',
      html: () => card('<div class="p6"><div class="sl"><span class="trk"></span><span class="fil" style="width:100%"></span><span class="tip" style="left:100%">All ' + N + '</span><span class="knob" style="left:100%"></span></div></div>' +
        '<div class="scale"><span>1</span>' + mid(FREE, 'Free covers ' + FREE) + '<span class="end">' + N + '</span></div>') },
    { t: 'Slide squares', d: 'small slide shapes, two rows, the extra ones in blue',
      html: () => card('<div class="top"><span><i class="dot d-grey"></i><b>' + FREE + '</b> on Free</span><span><i class="dot d-blue"></i><b>+' + MORE + '</b> with Pro or Gold</span></div>' +
        '<div class="sq">' + Array.from({ length: N }, (_, i) => '<i style="background:' + (i < FREE ? '#e5e5e5' : '#5990FC') + ';animation-delay:' + (i * .02).toFixed(2) + 's"></i>').join('') + '</div>') },
    { t: 'Soft split', d: 'one bar, Free share in light blue, the rest in full blue',
      html: () => card('<div class="top"><span><i class="dot" style="background:#cfe0ff"></i><b>' + FREE + '</b> on Free</span><span><i class="dot d-blue"></i><b>' + N + '</b> on Pro or Gold</span></div>' +
        bar([[FREE, 'c-soft'], [MORE, 'c-blue']]) + '<div class="scale"><span>1</span>' + mid(FREE, FREE) + '<span class="end">' + N + '</span></div>') },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = V.map((v, i) => '<div class="cell"><div class="lbl"><span class="n">' + (i + 1) + '</span><b>' + v.t + '</b><span>· ' + v.d + '</span></div><div class="card">' + v.html() + '</div></div>').join('');

  // pick a plan, the button and card 5's bar follow it
  grid.querySelectorAll('.card').forEach((card) => {
    const pick = (k) => {
      const p = PLANS[k];
      card.querySelectorAll('[data-k]').forEach((el) => el.classList.toggle('is-sel', el.dataset.k === k));
      card.querySelector('[data-cta]').textContent = 'Get ' + p.name;
      const room = card.querySelector('[data-room]');
      if (room) { room.textContent = p.cap - N; card.querySelector('[data-pn]').textContent = p.name; card.querySelector('[data-roombar]').style.flex = p.cap - N; card.querySelector('[data-cap]').textContent = p.cap; }
    };
    card.querySelectorAll('[data-k]').forEach((el) => el.addEventListener('click', () => pick(el.dataset.k)));
    pick('pro');
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
