<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positive Gate Crazy 8s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  /* round 3, minimal: one headline, one line, two plans, one button. Each card changes one small idea. Positive, Pro and Gold, outline icons */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #e9ecf0; color: #171717; -webkit-font-smoothing: antialiased; padding: 32px 28px 60px; }
  h1 { font-size: 20px; font-weight: 600; }
  .intro { font-size: 13px; color: #525252; margin: 4px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1400px; }
  .cell { background: #f7f8fa; border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 0 0 1px rgba(10,25,37,0.06); }
  .lbl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .lbl b { font-size: 13px; font-weight: 600; }
  .lbl span { font-size: 12px; color: #737373; }
  .lbl .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: #171717; color: #fff; font-size: 11px; font-weight: 600; flex: none; }

  .card { background: #fff; border: 1px solid rgba(11,15,20,0.09); border-radius: 14px; padding: 20px 22px 16px; box-shadow: 0 12px 32px -16px rgba(10,25,37,0.25), 0 1px 2px rgba(10,25,37,0.06); }
  .t { font-size: 16px; font-weight: 600; }
  .s { font-size: 13px; color: #737373; margin: 4px 0 16px; }
  .big { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }

  /* plan rows */
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid #e5e5e5; border-radius: 6px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .row:hover:not(.is-sel) { border-color: #c9cdd2; }
  .row.is-sel { border-color: #005eff; background: #eaf2ff; box-shadow: inset 0 0 0 .5px #005eff; }
  .radio { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid #c9cdd2; background: #fff; flex: none; transition: border-width .2s ease, border-color .2s ease; }
  .row.is-sel .radio { border: 5px solid #005eff; }
  .nm { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; }
  .nm i { font-size: 16px; }
  .lim { font-size: 13px; color: #737373; }
  .ok { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #16a34a; }
  .ok i { font-size: 15px; }
  .pr { margin-left: auto; font-size: 12.5px; color: #525252; white-space: nowrap; }
  .pr b { font-size: 16px; font-weight: 500; color: #171717; }

  /* two small columns */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { padding: 16px; border: 1px solid #e5e5e5; border-radius: 6px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .col.is-sel { border-color: #005eff; background: #eaf2ff; box-shadow: inset 0 0 0 .5px #005eff; }
  .col .lim { display: block; margin: 4px 0 12px; }
  .col .pr { margin: 0; }

  /* thin line meter */
  .line { margin-bottom: 16px; }
  .line-bar { height: 4px; border-radius: 999px; background: linear-gradient(90deg, #0055ED, #5990FC); }
  .line-l { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #737373; }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 40px; margin-top: 16px; border: 0; border-radius: 4px; background: #005EFF; color: #fff; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .btn:hover { background: #0055ED; }
  .sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 8px; border: 1px solid #d4d4d4; border-radius: 4px; background: #fff; color: #171717; font: 500 13.5px 'Inter', sans-serif; cursor: pointer; }
  .sec:hover { background: #f5f5f5; }
  .sec .m { color: #8a8a8a; font-weight: 400; }
  .link { display: block; margin-top: 10px; text-align: center; font-size: 13px; color: #525252; cursor: pointer; }
  .link u { color: #005eff; text-decoration: none; }

  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    body { padding: 20px 16px 40px; }
    .card { padding: 16px 14px 14px; }
    .row .lim, .row .ok { display: none; }
    .cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<h1>Import gate, positive, round 3: minimal</h1>
<p class="intro">24-slide deck, Free covers 15. One headline, one line, two plans, one button. Each card changes one small thing.</p>

<div class="grid" id="grid"></div>

<script>
  const N = 24, FREE = 15;
  const PLANS = {
    pro:  { name: 'Pro',  icon: 'ph-rocket-launch', credits: '5,000',  cap: 60, price: 20 },
    gold: { name: 'Gold', icon: 'ph-sketch-logo',   credits: '15,000', cap: 99, price: 50 },
  };
  const K = Object.keys(PLANS);
  const nm = (p) => '<span class="nm">' + p.name + '<i class="ph ' + p.icon + '"></i></span>';
  const pr = (p) => '<span class="pr"><b>$' + p.price + '</b>/mo</span>';
  // mid: what sits between the name and the price in a row
  const rows = (mid) => '<div class="rows">' + K.map((k) => { const p = PLANS[k];
    return '<div class="row" data-k="' + k + '"><span class="radio"></span>' + nm(p) + (mid ? mid(p) : '') + pr(p) + '</div>'; }).join('') + '</div>';
  const limit = (p) => '<span class="lim">Up to ' + p.cap + ' slides</span>';
  const btn = '<button class="btn" data-cta>Get Pro</button>';
  const free = '<button class="sec"><i class="ph ph-paper-plane-tilt"></i>Continue with Free Plan<span class="m">Use first ' + FREE + ' slides</span></button>';

  const V = [
    { t: 'Plain', d: 'the ask in one line',
      html: () => '<div class="t">Import all ' + N + ' slides</div><div class="s">Pick a plan to bring in your whole deck.</div>' + rows(limit) + btn + free },
    { t: 'Number first', d: 'the deck size leads',
      html: () => '<div class="big">' + N + ' slides</div><div class="s">ready to import. Pro and Gold bring in every one.</div>' + rows(limit) + btn + free },
    { t: 'Both facts', d: 'what Free covers, what a plan covers, side by side',
      html: () => '<div class="t">Your deck has ' + N + ' slides</div><div class="s">Free imports ' + FREE + '. Pro and Gold import all ' + N + '.</div>' + rows(limit) + btn + free },
    { t: 'Tick in the row', d: 'each plan says it takes the whole deck',
      html: () => '<div class="t">Bring in your whole deck</div><div class="s">Both plans import every slide.</div>' + rows(() => '<span class="ok"><i class="ph ph-check-circle"></i>All ' + N + ' slides</span>') + btn + free },
    { t: 'Thin line', d: 'one full line, no split, no cut',
      html: () => '<div class="t">Import all ' + N + ' slides</div><div class="s">Pick a plan to bring in your whole deck.</div>' +
        '<div class="line"><div class="line-bar"></div><div class="line-l"><span>Slide 1</span><span>Slide ' + N + '</span></div></div>' + rows(limit) + btn + free },
    { t: 'Two columns', d: 'plans side by side, nothing else',
      html: () => '<div class="t">Import all ' + N + ' slides</div><div class="s">Pick a plan.</div><div class="cols">' +
        K.map((k) => { const p = PLANS[k]; return '<div class="col" data-k="' + k + '">' + nm(p) + '<span class="lim">Up to ' + p.cap + ' slides</span>' + pr(p) + '</div>'; }).join('') + '</div>' + btn + free },
    { t: 'A question', d: 'asks, does not tell',
      html: () => '<div class="t">Want all ' + N + ' slides?</div><div class="s">Free covers the first ' + FREE + '. A plan brings in the rest.</div>' + rows(limit) + btn + free },
    { t: 'One pick', d: 'Pro is the answer, Gold is one tap away',
      html: () => '<div class="t">Pro imports all ' + N + ' slides</div><div class="s">$20/mo, up to 60 slides per import.</div>' +
        '<button class="btn" data-cta>Get Pro</button><span class="link" data-swap>Need more? <u>Get Gold, $50/mo</u></span>' + free },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = V.map((v, i) => '<div class="cell"><div class="lbl"><span class="n">' + (i + 1) + '</span><b>' + v.t + '</b><span>· ' + v.d + '</span></div><div class="card">' + v.html() + '</div></div>').join('');

  // pick a plan, the button follows it
  grid.querySelectorAll('.card').forEach((card) => {
    const pick = (k) => {
      card.querySelectorAll('[data-k]').forEach((el) => el.classList.toggle('is-sel', el.dataset.k === k));
      card.querySelector('[data-cta]').textContent = 'Get ' + PLANS[k].name;
    };
    card.querySelectorAll('[data-k]').forEach((el) => el.addEventListener('click', () => pick(el.dataset.k)));
    pick('pro');
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
