<script>
  /* ---------- v3: Manage your plan, ported from settings-billing-v2.html (CAT, LADDER, PATHS, teamPrice, tgt,
     mpQuote, mpOptions, drawChange, openChange and the mppick / mpview / mpdd / mppool / pay handlers).
     Own scope so its state never touches the close flow's. Paid users only. ---------- */
  window.MP = (() => {
    // the paid plans this proto can be on, mapped to the port's PATHS keys
    const MEMBERS = {
      'pro-week':  { path: 'weekly',    label: 'Pro weekly',  plan: 'pro', cadence: 'week',  price: 2.99, credits: 100,  balance: 60 },
      'pro-month': { path: 'pro-month', label: 'Pro monthly', plan: 'pro', cadence: 'month', price: 25,   credits: 1000, balance: 620 },
      'pro-year':  { path: 'pro',       label: 'Pro yearly',  plan: 'pro', cadence: 'year',  price: 240,  credits: 5000, balance: 3200 },
    };
    const PLANS = { pro: { name: 'Pro' }, gold: { name: 'Gold' } };
    const CAT = {
      'pro-month':  { tier: 'pro',  cad: 'month', price: 25,   credits: 1000,  name: 'Pro monthly',  state: 'pro-month' },
      'gold-month': { tier: 'gold', cad: 'month', price: 120,  credits: 5000,  name: 'Gold monthly', state: 'gold-month' },
      'pro-year':   { tier: 'pro',  cad: 'year',  price: 240,  credits: 5000,  name: 'Pro yearly',   state: 'pro' },
      'gold-year':  { tier: 'gold', cad: 'year',  price: 1200, credits: 50000, name: 'Gold yearly',  state: 'gold' },
      'pro-team':   { tier: 'pro',  cad: 'year', team: true, unit: 5000,  list: 20,  pools: [15000, 25000, 50000, 75000, 100000], name: 'Pro Team', state: 'team' },
      'gold-team':  { tier: 'gold', cad: 'year', team: true, unit: 50000, list: 100, pools: [150000, 250000, 500000, 750000, 1000000], name: 'Gold Team', state: 'team' },
    };
    const LADDER = [0.10, 0.20, 0.30, 0.40, 0.50];
    const PATHS = {
      basic:          { ind: ['pro-year', 'gold-year'], team: ['pro-team', 'gold-team'] },
      pro:            { ind: ['gold-year'], team: ['pro-team', 'gold-team'] },
      'pro-discount': { ind: ['gold-year'], team: ['pro-team', 'gold-team'] },
      cancelled:      { ind: ['gold-year'], team: ['pro-team', 'gold-team'] },
      'pro-month':    { ind: ['pro-year', 'gold-month', 'gold-year'], team: ['pro-team', 'gold-team'] },
      gold:           { ind: [], team: ['gold-team'] },
      'gold-month':   { ind: ['gold-year'], team: ['gold-team'] },
      weekly:         { ind: ['pro-month', 'gold-month', 'pro-year', 'gold-year'], team: ['pro-team', 'gold-team'], fresh: true },
      'weekly-store': { ind: ['pro-month', 'gold-month', 'pro-year', 'gold-year'], team: ['pro-team', 'gold-team'], fresh: true },
      'past-due':     { ind: ['pro-year', 'gold-month', 'gold-year'], team: ['pro-team', 'gold-team'] },
    };
    const PERIOD = { week: 7, month: 30, year: 365 };
    const S = { member: null, state: null, pick: null, mpView: 'ind', pool: { 'pro-team': 15000, 'gold-team': 150000 }, dd: null, stripe: false, busy: null, failed: false, consent: true, done: null };
    const money = (n) => '$' + (Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(2));
    const num = (n) => n.toLocaleString('en-US');
    const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const fmtLong = (d) => d.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
    const st = () => MEMBERS[S.member];
    const plan = () => PLANS[st().plan];
    const price = () => st().price;
    const credits = () => st().credits;
    const balance = () => st().balance;
    const noun = () => ({ week: 'week', month: 'month', year: 'year' })[st().cadence];
    const CADW = { week: 'weekly', month: 'monthly', year: '' };
    const planLabel = () => plan().name + (CADW[st().cadence] ? ' ' + CADW[st().cadence] : '');
    const endDate = () => { const s = st(); if (s.cadence === 'week') return addDays(TODAY, 4); if (s.cadence === 'month') return addDays(TODAY, 18); return new Date(2027, 9, 5); };
    const teamPrice = (k) => { const t = CAT[k], c = S.pool[k]; return Math.round((c / t.unit) * t.list * (1 - (LADDER[t.pools.indexOf(c)] || 0)) * 12); };
    const tgt = (k) => { const t = CAT[k]; return t.team ? Object.assign({}, t, { price: teamPrice(k), credits: S.pool[k] }) : t; };
    const usd = (n) => 'US' + money(n);
    const GOLD_POINTS = [['ph-sparkle', 'Ultra AI model, our most powerful'], ['ph-swatches', 'Custom brand kit and moods, built for you'], ['ph-book-open', 'Projects with a shared knowledge base'], ['ph-headset', 'Priority support, with direct access to our Head of Product']];
    const mpQuote = (k) => {
      const o = tgt(k), fresh = !!PATHS[S.state].fresh;
      return { k, o, fresh, due: o.price, renew: fmtLong(addDays(TODAY, PERIOD[o.cad])), total: balance() + o.credits };
    };
    const mpOptions = () => { const P = PATHS[S.state]; return S.mpView === 'team' || !P.ind.length ? P.team : P.ind; };
    const drawChange = () => {
      const s = st(), P = PATHS[S.state], fresh = !!P.fresh, opts = mpOptions();
      if (!opts.includes(S.pick)) S.pick = opts[0];
      const q = mpQuote(S.pick), o = q.o, per = (c) => (c === 'year' ? 'year' : 'month');
      const cur = '<div class="plan-card' + (s.plan === 'gold' ? ' plan-card--gold' : '') + '"><div class="plan-row is-cur"><span class="radio"></span><div class="plan-body">' +
        '<div class="plan-line"><span class="plan-name">' + planLabel() + '<span class="current-badge">Current plan</span></span><span class="plan-price"><span class="price">' + money(price()) + '</span><span class="per">/' + noun() + '</span></span></div>' +
        '<div class="big-cred"><span class="num">' + num(credits()) + '</span><span class="lbl">Credits</span></div>' +
        (fresh ? '<div class="cur-note">Weekly is a separate plan, so it isn’t upgraded. Pick a new plan below. Your weekly plan then runs to ' + fmtLong(endDate()) + ' and doesn’t renew.</div>' : '') +
        '</div></div></div>';
      const card = (k) => {
        const x = tgt(k), on = k === S.pick, gold = x.tier === 'gold';
        let title = fresh ? 'Get ' + x.name : x.tier === s.plan && !x.team ? 'Switch to ' + x.name : x.team ? x.name : 'Upgrade to ' + x.name;
        let badge = '';
        if (!x.team && x.tier === s.plan && x.cad === 'year' && s.cadence === 'month') badge = '<span class="xbadge">Save ' + money(price() * 12 - x.price) + ' a year</span>';
        else if (!x.team && gold && s.plan === 'pro' && !fresh) badge = '<span class="xbadge">' + Math.round(x.credits / CAT[x.cad === 'year' ? 'pro-year' : 'pro-month'].credits) + 'x Pro</span>';
        let body = '<div class="plan-line"><span class="plan-name">' + title + '</span><span class="plan-price"><span class="price">' + money(x.price) + '</span><span class="per">/' + per(x.cad) + '</span></span></div>';
        if (x.team) {
          body += '<div class="team-seats unlimited-grad">Unlimited seats</div><div class="dd-label">How many credits?</div><div class="credit-dd' + (S.dd === k ? ' is-open' : '') + '">' +
            '<button type="button" class="credit-dd-trigger" data-a="mpdd" data-v="' + k + '" aria-haspopup="listbox" aria-expanded="' + (S.dd === k) + '" aria-label="Credit pool size"><span class="credit-dd-left"><span class="credit-dd-value">' + num(S.pool[k]) + ' credits</span></span><i class="ph ph-caret-down credit-dd-caret" aria-hidden="true"></i></button>' +
            '<ul class="credit-dd-menu" role="listbox" aria-label="Credit pool size">' + x.pools.map((c, i) => '<li class="credit-dd-opt" role="option" data-a="mppool" data-v="' + k + ':' + c + '" aria-selected="' + (c === S.pool[k]) + '"><span>' + num(c) + ' credits</span><span class="credit-dd-pill">' + Math.round(LADDER[i] * 100) + '% off</span></li>').join('') + '</ul></div>';
        } else {
          body += '<div class="big-cred"><span class="num">' + num(x.credits) + '</span><span class="lbl">Credits</span>' + badge + '</div>';
          if (gold && s.plan !== 'gold') body += '<div class="plan-split"></div><ul class="gold-points">' + GOLD_POINTS.map((g) => '<li><i class="ph ' + g[0] + '"></i>' + g[1] + '</li>').join('') + '</ul>';
        }
        return '<div class="plan-card' + (gold ? ' plan-card--gold' : '') + '"><div class="plan-row' + (on ? ' is-selected' : '') + '" data-a="mppick" data-v="' + k + '" role="radio" aria-checked="' + on + '" tabindex="0"><span class="radio"></span><div class="plan-body">' + body + '</div></div></div>';
      };
      const sw = P.ind.length && P.team.length ? '<button type="button" class="switch-team" data-a="mpview">' + (S.mpView === 'team' ? 'Switch back to individual plans' : 'Managing a team? Switch to a Team plan') + '</button>' : '';
      const tip = fresh
        ? 'Weekly is a separate plan, so it isn’t upgraded or prorated. Your new plan starts today, running ' + fmtLong(TODAY) + ' to ' + q.renew + '. Your weekly plan runs to ' + fmtLong(endDate()) + ' and doesn’t renew. Team plans share one credit pool across unlimited seats.'
        : 'Plan changes take effect today and start a fresh plan ' + per(o.cad) + ', running ' + fmtLong(TODAY) + ' to ' + q.renew + '. New plan credits land instantly and any unused credits carry over. Team plans share one credit pool across unlimited seats.';
      const ppTitle = (fresh ? 'Get ' : o.tier === s.plan && !o.team ? 'Switch to ' : o.team ? 'Get ' : 'Upgrade to ') + o.name;
      const err = S.failed ? '<div class="pp-err"><i class="ph ph-warning-circle"></i><span>Your card was declined, so nothing was charged. Try another card, or check with your bank.</span></div>' : '';
      const payPanel = S.stripe
        ? '<div class="stripe-panel"><h2>Payment Method</h2><div class="pay-tabs"><button class="pay-tab is-active" type="button"><i class="ph ph-credit-card"></i>Credit/Debit card</button></div>' +
          '<div class="field"><label>Card details</label><div class="input placeholder"><span class="grow">1234 1234 1234 1234</span><span class="brand-icons"><img src="assets/er/visa.svg" alt="Visa" /><img src="assets/er/mastercard.svg" alt="Mastercard" /><img src="assets/er/amex.svg" alt="Amex" /><img src="assets/er/jcb.svg" alt="JCB" /></span></div></div>' +
          '<div class="row-2"><div class="field"><label>Expiration date</label><div class="input placeholder">MM / YY</div></div><div class="field"><label>CVC</label><div class="input placeholder"><span class="grow">CVC</span><img class="cvc-icon" src="assets/er/cvc1.svg" alt="" /></div></div></div>' +
          '<div class="field"><label>Country</label><button type="button" class="select">India<i class="ph ph-caret-down"></i></button></div>' +
          '<p class="disclaimer">By providing your card information, you allow PRESENTATIONS AI PTE. LTD to charge your card for future payments in accordance with their terms. Renews at ' + usd(o.price) + '/' + per(o.cad) + ' on ' + q.renew + '.</p>' +
          '<button class="pay-btn" type="button" data-a="pay">' + (S.busy === 'pay' ? 'Paying…' : 'Pay ' + money(q.due)) + '</button>' + err +
          '<div class="pay-foot"><span class="powered">Powered by <img src="assets/er/stripe.svg" alt="Stripe" /></span><span class="vsep"></span><span class="links"><a href="#" onclick="return false">Terms</a><a href="#" onclick="return false">Privacy</a></span></div></div>'
        : null;
      return '<div class="mp"><div class="modal-wrap"><button type="button" class="modal-close" data-a="close" aria-label="Close"><i class="ph-bold ph-x"></i></button><div class="modal-card">' +
        '<div class="left"><div class="left-head"><div class="head-col"><div class="head-row"><h1><span>' + (fresh ? 'Choose your new plan' : 'Manage your plan') + '</span><span class="info-tip info-tip--title" tabindex="0"><i class="ph ph-info"></i><span class="tip-bubble">' + tip + '</span></span></h1></div><p class="sub">For the Scaling Operations workspace</p></div></div>' +
        cur + opts.map(card).join('') + sw + '</div>' +
        '<div class="right"><div class="right-inner">' + (payPanel || '<div class="paddle-panel"><h2>' + ppTitle + '</h2><div class="pp-box">' +
          '<div class="pp-line"><span class="pp-plan">' + o.name + ' Plan</span><span class="pp-price"><span class="price">' + usd(o.price) + '</span></span></div>' +
          '<div class="pp-sub">' + (o.team ? 'Full pool credits unlock (' : 'Full plan credits unlock (') + num(o.credits) + ')</div>' +
          (fresh && s.store ? '<div class="pp-sub warn">Your weekly plan is billed by the App Store. Cancel it there so you’re not charged for both.</div>'
           : fresh ? '<div class="pp-sub">Your weekly plan stops renewing. It runs to ' + fmtLong(endDate()) + '.</div>'
                 : '<div class="pp-sub carry">Your ' + num(balance()) + ' unused credits carry over</div>') +
          '<div class="pp-divider"></div><div class="pp-line"><span class="pp-due">Due today:</span><span class="price">' + usd(q.due) + '</span></div></div>' +
          '<div class="pp-card-row"><i class="ph ph-credit-card"></i><span>Visa &bull;&bull;&bull;&bull; 4242</span><button type="button" class="pp-change" data-a="newcard">Change</button></div>' +
          '<label class="pp-agree"><input type="checkbox" id="consent"' + (S.consent ? ' checked' : '') + ' /><span>I agree to the Terms. Renews at <b>' + usd(o.price) + '/' + per(o.cad) + '</b> on ' + q.renew + '</span></label>' +
          '<div class="pp-actions"><button type="button" class="pp-confirm" data-a="pay"' + (S.consent ? '' : ' disabled') + '>' + (S.busy === 'pay' ? 'Confirming…' : S.failed ? 'Try again' : 'Confirm Payment') + '</button></div>' + err +
          '<div class="pay-foot"><span class="powered">Powered by <b style="color:#7a8699;font-size:14px;letter-spacing:-0.02em;">paddle</b></span><span class="vsep"></span><span class="links"><a href="#" onclick="return false">Terms</a><a href="#" onclick="return false">Privacy</a></span></div>' +
        '</div>') + '</div></div></div></div></div>';
    };

    const ov = document.getElementById('ov-mp');
    const draw = () => { ov.innerHTML = drawChange(); };
    const openChange = (pick, view) => { S.failed = false; S.mpView = view === 'team' ? 'team' : 'ind'; S.pick = pick || null; S.dd = null; S.consent = true; S.stripe = false; S.busy = null; draw(); ov.hidden = false; };
    const close = () => { ov.hidden = true; ov.innerHTML = ''; };
    const api = {
      has: (k) => !!MEMBERS[k],
      label: (k) => MEMBERS[k].label,
      balance: (k) => MEMBERS[k].balance,
      open: (k, pick, view) => { S.member = k; S.state = MEMBERS[k].path; openChange(pick, view); },
      close,
      onPaid: null,
    };
    // closing Manage your plan just closes it: no close flow, no offers
    ov.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b) { if (S.dd) { S.dd = null; return draw(); } if (e.target === ov || e.target.classList.contains('mp')) close(); return; }
      const a = b.dataset.a, v = b.dataset.v;
      if (a === 'close') return close();
      if (a === 'newcard') { S.stripe = true; S.failed = false; return draw(); }
      if (a === 'mppick') { S.pick = v; S.dd = null; return draw(); }
      if (a === 'mpview') { S.mpView = S.mpView === 'team' ? 'ind' : 'team'; S.pick = null; S.dd = null; return draw(); }
      if (a === 'mpdd') { S.dd = S.dd === v ? null : v; return draw(); }
      if (a === 'mppool') { const [k, c] = v.split(':'); S.pool[k] = Number(c); S.pick = k; S.dd = null; return draw(); }
      if (a === 'pay') {
        S.done = mpQuote(S.pick); S.failed = false; S.busy = 'pay'; draw();
        setTimeout(() => {
          S.busy = null; const q = S.done; close();
          if (api.onPaid) api.onPaid({ name: q.o.name, credits: q.o.credits, fresh: q.fresh, carry: balance(), runsTo: fmtLong(endDate()) });
        }, 900);
      }
    });
    ov.addEventListener('change', (e) => { if (e.target.id === 'consent') { S.consent = e.target.checked; draw(); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !ov.hidden) close(); });
    return api;
  })();
</script>
<script>
  /* ---------- the deck behind everything ---------- */
  const DECK = ['ed-slide-1', 'ed-slide-2', 'ed-slide-3', 'ed-canvas', 'ed-slide-5'].map((n) => 'assets/editor/' + n + '.jpg');
  const strip = document.getElementById('strip'), canvas = document.getElementById('canvas');
  let slide = 0;
  const drawStrip = () => {
    strip.innerHTML = DECK.map((src, i) =>
      '<div class="th' + (i === slide ? ' on' : '') + '" data-slide="' + i + '"><span class="n">' + (i + 1) + '</span>' +
      '<img src="' + src + '" alt="Slide ' + (i + 1) + '" /></div>').join('');
    canvas.src = DECK[slide];
    canvas.alt = 'Slide ' + (slide + 1);
  };
  drawStrip();
  strip.addEventListener('click', (e) => {
    const th = e.target.closest('[data-slide]');
    if (!th) return;
    slide = Number(th.dataset.slide);

        openCheckout(planKey, {
          kind: 'start', title: term === 'semester' ? 'Pay for one semester' : 'Start with one month',
          name: q.name + ', ' + q.label.toLowerCase(), planName: q.name, amount: q.price, credits: q.credits,
          note: q.label + ': ' + q.credits.toLocaleString('en-US') + ' credits until ' + end + '. Then ' + q.renewLabel + ' unless you cancel; we remind you on ' + remind + '.',
          feats: [['ph-star-four', q.credits.toLocaleString('en-US') + ' credits until ' + end], ['ph-arrows-clockwise', 'Then ' + q.renewLabel], ['ph-bell', 'Reminder on ' + remind + ', cancel in two clicks']],
        });
        return;
      }
      case 'notstudent': if (S.rescue && !S.rescue.done) nextStep(); else openPicker(); return;
      case 'verify':
        S.verifying = true; drawDialog();
        setTimeout(() => {
          S.verifying = false; S.studentVerified = true;
          toast('Student status verified. Student prices applied.', true);
          const cur = S.rescue && !S.rescue.done ? S.rescue.steps[S.rescue.i] : null;
          if (S.startTerm === 'semester' && cur && cur.kind === 'start') { openDg('start'); return; }
          if (cur && cur.kind === 'verify') { nextStep(); return; }
          openPicker();
        }, 1300);
        return;
      case 'sendmgr': {
        const to = document.getElementById('mgr').value;
        S.managerAsked = to;
        endRescue();
        toast('Request sent to ' + to + '. We’ll tell you the moment it’s paid.', true);
        return;
      }
      case 'paywith': S.payMethod = v; openCheckout(S.tier, null); return;
      case 'takepass':
        S.payMethod = null;
        openCheckout(null, {
          kind: 'pass', title: 'Seven Day Pass', name: 'Seven Day Pass', amount: PASS.price,
          note: 'One payment for seven days and ' + PASS.credits.toLocaleString('en-US') + ' credits on this deck. Nothing renews.',
          feats: [['ph-microsoft-powerpoint-logo', 'PowerPoint and PDF downloads for this deck'], ['ph-star-four', PASS.credits.toLocaleString('en-US') + ' credits for revisions'], ['ph-clock', 'Ends 168 hours after payment']],
        });
        return;
      case 'nopass': endRescue(); return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const pick = e.target.closest && e.target.closest('[data-pick]');
    if (pick) { e.preventDefault(); S.tier = pick.dataset.pick; drawCheckout(); }
  });

  /* ---------- proto controls ---------- */
  const proto = document.getElementById('proto');
  if (window.innerHeight < 700) proto.classList.add('shut');
  document.getElementById('proto-toggle').addEventListener('click', () => proto.classList.toggle('shut'));
  const paintProto = () => {
    proto.querySelectorAll('[data-seg]').forEach((b) => b.classList.toggle('on', b.dataset.seg === S.seg));
    proto.querySelectorAll('[data-persona]').forEach((b) => b.classList.toggle('on', b.dataset.persona === S.persona));
    proto.querySelectorAll('[data-lapsed]').forEach((b) => b.classList.toggle('on', (b.dataset.lapsed === '1') === S.lapsed));
    proto.querySelectorAll('[data-cohort]').forEach((b) => b.classList.toggle('on', b.dataset.cohort === S.cohort));
    proto.querySelectorAll('[data-member]').forEach((b) => b.classList.toggle('on', b.dataset.member === (S.member || 'free')));
  };
  proto.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.seg) { S.seg = b.dataset.seg; S.entry = S.seg === 'tier1' ? 'pro' : 'basic'; S.tier = S.entry; if (!ov.pk.hidden) drawPicker(); if (!ov.co.hidden) drawCheckout(); }
    if (b.dataset.persona) S.persona = b.dataset.persona;
    if (b.dataset.lapsed) S.lapsed = b.dataset.lapsed === '1';
    if (b.dataset.cohort) S.cohort = b.dataset.cohort;
    if (b.dataset.member) { setMember(b.dataset.member); return; }
    paintProto();
  });
  paintProto();
  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(S, {
      tier: S.seg === 'tier1' ? 'pro' : 'basic', entry: S.seg === 'tier1' ? 'pro' : 'basic', paid: null,
      dialog: null, declineView: null, choice: null, reason: null, declineAsked: false, skipped: false, abandonedAt: null, rescue: null,
      offer: null, prevOffer: null, offersSeen: [], offerAccepted: false, exitShown: false,
      passShown: false, managerAsked: false, studentVerified: true, verifying: false, item: null, payMethod: null,
    });
    document.body.classList.remove('paid');
    document.getElementById('credline').textContent = 'Credits: 160 left';
    setMember('free');
    show(null); drawLog(); drawExitPill();
    toast('Reset. Fresh free account.', false);
  });

  /* ---------- v3: the user's own plan (free, or a paid plan that opens Manage your plan) ---------- */
  const meterB = document.querySelector('.meter2 b');
  function setMember(k) {
    S.member = MP.has(k) ? k : null;
    document.body.classList.toggle('member', !!S.member);
    document.getElementById('upgrade-t').textContent = S.member === 'pro-week' ? 'Get a monthly or yearly plan' : 'Upgrade';
    const bal = S.member ? MP.balance(S.member) : 160;
    meterB.textContent = bal.toLocaleString('en-US');
    meterB.parentElement.setAttribute('aria-label', bal.toLocaleString('en-US') + ' credits left');
    // a fresh session for the new user: nothing open, no close flow state
    Object.assign(S, { paid: null, dialog: null, declineView: null, choice: null, reason: null, declineAsked: false, skipped: false, abandonedAt: null, rescue: null,
      offer: null, prevOffer: null, offersSeen: [], offerAccepted: false, exitShown: false, passShown: false, item: null, payMethod: null });
    document.body.classList.remove('paid');
    MP.close(); show(null); document.getElementById('pnote').hidden = true;
    paintProto(); drawLog(); drawExitPill();
  }

  // v3: a paid plan change from Manage your plan lands on the same success screen
  MP.onPaid = (r) => {
    S.item = { kind: 'change', planName: r.name, credits: r.credits,
      note: r.fresh
        ? 'Your new plan starts today with <b>' + r.credits.toLocaleString('en-US') + ' credits</b>. Your weekly plan stops renewing and runs to ' + r.runsTo + '.'
        : 'Your new plan starts today with <b>' + r.credits.toLocaleString('en-US') + ' credits</b>, and your ' + r.carry.toLocaleString('en-US') + ' unused credits carry over.' };
    drawWon(); show('won');
  };

  /* ---------- deep links: the flow map opens any state directly ---------- */
  (() => {
    const q = new URLSearchParams(location.search);
    if (![...q.keys()].length) return;
    // v3: ?plan=pro-week|pro-month|pro-year is a paid user. Plans or checkout open Manage your plan; nothing starts the close flow.
    if (MP.has(q.get('plan'))) {
      setMember(q.get('plan'));
      if (q.get('open') === 'plans' || q.get('open') === 'checkout') MP.open(S.member, q.get('pick'), q.get('view'));
      return;
    }
    if (q.get('seg')) S.seg = q.get('seg');
    if (q.get('student') === '1' || q.get('persona') === 'student') S.persona = 'student';
    if (q.get('lapsed') === '1') S.lapsed = true;
    if (q.get('cohort')) S.cohort = q.get('cohort');
    S.entry = S.tier = S.seg === 'tier1' ? 'pro' : 'basic';
    paintProto();
    const at = q.get('at') === 'checkout' ? 'checkout' : 'paywall';
    const go = q.get('open');
    if (go === 'plans') { openPicker(); return; }
    if (go === 'checkout') { openCheckout('pro', null); return; }
    if (!go && !q.get('reason') && !q.get('again')) return;
    if (at === 'checkout') openCheckout('pro', null);
    if (q.get('again') === '1') { S.declineAsked = true; leave(at); return; }
    leave(at);
    const reason = q.get('reason');
    if (!reason) return;
    S.choice = reason; S.reason = reason;
    S.rescue = { steps: planFor(reason), i: 0, done: false };
    runStep(0);
    for (let n = Number(q.get('step') || 0); n > 0; n--) nextStep();
    if (q.get('exit') === '1' && S.offer) fireExit();
  })();
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
