<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corner banner · 20% off saved</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#f6f7f9;color:#171717;-webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums}

  /* ── switcher, for review only ── */
  .sw{position:fixed;top:16px;left:16px;display:flex;flex-wrap:wrap;gap:6px;z-index:10;max-width:560px}
  .sw button{border:1px solid #e5e5e5;background:#fff;border-radius:6px;padding:6px 10px;font:500 12px Inter,sans-serif;cursor:pointer}
  .sw button.on{background:#171717;color:#fff;border-color:#171717}

  /* ── the banner ── */
  .cb{position:fixed;right:28px;bottom:28px;width:420px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;box-shadow:0 12px 40px -12px rgba(0,0,0,.25);overflow:hidden;z-index:9}
  .cb .x{position:absolute;top:-16px;right:-16px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #e5e5e5;display:grid;place-items:center;cursor:pointer;color:#171717;font-size:16px}
  .cb .art{height:150px;background:linear-gradient(90deg,#1b3fd6,#3b6bff 45%,#8fb3ff 70%,#1b3fd6);display:grid;place-items:center;padding:20px}
  .cb .tag{background:#fff;border-radius:10px;padding:14px 22px;display:flex;align-items:center;gap:18px;min-width:280px}
  .cb .tag i{font-size:34px;color:#0057ff}
  .cb .tag .sep{width:1px;align-self:stretch;border-left:2px dashed #dbe4ff}
  .cb .tag b{font-size:22px;font-weight:600;color:#0057ff;line-height:1.15;display:block}
  .cb .tag small{display:block;font-size:11.5px;color:#0057ff;opacity:.75;margin-top:2px}
  .cb .body{padding:22px 24px 24px;text-align:center}
  .cb h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .cb p{font-size:14px;color:#525252;line-height:1.5;margin-top:6px}
  .cb .cta{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:16px;border:0;border-radius:6px;background:#0b0f14;color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
  .cb .alt{display:block;margin-top:12px;font-size:13px;color:#525252;text-decoration:underline;text-underline-offset:3px}
  .cb .alt:hover{color:#171717}

  /* variant hooks */
  .cb[data-v="pass"] .art{background:linear-gradient(90deg,#0A1925,#1c3550 50%,#0A1925)}
  .cb[data-v="pass"] .tag b,.cb[data-v="pass"] .tag i,.cb[data-v="pass"] .tag small{color:#0A1925}
  .cb[data-v="pass"] .tag .sep{border-color:#dfe3e8}
</style>
</head>
<body>

<div class="sw">
  <button class="on" data-set="saved">1 Held for you</button>
  <button data-set="clock">2 Clock</button>
  <button data-set="deck">3 This deck</button>
  <button data-set="pass">4 Pass first</button>
  <button data-set="short">5 Shortest</button>
  <button data-set="plain">6 Plain</button>
  <button data-set="buys">7 What it buys</button>
  <button data-set="loss">8 Loss</button>
  <button data-set="credits">9 Credits</button>
  <button data-set="deckpptx">10 Deck .pptx</button>
  <button data-set="honest">11 Honest</button>
  <button data-set="passhero">12 Pass hero</button>
  <button data-set="remind">13 Reminder</button>
  <button data-set="question">14 Question</button>
</div>

<!-- ── Banner skeleton ── -->
<aside class="cb" data-v="saved" role="dialog" aria-label="Offer">
  <button class="x" aria-label="Close"><i class="ph ph-x"></i></button>

  <div class="art">
    <div class="tag">
      <i class="ph-fill ph-gift" data-el="icon"></i>
      <span class="sep"></span>
      <span><b data-el="tagTitle">20% off<br>Pro &amp; Gold</b><small data-el="tagSub" hidden></small></span>
    </div>
  </div>

  <div class="body">
    <h3 data-el="title">We saved your 20% off</h3>
    <p data-el="sub">It stays on your account for 24 hours. After that, list price.</p>
    <button class="cta" data-el="cta">Claim 20% off</button>
    <a class="alt" href="#" data-el="alt">Or take a 7-day pass for $19.99</a>
  </div>
</aside>

<script>
  // Copy variants. Swap by setting data-v on .cb and filling data-el slots.
  const V = {
    saved: { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'We saved your 20% off', sub:'It stays on your account for 24 hours. After that, list price.', cta:'Claim 20% off', alt:'Or take a 7-day pass for $19.99' },
    clock: { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'expires in <span data-t>23:59:41</span>', title:'Your discount is still here', sub:'One click and it applies at checkout. Nothing to enter.', cta:'Use my 20% off', alt:'' },
    deck:  { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Finish this deck on Pro, 20% off', sub:'Brand Kit, research and analytics on every slide, from today.', cta:'Upgrade with 20% off', alt:'Not ready? 7-day pass, $19.99' },
    pass:  { v:'pass',  icon:'ph-fill ph-ticket', tagTitle:'Presentation Pass', tagSub:'7 days · 700 credits', title:'Not ready for a plan? Fair.', sub:'Take a week of every Pro feature for $19.99. Your 20% off waits if you change your mind.', cta:'Get the pass for $19.99', alt:'' },
    short: { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'20% off, still yours', sub:'Pro and Gold. Ends tomorrow.', cta:'Claim it', alt:'' },
    plain:    { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Still thinking it over?', sub:'Your 20% off is safe until tomorrow. Take your time, not too much.', cta:'Apply 20% off', alt:'7-day pass instead, $19.99' },
    buys:     { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Pro for $16 a month, not $20', sub:'Brand Kit, research, analytics, 50 decks a year. Offer ends in 24 hours.', cta:'Get Pro at 20% off', alt:'See Gold at 20% off' },
    loss:     { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Don\'t pay list price tomorrow', sub:'Today: Pro $192 a year. Tomorrow: $240. Same plan.', cta:'Lock in $192', alt:'Or a 7-day pass, $19.99' },
    credits:  { v:'saved', icon:'ph-fill ph-sparkle', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Your credits expire in 4 days', sub:'Upgrade now with 20% off and 5,000 fresh credits land today.', cta:'Upgrade with 20% off', alt:'Not now, try a pass' },
    deckpptx: { v:'saved', icon:'ph-fill ph-microsoft-powerpoint-logo', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'That deck deserves a real .pptx', sub:'Export it editable, on brand, with 20% off Pro. Offer ends tomorrow.', cta:'Export with Pro, 20% off', alt:'7-day pass, $19.99' },
    honest:   { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'We\'d rather you paid less', sub:'20% off Pro and Gold, held for 24 hours. Then it goes back up.', cta:'Take the 20%', alt:'Pass instead' },
    passhero: { v:'pass',  icon:'ph-fill ph-ticket', tagTitle:'Presentation Pass', tagSub:'7 days · 700 credits', title:'Try everything for a week', sub:'$19.99, no subscription, 7 decks\' worth of credits. Your 20% off plan discount stays saved.', cta:'Get the pass', alt:'Use my 20% off instead' },
    remind:   { v:'saved', icon:'ph-fill ph-bell-ringing', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Quick reminder', sub:'The 20% off you saw is still active. It expires tomorrow at this time.', cta:'Claim before it ends', alt:'Dismiss' },
    question: { v:'saved', icon:'ph-fill ph-gift', tagTitle:'20% off<br>Pro &amp; Gold', tagSub:'', title:'Was it the price?', sub:'Then this helps: 20% off Pro and Gold, yours until tomorrow.', cta:'Yes, apply it', alt:'No, show me the pass' },
  };
  const cb = document.querySelector('.cb');
  const el = (k) => cb.querySelector(`[data-el="${k}"]`);
  function apply(key){
    const d = V[key];
    cb.dataset.v = d.v;
    el('icon').className = d.icon;
    el('tagTitle').innerHTML = d.tagTitle;
    el('tagSub').innerHTML = d.tagSub; el('tagSub').hidden = !d.tagSub;
    el('title').textContent = d.title;
    el('sub').textContent = d.sub;
    el('cta').textContent = d.cta;
    el('alt').textContent = d.alt; el('alt').hidden = !d.alt;
    document.querySelectorAll('.sw button').forEach(b => b.classList.toggle('on', b.dataset.set === key));
  }
  document.querySelectorAll('.sw button').forEach(b => b.addEventListener('click', () => apply(b.dataset.set)));
  cb.querySelector('.x').addEventListener('click', () => { cb.style.display = 'none'; });

  // Countdown for the clock variant: 24h from first dismissal (stored locally)
  const key = 'offer20_until';
  let until = Number(localStorage.getItem(key)) || 0;
  if (!until) { until = Date.now() + 24*3600*1000; localStorage.setItem(key, String(until)); }
  setInterval(() => {
    const t = cb.querySelector('[data-t]'); if (!t) return;
    const s = Math.max(0, Math.floor((until - Date.now())/1000));
    const h = String(Math.floor(s/3600)).padStart(2,'0'), m = String(Math.floor(s%3600/60)).padStart(2,'0'), x = String(s%60).padStart(2,'0');
    t.textContent = `${h}:${m}:${x}`;
  }, 1000);
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
</script>
</body>
</html>
