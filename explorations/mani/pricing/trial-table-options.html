<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trial table · 4 options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; padding: 48px 24px 120px; }
  .page { width: 1042px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: #666; margin-bottom: 40px; max-width: 700px; }
  .variant { margin-bottom: 64px; }
  .v-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5f6b76; margin-bottom: 12px; }
  .backdrop { background: rgba(10,25,37,0.45); border-radius: 8px; padding: 32px; display: flex; justify-content: center; }

  .dp-stack { position: relative; }
  .dp-close { position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid rgba(10,25,37,0.12); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(10,25,37,0.15); z-index: 2; font-size: 14px; color: #171717; }
  .dp-box { position: relative; width: 978px; height: 620px; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09), 0 24px 40px -16px rgba(10,25,37,0.18); display: grid; grid-template-rows: 1fr 58px; }
  .dp-main { padding: 22px 30px 6px; overflow: auto; }
  .tb-title { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 14px; }

  .dp-footer { border-top: 1px solid rgba(10,25,37,0.08); display: flex; align-items: center; gap: 34px; padding: 0 30px; overflow: hidden; }
  .dp-footer .loved { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #171717; white-space: nowrap; }
  .dp-footer .loved i { color: #e02d2d; font-size: 15px; }
  .sp-wrap { position: relative; overflow: hidden; flex: 1; height: 100%; display: flex; align-items: center; }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: flex; align-items: center; gap: 32px; width: max-content; animation: sp-marquee 40s linear infinite; }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 26px; width: auto; object-fit: contain; }
  .sp-fade { pointer-events: none; position: absolute; top: 0; bottom: 0; width: 72px; }
  .sp-fade--l { left: 0; background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; background: linear-gradient(to left, #fff, rgba(255,255,255,0)); }

  /* shared table */
  .tb { width: 100%; border-collapse: separate; border-spacing: 0; }
  .tb th, .tb td { padding: 7px 12px; font-size: 13px; text-align: center; vertical-align: middle; }
  .tb td:first-child, .tb th:first-child { text-align: left; padding-left: 0; }
  .tb td:first-child { font-weight: 500; color: #171717; white-space: nowrap; }
  .tb td:first-child i { font-size: 15px; margin-right: 9px; vertical-align: -2px; color: #5f6b76; }
  .tb tbody tr + tr td { border-top: 1px solid rgba(10,25,37,0.06); }
  .tb .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tb .lock { color: #9aa4ad; font-size: 12px; white-space: nowrap; }
  .tb .lock i { font-size: 13px; vertical-align: -2px; margin-right: 4px; }
  .tb .yes { color: #0a8a3a; font-size: 15px; }
  .tb .no { color: #c2c9cf; font-size: 14px; }
  .tb td.hi, .tb th.hi { background: #fdf3da; }
  .tb thead th.hi { border-radius: 10px 10px 0 0; }
  .tb tbody tr:last-child td.hi { border-radius: 0 0 10px 10px; }
  .tb-head { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 2px 6px; }
  .tb-head .p-name { font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .tb-head .p-price { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tb-head .p-price s { font-weight: 400; opacity: 0.45; font-size: 13px; margin-right: 5px; }
  .tb-head .p-per { font-size: 10.5px; color: #6b6b6b; font-weight: 400; }
  .tb-head .btn { width: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-family: inherit; font-size: 12px; font-weight: 500; height: 32px; border-radius: 7px; cursor: pointer; background: #fff; border: 1px solid #171717; color: #171717; }
  .btn:hover { background: #f5f5f5; }
  .btn--gold { border: 0; background: linear-gradient(90deg,#dcb05e 0%,#ca9e4c 30%,#c39643 65%,#b8893a 100%); color: #fff; }
  .btn--gold:hover { filter: brightness(1.05); }
  .btn--dark { border: 0; background: #171717; color: #fff; }
  .btn--dark:hover { background: #000; }
  .b-try { margin-top: 2px; background: none; border: 0; color: #0055ED; font-size: 11.5px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .b-try:hover { text-decoration: underline; }
  .tb-note { font-size: 11.5px; color: #6b6b6b; margin-top: 10px; line-height: 16px; }

  /* 03 grouped sections */
  .tb .sec td { border-top: 0; padding-top: 14px; padding-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a949d; }
  .tb .sec td i { color: #8a949d; }
  .trial-cta-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 12px; border: 1px dashed rgba(10,25,37,0.22); border-radius: 10px; padding: 10px 16px; }
  .trial-cta-row .t-txt { font-size: 13px; color: #444; }
  .trial-cta-row .t-txt b { font-weight: 600; }
  .trial-cta-row .btn { width: auto; padding: 0 18px; height: 34px; }

  /* 04 raised cards */
  .tb--cards { border-spacing: 10px 0; margin-left: -10px; width: calc(100% + 20px); }
  .tb--cards th.card-col, .tb--cards td.card-col { background: #fafbfc; border-left: 1px solid rgba(10,25,37,0.08); border-right: 1px solid rgba(10,25,37,0.08); }
  .tb--cards thead th.card-col { border-top: 1px solid rgba(10,25,37,0.08); border-radius: 12px 12px 0 0; }
  .tb--cards tbody tr:last-child td.card-col { border-bottom: 1px solid rgba(10,25,37,0.08); border-radius: 0 0 12px 12px; }
  .tb--cards th.card-col.gold, .tb--cards td.card-col.gold { background: #fdf3da; border-color: rgba(201,147,42,0.35); }
  .tb--cards tbody tr + tr td.card-col { border-top-color: rgba(10,25,37,0.05); }
</style>
</head>
<body>
<div class="page">
  <h1>Trial comparison table · 4 options</h1>
  <p class="page-sub">Pick 09 from round 5, four ways. All: buy now carries the 20% instant discount, trial has no offer, export to PPT locked in trial, trial credits 500 / 1,000 / 1,200, full credits join the workspace on upgrade.</p>
  <div id="variants"></div>
</div>

<script>
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  const yes = '<i class="ph-fill ph-check-circle yes"></i>';
  const no = '<i class="ph ph-x no"></i>';
  const lock = '<span class="lock"><i class="ph ph-lock-simple"></i>Unlocks on upgrade</span>';
  const goldIco = '<i class="ph-fill ph-crown" style="color:#c9932a"></i>';

  const headCell = (plan, base, off, opts) => {
    const o = opts || {};
    return '<th class="' + (o.cls || '') + '"><div class="tb-head">' +
      '<span class="p-name">' + (o.gold ? goldIco : '') + plan + '</span>' +
      '<span class="p-price"><s>$' + base + '</s>$' + off + '/mo<span class="p-per"> when you buy today</span></span>' +
      '<button type="button" class="btn ' + (o.gold ? 'btn--gold' : 'btn--dark') + '">Buy now and save 20%</button>' +
      (o.tryBtn
        ? '<button type="button" class="btn" style="margin-top:2px">Try free for 7 days</button><span style="font-size:10px;color:#9aa4ad">no discount, full price later</span>'
        : o.noTry ? '' : '<button type="button" class="b-try">or try free for 7 days, no discount</button>') +
      '</div></th>';
  };
  const r = (icon, name, a, b, c, cls) => {
    const cl = cls || ['', 'hi', ''];
    return '<tr><td><i class="ph ' + icon + '"></i>' + name + '</td>' +
      '<td class="' + cl[0] + '">' + a + '</td><td class="' + cl[1] + '">' + b + '</td><td class="' + cl[2] + '">' + c + '</td></tr>';
  };
  const NOTE = '<div class="tb-note">Your trial comes with its own credits for 7 days. Upgrade any time and your plan\'s full credits land in your workspace, and Export to PPT unlocks. The 20% discount applies only when you buy today.</div>';

  const bodyRows = (cls) =>
    r('ph-star-four', 'Credits during your trial', '<span class="num">500</span>', '<span class="num">1,000</span>', '<span class="num">1,200</span>', cls) +
    r('ph-stack-plus', 'Credits when you upgrade', '<span class="num">5,000</span>', '<span class="num">25,000</span>', '<span class="num">30,000</span>', cls) +
    r('ph-export', 'Export to PPT', lock, lock, lock, cls) +
    r('ph-swatches', 'Brand kit', yes, yes, yes, cls) +
    r('ph-book-open', 'Shared knowledge base', no, yes, yes, cls) +
    r('ph-users-three', 'Collaborations', no, no, yes, cls) +
    r('ph-sparkle', 'Ultra/Pro AI models', yes, yes, yes, cls) +
    r('ph-chart-bar', 'Analytics', yes, yes, yes, cls);

  const VARIANTS = [
    { label: '01 · Pick: gold highlight, trial as text link', html:
      '<div class="tb-title">Start your 7-day free trial today</div>' +
      '<table class="tb"><thead><tr><th></th>' +
      headCell('Pro', 20, 16) + headCell('Gold', 50, 40, { gold: true, cls: 'hi' }) + headCell('Team', 60, 48) +
      '</tr></thead><tbody>' + bodyRows() + '</tbody></table>' + NOTE },

    { label: '02 · Equal buttons: buy + trial both full CTAs', html:
      '<div class="tb-title">Start your 7-day free trial today</div>' +
      '<table class="tb"><thead><tr><th></th>' +
      headCell('Pro', 20, 16, { tryBtn: true }) + headCell('Gold', 50, 40, { gold: true, cls: 'hi', tryBtn: true }) + headCell('Team', 60, 48, { tryBtn: true }) +
      '</tr></thead><tbody>' + bodyRows() + '</tbody></table>' + NOTE },

    { label: '03 · Grouped rows: trial section vs full plan section', html:
      '<div class="tb-title">Start your 7-day free trial today</div>' +
      '<table class="tb"><thead><tr><th></th>' +
      headCell('Pro', 20, 16, { noTry: true }) + headCell('Gold', 50, 40, { gold: true, cls: 'hi', noTry: true }) + headCell('Team', 60, 48, { noTry: true }) +
      '</tr></thead><tbody>' +
      '<tr class="sec"><td><i class="ph ph-calendar-check"></i>During your 7-day trial</td><td></td><td class="hi"></td><td></td></tr>' +
      r('ph-star-four', 'Credits to use in 7 days', '<span class="num">500</span>', '<span class="num">1,000</span>', '<span class="num">1,200</span>') +
      r('ph-export', 'Export to PPT', lock, lock, lock) +
      '<tr class="sec"><td><i class="ph ph-rocket-launch"></i>When you upgrade</td><td></td><td class="hi"></td><td></td></tr>' +
      r('ph-stack-plus', 'Full credits in your workspace', '<span class="num">5,000</span>', '<span class="num">25,000</span>', '<span class="num">30,000</span>') +
      r('ph-export', 'Export to PPT', yes, yes, yes) +
      r('ph-book-open', 'Shared knowledge base', no, yes, yes) +
      r('ph-users-three', 'Collaborations', no, no, yes) +
      r('ph-sparkle', 'Ultra/Pro AI models', yes, yes, yes) +
      '</tbody></table>' +
      '<div class="trial-cta-row"><span class="t-txt"><b>Want to test the waters first?</b> Try any plan free for 7 days. Trials renew at full price, without the 20% discount.</span>' +
      '<button type="button" class="btn">Start free trial</button></div>' },

    { label: '04 · Raised plan cards, all three framed', html:
      '<div class="tb-title">Start your 7-day free trial today</div>' +
      '<table class="tb tb--cards"><thead><tr><th></th>' +
      headCell('Pro', 20, 16, { cls: 'card-col' }) + headCell('Gold', 50, 40, { gold: true, cls: 'card-col gold' }) + headCell('Team', 60, 48, { cls: 'card-col' }) +
      '</tr></thead><tbody>' + bodyRows(['card-col', 'card-col gold', 'card-col']) + '</tbody></table>' + NOTE },
  ];

  const track = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');

  document.getElementById('variants').innerHTML = VARIANTS.map((v) =>
    '<div class="variant"><div class="v-label">' + v.label + '</div>' +
    '<div class="backdrop"><div class="dp-stack">' +
    '<button type="button" class="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>' +
    '<div class="dp-box"><div class="dp-main">' + v.html + '</div>' +
    '<div class="dp-footer"><span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>' +
    '<span class="sp-wrap"><span class="sp-track">' + track + '</span>' +
    '<span class="sp-fade sp-fade--l"></span><span class="sp-fade sp-fade--r"></span></span></div>' +
    '</div></div></div></div>'
  ).join('');
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
