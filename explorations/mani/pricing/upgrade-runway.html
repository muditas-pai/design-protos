<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upgrade, one price then all plans</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  /* Upgrade: the button opens one price (Pro), and "Compare all plans" grows the same box into
     the plan picker. One shell throughout, a customer quote on the left and the logo strip along
     the foot, so the box never reloads, it only resizes. Light only. */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #171717;
    --ink2: #525252;
    --ink3: #737373;
    --line: #e5e5e5;
    --line2: #ececec;
    --soft: #fafbfc;
    --blue: #005EFF;
    --blue-soft: #e8f0fe;
    --halo: #e6efff;
    --quote-bg: #f4f7fd;
    --gold: #C08E2A;
    --gold-line: #e7d6ab;
    --gold-bg: linear-gradient(180deg, #fffdf6 0%, #fdf5e4 100%);
  }
  body { font-family: 'Inter', sans-serif; background: #e5e7eb url(assets/checkout/editor-bg.jpg) center top / cover no-repeat; color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* the app behind the modal, design context only */
  .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 20px; }
  .credits { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,0.86); box-shadow: 0 0 0 1px rgba(10,25,37,0.07); font-size: 12.5px; font-weight: 500; color: #404040; }
  .credits i { font-size: 13px; color: var(--blue); }
  .up-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: 600 12.5px 'Inter', sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(10,25,37,0.2); transition: background .15s ease, transform .12s ease; }
  .up-btn:hover { background: #0052e0; }
  .up-btn:active { transform: scale(0.97); }

  /* the modal: scrim fades, the box rises and settles */
  .scrim { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 28px; overflow-y: auto; background: rgba(10,25,37,0.5); animation: sc-in .25s ease backwards; }
  .scrim[hidden] { display: none; }
  @keyframes sc-in { from { opacity: 0; } }
  @keyframes box-in { from { opacity: 0; transform: translateY(16px) scale(0.97); } }
  .wrap { position: relative; margin: auto; animation: box-in .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .box { position: relative; width: 1060px; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 24px 44px -16px rgba(10,25,37,0.32); transition: width .52s cubic-bezier(.32,.72,0,1); }
  .x { position: absolute; top: 0; left: calc(100% + 10px); width: 30px; height: 30px; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-size: 15px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(11,15,20,0.09), 0 4px 12px rgba(10,25,37,0.12); animation: sc-in .3s .15s ease backwards; }
  .x:hover { background: #f0f2f5; }

  .row { display: flex; align-items: stretch; }

  /* left: one customer, in their words. It changes with the view, so the proof matches the plan. */
  .pane-l { flex: none; width: 396px; display: flex; flex-direction: column; padding: 38px 36px 32px; background: var(--quote-bg); border-right: 1px solid #e6ecf8; }
  .quote { font-family: 'Source Serif 4', Georgia, serif; font-size: 25px; font-weight: 400; line-height: 1.34; letter-spacing: -0.005em; color: #11203a; }
  .who { margin-top: 26px; display: flex; align-items: center; gap: 14px; }
  .who .av { width: 58px; height: 58px; border-radius: 999px; flex: none; background: #e8eefb center / cover no-repeat; box-shadow: 0 0 0 1px rgba(17,32,58,0.08); }
  .who .nm { font-size: 14.5px; font-weight: 600; color: #11203a; }
  .who .rl { margin-top: 3px; font-size: 12.5px; color: #55617a; }
  .who .mb { margin-top: 2px; font-size: 12.5px; color: #8491ab; }
  /* the quote swaps without the pane moving */
  .q-swap { animation: q-in .42s cubic-bezier(.2,.8,.2,1); }
  @keyframes q-in { from { opacity: 0; transform: translateY(8px); } }
  .trust { margin-top: auto; padding-top: 32px; display: flex; gap: 12px; }
  .trust div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px 14px; border: 1px solid #e2e9f6; border-radius: 8px; background: rgba(255,255,255,0.7); font-size: 11.5px; font-weight: 500; color: #55617a; }
  .trust img { height: 40px; opacity: 0.85; }

  /* right: the views, the box resizes between them */
  .pane-r { flex: 1 1 auto; min-width: 0; }
  .views { position: relative; min-height: 520px; height: 0; transition: height .52s cubic-bezier(.32,.72,0,1); }
  .view { position: absolute; top: 0; left: 0; right: 0; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .view.is-on { opacity: 1; pointer-events: auto; transition: opacity .3s ease .14s; }

  .head { text-align: center; padding: 34px 36px 0; }
  .head .t { font-size: 25px; font-weight: 500; letter-spacing: -0.016em; }
  .seg { display: inline-flex; gap: 2px; margin-top: 16px; padding: 3px; border-radius: 8px; background: #f1f3f6; }
  .seg button { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 18px; border: 0; border-radius: 6px; background: transparent; font: 500 13px 'Inter', sans-serif; color: var(--ink2); cursor: pointer; transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
  .seg button i { font-size: 15px; }
  .seg button:hover:not(.is-on) { color: var(--ink); }
  .seg button.is-on { background: var(--ink); color: #fff; box-shadow: 0 1px 2px rgba(10,25,37,0.2); }

  /* plan cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 26px 36px 34px; align-items: stretch; }
  .pc { position: relative; display: flex; flex-direction: column; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: #fff; transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
  .pc:hover { border-color: #cfd6e0; box-shadow: 0 4px 16px -6px rgba(10,25,37,0.16); transform: translateY(-2px); }
  .pc.gold { border-color: var(--gold-line); background: var(--gold-bg); }
  .pc.gold:hover { border-color: #d8c08a; box-shadow: 0 4px 18px -6px rgba(192,142,42,0.3); }
  .pc .tag { position: absolute; top: -10px; right: 18px; padding: 3px 10px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 2px 6px rgba(0,94,255,0.3); }
  .pc .nm { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
  .pc .nm i { font-size: 19px; color: var(--ink3); }
  .pc.gold .nm i { color: var(--gold); }
  .pc .desc { margin-top: 8px; min-height: 40px; font-size: 13.5px; line-height: 1.45; color: var(--ink2); }
  .pc .amt { margin-top: 20px; display: flex; align-items: baseline; gap: 10px; }
  .pc .amt b { font-size: 40px; font-weight: 500; line-height: 1; letter-spacing: -0.028em; }
  .pc .amt span { font-size: 12.5px; line-height: 1.35; color: var(--ink2); }
  .pc .btn { margin-top: 18px; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font: 600 14px 'Inter', sans-serif; cursor: pointer; transition: filter .15s ease, transform .12s ease, background .15s ease, box-shadow .2s ease; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(0.985); }
  .btn--out { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #d4d4d4; }
  .btn--out:hover { filter: none; background: var(--soft); box-shadow: inset 0 0 0 1px #a3a3a3; }
  .btn--gold { background: linear-gradient(100deg, #E8C070 0%, #D8AA48 48%, #C08E2A 100%); box-shadow: 0 1px 2px rgba(146,105,24,0.35); }
  .btn--dark { background: var(--ink); }
  .btn--dark:hover { filter: none; background: #000; }

  /* credits sit above the feature list, the number carries the line */
  .cred { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .cred > i { font-size: 18px; color: var(--ink); }
  .cred b { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
  .cred span { font-size: 14px; color: var(--ink2); }
  .cred .x5 { margin-left: 2px; padding: 2px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 11.5px; font-weight: 600; }
  .feats { list-style: none; margin-top: 16px; display: flex; flex-direction: column; gap: 13px; }
  .feats li { display: flex; align-items: center; gap: 11px; font-size: 14px; line-height: 1.35; color: #333; }
  .feats li i { font-size: 17px; color: var(--ink3); flex: none; }
  .feats .lead { font-weight: 500; color: var(--ink); }
  .feats .lead i { color: var(--blue); }
  .pc.gold .feats .lead i { color: var(--gold); }
  .view.is-on .pc { animation: pc-in .45s cubic-bezier(.22,1,.36,1) backwards; }
  .view.is-on .pc:nth-child(1) { animation-delay: .14s; }
  .view.is-on .pc:nth-child(2) { animation-delay: .2s; }
  @keyframes pc-in { from { opacity: 0; transform: translateY(10px); } }

  /* team: one card, split so the price side stays quiet and the value side does the talking */
  .team-wrap { padding: 26px 36px 34px; }
  .tc { display: grid; grid-template-columns: 340px 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tc-l { padding: 24px; border-right: 1px solid var(--line2); }
  .tc .nm { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
  .tc .nm i { font-size: 19px; color: var(--ink3); }
  .tc-r { padding: 24px; background: linear-gradient(180deg, #fbfcfe 0%, #f7f9fc 100%); }
  .tc .pill { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 3px 10px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 11.5px; font-weight: 600; }
  .tc .desc { margin-top: 12px; font-size: 13.5px; line-height: 1.45; color: var(--ink2); }
  .tc .amt { margin-top: 20px; }
  .tc .amt b { font-size: 40px; font-weight: 500; line-height: 1; letter-spacing: -0.028em; }
  .tc .amt span { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink2); }
  .tc .btn { margin-top: 18px; }
  .saves { margin-top: 24px; }
  .saves h3 { font-size: 15px; font-weight: 500; }
  .saves .g { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .saves .s { padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
  .saves .s .k { font-size: 13px; color: var(--ink2); }
  .saves .s .v { margin-top: 8px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
  .saves .s .u { margin-top: 3px; font-size: 12.5px; color: var(--ink2); }
  .saves .s .n { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line2); font-size: 11.5px; color: var(--ink3); }
  .view.is-on .saves .s { animation: pc-in .45s cubic-bezier(.22,1,.36,1) backwards; }
  .view.is-on .saves .s:nth-child(1) { animation-delay: .24s; }
  .view.is-on .saves .s:nth-child(2) { animation-delay: .3s; }
  .view.is-on .saves .s:nth-child(3) { animation-delay: .36s; }

  /* view one: a single price, no billing switch */
  .one { padding: 38px 40px 34px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 11.5px; font-weight: 600; }
  .eyebrow i { font-size: 12px; }
  .h1 { margin-top: 14px; font-size: 34px; font-weight: 500; letter-spacing: -0.022em; line-height: 1.12; }
  .h1 .win { background: linear-gradient(96deg, #00225C 0%, #003C9E 24%, #0055ED 50%, #1C6BF3 78%, #5990FC 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin-top: 10px; font-size: 14.5px; line-height: 1.5; color: var(--ink2); }
  .one-grid { margin-top: 24px; display: grid; grid-template-columns: 1fr 282px; gap: 32px; align-items: start; }
  .pts { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .pts li { display: flex; align-items: flex-start; gap: 11px; font-size: 14px; line-height: 1.45; }
  .pts li i { font-size: 17px; color: var(--blue); flex: none; margin-top: 1px; }
  .pts li b { font-weight: 500; }
  .pts .chip { display: inline-block; margin-left: 7px; padding: 1px 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 11px; font-weight: 500; color: var(--ink2); }
  .view.is-on .pts li { animation: pc-in .4s cubic-bezier(.22,1,.36,1) backwards; }
  .pts li:nth-child(1) { animation-delay: .18s; } .pts li:nth-child(2) { animation-delay: .23s; }
  .pts li:nth-child(3) { animation-delay: .28s; } .pts li:nth-child(4) { animation-delay: .33s; }
  .pts li:nth-child(5) { animation-delay: .38s; } .pts li:nth-child(6) { animation-delay: .43s; }
  .pts li:nth-child(7) { animation-delay: .48s; }
  .pcard { padding: 20px; border: 1px solid var(--blue); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--blue), 0 0 0 3px var(--halo); }
  .pcard .nm { font-size: 17px; font-weight: 500; }
  .pcard .amt { margin-top: 14px; display: flex; align-items: baseline; gap: 9px; }
  .pcard .amt b { font-size: 38px; font-weight: 500; line-height: 1; letter-spacing: -0.028em; }
  .pcard .amt span { font-size: 12.5px; line-height: 1.35; color: var(--ink2); }
  .pcard .cr { display: inline-flex; align-items: center; gap: 5px; margin-top: 16px; padding: 4px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 500; }
  .pcard .btn { margin-top: 16px; }
  .fine { margin-top: 12px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 7px; font-size: 12.5px; color: var(--ink2); }
  .fine .dot { color: #b8bec7; }
  .lnk { border: 0; background: none; padding: 0; font: 500 12.5px 'Inter', sans-serif; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .lnk:hover { color: var(--blue); }
  .back { padding: 0 36px 28px; text-align: center; }

  /* the logo strip closes the box, full width */
  .band { display: flex; align-items: center; gap: 24px; padding: 16px 28px; border-top: 1px solid var(--line2); background: #fff; }
  .band .loved { display: inline-flex; align-items: center; gap: 9px; flex: none; font-size: 14px; font-weight: 500; color: var(--ink); }
  .band .loved img { height: 17px; }
  .sp-wrap { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track { display: inline-flex; align-items: center; gap: 56px; padding-right: 56px; animation: sp-marquee 56s linear infinite; }
  .band:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 32px; width: auto; max-width: 140px; object-fit: contain; opacity: 0.92; }

  /* checkout opens over this screen in a frame, no page change */
  .co { position: fixed; inset: 0; z-index: 50; display: none; }
  .co.is-open { display: block; }
  .co iframe { width: 100%; height: 100%; border: 0; background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    .scrim, .wrap, .x, .q-swap { animation: none; }
    .sp-track { animation-duration: 0s; animation-play-state: paused; }
    .box, .views, .view { transition: none; }
    .view.is-on .pc, .view.is-on .pts li, .view.is-on .saves .s { animation: none; }
  }
  @media (max-width: 1360px) { .box { max-width: calc(100vw - 56px); } }
  @media (max-width: 1000px) {
    .row { flex-direction: column; }
    .pane-l { width: 100%; border-right: 0; border-bottom: 1px solid #e6ecf8; padding: 26px 22px; }
    .trust { padding-top: 22px; }
    .cards, .saves .g, .one-grid { grid-template-columns: 1fr; }
    .tc { grid-template-columns: 1fr; }
    .tc-l { border-right: 0; border-bottom: 1px solid var(--line2); }
    .band { flex-direction: column; gap: 12px; }
    .x { left: auto; right: 0; top: -40px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <span class="credits"><i class="ph-fill ph-star-four"></i>120 credits left</span>
  <button type="button" class="up-btn" id="open"><i class="ph ph-arrow-circle-up"></i>Upgrade</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="wrap">
    <div class="box" id="box">
      <div class="row">
        <div class="pane-l">
          <div id="quote"></div>
          <div class="trust">
            <div><img src="assets/checkout/badge-gdpr.svg" alt="" />GDPR compliant</div>
            <div><img src="assets/checkout/badge-soc2.svg" alt="" />SOC 2 Type II</div>
          </div>
        </div>
        <div class="pane-r">
          <div class="views" id="views">
            <div class="view is-on" id="v-one"></div>
            <div class="view" id="v-all"></div>
            <div class="view" id="v-team"></div>
          </div>
        </div>
      </div>
      <div class="band">
        <span class="loved"><img src="assets/checkout/badge-heart.svg" alt="" />Loved by 12M+ presenters at</span>
        <span class="sp-wrap"><span class="sp-track" id="track"></span></span>
      </div>
    </div>
    <button type="button" class="x" id="close" aria-label="Close"><i class="ph ph-x"></i></button>
  </div>
</div>

<div class="co" id="co"><iframe id="co-frame" title="Checkout"></iframe></div>

<script>
  // Upgrade: one price first, "Compare all plans" grows the same box into the picker.
  // ?view=one|all|team opens on that view.
  const q = new URLSearchParams(location.search);

  const PRO = { key: 'pro', name: 'Pro', icon: 'ph-rocket-launch', price: 20, credits: '5,000',
    desc: 'Everything you need for pro presentations',
    feats: [['ph-sparkle', 'Advanced AI models'], ['ph-paint-brush-broad', 'Brand Kit'], ['ph-strategy', 'Research and planning'], ['ph-chart-bar', 'Analytics']] };
  const GOLD = { key: 'gold', name: 'Gold', icon: 'ph-sketch-logo', price: 50, credits: '25,000', x: '5x Pro', tag: 'Best for you',
    desc: 'For high stakes, high volume presentation work', lead: 'Everything in Pro, plus',
    feats: [['ph-sparkle', 'Frontier AI models'], ['ph-paint-brush-broad', 'Advanced brand controls'], ['ph-book-open', 'Shared project knowledge'], ['ph-gauge', 'Priority AI generation']] };
  const TEAM = { key: 'team', name: 'Team', icon: 'ph-users-three', price: 60, credits: '30,000',
    desc: 'One workspace for everyone who creates presentations',
    feats: [['ph-users-three', 'Unlimited collaborators'], ['ph-paint-brush-broad', 'Shared Brand Kit'], ['ph-book-open', 'Shared project knowledge'], ['ph-sparkle', 'Frontier AI models and agents'], ['ph-chart-bar', 'Team analytics'], ['ph-headset', 'Priority support']] };

  // the quote changes with the view, so the proof matches the plan on screen
  const QUOTES = {
    solo: { t: 'I exported our board deck to PowerPoint and didn’t have to fix any formatting.', n: 'Justus Lang', r: 'VP Strategy • Fortune 500 Tech', m: 'Pro Annual member', av: 'assets/testimonials/team-desmond.png' },
    team: { t: 'Product, marketing and sales now work on the same presentation. No more versions floating around email or Slack.', n: 'Elena', r: 'Head of Enablement • Fintech Unicorn', m: 'Team Annual member', av: 'assets/testimonials/team-elena.png' },
  };
  const quoteBox = document.getElementById('quote');
  let curQuote = '';
  const setQuote = (k) => {
    if (k === curQuote) return;
    curQuote = k;
    const c = QUOTES[k];
    quoteBox.innerHTML = '<div class="q-swap"><div class="quote">“' + c.t + '”</div>' +
      '<div class="who"><span class="av" style="background-image:url(' + c.av + ')"></span>' +
      '<span><span class="nm">' + c.n + '</span><div class="rl">' + c.r + '</div><div class="mb">' + c.m + '</div></span></div></div>';
  };

  // logo strip, the same list and assets as the pricing page
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];
  document.getElementById('track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' + (i < LOGOS.length ? l.replace('logo', '') : '') + '"' + (i >= LOGOS.length ? ' aria-hidden="true"' : '') + ' />').join('');

  // shared pieces
  const feats = (p) => '<ul class="feats">' + (p.lead ? '<li class="lead"><i class="ph ph-arrow-bend-down-right"></i>' + p.lead + '</li>' : '') +
    p.feats.map((f) => '<li><i class="ph ' + f[0] + '"></i>' + f[1] + '</li>').join('') + '</ul>';
  const cred = (p) => '<div class="cred"><i class="ph-fill ph-star-four"></i><b>' + p.credits + '</b><span>Credits</span>' +
    (p.x ? '<span class="x5">' + p.x + '</span>' : '') + '</div>';
  const amt = (p) => '<div class="amt"><b>$' + p.price + '</b><span>per month<br />billed annually</span></div>';
  const seg = (on) => '<div class="seg" role="tablist">' +
    '<button type="button" data-go="all" class="' + (on === 'all' ? 'is-on' : '') + '"><i class="ph ph-user"></i>Individual</button>' +
    '<button type="button" data-go="team" class="' + (on === 'team' ? 'is-on' : '') + '"><i class="ph ph-users-three"></i>Team</button></div>';

  // view one: Pro only, one price, no billing switch
  const PRO_PTS = [
    ['ph-sparkle', 'Advanced AI models on every slide'],
    ['ph-star-four', '<b>5,000 credits</b> every month'],
    ['ph-paint-brush-broad', 'Brand Kit with your fonts, colours and logo'],
    ['ph-strategy', 'Research and planning built in'],
    ['ph-microsoft-powerpoint-logo', 'Import decks up to <b>60 slides</b>'],
    ['ph-export', 'Editable PowerPoint and PDF export<span class="chip">No watermark</span>'],
    ['ph-chart-bar', 'Presentation analytics'],
  ];
  document.getElementById('v-one').innerHTML =
    '<div class="one">' +
      '<span class="eyebrow"><i class="ph-fill ph-lock-open"></i>Everything unlocked</span>' +
      '<div class="h1">Upgrade to <span class="win">Pro</span></div>' +
      '<div class="lede">One plan, one price. Every model, every export, no watermark</div>' +
      '<div class="one-grid">' +
        '<ul class="pts">' + PRO_PTS.map((f) => '<li><i class="ph ' + f[0] + '"></i><span>' + f[1] + '</span></li>').join('') + '</ul>' +
        '<div><div class="pcard"><div class="nm">Pro</div>' + amt(PRO) +
          '<span class="cr"><i class="ph-fill ph-star-four"></i>' + PRO.credits + ' Credits</span>' +
          '<button type="button" class="btn" data-buy="pro">Start creating in Pro</button></div>' +
          '<div class="fine"><span>Secure checkout</span><span class="dot">•</span><button type="button" class="lnk" data-go="all">Compare all plans</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // view two: Individual, Pro and Gold side by side
  const card = (p) => '<div class="pc' + (p.key === 'gold' ? ' gold' : '') + '">' +
    (p.tag ? '<span class="tag">' + p.tag + '</span>' : '') +
    '<div class="nm">' + p.name + '<i class="ph ' + p.icon + '"></i></div>' +
    '<div class="desc">' + p.desc + '</div>' + amt(p) +
    '<button type="button" class="btn ' + (p.key === 'gold' ? 'btn--gold' : 'btn--out') + '" data-buy="' + p.key + '">Buy ' + p.name + '</button>' +
    cred(p) + feats(p) + '</div>';
  document.getElementById('v-all').innerHTML =
    '<div class="head"><div class="t">Choose the plan that fits your work</div>' + seg('all') + '</div>' +
    '<div class="cards">' + card(PRO) + card(GOLD) + '</div>' +
    '<div class="back"><button type="button" class="lnk" data-go="one">Back to Pro</button></div>';

  // view three: Team, one card split across price and value, with what a team saves under it
  const SAVES = [
    { k: 'vs Gamma Business', v: '$8,880', u: 'a year, 20 seats', n: '$9,600 there vs $720 here' },
    { k: 'vs Beautiful.ai Team', v: '$11,280', u: 'a year, 20 seats', n: '$12,000 there vs $720 here' },
    { k: 'Every seat after that', v: '$0', u: 'seats are unlimited', n: 'Others are about $40 per seat' },
  ];
  document.getElementById('v-team').innerHTML =
    '<div class="head"><div class="t">One plan for your entire team</div>' + seg('team') + '</div>' +
    '<div class="team-wrap"><div class="tc">' +
      '<div class="tc-l"><div class="nm">Team<i class="ph ' + TEAM.icon + '"></i></div>' +
        '<span class="pill"><i class="ph ph-users-three"></i>Unlimited collaborators</span>' +
        '<div class="desc">' + TEAM.desc + '</div>' +
        '<div class="amt"><b>$' + TEAM.price + '</b><span>per month, billed annually</span></div>' +
        '<button type="button" class="btn btn--dark" data-buy="team">Get Team</button></div>' +
      '<div class="tc-r">' + cred(TEAM) + feats(TEAM) + '</div>' +
    '</div>' +
    '<div class="saves"><h3>See what your team saves</h3><div class="g">' +
      SAVES.map((s) => '<div class="s"><div class="k">' + s.k + '</div><div class="v">' + s.v + '</div><div class="u">' + s.u + '</div><div class="n">' + s.n + '</div></div>').join('') +
    '</div></div></div>' +
    '<div class="back"><button type="button" class="lnk" data-go="one">Back to Pro</button></div>';

  // the box keeps its place and resizes between the views
  const box = document.getElementById('box'), views = document.getElementById('views');
  const VIEWS = {
    one:  { el: document.getElementById('v-one'),  w: 1060, q: 'solo' },
    all:  { el: document.getElementById('v-all'),  w: 1180, q: 'solo' },
    team: { el: document.getElementById('v-team'), w: 1180, q: 'team' },
  };
  let cur = VIEWS[q.get('view')] ? q.get('view') : 'one';

  const fit = (name, animate) => {
    const v = VIEWS[name];
    box.style.width = v.w + 'px';
    void box.offsetWidth;                       // settle the new width before measuring
    const h = v.el.offsetHeight;
    if (animate) { views.style.height = h + 'px'; return; }
    const t = views.style.transition;
    views.style.transition = 'none';
    views.style.height = h + 'px';
    void views.offsetHeight;
    views.style.transition = t;
  };
  const show = (name) => {
    if (!VIEWS[name]) return;
    cur = name;
    Object.keys(VIEWS).forEach((k) => VIEWS[k].el.classList.toggle('is-on', k === name));
    setQuote(VIEWS[name].q);
    fit(name, true);
  };
  document.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g) show(g.dataset.go);
  });

  // open and close
  const scrim = document.getElementById('scrim');
  const openModal = () => {
    scrim.hidden = false;
    Object.keys(VIEWS).forEach((k) => VIEWS[k].el.classList.toggle('is-on', k === cur));
    setQuote(VIEWS[cur].q);
    fit(cur, false);
  };
  document.getElementById('open').addEventListener('click', openModal);
  document.getElementById('close').addEventListener('click', () => { scrim.hidden = true; });
  scrim.addEventListener('click', (e) => { if (e.target === scrim) scrim.hidden = true; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !scrim.hidden) scrim.hidden = true; });
  addEventListener('resize', () => { if (!scrim.hidden) fit(cur, false); });

  // full price, no discount: checkout opens over this screen with off=0
  const co = document.getElementById('co'), coFrame = document.getElementById('co-frame');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-buy]');
    if (!b) return;
    coFrame.src = 'checkout-buy-sep-2026.html?plan=' + b.dataset.buy + '&off=0';
    co.classList.add('is-open');
  });
  addEventListener('message', (e) => {
    if (e.data && e.data.type === 'checkout-close') { co.classList.remove('is-open'); coFrame.src = 'about:blank'; }
  });

  // the modal is the point of the proto, so it is up when the page loads
  openModal();
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
