<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#f0f0f2;color:#171717;-webkit-font-smoothing:antialiased;padding:40px 32px 80px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:24px;font-weight:700;letter-spacing:-0.3px}
  .sub{font-size:14px;color:#525252;margin-top:6px;max-width:760px;line-height:1.55}
  .tabs{display:flex;gap:6px;margin:24px 0 20px;flex-wrap:wrap;position:sticky;top:0;background:#f0f0f2;padding:10px 0;z-index:5}
  .tab{border:1px solid #e5e5e5;background:#fff;border-radius:999px;padding:7px 12px;font:600 12px Inter,sans-serif;color:#525252;cursor:pointer}

  .opt.is-active{display:block}
  .meta{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;margin:18px 0 0}

  .meta p{font-size:13px;color:#525252;line-height:1.55;margin-top:6px}
  .meta .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:#e0ebfd;color:#0043B8;margin-bottom:8px;margin-right:6px}
  .refs{display:flex;gap:10px}
  .ref{flex:1;display:block;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;background:#fff;text-decoration:none;color:#171717}
  .ref img{display:block;width:100%;aspect-ratio:16/10.5;object-fit:cover;object-position:top}
  .ref span{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11.5px;font-weight:600}

  /* ── modal skeleton (from the feature modal) ── */
  .stage{background:rgba(10,25,37,0.72);border-radius:12px;padding:40px 0;display:flex;justify-content:center}
  .box{position:relative;width:940px;height:580px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 24px 40px -16px rgba(10,25,37,.3)}
  .left{position:absolute;top:0;left:0;bottom:0;width:340px;padding:60px 30px 0}
  .title{font-size:24px;font-weight:500;line-height:32px;letter-spacing:-0.02em;color:#171717}

  .x{position:absolute;top:0;right:-44px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}

    background:linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%);box-shadow:0 6px 16px rgba(0,0,0,.18)}

  .o6 .row .pr b{font-size:14px}

  /* 7 · Before you go */
  .o7 .box{width:560px;height:auto;padding:24px 28px 24px}

  .o7 .bt .c{flex:1;height:42px;border-radius:6px;background:#0A1925;color:#fff;font:600 13px Inter,sans-serif;display:grid;place-items:center}

  /* 9 · Ribbon */
  .o9 .rib{position:absolute;top:0;left:0;right:0;height:30px;background:#e11d48;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;letter-spacing:.16em;z-index:2}
  .o9 .rib span{margin:0 18px;opacity:.6}
  .o9 .pill{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:2;background:#fff;color:#171717;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.2)}

  /* 10 · Dark */
  .o10 .box{background:#0b0b0d;color:#fff}
  .o10 .left{padding-top:34px}
  .o10 .title,.o10 .li{color:#fff}
  .o10 .li.on{background:rgba(255,255,255,.08)}
  .o10 .right{border-left-color:rgba(255,255,255,.1)}
  .o10 .ft{color:#fff}.o10 .fd{color:rgba(255,255,255,.7)}
  .o10 .big{font-size:56px;font-weight:600;letter-spacing:-2px;line-height:1}
  .o10 .oto{display:inline-block;margin-top:10px;background:#d9ff3d;color:#0b0b0d;font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 8px;border-radius:3px}
  .o10 .sub2{font-size:13px;color:rgba(255,255,255,.7);margin-top:8px}
  .o10 .cta{background:#f2f0e9;color:#0b0b0d;border-radius:999px}
  .o10 .cta .s{color:rgba(0,0,0,.55)}
  .o10 .cta.gold{background:linear-gradient(90deg,#dcb05e,#b8893a);color:#fff}
  .o10 .cta.gold .s{color:rgba(255,255,255,.7)}

  /* 11 · Lowest price bar */
  .o11 .lp{position:absolute;left:0;right:0;bottom:0;background:#0A1925;color:#fff;padding:12px 30px;display:flex;align-items:center;gap:14px;z-index:3}
  .o11 .lp .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8fb3ff}
  .o11 .lp .v{font-size:15px;font-weight:700}
  .o11 .lp .v small{font-weight:500;color:rgba(255,255,255,.6);font-size:12px;margin-left:6px}
  .o11 .lp .btn{margin-left:auto;background:#fff;color:#0A1925;border-radius:4px;padding:10px 18px;font-size:13px;font-weight:700}

  .o12 .lock{margin-top:auto;border:1px solid #ececec;border-radius:10px;padding:12px 14px;background:#fafafa}

  .o12 .lock .r i{width:30px;height:30px;border-radius:8px;background:#e0ebfd;color:#0055ED;display:grid;place-items:center;font-size:15px}
  .o12 .lock .r .t{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px}

  .o13 .prev{height:200px}

  .o13 .sum .n{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}

  .o14 .un p{font-size:12.5px;color:#525252;margin-top:4px;line-height:1.45}

<body>
<div class="wrap">
  <h1>50% off modal · 14 options</h1>
  <p class="sub">Fourteen ways to make the deep-discount modal say "50% off" louder, from a stronger chip to a full re-layout. Each is drawn from a Mobbin pattern (linked under the frame). Same feature list, same Pro / Gold CTAs unless noted.</p>
  <div class="tabs" id="tabs"></div>
  <div id="opts"></div>
</div>

<script>
const LIST = `<div class="list">
  <div class="li on"><i class="ph-fill ph-export"></i>Export presentations</div>
  <div class="li"><i class="ph ph-folder"></i>Projects</div>
  <div class="li"><i class="ph ph-users-three"></i>Invite team members</div>
  <div class="li"><i class="ph ph-swatches"></i>Brand kit</div>
  <div class="li"><i class="ph ph-star-four"></i>Pro AI model</div>
  <div class="li"><i class="ph ph-chart-bar"></i>Analytics</div>
</div>`;
const TITLE = `<h2 class="title">Access <em>Export presentations</em> and lots more with Pro or Gold at <span class="acc">50% off</span></h2>`;
const PREV = `<div class="prev"><div class="mock"><b></b>PowerPoint</div></div>`;
const BODY = (extra='', ctas=true) => `<div class="body"><div class="ft">Export presentations</div><div class="fd">Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.</div>${extra}${ctas ? `<div class="ctas"><button class="cta">Buy Pro<span class="s">Save $120</span></button><button class="cta gold">Buy Gold<span class="s">Save $300</span></button></div>` : ''}</div>`;
const X = `<span class="x"><i class="ph ph-x"></i></span>`;
const ref = (app, id, img) => `<a class="ref" href="https://mobbin.com/screens/${id}" target="_blank" rel="noopener"><img src="assets/discount-refs/${img}.webp" alt="${app}"><span>${app}<i class="ph ph-arrow-square-out"></i></span></a>`;

const OPTS = [
 {n:'1 · Big number hero', tag:'Loud', cls:'o1', refs:[ref('QUITTR','09ef2499-dfce-4ec1-8d23-8841b966f54d','quittr'),ref('Beside','6beb136d-47f6-4ded-bc0e-c9e4a6bc4ed0','beside')],
  why:'The percentage becomes the headline, not a chip. A dark tile owns the top of the left column with "50" at 64px, "one-time offer" above it and the timer inside the tile; the feature title drops to a caption. Copies the QUITTR / Beside one-time-offer block.',
  html:`<div class="left"><div class="hero50"><div class="k">One-time offer</div><div class="n">50<small>%</small></div><div class="t">off Pro and Gold, first year</div><div class="tm"><i class="ph-fill ph-clock"></i>Ends in <span class="mono">59:56</span></div></div>${LIST}</div><div class="right">${PREV}${BODY()}</div>`},
 {n:'2 · Coupon ticket', tag:'Metaphor', cls:'o2', refs:[ref('FocusFlight','5a020989-c20a-4f45-b35c-b7f92a703f1d','focusflight'),ref('Agoda','7c463ab7-2a56-4afb-9e70-b9e99fe4348b','placify')],
  why:'The offer is a physical ticket: notched sides, dashed tear line, barcode, "-50%" in big type and the discounted Pro price under it. Feels like something you hold, which is why coupon UIs convert.',

const tabs = document.getElementById('tabs'), opts = document.getElementById('opts');
OPTS.forEach((o, i) => {
  tabs.insertAdjacentHTML('beforeend', `<button class="tab${i===0?' is-active':''}" data-i="${i}">${o.n}</button>`);
  opts.insertAdjacentHTML('beforeend', `<section class="opt ${o.cls}${i===0?' is-active':''}" data-i="${i}">
    <div class="stage"><div class="box">${o.html}${X}</div></div>
    <div class="meta"><div><span class="tag">${o.tag}</span><h2>${o.n}</h2><p>${o.why}</p></div><div class="refs">${o.refs.join('')}</div></div>
  </section>`);
});
tabs.addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('is-active', b === t));
  document.querySelectorAll('.opt').forEach((s) => s.classList.toggle('is-active', s.dataset.i === t.dataset.i));
});
</script>
<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
</script>
