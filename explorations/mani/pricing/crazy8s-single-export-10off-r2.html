<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>crazy8s · Single export modal · 10% off · Round 2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dfe3e8; color: #171717; -webkit-font-smoothing: antialiased; padding: 48px 24px 120px; }
  .page { width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: #666; margin-bottom: 40px; max-width: 700px; }
  .variant { margin-bottom: 64px; }
  .v-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5f6b76; margin-bottom: 4px; }
  .v-note { font-size: 12.5px; color: #666; margin-bottom: 12px; }
  .backdrop { background: rgba(10,25,37,0.45); border-radius: 8px; padding: 40px 60px; display: flex; justify-content: center; }

  .wrap { position: relative; }
  .modal { width: 570px; background: #fff; border-radius: 14px; padding: 28px 28px 32px; box-shadow: 0 24px 64px rgba(0,0,0,.35); position: relative; overflow: visible; }
  .close { position: absolute; top: -12px; right: -44px; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 0; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .close i { font-size: 17px; color: #171717; }

  .ttl { margin: 12px 0 8px; text-align: center; font-size: 20px; font-weight: 500; letter-spacing: -.2px; }
  .sub { margin: 0 0 30px; text-align: center; font-size: 14.5px; line-height: 1.4; color: #404040; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { background: #f7f7f7; border-radius: 8px; padding: 16px 14px 18px; min-height: 130px; }
  .ico { width: 34px; height: 34px; border-radius: 6px; background: #fff; border: 1px solid #e8e8e8; display: grid; place-items: center; margin-bottom: 18px; }
  .ico i { font-size: 18px; }
  .card b { display: block; font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .card span { display: block; font-size: 13px; line-height: 1.35; color: #525252; }

  .offer { position: relative; margin-top: 22px; border: 1px solid #e3e6ea; border-radius: 10px; padding: 20px; background: linear-gradient(180deg, #fbfcfe 0%, #f4f6fa 100%); }
  .o-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .o-name { font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; letter-spacing: -.2px; }
  .o-name i { font-size: 16px; }
  .o-desc { font-size: 14.5px; color: #404040; margin-top: 4px; }
  .o-price { text-align: right; white-space: nowrap; }
  .o-price .base { font-size: 15px; color: #a3a3a3; text-decoration: line-through; margin-right: 6px; }
  .o-price .now { font-size: 26px; font-weight: 500; letter-spacing: -.4px; }
  .o-price .per { display: block; font-size: 13px; color: #8a8a8a; margin-top: 2px; }

  .btn { margin-top: 18px; width: 100%; height: 44px; border: 0; border-radius: 4px; background: #0d1621; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; }

  .trust { margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 13px; font-weight: 500; color: #525252; white-space: nowrap; }
  .trust span { display: inline-flex; align-items: center; gap: 8px; }
  .t-badge { height: 19px; width: auto; flex: none; }
  .t-badge.t-heart { height: 18px; }

  /* shared offer bits */
  .grad { background: linear-gradient(90deg, #101E3C 0%, #1D48B8 42%, #3D74EE 72%, #8FB4FD 100%); }
  .grad-txt { background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#1C6BF3 78%,#5990FC 96%,#74A6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* 1 · chip beside title */
  .chip-green { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: #0d9f6e; color: #fff; font-size: 11.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
  .chip-green i { font-size: 11px; }

  /* 2 · floating gradient pill above button */
  .pill-float { position: absolute; left: 50%; transform: translateX(-50%); bottom: 100%; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; color: #fff; font-size: 12.5px; font-weight: 500; white-space: nowrap; border-radius: 999px; z-index: 1; animation: bob 2.6s ease-in-out infinite, glow 2.2s ease-in-out infinite; }
  .pill-float::after { content: ''; position: absolute; left: 50%; margin-left: -4px; bottom: -3px; width: 8px; height: 8px; background: #2B57C9; border-radius: 1px; transform: rotate(45deg); z-index: -1; }
  @keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -3px); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,.15), 0 0 0 0 rgba(82,145,255,.5); } 70% { box-shadow: 0 2px 6px rgba(0,0,0,.15), 0 0 0 10px rgba(82,145,255,0); } }

  /* 3 · corner tag on offer card */
  .tag-corner { position: absolute; top: -11px; right: 16px; padding: 4px 10px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em; box-shadow: 0 3px 10px rgba(29,72,184,.35); }

  /* 4 · title-integrated */
  .ttl .off { font-weight: 600; }

  /* 5 · banner strip */
  .banner { margin: -28px -28px 20px; padding: 10px 16px; background: #e8f0fe; color: #1c2b3a; font-size: 13px; text-align: center; border-radius: 14px 14px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .banner b { font-weight: 600; color: #0055ED; }
  .banner i { color: #0055ED; font-size: 15px; }

  /* 6 · save line under price */
  .save { display: block; font-size: 13px; font-weight: 500; color: #005eff; margin-top: 4px; }

  /* 7 · pill inside button */
  .btn-pill { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 4px 9px; border-radius: 999px; background: #fff; color: #0d1621; font-size: 11px; font-weight: 700; letter-spacing: .05em; }

  /* 8 · countdown chip under subtitle */
  .timer { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px; color: #fff; font-size: 12.5px; font-weight: 500; }
  .timer .sep { opacity: .5; }
  .timer .t { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; opacity: .95; }
  .timer-wrap { text-align: center; margin: -18px 0 26px; }
</style>
</head>
<body>
<div class="page">
  <h1>Crazy 8s · Single export modal · "10% OFF" · Round 2</h1>
  <p class="page-sub">Round 2: price gone from the button. Each variant tries a different CTA line.</p>
  <div id="list"></div>
</div>

<template id="base">
  <div class="variant">
    <div class="v-label"></div>
    <div class="v-note"></div>
    <div class="backdrop"><div class="wrap">
      <div class="modal">
        <div class="ttl">Just need this one deck?</div>
        <p class="sub">Export this presentation as an editable PowerPoint.<br />Pay once, no subscription.</p>
        <div class="cards">
          <div class="card"><div class="ico"><i class="ph ph-credit-card"></i></div><b>Pay once</b><span>₹2,250, no subscription</span></div>
          <div class="card"><div class="ico"><i class="ph ph-microsoft-powerpoint-logo"></i></div><b>Editable PowerPoint</b><span>Download as .pptx</span></div>
          <div class="card"><div class="ico"><i class="ph ph-globe"></i></div><b>Use it anywhere</b><span>PowerPoint, Keynote or Google Slides</span></div>
        </div>
        <div class="offer">
          <div class="o-head">
            <div>
              <div class="o-name">Single PowerPoint Export <i class="ph ph-microsoft-powerpoint-logo"></i></div>
              <div class="o-desc">Export this presentation as an editable .pptx</div>
            </div>
            <div class="o-price"><span class="base">₹2,500</span><span class="now">₹2,250</span><span class="per">one time</span></div>
          </div>
          <button class="btn" type="button">Export this presentation</button>
        </div>
        <div class="trust">
          <span><img class="t-badge t-heart" src="assets/checkout/badge-heart.svg" alt="" />Loved by 12M+ Presenters</span>
          <span><img class="t-badge" src="assets/checkout/badge-gdpr.svg" alt="" />GDPR compliant</span>
          <span><img class="t-badge" src="assets/checkout/badge-soc2.svg" alt="" />SOC 2 Type II</span>
        </div>
      </div>
      <button class="close" type="button" aria-label="Close"><i class="ph ph-x"></i></button>
    </div></div>
  </div>
</template>

<script>
  const V = [
    { label: '1 · Green chip beside the card title', note: 'Small solid chip after the product name. Quiet, sits with the thing on sale.',
      apply(m) { m.querySelector('.o-name').insertAdjacentHTML('beforeend', '<span class="chip-green"><i class="ph-fill ph-seal-percent"></i>10% OFF</span>'); m.querySelector('.btn').textContent = 'Export this presentation'; } },

    { label: '2 · Floating gradient pill above the button', note: 'Same animated pill as the buy checkout. "10% off applied" pointing at the CTA.',
      apply(m) { m.querySelector('.btn').insertAdjacentHTML('beforebegin', '<div style="position:relative;height:0"><span class="pill-float grad"><i class="ph-fill ph-seal-percent"></i>10% off applied</span></div>'); m.querySelector('.btn').style.marginTop = '30px'; m.querySelector('.btn').textContent = 'Export as PowerPoint'; } },

    { label: '3 · Corner tag on the offer card', note: 'Gradient tag overlapping the top edge of the price card, like a price sticker.',
      apply(m) { m.querySelector('.offer').insertAdjacentHTML('afterbegin', '<span class="tag-corner grad">10% OFF</span>'); m.querySelector('.btn').textContent = 'Get the editable .pptx'; } },

    { label: '4 · Baked into the headline', note: 'Headline carries the offer in gradient text. Nothing extra added below.',
      apply(m) { m.querySelector('.ttl').innerHTML = 'Just need this one deck? <span class="off grad-txt">Take 10% off.</span>'; m.querySelector('.btn').textContent = 'Export with 10% off'; } },

    { label: '5 · Banner strip across the top', note: 'Light blue strip above the headline. Reads as a system-wide offer, not a per-card one.',
      apply(m) { m.insertAdjacentHTML('afterbegin', '<div class="banner"><i class="ph-fill ph-seal-percent"></i><span><b>10% off</b> this export. Applied at checkout, today only.</span></div>'); m.querySelector('.btn').textContent = 'Export this deck'; } },

    { label: '6 · Savings line under the price', note: 'Blue "Save ₹250 (10% off)" where the strike price already lives. Zero new chrome.',
      apply(m) { m.querySelector('.o-price').insertAdjacentHTML('beforeend', '<span class="save">Save ₹250 (10% off)</span>'); m.querySelector('.btn').textContent = 'Download PowerPoint'; } },

    { label: '7 · Pill inside the button', note: 'White "10% OFF" pill pinned to the right edge of the CTA. Offer and action in one hit.',
      apply(m) { const b = m.querySelector('.btn'); b.innerHTML = 'Export this presentation <span class="btn-pill">10% OFF</span>'; b.style.justifyContent = 'center'; b.style.paddingRight = '84px'; b.style.paddingLeft = '84px'; } },

    { label: '8 · Countdown chip under the subtitle', note: 'Gradient chip with live timer. Urgency on top of the discount.',
      apply(m) { m.querySelector('.sub').insertAdjacentHTML('afterend', '<div class="timer-wrap"><span class="timer grad"><span>10% off</span><span class="sep">|</span><span class="t"><i class="ph ph-timer"></i><span class="cd">59:59</span></span></span></div>'); m.querySelector('.btn').textContent = 'Claim 10% off and export'; } },
  ];

  const list = document.getElementById('list');
  const tpl = document.getElementById('base');
  V.forEach((v) => {
    const node = tpl.content.cloneNode(true);
    node.querySelector('.v-label').textContent = v.label;
    node.querySelector('.v-note').textContent = v.note;
    v.apply(node.querySelector('.modal'));
    list.appendChild(node);
  });

  let s = 59 * 60 + 59;
  setInterval(() => {
    s = s > 0 ? s - 1 : 59 * 60 + 59;
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    document.querySelectorAll('.cd').forEach((el) => { el.textContent = mm + ':' + ss; });
  }, 1000);
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
