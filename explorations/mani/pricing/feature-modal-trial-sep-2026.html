<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feature modal · 7-day free trial · Sep 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #e9e9e9;
    color: #171717;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .dp-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,25,37,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .dp-stack { position: relative; }
  .dp-close {
    position: absolute;
    top: -14px; right: -14px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1px solid rgba(10,25,37,0.12);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(10,25,37,0.15);
    z-index: 2;
    font-size: 14px; color: #171717;
  }
  .dp-close:hover { background: #f5f5f5; }
  .dp-box {
    position: relative;
    width: 978px; height: 620px;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(10,25,37,0.09), 0 4px 6px rgba(10,25,37,0.09),
                0 24px 40px -16px rgba(10,25,37,0.18);
    display: grid;
    grid-template-columns: 342px 1fr;
    grid-template-rows: 1fr 58px;
  }

  /* ── Offer banner (appears on close attempt) ── */
  .dp-banner {
    display: none;
    background: #e8f0fe;
    border-radius: 4px 4px 0 0;
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    color: #1c2b3a;
    overflow: hidden;
  }
  .is-offer .dp-banner { display: block; animation: banner-in 0.45s ease both; }
  @keyframes banner-in {
    from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; }
    to   { opacity: 1; max-height: 44px; padding-top: 10px; padding-bottom: 10px; }
  }
  .is-offer .dp-box { border-radius: 0 0 4px 4px; }

  /* ── Left rail ── */
  .dp-left {
    grid-column: 1; grid-row: 1;
    padding: 28px 20px 16px 28px;
    overflow-y: auto;
  }
  .dp-left::-webkit-scrollbar { width: 0; }
  .dp-title {
    font-size: 24px; font-weight: 500;
    line-height: 32px; letter-spacing: -0.02em;
    margin-bottom: 22px;
    max-width: 280px;
  }
  .dp-title .off {
    background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 600;
  }
  .dp-title.swap { animation: title-in 0.45s ease both; }
  @keyframes title-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .dp-pill {
    display: none;
    align-items: center; gap: 8px;
    background: linear-gradient(96deg,#00225C 0%,#003C9E 24%,#0055ED 50%,#0F60EF 66%,#1C6BF3 78%,#2A75F6 86%,#3F82FA 92%,#5990FC 96%,#74A6FF 100%);
    color: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px; font-weight: 600;
    margin-bottom: 12px;
    white-space: nowrap;
  }
  .is-offer .dp-pill { display: inline-flex; animation: pill-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
  @keyframes pill-in { from { opacity: 0; transform: translateY(-10px) scale(0.9); } to { opacity: 1; transform: none; } }
  .dp-pill .sep { opacity: 0.5; font-weight: 400; }
  .dp-pill .t {
    display: inline-flex; align-items: center; gap: 5px;
    font-weight: 500; opacity: 0.95;
    font-variant-numeric: tabular-nums;
  }
  .dp-feat-item {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%;
    padding: 9px 10px;
    background: transparent;
    border: 0; border-radius: 6px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: #171717;
  }
  .dp-feat-item:hover { background: #f7f7f7; }
  .dp-feat-item.is-active { background: #f2f2f2; }
  .dp-feat-item > i { font-size: 18px; line-height: 22px; flex-shrink: 0; }
  .dp-feat-item .txt { min-width: 0; }
  .dp-feat-item .row { display: flex; align-items: center; gap: 8px; }
  .dp-feat-item .lbl {
    font-size: 14.5px; font-weight: 500; line-height: 22px;
    white-space: nowrap;
  }
  .dp-dots { display: inline-flex; align-items: center; gap: 3px; }
  .dp-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dp-dot--pro  { background: #0055ED; }
  .dp-dot--gold { background: #c9932a; }
  .dp-dot--team { background: #171717; }
  .dp-feat-item .sub {
    display: none;
    font-size: 12.5px; line-height: 18px;
    color: #6b6b6b;
    margin-top: 2px;
  }
  .dp-feat-item.is-active .sub { display: block; }

  /* ── Right side ── */
  .dp-right {
    grid-column: 2; grid-row: 1;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .dp-preview {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b1fbb;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .dp-preview img, .dp-preview video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .dp-tier-zone {
    margin-top: auto;
    margin-bottom: auto;
    padding: 12px 30px 0;
  }

  /* ── Tier rows (Sep 2026 handoff style) ── */
  .v3-row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
  .v3-row + .v3-row { border-top: 1px solid rgba(10,25,37,0.08); }
  .v3-plan { font-size: 17px; font-weight: 600; width: 58px; letter-spacing: -0.01em; }
  .v3-cred {
    display: inline-flex; align-items: center; gap: 7px;
    background: #e8f0fe; color: #0055ED;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 13.5px; font-weight: 600;
    white-space: nowrap;
  }
  .v3-cred i { font-size: 13px; }
  .v3-price {
    margin-left: auto;
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .v3-price s { font-weight: 400; opacity: 0.45; margin-right: 7px; font-size: 15px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    height: 40px; width: 134px;
    gap: 8px;
    border-radius: 8px;
    cursor: pointer;
    background: #fff;
    border: 1px solid #171717;
    color: #171717;
    flex-shrink: 0;
  }
  .btn:hover { background: #f5f5f5; }
  .btn i { font-size: 15px; }
  .btn--gold {
    border: 0;
    background: linear-gradient(90deg,#dcb05e 0%,#ca9e4c 30%,#c39643 65%,#b8893a 100%);
    color: #fff;
  }
  .btn--gold:hover { filter: brightness(1.05); }
  .p-off { display: none; }
  .is-offer .p-base { display: none; }
  .is-offer .p-off { display: inline-flex; align-items: baseline; animation: title-in 0.45s ease both; }

  /* ── Footer ── */
  .dp-footer {
    grid-column: 1 / -1; grid-row: 2;
    border-top: 1px solid rgba(10,25,37,0.08);
    display: flex; align-items: center;
    gap: 34px;
    padding: 0 30px;
    overflow: hidden;
  }
  .dp-footer .loved {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: #171717;
    white-space: nowrap;
  }
  .dp-footer .loved i { color: #e02d2d; font-size: 15px; }
  .sp-wrap {
    position: relative;
    overflow: hidden;
    flex: 1;
    height: 100%;
    display: flex; align-items: center;
  }
  @keyframes sp-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .sp-track {
    display: flex; align-items: center;
    gap: 32px;
    width: max-content;
    animation: sp-marquee 40s linear infinite;
  }
  .sp-wrap:hover .sp-track { animation-play-state: paused; }
  .sp-logo-img { flex: none; height: 26px; width: auto; object-fit: contain; }
  .sp-fade {
    pointer-events: none;
    position: absolute; top: 0; bottom: 0;
    width: 72px;
  }
  .sp-fade--l { left: 0;  background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .sp-fade--r { right: 0; background: linear-gradient(to left,  #fff, rgba(255,255,255,0)); }
</style>
</head>
<body>

<div class="dp-backdrop" id="dp-backdrop">
  <div class="dp-stack" id="dp-stack">
    <button type="button" class="dp-close" id="dp-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <div class="dp-banner">🎁 Before you go, a special discount, just for you for the next hour.</div>
    <div class="dp-box">

      <div class="dp-left" id="dp-left">
        <div class="dp-pill"><span>20% off</span><span class="sep">·</span><span class="t"><i class="ph-fill ph-clock"></i><span id="dp-timer">59:56</span></span></div>
        <h2 class="dp-title" id="dp-title">Start your 7-day free trial today</h2>
      </div>

      <div class="dp-right">
        <div class="dp-preview" id="dp-preview"></div>
        <div class="dp-tier-zone" id="dp-tier-zone"></div>
      </div>

      <div class="dp-footer">
        <span class="loved"><i class="ph-fill ph-heart"></i>Loved by 12M+ Presenters at</span>
        <span class="sp-wrap">
          <span class="sp-track" id="sp-track"></span>
          <span class="sp-fade sp-fade--l"></span>
          <span class="sp-fade sp-fade--r"></span>
        </span>
      </div>

    </div>
  </div>
</div>

<script>
  const DESCS = {
    export:    'Download your presentations as PowerPoint, PDF, or image files for offline use and sharing.',
    brandkit:  'Add your logo, fonts, and colors once, and every deck comes out on-brand.',
    knowledge: 'Upload your files once. The AI references them on every slide, so your decks stay accurate and on-message.',
    team:      'Invite your team to co-edit in real time, comment on slides, and assign slides to owners.',
    ultra:     'Run every generation on our Pro and Ultra models, for the highest quality content and design.',
    analytics: 'Track views, engagement, and viewer location. See exactly how your deck performs after you share it.',
    projects:  'Group related decks into shared spaces, so everyone knows where the latest version lives.',
    fontpair:  'Set your brand fonts and colors once, and they apply across every deck you create.',
    present:   'Present live to remote audiences in real time, straight from the editor.',
    meetedit:  'Work on the same deck together during a live call, with edits visible instantly.',
  };
  const FEATURES = [
    { key: 'export',    label: 'Export presentations',   icon: 'ph-export',            dots: ['pro','gold','team'], video: 'trigger_export' },
    { key: 'brandkit',  label: 'Brand kit',              icon: 'ph-swatches',          dots: ['pro','gold','team'], img: 'triggerbrandkit.jpg' },
    { key: 'knowledge', label: 'Shared knowledge base',  icon: 'ph-book-open',         dots: ['gold','team'],       img: 'triggerprojectknowledge.jpg' },
    { key: 'team',      label: 'Collaborations',         icon: 'ph-users-three',       dots: ['team'],              video: 'trigger_invite_members' },
    { key: 'ultra',     label: 'Ultra/Pro AI model',     icon: 'ph-sparkle',           dots: [],                    img: 'triggeraimodels.jpg' },
    { key: 'analytics', label: 'Analytics',              icon: 'ph-chart-bar',         dots: ['pro','gold','team'], video: 'trigger_analytics' },
    { key: 'projects',  label: 'Projects',               icon: 'ph-folder',            dots: ['pro','gold','team'], img: 'triggerproject.jpg' },
    { key: 'fontpair',  label: 'Color and Font pair',    icon: 'ph-text-aa',           dots: ['pro','gold','team'], img: 'triggerfonts.jpg' },
    { key: 'present',   label: 'Meet and present',       icon: 'ph-projector-screen',  dots: ['pro','gold','team'], img: 'triggercolorsmeetandpresent.jpg' },
    { key: 'meetedit',  label: 'Meet and edit',          icon: 'ph-pencil-simple',     dots: ['pro','gold','team'], img: 'triggermeetandedit.jpg' },
  ];
  const LOGOS = ['microsoftlogo','googlelogo','adobelogo','facebooklogo','mckinseylogo','amazonlogo','notionlogo','eylogo','bcglogo'];

  const BASE_TITLE  = 'Start your 7-day free trial today';
  const OFFER_TITLE = 'Start your 7-day free trial today, then <span class="off">20% off</span>';

  const price = (base, off) =>
    '<span class="v3-price"><span class="p-base">$' + base + '/mo</span><span class="p-off"><s>$' + base + '</s>$' + off + '/mo</span></span>';
  const chip = (n) => '<span class="v3-cred"><i class="ph-fill ph-star-four"></i>' + n + ' Credits</span>';
  const row = (plan, credits, base, off, gold) =>
    '<div class="v3-row"><span class="v3-plan">' + plan + '</span>' + chip(credits) + price(base, off) +
    '<button type="button" class="btn' + (gold ? ' btn--gold' : '') + '">Try ' + plan + ' free<i class="ph ph-arrow-right"></i></button></div>';

  document.getElementById('dp-tier-zone').innerHTML =
    row('Pro', '5,000', 20, 16) + row('Gold', '25,000', 50, 40, true) + row('Team', '30,000', 60, 48);

  document.getElementById('sp-track').innerHTML = LOGOS.concat(LOGOS).map((l, i) =>
    '<img class="sp-logo-img" src="assets/export-ppt/logos/' + l + '.svg" alt="' +
    (i < LOGOS.length ? l.replace('logo','') : '') + '" ' + (i >= LOGOS.length ? 'aria-hidden="true"' : '') + ' />'
  ).join('');

  // left rail
  const left = document.getElementById('dp-left');
  FEATURES.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dp-feat-item' + (i === 0 ? ' is-active' : '');
    b.dataset.key = f.key;
    const dots = f.dots.map((d) => '<span class="dp-dot dp-dot--' + d + '"></span>').join('');
    b.innerHTML =
      '<i class="' + (i === 0 ? 'ph-fill ' : 'ph ') + f.icon + '"></i>' +
      '<span class="txt"><span class="row"><span class="lbl">' + f.label + '</span>' +
      (dots ? '<span class="dp-dots">' + dots + '</span>' : '') +
      '</span><span class="sub"></span></span>';
    left.appendChild(b);
  });

  const preview = document.getElementById('dp-preview');
  const items = Array.from(left.querySelectorAll('.dp-feat-item'));

  function renderPreview(f) {
    preview.innerHTML = f.video
      ? '<video autoplay loop muted playsinline><source src="assets/feature-modal/' + f.video + '.webm" type="video/webm" /><source src="assets/feature-modal/' + f.video + '.mp4" type="video/mp4" /></video>'
      : '<img src="assets/feature-modal/' + f.img + '" alt="" />';
  }
  function activate(item) {
    const f = FEATURES.find((x) => x.key === item.dataset.key);
    items.forEach((it) => {
      const on = it === item;
      it.classList.toggle('is-active', on);
      const ic = FEATURES.find((x) => x.key === it.dataset.key).icon;
      it.querySelector('i').className = (on ? 'ph-fill ' : 'ph ') + ic;
    });
    item.querySelector('.sub').textContent = DESCS[f.key];
    renderPreview(f);
  }
  items.forEach((it) => it.addEventListener('click', () => activate(it)));
  activate(items[0]);

  // first close attempt triggers the nudge: banner + pill + offer title + discounted prices
  const stack = document.getElementById('dp-stack');
  const title = document.getElementById('dp-title');
  const timerEl = document.getElementById('dp-timer');
  document.getElementById('dp-close').addEventListener('click', () => {
    if (stack.classList.contains('is-offer')) return;
    stack.classList.add('is-offer');
    title.innerHTML = OFFER_TITLE;
    title.classList.add('swap');
    let left = 59 * 60 + 56;
    const tick = () => {
      timerEl.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
      if (left-- > 0) setTimeout(tick, 1000);
    };
    tick();
  });
</script>

<div id="agentation-root"></div>
<script type="module">
  import React from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
  createRoot(document.getElementById('agentation-root'))
    .render(React.createElement(Agentation));
</script>
</body>
</html>
