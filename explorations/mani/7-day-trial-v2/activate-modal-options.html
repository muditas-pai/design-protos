<!DOCTYPE html>
<!-- 7-day-trial v2 · activate-modal copy options · two scenarios × 8 numbered variants -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <title>Activate modal · 8 copy options · 7 Day Trial v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #eef1f5;
      color: #0A1925;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

    /* header */
    .head { margin-bottom: 8px; }
    .head h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .head p { font-size: 14px; color: #5b6573; margin-top: 4px; }

    /* tabs */
    .tabs {
      display: inline-flex; gap: 4px; margin: 22px 0 26px;
      background: #fff; padding: 5px; border-radius: 12px;
      border: 1px solid #e2e6ec; box-shadow: 0 1px 2px rgba(10,25,37,.04);
    }
    .tab {
      border: 0; cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 600; color: #5b6573;
      padding: 9px 18px; border-radius: 8px; background: transparent;
      display: flex; align-items: center; gap: 8px; transition: .15s;
    }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
    .tab[data-sc="activate"] .dot { background: #2563eb; }
    .tab[data-sc="empty"] .dot { background: #e0533d; }
    .tab[data-sc="gold"] .dot  { background: #c79318; }
    .tab[data-sc="seats"] .dot { background: #16a34a; }
    .tab.active { background: #0A1925; color: #fff; }
    .tab:not(.active):hover { background: #f1f4f8; color: #0A1925; }

    .scenario-note {
      font-size: 13px; color: #5b6573; margin-bottom: 22px;
      background: #fff; border: 1px solid #e2e6ec; border-radius: 10px;
      padding: 12px 16px; display: flex; gap: 10px; align-items: center;
    }
    .scenario-note b { color: #0A1925; }

    /* grid of modals */
    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

    /* modal card */
    .modal {
      position: relative; background: #fff; border-radius: 14px;
      border: 1px solid #e4e8ee; overflow: hidden;
      box-shadow: 0 12px 34px rgba(10,25,37,.10);
    }
    .num {
      position: absolute; top: -11px; left: -11px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%;
      background: #0A1925; color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(10,25,37,.25);
    }
    .m-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; background: #f7f8fa; border-bottom: 1px solid #eceff3;
    }
    .m-close {
      flex: none; width: 28px; height: 28px; border-radius: 50%;
      border: 0; background: #eef1f5; color: #5b6573;
      font-size: 16px; line-height: 1; cursor: default;
      display: flex; align-items: center; justify-content: center;
    }
    .m-body { padding: 18px 20px 20px; }
    .modal.is-rec { border-color: #16a34a; box-shadow: 0 12px 34px rgba(22,163,74,.16), 0 0 0 2px rgba(22,163,74,.30); }
    .modal.is-rec .m-head { background: #f1faf3; border-bottom-color: #d8eede; }
    .rec-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      color: #15803d; background: #e7f7ec; border: 1px solid #bce6c8;
      padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
    }
    .m-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .m-lead { font-size: 13.5px; line-height: 1.5; color: #475260; }

    .m-sum {
      margin-top: 16px; border: 1px solid #e6eaf0; border-radius: 12px;
      padding: 14px 16px;
    }
    .m-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .m-row + .m-row { margin-top: 4px; }
    .m-row .lbl { font-size: 13.5px; font-weight: 600; }
    .m-row .lbl.reg { font-weight: 500; color: #475260; }
    .m-plan { margin-bottom: 11px; }
    .m-subline { font-size: 12.5px; color: #6b7480; font-weight: 500; margin-top: 3px; }
    .m-row .sub { font-size: 12.5px; color: #6b7480; font-weight: 500; }
    .m-row .val { font-size: 13.5px; font-weight: 600; }
    .m-row .val.muted { color: #475260; font-weight: 500; }
    .m-div { height: 1px; background: #e6eaf0; margin: 12px 0; }
    .m-due .lbl, .m-due .val { font-size: 15px; font-weight: 700; }
    .m-row .off { color: #16a34a; font-weight: 700; }
    .m-row .strike { text-decoration: line-through; color: #9aa3af; font-weight: 500; margin-right: 7px; }
    .m-row .val.neg { color: #16a34a; }

    .m-agree {
      display: flex; gap: 10px; align-items: flex-start;
      margin-top: 16px; font-size: 12.5px; color: #475260; line-height: 1.45;
    }
    .m-agree .box {
      flex: none; width: 16px; height: 16px; margin-top: 1px;
      border: 1.5px solid #c2cad4; border-radius: 4px; background: #fff;
    }

    .m-acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn {
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      padding: 10px 18px; border-radius: 9px; cursor: default; border: 1px solid transparent;
    }
    .btn-ghost { background: #fff; border-color: #d7dde5; color: #0A1925; }
    /* resting state: agree unchecked, so Confirm is disabled-gray (navy once ticked) */
    .btn-primary { background: #c4ccd6; color: #fff; }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <h1>Activate modal · copy options</h1>
      <p>Two scenarios. 8 numbered content variants each. Same layout, different copy. Pick per scenario.</p>

    <div class="tabs">

      <button class="tab" data-sc="seats"><span class="dot"></span>Add more seats</button>
    </div>

    <div class="scenario-note" id="scNote"></div>

    <div class="grid" id="grid"></div>
  </div>

      empty: {

        accent: '',
        plan: 'Pro Plan',

        unlock: '5,000',

        renew: 'Renews at US$264.00/year on Jun 16, 2027.',
        opts: [
          { tag: 'Direct / factual',
            title: "You're out of trial credits",
            lead: "Your 500 trial credits are used up. Activate your full Pro plan to unlock 5,000 credits and keep going.",
            agree: "I agree to the Terms.",
            cta: "Activate plan" },
          { tag: 'Continue momentum', rec: true,
            title: "Keep creating, no waiting",
            lead: "You've used all 500 trial credits. Activate now to unlock 5,000 credits instead of waiting for day 7.",
            agree: "I agree to the Terms.",
            cta: "Unlock 5,000 credits" },
          { tag: 'Value / 10x',
            title: "Unlock 10× more credits",
            lead: "Trial credits done. Switch to the full Pro plan and get 5,000 credits today, 10× your trial amount.",
            agree: "I agree to the Terms.",
            cta: "Get 5,000 credits" },
          { tag: 'Loss aversion',
            title: "Trial credits used up",
            lead: "You hit your 500-credit trial limit. Don't lose momentum, activate the full plan to unlock 5,000 now.",
            agree: "I agree to the Terms.",
            cta: "Activate full plan" },
          { tag: 'Reassurance',
            title: "Pick up right where you left off",
            lead: "Out of trial credits. Activate your Pro plan to instantly restore creating with 5,000 full-plan credits.",
            agree: "I agree to the Terms.",
            cta: "Continue with 5,000" },
          { tag: 'Question hook',
            title: "Need more credits?",
            lead: "Your 500 trial credits are gone. Activate the full Pro plan early to unlock 5,000 credits right now.",
            agree: "I agree to the Terms.",
            cta: "Yes, unlock 5,000" },
          { tag: 'Minimal',
            title: "Get 5,000 credits",
            lead: "Trial credits finished. Activate full Pro to continue.",
            agree: "I agree to the Terms.",
            cta: "Confirm Payment" },
          { tag: 'Benefit-led',
            title: "Don't stop now",
            lead: "You ran out of trial credits mid-flow. Unlock the full 5,000 and finish what you started.",
            agree: "I agree to the Terms.",
            cta: "Unlock & continue" }
        ]
      },
      gold: {
        note: '<span>Trigger: user on <b>Pro</b> trial hits a <b>Gold-only</b> feature and chooses to move up. <b>50% off</b> applied. Due today <b>US$583.5</b>.</span>',
        accent: '',
        style: 'gold',
        planLabel: 'Gold Plan',
        off: '50% off',
        unlock: '50,000',
        listPrice: 'US$1,167',
        price: 'US$583.5',
        due: 'US$583.5',
        renew: 'Renews at US$1,167/year on Jun 19, 2027.',
        opts: [
          { tag: 'Feature-gated', rec: true,

          { tag: 'Direct (current)',

          { tag: 'Reassure billing',

            cta: "Yes, add seat" },

    var grid = document.getElementById('grid');
    var note = document.getElementById('scNote');

    function summaryHTML(sc) {
      if (sc.style === 'gold') {
        return '<div class="m-sum">' +
            '<div class="m-plan">' +
              '<div class="m-row"><span class="lbl">' + sc.planLabel + ' - <span class="off">' + sc.off + '</span></span>' +
                '<span class="val"><span class="strike">' + sc.listPrice + '</span>' + sc.price + '</span></div>' +
              '<div class="m-subline">Full plan credits unlock (' + sc.unlock + ')</div>' +
            '</div>' +
            '<div class="m-div"></div>' +
            '<div class="m-row m-due"><span class="lbl">Due today</span><span class="val">' + sc.due + '</span></div>' +
          '</div>';
      }
      if (sc.style === 'seats') {
        return '<div class="m-sum">' +
            '<div class="m-row"><span class="lbl">' + sc.seatLabel + '</span><span class="val">' + sc.seatPrice + '</span></div>' +
            '<div class="m-row"><span class="sub">1 Pro seat added</span><span class="val muted">$0 today</span></div>' +
            '<div class="m-div"></div>' +
            '<div class="m-row m-due"><span class="lbl">Due today</span><span class="val">' + sc.due + '</span></div>' +
          '</div>';
      }
      return '<div class="m-sum">' +
          '<div class="m-plan">' +
            '<div class="m-row"><span class="lbl">' + sc.plan + '</span><span class="val">' + sc.price + '</span></div>' +
            '<div class="m-subline">Full plan credits unlock (' + sc.unlock + ')</div>' +
          '</div>' +
          '<div class="m-row"><span class="lbl reg">Tax</span><span class="val muted">' + sc.tax + '</span></div>' +
          '<div class="m-div"></div>' +
          '<div class="m-row m-due"><span class="lbl">Due today</span><span class="val">' + sc.due + '</span></div>' +
        '</div>';
    }

    function modalHTML(sc, o, i) {
      return '' +
        '<div class="modal ' + (sc.accent || '') + (o.rec ? ' is-rec' : '') + '">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="m-head">' +
            '<span class="m-title">' + o.title + '</span>' +
            '<button class="m-close">×</button>' +
          '</div>' +
          '<div class="m-body">' +
            (o.rec ? '<div class="rec-badge">★ Recommended</div>' : '') +
            '<div class="m-lead">' + o.lead + '</div>' +
            summaryHTML(sc) +
            '<label class="m-agree"><span class="box"></span><span>' + o.agree + ' ' + sc.renew + '</span></label>' +
            '<div class="m-acts">' +
              '<button class="btn btn-ghost">Cancel</button>' +
              '<button class="btn btn-primary">' + o.cta + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function render(key) {
      var sc = SCENARIOS[key];
      note.innerHTML = sc.note;
      grid.innerHTML = sc.opts.map(function (o, i) { return modalHTML(sc, o, i); }).join('');
    }

    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        render(t.dataset.sc);
      });
    });

    render('activate');
  </script>

  <!-- Agentation (local link toolbar) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Agentation } from 'agentation';
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  </script>
</body>
</html>
