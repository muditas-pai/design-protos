<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top bar · segments</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">
<style>
/* Centred in the header (user, 2026-10-16), independent of the left / right groups. */
.ts { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px 0 4px; border-radius: var(--r-control); background: rgb(var(--sunken)); font-size: 13px; line-height: 18px; color: rgb(var(--ink-3)); max-width: min(520px, calc(100% - 760px)); min-width: 300px; animation: fadeIn .25s var(--ease) both; }
.ts .lead { width: 28px; height: 28px; flex: none; border-radius: var(--r-control); background: rgb(var(--surface)); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--sh-hairline); }
.ts .lead .spinner { width: 14px; height: 14px; }
.ts .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts .txt b { color: rgb(var(--ink)); font-weight: 600; }
.ts .step.swap { display: inline-block; animation: stepIn .22s var(--ease) both; }
@keyframes stepIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ts .count { flex: none; font-variant-numeric: tabular-nums; color: rgb(var(--ink-2)); font-weight: 500; }
.ts.done { background: rgb(var(--good-bg)); }
.ts.done .txt b { color: rgb(var(--good)); }
/* Fade out with an animation: the fade-in animation's fill would otherwise pin opacity at 1. */
.ts.out { animation: tsOut .2s var(--ease) forwards; }
@keyframes tsOut { from { opacity: 1; } to { opacity: 0; } }
.ts .segs { flex: none; display: flex; gap: 3px; }
.ts .segs i { width: 10px; height: 6px; border-radius: 9999px; background: rgb(var(--line)); transition: background .2s var(--ease); }
.ts .segs i.on { background: rgb(var(--brand-600)); }
.ts .segs i.cur { background: rgb(var(--brand-600) / .35); animation: pulse 1s var(--ease) infinite alternate; }
@keyframes pulse { to { background: rgb(var(--brand-600) / .6); } }
.ts.done .segs i { background: rgb(var(--good)); animation: none; }
/* 10b: progress line along the bottom edge of the whole header */
.hline { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
.hline > span { display: block; height: 100%; width: 0; background: rgb(var(--brand-600)); transition: width .35s var(--ease), background .2s var(--ease), opacity .3s var(--ease); }
.hline.done > span { background: rgb(var(--good)); }
.floater-ph { width: 340px; height: 46px; border-radius: var(--r-card); }
.thumb.next { box-shadow: 0 0 0 1px rgb(var(--brand-600) / .5); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
const L = Loader, ui = L.mount({ index: 3, label: "10a", name: "Top bar · segments", topRight: L.SKELETON_RIGHT });
const MODE = "segments";
ui.thumbs.forEach((t) => t.classList.add("pending", "shimmer"));
ui.canvas.innerHTML = `<div class="shimmer" style="position:absolute;inset:0"></div>`;
ui.floater.innerHTML = `<span class="floater-ph shimmer"></span>`;
const CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgb(var(--good))" stroke-width="2.25"><path d="m5 12 5 5 9-10"/></svg>`;
const st = document.createElement("div");
st.className = "ts";
st.setAttribute("role", "status");
st.setAttribute("aria-live", "polite");
st.innerHTML = `<span class="lead"><span class="spinner"></span></span><span class="txt"><b data-h>Opening ${L.DECK_TITLE}</b> · <span class="step" data-t></span></span>` +
  (MODE === "segments" ? `<span class="segs" aria-hidden="true">${L.SLIDES.map(() => "<i></i>").join("")}</span>` : `<span class="count" data-n>0/8</span>`);
ui.bar.appendChild(st);
let line = null;
if (MODE === "line") {
  line = document.createElement("span");
  line.className = "hline";
  line.innerHTML = "<span></span>";
  ui.bar.appendChild(line);
}
const $ = (s) => st.querySelector(s);
let lastStep = "";
const set = (step, pct, landed) => {
  if (step !== lastStep) {
    const el = $("[data-t]");
    el.textContent = step;
    el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
    lastStep = step;
  }
  if (MODE === "segments") st.querySelectorAll(".segs i").forEach((s, j) => { s.className = j < landed ? "on" : j === landed && pct > 12 && landed < 8 ? "cur" : ""; });
  if (MODE === "line") { line.firstElementChild.style.width = pct + "%"; $("[data-n]").textContent = `${landed}/8`; }
};
(async () => {
  set("Reading 8 slides", 5, 0);
  await L.wait(900);
  set("Updating fonts and layouts", 12, 0);
  await L.wait(1000);
  for (let i = 0; i < 8; i++) {
    ui.thumbs[i].classList.add("next");
    set(i === 0 ? "Getting the first slide ready" : `Loading slide ${i + 1} of 8`, 12 + (i / 8) * 88, i);
    await L.wait(i === 0 ? 800 : 420);
    ui.thumbs[i].classList.remove("next");
    L.showThumb(ui, i);
    if (i === 0) L.showCanvas(ui, 0);
  }
  st.classList.add("done");
  if (line) line.classList.add("done");
  set("All 8 slides loaded", 100, 8);
  $("[data-h]").textContent = `${L.DECK_TITLE} is ready`;
  $(".lead").innerHTML = CHECK;
  await L.wait(1400);
  st.classList.add("out");
  if (line) line.firstElementChild.style.opacity = 0;
  await L.wait(220);
  st.remove();
  if (line) line.remove();
  // Editing (and the floater's edit tools) only turns on once every slide has loaded.
  L.setReadyBar(ui);
})();
</script>
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Agentation } from 'agentation';
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  </script>
</body>
</html>
