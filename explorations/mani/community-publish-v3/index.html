<!doctype html>
<!-- exploration: Community publish · owner: Mani (@manivasakan-arch)
     Separate link for the community publish flows. Same source as community-templates/index.html,
     opened with ?mode=community so only page, team page and visitor journeys show. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community publish v3</title>
<script>
  // Keep any extra params (e.g. ?j=p or ?s=refer) and default to the Has a page flow.
  var q = new URLSearchParams(location.search);
  q.set('mode', 'community');
  if (!q.has('j') && !q.has('s')) q.set('j', 'e');
  if (!q.has('keep')) q.set('reset', '');
  location.replace('../community-templates/v3.html?' + q.toString().replace('reset=', 'reset'));
</script>
</head>
<body style="font-family:Inter,system-ui,sans-serif;background:#fff;color:#525252;padding:24px">Opening Community publish…</body>
</html>
