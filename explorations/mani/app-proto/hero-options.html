<!doctype html>
<html lang="en" data-preferred-theme="light" data-editor-theme="design">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home top section options</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="pages.css?v=13">
<link rel="stylesheet" href="original.css?v=18">
<link rel="stylesheet" href="hero-options.css?v=18">
<style>
  :root,[data-preferred-theme="light"]{--canvas:#F5F5F5}
  [data-preferred-theme="dark"]{--canvas:#1E1E1E}
  html,body{height:auto}
  body{overflow:auto;background:var(--color-bg)}
  .ho-top{position:sticky;top:0;z-index:20;height:48px;display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--color-bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-border);white-space:nowrap}
  .ho-top b{font:600 14px/20px var(--font-family-default)}
  .ho-top .muted{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ho-top .grow{flex:1}
  .ho-top select{height:32px;border-radius:6px;border:0;box-shadow:inset 0 0 0 1px var(--color-border);background:var(--color-bg);color:var(--color-text);padding:0 8px;font:400 13px/18px var(--font-family-default)}
  .ho-wrap{max-width:1440px;margin:0 auto;padding:24px 24px 96px;display:flex;flex-direction:column;gap:20px}
  .ho{border:1px solid var(--color-border);border-radius:16px;overflow:hidden;background:var(--color-bg);scroll-margin-top:64px}
  .ho-h{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--color-border)}
  .ho-n{width:32px;height:32px;border-radius:16px;background:var(--color-bg-brand);color:#fff;display:flex;align-items:center;justify-content:center;font:600 14px/20px var(--font-family-default);flex:none}
  .ho-n.cur{background:var(--color-bg-tertiary);color:var(--color-text-secondary)}
  .ho-t{flex:1;min-width:0}
  .ho-t b{display:block;font:600 16px/24px var(--font-family-default)}
  .ho-t span{display:block;color:var(--color-text-secondary);font:400 13px/18px var(--font-family-default)}
  .ho-h a.btn{text-decoration:none}
  .ho-b{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:stretch}
  .ho-live{background:var(--canvas);padding:24px;min-width:0}
  .ho-frame{position:relative;width:100%;aspect-ratio:1366/657;overflow:hidden;border-radius:8px;background:var(--color-bg);box-shadow:0 0 0 1px var(--color-border),var(--o-sh-menu)}
  .ho-frame iframe{position:absolute;left:0;top:0;width:1366px;height:657px;border:0;transform:scale(var(--s,.5));transform-origin:0 0}
  .ho-size{margin-top:8px;font:400 12px/16px var(--font-family-default);color:var(--color-text-tertiary)}
  .ho-ref{margin:0;padding:16px;border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:10px}
  .ho-ref img{display:block;width:100%;border-radius:8px;box-shadow:0 0 0 1px var(--color-border)}
  .ho-ref figcaption{font:400 13px/18px var(--font-family-default);color:var(--color-text-secondary)}
  .ho-ref figcaption a{color:var(--color-text-brand);font-weight:500;text-decoration:none}
  .ho-ref figcaption a:hover{text-decoration:underline}
  .ho-ref .none{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--color-border-strong);border-radius:8px;color:var(--color-text-secondary);font:400 13px/18px var(--font-family-default);padding:16px}
  @media (max-width:1100px){.ho-b{grid-template-columns:1fr}.ho-ref{border-left:0;border-top:1px solid var(--color-border)}.ho-ref img{max-width:420px}}
  @media (max-width:640px){.ho-top .muted{display:none}.ho-wrap{padding:16px 16px 64px}.ho-live{padding:16px}}
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom": "https://esm.sh/react-dom@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
} }
</script>
</head>
<body>
<header class="ho-top">
  <b>Home top section · 3 options</b>
  <span class="muted">Each option on a full Home page at 1366×657, next to the Mobbin screen that inspired it.</span>
  <span class="grow"></span>
  <select id="jump" aria-label="Jump to an option"></select>
  <div class="seg" role="group" aria-label="Theme"><button data-th="light" aria-pressed="true">Light</button><button data-th="dark" aria-pressed="false">Dark</button></div>
  <a class="btn sm secondary" id="homeLink" href="./?view=dashboard&theme=light" style="text-decoration:none">Open Home</a>
</header>
<main class="ho-wrap" id="list"></main>
<div id="agentation-root"></div>
<script src="hero-options.js?v=16"></script>
<script>
  (function () {
    const list = document.getElementById('list'), jump = document.getElementById('jump');
    const qs = new URLSearchParams(location.search); let theme = qs.get('theme') === 'dark' ? 'dark' : 'light';
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function render() {
      list.innerHTML = HERO_OPTIONS.map(o => `<article class="ho" id="o${o.n}">
        <div class="ho-h"><span class="ho-n ${o.n ? '' : 'cur'}">${o.n || 'Now'}</span><div class="ho-t"><b>${o.n ? 'Option ' + o.n + ': ' : ''}${esc(o.name)}</b><span>${esc(o.idea)}</span></div>
          <a class="btn sm secondary" href="./?view=dashboard&theme=${theme}&hero=${o.n}" target="_blank" rel="noopener">Open full page</a></div>
        <div class="ho-b"><div class="ho-live"><div class="ho-frame"><iframe src="./?view=dashboard&theme=${theme}&hero=${o.n}&embed=1" title="Home page with option ${o.n}" loading="lazy"></iframe></div>
          <div class="ho-size">Home at 1366×657, the most common laptop screen. Buttons inside work.</div></div>
          <figure class="ho-ref">${o.ref ? `<a href="${o.ref.url}" target="_blank" rel="noopener"><img src="hero-refs/${o.ref.img}" alt="${esc(o.ref.app)} home screen, from Mobbin" loading="lazy"></a>
            <figcaption>Inspired by <b>${esc(o.ref.app)}</b> · <a href="${o.ref.url}" target="_blank" rel="noopener">Open on Mobbin</a></figcaption>` : '<div class="none">Your current hero, shown for comparison</div>'}</figure></div></article>`).join('');
      jump.innerHTML = HERO_OPTIONS.map(o => `<option value="o${o.n}">${o.n ? o.n + '. ' : ''}${esc(o.name)}</option>`).join('');
      document.getElementById('homeLink').href = `./?view=dashboard&theme=${theme}&hero=1`;
    }
    function setTheme(t) {
      theme = t; document.documentElement.setAttribute('data-preferred-theme', t);
      document.querySelectorAll('[data-th]').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === t));
      const p = new URLSearchParams(location.search); p.set('theme', t); history.replaceState(null, '', '?' + p + location.hash);
      render();
    }
    document.querySelectorAll('[data-th]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.th)));
    jump.addEventListener('change', () => document.getElementById(jump.value).scrollIntoView({ behavior: 'smooth', block: 'start' }));
    /* scale each 1366×657 Home preview to its block width */
    const fit = () => document.querySelectorAll('.ho-frame').forEach(f => f.style.setProperty('--s', f.clientWidth / 1366));
    addEventListener('resize', fit); new MutationObserver(fit).observe(list, { childList: true });
    setTheme(theme); fit();
  })();
</script>
<script type="module">
  try {
    const React = (await import('react')).default; const { createRoot } = await import('react-dom/client'); const { Agentation } = await import('agentation');
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  } catch (e) { console.warn('Agentation not loaded', e); }
</script>
</body>
</html>
