<!doctype html>
<html lang="en" class="public" data-preferred-theme="light" data-editor-theme="design">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations.AI prototype</title>
<script>(function(){var p=new URLSearchParams(location.search);if(!p.get('hero')){p.set('hero','1');history.replaceState(null,'','?'+p);}})();</script>
<script>/* ?embed=1: full-page preview inside the options gallery (no review bar, no Agentation) */ if (new URLSearchParams(location.search).get('embed')) document.documentElement.classList.add('embed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="editor.css?v=15">
<link rel="stylesheet" href="pages.css?v=13">
<link rel="stylesheet" href="original.css?v=18">
<link rel="stylesheet" href="hero-options.css?v=18">
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom": "https://esm.sh/react-dom@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "agentation": "https://esm.sh/agentation@3?deps=react@18.3.1,react-dom@18.3.1"
} }
</script>
</head>
<body>
<div class="review" role="toolbar" aria-label="Prototype controls">
  <b>Original + Figma colors</b>
  <span class="lbl">Screen</span>
  <div class="rseg" data-ctl="view"><button data-v="dashboard">Dashboard</button><button data-v="create">Create</button><button data-v="editor">Editor</button><button data-v="settings">Settings</button><button data-v="pricing">Pricing</button></div>
  <span class="lbl">Theme</span>
  <div class="rseg" data-ctl="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <span class="lbl">Look</span>
  <div class="rseg" id="lookSeg"><button data-look="figma" aria-pressed="false" data-tip="Figma UI3 look">Figma</button><button data-look="original" aria-pressed="true">Original</button></div>
  <span class="lbl">Top</span>
  <select id="heroSel" aria-label="Home top section option"></select>
  <a class="rbtn hlink" href="hero-options.html" data-tip="All 3 top section options with their Mobbin references">All options</a>
  <span class="lbl">State</span>
  <select id="stateSel" aria-label="Jump to a state"></select>
  <button class="rbtn" id="replayBtn" data-tip="Show this state again" aria-label="Show this state again"><i class="ph-light ph-arrow-counter-clockwise"></i></button>
  <span class="note" data-tip="Same screens and states as the Figma version. Sizes, spacing, radius, type and components follow the product design system (pitchdeckdoclist new_dev_migration). Only the colors come from the Figma UI3 tokens."><i class="ph-light ph-info"></i>About this version</span></div>

<div class="app" id="dash" data-view="dashboard"></div>
<div class="app" id="editor" data-view="editor"></div>
<div class="app" id="create" data-view="create"></div>
<div class="app" id="settings" data-view="settings"></div>
<div class="app" id="pricing" data-view="pricing"></div>

<div class="menu" id="menu" role="menu"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<div id="agentation-root"></div>
<script src="hero-options.js?v=16"></script>
<script>
  (function () {
    const sel = document.getElementById('heroSel'), cur = new URLSearchParams(location.search).get('hero') || '';
    const has = HERO_OPTIONS.some(o => String(o.n) === cur);
    sel.innerHTML = (has ? '' : '<option value="" disabled selected>Choose an option</option>') + HERO_OPTIONS.map(o => `<option value="${o.n}" ${String(o.n) === cur ? 'selected' : ''}>${o.n}. ${o.name}</option>`).join('');
    const go = n => { const p = new URLSearchParams(location.search); p.set('view', 'dashboard'); p.delete('state'); p.set('hero', n); location.search = p.toString(); };
    sel.addEventListener('change', () => go(sel.value));
    /* Floating tab bar at the bottom of Home: switch the top section option on the full page (hidden off Home and in embed) */
    const tabs = document.createElement('nav'); tabs.className = 'hx-tabs'; tabs.setAttribute('aria-label', 'Top section options');
    tabs.innerHTML = '<span class="lbl">Top section</span>' + HERO_OPTIONS.map(o => `<button data-hero="${o.n}" ${String(o.n) === cur ? 'aria-current="true"' : ''}><b>${o.n}</b>${o.name}</button>`).join('');
    tabs.addEventListener('click', e => { const b = e.target.closest('[data-hero]'); if (b && !b.hasAttribute('aria-current')) go(b.dataset.hero); });
    document.body.appendChild(tabs);
    const al = document.querySelector('.hlink'); al.addEventListener('click', e => { e.preventDefault(); const t = new URLSearchParams(location.search).get('theme') || 'light'; location.href = 'hero-options.html?theme=' + t; });
  })();
</script>
<script src="app.js"></script>
<script>document.querySelector('#lookSeg [data-look="figma"]').addEventListener('click', () => { location.href = '../' + location.search; });</script>
<script src="dashboard.js?v=17"></script>
<script src="share.js"></script>
<script src="create.js?v=14"></script>
<script src="settings.js"></script>
<script src="pricing.js"></script>
<script src="editor.js?v=15"></script>
<script type="module">
  if (!document.documentElement.classList.contains('embed')) try {
    const React = (await import('react')).default; const { createRoot } = await import('react-dom/client'); const { Agentation } = await import('agentation');
    createRoot(document.getElementById('agentation-root')).render(React.createElement(Agentation));
  } catch (e) { console.warn('Agentation not loaded', e); }
</script>
</body>
</html>
