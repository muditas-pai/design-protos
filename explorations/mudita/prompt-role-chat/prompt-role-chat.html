<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>" />
  <title>Prompt → Role → Chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../../design-system/pai.css" />

  <style>
    :root { --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-io: cubic-bezier(0.4, 0, 0.2, 1); }
    * { -webkit-font-smoothing: antialiased; }
    body { background: #f7f7f7; }

    .stage { display: none; }
    .stage.is-active { display: block; }
    .fade-in { animation: fadeIn .45s var(--ease-out) both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .fade-out { animation: fadeOut .3s var(--ease-io) both; }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }

    .nav-circle { width: 40px; height: 40px; border-radius: 44px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(11,15,20,.09); background: rgba(255,255,255,.85); color: var(--text-primary);
      box-shadow: 0 0 0 1px rgba(227,225,222,.25); transition: box-shadow .2s var(--ease-out); }
    .nav-circle:hover { box-shadow: 0 3px 10px rgba(11,15,20,.10); }
    .nav-circle:active { transform: scale(.94); transition: transform .1s var(--ease-out); }
    .nav-circle.sm { width: 36px; height: 36px; }

    /* prompt wrapper (Figma 160:1740) — brandkit strip + white input, flush layers */
    .prompt-wrap { background: #f5f5f5; border: 1px solid #d4d4d4; border-radius: 12px; padding: 0; overflow: hidden;
      box-shadow: 0 1px 2px rgba(11,15,20,.09), 0 4px 6px rgba(11,15,20,.09), 0 24px 40px -16px rgba(11,15,20,.09);
      transition: box-shadow .4s var(--ease-out); }
    /* centred group, balanced space above/below the text */
    .brandkit-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; }
    /* white input sits flush inside the wrap; a top border is the divider */
    .prompt-inner { background: #fff; border-top: 1px solid #d4d4d4; padding: 16px; min-height: 148px;
      display: flex; flex-direction: column; justify-content: space-between; }

    .tool-btn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 4px; background: #fff;
      box-shadow: 0 0 0 1px rgba(11,15,20,.09), 0 1px 2px 1px rgba(11,15,20,.06), inset 0 0 0 1px rgba(255,255,255,.8);
      font-size: 12px; font-weight: 500; color: var(--text-primary); cursor: pointer; white-space: nowrap; }
    .tool-btn.icon { padding: 0; width: 28px; justify-content: center; }
    .btn-create { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 4px; cursor: pointer;
      background: #0b0f14; color: #fff; font-size: 12px; font-weight: 500; white-space: nowrap;
      box-shadow: 0 0 0 1px rgba(11,15,20,.06), 0 1px 2px rgba(11,15,20,.09); transition: opacity .18s var(--ease-out), transform .1s var(--ease-out); }
    .btn-create:active { transform: scale(.96); transition-duration: .1s; }
    .btn-create.dim { opacity: .4; pointer-events: none; }
    .tool-btn:active { transform: scale(.96); transition: transform .1s var(--ease-out); }

    /* action pills (Figma 160:1772) */
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px; border-radius: 24px; background: #fff; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(11,15,20,.06), 0 2px 6px rgba(11,15,20,.09), inset 0 0 0 1px rgba(255,255,255,.8); transition: box-shadow .15s var(--ease-out), transform .1s var(--ease-out); }
    .pill:hover { box-shadow: 0 0 0 1px rgba(11,15,20,.12), 0 4px 12px rgba(11,15,20,.10); transform: translateY(-1px); }
    .pill:active { transform: scale(.97); transition-duration: .1s; }
    .pill .picon { width: 40px; height: 40px; border-radius: 34px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    /* filled phosphor chip icons, clipped to the brand blue radial gradient */
    .chip-ico { background: radial-gradient(162.36% 178.84% at 13.64% -1.28%, var(--brand-100, #C2D8FF) 0%, var(--brand-300, #5291FF) 31.73%, var(--brand-600, #0055ED) 76.78%, var(--brand-900, #00225C) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .badge-pro { background: #e6efff; color: #005eff; }
    .badge-gold { background: #fef3c7; color: #92400e; }
    .mini-badge { font-size: 10px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; border-radius: 34px; padding: 2px 6px; line-height: 1.33; }

    /* suggestion rows (Figma 160:1607) */
    .sugg { transition: box-shadow .15s var(--ease-out), transform .12s var(--ease-out);
      box-shadow: 0 0 0 1px rgba(11,15,20,.09), 0 1px 2px rgba(11,15,20,.09), inset 0 0 0 1px rgba(255,255,255,.8); }
    .sugg:hover { box-shadow: 0 0 0 1px rgba(11,15,20,.14), 0 4px 10px -2px rgba(11,15,20,.08); transform: translateY(-1px); }
    .sugg .sicon { width: 24px; height: 24px; border-radius: 4px; background: #fff; display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(11,15,20,.06), 0 1px 2px rgba(11,15,20,.09); font-size: 14px; }

    /* compact prompt pill in role stage (Figma 183:667) */
    .prompt-pill { background: #fff; border: 1px solid #d4d4d4; border-radius: 12px; padding: 16px 20px;
      box-shadow: 0 1px 2px rgba(11,15,20,.06), 0 1px 2px rgba(11,15,20,.05); }

    /* role cards (Figma 160:1973): equal-width grid, single line, title truncates */
    .role-cell { position: relative; }
    .role-card { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 16px; width: 100%; overflow: hidden;
      background: #fff; border: none; border-radius: 4px; cursor: pointer; text-align: left;
      box-shadow: 0 0 0 1px rgba(26,26,26,.09), 0 1px 2px 0 rgba(26,26,26,.09), inset 0 0 0 1px rgba(255,255,255,.8);
      transition: box-shadow .18s var(--ease-out), transform .08s var(--ease-out); }
    .role-card:hover { box-shadow: 0 0 0 1px rgba(26,26,26,.16), 0 3px 10px -2px rgba(26,26,26,.12), inset 0 0 0 1px rgba(255,255,255,.8); }
    .role-card:active { transform: scale(.97); transition-duration: .1s; }
    .role-card .r-emoji { font-size: 18px; line-height: 1; flex: none; display: inline-flex; align-items: center; }
    /* leading slot swaps emoji → check on select, so width never changes */
    .role-card .r-emoji .r-check-ico { font-size: 18px; color: #0A1925; animation: checkIn .3s var(--ease-out) both; }
    .role-card .r-label { font-size: 16px; font-weight: 400; line-height: 1.5; color: var(--text-primary);
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .role-card.is-open { z-index: 40; }
    /* selected state after a designation is picked */
    .role-card.selected { box-shadow: 0 0 0 1.5px #0A1925, 0 3px 12px -2px rgba(10,25,37,.18), inset 0 0 0 1px rgba(255,255,255,.8); }
    .role-card.selected .r-label { font-weight: 500; }
    /* contextual icon entrance (make-interfaces): scale .25→1, opacity, blur 4→0 */
    @keyframes checkIn { from { opacity: 0; transform: scale(.25); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

    /* fixed frosted footer CTA: gray→transparent gradient + masked gaussian blur */
    .role-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; pointer-events: none; }
    .role-footer::before { content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, #f7f7f7 18%, rgba(247,247,247,.6) 58%, rgba(247,247,247,0) 100%);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      -webkit-mask-image: linear-gradient(to top, #000 32%, transparent 96%);
      mask-image: linear-gradient(to top, #000 32%, transparent 96%); }
    .role-footer-inner { position: relative; display: flex; justify-content: center; padding: 60px 24px 26px; }
    .footer-cta { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center;
      min-width: 240px; height: 48px; padding: 0 28px; border-radius: 10px; cursor: pointer;
      background: #0A1925; color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -0.1px;
      box-shadow: 0 1px 2px rgba(11,15,20,.18), 0 8px 24px -8px rgba(11,15,20,.35);
      transition: transform .12s var(--ease-out), box-shadow .18s var(--ease-out); }
    .footer-cta:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(11,15,20,.2), 0 12px 30px -8px rgba(11,15,20,.42); }
    .footer-cta:active { transform: scale(.97); transition-duration: .1s; }

    /* in-place designation dropdown (Figma 183:785 "menu"): overlays the card, matches its width */
    .desig-pop { position: absolute; top: -6px; left: 0; right: 0; z-index: 40; background: #fff; border-radius: 8px;
      display: flex; flex-direction: column; gap: 8px; padding: 8px;
      box-shadow: 0 0 0 1px rgba(11,15,20,.09), 0 1px 2px 0 rgba(11,15,20,.09), 0 4px 6px 0 rgba(11,15,20,.09), 0 24px 40px -16px rgba(11,15,20,.09), inset 0 0 0 1px rgba(255,255,255,.8);
      transform-origin: top center; animation: popIn .2s var(--ease-out) both; }
    @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } to { opacity: 1; transform: none; } }
    /* active-input field: strong outer ring (border/secondary-inverted 0.48) + inner border/tertiary */
    .desig-search { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px; background: #fff;
      box-shadow: 0 0 0 1px rgba(11,15,20,.48), 0 1px 1px 0 rgba(11,15,20,.09), inset 0 0 0 1px rgba(11,15,20,.06); }
    .desig-search input { flex: 1; min-width: 0; background: transparent; outline: none; border: none;
      font-size: 14px; line-height: 1.43; color: var(--text-primary); }
    .desig-search input::placeholder { color: #a3a3a3; }
    .desig-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .desig-opt { display: block; width: 100%; text-align: left; padding: 8px; border-radius: 4px; font-size: 14px; line-height: 1.43;
      color: #000; cursor: pointer; transition: background .1s var(--ease-out); }
    .desig-opt.active { background: #f5f5f5; }
    .desig-opt .use-q { color: var(--text-tertiary); }

    .role-card.entering { animation: cardIn .4s var(--ease-out) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* shimmer sweep over text */
    .shimmer { background: linear-gradient(90deg, rgba(115,115,115,.9) 0%, rgba(115,115,115,.9) 40%, rgba(23,23,23,1) 50%, rgba(115,115,115,.9) 60%, rgba(115,115,115,.9) 100%);
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* Tyo's PaiLoader mount (120px tile scaled to 20px, centred in a 20px slot) */
    .mini { width: 20px; height: 20px; position: relative; flex: 0 0 20px; }
    .mini .pai-loader { position: absolute; left: -50px; top: -50px; }

    .bubble-in { animation: bubbleIn .42s var(--ease-out) both; }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    textarea.prompt { resize: none; outline: none; }
    .proto-bar { backdrop-filter: blur(8px); background: rgba(255,255,255,.82); }

    h1, .role-heading { text-wrap: balance; }

    /* Reduced motion: keep opacity/comprehension, drop movement + scale */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .fade-in, .bubble-in, .role-card.entering, .desig-pop { animation: none !important; }
      .role-card:active, .footer-cta:active, .pill:active, .btn-create:active, .tool-btn:active, .nav-circle:active { transform: none !important; }
      .shimmer { animation: none !important; background: none; -webkit-background-clip: initial; background-clip: initial; color: var(--text-tertiary); }
    }
  </style>
</head>

<body class="pai">

  <!-- proto control bar -->
  <div class="proto-bar fixed top-0 left-0 right-0 z-[100] border-b border-border-tertiary flex items-center gap-3 px-4 h-11">
    <span class="text-body-xs-semibold text-text-tertiary uppercase" style="letter-spacing:.06em">Proto</span>
    <span class="text-body-sm-medium text-text-secondary hidden md:inline">Prompt → Role → Chat</span>
    <span class="text-body-xs-medium text-text-tertiary hidden lg:inline ml-1">JAS Figma 160:1834</span>
    <div class="ml-auto flex items-center gap-1">
      <button onclick="restart()" class="button-style button-small button-ghost"><i class="ph ph-arrow-counter-clockwise mr-1"></i>Restart</button>
    </div>
  </div>

  <!-- ===== STAGE: prompt → loader → role (one morphing screen) ===== -->
  <section class="stage is-active" id="stage-create">
    <div class="min-h-screen w-full pt-11">
      <div class="w-full flex items-center" style="padding:28px 80px">
        <button class="nav-circle"><i class="ph ph-arrow-left text-[18px]"></i></button>
        <button class="nav-circle ml-auto"><i class="ph ph-x text-[18px]"></i></button>
      </div>

      <div class="w-full max-w-[800px] mx-auto px-6">
        <h1 class="text-center text-[32px] leading-[1.1] tracking-[-0.24px] font-normal text-text-primary mt-4">Describe your deck, or upload a file</h1>

        <!-- morph zone: prompt wrap ⇄ compact pill -->
        <div id="morphZone" class="mt-8"></div>

        <!-- role zone (hidden until loader done) -->
        <div id="roleZone" class="mt-7 max-w-[680px] mx-auto" style="display:none; padding-bottom:140px">
          <p class="role-heading text-center text-text-primary" style="font-size:18px; font-weight:500; line-height:1">Tailor this deck to your role</p>
          <div id="roleGrid" class="grid grid-cols-3 gap-4 mt-6"></div>
        </div>

        <!-- 4 action pills -->
        <div id="chipRow" class="flex items-center gap-3 mt-6">
          <button class="pill"><span class="picon"><i class="ph-fill ph-microsoft-powerpoint-logo chip-ico text-[20px]"></i></span><span class="text-body-base-medium text-text-primary">Import PowerPoint</span></button>
          <button class="pill"><span class="picon"><i class="ph-fill ph-pen-nib chip-ico text-[20px]"></i></span><span class="text-body-base-medium text-text-primary">Hire an Expert</span></button>
          <button class="pill"><span class="picon"><i class="ph-fill ph-layout chip-ico text-[20px]"></i></span><span class="text-body-base-medium text-text-primary">Use a Template</span></button>
          <button class="pill"><span class="picon"><i class="ph-fill ph-chart-donut chip-ico text-[20px]"></i></span><span class="text-body-base-medium text-text-primary whitespace-nowrap">Refresh Data</span><span class="mini-badge badge-gold ml-1">Gold</span></button>
        </div>

        <!-- suggestions -->
        <div class="mt-10 pb-16" id="suggBlock">
          <p class="text-body-base-medium text-text-primary mb-3">Marketers are creating presentations for</p>
          <div class="space-y-3" id="suggList"></div>
        </div>
      </div>

      <!-- fixed frosted footer CTA — the only path into chat -->
      <div class="role-footer" id="roleFooter" style="display:none">
        <div class="role-footer-inner">
          <button class="footer-cta" onclick="footerCreate()">Create Presentation</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== STAGE: chat ===== -->
  <section class="stage" id="stage-chat">
    <div class="min-h-screen w-full pt-11">
      <div class="w-full flex items-center" style="padding:16px 80px">
        <button onclick="restart()" class="nav-circle sm"><i class="ph ph-arrow-left text-[17px]"></i></button>
        <button class="nav-circle sm ml-auto"><i class="ph ph-x text-[17px]"></i></button>
      </div>
      <div class="w-full max-w-[600px] mx-auto px-6 pb-24" id="chatCol">
        <!-- populated on entry -->
      </div>
    </div>
  </section>

  <script>
    // ---------- Data ----------
    const suggestions = [
      { icon: "📊", text: "Q4 performance review with channel ROI breakdown" },
      { icon: "🚀", text: "Go-to-market deck for a new product launch" },
      { icon: "🎨", text: "Brand refresh pitch to leadership" },
    ];
    // 3×4 grid, column-major order matching Figma 160:1957
    const roles = [
      { label: "Consulting",     icon: "🧭" },
      { label: "HR",             icon: "🧑‍🤝‍🧑" },
      { label: "Product",        icon: "🧩" },
      { label: "Design",         icon: "🎨" },
      { label: "Sales",          icon: "📈" },
      { label: "Engineering",    icon: "🛠️" },
      { label: "Marketing",      icon: "📣" },
      { label: "Finance",        icon: "💰" },
      { label: "Investor",       icon: "📊" },
      { label: "Legal",          icon: "⚖️" },
      { label: "Operations",     icon: "⚙️" },
      { label: "Communications", icon: "💬" },
    ];
    const designations = {
      Consulting:     ["Analyst","Associate Consultant","Consultant","Senior Consultant","Engagement Manager","Principal","Partner"],
      HR:             ["HR Manager","HR Business Partner","Recruiter","Talent Acquisition Manager","People Operations Manager","Head of People","CHRO"],
      Product:        ["Product Manager","Senior Product Manager","Product Owner","Group Product Manager","Director of Product","VP Product","Chief Product Officer"],
      Design:         ["Product Designer","UX Designer","UI Designer","Design Lead","Design Manager","Head of Design","Creative Director"],
      Sales:          ["Account Executive","Sales Manager","Sales Development Rep","Account Manager","Regional Sales Manager","VP Sales","Chief Revenue Officer"],
      Engineering:    ["Software Engineer","Senior Software Engineer","Engineering Manager","Staff Engineer","Tech Lead","Director of Engineering","CTO"],
      Marketing:      ["Marketing Manager","Brand Manager","Performance Marketing Manager","Content Marketing Manager","Growth Marketing Manager","Product Marketing Manager","Director of Marketing","VP Marketing","CMO"],
      Finance:        ["Financial Analyst","Finance Manager","Controller","FP&A Manager","Director of Finance","VP Finance","CFO"],
      Investor:       ["Analyst","Associate","Principal","Investment Manager","Partner","General Partner","Managing Director"],
      Legal:          ["Legal Counsel","Corporate Counsel","Paralegal","Compliance Manager","General Counsel","Head of Legal"],
      Operations:     ["Operations Analyst","Operations Manager","Business Operations Manager","Director of Operations","VP Operations","COO"],
      Communications: ["Communications Specialist","PR Manager","Corporate Communications Manager","Content Strategist","Head of Communications","VP Communications"],
    };

    // ---------- State ----------
    let promptText = "";
    let openRole = null;   // label of the card currently expanded
    let activeIdx = 0;     // highlighted option index in the open dropdown
    let selected = { role: null, title: null }; // the picked role + designation

    // ---------- Stage helpers ----------
    function showStage(id) {
      document.querySelectorAll(".stage").forEach(s => s.classList.remove("is-active"));
      document.getElementById(id).classList.add("is-active");
      window.scrollTo({ top: 0 });
    }
    function restart() {
      promptText = ""; openRole = null; activeIdx = 0; selected = { role: null, title: null };
      document.getElementById("morphZone").innerHTML = promptWrapHTML();
      document.getElementById("roleFooter").style.display = "none";
      document.getElementById("roleZone").style.display = "none";
      document.getElementById("roleGrid").innerHTML = "";
      document.getElementById("chipRow").style.display = "";
      document.getElementById("chipRow").classList.remove("fade-out");
      document.getElementById("suggBlock").style.display = "";
      document.getElementById("suggBlock").classList.remove("fade-out");
      document.getElementById("chatCol").innerHTML = "";
      wirePrompt();
      showStage("stage-create");
    }

    // ---------- Prompt wrapper (JAS 160:1595) ----------
    function promptWrapHTML() {
      return `
      <div id="promptCard" class="prompt-wrap">
        <div class="brandkit-bar">
          <i class="ph ph-book-open-text text-[17px] text-text-secondary"></i>
          <span class="text-body-base-medium text-text-secondary">Set up Brand Kit to use your logo, colours, and voice</span>
          <span class="mini-badge badge-pro">Pro</span>
          <i class="ph ph-caret-right text-[15px] text-text-tertiary ml-0.5"></i>
        </div>
        <div class="prompt-inner">
          <textarea id="promptInput" rows="1" class="prompt w-full text-text-primary bg-transparent placeholder:text-text-tertiary" style="font-size:20px; line-height:1.4; padding:8px;" placeholder="Start a new presentation..."></textarea>
          <div class="prompt-toolbar flex items-center gap-2 mt-3">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <button class="tool-btn"><i class="ph ph-upload-simple text-[15px]"></i>Upload files, or links</button>
              <button class="tool-btn"><i class="ph ph-cards-three text-[15px]"></i>5 Slides<i class="ph ph-caret-down text-[11px] text-text-tertiary ml-0.5"></i></button>
              <button class="tool-btn"><i class="ph ph-sparkle text-[15px]"></i>Standard Model<i class="ph ph-caret-down text-[11px] text-text-tertiary ml-0.5"></i></button>
              <button class="tool-btn icon"><i class="ph ph-sliders-horizontal text-[15px]"></i></button>
            </div>
            <button id="createBtn" class="btn-create dim" onclick="startLoader()">Continue</button>
          </div>
        </div>
      </div>`;
    }
    function wirePrompt() {
      const inp = document.getElementById("promptInput");
      inp.addEventListener("input", onType);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (inp.value.trim()) startLoader(); } });
      autosize(inp);
    }
    function autosize(t) { t.style.height = "auto"; t.style.height = Math.max(32, t.scrollHeight) + "px"; }
    function onType() {
      const inp = document.getElementById("promptInput");
      autosize(inp);
      document.getElementById("createBtn").classList.toggle("dim", inp.value.trim().length === 0);
    }
    function renderSuggestions() {
      document.getElementById("suggList").innerHTML = suggestions.map(s => `
        <button onclick="pickSuggestion('${s.text.replace(/'/g,"\\'")}')"
          class="sugg w-full flex items-center gap-2 rounded-lg bg-bg-elevated pl-3 pr-4 py-3 text-left">
          <span class="sicon">${s.icon}</span>
          <span class="text-body-base-regular text-text-primary">${s.text}</span>
        </button>`).join("");
    }
    function pickSuggestion(t) {
      const inp = document.getElementById("promptInput"); if (inp) { inp.value = t; onType(); }
      startLoader();
    }

    // ---------- Loader (≈3s shimmer over the typed text) ----------
    // Keeps the prompt box + its toolbar/options intact; only sweeps a shimmer
    // over the text while it "reads", then restores the editable box.
    function startLoader() {
      const inp = document.getElementById("promptInput");
      promptText = (inp ? inp.value.trim() : "") || "Create a pitchdeck for my ceramics collectibles business";

      // fade out landing extras (pills + suggestions)
      ["chipRow","suggBlock"].forEach(id => {
        const el = document.getElementById(id); el.classList.add("fade-out");
        setTimeout(() => { el.style.display = "none"; }, 300);
      });

      // shimmer over the text — swap the textarea for a shimmering line, keep the toolbar
      const ta = document.getElementById("promptInput");
      ta.style.display = "none";
      const sh = document.createElement("p");
      sh.id = "loadShimmer"; sh.className = "shimmer";
      sh.style.cssText = "font-size:20px; line-height:1.4; padding:8px; margin:0";
      sh.textContent = promptText;
      ta.parentNode.insertBefore(sh, ta);
      const create = document.getElementById("createBtn");
      create.classList.add("dim"); create.textContent = "Reading your prompt…";

      setTimeout(revealRoles, 3000);
    }

    // ---------- Role step: keep the editable prompt box, reveal role grid below ----------
    function revealRoles() {
      // restore the editable textarea with the prompt still in it
      const sh = document.getElementById("loadShimmer"); if (sh) sh.remove();
      const ta = document.getElementById("promptInput");
      if (ta) { ta.style.display = ""; ta.value = promptText; autosize(ta); }
      const create = document.getElementById("createBtn");
      if (create) { create.textContent = "Continue"; create.classList.remove("dim"); }

      // reveal the role zone + stagger the cards in
      selected = { role: null, title: null };
      const zone = document.getElementById("roleZone");
      zone.style.display = "";
      zone.classList.add("fade-in");
      renderRoleGrid();

      // show the fixed footer CTA (the only path into chat)
      const footer = document.getElementById("roleFooter");
      footer.style.display = "";
      footer.classList.add("fade-in");
    }

    // Full render — only on first reveal (runs the entrance stagger once).
    function renderRoleGrid() {
      const grid = document.getElementById("roleGrid");
      grid.innerHTML = roles.map((r, i) => `
        <div class="role-cell" data-role="${r.label}">
          <button class="role-card entering" style="animation-delay:${i*30}ms" onclick="openDropdown('${r.label}')">
            <span class="r-emoji">${r.icon}</span>
            <span class="r-label">${escapeHtml(r.label)}</span>
          </button>
        </div>`).join("");
    }

    // Reflect selection IN PLACE — never re-render the grid (that re-plays the
    // entrance stagger). The leading emoji slot swaps to a check on select (so
    // width never changes); the label shows the title, truncated by CSS.
    function applySelection() {
      document.querySelectorAll(".role-cell").forEach(cell => {
        const role = cell.dataset.role;
        const card = cell.querySelector(".role-card");
        const isSel = selected.role === role;
        card.classList.toggle("selected", isSel);
        const emoji = cell.querySelector(".r-emoji");
        emoji.innerHTML = isSel ? `<i class="ph-fill ph-check-circle r-check-ico"></i>` : roleIcon(role);
        cell.querySelector(".r-label").textContent = isSel && selected.title ? selected.title : role;
      });
    }
    function roleIcon(label) { const r = roles.find(x => x.label === label); return r ? r.icon : ""; }

    // ---------- Designation dropdown — a menu anchored below the chip (Figma 183:766) ----------
    function openDropdown(label) {
      if (openRole === label) return;
      closeDropdown();
      openRole = label; activeIdx = 0;
      // reopening a selected chip? land the highlight on the chosen title
      if (selected.role === label && selected.title) {
        const idx = (designations[label] || []).findIndex(d => d.toLowerCase() === selected.title.toLowerCase());
        if (idx >= 0) activeIdx = idx;
      }
      const cell = document.querySelector(`.role-cell[data-role="${label}"]`);
      cell.querySelector(".role-card").classList.add("is-open");
      cell.style.zIndex = "60"; // float this chip + its menu above the others AND the footer (z-50)
      const pop = document.createElement("div");
      pop.className = "desig-pop";
      pop.innerHTML = `
        <div class="desig-search">
          <i class="ph ph-magnifying-glass text-text-tertiary text-[15px]"></i>
          <input id="desigInput" autocomplete="off" placeholder="Your designation" />
        </div>
        <div class="desig-list" id="desigList"></div>`;
      cell.appendChild(pop);
      renderDesigList("");
      // bring the highlighted (previously selected) item into view
      document.querySelectorAll("#desigList .desig-opt")[activeIdx]?.scrollIntoView({ block: "nearest" });
      const input = pop.querySelector("#desigInput");
      input.addEventListener("input", () => { activeIdx = 0; renderDesigList(input.value); });
      input.addEventListener("keydown", onDesigKey);
      setTimeout(() => input.focus(), 30);
    }
    function currentList(filter) {
      const f = (filter || "").toLowerCase().trim();
      const base = designations[openRole] || [];
      const matches = base.filter(d => d.toLowerCase().includes(f));
      // free-text fallback so any typed title is accepted
      if (f && !base.some(d => d.toLowerCase() === f)) matches.push({ free: filter.trim() });
      return matches;
    }
    function renderDesigList(filter) {
      const list = currentList(filter);
      if (activeIdx >= list.length) activeIdx = Math.max(0, list.length - 1);
      const el = document.getElementById("desigList");
      if (!list.length) { el.innerHTML = `<div class="desig-opt text-text-tertiary">Type your title…</div>`; return; }
      el.innerHTML = list.map((d, i) => {
        const isFree = typeof d === "object";
        const val = isFree ? d.free : d;
        const inner = isFree ? `Use "<span class="text-text-primary">${escapeHtml(val)}</span>"` : escapeHtml(val);
        return `<button class="desig-opt ${i===activeIdx?'active':''} ${isFree?'use-q':''}" data-i="${i}"
                  onmouseenter="setActive(${i})" onclick="pickDesignation()">${inner}</button>`;
      }).join("");
    }
    function setActive(i) {
      activeIdx = i;
      document.querySelectorAll("#desigList .desig-opt").forEach((o, k) => o.classList.toggle("active", k===i));
    }
    function onDesigKey(e) {
      const input = e.target;
      const list = currentList(input.value);
      if (e.key === "ArrowDown") { e.preventDefault(); activeIdx = Math.min(list.length-1, activeIdx+1); renderDesigList(input.value); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeIdx = Math.max(0, activeIdx-1); renderDesigList(input.value); }
      else if (e.key === "Enter") { e.preventDefault(); pickDesignation(); }
      else if (e.key === "Escape") { closeDropdown(); }
    }
    function pickDesignation() {
      const input = document.getElementById("desigInput");
      const list = currentList(input ? input.value : "");
      if (!list.length) return;
      const chosen = list[activeIdx];
      const title = typeof chosen === "object" ? chosen.free : chosen;
      // select — do NOT navigate. The footer CTA is the only path into chat.
      selected = { role: openRole, title };
      closeDropdown();
      applySelection();
    }
    function closeDropdown() {
      if (!openRole) return;
      const cell = document.querySelector(`.role-cell[data-role="${openRole}"]`);
      if (cell) { cell.querySelector(".desig-pop")?.remove(); cell.querySelector(".role-card")?.classList.remove("is-open"); cell.style.zIndex = ""; }
      openRole = null;
    }
    document.addEventListener("click", (e) => {
      if (openRole && !e.target.closest(".role-cell")) closeDropdown();
    });

    // ---------- Tyo's PaiLoader (inlined from explorations/tyo/loader/chat-prototype.html) ----------
    let __paiUid = 0;
    function createPaiLoader(mount, options = {}) {
      const N = 8, RADIUS = 29.25, DW = 19.5, DH = 15.6;
      const LOGO = {
        big:   { x: 21, y: 21,  w: 72, h: 54, o: 1 },
        small: { x: 21, y: 69,  w: 45, h: 33, o: 1 },
        enter: { x: 21, y: 101, w: 20, h: 15, o: 0 },
      };
      const ROLE = { small: 3, big: 4, enter: 5 };
      const APPEAR_ORDER = [3, 4, 5, 6, 7, 0, 1, 2];
      const STAGGER = 0.08, MORPH = 0.55;
      const EXP = [41.4, 1], COL = [4, 0.8], NORM = [RADIUS, 1];
      const VARIANTS = {
        classic:        [NORM, NORM, NORM, NORM],
        pulseOut:       [NORM, NORM, EXP,  EXP ],
        pulseIn:        [NORM, NORM, COL,  COL ],
        heartbeat:      [NORM, COL,  EXP,  COL ],
        expandCollapse: [NORM, EXP,  EXP,  COL ],
      };
      const cfg = Object.assign({
        speed: 1.8, hold: 31, slant: 25, radius: 2, scale: 1, spin: 40,
        easing: 'cubic-bezier(0.45,0,0.2,1)', color: '#2f2be5', background: '#fff',
      }, options.config);
      const phases = Object.assign({
        idle:       { state: 'logo' },
        thinking:   { state: 'spinner', variant: 'random' },
        searching:  { state: 'spinner', variant: 'random' },
        reasoning:  { state: 'spinner', variant: 'random' },
        generating: { state: 'spinner', variant: 'random' },
        done:       { state: 'logo', still: true },
      }, options.phases);
      const ns = 'pai' + (++__paiUid);
      const el = document.createElement('div');
      el.className = `pai-loader ${ns}`;
      el.setAttribute('role', 'status');
      el.setAttribute('aria-label', 'Loading');
      const ring = document.createElement('div');
      ring.className = 'ring';
      el.appendChild(ring);
      mount.appendChild(el);
      const dashes = [];
      for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'dash'; ring.appendChild(d); dashes.push(d); }
      const styleStatic = document.head.appendChild(document.createElement('style'));
      const styleKf = document.head.appendChild(document.createElement('style'));
      const styleOrbit = document.head.appendChild(document.createElement('style'));
      styleStatic.textContent = `
        .${ns} { width:120px; height:120px; position:relative; overflow:hidden; transform-origin:center; }
        .${ns} .ring { position:absolute; inset:0; transform-origin:50% 50%; }
        .${ns} .ring.spin { animation:${ns}ringspin var(--speed) infinite; }
        .${ns} .dash { position:absolute; left:0; top:0; background:var(--blue); border-radius:var(--radius); transform-origin:50% 50%; will-change:transform,opacity; }
        .${ns} .dash.cascade { animation:${ns}cascade var(--speed) infinite; }
        .${ns} .dash.orbit { animation-duration:var(--orbitDur); animation-iteration-count:infinite; }
        .${ns}.morphing .dash { transition:transform var(--morph) var(--ease), width var(--morph) var(--ease), height var(--morph) var(--ease), opacity var(--morph) var(--ease); }
        .${ns}.morphing .ring { transition:transform var(--morphTotal) var(--ease); }
      `;
      const sk = (w, h) => { const sh = h * cfg.slant / 100; return { h2: h - sh, dy: sh / 2, ang: -(Math.atan2(sh, w) * 180 / Math.PI) }; };
      const slotPose = i => {
        const a = i * 360 / N, r = a * Math.PI / 180, k = sk(DW, DH);
        return { t: `translate(${(60 + RADIUS * Math.cos(r) - DW / 2).toFixed(2)}px,${(60 + RADIUS * Math.sin(r) - k.h2 / 2).toFixed(2)}px) rotate(${a}deg) skewY(${k.ang.toFixed(2)}deg)`, w: DW, h: k.h2 };
      };
      const setStyle = (d, t, w, h, o) => { d.style.transform = t; d.style.width = w + 'px'; d.style.height = h + 'px'; d.style.opacity = o; };
      const applyLogoPose = i => {
        const role = Object.keys(ROLE).find(k => ROLE[k] === i);
        if (role) { const p = LOGO[role], k = sk(p.w, p.h); setStyle(dashes[i], `translate(${p.x}px,${(p.y + k.dy).toFixed(2)}px) skewY(${k.ang.toFixed(2)}deg)`, p.w, k.h2, p.o); }
        else { const s = slotPose(i); setStyle(dashes[i], s.t + ' scale(0.4)', s.w, s.h, 0); }
      };
      const applySpinnerPose = i => { const s = slotPose(i); setStyle(dashes[i], s.t, s.w, s.h, 1); };
      const orbitT = (i, [r, sc]) => {
        const a = i * 360 / N, rad = a * Math.PI / 180, k = sk(DW, DH);
        return `translate(${(60 + r * Math.cos(rad) - DW / 2).toFixed(2)}px,${(60 + r * Math.sin(rad) - k.h2 / 2).toFixed(2)}px) rotate(${a}deg) scale(${sc}) skewY(${k.ang.toFixed(2)}deg)`;
      };
      function buildCSS() {
        const ease = `animation-timing-function:${cfg.easing};`;
        const seg3 = 100 / 3, arr3 = k => (k * seg3 + seg3 * (100 - cfg.hold) / 100).toFixed(2);
        const cpose = (x, y, w, h, o) => { const k = sk(w, h); return `transform:translate(${x}px,${(y + k.dy).toFixed(2)}px) skewY(${k.ang.toFixed(2)}deg); width:${w}px; height:${k.h2.toFixed(2)}px; opacity:${o};`; };
        let css = `@keyframes ${ns}cascade {
          0% { ${cpose(21, 101, 20, 15, 0)} ${ease} }
          ${arr3(0)}%, 33.33% { ${cpose(21, 69, 45, 33, 1)} ${ease} }
          ${arr3(1)}%, 66.67% { ${cpose(21, 21, 72, 54, 1)} ${ease} }
          ${arr3(2)}%, 100% { ${cpose(21, 21, 16, 12, 0)} }
        }\n`;
        const SEGS = N + 1, seg = 100 / SEGS;
        const at = k => (k * seg).toFixed(3), arr = k => (k * seg + seg * (100 - cfg.hold) / 100).toFixed(3);
        css += `@keyframes ${ns}ringspin {\n`;
        for (let k = 0; k < SEGS; k++) {
          css += `${at(k)}% { transform: rotate(${k * cfg.spin}deg); ${ease} }\n`;
          css += `${arr(k)}%${k === SEGS - 1 ? ', 100%' : ''} { transform: rotate(${(k + 1) * cfg.spin}deg); }\n`;
        }
        css += '}\n';
        styleKf.textContent = css;
      }
      function buildOrbitCSS(v) {
        const S = VARIANTS[v];
        const ease = `animation-timing-function:${cfg.easing};`;
        const seg = 25, arr = k => (k * seg + seg * (100 - cfg.hold) / 100).toFixed(2);
        let css = '';
        for (let i = 0; i < N; i++) {
          css += `@keyframes ${ns}orbit${i} {\n`;
          for (let k = 0; k < 4; k++) {
            css += `${k * seg}% { transform: ${orbitT(i, S[k])}; ${ease} }\n`;
            css += `${arr(k)}%${k === 3 ? ', 100%' : ''} { transform: ${orbitT(i, S[(k + 1) % 4])}; }\n`;
          }
          css += '}\n';
        }
        styleOrbit.textContent = css;
      }
      const startCascade = () => {
        const delays = { [ROLE.enter]: 0, [ROLE.small]: -cfg.speed / 3, [ROLE.big]: -cfg.speed * 2 / 3 };
        Object.entries(delays).forEach(([i, d]) => { dashes[i].style.animationDelay = d + 's'; dashes[i].classList.add('cascade'); });
      };
      const stopCascade = () => [ROLE.enter, ROLE.small, ROLE.big].forEach(i => { dashes[i].classList.remove('cascade'); dashes[i].style.animationDelay = ''; });
      const startOrbit = () => dashes.forEach((d, i) => { d.style.animationName = `${ns}orbit${i}`; d.classList.add('orbit'); });
      const stopOrbit = () => dashes.forEach(d => { d.classList.remove('orbit'); d.style.animationName = ''; });
      const freezeDashes = () => dashes.forEach(d => { const t = getComputedStyle(d).transform; if (t && t !== 'none') d.style.transform = t; });
      const morphTotal = () => (MORPH + (N - 1) * STAGGER) * 1000 + 60;
      let state = 'logo', phase = 'idle', variant = 'classic';
      let busy = false, wantSpinner = false, pendingPhase = null;
      const listeners = { phasechange: [] };
      const emit = () => listeners.phasechange.forEach(fn => fn(phase, state === 'spinner' ? variant : null, state));
      const drain = () => { if (pendingPhase) { const p = pendingPhase; pendingPhase = null; setPhase(p); } };
      const isStill = () => !!(phases[phase] && phases[phase].still);
      function enterSpinner() {
        busy = true; wantSpinner = false;
        buildOrbitCSS(variant);
        stopCascade();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.classList.add('morphing');
          ring.classList.add('spin');
          APPEAR_ORDER.forEach((i, k) => dashes[i].style.transitionDelay = (k * STAGGER) + 's');
          dashes.forEach((_, i) => applySpinnerPose(i));
          setTimeout(() => {
            el.classList.remove('morphing');
            dashes.forEach(d => d.style.transitionDelay = '');
            startOrbit();
            state = 'spinner'; busy = false; emit(); drain();
          }, morphTotal());
        }));
      }
      function enterLogo() {
        busy = true;
        freezeDashes(); stopOrbit();
        let angle = 0;
        const tf = getComputedStyle(ring).transform;
        if (tf && tf !== 'none') { const m = new DOMMatrix(tf); angle = (Math.atan2(m.b, m.a) * 180 / Math.PI + 360) % 360; }
        ring.classList.remove('spin');
        ring.style.transform = `rotate(${angle}deg)`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.classList.add('morphing');
          ring.style.transform = 'rotate(360deg)';
          APPEAR_ORDER.slice().reverse().forEach((i, k) => dashes[i].style.transitionDelay = (k * STAGGER) + 's');
          dashes.forEach((_, i) => applyLogoPose(i));
          setTimeout(() => {
            el.classList.remove('morphing');
            ring.style.transform = '';
            dashes.forEach(d => d.style.transitionDelay = '');
            if (!isStill()) startCascade();
            state = 'logo'; busy = false; emit(); drain();
          }, morphTotal());
        }));
      }
      function switchVariant() {
        busy = true;
        freezeDashes(); stopOrbit();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.classList.add('morphing');
          dashes.forEach((_, i) => applySpinnerPose(i));
          setTimeout(() => {
            el.classList.remove('morphing');
            buildOrbitCSS(variant);
            startOrbit();
            busy = false; emit(); drain();
          }, MORPH * 1000 + 60);
        }));
      }
      const pickRandom = () => { const keys = Object.keys(VARIANTS); let c; do { c = keys[Math.random() * keys.length | 0]; } while (c === variant && keys.length > 1); return c; };
      function setPhase(name) {
        const ph = phases[name];
        if (!ph) { console.warn('unknown phase:', name); return; }
        if (busy) { pendingPhase = name; return; }
        phase = name;
        if (ph.state === 'logo') {
          wantSpinner = false;
          if (state === 'logo') {
            const running = dashes[ROLE.enter].classList.contains('cascade');
            if (ph.still && running) stopCascade();
            if (!ph.still && !running) startCascade();
            emit(); return;
          }
          enterLogo();
        } else {
          const v = (ph.variant || 'classic') === 'random' ? pickRandom() : ph.variant;
          if (state === 'spinner') { if (v === variant) { emit(); return; } variant = v; switchVariant(); }
          else { variant = v; wantSpinner = true; }
        }
      }
      dashes[ROLE.enter].addEventListener('animationiteration', e => {
        if (e.target !== dashes[ROLE.enter] || state !== 'logo' || busy) return;
        if (wantSpinner) enterSpinner();
      });
      function setConfig(partial) {
        Object.assign(cfg, partial);
        el.style.setProperty('--speed', cfg.speed + 's');
        el.style.setProperty('--orbitDur', cfg.speed * 2 + 's');
        el.style.setProperty('--morph', MORPH + 's');
        el.style.setProperty('--morphTotal', (MORPH + (N - 1) * STAGGER) + 's');
        el.style.setProperty('--ease', cfg.easing);
        el.style.setProperty('--blue', cfg.color);
        el.style.setProperty('--radius', cfg.radius + 'px');
        el.style.background = cfg.background;
        el.style.transform = `scale(${cfg.scale})`;
        buildCSS();
        if (!busy) {
          if (state === 'logo') {
            dashes.forEach((_, i) => applyLogoPose(i));
            if (dashes[ROLE.enter].classList.contains('cascade')) { stopCascade(); void el.offsetWidth; startCascade(); }
          } else {
            dashes.forEach((_, i) => applySpinnerPose(i));
            buildOrbitCSS(variant);
            stopOrbit();
            ring.classList.remove('spin'); void ring.offsetWidth;
            ring.classList.add('spin'); startOrbit();
          }
        }
      }
      dashes.forEach((_, i) => applyLogoPose(i));
      setConfig({});
      const init = options.initialPhase && phases[options.initialPhase];
      if (init && init.state === 'spinner') {
        phase = options.initialPhase;
        variant = (init.variant || 'classic') === 'random' ? pickRandom() : init.variant;
        buildOrbitCSS(variant);
        dashes.forEach((_, i) => applySpinnerPose(i));
        ring.classList.add('spin');
        startOrbit();
        state = 'spinner';
      } else if (init && init.still) { phase = options.initialPhase; }
      else { startCascade(); }
      return {
        el, phases, setPhase, setConfig,
        getPhase: () => phase, getVariant: () => (state === 'spinner' ? variant : null),
        getState: () => state, getConfig: () => ({ ...cfg }),
        on: (ev, fn) => { (listeners[ev] || (listeners[ev] = [])).push(fn); },
      };
    }

    // ---------- Chat ----------
    // Tyo's settled chat config: 20px, continuous (linear, no holds), transparent bg.
    const MINI = { scale: 20 / 120, speed: 1.5, easing: 'linear', hold: 0, background: 'transparent' };
    const chatSteps = [
      { phrase: "Mulling over a few directions…", phase: "thinking" },
      { phrase: "Structuring your outline…",      phase: "reasoning" },
      { phrase: "Designing your slides…",         phase: "generating" },
    ];
    let phraseTimer = null;
    function footerCreate() { goChat(selected.role, selected.title); }
    function goChat(role, title) {
      closeDropdown();
      document.getElementById("roleFooter").style.display = "none";
      const col = document.getElementById("chatCol");
      // Figma 184:980 — prompt as first message (bg #eee, rounded-12, 14px), then Tyo's PaiLoader below
      col.innerHTML = `
        <div class="flex justify-end pt-3 bubble-in">
          <div class="max-w-[460px]" style="background:#eee; border-radius:12px; padding:12px 20px">
            <p class="text-text-primary" style="font-size:14px; line-height:1.43">${escapeHtml(promptText)}</p>
          </div>
        </div>
        <div class="flex items-center gap-2.5 mt-8 bubble-in" style="animation-delay:.45s" id="chatLoader">
          <span class="mini" id="chatLoaderMount"></span>
          <p><span class="shimmer" id="chatPhrase" style="font-size:14px; line-height:1.43">${chatSteps[0].phrase}</span></p>
        </div>`;
      showStage("stage-chat");
      // mount in the logo cascade, then morph to the spinner (Tyo's PaiLoader)
      const loader = createPaiLoader(document.getElementById("chatLoaderMount"), { config: MINI });
      loader.setPhase(chatSteps[0].phase);
      // cycle label + spinner phase together so the chat reads as "continuing"
      let n = 0;
      clearInterval(phraseTimer);
      phraseTimer = setInterval(() => {
        n = (n + 1) % chatSteps.length;
        const p = document.getElementById("chatPhrase");
        if (p) { p.textContent = chatSteps[n].phrase; loader.setPhase(chatSteps[n].phase); }
        else clearInterval(phraseTimer);
      }, 2600);
    }

    // ---------- utils ----------
    function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

    // init
    document.getElementById("morphZone").innerHTML = promptWrapHTML();
    renderSuggestions();
    wirePrompt();
  </script>
</body>
