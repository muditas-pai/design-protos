<!DOCTYPE html>
<!-- Connector recommendation in the create chat · mudita · 26 Nov 2026.
     When a prompt asks for a deck that runs on data from apps the user hasn't connected, the chat works out
     what the deck needs, matches each need to an app, and asks them to connect those apps before the outline.
     Shell, ask-card dock, AppLogo and the Add connector dialog are copied from ../connector-retrieval/connector-retrieval.html
     (itself built from pitchdeckdoclist new_dev_migration). Example brand is fictional.
     Connect opens the existing connector flow in a new tab (a stand-in page here); coming back to this tab runs
     the sync, then the fetch of what this deck needs.
     States: ?state=ask (the ask card) · ?state=partial (two apps connected) · ?state=loading (one app mid-fetch) -->

<script>
// Connector catalog + "Add connector" dialog (replica of settings/datasources/AddConnectorDialog.jsx, PR #6872).
const CATALOG = [
  { id: 'shopify', name: 'Shopify', slug: 'shopify', cat: 'ecommerce', chip: 'ecommerce', popular: true, desc: 'Use orders, revenue and top products in sales and marketing decks.' },

  { id: 'salesforce', name: 'Salesforce', slug: null, color: '#00A1E0', cat: 'crm', chip: 'crm', popular: true, desc: 'Bring opportunities, accounts and forecasts into your decks.' },
  { id: 'googlesheets', name: 'Google Sheets', slug: 'googlesheets', cat: 'spreadsheets', chip: 'spreadsheets', popular: true, desc: 'Turn rows and charts from a sheet into slides with real numbers.' },
  { id: 'slack', name: 'Slack', slug: null, color: '#4A154B', cat: 'team chat', chip: 'chat', popular: true, desc: 'Reference channel threads and announcements your team already wrote.' },
  { id: 'confluence', name: 'Confluence', slug: 'confluence', cat: 'documents', chip: 'documents', popular: false, desc: 'Draw on specs, wikis and team pages.' },
  { id: 'dropbox', name: 'Dropbox', slug: 'dropbox', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read files stored in your Dropbox folders.' },
  { id: 'airtable', name: 'Airtable', slug: 'airtable', cat: 'spreadsheets', chip: 'spreadsheets', popular: false, desc: 'Use bases and views as structured data for slides.' },
  { id: 'jira', name: 'Jira', slug: 'jira', cat: 'project management', chip: 'projects', popular: false, desc: 'Summarise epics, sprints and roadmaps for status updates.' },
  { id: 'asana', name: 'Asana', slug: 'asana', cat: 'project management', chip: 'projects', popular: false, desc: 'Pull project status and milestones into updates.' },
  { id: 'linear', name: 'Linear', slug: 'linear', cat: 'project management', chip: 'projects', popular: false, desc: 'Turn cycles and projects into progress slides.' },
  { id: 'gmail', name: 'Gmail', slug: 'gmail', cat: 'email', chip: 'email', popular: false, desc: 'Reference email threads with customers and partners.' },
  { id: 'googleanalytics', name: 'Google Analytics', slug: 'googleanalytics', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Chart traffic and conversion trends from GA4.' },
  { id: 'mixpanel', name: 'Mixpanel', slug: 'mixpanel', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Bring product usage metrics into reviews.' },
  { id: 'quickbooks', name: 'QuickBooks', slug: 'quickbooks', cat: 'accounting', chip: 'accounting', popular: false, desc: 'Use revenue and expense figures in finance decks.' },
  { id: 'onedrive', name: 'OneDrive', slug: null, color: '#0364B8', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read Word, Excel and PowerPoint files from OneDrive.' },
  { id: 'pipedrive', name: 'Pipedrive', slug: null, color: '#1A1A1A', cat: 'crm', chip: 'crm', popular: false, desc: 'Pull deals and activity into pipeline reviews.' },
  { id: 'zendesk', name: 'Zendesk', slug: 'zendesk', cat: 'customer support', chip: 'more', popular: false, desc: 'Summarise ticket trends and CSAT for account reviews.' },
  { id: 'intercom', name: 'Intercom', slug: 'intercom', cat: 'customer support', chip: 'more', popular: false, desc: 'Use conversation themes in customer decks.' },
];
const CHIPS = [['ecommerce','Ecommerce'],['ads','Advertising'],['crm','CRM'],['documents','Documents'],['files','File storage'],['spreadsheets','Spreadsheets'],['notes','Notes'],['projects','Project management'],['analytics','Analytics'],['email','Email'],['chat','Team chat'],['accounting','Accounting'],['more','More']];
const ACR = new Set(['crm','ai','hr','url','sms','seo']);
const catLabel = (t) => (t || '').replace(/\b\w+/g, (w) => ACR.has(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1));
const appById = (id) => CATALOG.find((a) => a.id === id);

// AppLogo: logo on a soft sunken tile, initials when there's no logo or it fails to load.
function appLogo(app, size = 'md', extraClass = '') {
  const box = size === 'lg' ? 'h-12 w-12' : size === 'sm' ? 'h-8 w-8' : size === 'xs' ? 'h-5 w-5' : 'h-9 w-9';
  const img = size === 'lg' ? 'h-7 w-7' : size === 'sm' ? 'h-[18px] w-[18px]' : size === 'xs' ? 'h-3 w-3' : 'h-5 w-5';
  const tiny = size === 'xs' ? 'text-[6px]' : 'text-[10px]';
  const initials = app.name.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const fallback = `<span class='text-caption font-semibold text-text-secondary'>${initials}</span>`;
  const inner = app.slug
    ? `<img src="https://cdn.simpleicons.org/${app.slug}" alt="" class="${img} object-contain" loading="lazy" onerror="this.outerHTML=&quot;${fallback}&quot;" />`
    : `<span class="flex ${img} items-center justify-center rounded-[3px] ${tiny} font-bold text-white" style="background:${app.color}">${initials}</span>`;
  return `<span class="flex ${box} shrink-0 items-center justify-center overflow-hidden rounded-control bg-bg-tertiary ${extraClass}">${inner}</span>`;
}

// The dialog. opts: { isConnected(id), onConnect(id) -> Promise, title, description }
const ConnectorDialog = (() => {
  let root, state = { q: '', chip: '', busy: null, opts: null };
  function mount() {
    root = document.createElement('div');
    root.className = 'fixed inset-0 z-[70] hidden';
    root.innerHTML = `
      <div class="absolute inset-0 bg-black/45 backdrop-blur-[2px] opacity-0 transition-opacity duration-200" data-x data-fade></div>
      <div class="pointer-events-none absolute inset-0 flex items-end justify-center p-3 sm:items-center sm:p-6">
        <div data-panel role="dialog" aria-modal="true" class="pointer-events-auto relative w-full max-w-3xl translate-y-2 scale-[0.98] overflow-hidden rounded-dialog border border-border-secondary bg-bg-default-primary opacity-0 shadow-dialog transition-[opacity,transform] duration-200 ease-std">
          <div class="flex items-start justify-between gap-4 px-6 pb-2 pt-5">
            <div class="min-w-0"><div data-title class="text-title font-semibold">Add connector</div><div data-desc class="mt-1 text-body text-text-secondary">Connect an app your decks can draw on. Access is read-only and only for you.</div></div>
            <button type="button" class="icon-btn -mr-2 -mt-1 !h-8 !w-8" data-x aria-label="Close"><i class="ph ph-x text-[20px]"></i></button>
          </div>
          <div class="px-6 pt-3">
            <div class="relative"><i class="ph ph-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary"></i>
              <input data-q placeholder="Search 120+ apps" class="h-9 w-full rounded-control border border-border-secondary pl-9 pr-3 text-body outline-none transition-shadow focus:border-[#0D99FF] focus:ring-2 focus:ring-[#0D99FF]/20" /></div>
            <div data-chips class="scrollbar-hide mt-3 flex h-7 gap-1.5 overflow-x-auto" style="-webkit-mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%)"></div>
            <div data-section class="mb-2 mt-6 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">Popular</div>
          </div>
          <div data-list class="scrollbar-hide h-[52vh] overflow-y-auto px-6 pb-6"></div>
          <div data-foot class="hidden items-center gap-3 border-t border-border-secondary px-6 py-3">
            <span data-foot-note class="flex-1 text-caption text-text-secondary"></span>
            <button type="button" data-done class="btn btn-primary btn-md">Done</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(root);
    root.querySelectorAll('[data-x]').forEach((el) => el.onclick = close);
    root.querySelector('[data-done]').onclick = close;
    root.querySelector('[data-q]').oninput = (e) => { state.q = e.target.value; render(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !root.classList.contains('hidden')) close(); });
  }
  function card(app) {
    const connected = state.opts.isConnected(app.id);
    const working = state.busy === app.id;
    const action = connected
      ? `<span title="Connected" class="flex h-8 w-8 items-center justify-center rounded-control bg-bg-success-inverted text-text-success-primary"><i class="ph-bold ph-check"></i></span>`
      : `<button type="button" data-connect="${app.id}" ${state.busy ? 'disabled' : ''} aria-label="Connect ${app.name}" class="icon-btn !h-8 !w-8 border border-border-secondary disabled:opacity-50">${working ? '<i class="ph ph-arrows-clockwise spin"></i>' : '<i class="ph ph-plus"></i>'}</button>`;
    return `<div class="flex items-start gap-3 rounded-card border border-border-secondary bg-bg-default-primary p-4">
      ${appLogo(app, 'lg')}
      <div class="min-w-0 flex-1"><div class="truncate text-body font-semibold">${app.name}</div><p class="mt-0.5 line-clamp-2 text-caption text-text-secondary">${app.desc}</p></div>
      <div class="shrink-0">${action}</div></div>`;
  }
  function render() {
    const q = state.q.trim().toLowerCase();
    const chips = root.querySelector('[data-chips]');

// The thinking trail (like ResearchStepRow), folded to "Thought for Ns ›" when done.

// ---------------- the ask: connect apps for this deck ----------------
let cardEl = null;
function rowHtml(r) {
  const app = appById(r.id), n = NEEDS.find((x) => x.id === r.id);
  const fills = `${n.fills.length} ${n.fills.length === 1 ? 'slide' : 'slides'}`;
  let right = '', sub = '', extra = '';
  if (r.state === 'idle') {
    right = `<button type="button" data-connect="${r.id}" class="btn btn-secondary btn-sm">Connect</button>`;
    sub = n.fills.length ? `${n.need} · fills ${fills}` : n.need;
  } else if (r.state === 'away') {
    right = `<button type="button" data-connect="${r.id}" class="btn btn-ghost btn-sm">Reopen tab<i class="ph ph-arrow-square-out text-[14px]"></i></button>`;
    sub = `<span class="inline-flex items-center gap-1.5"><span class="spinner !h-3 !w-3"></span>Finish connecting ${app.name} in the new tab, then come back here</span>`;
  } else if (r.state === 'syncing') {
    sub = `<span class="inline-flex items-center gap-1.5"><span class="spinner !h-3 !w-3"></span>Connected. Syncing ${n.sync} from ${app.name}</span>`;
    extra = `<div class="mt-2.5 h-1 overflow-hidden rounded-full bg-bg-quaternary"><div class="sync-bar h-full rounded-full bg-[#0D99FF]"></div></div>`;
  } else if (r.state === 'finding') {
    sub = `<span class="inline-flex items-center gap-1.5"><span class="spinner !h-3 !w-3"></span>Getting what this deck needs</span>`;
    extra = `<ul class="mt-2 flex flex-col gap-1 text-caption">${n.find.map((f, i) => {
      const st = i < r.step ? 'done' : i === r.step ? 'now' : 'next';
      const ic = st === 'done' ? '<i class="ph-bold ph-check text-[12px] text-text-success-primary"></i>' : st === 'now' ? '<span class="spinner !h-3 !w-3"></span>' : '<span class="h-1.5 w-1.5 rounded-full bg-text-quaternary"></span>';
      return `<li class="flex items-center gap-2 ${st === 'next' ? 'text-text-tertiary' : 'text-text-primary'}"><span class="flex w-3 justify-center">${ic}</span>${f}</li>`;
    }).join('')}</ul>`;
  } else {
    // Success stays quiet: the same line as before, and a check where the button was.
    right = `<span class="inline-flex h-8 items-center gap-1.5 px-2.5 text-caption font-medium text-text-success-primary"><i class="ph-bold ph-check-circle text-[16px]"></i>Ready</span>`;

      ${right ? `<div class="shrink-0">${right}</div>` : ''}</div>
    ${extra ? `<div class="pl-[44px]">${extra}</div>` : ''}</div>`;
}
const sigOf = (r) => r.state + "|" + (r.step || 0);
function cardShell() {

// Connect opens the existing connector flow in a new tab (mocked here as a stand-in page).
// When the user comes back to this tab, we sync the app, then fetch what this deck needs.
let awaiting = null;
function openConnectorTab(id) {
  const app = appById(id);

  if (!w) return;
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Connect ${app.name}</title>
    <body style="margin:0;height:100vh;display:grid;place-items:center;background:#f5f5f5;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#1a1a1a">

      <p style="color:#7f7f7f;margin:0 0 18px">Close this tab to go back to the deck, as if you'd finished connecting.</p>
      <button onclick="window.close()" style="height:36px;padding:0 16px;border:0;border-radius:6px;background:#0d99ff;color:#fff;font-weight:500;cursor:pointer">Done, close this tab</button>

function connect(id) {

  r.state = 'away'; renderCard();
  awaiting = id;
  openConnectorTab(id);
}
async function backFromTab() {
  if (!awaiting || document.visibilityState !== 'visible') return;
  const id = awaiting; awaiting = null;
  const r = rows.find((x) => x.id === id), n = NEEDS.find((x) => x.id === id);
  await wait(400);
  apps.push({ id, on: true });
  toast(`${appById(id).name} connected`);
  r.state = 'syncing'; renderCard();
  await wait(2400);                                  // sync: matches the 2.4s bar
  r.state = 'finding'; r.step = 0; renderCard();
  for (let i = 0; i < n.find.length; i++) { await wait(900 + Math.random() * 400); r.step = i + 1; renderCard(); }
  await wait(300);
  r.state = 'ready'; r.fresh = true; renderCard();
}
document.addEventListener('visibilitychange', backFromTab);
window.addEventListener('focus', backFromTab);

// The full catalog, filtered to the category of the row ("Use another app"), or everything ("Browse all apps").

// ---------------- flow ----------------
function chatHeader(on = true) { $('#hdrIcon').className = on ? 'ph ph-arrow-left text-[20px]' : 'ph ph-house text-[20px]'; $('#hdrPill').classList.toggle('hidden', !on); $('#hdrPill').classList.toggle('inline-flex', on); }

const LEAD = `<p>This deck runs on numbers from apps you haven't connected yet. Connect them and we'll use last week's real figures.</p>

  const ph = rest.flatMap((r) => NEEDS.find((n) => n.id === r.id).fills);
  addAssistant(`<p>${ready.length
      ? `Got it. We'll use last week's numbers from ${list(names(ready))}.`
      : `Got it. We'll build the outline from your prompt.`}${ph.length ? ` These slides get a placeholder for now: ${list(ph.map((p) => `“${p}”`))}.` : ''}</p>
    <div class="mt-3 flex items-center gap-2 text-caption text-text-secondary"><span class="spinner !h-3 !w-3"></span>Drafting your outline</div>`);
}
function restart() { chatHeader(false); apps = [{ id: 'googledrive', on: true }]; $('#chatStage').classList.add('hidden'); $('#chatStage').classList.remove('flex'); $('#promptStage').classList.remove('hidden'); $('#askDock').innerHTML = ''; mountComposer(); }
function jumpToAsk(connected = []) {
  toChat(); addUser(PROMPT);
  addAssistant(`<p class="text-text-tertiary">Thought for 3s <i class="ph ph-caret-right text-[12px]"></i></p>`);
  addAssistant(LEAD);
  rows = NEEDS.map((n) => ({ id: n.id, state: connected.includes(n.id) ? 'ready' : 'idle' }));
  connected.forEach((id) => apps.push({ id, on: true }));
  cardEl = $('#askDock'); renderCard();
}
$('#pRestart').onclick = () => { history.replaceState(null, '', '?'); restart(); };
$('#pSkip').onclick = () => { history.replaceState(null, '', '?state=ask'); restart(); jumpToAsk(); };
$('#pLoading').onclick = () => { history.replaceState(null, '', '?state=loading'); restart(); jumpToAsk(['shopify']); awaiting = 'googleanalytics'; rows.find((r) => r.id === 'googleanalytics').state = 'away'; renderCard(); setTimeout(backFromTab, 600); };
$('#pPartial').onclick = () => { history.replaceState(null, '', '?state=partial'); restart(); jumpToAsk(['shopify', 'googleanalytics']); };
mountComposer();
const st = new URLSearchParams(location.search).get('state');
if (st === 'ask') jumpToAsk();
if (st === 'partial') jumpToAsk(['shopify', 'googleanalytics']);
if (st === 'loading') { jumpToAsk(['shopify']); awaiting = 'googleanalytics'; rows.find((r) => r.id === 'googleanalytics').state = 'away'; renderCard(); setTimeout(backFromTab, 600); }
</script>
