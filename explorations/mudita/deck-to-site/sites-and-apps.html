<!DOCTYPE html>
<!-- Websites and apps · mudita · 27 Nov 2026.
     Prototype of ./sites-and-apps-scope.html: one New button (Deck, Website, App), mixed tiles with Figma-style
     type badges, the create chat with ask cards, the editor (Edit · Responses/Data · Settings), the required check
     before the first publish, and the live state. Example brand is fictional (Perch & Paw).
     States: ?s=dash · menu · create-site · create-app · editor-site · editor-app · check · live · responses · data -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Websites and apps</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<style>
  /* tokens: pai.tailwind.config.js (new_dev_migration), light theme */
  :root {
    --bg-primary: #fff; --bg-secondary: #f5f5f5; --bg-tertiary: #f5f5f5; --bg-quaternary: #e6e6e6;
    --brand: #0d99ff; --brand-hover: #007be5; --brand-inv: #e5f4ff; --text-brand: #007be5;
    --success: #14ae5c; --success-inv: #e0f6e5; --text-success: #009951;
    --warning-inv: #fff1c2; --text-warning: #a15c00;
    --text: #1a1a1a; --text-2: #7f7f7f; --text-4: #b2b2b2;
    --border: #e6e6e6; --border-strong: rgba(26,26,26,.3);
    --r-control: 6px; --r-card: 12px; --r-dialog: 16px;
    --sh-menu: 0 1px 2px 0 rgb(0 0 0 / .06), 0 8px 24px -6px rgb(0 0 0 / .16);
    --sh-dialog: 0 2px 6px 0 rgb(0 0 0 / .08), 0 24px 64px -12px rgb(0 0 0 / .28);
    --sh-btn: 0 1px 2px 0 rgb(0 0 0 / .08), inset 0 1px 0 0 rgb(255 255 255 / .12);
    --sh-segment: 0 1px 2px rgba(0,0,0,.12);
    --std: cubic-bezier(0.2, 0, 0, 1);
    --font: -apple-system, system-ui, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    /* the customer's brand (Perch & Paw), used only inside their website and app */
    --pp: #3B2418; --pp2: #6B4430; --pp-cream: #F3ECE2; --pp-accent: #C98A4B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-secondary); color: var(--text); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .view { height: 100vh; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-control);
    font-weight: 500; white-space: nowrap; border: 1px solid transparent; background: none; user-select: none;
    transition: background-color .15s var(--std), border-color .15s var(--std), color .15s var(--std), transform .1s var(--std); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; gap: 6px; }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: var(--sh-btn); }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-secondary { background: #fff; border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--border-strong); background: var(--bg-tertiary); }
  .btn-ghost { color: var(--text-2); } .btn-ghost:hover { color: var(--text); background: var(--bg-tertiary); }
  .btn:disabled { cursor: not-allowed; background: var(--bg-tertiary); color: var(--text-2); box-shadow: none; border-color: transparent; }
  .btn i { font-size: 16px; }
  .icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-control);
    color: var(--text-2); font-size: 20px; transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--bg-tertiary); color: var(--text); }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(26,26,26,.15); border-top-color: var(--text); animation: spin .8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-up { animation: fadeUp .28s var(--std) both; }
  @keyframes fadeUp { from { transform: translateY(6px); opacity: 0; } }

  /* type badge, Figma-style: white icon on a coloured square, one colour per type */
  .ty { width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; flex-shrink: 0; color: #fff; font-size: 13px; }
  .ty.deck { background: #0D99FF; } .ty.site { background: #14AE5C; } .ty.app { background: #9747FF; }
  .ty.lg { width: 32px; height: 32px; border-radius: 8px; font-size: 18px; }
  .ty.sm { width: 16px; height: 16px; border-radius: 4px; font-size: 11px; }

  /* ── dashboard shell ── */
  .shell { display: flex; height: 100vh; overflow: hidden; }
  .side { width: 256px; flex-shrink: 0; display: flex; flex-direction: column; padding: 12px; background: #fff; border-right: 1px solid var(--border); position: relative; }
  .wsw { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border: 0; background: none; border-radius: var(--r-control); text-align: left; }
  .wsw-av { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: #f6e7d6; color: #9a5d27; font-size: 17px; }
  .wsw-name { font-weight: 600; } .wsw-meta { font-size: 12px; line-height: 16px; color: var(--text-2); }
  .wsw > i { margin-left: auto; color: var(--text-2); font-size: 16px; }
  .side .new { margin-top: 12px; width: 100%; }
  .side .new .ph-caret-down { margin-left: auto; font-size: 13px; opacity: .85; }
  .side .new span { margin-right: auto; }
  .nav { margin-top: 16px; display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-control); color: var(--text-2); text-decoration: none; cursor: pointer; }
  .nav a:hover { background: var(--bg-tertiary); color: var(--text); }
  .nav a.on { background: var(--bg-tertiary); color: var(--text); font-weight: 500; }
  .nav a i { font-size: 20px; }
  .side-foot { margin-top: auto; }

  /* the New menu */
  .menu { position: absolute; left: 12px; right: 12px; top: 100px; z-index: 30; background: #fff; border: 1px solid var(--border); border-radius: var(--r-card);
    box-shadow: var(--sh-menu); padding: 6px; transform-origin: top center; animation: menuIn .16s var(--std); }
  @keyframes menuIn { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
  .menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; background: none; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--bg-tertiary); }
  .menu b { display: block; font-weight: 500; } .menu small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 2px; }

  .main { flex: 1; min-width: 0; overflow-y: auto; }
  .top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 24px; background: rgba(255,255,255,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .search { flex: 1; max-width: 448px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-2); }
  .search kbd { margin-left: auto; font: 500 11px var(--font); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); background: #fff; }
  .me { width: 32px; height: 32px; border-radius: 50%; background: #d8c3a5; color: #5b4128; display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-left: 4px; }
  .col { max-width: 1152px; margin: 0 auto; padding: 32px 24px 96px; }
  .hero h1 { margin: 12px 0 0; text-align: center; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; }
  .composer { max-width: 720px; margin: 20px auto 0; border-radius: var(--r-dialog); border: 1px solid var(--border); background: #fff; box-shadow: var(--sh-menu); }
  .composer .ta { padding: 18px 18px 0; min-height: 84px; font-size: 16px; line-height: 24px; color: var(--text-4); }
  .composer .bar { display: flex; align-items: center; gap: 4px; padding: 8px 10px 10px; }
  .composer .send { margin-left: auto; width: 32px; height: 32px; padding: 0; opacity: .35; }

  .tabs { margin-top: 48px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--border); }
  .tab { position: relative; height: 40px; padding: 0 12px; display: inline-flex; align-items: center; color: var(--text-2); }
  .tab.on { color: var(--text); font-weight: 500; }
  .tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 99px; background: var(--brand); }
  .types { display: flex; gap: 6px; margin-top: 16px; }
  .types button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: #fff; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .types button:hover { border-color: var(--border-strong); color: var(--text); }
  .types button.on { border-color: var(--text); color: var(--text); font-weight: 500; }
  .grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* tiles: same card, the thumbnail's frame shows the form factor */
  .tile { background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; cursor: pointer; text-align: left; padding: 0; transition: box-shadow .2s var(--std); }
  .tile:hover { box-shadow: var(--sh-menu); }
  .tile.new-in { animation: fadeUp .4s var(--std) both; }
  .tile .cv { aspect-ratio: 16/9; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
  .tile .cb { padding: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .tile .cb > div { flex: 1; min-width: 0; }
  .tile .ct { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cm { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .more { color: var(--text-2); font-size: 20px; }
  .tile .ty { margin-top: 0; }
  .cv.deck { background: var(--pp); color: #fff; }
  .cv.deck .ph { position: absolute; right: 0; top: 0; bottom: 0; width: 42%; background: center/cover; }
  .cv.deck .sl { position: absolute; left: 7%; right: 46%; bottom: 10%; }
  .cv.deck small { display: block; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
  .cv.deck b { font-size: 17px; line-height: 21px; font-weight: 600; }
  .cv.site, .cv.app { background: #EDEDED; }
  .cv.site { padding: 14px 16px 0; }
  .brw { height: 100%; border-radius: 7px 7px 0 0; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 18px -8px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; }
  .brw .bar { height: 16px; display: flex; align-items: center; gap: 3px; padding: 0 7px; background: #F5F5F5; border-bottom: 1px solid #E6E6E6; flex-shrink: 0; }
  .brw .bar i { width: 5px; height: 5px; border-radius: 50%; background: #D0D0D0; display: block; }
  .brw .bar span { margin-left: 6px; font-size: 8px; color: #7F7F7F; }
  .brw .pg { flex: 1; position: relative; padding: 10px 12px; background: var(--pp-cream); color: var(--pp); }
  .brw .pg .nv { display: flex; gap: 8px; font-size: 7px; font-weight: 700; letter-spacing: .08em; margin-bottom: 10px; }
  .brw .pg .nv span:first-child { margin-right: auto; }
  .brw .pg b { display: block; font-size: 13px; line-height: 15px; max-width: 56%; }
  .brw .pg .cta { display: inline-block; margin-top: 8px; font-size: 7px; font-weight: 700; padding: 4px 7px; border-radius: 3px; background: var(--pp); color: #fff; }
  .brw .pg .im { position: absolute; right: 12px; top: 22px; width: 36%; aspect-ratio: 1; border-radius: 4px; background: center/cover #C99A72; }
  .cv.app { display: flex; align-items: flex-end; justify-content: center; padding-top: 14px; }
  .phs { width: 40%; height: 100%; border-radius: 12px 12px 0 0; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 18px -8px rgba(0,0,0,.25); padding: 9px 8px; display: flex; flex-direction: column; gap: 5px; }
  .phs .hd { font-size: 8px; font-weight: 700; color: var(--pp); }
  .phs .op { height: 15px; border-radius: 4px; background: var(--pp-cream); display: flex; align-items: center; gap: 4px; padding: 0 5px; }
  .phs .op i { width: 6px; height: 6px; border-radius: 50%; background: var(--pp-accent); display: block; }
  .phs .op em { height: 3px; border-radius: 3px; background: #DCCBB8; flex: 1; }
  .phs .bt { margin-top: auto; height: 13px; border-radius: 4px; background: var(--pp); }
  .appicon { position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 7px; background: var(--pp); color: #fff; display: grid; place-items: center; font-size: 14px; }
  .state { position: absolute; right: 10px; bottom: 10px; height: 20px; padding: 0 7px; border-radius: 99px; background: rgba(255,255,255,.94); font-size: 11px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); } .dot.draft { background: var(--text-4); }

  /* ── create chat ── */
  .create { display: flex; flex-direction: column; background: var(--bg-secondary); }
  .chead { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); background: #fff; }
  .chead .pill { height: 24px; padding: 0 8px 0 4px; border-radius: 99px; background: var(--bg-tertiary); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
  .cbody { flex: 1; min-height: 0; overflow-y: auto; }
  .thread { max-width: 752px; margin: 0 auto; padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 20px; }
  .u { align-self: flex-end; max-width: 612px; border-radius: var(--r-card); background: #E5F4FF; padding: 12px 16px; }
  .a { font-size: 14px; line-height: 20px; }
  .a .muted { color: var(--text-2); }
  .trail { color: var(--text-2); display: flex; flex-direction: column; gap: 4px; }
  .trail .st { display: flex; align-items: center; gap: 10px; }
  .dock { flex-shrink: 0; padding: 0 16px 24px; }
  .dock > div { max-width: 744px; margin: 0 auto; }
  .ask { background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh-menu); padding: 16px; }
  .ask .q { font-size: 16px; line-height: 24px; font-weight: 500; }
  .ask .qs { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .ask .stp { float: right; font-size: 12px; color: var(--text-2); }
  .opts { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; text-align: left; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--border-strong); }
  .opt[aria-checked="true"] { border-color: var(--brand); background: #F5FBFF; }
  .opt i.ic { font-size: 18px; color: var(--text-2); margin-top: 1px; }
  .opt[aria-checked="true"] i.ic { color: var(--text-brand); }
  .opt b { display: block; font-weight: 500; } .opt small { display: block; font-size: 12px; line-height: 16px; color: var(--text-2); margin-top: 2px; }
  .ask .ft { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .ask .ft .sp { flex: 1; }
  .plan { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--border); }
  .plan li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .plan li .n { width: 24px; height: 24px; border-radius: var(--r-control); background: var(--bg-tertiary); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text-2); flex-shrink: 0; }
  .plan li b { font-weight: 500; display: block; } .plan li span { font-size: 13px; color: var(--text-2); }
  .plan li .keep { margin-left: auto; font-size: 12px; color: var(--text-brand); background: var(--brand-inv); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .build { display: flex; flex-direction: column; gap: 8px; }
  .build .row { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
  .build .row.done { color: var(--text); } .build .row.done i { color: var(--success); }
  .pbar { height: 4px; border-radius: 99px; background: var(--bg-quaternary); overflow: hidden; margin-top: 6px; }
  .pbar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: inherit; transition: width .5s var(--std); }

  /* ── editor ── */
  .editor { display: flex; flex-direction: column; background: var(--bg-secondary); }
  .ebar { height: 56px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--border); }
  .ebar .l, .ebar .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ebar .r { justify-content: flex-end; }
  .ebar .nm { font-weight: 600; white-space: nowrap; }
  .chip { height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; background: var(--bg-tertiary); color: var(--text-2); white-space: nowrap; }
  .chip.live { background: var(--success-inv); color: var(--text-success); }
  .segm { display: flex; padding: 2px; border-radius: var(--r-control); background: var(--bg-tertiary); }
  .segm button { height: 30px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .segm button[aria-selected="true"] { background: #fff; color: var(--text); box-shadow: var(--sh-segment); }
  .segm button em { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--brand-inv); color: var(--text-brand); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
  .segm.ic button { width: 32px; padding: 0; justify-content: center; font-size: 16px; }
  .ework { flex: 1; min-height: 0; display: flex; }
  .secs { width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); padding: 12px 8px; overflow-y: auto; }
  .secs .h { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); padding: 4px 8px 8px; display: flex; align-items: center; }
  .secs .h i { margin-left: auto; font-size: 16px; cursor: pointer; }
  .secs a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: var(--r-control); color: var(--text); cursor: pointer; }
  .secs a:hover { background: var(--bg-tertiary); }
  .secs a.on { background: var(--bg-tertiary); font-weight: 500; }
  .secs a i { color: var(--text-2); font-size: 16px; }
  .secs .grip { margin-left: auto; opacity: 0; } .secs a:hover .grip { opacity: 1; }
  .canvas { flex: 1; min-width: 0; overflow: auto; padding: 24px; display: flex; justify-content: center; align-items: flex-start; }
  .frame { width: 100%; max-width: 920px; background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px -12px rgba(0,0,0,.22); overflow: hidden; transition: max-width .3s var(--std); }
  .frame .fbar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #F5F5F5; border-bottom: 1px solid #E6E6E6; font-size: 12px; color: var(--text-2); }
  .frame .fbar .dots { display: flex; gap: 5px; margin-right: 8px; } .frame .fbar .dots i { width: 9px; height: 9px; border-radius: 50%; background: #D6D6D6; display: block; }
  .frame .fbar .addr { flex: 1; max-width: 360px; height: 22px; border-radius: 5px; background: #fff; border: 1px solid #E6E6E6; display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  .frame.phone { max-width: 390px; border-radius: 36px; padding: 12px; background: #111; }
  .frame.phone .fbar { display: none; }
  .frame.phone #frameBody { border-radius: 26px; overflow: hidden; }
  .frame.phone .s-nav { padding: 14px 18px; } .frame.phone .s-nav span:not(.lg) { display: none; }
  .frame.phone .s-hero { grid-template-columns: 1fr; padding: 10px 18px 32px; gap: 20px; } .frame.phone .s-hero h1 { font-size: 30px; line-height: 34px; }
  .frame.phone .s-form { flex-direction: column; } .frame.phone .s-why, .frame.phone .s-rev .qs { grid-template-columns: 1fr; } .frame.phone .s-why, .frame.phone .s-rev { padding: 32px 18px; }
  .frame.phone .s-foot { flex-wrap: wrap; padding: 20px 18px; }

      : `<div style="padding:40px;text-align:center;color:var(--text-2)">Nothing yet. Answers show up once the app is live.</div>`; };
    paint(0); $$('#lists button').forEach((b) => b.onclick = () => { $$('#lists button').forEach((x) => x.classList.toggle('on', x === b)); paint(+b.dataset.l); });
  } else {
    const groups = kind === 'site' ? ['Address', 'Search and sharing', 'Forms', 'Visits', 'Versions'] : ['Address', 'On the home screen', 'Who can use it', 'Search and sharing', 'Versions'];
    w.innerHTML = `<div class="pane"><div class="wrap"><h2>Settings</h2><div class="sub">Filled in for you. Change anything here.</div>
      <div class="setgrid"><nav class="setnav">${groups.map((g, i) => `<a class="${i === 0 ? 'on' : ''}">${g}</a>`).join('')}</nav><div style="display:flex;flex-direction:column;gap:16px">
        <div class="setcard">
          <div class="setrow"><div><b>Address</b><small>Where people find your ${K.noun}. Free, and ready now.</small></div><div class="field" style="width:280px"><span>${K.addr.split('.')[0]}</span><span class="fx">.perchandpaw.site</span></div></div>
          <div class="setrow"><div><b>Your own domain</b><small>Use perchandpaw.com/${K.addr.split('.')[0]} instead.</small></div><button class="btn btn-secondary btn-sm">Connect a domain</button></div></div>
        ${kind === 'app' ? `<div class="setcard">
          <div class="setrow"><div style="flex:0 0 auto"><span class="appicon" style="position:static;width:48px;height:48px;border-radius:12px;font-size:24px"><i class="ph-fill ph-paw-print"></i></span></div><div><b>App icon and name</b><small>What people see when they add it to their home screen. Made from your brand kit.</small></div><button class="btn btn-secondary btn-sm">Change</button></div>
          <div class="setrow"><div><b>Add to home screen</b><small>People can keep it on their phone. It opens full screen, like any app.</small></div><button class="switch" role="switch" aria-checked="true" data-sw><i></i></button></div>
          <div class="setrow"><div><b>App Store and Google Play</b><small>List it in the stores so people can search for it.</small></div><span class="lock">Gold</span></div></div>
          <div class="setcard"><div class="setrow"><div><b>Who can use it</b><small>Anyone with the link, people with a password, or people you invite.</small></div><select class="field" style="width:200px"><option>Anyone with the link</option><option>Password</option><option>Invited people</option></select></div></div>`
        : `<div class="setcard">
          <div class="setrow"><div><b>Title and description</b><small>“The Orbit cat tree is back in January. Join the waitlist.” Written from your page.</small></div><button class="btn btn-secondary btn-sm">Edit</button></div>
          <div class="setrow"><div><b>Sharing image</b><small>Shows when the link is posted on social or in a message.</small></div><span style="width:96px;aspect-ratio:1.9;border-radius:6px;background:center/cover url(${IMG(CAT, 300)})"></span></div></div>
          <div class="setcard"><div class="setrow"><div><b>Email me for each response</b><small>Goes to you at hello@perchandpaw.com.</small></div><button class="switch" role="switch" aria-checked="true" data-sw><i></i></button></div>
          <div class="setrow"><div><b>Send responses to another app</b><small>Each sign-up lands in Klaviyo, HubSpot or Google Sheets too.</small></div><button class="btn btn-secondary btn-sm"><i class="ph ph-plugs-connected"></i>Choose an app</button></div></div>`}
      </div></div></div></div>`;
    $$('[data-sw]').forEach((s) => s.onclick = () => s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'));
  }
}
$('#eBack').onclick = goDash;
$('#eShare').onclick = () => toast('Link copied');
$('#ePublish').onclick = () => live[kind] ? toast(`${K.Noun} updated`) : openCheck();

/* ───────── check before the first publish ───────── */
function openCheck() {
  const items = kind === 'site'
    ? [['“Sold out in 9 days”', 'A claim about sales. Still true?', 'From your Orbit pitch deck', 'file-text'], ['“212 people are already on the list”', 'A number on a public page. We\'ll keep it updated from Responses, or you can remove it.', 'Written by AI', 'sparkle'], ['“Tested with 40 cats”', 'A claim people may quote back to you.', 'From your Orbit pitch deck', 'file-text']]
    : [['Prices and stock', 'Shown in the result. Read live from Shopify, so they stay right.', 'From Shopify', 'storefront'], ['“Ships in 2 days”', 'A promise to customers. Is it true for every bed?', 'Written by AI', 'sparkle']];
  const ok = kind === 'site' ? [['Privacy page and cookie notice', 'Added, because the page keeps emails.'], ['Links, images, spelling', 'All links work. The photos come from your pitch deck.']] : [['Privacy page', 'Added, because the app keeps answers and emails.'], ['Works on phones', 'Checked on small and large screens.']];
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="chkT"><h3 id="chkT">Check before it goes live</h3>
    <div class="sub">This is the first time ${K.name} goes public under your name. We found ${items.length} things worth a look.</div>
    ${items.map(([b, s, src, ic], i) => `<div class="chk" data-c="${i}"><i class="ph ph-warning-circle w"></i><div><b>${b}</b><small>${s}</small><span class="src"><i class="ph ph-${ic}"></i>${src}</span></div><button class="go" data-look>Look at it</button></div>`).join('')}
    ${ok.map(([b, s]) => `<div class="chk"><i class="ph ph-check-circle ok"></i><div><b>${b}</b><small>${s}</small></div></div>`).join('')}
    <label class="agree"><input type="checkbox" id="agree">I've checked this ${K.noun}, and it's OK to publish under Perch &amp; Paw</label>
    <div class="ft"><button class="btn btn-secondary" data-x>Back to editing</button><button class="btn btn-primary" id="doPub" disabled>Publish</button></div></div>`;
  document.body.appendChild(sc);
  $$('[data-look]', sc).forEach((b) => b.onclick = () => { const r = b.closest('.chk'); r.classList.add('seen'); b.textContent = 'Looked'; b.disabled = true; b.style.color = 'var(--text-2)'; });
  $('#agree').onchange = (e) => $('#doPub').disabled = !e.target.checked;
  $('[data-x]', sc).onclick = () => sc.remove();
  sc.onclick = (e) => { if (e.target === sc) sc.remove(); };
  $('#doPub').onclick = async () => {
    $('#doPub').innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>Publishing'; $('#doPub').disabled = true;
    await wait(1100); sc.remove(); goLive();
  };
}
function goLive() {
  live[kind] = true; reviewed[kind] = true;
  const m = made.find((x) => x.kind === kind);
  const meta = kind === 'site' ? '212 sign-ups this week' : '48 answers this week';
  if (m) { m.live = true; m.addr = K.addr; m.meta = meta; m.draft = false; }
  else made.unshift({ t: kind, kind, name: K.name, meta, addr: K.addr, live: true, headline: kind === 'site' ? 'The cat tree that sold out is back' : 'Find the right bed' });
  paintBar(); renderPane();
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="live-hd"><span class="ok"><i class="ph-bold ph-check"></i></span><div><h3>${K.name} is live</h3><div class="sub">Anyone with the link can ${kind === 'site' ? 'visit it' : 'use it'}.</div></div></div>
    <div class="addr-big"><i class="ph ph-globe-simple" style="color:var(--text-2)"></i><span>${K.addr}</span><button class="btn btn-secondary btn-sm" data-copy><i class="ph ph-copy"></i>Copy</button><button class="btn btn-secondary btn-sm"><i class="ph ph-arrow-square-out"></i>Open</button></div>
    <div class="tip"><i class="ph ph-${kind === 'site' ? 'tray' : 'device-mobile'}"></i><span>${kind === 'site' ? 'Sign-ups show up under <b style="color:var(--text)">Responses</b>, and we\'ll email you for each one.' : 'On a phone, people can add it to their home screen and open it like any other app. Answers show up under <b style="color:var(--text)">Data</b>.'}</span></div>
    <div class="ft"><button class="btn btn-primary" data-x>Done</button></div></div>`;
  document.body.appendChild(sc);
  $('[data-copy]', sc).onclick = () => toast('Link copied');
  $('[data-x]', sc).onclick = () => sc.remove();
}

/* ───────── proto controls ───────── */
function reset() { runId++; $$('.scrim').forEach((s) => s.remove()); made = []; live = { site: false, app: false }; appStep = 0; appPick = 1; filter = 'all'; $$('#types button').forEach((x) => x.classList.toggle('on', x.dataset.f === 'all')); menu(false); }
const madeSite = () => made.unshift({ t: 'site', kind: 'site', name: KINDS.site.name, meta: 'Draft · edited just now', addr: 'Not published', headline: 'The cat tree that sold out is back' });
const madeApp = () => made.unshift({ t: 'app', kind: 'app', name: KINDS.app.name, meta: 'Draft · edited just now', addr: 'Not published', headline: 'Find the right bed' });
const STATES = {
  dash: () => { madeSite(); goDash(); },
  menu: () => { goDash(); setTimeout(() => menu(true), 30); },
  'create-site': () => startCreate('site'),
  'create-app': () => startCreate('app'),
  'editor-site': () => { madeSite(); openEditor('site'); },
  'editor-app': () => { madeApp(); openEditor('app'); },
  check: () => { madeSite(); openEditor('site'); openCheck(); },
  live: () => { madeSite(); openEditor('site'); kind = 'site'; K = KINDS.site; goLive(); },
  responses: () => { madeSite(); kind = 'site'; K = KINDS.site; live.site = true; made[0].live = true; made[0].addr = K.addr; made[0].meta = '212 sign-ups this week'; openEditor('site', 'responses'); },
  data: () => { madeApp(); live.app = true; made[0].live = true; made[0].addr = KINDS.app.addr; made[0].meta = '48 answers this week'; openEditor('app', 'data'); },
};
function go(s) { reset(); (STATES[s] || STATES.dash)(); $('#pSel').value = s; history.replaceState(null, '', '?s=' + s); }
$('#pSel').onchange = (e) => go(e.target.value);
$('#pRestart').onclick = () => go($('#pSel').value);
$('#pHide').onclick = () => $('#proto').hidden = true;
document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'h' && !e.target.closest('input, textarea, [contenteditable]')) $('#proto').hidden = !$('#proto').hidden; });
go(new URLSearchParams(location.search).get('s') || 'dash');
</script>
</body>
</html>
