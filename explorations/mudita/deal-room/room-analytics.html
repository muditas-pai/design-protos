<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <title>Deal room analytics — deal health, buying group — deal-room proto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../../design-system/pai.css" />

  <style>
    body { margin: 0; background: #EEF0F3; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .stage { position: fixed; inset: 0; overflow: auto; }
    .ghost-app { position: absolute; inset: 0; padding: 26px 32px; filter: saturate(0.6); opacity: 0.5; pointer-events: none; user-select: none; }
    .ghost-row { height: 13px; border-radius: 4px; background: #D7DBE0; margin-bottom: 12px; }
    .ghost-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
    .ghost-card { height: 190px; border-radius: 8px; background: #DDE1E6; }
    .scrim { position: fixed; inset: 0; background: rgba(10,25,37,0.42); backdrop-filter: blur(2px); }

    /* ---- layered shell: grey tray (header) + white content card ---- */
    .wrap { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .modal {
      position: relative; width: 100%; max-width: 728px; max-height: calc(100vh - 80px);
      display: flex; flex-direction: column; background: var(--bg-tertiary); padding: 4px;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(26,26,26,0.06), 0 4px 6px rgba(26,26,26,0.09), 0 24px 40px rgba(26,26,26,0.10), 0 56px 56px -32px rgba(26,26,26,0.22);
      animation: pop 340ms var(--ease-out-strong) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }

    /* ---- header (on the grey tray) ---- */
    .m-head { display: flex; align-items: flex-start; gap: 12px; padding: 12px 20px 14px; flex: none; }
    .logos { display: flex; align-items: center; gap: 7px; flex: none; }
    .logo { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(11,15,20,0.08); overflow: hidden; }
    .logo.pai { background: linear-gradient(135deg, #0A1925 0%, #1C3550 60%, #284B71 100%); }
    .logo.pai i { color: #FF5500; font-size: 21px; }
    .logo.buyer { background: #18181B; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
    .atitle { flex: 1; min-width: 0; padding-top: 2px; }
    .atitle .aname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; font-weight: 500; color: var(--text-primary); }
    .atitle .asub { font-size: 14px; color: var(--text-secondary); margin-top: 3px; }
    .aactions { display: flex; align-items: center; gap: 8px; flex: none; }
    .iconbtn { position: relative; width: 34px; height: 34px; border: 0; background: transparent; border-radius: 6px; color: var(--text-secondary);
      display: grid; place-items: center; cursor: pointer; font-size: 18px; transition: background 140ms var(--ease-out-strong), color 140ms, transform 140ms var(--ease-out-strong); }
    .iconbtn:hover { background: rgba(11,15,20,0.05); color: var(--text-primary); }
    .iconbtn:active { transform: scale(0.92); }
    .button-style { border-radius: 6px; }

    /* ---- white content card ---- */
    .card { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-elevated); border: 1px solid var(--border-primary); border-radius: 8px; overflow: hidden; }
    .ascreen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; animation: screenIn 220ms var(--ease-out-strong) both; }
    @keyframes screenIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ascreen { animation: none; } }

    /* ---- deal-health KPIs: read-only (24px regular numbers, no tab underline, no box) ---- */
    .kpis { display: flex; align-items: flex-start; gap: 24px; padding: 16px 24px; border-bottom: 1px solid var(--border-secondary); flex: none; }
    .kpi { flex: 1; min-width: 0; }
    .kpi .n { font-size: 24px; font-weight: 400; letter-spacing: -0.24px; line-height: 1.3; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .kpi .n .sm { color: var(--text-secondary); }
    .kpi .l { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--text-secondary); font-size: 14px; }
    .kpi .l i { font-size: 14px; color: var(--text-secondary); }

    .sec-label { color: var(--text-secondary); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin: 0 0 12px; }

    /* ---- buying group table ---- */
    .tablewrap { padding: 18px 24px 22px; }
    .bhead { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; border-bottom: 1px solid var(--border-secondary); }
    .bhead .lbl { color: var(--text-secondary); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .bhead .right { display: flex; gap: 36px; }
    .bhead .right .lbl { width: 72px; text-align: right; }
    .brow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; transition: background 120ms var(--ease-out-strong); }
    .brow:hover { background: var(--bg-tertiary); }
    .brow:active { background: var(--bg-quaternary); }
    .bwho { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .who { min-width: 0; }
    .who .nm { display: flex; align-items: center; gap: 6px; }
    .who .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 14px; }
    .who .em { color: var(--text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .newpill { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
      color: #0055ED; background: rgba(0,85,237,0.12); padding: 2px 6px; border-radius: 4px; }
    .bmetrics { display: flex; align-items: center; gap: 36px; flex: none; }
    .blast { color: var(--text-primary); font-size: 14px; font-variant-numeric: tabular-nums; width: 72px; text-align: right; }
    .btime { color: var(--text-primary); font-size: 14px; font-variant-numeric: tabular-nums; width: 60px; text-align: right; }
    .bchev { color: var(--text-tertiary); font-size: 15px; opacity: 0; transition: opacity 120ms var(--ease-out-strong); margin-left: -22px; }
    .brow:hover .bchev { opacity: 0.5; }

    /* ---- avatars: rounded-square (new visual). known = initials; anonymous = pastel smiley ---- */
    .av { width: 32px; height: 32px; flex: none; border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 12px; color: #fff; box-shadow: 0 0 0 1px rgba(11,15,20,0.06); }
    .av.smiley { color: #6366F1; background: #E0E7FF; box-shadow: inset 0 0 0 1px rgba(11,15,20,0.06); }
    .av.smiley i { font-size: 20px; }

    /* ---- person drill-in ---- */
    .pwrap { padding: 16px 24px 24px; }
    .backbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 4px 8px 4px 6px; margin: 0 0 16px -6px;
      border-radius: 6px; color: var(--text-secondary); font-family: inherit; font-size: 14px; cursor: pointer;
      transition: background 140ms var(--ease-out-strong), color 140ms, transform 140ms var(--ease-out-strong); }
    .backbtn i { font-size: 15px; }
    .backbtn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .backbtn:active { transform: scale(0.97); }
    .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .pident { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .phead .av { width: 44px; height: 44px; font-size: 16px; border-radius: 8px; }
    .phead .av.smiley i { font-size: 26px; }
    .pwho { min-width: 0; }
    .pname { display: flex; align-items: center; gap: 8px; }
    .pname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 18px; font-weight: 500; }
    .champ { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #0055ED; background: rgba(0,85,237,0.12); padding: 2px 7px; border-radius: 4px; }
    .pmeta { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
    .plast { text-align: right; flex: none; }
    .plast .ll { color: var(--text-secondary); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .plast .pl { color: var(--text-primary); font-size: 14px; margin-top: 3px; }
    .pstats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .pstat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); background: var(--bg-tertiary); padding: 6px 11px; border-radius: 7px; }
    .pstat i { font-size: 14px; color: var(--text-tertiary); }
    .pstat b { color: var(--text-primary); font-weight: 600; }
    .orow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 8px; transition: background 120ms var(--ease-out-strong); }
    .orow:hover { background: var(--bg-tertiary); }
    .rico { width: 34px; height: 34px; flex: none; border-radius: 7px; background: var(--bg-tertiary); display: grid; place-items: center; color: var(--text-secondary); font-size: 17px; }
    .rico.deck { background: #0A1925; color: #fff; }
    .orow .rn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 14px; }
    .okchip { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #16A34A; }
    .okchip i { font-size: 15px; }
    .cov { flex: none; display: flex; align-items: center; gap: 10px; }
    .cov .track { width: 90px; height: 8px; border-radius: 4px; background: var(--bg-quaternary); overflow: hidden; }
    .cov .track > i { display: block; height: 8px; border-radius: 4px; background-image: linear-gradient(90deg, #A3D3FF 0%, #005EFF 60%, #01358E 100%); background-repeat: no-repeat; background-position: left center; }
    .cov small { color: var(--text-primary); font-size: 13px; font-variant-numeric: tabular-nums; }
    .nopills { display: flex; flex-wrap: wrap; gap: 7px; }
    .nopill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); background: var(--bg-tertiary); padding: 5px 10px; border-radius: 6px; }
    .nopill i { font-size: 14px; }

    #listScreen[hidden], #personScreen[hidden] { display: none; }
    .reopen { position: fixed; inset: 0; display: none; place-items: center; }
    .reopen.show { display: grid; }
  </style>
</head>

<body class="pai">
  <div class="stage">
    <div class="ghost-app" aria-hidden="true">
      <div class="ghost-row" style="width:200px;height:20px;"></div>
      <div class="ghost-row" style="width:130px;margin-top:18px;"></div>
      <div class="ghost-grid"><div class="ghost-card"></div><div class="ghost-card"></div><div class="ghost-card"></div></div>
    </div>
    <div class="scrim" aria-hidden="true"></div>

    <div class="wrap">
      <div class="modal" role="dialog" aria-label="Deal room analytics" id="modal">

        <!-- HEADER (on the grey tray) -->
        <div class="m-head">
          <div class="logos" title="presentations.ai × Acme Corp">
            <div class="logo pai"><i class="ph-fill ph-presentation-chart"></i></div>
            <div class="logo buyer">A</div>
          </div>
          <div class="atitle">
            <div class="aname">Acme Corp deal room</div>
            <div class="asub">Opened 12 days ago</div>
          </div>
          <div class="aactions">
            <button class="button-style button-medium button-secondary"><i class="ph ph-link"></i>&nbsp;Share room</button>
            <button class="iconbtn" title="Close" onclick="closeModal()"><i class="ph ph-x"></i></button>
          </div>
        </div>

        <!-- WHITE CONTENT CARD -->
        <div class="card">
          <!-- ===== ROOM ===== -->
          <div class="ascreen" id="listScreen">
            <!-- deal health (read-only KPIs) -->
            <div class="kpis">
              <div class="kpi">
                <div class="n">2h ago</div>
                <div class="l"><i class="ph ph-pulse"></i>Last active</div>
              </div>
              <div class="kpi">
                <div class="n">6<span class="sm"> people</span></div>
                <div class="l"><i class="ph ph-users-three"></i>Engaged · 2 companies</div>
              </div>
              <div class="kpi">
                <div class="n">5<span class="sm"> / 6</span></div>
                <div class="l"><i class="ph ph-folder-open"></i>Resources opened</div>
              </div>
            </div>

            <!-- buying group -->
            <div class="tablewrap">
              <div class="bhead">
                <span class="lbl">Buying group</span>
                <div class="right"><span class="lbl">Last active</span><span class="lbl">Time</span></div>
              </div>
              <div id="groupList"></div>
            </div>
          </div>

          <!-- ===== PERSON DRILL-IN ===== -->
          <div class="ascreen" id="personScreen" hidden>
            <div class="pwrap">
              <button class="backbtn" onclick="closePerson()"><i class="ph ph-arrow-left"></i>Back to the buying group</button>
              <div class="phead">
                <div class="pident">
                  <div class="av" id="phAv"></div>
                  <div class="pwho"><div class="pname" id="phName"></div><div class="pmeta" id="phMeta"></div></div>
                </div>
                <div class="plast"><div class="ll">Last active</div><div class="pl" id="phLast"></div></div>
              </div>
              <div class="pstats" id="pStats"></div>
              <p class="sec-label" style="margin-top:22px;">What they opened &nbsp;·&nbsp; <span id="pResCount"></span></p>
              <div id="pOpened"></div>
              <div id="pNot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="reopen" id="reopen">
      <button class="button-style button-large button-primary" onclick="openModal()"><i class="ph ph-chart-bar"></i>&nbsp;Open room analytics</button>
    </div>
  </div>

  <script>
    var GRAD = "linear-gradient(90deg, #A3D3FF 0%, #005EFF 60%, #01358E 100%)";
    // windowed gradient: the fill shows the left `pct%` of a track-width gradient, so
    // longer bars reveal the darker end (matches the deck design).
    function covBar(pct) {
      return '<div class="track"><i style="width:' + pct + '%; background-size:' + (pct > 0 ? (10000 / pct) : 100) + '% 100%;"></i></div>';
    }

    var resources = [
      { name: "Platform Overview", type: "deck", icon: "ph-projector-screen-chart" },
      { name: "Acme × PAI case study", type: "pdf", icon: "ph-file-pdf" },
      { name: "Pricing & packaging", type: "pdf", icon: "ph-file-pdf" },
      { name: "2-min product tour", type: "video", icon: "ph-play-circle" },
      { name: "Security overview", type: "pdf", icon: "ph-file-pdf" },
      { name: "Book a technical deep-dive", type: "link", icon: "ph-calendar-plus" },
    ];

    // in a room we capture name + email (the email gate); company comes from the domain.
    var people = [
      { nm: "Sarah Chen", email: "sarah.chen@acme.com", init: "SC", col: "#0055ED", champ: true, last: "2h ago", sessions: 5, time: "14:20", seen: 12, opened: [0,1,2,3,4] },
      { nm: "Priya Nair", email: "priya.nair@acme.com", init: "PN", col: "#DB2777", last: "Yesterday", sessions: 3, time: "9:05", seen: 12, opened: [0,1,2] },
      { nm: "David Kim", email: "david.kim@acme.com", init: "DK", col: "#059669", isNew: true, last: "3h ago", sessions: 2, time: "3:40", seen: 6, opened: [0,4] },
      { nm: "Michael Reeves", email: "m.reeves@acme.com", init: "MR", col: "#7C3AED", last: "1h ago", sessions: 1, time: "2:18", seen: 8, opened: [0,3] },
      { nm: "Jordan Blake", email: "jordan@meridianlegal.com", init: "JB", col: "#D97706", isNew: true, last: "Today", sessions: 1, time: "1:12", seen: 3, opened: [2] },
      { anon: true, loc: "London", device: "Chrome · MacOS", last: "Yesterday", sessions: 1, time: "0:48", seen: 4, opened: [0] },
    ];
    function psub(p) { return p.anon ? p.device : p.email; }
    function avatar(p, cls) {
      if (p.anon) return '<div class="av smiley ' + (cls || '') + '"><i class="ph-fill ph-smiley"></i></div>';
      return '<div class="av ' + (cls || '') + '" style="background:' + p.col + '">' + p.init + '</div>';
    }
    function groupRow(p, i) {
      var name = p.anon ? "Visitor from " + p.loc : p.nm;
      var pill = p.isNew ? '<span class="newpill"><i class="ph-bold ph-arrow-bend-double-up-right"></i>New</span>' : '';
      return '<div class="brow" role="button" tabindex="0" onclick="openPerson(' + i + ')">' +
        '<div class="bwho">' + avatar(p) + '<div class="who"><div class="nm"><span>' + name + '</span>' + pill + '</div><div class="em">' + psub(p) + '</div></div></div>' +
        '<div class="bmetrics"><div class="blast">' + p.last + '</div><div class="btime">' + p.time + '</div><i class="ph ph-caret-right bchev"></i></div></div>';
    }
    document.getElementById("groupList").innerHTML = people.map(groupRow).join("");

    function openPerson(i) {
      var p = people[i];
      var av = document.getElementById("phAv");
      if (p.anon) { av.className = "av smiley"; av.style.background = ""; av.innerHTML = '<i class="ph-fill ph-smiley"></i>'; }
      else { av.className = "av"; av.style.background = p.col; av.textContent = p.init; }
      document.getElementById("phName").innerHTML = '<span class="nm">' + (p.anon ? "Visitor from " + p.loc : p.nm) + '</span>' +
        (p.champ ? '<span class="champ">Champion</span>' : '') +
        (p.isNew ? '<span class="newpill"><i class="ph-bold ph-arrow-bend-double-up-right"></i>New</span>' : '');
      document.getElementById("phMeta").textContent = psub(p);
      document.getElementById("phLast").textContent = p.last;
      document.getElementById("pStats").innerHTML =
        '<div class="pstat"><i class="ph ph-arrows-clockwise"></i><b>' + p.sessions + '</b>' + (p.sessions === 1 ? " session" : " sessions") + '</div>' +
        '<div class="pstat"><i class="ph ph-timer"></i><b>' + p.time + '</b> in room</div>';
      document.getElementById("pResCount").textContent = p.opened.length + " of " + resources.length;
      document.getElementById("pOpened").innerHTML = p.opened.map(function (ri) {
        var r = resources[ri];
        var detail = (r.type === "deck")
          ? '<div class="cov">' + covBar(Math.round(p.seen / 12 * 100)) + '<small>' + p.seen + '/12 slides</small></div>'
          : '<span class="okchip"><i class="ph-fill ph-check-circle"></i>Opened</span>';
        return '<div class="orow"><div class="rico' + (r.type === "deck" ? " deck" : "") + '"><i class="ph ' + r.icon + '"></i></div><div class="rn">' + r.name + '</div>' + detail + '</div>';
      }).join("");
      var notIdx = resources.map(function (_, ri) { return ri; }).filter(function (ri) { return p.opened.indexOf(ri) < 0; });
      document.getElementById("pNot").innerHTML = notIdx.length
        ? '<p class="sec-label" style="margin-top:20px;">Not opened</p><div class="nopills">' + notIdx.map(function (ri) { return '<span class="nopill"><i class="ph ph-eye-slash"></i>' + resources[ri].name + '</span>'; }).join("") + '</div>'
        : "";
      document.getElementById("listScreen").hidden = true;
      document.getElementById("personScreen").hidden = false;
    }
    function closePerson() {
      document.getElementById("personScreen").hidden = true;
      document.getElementById("listScreen").hidden = false;
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; document.querySelector(".scrim").style.opacity = ".5"; document.getElementById("reopen").classList.add("show"); }
    function openModal() { document.getElementById("modal").style.display = "flex"; document.querySelector(".scrim").style.opacity = "1"; document.getElementById("reopen").classList.remove("show"); }
  </script>
</body>
</html>
