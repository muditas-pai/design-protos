<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <title>Deal room analytics — deal health, next steps, buying group — deal-room proto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../../design-system/pai.css" />

  <style>
    body { margin: 0; background: #EEF0F3; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .stage { position: fixed; inset: 0; overflow: auto; }
    .ghost-app { position: absolute; inset: 0; padding: 26px 32px; filter: saturate(0.6); opacity: 0.5; pointer-events: none; user-select: none; }
    .ghost-row { height: 13px; border-radius: 4px; background: #D7DBE0; margin-bottom: 12px; }
    .ghost-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
    .ghost-card { height: 190px; border-radius: 8px; background: #DDE1E6; }
    .scrim { position: fixed; inset: 0; background: rgba(10,25,37,0.42); backdrop-filter: blur(2px); }

    /* ---- modal shell ---- */
    .wrap { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .modal {
      position: relative; width: 100%; max-width: 720px; max-height: calc(100vh - 80px);
      display: flex; flex-direction: column; background: var(--bg-elevated);
      border-radius: 10px; box-shadow: var(--shadow-elevation-03); overflow: hidden;
      animation: pop 340ms var(--ease-out-strong) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }

    /* ---- header ---- */
    .m-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border-secondary); flex: none; }
    .thumb { width: 44px; height: 44px; border-radius: 8px; flex: none; box-shadow: 0 0 0 1px rgba(11,15,20,0.10);
      background: linear-gradient(135deg, #0A1925 0%, #1C3550 60%, #284B71 100%); position: relative; display: grid; place-items: center; }
    .thumb i { color: #fff; font-size: 20px; opacity: .95; }
    .atitle { flex: 1; min-width: 0; }
    .atitle .aname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
    .status { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #15803D; background: rgba(22,163,74,0.12); padding: 3px 8px; border-radius: 999px; }
    .status i { font-size: 8px; }
    .aactions { display: flex; align-items: center; gap: 8px; flex: none; }
    .iconbtn { position: relative; width: 34px; height: 34px; border: 0; background: transparent; border-radius: 6px; color: var(--text-secondary);
      display: grid; place-items: center; cursor: pointer; font-size: 18px; transition: background 140ms var(--ease-out-strong), color 140ms, transform 140ms var(--ease-out-strong); }
    .iconbtn:hover { background: var(--bg-elevated-hover); color: var(--text-primary); }
    .iconbtn:active { transform: scale(0.92); }
    .button-style { border-radius: 6px; }

    .body { overflow-y: auto; padding: 20px 18px 22px; }
    .sec-label { color: var(--text-tertiary); margin: 24px 0 10px; }
    .sec-label.first { margin-top: 0; }
    .ascreen { animation: screenIn 220ms var(--ease-out-strong) both; }
    @keyframes screenIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ascreen { animation: none; } }

    /* ---- deal-health tiles ---- */
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border-secondary); border-radius: 7px; overflow: hidden; }
    .stat-tile { padding: 12px 14px; border-right: 1px solid var(--border-secondary); min-width: 0; }
    .stat-tile:last-child { border-right: 0; }
    .stat-tile .n { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat-tile .n .sm { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
    .stat-tile .n-sub { font-size: 11.5px; font-weight: 500; color: var(--text-tertiary); }
    .stat-tile .l { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: var(--text-secondary); font-size: 12.5px; font-weight: 500; }
    .stat-tile .l i { font-size: 13px; color: var(--text-tertiary); }
    .spark { height: 26px; margin-bottom: 6px; }
    .spark svg { display: block; width: 100%; height: 26px; }

    /* ---- buying group table ---- */
    .bhead, .brow { display: grid; grid-template-columns: minmax(0,1fr) 108px 100px; align-items: center; gap: 10px; }
    .bhead { padding: 0 8px 8px; border-bottom: 1px solid var(--border-secondary); }
    .bhead span { color: var(--text-tertiary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .bhead .r, .brow .r { text-align: right; }
    .brow { padding: 9px 8px; border-radius: 6px; cursor: pointer; transition: background 120ms var(--ease-out-strong); }
    .brow:hover { background: var(--bg-secondary); }
    .bwho { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .bwho .who { min-width: 0; }
    .bwho .nm { display: flex; align-items: center; gap: 5px; }
    .bwho .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 13.5px; font-weight: 500; }
    .bwho .rl { color: var(--text-tertiary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .newpill { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
      color: #0055ED; background: rgba(0,85,237,0.12); padding: 2px 6px; border-radius: 4px; }
    .blast { color: var(--text-secondary); font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .bengage { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .bengage .mini { width: 48px; height: 6px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; }
    .bengage .mini > i { display: block; height: 100%; background: #0055ED; border-radius: 3px; }
    .bengage small { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
    .bdiv { display: flex; align-items: center; gap: 10px; padding: 13px 8px 6px; }
    .bdiv span { color: var(--text-tertiary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    .bdiv::after { content: ""; flex: 1; height: 1px; background: var(--border-secondary); }

    /* shared avatar */
    .av { border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; color: #fff; box-shadow: 0 0 0 1px rgba(11,15,20,0.06); width: 30px; height: 30px; font-size: 12px; }
    .av.anon { background: var(--bg-quaternary); color: var(--text-tertiary); }

    /* ---- person drill-in ---- */
    .backbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 4px 8px 4px 6px; margin: 0 0 14px -6px;
      border-radius: 6px; color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 140ms var(--ease-out-strong), color 140ms, transform 140ms var(--ease-out-strong); }
    .backbtn i { font-size: 15px; }
    .backbtn:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .backbtn:active { transform: scale(0.97); }
    .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .pident { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .phead .av { width: 44px; height: 44px; font-size: 16px; }
    .phead .av.anon i { font-size: 20px; }
    .pwho { min-width: 0; }
    .pname { display: flex; align-items: center; gap: 8px; }
    .pname .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 17px; font-weight: 600; }
    .newpill.lg { font-size: 10px; }
    .pmeta { color: var(--text-tertiary); font-size: 13px; margin-top: 1px; }
    .plast { text-align: right; flex: none; }
    .plast .pl { color: var(--text-primary); font-size: 14px; font-weight: 500; margin-top: 2px; }
    .psum { margin: 14px 0 0; color: var(--text-secondary); font-size: 13px; }
    .pres { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 11px; padding: 8px 6px; }
    .rico { width: 30px; height: 30px; flex: none; border-radius: 6px; background: var(--bg-secondary); display: grid; place-items: center; color: var(--text-secondary); font-size: 16px; }
    .rico.deck { background: #0A1925; color: #fff; }
    .pres .rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 13px; }
    .pres.off .rn { color: var(--text-tertiary); }
    .pres.off .rico { background: var(--bg-secondary); color: var(--text-tertiary); }
    .pres.off .rico.deck { background: var(--bg-tertiary); color: var(--text-tertiary); }
    .popen { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-tertiary); }
    .popen.yes { color: #16A34A; }
    .popen i { font-size: 14px; }

    #listScreen[hidden], #personScreen[hidden] { display: none; }
    .reopen { position: fixed; inset: 0; display: none; place-items: center; }
    .reopen.show { display: grid; }
  </style>
</head>

<body class="pai">
  <div class="stage">
    <div class="ghost-app" aria-hidden="true">
      <div class="ghost-row" style="width:200px;height:20px;"></div>
      <div class="ghost-row" style="width:130px;margin-top:18px;"></div>
      <div class="ghost-grid"><div class="ghost-card"></div><div class="ghost-card"></div><div class="ghost-card"></div></div>
    </div>
    <div class="scrim" aria-hidden="true"></div>

    <div class="wrap">
      <div class="modal" role="dialog" aria-label="Deal room analytics" id="modal">

        <!-- HEADER -->
        <div class="m-head">
          <div class="thumb"><i class="ph ph-door-open"></i></div>
          <div class="atitle">
            <div class="aname text-body-lg-semibold text-text-primary">Acme Corp deal room <span class="status"><i class="ph-fill ph-circle"></i>Active</span></div>
            <div class="text-body-sm-regular text-text-tertiary">Opened 12 days ago · 6 resources shared</div>
          </div>
          <div class="aactions">
            <button class="button-style button-medium button-secondary"><i class="ph ph-link"></i>&nbsp;Share room</button>
            <button class="iconbtn" title="Close" onclick="closeModal()"><i class="ph ph-x"></i></button>
          </div>
        </div>

        <div class="body">
          <!-- ===== ROOM ===== -->
          <div class="ascreen" id="listScreen">

            <!-- deal health: is it moving? -->
            <div class="tiles">
              <div class="stat-tile">
                <div class="spark" id="spark"></div>
                <div class="n">2h<span class="sm"> ago</span></div>
                <div class="l"><i class="ph ph-pulse"></i>Last active</div>
              </div>
              <div class="stat-tile">
                <div class="n">6 <span class="n-sub">of ~10</span></div>
                <div class="l"><i class="ph ph-users-three"></i>Engaged · 2 companies</div>
              </div>
              <div class="stat-tile">
                <div class="n">5<span class="sm"> / 6</span></div>
                <div class="l"><i class="ph ph-folder-open"></i>Resources opened</div>
              </div>
            </div>

            <!-- who's engaged: the buying group -->
            <p class="sec-label text-overline-small">Buying group &nbsp;·&nbsp; 6 people, 2 companies</p>
            <div class="bhead"><span>Person</span><span class="r">Last active</span><span class="r">Engaged</span></div>
            <div id="groupList"></div>
          </div>

          <!-- ===== PERSON DRILL-IN ===== -->
          <div class="ascreen" id="personScreen" hidden>
            <button class="backbtn" onclick="closePerson()"><i class="ph ph-arrow-left"></i>Back to the buying group</button>
            <div class="phead">
              <div class="pident">
                <div class="av" id="phAv"></div>
                <div class="pwho"><div class="pname" id="phName"></div><div class="pmeta" id="phMeta"></div></div>
              </div>
              <div class="plast"><div class="sec-label first text-overline-small">Last active</div><div class="pl" id="phLast"></div></div>
            </div>
            <div class="psum" id="phSum"></div>
            <p class="sec-label text-overline-small">What they opened &nbsp;·&nbsp; <span id="pResCount"></span></p>
            <div id="pResList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="reopen" id="reopen">
      <button class="button-style button-large button-primary" onclick="openModal()"><i class="ph ph-chart-bar"></i>&nbsp;Open room analytics</button>
    </div>
  </div>

  <script>
    // resources are only named here so the per-person drill-in can label what they opened
    var resources = [
      { name: "Platform Overview", type: "deck", icon: "ph-projector-screen-chart" },
      { name: "Acme × PAI case study", type: "pdf", icon: "ph-file-pdf" },
      { name: "Pricing & packaging", type: "pdf", icon: "ph-file-pdf" },
      { name: "2-min product tour", type: "video", icon: "ph-play-circle" },
      { name: "Security overview", type: "pdf", icon: "ph-file-pdf" },
      { name: "Book a technical deep-dive", type: "link", icon: "ph-calendar-plus" },
    ];

    // ---- momentum sparkline (opens/day, last 9 days) ----
    (function () {
      var vals = [3, 6, 4, 2, 1, 5, 9, 7, 11], w = 132, h = 26, pad = 3, n = vals.length, mx = Math.max.apply(null, vals);
      var pts = vals.map(function (v, i) { var x = pad + i * (w - 2 * pad) / (n - 1); var y = h - pad - (v / mx) * (h - 2 * pad); return { x: x, y: y }; });
      var pstr = pts.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
      var area = "M" + pts[0].x.toFixed(1) + "," + (h - pad) + " L" + pstr.replace(/ /g, " L") + " L" + pts[n - 1].x.toFixed(1) + "," + (h - pad) + " Z";
      var last = pts[n - 1];
      document.getElementById("spark").innerHTML =
        '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
        '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0055ED" stop-opacity="0.16"/><stop offset="1" stop-color="#0055ED" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#sg)"/>' +
        '<polyline points="' + pstr + '" fill="none" stroke="#0055ED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="2.4" fill="#0055ED"/></svg>';
    })();

    // ---- the buying group (who's engaged) ----
    var people = [
      { nm: "Sarah Chen", role: "VP Engineering · Acme Corp", company: "Acme Corp", init: "SC", col: "#0055ED", champ: true, last: "2h ago", sessions: 5, time: "14:20", seen: 12, opened: [0,1,2,3,4], eng: 0.95 },
      { nm: "Priya Nair", role: "Product Lead · Acme Corp", company: "Acme Corp", init: "PN", col: "#DB2777", last: "Yesterday", sessions: 3, time: "9:05", seen: 12, opened: [0,1,2], eng: 0.7 },
      { nm: "David Kim", role: "IT / Security · Acme Corp", company: "Acme Corp", init: "DK", col: "#059669", isNew: true, last: "3h ago", sessions: 2, time: "3:40", seen: 6, opened: [0,4], eng: 0.42 },
      { nm: "Michael Reeves", role: "Staff Engineer · Acme Corp", company: "Acme Corp", init: "MR", col: "#7C3AED", last: "1h ago", sessions: 1, time: "2:18", seen: 8, opened: [0,3], eng: 0.28 },
      { nm: "Jordan Blake", role: "Legal advisor · Meridian Legal", company: "Meridian Legal", init: "JB", col: "#D97706", isNew: true, last: "Today", sessions: 1, time: "1:12", seen: 3, opened: [2], eng: 0.2 },
      { anon: true, role: "Chrome · London", company: "Anonymous", loc: "London", device: "Chrome", last: "Yesterday", sessions: 1, time: "0:48", seen: 4, opened: [0], eng: 0.15 },
    ];
    function groupRow(p, i) {
      var av = p.anon ? '<div class="av anon"><i class="ph ph-globe-simple"></i></div>' : '<div class="av" style="background:' + p.col + '">' + p.init + '</div>';
      var name = p.anon ? "Anonymous visitor" : p.nm;
      var pill = p.isNew ? '<span class="newpill"><i class="ph-bold ph-arrow-bend-double-up-right"></i>New</span>' : '';
      return '<div class="brow" role="button" tabindex="0" onclick="openPerson(' + i + ')">' +
        '<div class="bwho">' + av + '<div class="who"><div class="nm"><span>' + name + '</span>' + pill + '</div><div class="rl">' + p.role + '</div></div></div>' +
        '<div class="blast r">' + p.last + '</div>' +
        '<div class="bengage r"><div class="mini"><i style="width:' + Math.round(p.eng * 100) + '%"></i></div><small>' + p.time + '</small></div></div>';
    }
    function renderGroup() {
      var companies = [];
      people.forEach(function (p) { if (!p.anon && companies.indexOf(p.company) < 0) companies.push(p.company); });
      var html = "";
      companies.forEach(function (c) {
        var n = people.filter(function (p) { return !p.anon && p.company === c; }).length;
        html += '<div class="bdiv"><span>' + c + ' · ' + n + '</span></div>';
        people.forEach(function (p, i) { if (!p.anon && p.company === c) html += groupRow(p, i); });
      });
      html += '<div class="bdiv"><span>Anonymous</span></div>';
      people.forEach(function (p, i) { if (p.anon) html += groupRow(p, i); });
      document.getElementById("groupList").innerHTML = html;
    }
    renderGroup();

    // ---- per-person drill-in: what did THEY open ----
    function openPerson(i) {
      var p = people[i];
      var av = document.getElementById("phAv");
      if (p.anon) { av.className = "av anon"; av.style.background = ""; av.innerHTML = '<i class="ph ph-globe-simple"></i>'; }
      else { av.className = "av"; av.style.background = p.col; av.textContent = p.init; }
      document.getElementById("phName").innerHTML = '<span class="nm">' + (p.anon ? "Anonymous visitor" : p.nm) + '</span>' +
        (p.champ ? '<span class="newpill lg" style="color:#0055ED;background:rgba(0,85,237,0.12);">Champion</span>' : '') +
        (p.isNew ? '<span class="newpill lg"><i class="ph-bold ph-arrow-bend-double-up-right"></i>New</span>' : '');
      document.getElementById("phMeta").textContent = p.role;
      document.getElementById("phLast").textContent = p.last;
      document.getElementById("phSum").textContent = p.sessions + (p.sessions === 1 ? " session" : " sessions") + " · " + p.time + " in room";
      document.getElementById("pResCount").textContent = p.opened.length + " of " + resources.length;
      document.getElementById("pResList").innerHTML = resources.map(function (r, ri) {
        var open = p.opened.indexOf(ri) >= 0;
        var note = (r.type === "deck" && open) ? ("viewed " + p.seen + "/12 slides") : "Opened";
        return '<div class="pres' + (open ? '' : ' off') + '"><div class="rico' + (r.type === "deck" ? ' deck' : '') + '"><i class="ph ' + r.icon + '"></i></div>' +
          '<div class="rn">' + r.name + '</div>' +
          (open ? '<div class="popen yes"><i class="ph-fill ph-check-circle"></i>' + note + '</div>'
                : '<div class="popen"><i class="ph ph-eye-slash"></i>Not opened</div>') + '</div>';
      }).join("");
      document.getElementById("listScreen").hidden = true;
      document.getElementById("personScreen").hidden = false;
      document.querySelector(".body").scrollTop = 0;
    }
    function closePerson() {
      document.getElementById("personScreen").hidden = true;
      document.getElementById("listScreen").hidden = false;
      document.querySelector(".body").scrollTop = 0;
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; document.querySelector(".scrim").style.opacity = ".5"; document.getElementById("reopen").classList.add("show"); }
    function openModal() { document.getElementById("modal").style.display = "flex"; document.querySelector(".scrim").style.opacity = "1"; document.getElementById("reopen").classList.remove("show"); }
  </script>
</body>
</html>
