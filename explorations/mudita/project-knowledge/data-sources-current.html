<script>
// Connector catalog + "Add connector" dialog (replica of settings/datasources/AddConnectorDialog.jsx, PR #6872).
const CATALOG = [
  { id: 'googledrive', name: 'Google Drive', slug: 'googledrive', cat: 'file management & storage', chip: 'files', popular: true, desc: 'Read docs, sheets and slides from your Drive so decks can quote them.' },
  { id: 'hubspot', name: 'HubSpot', slug: 'hubspot', cat: 'crm', chip: 'crm', popular: true, desc: 'Pull deals, pipeline and company records into sales and QBR decks.' },
  { id: 'notion', name: 'Notion', slug: 'notion', cat: 'notes', chip: 'notes', popular: true, desc: 'Use pages and databases from your workspace as source material.' },
  { id: 'salesforce', name: 'Salesforce', slug: null, color: '#00A1E0', cat: 'crm', chip: 'crm', popular: true, desc: 'Bring opportunities, accounts and forecasts into your decks.' },
  { id: 'googlesheets', name: 'Google Sheets', slug: 'googlesheets', cat: 'spreadsheets', chip: 'spreadsheets', popular: true, desc: 'Turn rows and charts from a sheet into slides with real numbers.' },
  { id: 'slack', name: 'Slack', slug: null, color: '#4A154B', cat: 'team chat', chip: 'chat', popular: true, desc: 'Reference channel threads and announcements your team already wrote.' },
  { id: 'confluence', name: 'Confluence', slug: 'confluence', cat: 'documents', chip: 'documents', popular: false, desc: 'Draw on specs, wikis and team pages.' },
  { id: 'dropbox', name: 'Dropbox', slug: 'dropbox', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read files stored in your Dropbox folders.' },
  { id: 'airtable', name: 'Airtable', slug: 'airtable', cat: 'spreadsheets', chip: 'spreadsheets', popular: false, desc: 'Use bases and views as structured data for slides.' },
  { id: 'jira', name: 'Jira', slug: 'jira', cat: 'project management', chip: 'projects', popular: false, desc: 'Summarise epics, sprints and roadmaps for status updates.' },
  { id: 'asana', name: 'Asana', slug: 'asana', cat: 'project management', chip: 'projects', popular: false, desc: 'Pull project status and milestones into updates.' },
  { id: 'linear', name: 'Linear', slug: 'linear', cat: 'project management', chip: 'projects', popular: false, desc: 'Turn cycles and projects into progress slides.' },
  { id: 'gmail', name: 'Gmail', slug: 'gmail', cat: 'email', chip: 'email', popular: false, desc: 'Reference email threads with customers and partners.' },
  { id: 'googleanalytics', name: 'Google Analytics', slug: 'googleanalytics', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Chart traffic and conversion trends from GA4.' },
  { id: 'mixpanel', name: 'Mixpanel', slug: 'mixpanel', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Bring product usage metrics into reviews.' },
  { id: 'quickbooks', name: 'QuickBooks', slug: 'quickbooks', cat: 'accounting', chip: 'accounting', popular: false, desc: 'Use revenue and expense figures in finance decks.' },
  { id: 'onedrive', name: 'OneDrive', slug: null, color: '#0364B8', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read Word, Excel and PowerPoint files from OneDrive.' },
  { id: 'pipedrive', name: 'Pipedrive', slug: null, color: '#1A1A1A', cat: 'crm', chip: 'crm', popular: false, desc: 'Pull deals and activity into pipeline reviews.' },
  { id: 'zendesk', name: 'Zendesk', slug: 'zendesk', cat: 'customer support', chip: 'more', popular: false, desc: 'Summarise ticket trends and CSAT for account reviews.' },
  { id: 'intercom', name: 'Intercom', slug: 'intercom', cat: 'customer support', chip: 'more', popular: false, desc: 'Use conversation themes in customer decks.' },
];
const CHIPS = [['crm','CRM'],['documents','Documents'],['files','File storage'],['spreadsheets','Spreadsheets'],['notes','Notes'],['projects','Project management'],['analytics','Analytics'],['email','Email'],['chat','Team chat'],['accounting','Accounting'],['more','More']];
const ACR = new Set(['crm','ai','hr','url','sms','seo']);
const catLabel = (t) => (t || '').replace(/\b\w+/g, (w) => ACR.has(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1));
const appById = (id) => CATALOG.find((a) => a.id === id);

// AppLogo: logo on a soft sunken tile, initials when there's no logo or it fails to load.
function appLogo(app, size = 'md', extraClass = '') {
  const box = size === 'lg' ? 'h-12 w-12' : size === 'sm' ? 'h-8 w-8' : size === 'xs' ? 'h-5 w-5' : 'h-9 w-9';
  const img = size === 'lg' ? 'h-7 w-7' : size === 'sm' ? 'h-[18px] w-[18px]' : size === 'xs' ? 'h-3 w-3' : 'h-5 w-5';
  const tiny = size === 'xs' ? 'text-[6px]' : 'text-[10px]';
  const initials = app.name.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const fallback = `<span class='text-caption font-semibold text-text-secondary'>${initials}</span>`;
  const inner = app.slug
    ? `<img src="https://cdn.simpleicons.org/${app.slug}" alt="" class="${img} object-contain" loading="lazy" onerror="this.outerHTML=&quot;${fallback}&quot;" />`
    : `<span class="flex ${img} items-center justify-center rounded-[3px] ${tiny} font-bold text-white" style="background:${app.color}">${initials}</span>`;
  return `<span class="flex ${box} shrink-0 items-center justify-center overflow-hidden rounded-control bg-bg-tertiary ${extraClass}">${inner}</span>`;
}

// The dialog. opts: { isConnected(id), onConnect(id) -> Promise, title, description }
const ConnectorDialog = (() => {
  let root, state = { q: '', chip: '', busy: null, opts: null };
  function mount() {
    root = document.createElement('div');
    root.className = 'fixed inset-0 z-[70] hidden';
    root.innerHTML = `
      <div class="absolute inset-0 bg-black/45 backdrop-blur-[2px] opacity-0 transition-opacity duration-200" data-x data-fade></div>
      <div class="pointer-events-none absolute inset-0 flex items-end justify-center p-3 sm:items-center sm:p-6">
        <div data-panel role="dialog" aria-modal="true" class="pointer-events-auto relative w-full max-w-3xl translate-y-2 scale-[0.98] overflow-hidden rounded-dialog border border-border-secondary bg-bg-default-primary opacity-0 shadow-dialog transition-[opacity,transform] duration-200 ease-std">
          <div class="flex items-start justify-between gap-4 px-6 pb-2 pt-5">
            <div class="min-w-0"><div data-title class="text-title font-semibold">Add connector</div><div data-desc class="mt-1 text-body text-text-secondary">Connect an app your decks can draw on. Access is read-only and only for you.</div></div>
            <button type="button" class="icon-btn -mr-2 -mt-1 !h-8 !w-8" data-x aria-label="Close"><i class="ph ph-x text-[20px]"></i></button>
          </div>
          <div class="px-6 pt-3">
            <div class="relative"><i class="ph ph-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary"></i>
              <input data-q placeholder="Search 120+ apps" class="h-9 w-full rounded-control border border-border-secondary pl-9 pr-3 text-body outline-none transition-shadow focus:border-[#0D99FF] focus:ring-2 focus:ring-[#0D99FF]/20" /></div>
            <div data-chips class="scrollbar-hide mt-3 flex h-7 gap-1.5 overflow-x-auto" style="-webkit-mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%)"></div>
            <div data-section class="mb-2 mt-6 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">Popular</div>
          </div>
          <div data-list class="scrollbar-hide h-[52vh] overflow-y-auto px-6 pb-6"></div>
        </div>
      </div>`;
    document.body.appendChild(root);
    root.querySelectorAll('[data-x]').forEach((el) => el.onclick = close);
    root.querySelector('[data-q]').oninput = (e) => { state.q = e.target.value; render(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !root.classList.contains('hidden')) close(); });
  }
  function card(app) {
    const connected = state.opts.isConnected(app.id);
    const working = state.busy === app.id;
    const action = connected
      ? `<span title="Connected" class="flex h-8 w-8 items-center justify-center rounded-control bg-bg-success-inverted text-text-success-primary"><i class="ph-bold ph-check"></i></span>`
      : `<button type="button" data-connect="${app.id}" ${state.busy ? 'disabled' : ''} aria-label="Connect ${app.name}" class="icon-btn !h-8 !w-8 border border-border-secondary disabled:opacity-50">${working ? '<i class="ph ph-arrows-clockwise spin"></i>' : '<i class="ph ph-plus"></i>'}</button>`;
    return `<div class="flex items-start gap-3 rounded-card border border-border-secondary bg-bg-default-primary p-4">
      ${appLogo(app, 'lg')}
      <div class="min-w-0 flex-1"><div class="truncate text-body font-semibold">${app.name}</div><p class="mt-0.5 line-clamp-2 text-caption text-text-secondary">${app.desc}</p></div>
      <div class="shrink-0">${action}</div></div>`;
  }
  function render() {
    const q = state.q.trim().toLowerCase();
    const chips = root.querySelector('[data-chips]');
    chips.innerHTML = [['', 'All'], ...CHIPS].map(([id, label]) => `<button type="button" data-chip="${id}" class="h-7 shrink-0 whitespace-nowrap rounded-full border px-3 text-caption ${state.chip === id ? 'border-border-brand bg-app-50 text-text-brand' : 'border-border-secondary text-text-secondary hover:bg-bg-tertiary'}">${label}</button>`).join('');
    chips.querySelectorAll('[data-chip]').forEach((b) => b.onclick = () => { state.chip = b.dataset.chip; render(); });
    const filtered = CATALOG.filter((a) => (!state.chip || a.chip === state.chip) && (!q || a.name.toLowerCase().includes(q) || a.cat.includes(q) || a.desc.toLowerCase().includes(q)));
    const browsing = !q && !state.chip;
    const pop = browsing ? filtered.filter((a) => a.popular) : [];
    const rest = browsing ? filtered.filter((a) => !a.popular) : filtered;
    root.querySelector('[data-section]').textContent = browsing ? 'Popular' : (CHIPS.find((c) => c[0] === state.chip)?.[1] || 'All apps');
    const grid = (items) => `<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">${items.map(card).join('')}</div>`;
    let html = '';
    if (!filtered.length) html = '<p class="py-10 text-center text-body text-text-secondary">No apps match your search.</p>';
    if (pop.length) html += grid(pop);
    if (rest.length) html += (browsing && pop.length ? '<div class="mb-2 mt-5 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">All apps</div>' : '') + grid(rest);
    const list = root.querySelector('[data-list]'); list.innerHTML = html;
    list.querySelectorAll('[data-connect]').forEach((b) => b.onclick = () => {
      state.busy = b.dataset.connect; render();
      Promise.resolve(state.opts.onConnect(state.busy)).finally(() => { state.busy = null; render(); });
    });
  }
  function open(opts) {
    if (!root) mount();
    state = { q: '', chip: '', busy: null, opts };
    if (opts.title) root.querySelector('[data-title]').textContent = opts.title;
    if (opts.description) root.querySelector('[data-desc]').textContent = opts.description;
    root.querySelector('[data-q]').value = '';
    render();
    root.classList.remove('hidden');
    requestAnimationFrame(() => {
      root.querySelector('[data-fade]').classList.remove('opacity-0');
      root.querySelector('[data-panel]').classList.remove('opacity-0','translate-y-2','scale-[0.98]');
      root.querySelector('[data-q]').focus();
    });
  }
  function close() {
    root.querySelector('[data-fade]').classList.add('opacity-0');
    root.querySelector('[data-panel]').classList.add('opacity-0','translate-y-2','scale-[0.98]');
    setTimeout(() => root.classList.add('hidden'), 180);
    state.opts?.onClose?.();
  }
  return { open, close, refresh: () => root && render() };
})();

// The user's connections. Status ACTIVE / EXPIRED, or missing scopes.
let sources = [
  { id: 'slack', status: 'EXPIRED' },
  { id: 'googledrive', status: 'ACTIVE', missing: ['Google Drive files'] },
  { id: 'hubspot', status: 'ACTIVE' },
  { id: 'notion', status: 'ACTIVE' },
];
const stateOf = (s) => s.status === 'EXPIRED' ? { label: 'Expired', tone: 'warn', fix: true } : s.missing ? { label: 'Missing permissions', tone: 'warn', fix: true, scopes: s.missing } : { label: 'Connected', tone: 'good', fix: false };
const $ = (s) => document.querySelector(s);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function render() {
  const sorted = [...sources].sort((a, b) => Number(stateOf(b).fix) - Number(stateOf(a).fix) || appById(a.id).name.localeCompare(appById(b.id).name));
  $('#rows').innerHTML = sorted.map((s) => {
    const app = appById(s.id), st = stateOf(s);
    const badge = `<span class="inline-flex h-5 items-center gap-1 rounded-full px-2 text-micro font-semibold ${st.tone === 'good' ? 'bg-bg-success-inverted text-text-success-primary' : 'bg-bg-warning-inverted text-text-warning-primary'}"><i class="ph-bold ${st.fix ? 'ph-warning' : 'ph-check'} text-[11px]"></i>${st.label}</span>`;
    const tagged = st.scopes ? `<span tabindex="0" class="tip inline-flex rounded-full outline-none" data-tip="${app.name} didn't give access to everything we need. Reconnect and allow every permission it asks for. ${st.scopes.join(', ')}">${badge}</span>` : badge;
    return `<tr class="border-t border-border-secondary">
      <td class="py-3 pr-4"><div class="flex min-w-0 items-center gap-3">${appLogo(app)}<div class="min-w-0"><div class="truncate font-semibold">${app.name}</div><div class="truncate text-caption text-text-secondary">${catLabel(app.cat)}</div></div></div></td>
      <td class="py-3 pr-4">${tagged}</td>
      <td class="py-3"><div class="flex items-center justify-end gap-1">
        ${st.fix ? `<button type="button" class="btn btn-secondary btn-sm" data-re="${s.id}">Reconnect</button>` : ''}
        <button type="button" class="icon-btn !h-8 !w-8" data-menu="${s.id}" aria-label="More actions ${app.name}"><i class="ph ph-dots-three text-[20px]"></i></button>
      </div></td></tr>`;
  }).join('');
  document.querySelectorAll('[data-re]').forEach((b) => b.onclick = () => { b.innerHTML = '<i class="ph ph-arrows-clockwise spin"></i>'; setTimeout(() => { const s = sources.find((x) => x.id === b.dataset.re); s.status = 'ACTIVE'; delete s.missing; render(); }, 1200); });
  document.querySelectorAll('[data-menu]').forEach((b) => b.onclick = () => { if (confirm('Disconnect ' + appById(b.dataset.menu).name + '?')) { sources = sources.filter((s) => s.id !== b.dataset.menu); render(); } });
}
$('#addBtn').onclick = () => ConnectorDialog.open({
  isConnected: (id) => sources.some((s) => s.id === id && s.status === 'ACTIVE'),
  onConnect: (id) => new Promise((r) => setTimeout(() => { const s = sources.find((x) => x.id === id); if (s) { s.status = 'ACTIVE'; delete s.missing; } else sources.push({ id, status: 'ACTIVE' }); render(); r(); }, 1400)),
});
render();
</script>
