<style>
  html, body { margin: 0; background: #F5F5F5; color: #1A1A1A; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .badge-gold { display:inline-flex; align-items:center; height:18px; padding:0 6px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.04em; color:#8A5A00; background:linear-gradient(180deg,#FFE7A3,#F7C94B); }
  .nav-item { display:flex; align-items:center; gap:10px; height:32px; padding:0 8px; border-radius:6px; font-size:14px; color:#1A1A1A; }

  .nav-item i { font-size: 18px; color: #7F7F7F; }
  .skeleton { background: linear-gradient(90deg, #EFEFEF 25%, #F7F7F7 37%, #EFEFEF 63%); background-size: 400% 100%; animation: skel 1.4s ease infinite; border-radius: 4px; }
  @keyframes skel { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

</style>

<title>Project knowledge v2</title>
<style>
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px) scale(.98); opacity: 0; transition: opacity .2s cubic-bezier(.2,0,0,1), transform .25s cubic-bezier(.2,0,0,1); z-index: 95; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* File row: progress bar → indeterminate while we read the file → green, then it folds away. */
  .bar-wrap { height: 4px; margin-top: 10px; opacity: 1; transition: height .25s cubic-bezier(.2,0,0,1), margin .25s cubic-bezier(.2,0,0,1), opacity .2s; }
  .bar-wrap.is-gone { height: 0; margin-top: 0; opacity: 0; }
  .bar { transition: width .35s cubic-bezier(.2,0,0,1), background-color .25s; }
  .bar.is-reading { width: 100% !important; background: linear-gradient(90deg, rgba(13,153,255,.18) 0%, #0D99FF 45%, rgba(13,153,255,.18) 90%); background-size: 220% 100%; animation: reading 1.6s linear infinite; }
  @keyframes reading { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .bar.is-ok { width: 100% !important; background: #14AE5C; animation: none; }

  .flash-ok { animation: flashOk 1.8s cubic-bezier(.2,0,0,1); }
  @keyframes flashOk { 0% { background-color: #E0F6E5; border-color: #B9EBC6; } 100% { background-color: #fff; border-color: #E6E6E6; } }
  .flash-ok-soft { animation: flashOkSoft 1.8s cubic-bezier(.2,0,0,1); }
  @keyframes flashOkSoft { 0% { background-color: #E0F6E5; } 100% { background-color: transparent; } }

  .pop-in { animation: popIn .32s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fade-up { animation: fadeUp .24s cubic-bezier(.2,0,0,1) both; }
  @keyframes fadeUp { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .row-in { animation: rowIn .28s cubic-bezier(.2,0,0,1) both; }
  @keyframes rowIn { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .spinner { width: 16px; height: 16px; border-radius: 999px; border: 2px solid rgba(13,153,255,.2); border-top-color: #0D99FF; animation: spin .8s linear infinite; }

  .switch { position: relative; display: inline-flex; height: 24px; width: 40px; flex-shrink: 0; align-items: center; border-radius: 999px; background: #E6E6E6; transition: background-color .2s cubic-bezier(.2,0,0,1); }
  .switch[aria-checked="true"] { background: #0D99FF; }
  .switch .knob { height: 20px; width: 20px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .2); transform: translateX(2px); transition: transform .22s cubic-bezier(.34,1.3,.64,1); }
  .switch[aria-checked="true"] .knob { transform: translateX(18px); }
  .switch:disabled { opacity: .4; cursor: not-allowed; }
  .switch:focus-visible { outline: 2px solid rgba(13,153,255,.35); outline-offset: 2px; }

  .logo-off { filter: grayscale(1); opacity: .45; transition: filter .2s, opacity .2s; }
  .count-bump { animation: bump .36s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .seg { transition: background-color .3s; }
</style>
<style>
  .tile { transition: border-color .15s cubic-bezier(.2,0,0,1), background-color .15s cubic-bezier(.2,0,0,1), box-shadow .15s; }
  .tile:hover { border-color: rgba(26,26,26,.18); background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
  .tab { position: relative; height: 40px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #7F7F7F; transition: color .15s; }
  .tab:hover { color: #1A1A1A; }
  .tab[aria-selected="true"] { color: #1A1A1A; font-weight: 500; }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: #1A1A1A; }
  .link-btn { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 4px 6px; margin: -4px -6px; font-size: 14px; font-weight: 500; color: #007BE5; transition: background-color .15s, color .15s; }
  .link-btn:hover { color: #0768CF; background: rgba(13,153,255,.08); }
  .modal-in { animation: modalIn .22s cubic-bezier(.2,0,0,1) both; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .view { transition: transform .26s cubic-bezier(.2,0,0,1), opacity .2s cubic-bezier(.2,0,0,1); }
  .view.is-left { transform: translateX(-24%); opacity: 0; pointer-events: none; }
  .view.is-right { transform: translateX(24%); opacity: 0; pointer-events: none; }
  .scrim-in { animation: scrimIn .18s ease both; } @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
</style>

<script>
// Deck cards for the project page (DocumentCardView shape: 16:9 thumb, title, edited line).
const DECKS = [

function deckCard(d) {
  return `<div class="group min-w-0 cursor-pointer">
    <div class="thumb relative transition-shadow duration-150 group-hover:shadow-menu" style="background:${d.bg}">
      <div class="absolute inset-0 flex flex-col justify-center px-[9%]">
        <div style="width:28px;height:3px;border-radius:2px;background:${d.accent}"></div>
        <div class="mt-2 font-semibold leading-tight" style="color:${d.fg};font-size:clamp(13px,1.5vw,18px)">${d.t}</div>
        <div class="mt-1 opacity-70" style="color:${d.fg};font-size:clamp(9px,0.9vw,11px)">${d.s}</div>
      </div>
      <div class="absolute bottom-[10%] right-[9%] flex gap-1">${[40,28,52].map(w=>`<span style="display:block;width:${w/3}px;height:${w/2}px;border-radius:2px;background:${d.accent};opacity:.5"></span>`).join('')}</div>
    </div>
    <div class="mt-2.5 flex items-start justify-between gap-2 px-0.5">
      <div class="min-w-0"><div class="truncate text-body font-medium">${d.t}</div><div class="mt-0.5 text-caption text-text-secondary">${d.edited}</div></div>
      <button type="button" class="icon-btn !h-7 !w-7 opacity-0 transition-opacity group-hover:opacity-100"><i class="ph ph-dots-three text-[18px]"></i></button>
    </div>
  </div>`;
}
// A brand-new project: no decks, no members. The empty state is the live ds <Empty> (FolderIcon, dashed frame).
function setProjectEmpty(empty) {
  const grid = document.getElementById('deckGrid');
  grid.className = empty ? 'mt-6' : 'mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3';
  grid.innerHTML = empty
    ? `<div class="fade-up flex flex-col items-center gap-2 rounded-card border border-dashed border-border-secondary px-6 py-14 text-center">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-bg-tertiary text-text-secondary"><i class="ph ph-folder text-[20px]"></i></span>
        <div class="mt-1 text-body font-semibold">This project is empty</div>
        <p class="max-w-sm text-caption text-text-secondary">Move decks here from their menu, or start a new one.</p>
      </div>`
    : DECKS.map(deckCard).join('');
  document.getElementById('members').classList.toggle('hidden', empty);
  document.getElementById('summary').textContent = empty
    ? "0 decks · decks inherit the project's sharing"
    : "6 decks · shared with 3 people · decks inherit the project's sharing";
}
setProjectEmpty(false);

// Connector catalog + "Add connector" dialog (replica of settings/datasources/AddConnectorDialog.jsx, PR #6872).
const CATALOG = [
  { id: 'googledrive', name: 'Google Drive', slug: 'googledrive', cat: 'file management & storage', chip: 'files', popular: true, desc: 'Read docs, sheets and slides from your Drive so decks can quote them.' },
  { id: 'hubspot', name: 'HubSpot', slug: 'hubspot', cat: 'crm', chip: 'crm', popular: true, desc: 'Pull deals, pipeline and company records into sales and QBR decks.' },
  { id: 'notion', name: 'Notion', slug: 'notion', cat: 'notes', chip: 'notes', popular: true, desc: 'Use pages and databases from your workspace as source material.' },
  { id: 'salesforce', name: 'Salesforce', slug: null, color: '#00A1E0', cat: 'crm', chip: 'crm', popular: true, desc: 'Bring opportunities, accounts and forecasts into your decks.' },
  { id: 'googlesheets', name: 'Google Sheets', slug: 'googlesheets', cat: 'spreadsheets', chip: 'spreadsheets', popular: true, desc: 'Turn rows and charts from a sheet into slides with real numbers.' },
  { id: 'slack', name: 'Slack', slug: null, color: '#4A154B', cat: 'team chat', chip: 'chat', popular: true, desc: 'Reference channel threads and announcements your team already wrote.' },
  { id: 'confluence', name: 'Confluence', slug: 'confluence', cat: 'documents', chip: 'documents', popular: false, desc: 'Draw on specs, wikis and team pages.' },
  { id: 'dropbox', name: 'Dropbox', slug: 'dropbox', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read files stored in your Dropbox folders.' },
  { id: 'airtable', name: 'Airtable', slug: 'airtable', cat: 'spreadsheets', chip: 'spreadsheets', popular: false, desc: 'Use bases and views as structured data for slides.' },
  { id: 'jira', name: 'Jira', slug: 'jira', cat: 'project management', chip: 'projects', popular: false, desc: 'Summarise epics, sprints and roadmaps for status updates.' },
  { id: 'asana', name: 'Asana', slug: 'asana', cat: 'project management', chip: 'projects', popular: false, desc: 'Pull project status and milestones into updates.' },
  { id: 'linear', name: 'Linear', slug: 'linear', cat: 'project management', chip: 'projects', popular: false, desc: 'Turn cycles and projects into progress slides.' },
  { id: 'gmail', name: 'Gmail', slug: 'gmail', cat: 'email', chip: 'email', popular: false, desc: 'Reference email threads with customers and partners.' },
  { id: 'googleanalytics', name: 'Google Analytics', slug: 'googleanalytics', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Chart traffic and conversion trends from GA4.' },
  { id: 'mixpanel', name: 'Mixpanel', slug: 'mixpanel', cat: 'analytics', chip: 'analytics', popular: false, desc: 'Bring product usage metrics into reviews.' },
  { id: 'quickbooks', name: 'QuickBooks', slug: 'quickbooks', cat: 'accounting', chip: 'accounting', popular: false, desc: 'Use revenue and expense figures in finance decks.' },
  { id: 'onedrive', name: 'OneDrive', slug: null, color: '#0364B8', cat: 'file management & storage', chip: 'files', popular: false, desc: 'Read Word, Excel and PowerPoint files from OneDrive.' },
  { id: 'pipedrive', name: 'Pipedrive', slug: null, color: '#1A1A1A', cat: 'crm', chip: 'crm', popular: false, desc: 'Pull deals and activity into pipeline reviews.' },
  { id: 'zendesk', name: 'Zendesk', slug: 'zendesk', cat: 'customer support', chip: 'more', popular: false, desc: 'Summarise ticket trends and CSAT for account reviews.' },
  { id: 'intercom', name: 'Intercom', slug: 'intercom', cat: 'customer support', chip: 'more', popular: false, desc: 'Use conversation themes in customer decks.' },
];
const CHIPS = [['crm','CRM'],['documents','Documents'],['files','File storage'],['spreadsheets','Spreadsheets'],['notes','Notes'],['projects','Project management'],['analytics','Analytics'],['email','Email'],['chat','Team chat'],['accounting','Accounting'],['more','More']];
const ACR = new Set(['crm','ai','hr','url','sms','seo']);
const catLabel = (t) => (t || '').replace(/\b\w+/g, (w) => ACR.has(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1));
const appById = (id) => CATALOG.find((a) => a.id === id);

// AppLogo: logo on a soft sunken tile, initials when there's no logo or it fails to load.
function appLogo(app, size = 'md', extraClass = '') {
  const box = size === 'lg' ? 'h-12 w-12' : size === 'sm' ? 'h-8 w-8' : size === 'xs' ? 'h-5 w-5' : 'h-9 w-9';
  const img = size === 'lg' ? 'h-7 w-7' : size === 'sm' ? 'h-[18px] w-[18px]' : size === 'xs' ? 'h-3 w-3' : 'h-5 w-5';
  const tiny = size === 'xs' ? 'text-[6px]' : 'text-[10px]';
  const initials = app.name.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const fallback = `<span class='text-caption font-semibold text-text-secondary'>${initials}</span>`;
  const inner = app.slug
    ? `<img src="https://cdn.simpleicons.org/${app.slug}" alt="" class="${img} object-contain" loading="lazy" onerror="this.outerHTML=&quot;${fallback}&quot;" />`
    : `<span class="flex ${img} items-center justify-center rounded-[3px] ${tiny} font-bold text-white" style="background:${app.color}">${initials}</span>`;
  return `<span class="flex ${box} shrink-0 items-center justify-center overflow-hidden rounded-control bg-bg-tertiary ${extraClass}">${inner}</span>`;
}

// The dialog. opts: { isConnected(id), onConnect(id) -> Promise, title, description }
const ConnectorDialog = (() => {
  let root, state = { q: '', chip: '', busy: null, opts: null };
  function mount() {
    root = document.createElement('div');
    root.className = 'fixed inset-0 z-[70] hidden';
    root.innerHTML = `
      <div class="absolute inset-0 bg-black/45 backdrop-blur-[2px] opacity-0 transition-opacity duration-200" data-x data-fade></div>
      <div class="pointer-events-none absolute inset-0 flex items-end justify-center p-3 sm:items-center sm:p-6">
        <div data-panel role="dialog" aria-modal="true" class="pointer-events-auto relative w-full max-w-3xl translate-y-2 scale-[0.98] overflow-hidden rounded-dialog border border-border-secondary bg-bg-default-primary opacity-0 shadow-dialog transition-[opacity,transform] duration-200 ease-std">
          <div class="flex items-start justify-between gap-4 px-6 pb-2 pt-5">
            <div class="min-w-0"><div data-title class="text-title font-semibold">Add connector</div><div data-desc class="mt-1 text-body text-text-secondary">Connect an app your decks can draw on. Access is read-only and only for you.</div></div>
            <button type="button" class="icon-btn -mr-2 -mt-1 !h-8 !w-8" data-x aria-label="Close"><i class="ph ph-x text-[20px]"></i></button>
          </div>
          <div class="px-6 pt-3">
            <div class="relative"><i class="ph ph-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary"></i>
              <input data-q placeholder="Search 120+ apps" class="h-9 w-full rounded-control border border-border-secondary pl-9 pr-3 text-body outline-none transition-shadow focus:border-[#0D99FF] focus:ring-2 focus:ring-[#0D99FF]/20" /></div>
            <div data-chips class="scrollbar-hide mt-3 flex h-7 gap-1.5 overflow-x-auto" style="-webkit-mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to right,black calc(100% - 56px),transparent 100%)"></div>
            <div data-section class="mb-2 mt-6 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">Popular</div>
          </div>
          <div data-list class="scrollbar-hide h-[52vh] overflow-y-auto px-6 pb-6"></div>
        </div>
      </div>`;
    document.body.appendChild(root);
    root.querySelectorAll('[data-x]').forEach((el) => el.onclick = close);
    root.querySelector('[data-q]').oninput = (e) => { state.q = e.target.value; render(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !root.classList.contains('hidden')) close(); });
  }
  function card(app) {
    const connected = state.opts.isConnected(app.id);
    const working = state.busy === app.id;
    const action = connected
      ? `<span title="Connected" class="flex h-8 w-8 items-center justify-center rounded-control bg-bg-success-inverted text-text-success-primary"><i class="ph-bold ph-check"></i></span>`
      : `<button type="button" data-connect="${app.id}" ${state.busy ? 'disabled' : ''} aria-label="Connect ${app.name}" class="icon-btn !h-8 !w-8 border border-border-secondary disabled:opacity-50">${working ? '<i class="ph ph-arrows-clockwise spin"></i>' : '<i class="ph ph-plus"></i>'}</button>`;
    return `<div class="flex items-start gap-3 rounded-card border border-border-secondary bg-bg-default-primary p-4">
      ${appLogo(app, 'lg')}
      <div class="min-w-0 flex-1"><div class="truncate text-body font-semibold">${app.name}</div><p class="mt-0.5 line-clamp-2 text-caption text-text-secondary">${app.desc}</p></div>
      <div class="shrink-0">${action}</div></div>`;
  }
  function render() {
    const q = state.q.trim().toLowerCase();
    const chips = root.querySelector('[data-chips]');
    chips.innerHTML = [['', 'All'], ...CHIPS].map(([id, label]) => `<button type="button" data-chip="${id}" class="h-7 shrink-0 whitespace-nowrap rounded-full border px-3 text-caption ${state.chip === id ? 'border-border-brand bg-app-50 text-text-brand' : 'border-border-secondary text-text-secondary hover:bg-bg-tertiary'}">${label}</button>`).join('');
    chips.querySelectorAll('[data-chip]').forEach((b) => b.onclick = () => { state.chip = b.dataset.chip; render(); });
    const filtered = CATALOG.filter((a) => (!state.chip || a.chip === state.chip) && (!q || a.name.toLowerCase().includes(q) || a.cat.includes(q) || a.desc.toLowerCase().includes(q)));
    const browsing = !q && !state.chip;
    const pop = browsing ? filtered.filter((a) => a.popular) : [];
    const rest = browsing ? filtered.filter((a) => !a.popular) : filtered;
    root.querySelector('[data-section]').textContent = browsing ? 'Popular' : (CHIPS.find((c) => c[0] === state.chip)?.[1] || 'All apps');
    const grid = (items) => `<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">${items.map(card).join('')}</div>`;
    let html = '';
    if (!filtered.length) html = '<p class="py-10 text-center text-body text-text-secondary">No apps match your search.</p>';
    if (pop.length) html += grid(pop);
    if (rest.length) html += (browsing && pop.length ? '<div class="mb-2 mt-5 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">All apps</div>' : '') + grid(rest);
    const list = root.querySelector('[data-list]'); list.innerHTML = html;
    list.querySelectorAll('[data-connect]').forEach((b) => b.onclick = () => {
      state.busy = b.dataset.connect; render();
      Promise.resolve(state.opts.onConnect(state.busy)).finally(() => { state.busy = null; render(); });
    });
  }
  function open(opts) {
    if (!root) mount();
    state = { q: '', chip: '', busy: null, opts };
    if (opts.title) root.querySelector('[data-title]').textContent = opts.title;
    if (opts.description) root.querySelector('[data-desc]').textContent = opts.description;
    root.querySelector('[data-q]').value = '';
    render();
    root.classList.remove('hidden');
    requestAnimationFrame(() => {
      root.querySelector('[data-fade]').classList.remove('opacity-0');
      root.querySelector('[data-panel]').classList.remove('opacity-0','translate-y-2','scale-[0.98]');
      root.querySelector('[data-q]').focus();
    });
  }
  function close() {
    root.querySelector('[data-fade]').classList.add('opacity-0');
    root.querySelector('[data-panel]').classList.add('opacity-0','translate-y-2','scale-[0.98]');
    setTimeout(() => root.classList.add('hidden'), 180);
    state.opts?.onClose?.();
  }
  return { open, close, refresh: () => root && render() };
})();

const $ = (s) => document.querySelector(s);
const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const TYPE = { pdf: ['#FA423E','file-pdf'], doc: ['#0285FF','file-doc'], docx: ['#0285FF','file-doc'], ppt: ['#D04423','file-ppt'], pptx: ['#D04423','file-ppt'] };
const typeOf = (n) => TYPE[(n.split('.').pop() || '').toLowerCase()] || ['#0285FF','file-text'];
const fmt = (b) => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + 'KB' : (b / 1048576).toFixed(b / 1048576 >= 10 ? 0 : 1) + 'MB';
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
let uid = 0;

const S = { instructions: '', instrWhen: '', files: [], conns: [], decks: 0, batch: null, tab: 'instr', flash: null };
const readyFiles = () => S.files.filter((f) => f.status === 'ready');
const busyFiles = () => S.files.filter((f) => f.status === 'uploading' || f.status === 'reading');
const activeConns = () => S.conns.filter((c) => c.status === 'ACTIVE');
const onConns = () => S.conns.filter((c) => c.on && c.status === 'ACTIVE');
const hasInstr = () => !!S.instructions.trim();
const hasKnowledge = () => hasInstr() || S.files.length > 0 || S.conns.some((c) => c.scope === 'project');

function toast(msg, icon = 'check-circle', tone = '#3DDC97') {
  const t = $('#toast');
  t.innerHTML = `<i class="ph-fill ph-${icon} text-[18px]" style="color:${tone}"></i><span>${msg}</span>`;
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200);
}

// ================= page: summary line + decks =================
const KNOWLEDGE_DECKS = 3; // of the decks shown, how many were built with this project's knowledge
function renderPage() {
  const n = S.decks;
  $('#members').classList.toggle('hidden', !n);
  $('#summary').textContent = n ? `${plural(n, 'deck', 'decks')} · shared with 3 people · decks inherit the project's sharing` : "0 decks · decks inherit the project's sharing";
  const grid = $('#deckGrid');
  if (!n) {
    grid.className = 'mt-3';
    const withK = hasKnowledge();
    grid.innerHTML = `<div class="fade-up flex flex-col items-center gap-2 rounded-card border border-dashed border-border-secondary px-6 py-14 text-center">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-bg-default-primary text-text-secondary shadow-sm"><i class="ph ph-${withK ? 'presentation-chart' : 'folder'} text-[20px]"></i></span>
        <div class="mt-1 text-body font-semibold">${withK ? 'No decks yet' : 'This project is empty'}</div>
        <p class="max-w-sm text-caption text-text-secondary">${withK ? "Start a deck here and we'll build it with this project's knowledge." : 'Move decks here from their menu, or start a new one.'}</p>
        ${withK ? '<button type="button" class="btn btn-secondary btn-sm mt-2"><i class="ph ph-plus"></i>New deck here</button>' : ''}
      </div>`;
  } else {
    grid.className = 'mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3';
    grid.innerHTML = DECKS.slice(0, n).map((d, i) => deckCard(d).replace(
      `<div class="mt-0.5 text-caption text-text-secondary">${d.edited}</div>`,
      `<div class="mt-0.5 flex items-center gap-1.5 text-caption text-text-secondary">${d.edited}${i < KNOWLEDGE_DECKS ? '<span class="text-text-quaternary">·</span><span class="inline-flex items-center gap-1" title="Built with this project\'s knowledge"><i class="ph ph-book-open-text text-[13px]"></i>Used knowledge</span>' : ''}</div>`)).join('');
  }
}

// ================= the knowledge card =================
function tile(tab, inner, extra = '') {
  return `<div role="button" tabindex="0" data-tab="${tab}" class="tile flex min-h-[172px] cursor-pointer flex-col rounded-[10px] border border-transparent bg-bg-secondary p-4 ${extra}">${inner}</div>`;
}
function tileHead(icon, label, meta) {
  return `<div class="flex items-center gap-2 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary"><i class="ph ph-${icon} text-[14px]"></i>${label}${meta ? `<span class="ml-auto normal-case tracking-normal font-medium tabular">${meta}</span>` : ''}</div>`;
}
function addPrompt(label, body) {
  return `<p class="mt-3 text-caption text-text-secondary">${body}</p>
    <span class="btn btn-secondary btn-sm mt-auto self-start"><i class="ph ph-plus"></i>${label}</span>`;
}
function renderCard() {
  const el = $('#kcard');
  const filled = hasKnowledge();
  const rf = readyFiles(), busy = busyFiles(), on = onConns();

  // Instructions tile
  const instrTile = hasInstr()
    ? tile('instr', `${tileHead('text-align-left', 'Instructions')}
        <p class="mt-3 line-clamp-4 text-caption text-text-primary">${esc(S.instructions)}</p>
        <p class="mt-auto pt-3 text-micro text-text-secondary">${S.flash === 'instr' ? '<span class="inline-flex items-center gap-1 text-text-success-primary"><i class="ph-fill ph-check-circle"></i>Saved just now</span>' : 'Edited ' + S.instrWhen}</p>`, S.flash === 'instr' ? 'flash-ok-soft' : '')
    : tile('instr', `${tileHead('text-align-left', 'Instructions')}${addPrompt('Add instructions', "Tell us who these decks are for, how they should sound, and anything they must include.")}`);

  // Files tile
  let filesInner = tileHead('files', 'Files', rf.length ? `<span class="${S.flash === 'files' ? 'count-bump inline-block text-text-success-primary' : ''}">${rf.length}</span>` : '');
  if (S.files.length) {
    filesInner += `<ul class="mt-3 flex flex-col gap-2">${rf.slice(0, busy.length ? 2 : 3).map((f) => { const [bg, ic] = typeOf(f.name); return `<li class="flex items-center gap-2"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-[5px] text-white" style="background:${bg}"><i class="ph ph-${ic} text-[14px]"></i></span><span class="truncate text-caption">${esc(f.name)}</span></li>`; }).join('')}</ul>`;
    const more = rf.length - (busy.length ? 2 : 3);
    if (busy.length) {
      filesInner += `<div class="mt-auto pt-3"><div class="flex items-center gap-2 text-caption"><span class="spinner !h-3.5 !w-3.5"></span>Reading ${plural(busy.length, 'file', 'files')}<span class="ml-auto text-micro text-text-secondary">about a minute</span></div>
        <div class="mt-2 flex gap-1">${busy.map((f) => `<span class="h-1 flex-1 rounded-full ${f.status === 'reading' ? 'bar is-reading' : 'bg-[#9CD3FF]'}"></span>`).join('')}</div></div>`;
    } else if (S.files.some((f) => f.status === 'error')) {
      const bad = S.files.filter((f) => f.status === 'error').length;
      filesInner += `<p class="mt-auto inline-flex items-center gap-1 pt-3 text-caption text-text-danger-primary"><i class="ph-fill ph-warning-circle"></i>${plural(bad, 'file', 'files')} couldn't be read${more > 0 ? `<span class="text-text-secondary"> · +${more} more</span>` : ''}</p>`;
    } else if (more > 0) filesInner += `<p class="mt-auto pt-3 text-caption text-text-secondary">+${plural(more, 'more file', 'more files')}</p>`;
  } else {
    filesInner += addPrompt('Upload files', 'Brand guidelines, pricing, research. PDF, Word, PowerPoint or text, and we quote from them.');
  }
  const filesTile = tile('files', filesInner, S.flash === 'files' ? 'flash-ok-soft' : '');

  // Connectors tile
  const proj = activeConns().filter((c) => c.scope === 'project');
  const shown = [...on.filter((c) => c.scope === 'project'), ...on.filter((c) => c.scope === 'workspace')];

        : `<span title="Already on from your workspace" class="flex h-8 w-8 items-center justify-center rounded-control bg-bg-tertiary text-text-secondary"><i class="ph-bold ph-check"></i><span class="sr-only">Already on from your workspace</span></span>`)
      : `<button type="button" data-connect="${app.id}" ${CAT.busy ? 'disabled' : ''} aria-label="Connect ${app.name}" class="icon-btn !h-8 !w-8 border border-border-secondary disabled:opacity-50">${CAT.busy === app.id ? '<span class="spinner !h-3.5 !w-3.5"></span>' : '<i class="ph ph-plus"></i>'}</button>`;
    return `<div class="flex items-start gap-3 rounded-card border border-border-secondary bg-bg-default-primary p-4 ${CAT.flash === app.id ? 'flash-ok' : ''}">
      ${appLogo(app, 'lg')}
      <div class="min-w-0 flex-1"><div class="truncate text-body font-semibold">${app.name}</div><p class="mt-0.5 line-clamp-2 text-caption text-text-secondary">${app.desc}</p></div>
      <div class="shrink-0">${action}</div></div>`;
  };
  const grid = (items) => `<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">${items.map(card).join('')}</div>`;
  let html = filtered.length ? '' : '<p class="py-10 text-center text-body text-text-secondary">No apps match your search.</p>';
  if (pop.length) html += grid(pop);
  if (rest.length) html += (browsing && pop.length ? '<div class="mb-2 mt-5 text-micro font-semibold uppercase tracking-[0.08em] text-text-secondary">All apps</div>' : '') + grid(rest);
  $('#catList').innerHTML = html;
  $('#catList').querySelectorAll('[data-connect]').forEach((b) => b.onclick = () => {
    const id = b.dataset.connect; CAT.busy = id; renderCatalog();
    setTimeout(() => {   // the app's own sign-in window would open here
      const existing = S.conns.find((c) => c.id === id);
      if (existing) { existing.status = 'ACTIVE'; existing.on = true; }
      else S.conns.unshift({ id, on: true, status: 'ACTIVE', scope: 'project', fresh: true });
      startSync(S.conns.find((c) => c.id === id), new Date(2021 + Math.floor(Math.random() * 3), Math.floor(Math.random() * 12), 1));
      CAT.busy = null; CAT.flash = id; renderCatalog(); CAT.flash = null;
      flash('conns'); renderTabs();
      toast(`${appById(id).name} connected for this project`);
      setTimeout(() => { const c = S.conns.find((x) => x.id === id); if (c) { c.fresh = false; if (S.view !== 'cat' && S.tab === 'conns') renderConns(); } }, 4000);
    }, 1400);
  });
}


// ================= connector sync =================
// Live: the last 30 days arrive in seconds; the full history (often years) then takes 2 to 3 hours.
// Demo: the history sync is compressed to ~45 s. Progress is shown as a timeline, oldest on the left, today on the right.
const TODAY = new Date(2026, 10, 24);
const HISTORY_REAL_MIN = 150;     // what we'd tell the user: about 2.5 hours for a full history
const HISTORY_DEMO_MS = 45000;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthYear = (d) => `${MON[d.getMonth()]} ${d.getFullYear()}`;
const coveredDate = (s) => new Date(TODAY - s.p * (TODAY - s.since));
const etaText = (s) => {
  const min = Math.max(1, Math.round((1 - s.p) * HISTORY_REAL_MIN));
  return min >= 90 ? `about ${Math.round(min / 60)} hours left` : min >= 50 ? 'about an hour left' : min > 5 ? `about ${Math.round(min / 5) * 5} minutes left` : 'a few minutes left';
};
const syncing = (c) => c.sync && (c.sync.phase === 'recent' || c.sync.phase === 'history');

// Row block in the modal: status line, timeline bar, end labels. Updated in place by the ticker.
function syncBlock(c) {
  const s = c.sync;
  if (s.phase === 'recent') return '';
  const done = s.phase === 'done';
  return `<div class="pl-12 pr-1 pt-2 ${done ? 'fade-up' : ''}" data-sync="${c.id}">
    <div class="flex items-center justify-between gap-3 text-micro">
      <span class="${done ? 'text-text-success-primary' : 'text-text-secondary'}" data-sync-label>${done ? `All data synced, back to ${monthYear(s.since)}` : `Synced back to ${monthYear(coveredDate(s))}`}</span>
      <span class="tabular text-text-secondary" data-sync-eta>${done ? '' : etaText(s)}</span>
    </div>
    <div class="relative mt-1.5 h-1.5 overflow-hidden rounded-full bg-bg-quaternary">
      <div data-sync-bar class="absolute inset-y-0 right-0 rounded-full transition-[width] duration-300 ease-std ${done ? 'bg-[#14AE5C]' : 'bg-bg-brand'}" style="width:${Math.max(4, s.p * 100)}%"></div>
    </div>
    <div class="mt-1 flex justify-between text-[11px] leading-4 text-text-quaternary"><span>${monthYear(s.since)}</span><span>Today</span></div>
  </div>`;
}
function syncCaption(c) {
  const s = c.sync;
  if (s.phase === 'recent') return `<span class="inline-flex items-center gap-1.5"><span class="spinner !h-3 !w-3"></span>Getting the last 30 days</span>`;
  if (s.phase === 'history') return `<span class="inline-flex items-center gap-1"><i class="ph-fill ph-check-circle text-[13px] text-[#14AE5C]"></i>Ready with the last 30 days · older data syncing</span>`;
  return null;
}

function startSync(c, since) {
  c.sync = { phase: 'recent', since, p: 0 };
  setTimeout(() => {
    if (!S.conns.includes(c)) return;
    c.sync.phase = 'history';
    rerenderConnSurfaces();
  }, 2600);
}
function rerenderConnSurfaces() {
  if (!$('#modal').classList.contains('hidden') && S.tab === 'conns' && S.view !== 'cat') renderConns();
  renderCard();
}
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = now - lastTick; lastTick = now;
  S.conns.forEach((c) => {
    if (!c.sync || c.sync.phase !== 'history') return;
    const s = c.sync;
    s.p = Math.min(1, s.p + dt / HISTORY_DEMO_MS);
    if (s.p >= 1) {
      s.phase = 'done';
      rerenderConnSurfaces();
      toast(`${appById(c.id).name} is fully synced, back to ${monthYear(s.since)}`);
      setTimeout(() => { if (c.sync?.phase === 'done') { delete c.sync; rerenderConnSurfaces(); } }, 5000);
      return;
    }
    // In-place updates: no re-render, so switches and hovers aren't interrupted.
    document.querySelectorAll(`[data-sync="${c.id}"]`).forEach((el) => {
      const bar = el.querySelector('[data-sync-bar]'); if (bar) bar.style.width = Math.max(4, s.p * 100) + '%';
      const lab = el.querySelector('[data-sync-label]'); if (lab && !lab.dataset.static) lab.textContent = `Synced back to ${monthYear(coveredDate(s))}`;
      const eta = el.querySelector('[data-sync-eta]'); if (eta) eta.textContent = etaText(s);
    });
  });
}, 250);

// ================= glue =================
function flash(which) { S.flash = which; renderAll(); setTimeout(() => { if (S.flash === which) { S.flash = null; renderCard(); } }, 2200); }
function renderAll() { renderCard(); renderPage(); if (!$('#modal').classList.contains('hidden')) renderTabs(); renderBatch(); }

const WORKSPACE = () => [
  { id: 'hubspot', on: true, status: 'ACTIVE', scope: 'workspace' },
  { id: 'googledrive', on: true, status: 'ACTIVE', scope: 'workspace' },
  { id: 'notion', on: true, status: 'ACTIVE', scope: 'workspace' },
  { id: 'slack', on: true, status: 'EXPIRED', scope: 'workspace' },
];
function seed(kind) {
  closeModal();
  S.files = []; S.batch = null; S.flash = null; rows.forEach((li) => li.remove()); rows.clear();
  S.instructions = ''; S.instrWhen = ''; S.decks = 0; S.conns = WORKSPACE();
  if (kind !== 'empty') {
    S.instructions = 'Write for account executives. Lead with customer outcomes, keep each slide to three points, and quote FY27 pricing from the pricing sheet.';
    S.instrWhen = '2 days ago';
    S.files = [
      { id: ++uid, name: 'Northwind brand guidelines 2027.pdf', size: 4404019, status: 'ready', added: '3 days ago' },
      { id: ++uid, name: 'FY27 pricing sheet.docx', size: 214000, status: 'ready', added: '2 days ago' },
      { id: ++uid, name: 'Win stories Q4.pptx', size: 18350000, status: 'ready', added: '2 days ago' },
      { id: ++uid, name: 'Objection handling guide.docx', size: 480000, status: 'ready', added: '2 days ago' },
    ];
    S.conns.unshift({ id: 'salesforce', on: true, status: 'ACTIVE', scope: 'project', sync: { phase: 'history', since: new Date(2022, 0, 1), p: 0.28 } });
    S.conns.find((c) => c.id === 'notion').on = false;
  }
  if (kind === 'decks' || kind === 'upload') S.decks = 4;
  $('#instrStatus').textContent = ''; delete $('#instrStatus').dataset.saved;
  renderAll();
}
document.querySelectorAll('[data-seed]').forEach((b) => b.onclick = () => {
  seed(b.dataset.seed);
  if (b.dataset.seed === 'upload') setTimeout(() => addFiles([
    { name: 'Q1 territory targets.pdf', size: 2100000 },
    { name: 'Discovery call script.docx', size: 380000 },
    { name: 'Scanned contract (locked).pdf', size: 9200000 },
  ], 'Scanned contract (locked).pdf'), 300);
});
seed('empty');
</script>
