<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>crazy8s · signup-redesign — Round 1</title>

<!-- Fonts + icons -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

<!-- Design system -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../../design-system/pai.tailwind.js"></script>
<link rel="stylesheet" href="../../../design-system/pai.css" />

<style>
  :root{
    --navy:#0A1925; --navy-hover:#23303B; --brand:#0055ED; --brand-hover:#0043B8;
    --orange:#FF5500; --ink:#0A0A0A; --muted:#5B6671; --line:rgba(11,15,20,0.08);
    --paper:#FBF8F3;
  }
  body{margin:0; background:#EDEEF1; color:var(--ink);}
  .gallery{max-width:1320px; margin:0 auto; padding:40px 24px 120px;}
  .g-head{margin:8px 0 36px;}
  .g-head h1{font:800 13px/1 Inter; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 10px;}
  .g-head p{font:500 15px/1.5 Inter; color:#36404A; margin:0; max-width:760px;}
  .v-section{margin:0 0 56px;}
  .v-label{display:flex; align-items:baseline; gap:12px; margin:0 0 14px;}
  .v-label .num{font:800 13px/1 Inter; color:#fff; background:var(--navy); padding:5px 8px; border-radius:6px;}
  .v-label .name{font:700 18px/1 Inter; color:var(--ink);}
  .v-label .desc{font:500 13px/1 Inter; color:var(--muted);}
  /* Each variant renders inside a 16:10 browser frame */
  .frame{position:relative; width:100%; aspect-ratio:16/10; border-radius:16px; overflow:hidden;
         background:#fff; box-shadow:0 1px 0 rgba(11,15,20,.04), 0 24px 60px -28px rgba(11,15,20,.28);
         border:1px solid var(--line);}
  .frame *{box-sizing:border-box;}

  /* ---- shared signup atoms ---- */
  .logo{display:inline-flex; align-items:center; gap:9px; font:800 21px/1 Inter; letter-spacing:-.02em; color:var(--ink);}
  .logo .mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(150deg,#2E7BFF,#0055ED);
              display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px -2px rgba(0,85,237,.5);}
  .logo .mark i{color:#fff; font-size:16px;}
  .logo .dot{color:#8A97A4; font-weight:700;}
  .logo.on-dark{color:#fff;} .logo.on-dark .dot{color:#7C8B9A;}

  .lang{display:inline-flex; align-items:center; gap:8px; font:500 14px/1 Inter; color:#36404A;
        border:1px solid var(--line); border-radius:999px; padding:9px 14px; background:#fff;}
  .lang.on-dark{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); color:#fff;}

  .h-display{font:800 40px/1.05 Inter; letter-spacing:-.025em; color:var(--ink); margin:0;}
  .sub{font:400 16px/1.5 Inter; color:var(--muted); margin:10px 0 0;}

  .btn{display:flex; align-items:center; justify-content:center; gap:12px; width:100%; height:52px;
       border-radius:12px; font:600 15px/1 Inter; cursor:pointer; border:1px solid transparent;}
  .btn-google{background:var(--brand); color:#fff; box-shadow:0 6px 16px -6px rgba(0,85,237,.6);}
  .btn-google .gw{width:24px; height:24px; border-radius:5px; background:#fff; display:flex; align-items:center; justify-content:center;}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-outline{background:#fff; color:var(--ink); border-color:var(--line);}
  .btn-other{background:none; border:none; color:var(--muted); font:500 14px/1 Inter; cursor:pointer; padding:8px;}
  .terms{display:flex; align-items:center; gap:9px; font:400 13px/1.4 Inter; color:var(--muted);}
  .terms .box{width:17px; height:17px; border-radius:5px; background:var(--navy); display:flex; align-items:center; justify-content:center;}
  .terms .box i{color:#fff; font-size:11px;} .terms a{color:#36404A; text-decoration:underline;}

  .vp-check{color:#16A34A; font-size:16px; margin-top:2px;}
  .logo-strip{display:flex; align-items:center; gap:30px; flex-wrap:wrap; opacity:.62;}
  .logo-strip span{font:700 17px/1 Inter; color:#3a4754; letter-spacing:-.01em; display:inline-flex; align-items:center; gap:7px;}
  .logo-strip.on-dark{opacity:.85;} .logo-strip.on-dark span{color:#cdd6e0;}

  .pill{display:inline-flex; align-items:center; gap:7px; font:600 12px/1 Inter; padding:7px 12px;
        border-radius:999px; background:rgba(0,85,237,.08); color:var(--brand);}
</style>
</head>
<body class="pai">
<div class="gallery">
  <div class="g-head">
    <h1>crazy8s · signup-redesign · Round 1</h1>
    <p>Eight ways to make the signup page feel like the presentations.ai marketing site — same messaging, design-system tokens intact. Each is a different composition of the right panel. Tell me which to branch (e.g. "the founder's letter", "#3"), or "freeze it".</p>
  </div>
  <div id="mount"></div>
</div>

<script>
/* ============================ shared content ============================ */
const C = {
  headline: ['Your ideas,', 'perfectly presented.'],
  sub: 'Create your free account or login below',
  rightHead: 'Presentations that drive decisions.',
  social: ['Join over ', '10 million professionals', ' worldwide who trust us with their most critical presentations.'],
  props: [
    ['ph-lightning',   'Decks in Minutes, Not Days',        'Start with your idea, outline, or doc. AI handles the rest.'],
    ['ph-magic-wand',  'Look Professional Without a Designer','Slides that build credibility. AI handles layouts, design, and styling.'],
    ['ph-palette',     'Stay on Brand',                      'Maintain perfect brand consistency on every slide. On auto-pilot.'],
    ['ph-share-network','Works Everywhere You Present',      'PowerPoint, Google Slides, PDF, live link, email. No lock-in.'],
    ['ph-sparkle',     'Unleash Your Creativity',            'Go beyond cookie-cutter AI templates for a truly unique look.'],
  ],
  logos: ['Microsoft','Google','Adobe','facebook'],
};

/* ============================ shared atoms ============================ */
const logo = (dark)=>`<div class="logo ${dark?'on-dark':''}"><span class="mark"><i class="ph-fill ph-stack-simple"></i></span>presentations<span class="dot">.ai</span></div>`;
const lang = (dark)=>`<span class="lang ${dark?'on-dark':''}"><i class="ph ph-globe"></i>English <i class="ph ph-caret-down" style="font-size:12px;opacity:.6"></i></span>`;
const googleBtn = ()=>`<button class="btn btn-google"><span class="gw">${gIcon()}</span>Continue with Google</button>`;
const emailBtn  = ()=>`<button class="btn btn-outline"><i class="ph ph-envelope-simple" style="font-size:18px"></i>Continue with Email</button>`;
const otherBtn  = ()=>`<button class="btn-other">Show other options <i class="ph ph-caret-down" style="font-size:11px"></i></button>`;
const terms = ()=>`<label class="terms"><span class="box"><i class="ph-bold ph-check"></i></span>I agree to Presentations.AI's <a href="#">terms</a> &amp; <a href="#">privacy policy</a></label>`;
const gIcon = ()=>`<svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 1.9-1.5 4.8-4.4 6.7l-.04.3 6.4 5 .4.04C42 41.7 45 33.6 45 24z"/><path fill="#34A853" d="M24 46c5.8 0 10.6-1.9 14.2-5.2l-6.8-5.2c-1.8 1.3-4.3 2.2-7.4 2.2-5.6 0-10.4-3.8-12.1-9l-.3.02-6.6 5.1-.1.3C8.2 41 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.9 28.6c-.4-1.3-.7-2.7-.7-4.1 0-1.4.3-2.8.7-4.1l-.01-.3-6.7-5.2-.2.1C3.5 17.7 3 20.8 3 24s.5 6.3 1.7 9l7.2-5.6z"/><path fill="#EA4335" d="M24 9.5c4 0 6.7 1.7 8.2 3.2l6-5.9C34.6 3.3 29.8 1 24 1 15.5 1 8.2 6 4.7 13.3l7.2 5.6C13.6 13.3 18.4 9.5 24 9.5z"/></svg>`;
const logoStrip = (dark)=>`<div class="logo-strip ${dark?'on-dark':''}">${C.logos.map(l=>`<span><i class="ph-fill ph-${l==='Microsoft'?'windows-logo':l==='Google'?'google-logo':l==='Adobe'?'pen-nib':'facebook-logo'}"></i>${l}</span>`).join('')}</div>`;
const socialLine = ()=>`${C.social[0]}<b>${C.social[1]}</b>${C.social[2]}`;

/* The auth column reused by several variants. opts: {compact} */
function authCol(opts={}){
  return `
  <div style="display:flex; flex-direction:column; height:100%; padding:${opts.pad||'40px 56px'};">
    <div>${logo(false)}</div>
    <div style="margin:auto 0; max-width:380px; width:100%; align-self:center;">
      <h1 class="h-display" style="text-align:center; font-size:36px;">${C.headline[0]}<br>${C.headline[1]}</h1>
      <p class="sub" style="text-align:center; margin-bottom:28px;">${C.sub}</p>
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${googleBtn()}${emailBtn()}
        <div style="text-align:center; margin-top:2px;">${otherBtn()}</div>
      </div>
    </div>
    <div style="display:flex; justify-content:center;">${terms()}</div>
  </div>`;
}

/* a single value prop row */
const propRow = (p)=>`
  <div style="display:flex; gap:12px;">
    <i class="ph ph-check vp-check"></i>
    <div><div style="font:700 15px/1.3 Inter; color:var(--ink)">${p[1]}</div>
    <div style="font:400 14px/1.45 Inter; color:var(--muted); margin-top:3px">${p[2]}</div></div>
  </div>`;

/* ============================ variants ============================ */
const V = [];

/* 01 · Founder's letter ----------------------------------------------- */
V.push({name:"Founder's letter", desc:"warm paper panel, a hand-signed note", html:`
  <div style="display:grid; grid-template-columns:1fr 1.08fr; height:100%;">
    ${authCol()}
    <div style="position:relative; background:var(--paper); padding:52px 60px; display:flex; flex-direction:column;
                border-left:1px solid rgba(11,15,20,.05);">
      <div style="position:absolute; top:40px; right:48px;">${lang(false)}</div>
      <div style="font:600 12px/1 Inter; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); margin-top:18px;">A note from our founders</div>
      <div style="max-width:520px; margin-top:22px; font-family:Fraunces, serif; color:#2B2620;">
        <p style="font:500 21px/1.5 Fraunces; margin:0 0 16px;">${C.rightHead}</p>
        <p style="font:400 16px/1.7 Fraunces; color:#4A443B; margin:0 0 14px;">
          We started presentations.ai because building a deck shouldn't cost you days. So we made one that
          turns your idea, outline, or doc into a finished deck in <em>minutes</em> — slides that look like a
          designer made them, without one.</p>
        <p style="font:400 16px/1.7 Fraunces; color:#4A443B; margin:0 0 14px;">
          It stays perfectly on brand, every slide, on auto-pilot — then travels anywhere you present:
          PowerPoint, Google Slides, PDF, a live link. No lock-in, no cookie-cutter templates. Just your
          ideas, unmistakably yours.</p>
        <div style="font-family:Caveat, cursive; font-size:30px; color:var(--brand); margin-top:18px; line-height:1;">The founding team</div>
        <div style="font:500 13px/1 Inter; color:#8A8378; margin-top:8px;">presentations.ai</div>
      </div>
      <div style="margin-top:auto; padding-top:24px; border-top:1px solid rgba(11,15,20,.08);">
        <p style="font:400 14px/1.5 Inter; color:#6B645A; margin:0 0 14px;">${socialLine()}</p>
        ${logoStrip(false)}
      </div>
    </div>
  </div>`});

/* 02 · Marketing hero — product showcase ------------------------------- */
const slideThumb = (accent,big)=>`
  <div style="background:#fff; border-radius:8px; border:1px solid var(--line); padding:11px; box-shadow:0 6px 18px -10px rgba(11,15,20,.25);">
    <div style="height:6px; width:${big?'70%':'52%'}; border-radius:3px; background:${accent}"></div>
    <div style="height:4px; width:88%; border-radius:3px; background:#E7EAEE; margin-top:8px"></div>
    <div style="height:4px; width:74%; border-radius:3px; background:#E7EAEE; margin-top:5px"></div>
    ${big?`<div style="height:34px; border-radius:5px; background:linear-gradient(120deg,#EAF1FF,#F4F8FF); margin-top:9px; border:1px solid #E3ECFB"></div>`:''}
  </div>`;
V.push({name:"Marketing hero", desc:"real product mockup, like the landing hero", html:`
  <div style="display:grid; grid-template-columns:1fr 1.1fr; height:100%;">
    ${authCol()}
    <div style="position:relative; background:radial-gradient(120% 120% at 80% 10%, #EAF1FF 0%, #DCE8FF 55%, #CFE0FF 100%); padding:52px 56px; overflow:hidden; display:flex; flex-direction:column;">
      <div style="position:absolute; top:40px; right:48px;">${lang(false)}</div>
      <h2 style="font:800 30px/1.12 Inter; letter-spacing:-.025em; color:var(--navy); max-width:420px; margin:18px 0 0;">${C.rightHead}</h2>
      <div style="position:relative; margin:30px 0 auto;">
        <div style="background:#fff; border-radius:14px; box-shadow:0 30px 60px -30px rgba(10,25,37,.5); border:1px solid #fff; overflow:hidden; max-width:460px;">
          <div style="height:34px; background:#F4F6F9; display:flex; align-items:center; gap:6px; padding:0 12px; border-bottom:1px solid var(--line)">
            <span style="width:9px;height:9px;border-radius:50%;background:#FF5F57"></span><span style="width:9px;height:9px;border-radius:50%;background:#FEBC2E"></span><span style="width:9px;height:9px;border-radius:50%;background:#28C840"></span>
            <span style="margin-left:8px;font:600 11px/1 Inter;color:#9AA4AF">your-pitch.deck</span>
          </div>
          <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:10px; padding:14px;">
            ${slideThumb('var(--brand)',true)}
            <div style="display:flex; flex-direction:column; gap:10px;">${slideThumb('var(--orange)')}${slideThumb('#16A34A')}</div>
          </div>
        </div>
        <div style="position:absolute; bottom:-14px; right:-6px; background:#fff; border-radius:10px; padding:10px 13px; box-shadow:0 14px 30px -12px rgba(10,25,37,.4); display:flex; align-items:center; gap:8px;">
          <i class="ph-fill ph-sparkle" style="color:var(--orange)"></i><span style="font:700 13px/1 Inter">Generated in 38s</span>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:24px;">
        ${C.props.map(p=>`<span class="pill"><i class="ph ${p[0]}"></i>${p[1].replace(', Not Days','').replace(' Without a Designer','')}</span>`).join('')}
      </div>
      <div style="margin-top:22px;"><p style="font:400 13px/1.5 Inter;color:#46566a;margin:0 0 12px">${socialLine()}</p>${logoStrip(false)}</div>
    </div>
  </div>`});

/* 03 · Dark navy premium ---------------------------------------------- */
V.push({name:"Navy premium", desc:"dark glow panel, enterprise weight", html:`
  <div style="display:grid; grid-template-columns:1fr 1.05fr; height:100%;">
    ${authCol()}
    <div style="position:relative; background:#0A1925; padding:52px 58px; overflow:hidden; display:flex; flex-direction:column;">
      <div style="position:absolute; width:420px; height:420px; border-radius:50%; top:-120px; right:-80px;
                  background:radial-gradient(circle, rgba(0,85,237,.55), transparent 65%); filter:blur(20px);"></div>
      <div style="position:absolute; width:300px; height:300px; border-radius:50%; bottom:-100px; left:-60px;
                  background:radial-gradient(circle, rgba(255,85,0,.28), transparent 65%); filter:blur(24px);"></div>
      <div style="position:absolute; top:40px; right:48px; z-index:2">${lang(true)}</div>
      <h2 style="position:relative; font:800 30px/1.12 Inter; letter-spacing:-.025em; color:#fff; max-width:420px; margin:18px 0 26px;">${C.rightHead}</h2>
      <div style="position:relative; display:flex; flex-direction:column; gap:16px; max-width:440px;">
        ${C.props.map(p=>`<div style="display:flex; gap:13px;">
          <span style="flex:none; width:34px; height:34px; border-radius:9px; background:rgba(0,85,237,.16); border:1px solid rgba(143,184,255,.25); display:flex; align-items:center; justify-content:center;"><i class="ph ${p[0]}" style="color:#8FB8FF; font-size:17px"></i></span>
          <div><div style="font:700 15px/1.3 Inter; color:#fff">${p[1]}</div>
          <div style="font:400 13px/1.45 Inter; color:#9DAAB8; margin-top:2px">${p[2]}</div></div></div>`).join('')}
      </div>
      <div style="position:relative; margin-top:auto; padding-top:22px; border-top:1px solid rgba(255,255,255,.1);">
        <p style="font:400 13px/1.5 Inter; color:#AEB9C6; margin:0 0 12px;">${C.social[0]}<b style="color:#fff">${C.social[1]}</b>${C.social[2]}</p>
        ${logoStrip(true)}
      </div>
    </div>
  </div>`});

/* 04 · Airy gradient orbs — centered ---------------------------------- */
V.push({name:"Airy orbs", desc:"single centered glass card on a soft gradient", html:`
  <div style="position:relative; height:100%; overflow:hidden; background:linear-gradient(180deg,#F7FAFF,#EEF3FB);">
    <div style="position:absolute; width:460px; height:460px; border-radius:50%; top:-160px; left:-100px; background:radial-gradient(circle, rgba(0,85,237,.22), transparent 62%); filter:blur(10px)"></div>
    <div style="position:absolute; width:380px; height:380px; border-radius:50%; bottom:-150px; right:-90px; background:radial-gradient(circle, rgba(255,85,0,.14), transparent 62%); filter:blur(10px)"></div>
    <div style="position:absolute; top:34px; left:48px;">${logo(false)}</div>
    <div style="position:absolute; top:34px; right:48px;">${lang(false)}</div>
    <div style="position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 24px 36px;">
      <span class="pill" style="margin-bottom:16px"><i class="ph-fill ph-sparkle"></i>${C.rightHead}</span>
      <h1 class="h-display" style="font-size:42px; text-align:center;">${C.headline[0]}<br>${C.headline[1]}</h1>
      <p class="sub" style="text-align:center;">${C.sub}</p>
      <div style="width:100%; max-width:380px; margin-top:22px; background:rgba(255,255,255,.7); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.9); border-radius:18px; padding:20px; box-shadow:0 24px 50px -26px rgba(10,25,37,.35); display:flex; flex-direction:column; gap:11px;">
        ${googleBtn()}${emailBtn()}<div style="text-align:center">${otherBtn()}</div>
      </div>
      <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:24px; max-width:760px;">
        ${C.props.map(p=>`<span style="display:inline-flex; align-items:center; gap:7px; font:600 13px/1 Inter; color:#3a4754"><i class="ph ${p[0]}" style="color:var(--brand)"></i>${p[1].replace(', Not Days','').replace(' Without a Designer','')}</span>`).join('')}
      </div>
      <div style="margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <p style="font:400 12px/1 Inter; color:#6B7682; margin:0">${socialLine()}</p>${logoStrip(false)}
      </div>
    </div>
  </div>`});

/* 05 · Testimonial wall ----------------------------------------------- */
const tCard = (q,name,role,grad)=>`
  <div style="background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 12px 30px -22px rgba(11,15,20,.3);">
    <div style="display:flex; gap:2px; color:var(--orange); margin-bottom:8px;">${'<i class="ph-fill ph-star" style="font-size:13px"></i>'.repeat(5)}</div>
    <p style="font:500 14px/1.5 Inter; color:#2B333B; margin:0 0 12px;">"${q}"</p>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="width:34px; height:34px; border-radius:50%; background:${grad}; display:flex; align-items:center; justify-content:center; color:#fff; font:700 13px/1 Inter">${name[0]}</span>
      <div><div style="font:700 13px/1 Inter">${name}</div><div style="font:400 12px/1 Inter; color:var(--muted); margin-top:3px">${role}</div></div>
    </div>
  </div>`;
V.push({name:"Testimonial wall", desc:"social-proof heavy right panel", html:`
  <div style="display:grid; grid-template-columns:1fr 1.05fr; height:100%;">
    ${authCol()}
    <div style="position:relative; background:linear-gradient(180deg,#EAF1FF,#DFE9FB); padding:48px 52px; display:flex; flex-direction:column;">
      <div style="position:absolute; top:40px; right:48px;">${lang(false)}</div>
      <div style="margin-top:14px;">
        <div style="font:800 44px/1 Inter; letter-spacing:-.03em; color:var(--navy)">10 million+</div>
        <p style="font:500 16px/1.4 Inter; color:#46566a; margin:8px 0 0; max-width:380px">professionals worldwide trust us with their most critical presentations.</p>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:26px 0 auto;">
        ${tCard('From idea to a finished deck before my coffee got cold. Genuinely changed how I pitch.','Priya','Product Lead','linear-gradient(135deg,#0055ED,#2E7BFF)')}
        ${tCard('It stays on brand without me babysitting every slide. That alone sold my whole team.','Marcus','Head of Sales','linear-gradient(135deg,#FF5500,#FF8A3D)')}
        ${tCard('Looks like we hired a designer. We did not.','Lena','Founder','linear-gradient(135deg,#16A34A,#34D27B)')}
        ${tCard('Exports clean to PowerPoint and Slides — no lock-in, no reformatting.','Dev','Consultant','linear-gradient(135deg,#7C3AED,#A974FF)')}
      </div>
      ${logoStrip(false)}
    </div>
  </div>`});

/* 06 · Editorial full-bleed — landing-as-signup ----------------------- */
V.push({name:"Editorial landing", desc:"top nav, hero headline, card below — full marketing page", html:`
  <div style="position:relative; height:100%; overflow:hidden; background:#fff; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 48px; border-bottom:1px solid var(--line);">
      ${logo(false)}
