/* ── helpers ──────────────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const ini = a => a.name.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const logo = (k, big) => {
  const a = APPS[k];
  const inner = a.slug
    ? `<img src="https://cdn.simpleicons.org/${a.slug}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;ini&quot; style=&quot;background:#7f7f7f&quot;>${ini(a)}</span>'">`
    : `<span class="ini" style="background:${a.color}">${ini(a)}</span>`;
  return `<span class="lg${big ? " big" : ""}" title="${a.name}">${inner}</span>`;
};
const logos = ks => `<span class="logos">${ks.map(k => logo(k)).join("")}</span>`;
const scheduled = new Set();

const IMG = id => `https://images.unsplash.com/photo-${id}?w=1000&h=1000&fit=crop&auto=format&q=70`;
const PHOTOS = {
  shoppingBags: "1760565030346-4b947220fe3a", catTree: "1652113935269-cb82cbd01524",
  envelopes: "1762427354081-26d22739d641", yellowChair: "1586023492125-27b2c045efd7",
};
const BY = `<div class="by"><i class="ph-fill ph-paw-print"></i>PERCH &amp; PAW</div>`;
/* layouts: bleed / frame / split / band use a photo; type / stat do not (extra = the layout's own shapes) */
function slide(layout, { photo, title, sub, kick, bg = "#111", fg = "#fff", accent, extra = "" }) {
  return `<div class="slide sl-${layout}" style="background:${bg};color:${fg}">
    ${photo ? `<img src="${IMG(PHOTOS[photo])}" alt="" loading="lazy">` : ""}
    ${accent && layout === "frame" ? `<span class="rule" style="background:${accent}"></span>` : ""}${extra}${BY}
    <div class="tx">${kick ? `<span class="kick" style="color:${accent || "inherit"}">${kick}</span>` : ""}<div class="ttl">${title}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div></div>`;
}
const bars = (hs, hi) => `<div class="chart">${hs.map((h, i) => `<i class="${i >= hi ? "hi" : ""}" style="height:${h}%"></i>`).join("")}</div>`;
const COVERS = {
  bf: () => slide("split", { photo: "shoppingBags", bg: "#161412", accent: "#f08a24", kick: "Black Friday 2026",
        title: "Early access: the first 72 hours", sub: "Up 64% on last year" }),
  orbit: () => slide("bleed", { photo: "catTree", title: "Why the Orbit cat tree sold out",
        sub: "1,240 units in 9 days, and the case for a restock" }),
  plan: () => slide("type", { bg: "#f3ece2", fg: "#2a1d0c", kick: "Marketing plan", accent: "#9a5d27",
        title: "Q1 2027: goals, budget and launches", sub: "January to March 2027",
        extra: `<div class="months"><div>JAN</div><div>FEB</div><div>MAR</div></div>` }),
  weekly: () => stack(e => slide("stat", { bg: "linear-gradient(120deg,#0b2545,#13506b)", kick: "Weekly marketing update", accent: "#8fd3ff",
        title: ["Week of 23 Nov", "Week of 16 Nov", "Week of 9 Nov"][e], sub: "Revenue, traffic, paid social and email",
        extra: `<div class="kpi"><b>${["$212k", "$148k", "$131k"][e]}</b><span>revenue this week</span></div>${bars([34, 40, 36, 44, 42, 58, 92], 6)}` })),
  monthly: () => stack(e => slide("stat", { bg: "#ffffff", fg: "#14213d", kick: "Channel review", accent: "#2f6fde",
        title: ["November 2026", "October 2026", "September 2026"][e], sub: "Spend and return by channel",
        extra: `<div class="rows">${[["Email", 92, "#2f6fde"], ["Paid social", 74, "#2f6fde"], ["Search", 58, "#9db8ea"], ["Organic", 41, "#9db8ea"], ["Affiliates", 22, "#d5e0f5"]]
          .map(([l, w, c]) => `<div><span>${l}</span><em style="width:${w}%;background:${c}"></em></div>`).join("")}</div>` })),
  campaign: () => stack(e => slide("frame", { photo: "envelopes", bg: "#1d1630", accent: "#ff8fb1", kick: "Campaign recap",
        title: ["Cyber Monday", "VIP early access", "Cosy season"][e], sub: "Opens, clicks and the orders it drove" })),
  recentA: () => slide("bleed", { photo: "yellowChair", title: "Spring 2027 collection lookbook", sub: "Beds, sofas and throws for homes with pets" }),
  recentB: () => slide("type", { bg: "#141416", kick: "Retail partners", accent: "#f08a24",
        title: "Modular cat furniture for your stores", sub: "Partner pitch · 2027 range",
        extra: `<span class="ring" style="border-color:#f08a24"></span>` }),
  recentC: () => slide("stat", { bg: "linear-gradient(120deg,#0b2545,#13506b)", kick: "Weekly marketing update", accent: "#8fd3ff",
        title: "Week of 9 Nov", sub: "Revenue, traffic, paid social and email",
        extra: `<div class="kpi"><b>$131k</b><span>revenue this week</span></div>${bars([30, 36, 33, 41, 38, 46, 52], 6)}` }),
};
function stack(make) {
  return `<div class="stack"><div class="ed e3">${make(2)}</div><div class="ed e2">${make(1)}</div><div class="ed">${make(0)}</div></div>`;
}



const ONCE = SUGG.filter((s) => s.kind === 'once'), REC = SUGG.filter((s) => s.kind === 'rec');
const CONNECTED = ['shopify', 'ga', 'meta', 'klaviyo', 'drive'];
const th = (s) => `<div class="thumb">${COVERS[s.cover]()}</div>`;
const headLogos = () => `<span class="logos hl">${CONNECTED.slice(0, 3).map((k) => logo(k)).join('')}<span class="lg more">+2</span></span>`;
const TITLE = 'Decks can be made from your Shopify, Analytics and more';
const cadence = (s) => s.kind === 'once' ? '<span class="cad once">One-time</span>' : `<span class="cad"><i class="ph ph-arrows-clockwise"></i>${s.cadence}</span>`;
const tabsLine = (extra = '') => `<div class="tabsline"><span class="on">Recent</span><span>Created by me</span><span>Starred</span><span>Shared with me</span>${extra}</div><div class="ghostrow"><i></i><i></i><i></i></div>`;

const V = [];
const HERO = ONCE[0], REST = [ONCE[1], REC[0], ONCE[2], REC[1]];
const MORE = TITLE.replace('Decks can be made from your ', 'More from your ');
const kindIcon = (s) => `<i class="ph ${s.kind === 'once' ? 'ph-presentation' : 'ph-arrows-clockwise'} kind" title="${s.kind === 'once' ? 'One-time' : s.cadence}"></i>`;
const row = (s, right) => `<div class="li"><div class="thumb">${COVERS[s.cover]()}</div><span class="t">${s.title}</span>${right ?? cadence(s)}</div>`;

// 01 · the pick from round 1, unchanged
V.push({ label: 'Featured + list (picked)', note: 'Round 1\'s pick, unchanged: cover, label, reason, button; four one-line rows with their kind.', html: () => `
  <div class="panel fl"><div class="feat">${th(HERO)}<div><div class="k">Suggested now</div><h3>${HERO.title}</h3><p class="clamp2">${HERO.reason}</p><button class="btn pri">Create deck</button> <span style="margin-left:8px">${logos(HERO.apps)}</span></div></div>
    <div class="list"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>${REST.map((s) => row(s)).join('')}</div></div>${tabsLine()}` });

// 02 · lead with the number that makes it worth making; list grouped by kind
V.push({ label: 'Evidence number', note: 'The hero leads with the number that makes it worth a deck (+64%). The list splits into One-time and Recurring with small headers.', html: () => `
  <div class="panel fl r2"><div class="feat">${th(HERO)}<div><div class="k">Suggested now</div><h3>${HERO.title}</h3>
      <div class="num"><b>+64%</b><span>early-access sales vs 2025</span></div><button class="btn pri">Create deck</button> <span style="margin-left:8px">${logos(HERO.apps)}</span></div></div>
    <div class="list"><div class="grp"><i class="ph ph-presentation"></i>One-time</div>${[ONCE[1], ONCE[2]].map((s) => row(s, logos(s.apps))).join('')}
      <div class="grp" style="margin-top:4px"><i class="ph ph-arrows-clockwise"></i>Recurring</div>${[REC[0], REC[1]].map((s) => row(s, `<span class="cad">${s.cadence}</span>`)).join('')}</div></div>${tabsLine()}` });

// 03 · the cover fills the hero; text sits on it
V.push({ label: 'Cover-led hero', note: 'A dark hero: the text on the left, the cover bleeding off the right edge. The list drops thumbnails: text rows with a caret.', html: () => `
  <div class="panel fl r3"><div class="feat"><div class="bg">${COVERS[HERO.cover]()}</div>
      <div class="ov"><div class="k">Suggested now</div><h3>${HERO.title}</h3><p class="clamp2" style="margin:0 0 12px">${HERO.reason}</p><div><button class="btn pri">Create deck</button></div></div></div>
    <div class="list"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>
      ${REST.map((s) => `<div class="li">${kindIcon(s)}<span class="t">${s.title}</span><span style="font-size:12px;color:var(--text-2)">${s.kind === 'once' ? 'One-time' : s.cadence}</span><i class="ph ph-caret-right ar"></i></div>`).join('')}</div></div>${tabsLine()}` });

// 04 · a tinted hero; the list becomes a 2×2 grid of small covers
V.push({ label: 'Tinted hero, cover grid', note: 'The hero half gets a pale brand-blue tint. The other four become a 2×2 grid of small covers with their kind.', html: () => `
  <div class="panel fl r4"><div class="feat">${th(HERO)}<div><div class="k">Suggested now</div><h3>${HERO.title}</h3><p class="clamp2">${HERO.reason}</p><button class="btn pri">Create deck</button></div></div>
    <div class="list"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>
      <div class="grid4">${REST.map((s) => `<div class="tile"><div class="thumb">${COVERS[s.cover]()}</div><div><div class="t clamp2">${s.title}</div>${cadence(s)}</div></div>`).join('')}</div></div></div>${tabsLine()}` });

// 05 · no outer panel: hero is its own floating card, the list sits on the page
V.push({ label: 'Floating hero, open list', note: 'No outer panel. The hero is its own raised card; the list sits straight on the page as text rows with a kind icon. Lightest surface.', html: () => `
  <div class="r5"><div class="feat">${th(HERO)}<div><div class="k" style="color:var(--text-brand);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Suggested now</div>
      <h3 style="margin:4px 0;font-size:15px;line-height:20px;font-weight:600">${HERO.title}</h3><p class="clamp2" style="margin:0 0 10px;font-size:13px;line-height:18px;color:var(--text-2)">${HERO.reason}</p><button class="btn pri">Create deck</button></div></div>
    <div class="side"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>
      ${REST.map((s) => `<div class="li">${kindIcon(s)}<span class="t">${s.title}</span><span style="font-size:12px;color:var(--text-2)">${s.kind === 'once' ? 'One-time' : s.cadence}</span></div>`).join('')}</div></div>${tabsLine()}` });

// 06 · the hero shows its evidence as chips, one per app
V.push({ label: 'Evidence chips', note: 'Instead of one reason line, the hero shows what each app said as small chips. The list shows when each one would be ready.', html: () => `
  <div class="panel fl r6"><div class="feat">${th(HERO)}<div style="min-width:0"><div class="k">Suggested now</div><h3>${HERO.title}</h3>
      <div class="ev"><span>${logo('shopify')}$184k since 23 Nov</span><span>${logo('klaviyo')}a third came by email</span><span>${logo('meta')}best ad: "Nap test"</span></div>
      <button class="btn pri">Create deck</button></div></div>
    <div class="list"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>
      ${REST.map((s) => row(s, `<span class="when">${s.kind === 'once' ? 'Ready now' : { week: 'Mon 30 Nov', month: 'Tue 1 Dec', trigger: 'Wed 2 Dec' }[s.how]}</span>`)).join('')}</div></div>${tabsLine()}` });

// 07 · dark hero for contrast against the grey page
V.push({ label: 'Dark hero', note: 'The hero half goes near-black with white text and a white button, so it reads as the one thing to look at. The list stays light.', html: () => `
  <div class="panel fl r7"><div class="feat">${th(HERO)}<div><div class="k">Suggested now</div><h3>${HERO.title}</h3><p class="clamp2">${HERO.reason}</p><button class="btn wht">Create deck</button> <span style="margin-left:8px">${logos(HERO.apps)}</span></div></div>
    <div class="list"><div class="lh">${MORE}<a class="lnk" href="#">See all</a></div>${REST.map((s) => row(s)).join('')}</div></div>${tabsLine()}` });

// 08 · the hero cycles through all six; the list is the queue
V.push({ label: 'Cycling hero', note: 'Arrows move the hero through all six; the list on the right is the queue and highlights the one in the hero. Click a row to bring it up.', html: () => `
  <div class="panel fl r8" data-r8><div class="feat"><div class="top" data-hero style="flex:1"></div></div>
    <div class="list"><div class="lh">Up next<a class="lnk" href="#">See all</a></div><div class="q" data-q></div></div></div>${tabsLine()}` });
const ALL = [ONCE[0], REC[0], ONCE[1], REC[1], ONCE[2], REC[2]];
function r8(i) {
  const p = document.querySelector('[data-r8]'); if (!p) return; p.dataset.i = i;
  const s = ALL[i];
  p.querySelector('[data-hero]').innerHTML = `${th(s)}<div style="display:flex;flex-direction:column;min-width:0;flex:1"><div class="k">${s.kind === 'once' ? 'Suggested now' : 'Recurring · ' + s.cadence}</div><h3>${s.title}</h3><p class="clamp2" style="margin:0 0 10px;font-size:13px;line-height:18px;color:var(--text-2)">${s.reason}</p>
    <div class="nav"><button class="btn pri" style="margin-right:auto">${s.kind === 'once' ? 'Create deck' : 'Set up'}</button><div class="dots" data-dots></div><button class="ib" data-prev aria-label="Previous"><i class="ph ph-caret-left"></i></button><button class="ib" data-next aria-label="Next"><i class="ph ph-caret-right"></i></button></div></div>`;
  p.querySelector('[data-dots]').innerHTML = ALL.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('');
  p.querySelector('[data-q]').innerHTML = [1, 2, 3, 4].map((d) => { const j = (i + d) % ALL.length, x = ALL[j]; return `<div class="li" data-j="${j}"><span class="t">${x.title}</span>${cadence(x)}</div>`; }).join('');
}

$('#gallery').innerHTML = V.map((v, i) => `<section class="var"><div class="var-label"><b style="white-space:nowrap">${String(i + 1).padStart(2, '0')} · ${v.label}</b><span>${v.note}</span><span class="fit" data-fit></span></div><div class="page" data-page>${v.html()}</div></section>`).join('');

// 08 cycling hero
r8(0);
document.querySelector('[data-r8]').addEventListener('click', (e) => {
  const p = e.currentTarget, i = +p.dataset.i;
  if (e.target.closest('[data-next]')) r8((i + 1) % ALL.length);
  if (e.target.closest('[data-prev]')) r8((i + ALL.length - 1) % ALL.length);
  const r = e.target.closest('[data-j]'); if (r) r8(+r.dataset.j);
});
// fold check: the panel plus the tabs must fit in the ~190px left under the hero on a laptop screen
requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('[data-page]').forEach((p) => {
  const tabs = p.querySelector('.tabsline'); const h = tabs.getBoundingClientRect().top - p.getBoundingClientRect().top - 20;
  const f = p.parentElement.querySelector('[data-fit]'); const ok = h <= 210;
  f.textContent = ok ? 'Recent stays above the fold' : 'Pushes Recent down'; f.classList.toggle('over', !ok);
}), 400));
</script>
