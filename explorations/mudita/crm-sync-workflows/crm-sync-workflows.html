     not — a title on a live button is a hint nobody needs. */
  const why =
    !deckPicked && !branchPicked ? "Pick a deck and how it stays fresh to finish." :
    !deckPicked                  ? "Pick a deck to finish." :
    !branchPicked                ? "Pick how it stays fresh to finish." :
    (onSchedule && !companyPicked) ? "Choose a company to finish." : null;
  if (why) create.setAttribute("title", why); else create.removeAttribute("title");
}

/* V3 · picking a branch opens that branch's controls and rings its card. The
   other stays as it was: a title and a description, and no answer to a
   question nobody asked it. */
/* The summary is read off the controls, never held alongside them — a second
   copy of the state is a second thing that can be wrong. The schedule line has
   no time of day in it: the form has no time-of-day control, and naming an
   hour nobody chose would be a specific this screen invented. */
/* A11 · A12 · the chip carries the radio's state, since .chip-default
   publishes .is-selected and no :checked styling of its own. */
/* AE1 · a branch clips itself while it grows and stops once it has stopped.
   The clip is what makes 0fr-to-1fr work; held after the fact it takes the
   company control's ring off at the branch's edge and cuts its menu in half.
   Cleared BEFORE a collapse, or the closing animation has nothing to clip. */
document.addEventListener("transitionend", ev => {
  if (ev.propertyName !== "grid-template-rows") return;
  const branch = ev.target.closest && ev.target.closest(".branch");
  if (branch && branch.classList.contains("is-selected")) branch.classList.add("is-open");
});

body.addEventListener("change", ev => {
  if (ev.target.matches("[data-branch]"))
    document.querySelectorAll(".branch").forEach(b => b.classList.remove("is-open"));
  const pick = ev.target.closest(".chip-pick");
  if (pick) {
    document.querySelectorAll('.chip-pick input[name="' + ev.target.name + '"]')
      .forEach(r => r.closest(".chip-pick").classList.toggle("is-selected", r.checked));
  }
  if (!ev.target.matches("[data-branch]")) return;
  document.querySelectorAll(".branch").forEach(b => b.classList.remove("is-selected"));
  const card = ev.target.closest(".branch");
  if (card) card.classList.add("is-selected");
  gateSetup();
});
/* H10 · a click anywhere on a branch card picks it. The <label> already covered
   the heading and its line; the padding around them, and the whole width to the
   right of the text, did nothing. The open form is excluded — inside it the
   controls are the targets, not the card. Nothing fires when the card is already
   picked, so a label click is not counted twice: the label's own activation sets
   checked before this handler sees the click bubble. */
body.addEventListener("click", ev => {
  const branch = ev.target.closest && ev.target.closest(".branch");
  if (!branch || ev.target.closest(".branch-body")) return;
  const radio = branch.querySelector("[data-branch]");
  if (!radio || radio.checked) return;
  radio.checked = true;
  radio.dispatchEvent(new Event("change", { bubbles: true }));
});

/* J1 · the import control raises the system picker. Nothing in this document
   draws a window for it, and nothing should. */
body.addEventListener("click", ev => {
  if (ev.target.closest && ev.target.closest("[data-pick-file]"))
    document.getElementById("pptx-pick").click();
});

/* Escape closes whichever is open. A modal you can only leave by finding a
   control is a modal that traps a keyboard. */
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && body.dataset.over !== "none") body.dataset.over = "none";
  /* H20 · a card is a control, so Enter and Space work it. Without this the
     tabindex would put a stop on every card that a keyboard could reach and
     not use, which is worse than not being reachable at all. */
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-open-panel]")) {
    ev.preventDefault();
    ev.target.click();
  }
});

/* The gallery is the same decks the reel carries, drawn with the same
   published card, so nothing here is a second source for what a deck is.

   THREE, not a gallery's worth. Drawn first as RECENT.concat(RECENT) to fill
   the grid, which put the same three decks on screen twice and read as a bug
   rather than as a placeholder. How many a real gallery holds, and what it
   sorts or pages by, is not in the 25 Aug read — the app has tabs and a
   selected-template card, not a browser — so the honest number is the number
   we actually have. */
(function () {
  /* Z10 - every section the rail names, one under the other, and the rail
     follows the scroll rather than filtering. That is a different machine from
     the one this modal had: the rail was a filter and the shelf showed one
     folder; it is an INDEX now, and the shelf holds the whole library.

     THE CONTENTS ARE DEMONSTRATION ART. This run has four deck covers and three
     workspace deck names; a library has neither seventeen folders' worth nor
     the counts to fill them. Each section takes a different slice and order of
     the four, so the page reads as a library rather than as one shelf repeated.
     Pass 16 refused RECENT.concat(RECENT) for exactly this reason; this is the
     same compromise, made deliberately and at a larger scale, because the
     scroll is the thing being shown. */
  const names = [...document.querySelectorAll(".deck-rail .railrow span")].map(x => x.textContent);
  const heads = [...document.querySelectorAll(".deck-rail .railhead")].map(x => x.textContent);
  /* AA7 · how many a section holds, and what its decks are called.

     COUNTS. The grid is four across, so a section of three never shows it and a
     section of three never wraps. Section 0 holds four, section 1 holds nine —
     three rows — and the rest run 2 to 5, so the shelf shows a full row, a
     wrapped section and a short one without being told which is which.

     NAMES. A deck called "Dyson Feature Announcement" under a heading called
     Marketing said nothing about the heading, and repeated verbatim under six of
     them it read as one library shown six times. Each section's decks are named
     for it now. STILL DEMONSTRATION ART: four covers stand in for all of them,
     and none of these names is read off the product. */
  const COUNTS = [4, 9, 3, 5, 2, 4, 8, 3, 4, 6, 2, 5, 3, 4, 7, 2, 4];
  const KINDS  = ["Overview", "Deep dive", "Quarterly review", "Kickoff", "Playbook",
                  "One-pager", "Roadmap", "Retrospective", "Proposal"];
  document.getElementById("deck-sections").innerHTML = names.map((name, i) => {
    const many = COUNTS[i % COUNTS.length];
    const cards = [];
    /* A section's name only makes a deck name where the section is a TOPIC.
       "Design Kickoff" reads; "Created by you Overview" does not, because the
       workspace rows are places rather than subjects. Those keep the run's own
       three deck names and cycle them. */
    const topical = i >= 6;                    /* row 5 is Templates > All */
    for (let k = 0; k < many; k++) {
      const base = RECENT[(i + k) % RECENT.length];
      cards.push(deckHTML({ d: base.d, s: base.s, created: MADEON[(i * 5 + k) % MADEON.length],
        name: topical ? name + " " + KINDS[(i * 3 + k) % KINDS.length]
                      : RECENT[(i + k) % RECENT.length].name }));
    }
    return '<section class="deck-section" id="sec-' + i + '">' +
      (i === 0 ? '<h3 class="secroot text-body-base-medium">' + esc(heads[0]) + "</h3>" :
       i === 5 ? '<h3 class="secroot text-body-base-medium">' + esc(heads[1]) + "</h3>" : "") +
      '<h4 class="sectitle text-body-base-medium">' + esc(name) +
        ' <span class="seccount text-body-sm-regular">' + many + "</span></h4>" +
      '<div class="deck-grid is-twoline">' + cards.join("") + "</div>" +
    "</section>";
  }).join("");

  /* The rail follows the shelf. Whichever section's top has last passed the
     scroller's own top is the one the rail marks - the section being READ,
     not every section on screen, which at three cards each would be several. */
  const scroller = document.querySelector(".deck-main");
  const rows = [...document.querySelectorAll(".deck-rail .railrow")];
  const secs = [...document.querySelectorAll(".deck-section")];
  function spy() {
    const top = scroller.getBoundingClientRect().top + 8;
    let cur = 0;
    secs.forEach((sec, i) => { if (sec.getBoundingClientRect().top <= top) cur = i; });
    rows.forEach((r, i) => {
      r.classList.toggle("is-selected", i === cur);
      const box = r.querySelector("input"); if (box) box.checked = i === cur;
    });
  }
  if (scroller) { scroller.addEventListener("scroll", spy); spy(); }

  /* And the rail still drives the shelf, which is what makes it an index
     rather than a read-out. */
  rows.forEach((r, i) => r.addEventListener("click", () => {
    const sec = document.getElementById("sec-" + i);
    if (sec) sec.scrollIntoView({ block: "start" });
  }));
})();


gateSetup();
</script>

<script>
  window.__atlasReady = document.fonts.ready
    .then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));
</script>
