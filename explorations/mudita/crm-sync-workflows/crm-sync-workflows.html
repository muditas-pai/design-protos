       Pass 27 matched the two because they sit two pixels apart; a hard edge
       inside a hard ring reads as one thick frame with a white slot in it.
       At 20% the border sits under the ring rather than beside it. The cost is
       the dark covers: over the body it measures 44 where the solid measured
       219, and over a near-black cover it measures nothing at all, so on those
       two cards the border reads along the bottom strip and stops where the
       picture starts. The ring is what carries the rest, which is its job. */
    border: 1px solid var(--border-primary);
    border-radius: var(--rounded-md);
  }
  /* H3 · --bg-tertiary, the step the ramp has between --bg-secondary and
     --bg-quaternary. AL1 had taken it all the way back to --bg-secondary, which
     differs from a white card body by five values; --bg-quaternary differs by
     twenty-six and read as a grey card rather than a picked one. #F5F5F5 is ten,
     and it is the only step between them. */
  .wf .reel > .pai-thumbnail-card[aria-pressed="true"] .pai-thumbnail-body {
    background: var(--bg-tertiary);
  }
  /* AC1, reversed at AJ1 · this rule used to keep a drop as well as the ring,
     because replacing the elevation left the picked card with no edge of its
     own on the --bg-secondary shelf. The edge came instead from the ::after
     border added at AH1, so the drop had nothing left to do — and pai.css's own
     note beside .pai-thumbnail-card, that "the ring replaces the resting shadow
     rather than stacking on it", is what the rule now does. */
  .wf .reel > .pai-thumbnail-card[aria-pressed="true"] {
    /* AJ1 · the elevation is gone and only the ring stack is left — 2px of card
       colour, then the 4px ring. Four passes were spent pushing a drop far
       enough out to clear the ring; the answer is that the card does not need
       one. Its edge inside the ring is the ::after border below, and the ring
       outside it is what says which card is chosen. The two layers removed were
       --elevation-01's white inset hairline, which an opaque child covers, and
       the --drop-3 shadow at 4px spread that was carrying it past the ring. */
    box-shadow: 0 0 0 2px var(--bg-elevated),
                0 0 0 4px var(--border-primary-inverted);

     branch answers while it is shut. Once it is open the controls below it ARE
     that list, and the line is the same information twice, eight pixels apart. */
  .wf .branch.is-selected .branch-said { display: none; }

  .wf .tk .emailfield { max-width: 420px; }

  .wf .grow { flex: 1; min-width: 0; }

  // handover comment above is for people and nothing downstream parses it.
  window.__atlas = {

    // Three, because checklist.json waived the one-state rule at its gate:

    // twice every pass. It is a setting now, below.

    // What is showing over a row on the Workflows page. A setting, not a state:
    // the checklist's states are three, and R2 (every workflow is listed), R6
    // (the row's menu) and R7 (a workflow is changed here) cannot share one

    // right column. The first value is the default, and it is the clean page.

      // the takeover is still the state, and both routes out of step 1 cover

      over: ["none", "decks"],

      // panel covers the right column exactly as the change panel does. First

const HEX = { "Salesforce": "#00A1E0",           "Zoho CRM": "#E42527",              "HubSpot": "#FF7A59" };

const logo = c =>
  '<span class="logo-field" data-brand="' + esc(c) + '" aria-hidden="true">' +
  '<svg viewBox="' + VB[c] + '" fill="' + HEX[c] + '">' + PATH[c] + '</svg></span>';

const tile = c => '<span class="tile pai-surface-card">' + logo(c) + '</span>';

/* R23 · THE CONNECTORS, and whether each is connected. A DEMONSTRATION VALUE
   like every other on this page — the Workflows page does not exist in the
   product, so nothing here could be read off the running app. Chosen so the
   panel shows both halves of what R23 asks for: two connected and one not, so
   Disconnect and Connect are both on screen at once rather than one of them
   being a state nobody can see. The three are the same three the New workflow
   menu offers, in the same order. */
const CONNECTORS = [
  { name: "Salesforce", connected: true },
  { name: "Zoho CRM",   connected: true },
  { name: "HubSpot",    connected: false },
];

/* R23 · the status is said, not implied. The action alone would carry it —
   Disconnect means connected — but that asks the person to read a control
   backwards to learn a fact, and the requirement asks the panel to SHOW it.
   One action per row, and only the one the status allows: a connected source
   has nothing to connect.
   The connect is .button-secondary and the disconnect .button-ghost. Not
   decoration — the one row that needs something doing is the one that reads
   loudest, and disconnecting is never what somebody opened this panel to do. */
const connRowHTML = c =>
  '<li class="conn-row" data-annotate-id="connector-' +
      esc(c.name.toLowerCase().replace(/ /g, "-")) + '">' +
    tile(c.name) +
    '<div class="grow">' +
      '<h4 class="text-body-base">' + esc(c.name) + '</h4>' +
      '<span class="conn-status text-body-sm">' +
        (c.connected ? "Connected" : "Not connected") + '</span>' +
    '</div>' +
    (c.connected
      ? '<button class="button-style button-small button-ghost" type="button">Disconnect</button>'
      : '<button class="button-style button-small button-secondary" type="button">Connect</button>') +
  '</li>';

/* R23 · built as the change panel is built, from the same .panel, .panel-head
   and .panel-body — reuse before you invent, and a second kind of side panel on
   one screen would be two things doing one job drawn two ways.
   No .panel-bar. The change panel earns one because its body is a form that is
   saved or abandoned as a whole; here each row acts on its own and there is
   nothing to save, so a Cancel and a Save would be claiming a form that is not
   there. The head's dismiss is the way out. */
function connectorsPanelHTML() {
  return '<aside class="panel" aria-label="Manage connectors"' +
      ' data-annotate-id="connectors-panel">' +
    '<div class="panel-head">' +
      '<div class="grow">' +
        '<h3 class="text-heading-base">Connectors</h3>' +

      '<button class="button-style button-small button-ghost icon-only" type="button"' +
        ' aria-label="Close" data-connectors-close><i class="ph ph-x"></i></button>' +
    '</div>' +
    '<div class="panel-body" data-annotate-id="connectors-list">' +
      '<ul class="conn-list">' + CONNECTORS.map(connRowHTML).join("") + '</ul>' +
    '</div>' +
  '</aside>';
}

/* ══ THE CLOSED FORMAT ═══════════════════════════════════════════════════════
   Round 3's 02, settled and not reopened.
     within a day   Today, 6am · Tomorrow, 7am
     beyond         1 Sep, 6am — and the year returns the moment it is not this
                    year: 12 Jan 2027, 6am
     off the hour   Today, 9:12am
     a watch row    On a new lead — a phrase where a time would go
     never run      Not yet */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const dayGap = d => Math.round((midnight(d) - midnight(NOW)) / 864e5);
const h12 = d => (d.getHours() % 12 || 12) +
                 (d.getMinutes() ? ":" + String(d.getMinutes()).padStart(2, "0") : "") +
                 (d.getHours() < 12 ? "am" : "pm");
const dmy = d => d.getDate() + " " + MON[d.getMonth()] +
                 (d.getFullYear() === NOW.getFullYear() ? "" : " " + d.getFullYear());
/* ══ THE PARTS THE CARD IS MADE OF ═══════════════════════════════════════════ */
const pic = (w, n, cls) => '<span class="pai-thumbnail ' + (cls ||"") + '"><img src="' + DECK + "/" + w.d +
                      '/card/' + n + '.jpg" alt="" width="800" height="450" /></span>';

/* AM1 · the pile reads w.s. It used to ask for slides 01, 02 and 03 of whatever
   deck the workflow names, which meant every workflow built on one deck showed
   the identical three slides and the s: [a, b, c] beside each one was decoration.
   shelfHTML's own comment says "w.s keeps all three slide numbers because they
   record which slides of the deck were picked; the row shows the first" — this
   is that sentence being true. The front is s[0], and the two behind it are the
   other two, so reordering s reorders what you see. */
/* ══ THE LINEWORK, FROM THE FIGMA ═══════════════════════════════════════════
   node 943:7737. Two kinds and they are different materials, which is what the
   design settles: DOTTED RULES in #DBDCDC on a 2/2 dash, and ARROWS in
   --neutral-300 drawn as FILLED shapes — a stem and a solid triangle in one
   path — rather than a stroke with a head on it.

   Static, and placed to the design's own numbers, so nothing here is derived
   from the head's measured box the way the old kit was. The head is a fixed 202
   and the coordinates are absolute; there is nothing left to resize against. */
/* P4 · IT RESPONDS TO THE CARD IT IS IN. The drawing was a fixed viewBox at
   0 0 383 202 stretched to 100% of the head, which is not responsive — it is
   SCALED. On a card wider than 383 every stroke got thicker, the 2/2 dash got
   longer, and the two rules that belong near the right edge drifted inward,
   because a viewBox scales the units and the units carry the stroke.

   Painted against the head's measured box instead, the way the old kit did: the
   viewBox is set to the real width so one unit is one CSS pixel and a hairline
   stays a hairline. The verticals are anchored to the edge each of them belongs
   to — 12 and 247 to the left, and the pair at 348/357 to the right at 23 and 14
   in from it, which is where the design put them in its own 371. Repainted on
   resize through the observer the cards already carry. */
const FIG_LEFT  = [12, 247];       /* from the left edge */
const FIG_RIGHT = [23, 14];        /* in from the right */
const figRules = W =>
  FIG_LEFT.map(x => x).concat(FIG_RIGHT.map(x => W - x))
    .map(x => '<path d="M' + (Math.round(x) + 0.5) + ' 0V' + (202 - 1) +
              '" stroke="#DBDCDC" stroke-dasharray="2 2" fill="none"/>').join('');

function paintFigLines(svg) {
  const head = svg.parentElement;
  const W = Math.round(head.getBoundingClientRect().width);
  if (!W) return;
  svg.setAttribute("viewBox", "0 0 " + W + " 202");
  svg.querySelector("[data-rules]").innerHTML = figRules(W);
}

const FIGLINES =
  '<svg class="figlines" viewBox="0 0 383 202" aria-hidden="true">' +
    /* the verticals, rewritten per card by paintFigLines */
    '<g data-rules>' + figRules(383) + '</g>' +
    /* and the elbow that drops out of the top and turns toward the stack */
    '<path d="M46.5 0V59.5H92" stroke="#DBDCDC" stroke-dasharray="2 2" fill="none"/>' +
    /* the two verticals between the glyph and the plate — down, then up */
    '<g fill="var(--bg-quaternary)">' +
      '<path transform="translate(42,111)" d="M2.887 26L5.774 21H0L2.887 26ZM2.887 0H2.387V21.5H2.887H3.387V0H2.887Z"/>' +
      '<path transform="translate(50,111)" d="M2.887 0L0 5H5.774L2.887 0ZM2.387 27V27.5H3.387V27H2.887H2.387ZM2.887 4.5H2.387V27H2.887H3.387V4.5H2.887Z"/>' +
      /* and the elbow out to the deck */
      '<path transform="translate(46,72)" d="M45 2.887L40 0V5.774L45 2.887ZM0 15.887L0 16.387H1L1 15.887H0.5H0ZM0.5 2.887L0.5 2.387H0L0 2.887L0.5 2.887ZM40.5 2.887V2.387L0.5 2.387L0.5 2.887L0.5 3.387L40.5 3.387V2.887ZM0.5 2.887L0 2.887L0 15.887H0.5H1L1 2.887L0.5 2.887Z"/>' +
    '</g>' +
  '</svg>';

/* The glyph as the design draws it: a --neutral-300 tile with the mark knocked
   OUT, so what shows through the P is the head's own grey rather than a painted
   light shape. PAI_ART is already one evenodd path doing exactly that. */
const paiFlat = () => '<span class="paiflat" aria-hidden="true">' +
  '<svg viewBox="0 0 512 512">' + PAI_ART + '</svg></span>';

const pile = w => '<div class="pile deckbox">' +
                  '<span class="p2">' + pic(w, pad(w.s[2])) + '</span>' +
                  '<span class="p1">' + pic(w, pad(w.s[1])) + '</span>' +
                  '<span class="front">' + pic(w, pad(w.s[0])) + '</span></div>';

const meta = w => [w.branch === "schedule" ? "On a schedule" : "Watch for new records",
                   w.how, w.preset].filter(Boolean).join(" · ");

const menu = w => '<div class="dropdown-container card-menu">' +
    '<button class="button-style button-small button-tertiary icon-only" type="button"' +
      ' aria-haspopup="menu" aria-expanded="false" aria-label="More actions"' +
      ' data-menu="' + w.id + '"><i class="ph ph-dots-three"></i></button>' +
    '<div class="dropdown-menu-style dropdown-menu-bottom-right is-closed" role="menu"' +
      ' data-menu-for="' + w.id + '"><div class="dropdown-items-list">' +
      '<button class="dropdown-item-style" type="button" role="menuitem">' +
        '<span class="dropdown-item-icon"><i class="ph ph-pencil-simple"></i></span>' +
        '<span class="dropdown-item-label">Edit</span></button>' +
      '<button class="dropdown-item-style" type="button" role="menuitem">' +
        '<span class="dropdown-item-icon"><i class="ph ph-pause"></i></span>' +
        '<span class="dropdown-item-label">Pause</span></button>' +
      '<hr class="pai-divider" />' +
      '<button class="dropdown-item-style dropdown-item-danger" type="button" role="menuitem">' +
        '<span class="dropdown-item-icon"><i class="ph ph-trash"></i></span>' +
        '<span class="dropdown-item-label">Delete</span></button>' +
    '</div></div></div>';

const hr = () => '<hr class="pai-divider pai-divider-bleed" />';
const name = w => '<span class="cname text-heading-base">' + esc(w.template) + ' &middot; ' + esc(w.connector) + '</span>';
const titleRow = w => '<div class="ctitle">' + name(w) + menu(w) + '</div>';
const line = w => '<p class="cmeta text-body-base-regular">' + esc(meta(w)) + '</p>';
const count = w => '<a class="pai-link text-body-base-medium atom" href="#">See all ' + w.decks +
                   ' decks<i class="ph ph-arrow-right"></i></a>';
const factLab = l => '<span class="lab text-body-sm-regular">' + esc(l) + '</span>';
const factVal = v => '<span class="val text-body-base-medium">' + esc(v) + '</span>';
const srow = (l, v) => '<div class="srow">' + factLab(l) + factVal(v) + '</div>';
const spec = w => '<div class="cspec">' + hr() + srow("Last run", fmt(w.last)) +
                  hr() + srow("Next run", fmt(w.next)) + hr() + '</div>';


/* ONE CARD, SIXTEEN DRAWINGS. Two things differ between one card and another:
   data-kind, which picks the variant, and data-branch, which the workflow's own
   record supplies. The drawing function is handed both. */
const cardHTML = (w, kind) => '<article class="pai-surface-card card v1">' +
    '<div class="head">' +
      '<svg class="lw" data-kind="' + kind + '" data-branch="' + w.branch + '" aria-hidden="true"></svg>' +
      tile(w.connector) + pile(w) +
    '</div>' +
    '<div class="cbody">' + titleRow(w) + line(w) + spec(w) + '</div>' +
    '<div class="cfoot">' + count(w) + '</div>' +
  '</article>';

/* ══════════════════════════════════════════════════════════════════════════════
   THE DRAWING KIT
   ══════════════════════════════════════════════════════════════════════════════
   Everything below is authored in CSS pixels against the head's own box, because
   the viewBox is set to the head's exact fractional width and height — so one
   user unit IS one pixel and a coordinate means what it says.

   HALF-PIXEL SNAPPING ON EVERY STRAIGHT RUN, carried from round 10: a 1px stroke
   centred on an integer coordinate straddles the pixel boundary and renders as
   two half-covered rows of grey, so the centre line goes on k + 0.5. Curves and
   diagonals are not snapped and cannot be — they cross pixel boundaries wherever
   they like, and the antialiasing is what makes them curves.
   ══════════════════════════════════════════════════════════════════════════ */
const S = v => Math.round(v) + 0.5;          /* a 1px stroke's crisp centre line */
const N = v => Math.round(v * 100) / 100;

/* A RUN. data-run is what the check table counts, so no variant can claim a run
   it did not draw. Dotted is 1 on 4 with a round cap: the design system
   publishes no dash vocabulary at all, so both numbers are proposals. */
const run = (d, ink, dotted) =>
  '<path data-run="1" class="' + ink + '" d="' + d + '" fill="none" stroke="currentColor" stroke-width="1"' +
  (dotted ? ' stroke-dasharray="1 4" stroke-linecap="round"' : '') + ' />';

/* ══ THE PAI GLYPH ═══════════════════════════════════════════════════════════
   assets/pai-glyph-SOLID.svg: the rounded tile as the outer subpath and the two
   glyph shapes as inner subpaths of ONE path, with fill-rule="evenodd", so the
   P is knocked OUT of the tile rather than drawn on it. No <mask>, and so no
   ids to collide when this is inlined once per card across forty-eight of them.
   The cut-out is genuinely transparent: whatever a run passes behind shows
   through the P rather than being covered by a white plate.

   Replaces the outline form. Two consequences worth knowing. The box is now
   SQUARE — asked for at 16 it draws 16 by 16, where the outline drew 16 by
   13.2 — so drawn and nominal are the same number for the first time. And it
   carries far more ink at the same token, because a filled tile is not a thin
   shape.

   16px IS --icon-sm, and it is the one number in this round's drawing kit that
   the design system publishes. The testbench puts the floor at 14 and calls 16
   comfortable; nothing here goes below 16. */
const PAI_ART =
  '<path fill="currentColor" fill-rule="evenodd" d="M99.9024,0 H412.0976 A99.9024,99.9024 0 0 1 512,99.9024 V412.0976 A99.9024,99.9024 0 0 1 412.0976,512 H99.9024 A99.9024,99.9024 0 0 1 0,412.0976 V99.9024 A99.9024,99.9024 0 0 1 99.9024,0 Z M317.951 105.943L170.994 140.626C155.011 144.394 142.045 159.692 142.045 174.784V303.871C142.045 303.871 142.085 303.196 142.472 302.184C143.286 300.056 145.679 296.41 152.588 294.291C152.727 294.254 152.866 294.216 153.005 294.179L160.54 292.388L183.92 286.82L329.765 252.399C362.556 244.666 385.558 239.104 385.558 207.186L385.558 127.436L385.558 127.352V126.104C385.558 92.6769 352.3 97.8345 317.951 105.943Z M249.211 297.712L156.12 319.846C148.061 321.76 141.523 329.532 141.523 337.199V385.257C141.523 387.904 142.302 390.194 143.655 391.979C146.22 395.362 150.844 396.929 156.12 395.676L249.722 373.418C257.682 371.528 264.157 363.924 264.316 356.351C264.318 356.256 264.319 356.161 264.319 356.066V294.122L249.211 297.712Z"/>';
const GS = 16;                                /* --icon-sm */
const glyph = (x, y, ink, s) => {
  s = s || GS;
  return '<svg data-orn="glyph" data-glyph="1" class="' + ink + '" x="' + N(x - s / 2) + '" y="' + N(y - s / 2) +
    '" width="' + s + '" height="' + s + '" viewBox="0 0 512 512">' + PAI_ART + '</svg>';
};

/* THE ORNAMENTS. Round 10's vocabulary, unchanged, plus the glyph and one new
   container. Each shape means a different thing, and this round splits the
   vocabulary along the branch as well:
     dot      a small filled circle — a stop on a run, or a run meeting a run
     ring     a hollow circle — an interchange, or where a run arrives
     diamond  a hollow diamond — a waypoint a run passes
     square   a small filled square — where a run terminates
     port     a rounded square with a dot in it — an origin
     well     a rounded square with the GLYPH in it — the node given a station
     tick     a short stroke across a run — registration
     ellipse  a filled ellipse sitting ON an axis, at a crossing
     glyph    the PAI node itself
   SCHEDULE PREFERS tick, dot, diamond and ellipse, because all four repeat at a
   pitch. WATCH PREFERS square, port and ring, because all three mark a single
   point where something began or stopped. */
const oDot = (x, y, r, ink) =>
  '<circle data-orn="dot" class="' + ink + '" cx="' + N(x) + '" cy="' + N(y) + '" r="' + r + '" fill="currentColor"/>';
const oRing = (x, y, r, ink) =>
  '<circle data-orn="ring" class="' + ink + '" cx="' + S(x) + '" cy="' + S(y) + '" r="' + r +
  '" fill="none" stroke="currentColor" stroke-width="1"/>';
const oDiamond = (x, y, r, ink) =>
  '<path data-orn="diamond" class="' + ink + '" d="M' + S(x) + ' ' + N(S(y) - r) + 'L' + N(S(x) + r) + ' ' + S(y) +
  'L' + S(x) + ' ' + N(S(y) + r) + 'L' + N(S(x) - r) + ' ' + S(y) + 'Z" fill="none" stroke="currentColor" stroke-width="1"/>';
const oSquare = (x, y, s, ink) =>
  '<rect data-orn="square" class="' + ink + '" x="' + N(Math.round(x) - s / 2) + '" y="' + N(Math.round(y) - s / 2) +
  '" width="' + s + '" height="' + s + '" fill="currentColor"/>';
const oPort = (x, y, ink) =>
  '<g data-orn="port" class="' + ink + '">' +
  '<rect x="' + N(S(x) - 7) + '" y="' + N(S(y) - 7) + '" width="14" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>' +
  '<circle cx="' + Math.round(x) + '" cy="' + Math.round(y) + '" r="2.25" fill="currentColor"/></g>';
/* THE WELL — 32 square, not 24. At 24 it left four pixels of air around a 16px
   glyph, which was right while the glyph was an OUTLINE and wrong the moment it
   became a filled tile: two rounded rectangles four pixels apart read as one
   double border, and the well stopped saying anything the glyph was not already
   saying. At 32 there are eight pixels of ground on every side and the glyph
   sits IN something. rx borrows --rounded-md, which the system calls floating
   chrome — the nearest published claim to "a station on a run", and named as a
   borrow rather than a fact. */
const oWell = (x, y, ink) =>
  '<rect data-orn="well" class="' + ink + '" x="' + N(S(x) - 16) + '" y="' + N(S(y) - 16) +
  '" width="32" height="32" rx="8" fill="none" stroke="currentColor" stroke-width="1"/>';
const oTick = (x, y, dx, dy, len, ink) => {
  const m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
  return '<path data-orn="tick" class="' + ink + '" d="M' + N(x - nx * len / 2) + ' ' + N(y - ny * len / 2) +
    'L' + N(x + nx * len / 2) + ' ' + N(y + ny * len / 2) + '" fill="none" stroke="currentColor" stroke-width="1"/>';
};
/* AN ARROWHEAD. H21 and H22 asked for arrows and the kit had none — every
   ornament it published was a terminus that says STOPS HERE (dot, diamond,
   square) and none of them says WHICH WAY. Two strokes meeting at the point,
   never a filled triangle: a solid head at this scale is a blob, and the runs
   it terminates are 1px. `dir` is the unit vector the run arrives along. */
const AH = 4.5;
const oArrow = (x, y, dx, dy, ink) => {
  const m = Math.hypot(dx, dy) || 1, ux = dx / m, uy = dy / m;
  const px = -uy, py = ux;                      /* the perpendicular */
  const bx = x - ux * AH, by = y - uy * AH;     /* back from the point */
  return '<path data-orn="arrow" class="' + ink + '" d="M' + N(bx + px * AH * 0.62) + ' ' +
    N(by + py * AH * 0.62) + 'L' + N(x) + ' ' + N(y) + 'L' + N(bx - px * AH * 0.62) + ' ' +
    N(by - py * AH * 0.62) + '" fill="none" stroke="currentColor" stroke-width="1" ' +
    'stroke-linecap="round" stroke-linejoin="round"/>';
};

const oEllipse = (x, y, rx, ry, ink) =>
  '<ellipse data-orn="ellipse" class="' + ink + '" cx="' + N(x) + '" cy="' + S(y) + '" rx="' + rx +
  '" ry="' + ry + '" fill="currentColor"/>';

/* AN ORTHOGONAL RUN WITH RADIUSED CORNERS. The turn is a quadratic whose control
   point is the corner itself, which is what every diagram tool draws and is
   visually indistinguishable from an arc at these radii. The radius is clamped
   to half the shorter of the two legs, so a short leg tightens its own corner
   rather than overshooting into the next one. */
const ortho = (pts, r) => {
  const P = pts.map(p => [S(p[0]), S(p[1])]);
  let d = "M" + P[0][0] + " " + P[0][1];
  for (let i = 1; i < P.length - 1; i++) {
    const [ax, ay] = P[i - 1], [cx, cy] = P[i], [bx, by] = P[i + 1];
    const inLen  = Math.abs(cx - ax) + Math.abs(cy - ay);
    const outLen = Math.abs(bx - cx) + Math.abs(by - cy);
    const rr = Math.max(0, Math.min(r, inLen / 2, outLen / 2));
    const s1x = Math.sign(cx - ax), s1y = Math.sign(cy - ay);
    const s2x = Math.sign(bx - cx), s2y = Math.sign(by - cy);
    d += "L" + N(cx - s1x * rr) + " " + N(cy - s1y * rr);
    d += "Q" + cx + " " + cy + " " + N(cx + s2x * rr) + " " + N(cy + s2y * rr);
  }
  const L = P[P.length - 1];
  return d + "L" + L[0] + " " + L[1];
};

/* A SAMPLED CURVE. Every wave, ellipse, arc and strand below is a polyline of
   points two pixels apart. At a 1px stroke that is smooth, and it means one
   function can ask any curve where it is and which way it is going. */
const poly = pts => pts.map((p, i) => (i ? "L" : "M") + N(p[0]) + " " + N(p[1])).join("");

const sinePts = (y0, amp, lam, phase, x0, x1) => {
  const out = [];
  for (let x = x0; x <= x1 + 0.01; x += 2) out.push([x, y0 + amp * Math.sin((x - phase) * 2 * Math.PI / lam)]);
  return out;
};
const ellPt = (c, rx, ry, rot, t) => {
  const a = rot * Math.PI / 180, ct = Math.cos(t), st = Math.sin(t);
  const x = rx * ct, y = ry * st;
  return [c[0] + x * Math.cos(a) - y * Math.sin(a), c[1] + x * Math.sin(a) + y * Math.cos(a)];
};
const ellPts = (c, rx, ry, rot, t0, t1) => {
  const out = [], steps = 240;
  for (let i = 0; i <= steps; i++) out.push(ellPt(c, rx, ry, rot, (t0 + (t1 - t0) * i / steps) * Math.PI / 180));
  return out;
};
const bez = (p0, p1, p2, p3, t) => {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, cc = 3 * u * t * t, d = t * t * t;
  return [a * p0[0] + b * p1[0] + cc * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + cc * p2[1] + d * p3[1]];
};
const bezPts = (p0, p1, p2, p3) => {
  const out = [], steps = 90;
  for (let i = 0; i <= steps; i++) out.push(bez(p0, p1, p2, p3, i / steps));
  return out;
};

/* IS THIS POINT ON OPEN GROUND, OR IS IT BEHIND SOMETHING? Every ornament placed
   by search below asks this rather than taking a number typed here, because the
   answer changes with the card's width. It is also how the round stays honest
   about what the deck eats: a symmetric drawing keeps both of its ornaments and
   only one of them is visible. */
const openAt = (g, p) =>
  p[0] >= 2 && p[0] <= g.W - 2 && p[1] >= 2 && p[1] <= g.H - 2 &&
  !(p[0] > g.p.x - 1 && p[0] < g.p.r + 1 && p[1] > g.p.y - 1 && p[1] < g.p.b + 1) &&
  !(p[0] > g.t.x - 2 && p[0] < g.t.r + 2 && p[1] > g.t.y - 2 && p[1] < g.t.b + 2);

const visibleRuns = (g, pts) => {
  const segs = []; let cur = null;
  pts.forEach((p, i) => {
    if (openAt(g, p)) { if (!cur) { cur = [i, i]; segs.push(cur); } else cur[1] = i; }
    else cur = null;
  });
  return segs.sort((a, b) => (b[1] - b[0]) - (a[1] - a[0]));
};
const spread = (seg, n) => {
  const out = [];
  for (let i = 1; i <= n; i++) out.push(Math.round(seg[0] + (seg[1] - seg[0]) * i / (n + 1)));
  return out;
};
const tangentAt = (pts, i) => {
  const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
  return [b[0] - a[0], b[1] - a[1]];
};

/* ══════════════════════════════════════════════════════════════════════════════
   THE EIGHT DRAWINGS
   ══════════════════════════════════════════════════════════════════════════════
   Every function takes the head's laid-out geometry and a boolean: is this card
   a schedule. The two branches share whatever is common between them and part
   where the meaning parts, and the write-up beside each one says how far apart
   they were allowed to get.
   ══════════════════════════════════════════════════════════════════════════ */
const LW = {};

/* ── 01 · THE ELBOW ─────────────────────────────────────── ROUTED · 3 runs ──
   Round 10's 01 given a middle. The run comes OUT of the logo — up the open
   column — turns at the node, and leaves right into the deck. The node is the
   corner, which is the one point on a routed path where a direction is decided,
   and that is exactly what routing via a template is.
   THE GLYPH IS ALONE, WITH NO CONTAINER, AND THE RUN BREAKS FOR IT. Round 10
   found a hollow ring and a filled dot at one token are not on the same footing
   because the eye counts ink; a glyph inside a ring is two marks fighting. Here
   there is one mark, and the four pixels of gap on each side are what say the
   run passes through rather than behind.
   SCHEDULE: a third arm leaves the node to the LEFT and runs off the card, so
   the line is through-running — it was going before this workflow and goes after
   — and three ticks at even pitch ride the stretch between the logo and the node.
   WATCH: no left arm at all. One diagonal spur arrives from a PORT, which is
   round 10's origin ornament, and joins the run below the node. One record, once,
   from somewhere, at an angle nothing else on the card takes. */

/* ── 02 · THE INTERCHANGE ───────────────────────────────── ROUTED · 4 runs ──
   Round 10's 02, whose whole argument is that lines CROSS WITHOUT CONNECTING —
   a diagram joins every crossing and a map does not. This round gives that
   argument its exception: the glyph is the one place two runs actually meet.
   A vertical rises out of the logo and leaves the top of the card. A short
   horizontal stub leaves it at a filled dot — a T-junction, round 10's junction
   ornament — and arrives at the glyph; another leaves the glyph for the deck.
   SCHEDULE: a second horizontal in --border-secondary runs the card's full width
   and CROSSES the vertical without joining it, carrying three small dots at an
   even pitch of sixty pixels across the top band, where there is room for a
   rhythm to be seen.
   WATCH: no second horizontal. A diagonal climbs from a HOLLOW RING in the lower
   left — where the record arrived — crosses the vertical without joining it, and
   ends on the glyph. Same grammar, one arrival instead of a grid.
   THE GLYPH TAKES --text-tertiary HERE, a step darker than the runs, which is
   one of the two places this round tests whether a node has to out-ink its line. */

/* ── 03 · THE WELL ──────────────────────────────────────── ROUTED · 6 runs ──
   Round 10's 03, whose origin was a PORT — a rounded square with a dot in it.
   Here the dot is the glyph and the port becomes a WELL: the node given a
   station, opened to twenty-four square so a sixteen-pixel glyph keeps four
   pixels of air on every side. It is the busiest node treatment in the file and
   the write-up says what that costs.
   SCHEDULE: the trunk runs THROUGH the well and off both edges, and three
   DOTTED spurs at an even pitch of twelve fall out of its left arm and off the
   head's foot — three runs that have not happened yet, evenly spaced, two of
   them passing behind the logo on the way down. Dotted because a dash that meets
   a picture edge loses a dot rather than a line, which is round 10's finding and
   is exactly what a future run should look like.
   WATCH: no left arm and no dotted spurs. One SOLID spur drops and stops at a
   hollow diamond — a waypoint it passed, and then nothing. */
/* H21 · H22 · THE ARROWS. The drawing says which way the data moves and stops
   saying anything else. Two shapes, one per branch, and they differ in exactly
   the way the branches do:

     SCHEDULE   the app asks, the CRM answers, the app makes the deck.
                PAI out to the connector on the upper lane, connector back to
                PAI on the lower one, then PAI east to the pile. Two lanes so
                the opposing heads never meet — ratified at the review.
     WATCH      the CRM starts it. One direction throughout: connector to PAI,
                PAI to the pile. No return leg, because nothing was asked for.

   The well is gone. It was a container drawn round the glyph and, with arrows
   arriving at the glyph from two sides, it became a box the arrows had to stop
   short of rather than a station they passed through. The ruler and the diamond
   spur go with it: both were motifs of TIME, and the arrows are about ROUTE.

   H23 · dotted rules run the width of the head in the bands the arrows leave
   empty, behind everything, at ink-b. Decoration that says "this is a diagram"
   without claiming a path — dotted so it can never be mistaken for a run. */
LW["03"] = (g, sch) => {
  /* THE BOXES THIS ROUTES BETWEEN, measured rather than assumed: the head is
     383x196, the connector tile sits at the FOOT (x 16-80, y 116-180) because
     the head is align-items:flex-end, and the pile starts at x 96 with its top
     at y 78. The first attempt drew the arrows in the open band across the top
     and every head pointed at nothing, because the tile is not up there.

     So the glyph takes the open ground directly ABOVE the tile, and every
     arrowhead lands on a real edge: the tile's top, or the pile's top. */
  const gx = g.t.cx, gy = 46, out = [];
  const HALF = GS / 2;                          /* the glyph's own 16px box */
  const down = gx - 16, up = gx + 16;           /* the two lanes, either side */
  const deckX = g.p.x + 54;                     /* where the run turns down into the deck */

  /* H23 · dotted rules, first, so everything else paints over them. Two bands
     that no run occupies: above the deck run, and under the tile. */
  out.push(run("M0 " + S(14) + "L" + N(g.W) + " " + S(14), "ink-b", true));
  out.push(run("M0 " + S(g.H - 8) + "L" + N(g.W) + " " + S(g.H - 8), "ink-b", true));

  if (sch) {
    /* PAI asks. Out of the glyph's lower left, down the left lane, into the
       tile's top edge. */
    out.push(run(ortho([[gx - HALF + 1, gy + 6], [down, gy + 6], [down, g.t.y - 8]], 6), "ink-a"));
    out.push(oArrow(down, g.t.y - 4, 0, 1, "ink-a"));
  }

  /* The connector answers — and on a watch branch this is the only thing that
     happens, because nothing was asked for. Up the right lane, then left into
     the glyph's right edge. */
  out.push(run(ortho([[up, g.t.y - 4], [up, gy], [gx + HALF + 3, gy]], 6), "ink-a"));
  out.push(oArrow(gx + HALF + 1, gy, -1, 0, "ink-a"));

  /* And out to the deck, on both branches. Up out of the glyph, east above the
     pile, then down into its top edge — the one place an arrowhead can land on
     the deck rather than beside it. */
  out.push(run(ortho([[gx, gy - HALF - 1], [gx, 26], [deckX, 26], [deckX, g.p.y - 8]], 8), "ink-a"));
  out.push(oArrow(deckX, g.p.y - 4, 0, 1, "ink-a"));

  out.push(glyph(gx, gy, "ink-a"));
  return out.join("");
};

LW["03-old"] = (g, sch) => {
  const nx = g.t.cx, ny = 46, out = [];   /* 46, not 44: the well grew by 8 */
  out.push(run(ortho([[nx, g.t.y + 12], [nx, ny + 14]], 0), "ink-a"));        /* out of the logo, up into the well */
  out.push(run(ortho([[nx + 18, ny], [g.W, ny]], 0), "ink-a"));               /* out of the well to the deck */
  if (sch) {
    /* D4 · A MOTIF OF TIME, and the routed family's own is a measured scale.
       The run west of the well is graduated: a tick every 10px, and every third
       one twice as long, which is how a ruler, a timeline and a tape all say
       "these intervals are equal". Three dotted spurs dropping to the card's
       foot said repetition but not measurement — three of anything is a rhythm,
       and a rhythm is not yet a unit.

       Static, as asked. Nothing counts, nothing is derived from the cadence and
       nothing moves: the scale means REGULAR, not "every week", and a scale
       that tried to say which interval would be a chart nobody could read at
       10px. The tick that would land under the well is skipped rather than
       drawn behind it. */
    out.push(run(ortho([[nx - 18, ny], [0, ny]], 0), "ink-a"));               /* and off the left edge */
    for (let x = nx - 28, i = 1; x > 4; x -= 10, i++) {
      out.push(oTick(x, ny, 1, 0, i % 3 === 0 ? 9 : 4.5, "ink-a"));
    }
  } else {
    out.push(run(ortho([[nx - 18, ny], [22, ny], [22, 86]], 8), "ink-a"));
    out.push(oDiamond(22, 92, 4.5, "ink-a"));
  }
  out.push(oWell(nx, ny, "ink-a"));
  out.push(glyph(nx, ny, "ink-a"));
  return out.join("");
};

/* ── 04 · THE CHAIN ────────────────────────────────────── ORBITAL · 3 runs ──
   Round 10's 04. Tall loops in a row, each taller than the head so all of them
   run off the foot, each cresting in the sixteen-pixel band above the pile. The
   loops pass behind the logo on their way down, which is what ties them to it.
   THE GLYPH RIDES A CREST, the way round 10's dots did — a node labelled on the
   curve rather than beside it — and it takes the last crest that is on open
   ground, at x = 60, because the crest after it is over the deck's lane and a
   glyph there would be flush against the pile's top edge.
   SCHEDULE: THREE loops at one pitch, and repetition is the entire drawing.
   Four hollow diamonds where loop crosses loop, two filled dots on the crests
   the glyph does not take.
   WATCH: ONE loop. A spur enters from off the left edge and stops dead at a
   filled square where it meets the orbit. One record came in, one orbit ran. */

/* ── 05 · THE RULER ─────────────────────────────────────── ROUTED · 2 runs ──
   The one variant that puts its main run in the top band, which is the card's
   only lane that is open edge to edge — and the only place a rhythm of fifteen
   marks can actually be counted. A vertical rises out of the logo to meet it.
   THE GLYPH HANGS BELOW THE RUN ON A DROP TICK RATHER THAN SITTING ON IT, and
   that is the variation this variant exists to test. It is the weakest of the
   eight at reading as IN, THROUGH, OUT — the run passes clean over the node and
   the node only points at it — and the write-up says so rather than claiming
   otherwise. What it buys is that the node never interrupts the rhythm.
   SCHEDULE: ticks at an even pitch of twenty-four across the whole width, every
   third one long. A ruler is the plainest picture of "you know when" there is.
   WATCH: the ruler is bare, and the left end STOPS at a filled square instead of
   running off the card. One long tick with three short ones crowding it, between
   the logo and the node — one event, and nothing before or after it. */

/* ── 06 · THE FAN ───────────────────────────────────────── STRAND · 5 runs ──
   Round 10's 08, and round 10 called it the only drawing in that file that said
   something rather than decorating: strands pinch to a point and bloom apart, so
   read left to right it is ONE CONNECTOR FEEDING MANY DECKS. This round replaces
   the filled node at the pinch WITH THE GLYPH, which is the single most direct
   answer to the ask — the strands do not pass a node, they come out of it.
   THE GLYPH SITS ON THE LOGO'S CROWN, two pixels above the tile, so the two are
   read side by side and "much smaller" is settled by looking rather than by a
   number: sixteen against forty-eight, and grey against a brand hue.
   SCHEDULE: FOUR strands at an even angular spread, each carrying a dot at a
   common radius of forty from the pinch — round 10's correction, because dots
   placed at the deck's edge all landed within seven pixels of one another and
   read as one smudge. A fifth run enters the glyph from off the left edge.
   WATCH: ONE strand out, and one short arc curling back to a filled square in
   the left column. One record in, one deck out, and nothing continuing.
   THE GLYPH TAKES --text-tertiary HERE, the second of the two darker tests. */

/* ── 07 · THE RETURN ────────────────────────────────────── ROUTED · 3 runs ──
   The variant that draws the schedule's defining property directly: A SCHEDULE
   COMES BACK. The run leaves the node, leaves the card at the right edge, and
   RE-ENTERS at the left edge lower down, climbs, and arrives back at the node.
   The circuit closes off the card, which is the only honest place to close it —
   the next run is not on this card, it is next Tuesday.
   THE GLYPH SITS INSIDE A HAIRLINE RING, and this is the treatment round 10's
   finding says should be worst: a hollow ring and a filled shape at one token
   are two marks fighting, and the eye counts ink. It is drawn anyway because the
   finding was about a ring and a DOT, and a glyph is a shape with a silhouette
   rather than a blob — whether that changes the answer is the question, and the
   write-up reports what looking said.
   WATCH: no return. The out-run STOPS at a filled square in the right band
   instead of leaving the card. It ran once and it is waiting. */

/* ── 08 · THE PULSE ───────────────────────────────────────── WAVE · 4 runs ──
   The variant where the two branches are PLAINLY DIFFERENT OBJECTS rather than
   the same object counted twice, and it is the round's answer to "make them
   different" taken as far as it goes.
   Both draw a horizontal axis that BREAKS FOR THE GLYPH, so the node is a point
   on the axis rather than a thing beside it, and both dip into the logo.
   SCHEDULE: a SINE rides the axis — trough behind the logo, up through the node,
   crest breaking the surface above the deck — with a second, half-wavelength
   ripple in --border-secondary under it, and filled ellipses on the axis at
   every crossing. It repeats forever in both directions and that is the point.
   WATCH: the axis is FLAT. One dip departs it, goes behind the logo, and comes
   back up to the node. A single event on a straight line. Nothing about the two
   pictures is the same object at a different count — one is a wave and the other
   is a line with something that happened on it. */

/* ══ PAINTING ════════════════════════════════════════════════════════════════
   Every drawing is generated from the head's laid-out box rather than from
   numbers typed above it, because the card's width changes with the shelf and
   the grid, and a path authored against a guessed width lands somewhere else.
   A ResizeObserver repaints on every change, which also covers the squeeze the
   fit measurement at the foot of this file performs. */
function geom(head) {
  const hb = head.getBoundingClientRect();
  if (!hb.width) return null;
  const R = el => {
    const b = el.getBoundingClientRect();
    return { x: b.left - hb.left, y: b.top - hb.top, w: b.width, h: b.height,
             r: b.right - hb.left, b: b.bottom - hb.top,
             cx: b.left - hb.left + b.width / 2, cy: b.top - hb.top + b.height / 2 };
  };
  return { W: hb.width, H: hb.height, t: R(head.querySelector(".tile")), p: R(head.querySelector(".pile")) };
}

function paint(svg) {
  if (typeof LW[svg.dataset.kind] !== "function") return;   /* M3 */
  const g = geom(svg.parentElement);
  if (!g) return;
  svg.setAttribute("viewBox", "0 0 " + N(g.W) + " " + N(g.H));
  svg.innerHTML = LW[svg.dataset.kind](g, svg.dataset.branch === "schedule");
}




/* The schedule line, and it is NOT always three parts. A watch workflow has no
   cadence, and a workflow made without a preset has no preset — verdict.json's
   not_checked carries the second one, and nothing scores either. Built from the
   parts that exist rather than by joining three fields, so a missing one leaves
   a shorter line and never a dangling separator. */
/* E3 · ONE fact, not three. It read "On a schedule • Every week • Account 360
   / QBR", and each part was already answered somewhere else on the card or was
   not true of every workflow.

   The branch is said by "Every week" and by "Watch for new leads" — a cadence
   IS a schedule and a watch IS a trigger, so naming the kind first was the
   sentence clearing its throat. And the preset is a STARTING POINT for the
   table selection, not a property of the workflow: a workflow can be made
   without one, the tables can be changed afterwards so it stops being true,
   and a watch workflow has no table picker for it to apply to at all. */
/* H19 · the subtitle carries the last run, and the spec block is gone.
   Two labelled rows under every card said Last run and Next run at the same
   weight as each other and nearly the weight of the title, which is what made
   six cards read as busy. Next run is the one a person can work out — it is the
   cadence applied to the last run — so it is the one that goes.

   The card's own settled time format is kept, and only the leading word is
   lowered, because it is mid-sentence now rather than starting a cell: "Every
   week · Last run today, 6am". A watch workflow has no cadence to lead with, so
   its subtitle is the run alone. */
function metaLine(w) {
  const last = "Last run " + fmt(w.last).replace(/^(Today|Tomorrow|Yesterday),/,
                                                 (m) => m.toLowerCase());
  /* M6 · a bullet, not a middot — the design sets U+2022. */
  return w.branch === "watch" ? last : w.how + " \u2022 " + last;
}

/* R2 · the shelf. `openMenu` is the id of the row whose menu is showing.

   V6 · one workflow is a ROW ITEM: the deck's picture on the left, and to its
   right two groups — what it is, then how it is doing — with the row's menu at
   the far end. Two per grid row, unchanged. The three-slide strip is gone; one
   picture per workflow, which is also what V4 will compose the confirmation
   card from. w.s keeps all three slide numbers because they record which slides
   of the deck were picked; the row shows the first. */
function shelfHTML(list, state, openMenu) {
  return list.map(w =>
    '<article class="pai-surface-card card v1" tabindex="0" role="button"' +
      ' data-open-panel="' + w.id + '"' +
      ' aria-label="Change ' + esc(w.template) + '"' +
      ' data-annotate-id="card-' + state + '-' + w.id + '">' +
      '<div class="head" data-annotate-id="deck-' + state + '-' + w.id + '">' +
        FIGLINES + tile(w.connector) + paiFlat() + pile(w) +
      '</div>' +
      '<div class="cbody">' +
        '<div class="ctitle">' +
          /* D3 · the template alone. The connector is already on the card —
             its logo is the tile in the head, at 48px in its own colour — so
             naming it in the title says it twice, and the title is the one
             place the person is looking for what this workflow MAKES. */
          '<span class="cname text-body-base-medium">' + esc(w.template) + '</span>' +
          (w.isNew ? '<span class="pai-badge pai-badge-medium pai-badge-info">New</span>' : "") +
          menuHTML(w, w.id === openMenu) +
        '</div>' +
        '<p class="cmeta text-body-sm-regular">' + esc(metaLine(w)) + '</p>' +
        (w.isNew                                      /* R17 · R18 · R19 */
          ? '<div class="conf" data-annotate-id="confirmation-note">' +
            '<i class="ph ph-check-circle pai-icon pai-icon-sm"></i>' +
            '<p class="text-body-base-regular">' + esc(CONFIRMATION) + '</p></div>'
          : "") +
      /* H19 · spec() is gone from the row. H20 · so is the footer — the whole
         card opens the panel now, and the panel carries the way to the decks. */
      '</div>' +
    '</article>').join("");
}

/* The card is painted after layout, because paint() reads the head's rendered
   box to set the viewBox — one user unit is one CSS pixel only if the two
   agree. And again on resize, for the same reason. */
function paintShelf() {
  document.querySelectorAll(".lw").forEach(paint);
  document.querySelectorAll(".figlines").forEach(paintFigLines);   /* P4 */
}
const CARD_RO = new ResizeObserver(es => es.forEach(e => {
  const svg = e.target.querySelector(".lw");
  if (svg) paint(svg);
  const fig = e.target.querySelector(".figlines");                 /* P4 */
  if (fig) paintFigLines(fig);
}));
function observeCards() {
  document.querySelectorAll(".v1 .head").forEach(h => CARD_RO.observe(h));
}

/* A11 · A12 · one of N as chips. The presets above use the same component;
   this is the same question asked about a shorter list, so it is drawn the
   same way. Real radios underneath, because a group of buttons is not a value
   a keyboard or a screen reader can reach — DESIGN.md §7. */
function pickChipsHTML(options, checked, name, label) {
  return '<div class="chips" role="radiogroup" aria-label="' + esc(label) + '">' + options.map((o, i) =>
    '<label class="chip-style chip-medium chip-default chip-pick' + (i === checked ? " is-selected" : "") + '">' +
      '<input type="radio" name="' + name + '"' + (i === checked ? " checked" : "") + ' />' +
      '<span>' + esc(o) + '</span>' +
    '</label>').join("") + '</div>';
}

function chipsHTML(selected, name) {
  return '<div class="chips" role="group" aria-label="Start from a preset">' + PRESETS.map(p =>
    '<button class="chip-style chip-small chip-default' + (p === selected ? " is-selected" : "") + '"' +
    ' type="button" data-chip="' + name + '">' + esc(p) + '</button>').join("") + '</div>';
}

/* R15 · the seven tables, each with its live record count.
   V2 · `on` is the list of tables the workflow being shown actually pulls.
   null means the running app's own defaults, which is where a workflow nobody
   has made yet starts. */
/* Y1 · TWO columns, and the dot and the unit come back with them.

   Pass 17 read the reference as one column and argued that the row being its own
   container is what let the count sit bare at the far right. That argument was
   right and it is exactly why it does not survive here: at two columns the right
   column's count is nearer the LEFT column's name than its own, which is the
   proximity failure A9 found in the first place. So the count stops being a
   right-aligned value and becomes part of its row's text — "6 records", after a
   dot — which is what V15 drew and what this instruction asks for again.

   Y2 · no group row. The Activity header spanned the full width, which is a
   thing only one column can do. */
function tablesHTML(name, oneCol, on) {
  return '<div class="tables" data-annotate-id="' + name + '-tables">' +
    TABLES.filter(t => t.name).map((t, i) =>
    '<label class="pai-field table-row" for="' + name + '-t' + i + '">' +
      '<input type="checkbox" class="pai-checkbox" id="' + name + '-t' + i + '"' +
        ' data-table="' + esc(t.name) + '"' +
        ((on ? on.indexOf(t.name) !== -1 : t.on) ? " checked" : "") + ' />' +
      '<span class="text-body-base-regular">' + esc(t.name) + '</span>' +
      /* AA3 · the dot is its own element so the space either side of it is one
         value rather than a flex gap on one side and a text space on the other,
         which is what made it sit closer to the count than to the name. */
      '<span class="table-dot" aria-hidden="true">\u2022</span>' +
      '<span class="table-count text-body-base-regular">' + t.n + ' records</span>' +
    '</label>').join("") + '</div>';
}

/* The three watch types as a list of one. `selected` is the one this workflow
   watches; the setup passes null, because R12 says nothing is chosen there. */
/* C12 · chips. The three rows carried a subtitle each and none of them said
   anything the title did not — "A new deck each time a contact is added to
   your CRM" under "New contacts" is the title again, longer. Without the
   subtitles a row is a chip with more furniture, and the branch already asks
   one question, so this is the same component the tables and the cadence use.
   The app's own names are kept on each chip as a title attribute, so the
   product's wording is one hover away rather than deleted. */
/* P3 · IT NEVER MATCHED. A watch workflow's `how` reads "Watch for new leads"
   and a chip reads "New leads", so findIndex compared two strings that are never
   equal, returned -1, and the panel opened with none of the three taken — on a
   workflow that plainly watches something. Nothing errored and the control
   looked like a control nobody had touched yet.

   Compared on the tail now, and case-blind, because the two vocabularies are the
   sentence form and the label form of one fact. */
function watchesHTML(selected) {
  const key = String(selected || "").replace(/^watch for\s+/i, "").toLowerCase();
  const i = WATCHES.findIndex(w => w.chip.toLowerCase() === key);
  return '<div class="chips" role="radiogroup" aria-label="What to watch">' + WATCHES.map((w, k) =>
    '<label class="chip-style chip-medium chip-default chip-pick' + (k === i ? " is-selected" : "") + '"' +
      ' title="' + esc(w.app) + '" data-watch>' +
      '<input type="radio" name="watch"' + (k === i ? " checked" : "") + ' />' +
      '<span>' + esc(w.chip) + '</span>' +
    '</label>').join("") + '</div>';
}

/* One of N mutually exclusive values, on real radios — DESIGN.md §7. */
function switcherHTML(name, label, options, checked, small) {
  return '<div class="pai-switcher pai-switcher-' + (small ? "small" : "medium") + ' pai-switcher-stretch"' +
    ' role="radiogroup" aria-label="' + esc(label) + '">' +
    options.map((o, i) =>
      '<label class="pai-switcher-option"><input type="radio" name="' + name + '"' +
      (i === checked ? " checked" : "") + ' /><span>' + esc(o) + '</span></label>').join("") +
  '</div>';
}

/* ── the two branches ───────────────────────────────────────────────────────
   R11 · same surface, same padding, same width, same depth.
   R12 · both radios unchecked, and nothing inside either branch that the
         person would choose is chosen. The switcher values are the running
         app's own defaults, which a switcher cannot be without.
   R14 · there is no toggle here, and no other screen region has one. */
/* Both value lines are computed from TABLES, so neither can drift from the
   record counts the tables themselves show. WATCH_PULL names Leads, Accounts
   and Contacts, and the watch line is those three added up. */
/* C5 · C8 · a subtitle under a branch title should say what choosing that
   branch will ask you, not a count of something else. Both are read off the
   options the branch actually contains, so neither can drift from them. */
/* V13 · commas, not dots, and sentence case. A list of options is a list, and
   the bullet is a separator for facts that are not one — VOICE's own never is
   about a dash in a badge, not about prose in a subtitle. */
function schedSaid() {
  return CADENCE.map((c, i) => i ? c.toLowerCase() : c).join(", ");
}
function watchSaid() {
  return WATCHES.map((w, i) => i ? w.chip.toLowerCase() : w.chip).join(", ");
}

function branchesHTML() {
  const schedule =
    '<div class="pai-surface-card branch" data-annotate-id="branch-schedule">' +
      '<label class="branch-head">' +
        '<input type="radio" name="branch" class="pai-radio pai-radio-stacked" data-branch="schedule" />' +
        '<span class="grow">' +
          /* Round 4 · the icons go. Eleven of the twelve icons in the pattern
             pull are IDENTITY — a brand logo, or a picture of the thing — and
             exactly one gives an abstract branch a category glyph. They were
             also what threw the alignment off: .pai-radio-stacked's published
             +4px is calibrated to the x-height band, and align-items:center
             put the glyph on the line box, so the radio sat 2px low. */
          '<h3 class="text-heading-base">On a schedule</h3>' +
          /* The prose subtitle is replaced by what this branch would actually
             pull. A subtitle that restates its heading is text nobody reads;
             a count is the one thing the heading cannot say. */
          '<p class="branch-said text-body-base-regular">' + esc(schedSaid()) + '</p>' +
        '</span>' +
      '</label>' +
      '<div class="branch-body"><div class="branch-inner">' +
        /* B12 · one question, not two. A preset IS a set of tables — picking
           one selects them, and picking none and ticking them by hand is the
           same answer arrived at differently. Split into two fields they read
           as two decisions, and the shortcut read as a thing you do BEFORE the
           real work rather than instead of it.

           WHICH tables each preset selects is not drawn, because nobody has
           supplied the mapping. The running app has it — the 25 Aug read shows
           a live reverse-match, "Looks like Account 360 / QBR", appearing as
           tables are ticked — so it exists and was not captured. Wiring a
           guess here would put six invented table-sets on screen looking
           exactly like read ones. */
        /* C11 · still one question, but the two ways into it are named and
           spaced rather than stacked. The line that used to say how they
           relate is gone — a label on each says it, and one fewer line of
           prose is one fewer thing to read. */
        /* V4 · PARTIAL, and the rest is refused — see fixes.json. Naming the source
           here is the part that can be done without undoing anything: R15 asks that
           a person can see what will be pulled, and until now the word Salesforce
           appeared nowhere on this screen. */
        /* Y3 · the table comes first and the presets sit on one line under it,
           as a description rather than a heading. "Presets:" is not a title for
           a section — it labels the row it is on, which is why both sublabels
           could go: the table needs no heading once it is the first thing, and
           the chips need no heading once the word is beside them. */
        /* AA2 · .text-heading-base, the same step the branch title takes. It is a
           question of the same weight as the one the branch itself asks, and at
           the body step it read as a field label under a heading. */
        /* AD1 · Company, required, and no default. It is above the table because
           it decides the table: every count below belongs to one account, and a
           table of counts with no company named is a table of numbers about
           nothing. Nothing is chosen when the setup opens — the same rule R12
           puts on the branches, for the same reason. */
        /* AE2 · no asterisk. No other label on this screen carries one, and a
           marker used once is a convention of one. The field is still required
           and still says so to a screen reader; what holds it visually is the
           finishing control, which names this field while it is empty. */
        '<div class="field"><span class="field-label text-body-base-medium">Select a company' +
            '<span class="pai-sr-only"> (required)</span></span>' +
          '<div class="dropdown-container company" data-annotate-id="company">' +
            '<button class="pai-select-trigger" type="button" data-menu="company"' +
              ' aria-haspopup="menu" aria-expanded="false">' +
              '<i class="ph ph-buildings"></i>' +
              '<span class="pai-select-value" id="company-value">Select a company</span>' +
              '<i class="ph ph-caret-down"></i>' +
            '</button>' +
            '<div class="dropdown-menu-style dropdown-menu-bottom-left company-menu is-closed"' +
              ' role="menu" data-menu-for="company">' +
              '<div class="pai-search company-search"><i class="ph ph-magnifying-glass"></i>' +
                '<input class="pai-input" type="search" placeholder="Search companies" /></div>' +
              '<div class="dropdown-items-list">' +
                COMPANIES.map((c, i) =>
                  '<button class="dropdown-item-style" type="button" role="menuitem"' +
                    ' data-company="' + i + '">' +
                    '<span class="dropdown-item-label">' + esc(c) + '</span>' +
                    '<span class="dropdown-item-check"><i class="ph ph-check"></i></span>' +
                  '</button>').join("") +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        /* AE3 · back to the step every other label takes. AA2 raised this one to
           .text-heading-base two passes ago on the grounds that it asks a question
           of the branch title's weight — but it sits in a column of labels, and
           one label at a different step reads as a section rather than as a peer.
           AE4 · and it says what to do rather than what it is. */
        '<div class="field"><span class="field-label text-body-base-medium">Choose the Salesforce tables to pull</span>' +
          /* Z1 · above the table, under the question. A preset is a shortcut TO
             the selection, so it belongs between the question and the answer
             rather than after it — read downward it now says: which tables, here
             are six ready-made sets, and here is the set you have. */
          '<div class="presetline">' +
            '<span class="presetlabel text-body-base-regular">Presets:</span>' +
            '<div class="presetscroll">' + chipsHTML(null, "s") + '</div>' +
          '</div>' +
          tablesHTML("s", false, null) +
        '</div>' +
        /* A11 · A12 · chips, not switchers. A switcher is a segmented control
           and reads as a view being changed; these are values being chosen,
           and they are the same kind of choice as the presets above them. One
           vocabulary for one kind of question. */
        /* AB3 · stacked, and the cadence first. Y4 paired them because the table
           above is two columns; stacked they read in the order the questions
           actually depend on each other — how often it runs, and then how far
           back each run reaches. The window qualifies the cadence, so it cannot
           come first. */
        '<div class="field"><span class="field-label text-body-base-medium">Decide how often it runs</span>' +
          pickChipsHTML(CADENCE, 1, "s-cad", "How often it runs") + '</div>' +
        '<div class="field"><span class="field-label text-body-base-medium">Pick an activity window</span>' +
          pickChipsHTML(WINDOWS, 1, "s-win", "Activity window") + '</div>' +
      '</div></div>' +
    '</div>';

  const watch =
    '<div class="pai-surface-card branch" data-annotate-id="branch-watch">' +
      '<label class="branch-head">' +
        '<input type="radio" name="branch" class="pai-radio pai-radio-stacked" data-branch="watch" />' +
        '<span class="grow">' +
          /* Renamed from "Watch for new records": the two branch titles now
             answer the same question in the same grammar — when does this
             happen — rather than one naming a schedule and the other naming a
             behaviour. */
          /* V6 · back to R11's own words, settled at the verdict's conflict gate.
             Pass 8 renamed this so both branch titles answered the step's question
             in one grammar; the cost of reverting is that parallel, and the gain
             is that setup, the ratified list and the running app say one thing. */
          '<h3 class="text-heading-base">Watch for new records</h3>' +
          '<p class="branch-said text-body-base-regular">' + esc(watchSaid()) + '</p>' +
        '</span>' +
      '</label>' +
      '<div class="branch-body"><div class="branch-inner">' +
        /* Z4 · the question comes back. B15 dropped it on the grounds that the
           branch title already asked it — the title says WHEN this happens, and
           this asks WHICH records, which is a different question and the only one
           this branch actually puts to you. */
        '<div class="field"><span class="field-label text-body-base-medium">Choose what to watch for</span>' +
          watchesHTML(null) + '</div>' +
        /* A16 · A17 · the two fields that mirrored the schedule branch are
           gone. They were there to answer R15 and R16 in words, and both are
           still answered — "28 records each time" on the branch title is what
           it pulls, and "When a record arrives" is how often it runs. Two
           fields saying it again made the branch look like the other one. */
      '</div></div>' +
    '</div>';

  return schedule + watch;
}

/* R7 · the change surface. It used to carry the same vocabulary as the setup's
   schedule branch — the same chips, the same tables, the same two switchers —
   because what a workflow looks like while you make it and while you manage it
   should be one language.

   THAT IS NO LONGER TRUE, and it is recorded rather than quietly fixed. A11
   and A12 turned the setup's activity window and cadence into chips; the
   annotations were all written on the setup state, so the panel still holds
   switchers for the same two questions. One of the two has to move. */
function panelHTML(w) {
  return '<aside class="panel" aria-label="Change workflow" data-annotate-id="change-panel">' +
    /* H27 · no subtitle. "Changes take effect on the next run" is true of every
       control below it and of nothing in particular, which is a line the eye
       learns to skip on its way to the first field.
       H26 · the dismiss is ghost. Tertiary carries a resting edge, and an edge
       on the one control in a head that is no longer its own surface was the
       last thing making the head look like a bar. */
    '<div class="panel-head">' +
      '<div class="grow">' +
        '<h3 class="text-heading-base">' + esc(w.template) + ' \u2022 ' + esc(w.connector) + '</h3>' +
      '</div>' +
      '<button class="button-style button-small button-ghost icon-only" type="button"' +
        ' aria-label="Close" data-panel-close><i class="ph ph-x"></i></button>' +
    '</div>' +
    /* J2 · THE DECKS COME FIRST. H31 put this at the foot of the form and the
       person called it an afterthought, which it was: a link with nothing above
       it to be the point of. Three covers and then the way to the rest — so the
       panel answers "what has this made" before "what does it do", and the link
       has something to be the tail of.

       The covers are the GENERATED ones, which is what they were made for. A
       workflow's output is a SERIES — the same deck with one thing changed — and
       three unrelated presentations from assets/decks would say the opposite of
       what this section is claiming. Schedule gets three periods, watch gets
       three records. */
    /* Q1 · INSIDE the body, so it scrolls with the form. It was a sibling of the
       body at flex:none, which pinned it: the covers stayed while the fields
       moved under them, and a section that holds its ground while everything
       else scrolls is claiming to be chrome. It is content — the first thing the
       panel says, not a header. */
    '<div class="panel-body" data-annotate-id="change-panel-form">' +
    '<div class="panel-decks" data-annotate-id="panel-decks">' +
      '<div class="decks-row">' + MADE_COVERS[w.branch === "watch" ? "watch" : "schedule"]
        .map(f => '<span class="made"><img src="' + MADEDIR + f + '.jpg" alt="" ' +
                  'width="800" height="450" loading="lazy" /></span>').join("") + '</div>' +
      '<a class="pai-link text-body-base-medium atom" href="#">See all ' + w.decks +
      ' decks<i class="ph ph-arrow-right"></i></a>' +
    '</div>' +
    '<div class="stack-lg">' +
      /* E4b · no preset field on a watch workflow. A preset is a starting point
         for the table selection and a watch branch has no table picker, so the
         field was a control that could never do anything — and with preset now
         null on those two it would have drawn six chips with none taken. */
      /* H29 · the setup form's wording and shape, not a second dialect. There
         the presets sit on one line with the label "Presets:" beside them rather
         than stacked under a field label of their own, and the table picker
         carries them because a preset IS a table selection. Here they were a
         field in their own right, above a field called something else. */
      (w.branch === "watch" ? "" : "") +
      /* V2 · the panel shows THIS workflow's settings. Pass 2 bound the preset
         chip and nothing else, so opening Change on a workflow that runs Every
         week showed Daily, Last 90 days and all seven tables at their default
         — with Save changes beside it, so agreeing with what was on screen
         would have quietly rewritten the workflow. */
      /* P1 · P2 · the two read-only lines are gone. "What we pull" and "How often
         it runs" were sentences the panel could only state, never change — the
         watch branch fixes both — so they were two thirds of a CHANGE panel that
         could not be changed. What they said is already on the card's subtitle
         and in the confirmation; here they were filling a form with facts. */
      (w.branch === "watch"
        ? '<div class="field"><span class="field-label text-body-base-medium">What to watch</span>' +
            watchesHTML(w.how) + '</div>'
        : '<div class="field"><span class="field-label text-body-base-medium">' +
            'Choose the ' + esc(w.connector) + ' tables to pull</span>' +
            '<div class="presetline"><span class="presetlabel text-body-base-regular">Presets:</span>' +
            '<div class="presetscroll">' + chipsHTML(w.preset, "p") + '</div></div>' +
            tablesHTML("p", true, w.tables) + '</div>' +
          '<div class="field"><span class="field-label text-body-base-medium">Decide how often it runs</span>' +
            pickChipsHTML(CADENCE, CADENCE_OF[w.how], "p-cad", "Decide how often it runs") + '</div>' +
          '<div class="field"><span class="field-label text-body-base-medium">Pick an activity window</span>' +
            pickChipsHTML(WINDOWS, w.win, "p-win", "Pick an activity window") + '</div>') +
    '</div></div>' +
    '<div class="panel-bar" data-annotate-id="change-panel-actions">' +
      '<button class="button-style button-medium button-ghost" type="button" data-panel-close>Cancel</button>' +
      '<button class="button-style button-medium button-primary" type="button" data-panel-close>Save changes</button>' +
    '</div>' +
  '</aside>';
}

/* The published .pai-thumbnail-card, not a composed one. Its title is one line
   and ellipsed by house rule, which is what keeps a strip of decks even. */
function deckHTML(w) {
  return '<button class="pai-thumbnail-card" type="button" data-deck>' +
    '<span class="pai-thumbnail"><img src="' + card(w.d, w.s) + '" alt="" width="800" height="450" /></span>' +
    '<span class="pai-thumbnail-body">' +
      '<span class="pai-thumbnail-title text-body-base-medium">' + esc(w.name) + '</span>' +
      /* H4 · the created-at date, not the folder. The folder was the same word on
         every card in the strip, which is a line that costs a row and says nothing. */
      '<span class="pai-thumbnail-sub text-body-sm-regular">Created ' + esc(w.created) + '</span>' +
    '</span>' +
  '</button>';
}

/* ── draw ─────────────────────────────────────────────────────────────────── */
document.getElementById("side-slot").outerHTML = sidebarHTML();
/* V1 · ONE SHELF. The list is the same six rows, with the just-made one in
   front of them when made=new. shelfHTML already keys the New badge and the
   forward-written line off w.isNew, so nothing about the card had to change —
   only which list it is handed. Re-drawn rather than toggled because the row
   has to be first, and a hidden card cannot be first. */
function renderShelf() {
  const made = document.body.dataset.made === "new";
  document.getElementById("shelf-populated").innerHTML = shelfHTML(
    made ? [MADE].concat(WORKFLOWS) : WORKFLOWS, "populated",
    document.body.dataset.row === "menu" ? "acme" : null);
}
renderShelf();
document.getElementById("panel-slot").innerHTML = panelHTML(WORKFLOWS[0]);
/* R23 · written once. Nothing in it varies by which row you came from, unlike
   the change panel, so it is not rebuilt on open. */
document.getElementById("connectors-slot").innerHTML = connectorsPanelHTML();
/* Both shelves exist now, so the cards can be measured and drawn. */
paintShelf();
observeCards();
/* A4 · the first deck arrives picked. R12 is about the two branches and says
   nothing about the deck, and a setup that opens with nothing chosen anywhere
   asks the person to start from zero twice. */
document.getElementById("pick-strip").innerHTML = RECENT.map(deckHTML).join("");
(function () {
  const first = document.querySelector("#pick-strip [data-deck]");
  if (first) first.setAttribute("aria-pressed", "true");
})();
document.getElementById("branches").innerHTML = branchesHTML();

/* ── behaviour ─────────────────────────────────────────────────────────────
   Every reach the checklist records is walkable, and so is the way back. */
const body = document.body;
const create = document.getElementById("create");

function closeMenus() {
  document.querySelectorAll("[data-menu-for]").forEach(m => m.classList.add("is-closed"));
  document.querySelectorAll("[data-menu]").forEach(b => b.setAttribute("aria-expanded", "false"));
}

/* Y3 · a preset is a set of tables, so choosing one shows its set. Only the
   schedule branch's own chips do this — the panel's presets are the same
   component and the same handler would fire on them, so the scope is the
   branch. */
/* AD2 · the table belongs to the company. Until one is picked the counts are
   not shown at all rather than shown as zero or as somebody else's — the field
   is required, so "not yet" is the honest state and it is also what makes the
   ordering above legible. */
function setCompany(i) {
  const box = document.querySelector('.branch [data-annotate-id="company"]');
  if (!box) return;
  const branch = box.closest(".branch");
  branch.dataset.company = i;
  document.getElementById("company-value").textContent = COMPANIES[i];
  document.getElementById("company-value").classList.add("is-set");
  branch.querySelectorAll("[data-company]").forEach(b =>
    b.classList.toggle("is-selected", b.getAttribute("data-company") === String(i)));
  const f = COMPANY_FACTOR[i] || 1;
  branch.querySelectorAll(".table-row").forEach((row, k) => {
    const base = TABLES.filter(t => t.name)[k];
    const n = Math.max(1, Math.round(base.n * f));
    row.querySelector(".table-count").textContent = n + " records";
  });
  gateSetup();
}

body.addEventListener("click", ev => {
  const co = ev.target.closest("[data-company]");
  if (co) { setCompany(Number(co.getAttribute("data-company"))); closeMenus(); return; }

  const chip = ev.target.closest('.branch [data-chip="s"]');
  if (chip) {
    const want = PRESET_TABLES[chip.textContent.trim()];
    if (want) {
      const box = chip.closest(".branch");
      box.querySelectorAll('.tables [data-table]').forEach(t => {
        t.checked = want.indexOf(t.getAttribute("data-table")) > -1;
      });
    }
  }
});

body.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) { closeMenus(); body.dataset.state = go.dataset.go; return; }

  const trigger = ev.target.closest("[data-menu]");
  if (trigger) {
    const id = trigger.dataset.menu;
    const menu = document.querySelector('[data-menu-for="' + id + '"]');
    const shut = menu.classList.contains("is-closed");
    closeMenus();
    if (shut) { menu.classList.remove("is-closed"); trigger.setAttribute("aria-expanded", "true"); }
    return;
  }

  const change = ev.target.closest("[data-change-for]");
  if (change) {
    const w = WORKFLOWS.find(x => x.id === change.dataset.changeFor);
    document.getElementById("panel-slot").innerHTML = panelHTML(w);
    closeMenus();
    body.dataset.row = "changing";
    return;
  }

  if (ev.target.closest("[data-panel-close]")) { body.dataset.row = "resting"; return; }

  /* R23 · its own open and its own close. The change panel's data-panel-close
     sets row, and sharing it would make dismissing one panel reach into the
     other's param. */
  const openPanel = ev.target.closest("[data-panel-open]");
  if (openPanel) {
    closeMenus();
    body.dataset.panel = openPanel.getAttribute("data-panel-open");
    return;
  }
  if (ev.target.closest("[data-connectors-close]")) { body.dataset.panel = "none"; return; }

  /* H20 · the whole card opens the panel. It runs AFTER [data-change-for] and
     after the menu handlers above, so a click on the row menu or on Change
     inside it has already been taken and returned — the card only sees clicks
     that reached its own ground. Keyboard gets the same route through the
     keydown handler below, since the card is a role=button with a tabindex. */
  const openCard = ev.target.closest("[data-open-panel]");
  if (openCard) {
    const w = WORKFLOWS.find(x => x.id === openCard.dataset.openPanel);
    if (w) {
      document.getElementById("panel-slot").innerHTML = panelHTML(w);
      closeMenus();
      body.dataset.row = "changing";
    }
    return;
  }

  if (ev.target.closest("#create") && !create.classList.contains("button-disabled")) {
    /* R17 · R20 · finishing lands on the Workflows page with the new workflow
       at the top of it. One screen now, so this sets the setting rather than
       jumping to a state, and redraws the shelf so the row is really there. */
    body.dataset.state = "workflows-populated";
    body.dataset.made = "new";
    renderShelf();
    return;
  }

  const chip = ev.target.closest("[data-chip]");
  if (chip) {
    chip.parentElement.querySelectorAll("[data-chip]").forEach(c => c.classList.remove("is-selected"));
    chip.classList.add("is-selected");
    return;
  }

  /* C12 · nothing for the watch options here any more. They are .chip-pick
     like every other chip group on this screen, so the shared chip handler
     carries their state. A dead branch left behind reads as a case somebody
     forgot to finish. */

  /* The two routes out of step 1, and every way back. */
  const opens = ev.target.closest("[data-over-open]");
  if (opens) { body.dataset.over = opens.getAttribute("data-over-open"); return; }
  if (ev.target.closest("[data-over-close]")) { body.dataset.over = "none"; return; }

  const deck = ev.target.closest("[data-deck]");
  if (deck) {
    deck.parentElement.querySelectorAll("[data-deck]").forEach(d => d.removeAttribute("aria-pressed"));
    deck.setAttribute("aria-pressed", "true");
    gateSetup();
    return;
  }

  /* V11 · .dropdown-container, not .menu-anchor. There are two menus on this
     page now — the row's and New workflow's — and .menu-anchor names only the
     first, so a click inside the connector menu was closing it on the way in. */
  if (!ev.target.closest(".dropdown-container")) closeMenus();
});

/* R12 · the finishing control is held until a branch is picked, and the reason
   for holding it is beside it while it is held.

   V1 · a DECK holds it too. Pass 2 held it against the branch alone, so setup
   could finish with nothing to copy — and the moment a branch was picked the
   line beside the button switched to the after-the-fact sentence, so the deck
   nobody had chosen was never mentioned again. The line now names whichever of
   the two is still missing, and only says the after-the-fact sentence once
   there is nothing left to ask for. */
function gateSetup() {
  const deckPicked   = !!document.querySelector('#pick-strip [data-deck][aria-pressed="true"]');
  const branchPicked = !!document.querySelector("[data-branch]:checked");
  /* AD3 · a required field holds the control. Only on the schedule branch —
     the watch branch has no company to pick, which is why this asks whether the
     branch that needs one is the branch that is open. */
  const onSchedule   = !!document.querySelector('[data-branch="schedule"]:checked');
  const companyPicked = !!document.querySelector('.branch[data-company]');
  const held = !(deckPicked && branchPicked && (!onSchedule || companyPicked));
  create.classList.toggle("button-disabled", held);
  /* A18 · the reason is no longer a sentence on the bar. DESIGN.md §7 says a
     disabled control owes an explanation and that a tooltip is the minimum, so
     it rides on the control while the control is held and comes off when it is
