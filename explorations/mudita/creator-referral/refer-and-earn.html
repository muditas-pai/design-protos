<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>" />
  <title>Refer &amp; earn with creator videos · presentations.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../../design-system/pai.css" />

  <!--
    Refer & earn (live: https://app.presentations.ai/#/referandearn), rebuilt from
    pitchdeckdoclist src/listing/core/screens/views/dashboard/referandearn/ReferAndEarn.jsx
    (14 Oct 2026) with the creator-video pieces added. New parts are marked NEW below.
  -->
  <style>
    :root { --cream: #FEF7EF; }
    body { margin: 0; background: var(--bg-subtle); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button, a { font-family: inherit; }
    .modal .button-style, .button-style { gap: 6px; }

    .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
    .side { background: var(--bg-muted); border-right: 1px solid var(--border-tertiary); padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 22px; }
    .logo span { width: 22px; height: 22px; border-radius: 6px; background: #FF5500; display: grid; place-items: center; color: #fff; font-size: 13px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav div { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--text-secondary); font-size: 13px; }
    .nav div.on { background: var(--bg-elevated-hover); color: var(--text-primary); font-weight: 500; }
    .page { max-width: 1152px; margin: 0 auto; padding: 32px 24px 120px; display: flex; flex-direction: column; gap: 20px; }

    /* existing: hero */
    .hero { position: relative; overflow: hidden; border-radius: 16px; background: var(--cream); padding: 32px; display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 32px; align-items: center; }
    .over { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-brand); }
    .over i { font-size: 20px; }
    .hero h2 { margin: 8px 0 0; max-width: 36rem; font-size: 32px; line-height: 40px; letter-spacing: -0.02em; font-weight: 600; color: var(--text-primary); }
    .hero p { margin: 8px 0 0; max-width: 36rem; font-size: 16px; line-height: 24px; color: var(--text-secondary); }
    .linkrow { margin-top: 20px; display: flex; gap: 8px; max-width: 36rem; }
    .linkrow input { height: 40px; min-width: 0; flex: 1; border-radius: 6px; border: 1px solid var(--border-secondary); background: #fff; padding: 0 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: var(--text-secondary); outline: none; }
    .share { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; max-width: 36rem; }

    /* NEW: creator promo inside the hero's empty right half */
    .cr { position: relative; display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; padding: 16px; border-radius: 12px; background: #fff;
      box-shadow: 0 0 0 1px rgba(11,15,20,0.06), 0 1px 2px rgba(11,15,20,0.06), 0 12px 28px -12px rgba(11,15,20,0.18); }
    .cr-phone { position: relative; width: 132px; height: 236px; border-radius: 20px; padding: 4px; background: #0b0b0c; box-shadow: 0 14px 28px -14px rgba(11,15,20,0.5); }
    .cr-screen { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; background: #2a211c; }
    .cr-screen video, .cr-screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
    .hl-face { position: absolute; left: 20%; top: 11%; width: 50%; height: 39%; z-index: 2; }
    .hl-blur { position: absolute; inset: 0; border-radius: 46%; backdrop-filter: blur(10px) saturate(0.9); -webkit-backdrop-filter: blur(10px) saturate(0.9); background: rgba(255,255,255,0.06);
      -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); }
    .hl-corner { position: absolute; width: 13px; height: 13px; border: 0 solid #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
    .hl-corner.tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 6px; }
    .hl-corner.tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 6px; }
    .hl-corner.bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 6px; }
    .hl-corner.br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 6px; }
    .hl-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 18px; padding: 0 7px; border-radius: 99px; background: rgba(10,25,37,0.55); color: #fff;
      font-size: 9px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; backdrop-filter: blur(6px); }
    .cr-link { position: absolute; left: 6px; right: 6px; bottom: 8px; z-index: 3; display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px; background: rgba(255,255,255,0.92);
      font-size: 8.5px; font-weight: 600; color: var(--text-primary); }
    .cr-link i { color: var(--text-brand); font-size: 10px; }
    .tag-new { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #FF5500; background: rgba(255,85,0,0.10); }
    .cr h3 { margin: 8px 0 4px; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
    .cr h3 span { display: block; font-weight: 400; color: var(--text-tertiary); }
    .cr p.s { margin: 0 0 14px; font-size: 13px; line-height: 18px; color: var(--text-secondary); }
    .cr-stat { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 12px; }
    .cr-stat b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .cr-stat span { font-size: 13px; color: var(--text-secondary); }

    /* existing: stat cards */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--border-secondary); background: #fff; padding: 16px; }
    .k { font-size: 13px; line-height: 18px; color: var(--gray-500); display: flex; align-items: center; gap: 8px; }
    .v { margin-top: 4px; font-size: 24px; line-height: 32px; letter-spacing: -0.015em; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .v small { font-size: 14px; font-weight: 400; color: var(--gray-500); letter-spacing: 0; }
    .meter { margin-top: 8px; height: 6px; border-radius: 99px; background: var(--bg-quaternary); overflow: hidden; display: flex; }
    .meter i { height: 100%; }
    .meter .link { background: linear-gradient(90deg, #69A0FF, #3C82FF); }
    .meter .vid { background: var(--bg-brand); }
    .legend { margin-top: 8px; display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend span::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: #69A0FF; }
    .legend span.vid::before { background: var(--bg-brand); }
    .blur { filter: blur(4px); user-select: none; }
    .lock { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 16px; background: rgba(255,255,255,0.4); }
    .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
    .badge.brand { background: var(--app-50); color: var(--app-700); }
    .badge.good { background: var(--green-50); color: var(--green-700); }
    .badge.neutral { background: var(--bg-tertiary); color: var(--text-secondary); }
    .badge.warn { background: #FEF9C3; color: #A16207; }
    .badge.video { background: var(--app-50); color: var(--app-700); }

    /* NEW: your videos */
    .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-secondary); }
    .sec-h h3 { margin: 0; font-size: 18px; line-height: 26px; letter-spacing: -0.005em; font-weight: 600; color: var(--text-primary); }
    .sec-h span { font-size: 13px; color: var(--gray-500); }
    .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; padding: 16px; }
    .vcard { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border-tertiary); }
    .vthumb { position: relative; width: 72px; height: 128px; border-radius: 8px; overflow: hidden; background: #ccc; }
    .vthumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
    .vthumb .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; display: grid; place-items: center; font-size: 11px; backdrop-filter: blur(4px); }
    .vthumb .cap { position: absolute; left: 4px; right: 4px; bottom: 6px; color: #fff; font-size: 8px; font-weight: 800; line-height: 1.15; text-align: center; text-shadow: 0 1px 2px #000; }
    .vmeta { display: flex; flex-direction: column; min-width: 0; }
    .vmeta .t { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-primary); }
    .vmeta .d { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
    .vmeta .n { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
    .vmeta .n b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .vmeta .acts { display: flex; gap: 6px; margin-top: 8px; }
    .vnew { border: 1.5px dashed var(--border-primary); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 148px;
      background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: border-color 150ms, color 150ms, background 150ms; }
    .vnew i { font-size: 20px; }
    .vnew:hover { border-color: var(--border-brand); color: var(--text-brand); background: var(--app-50); }

    /* existing: invites table */
    table { width: 100%; min-width: 640px; text-align: left; border-collapse: collapse; font-size: 14px; }
    th { padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-500); border-bottom: 1px solid var(--border-secondary); }
    td { padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--border-secondary); color: var(--text-secondary); }
    tr:last-child td { border-bottom: 0; }
    td .who { display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
    td .sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
    td.r { text-align: right; font-variant-numeric: tabular-nums; }
    td .via { display: inline-flex; align-items: center; gap: 6px; }
    tr.isnew td { animation: rowIn 600ms var(--ease-out-strong); }
    @keyframes rowIn { from { background: var(--app-50); } to { background: transparent; } }

    .rules { border-radius: 12px; background: var(--bg-tertiary); padding: 16px; }
    .rules h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .rules ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-size: 13px; line-height: 18px; color: var(--text-secondary); }
    .rules li.new { color: var(--text-primary); }
    .rules li.new .tag-new { margin-right: 6px; vertical-align: 1px; }

    .review { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 10px; background: #0A1925; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .review span { font-size: 11px; color: rgba(255,255,255,0.5); padding: 0 8px 0 6px; }
    .review button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.75); font-size: 12px; cursor: pointer; }
    .review button:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .review button.on { background: #fff; color: #0A1925; font-weight: 500; }

    @media (max-width: 1100px) { .hero { grid-template-columns: 1fr; } .cr { max-width: 440px; } }
    @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { display: none; } .stats { grid-template-columns: 1fr; } .rules ul { grid-template-columns: 1fr; } .hero { padding: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body class="pai">
  <div class="shell">
    <aside class="side">
      <div class="logo"><span><i class="ph-fill ph-presentation"></i></span>presentations.ai</div>
      <nav class="nav">
        <div><i class="ph ph-house"></i>Home</div>
        <div><i class="ph ph-folder"></i>My presentations</div>
        <div><i class="ph ph-layout"></i>Templates</div>
        <div><i class="ph ph-palette"></i>Brand kit</div>
        <div class="on"><i class="ph ph-gift"></i>Refer &amp; earn</div>
        <div><i class="ph ph-trash"></i>Trash</div>
      </nav>
    </aside>
    <main class="page" id="page"></main>
  </div>

  <div class="review" id="review"></div>

<script>
const U = id => `https://images.unsplash.com/photo-${id}?w=300&h=540&fit=crop&crop=faces&q=70`;
const ME = U('1531123897727-8f129e1688ce');
const HL_SAMPLE = 'https://hardlaunch.com/website/swap/languages/source.mp4';
const HL_POSTER = 'https://hardlaunch.com/website/swap/p/languages/source.jpg';
const LINK = 'https://app.presentations.ai/?ref=k3n8q2xd';
const CAP_YEAR = 2000;

const VIDEOS = [
  { hook: 'I built my investor deck before my coffee got cold', made: '18 Oct 2026', signups: 3 },
  { hook: 'Turn a messy doc into a deck in 30 seconds', made: '20 Oct 2026', signups: 1 },
];
const REFERRALS = {
  base: [
    { who: 'Hernan Sanchez', date: '24 Jan', via: 'Facebook', pro: true, credits: 200 },
    { who: 'Sara Koster', date: '19 Jan', via: 'LinkedIn', credits: 200 },
    { who: 'Xenia Neumann', date: '12 Jan', via: 'X', credits: 0 },
  ],
  video: [
    { who: 'Priya Raman', date: '21 Oct', via: 'Instagram', video: 0, credits: 0, isnew: true },
    { who: 'Tom Becker', date: '20 Oct', via: 'TikTok', video: 1, credits: 200 },
    { who: 'Ana Lima', date: '19 Oct', via: 'Instagram', video: 0, credits: 200 },
    { who: 'Jonas Weber', date: '19 Oct', via: 'Instagram', video: 0, credits: 200 },
  ],
};

let state = 'new'; // 'new' = never made a video · 'creator' = has videos

const btn = (label, cls, attrs = '') => `<button class="button-style ${cls}" ${attrs}>${label}</button>`;
const corners = '<span class="hl-corner tl"></span><span class="hl-corner tr"></span><span class="hl-corner bl"></span><span class="hl-corner br"></span>';

function creatorCard() {
  if (state === 'new') return `
    <div class="cr">
      <div class="cr-phone"><div class="cr-screen">
        <video src="${HL_SAMPLE}" poster="${HL_POSTER}" autoplay muted loop playsinline></video>
        <div class="hl-face"><div class="hl-blur"></div>${corners}<span class="hl-label">Your face</span></div>
        <div class="cr-link"><i class="ph-bold ph-link"></i>Your link in bio</div>
      </div></div>
      <div>
        <span class="tag-new">NEW</span>
        <h3><span>Share your link in a video.</span>We make it, you post it.</h3>
        <p class="s">Pick one of our ready-made videos and add your face. Every signup from it counts as your referral.</p>
        ${btn('<i class="ph ph-video-camera"></i>Make my video', 'button-medium button-primary-brand', 'data-open-modal')}
      </div>
    </div>`;
  const total = VIDEOS.reduce((a, v) => a + v.signups, 0);
  return `
    <div class="cr">
      <div class="cr-phone"><div class="cr-screen"><img src="${ME}" alt="Your latest video">
        <div class="cr-link"><i class="ph-bold ph-link"></i>Your link in bio</div></div></div>
      <div>
        <div class="k"><i class="ph ph-video-camera"></i>From your videos</div>
        <div class="cr-stat"><b>${total}</b><span>signups</span></div>
        <p class="s">Your videos are bringing people in. Another one, another audience.</p>
        ${btn('<i class="ph ph-plus"></i>Make another video', 'button-medium button-primary-brand', 'data-open-modal')}
      </div>
    </div>`;
}

function render() {
  const creator = state === 'creator';
  const rows = creator ? [...REFERRALS.video, ...REFERRALS.base] : REFERRALS.base;
  const fromLink = REFERRALS.base.reduce((a, r) => a + r.credits, 0) + 800; // older referrals not listed
  const fromVideo = creator ? REFERRALS.video.reduce((a, r) => a + r.credits, 0) : 0;
  const earned = Math.min(CAP_YEAR, fromLink + fromVideo);

  $('#page').innerHTML = `
    <section class="hero">
      <div>
        <div class="over"><i class="ph ph-gift"></i>Refer &amp; earn</div>
        <h2>Give 200 credits, get 200 credits</h2>
        <p>When a friend signs up with your link and makes their first deck, you both get 200 credits, about 20 new slides. Paid plans also earn 10% of a friend’s first annual payment, in cash.</p>
        <div class="linkrow"><input readonly value="${LINK}" aria-label="Your referral link">${btn('<i class="ph ph-copy"></i>Copy', 'button-medium button-primary', 'data-copy style="width:112px"')}</div>
        <div class="share">
          ${btn('<i class="ph ph-envelope-simple"></i>Email', 'button-small button-secondary')}
          ${btn('LinkedIn', 'button-small button-secondary')}${btn('Twitter', 'button-small button-secondary')}${btn('Facebook', 'button-small button-secondary')}${btn('WhatsApp', 'button-small button-secondary')}
        </div>
      </div>
      ${creatorCard()}
    </section>

    <div class="stats">
      <section class="card">
        <div class="k">Credits earned this year</div>
        <div class="v">${earned.toLocaleString('en-US')} <small>of ${CAP_YEAR.toLocaleString('en-US')}</small></div>
        <div class="meter"><i class="link" style="width:${fromLink / CAP_YEAR * 100}%"></i>${creator ? `<i class="vid" style="width:${fromVideo / CAP_YEAR * 100}%"></i>` : ''}</div>
        ${creator ? `<div class="legend"><span>From your link</span><span class="vid">From your videos</span></div>` : ''}
        <div style="margin-top:12px">${btn('Redeem credits', 'button-small button-secondary')}</div>
      </section>
      <section class="card">
        <div class="k">Cash earned <span class="badge brand">Paid plans</span></div>
        <div class="v blur" aria-hidden="true">₹799 <small>available</small></div>
        <div class="k blur" aria-hidden="true">₹1,999 pending</div>
        <div class="lock">${btn('<i class="ph ph-sparkle"></i>Earn 1000 credits', 'button-small button-primary')}</div>
      </section>
      <section class="card">
        <div class="k">Payout</div>
        <p style="margin:4px 0 0; font-size:14px; line-height:20px; color:var(--text-secondary)">Available on Basic and above, from ₹3,999 a year.</p>
      </section>
    </div>

    ${creator ? `
    <section class="card" style="padding:0">
      <div class="sec-h"><h3>Your videos</h3><span>Each one carries your link</span></div>
      <div class="vids">
        ${VIDEOS.map(v => `
          <div class="vcard">
            <div class="vthumb"><img src="${ME}" alt=""><span class="play"><i class="ph-fill ph-play"></i></span><span class="cap">${v.hook.split(' ').slice(0, 4).join(' ')}</span></div>
            <div class="vmeta">
              <div class="t">${v.hook}</div><div class="d">Made ${v.made}</div>
              <div class="n"><i class="ph ph-user-plus"></i><b>${v.signups}</b> signup${v.signups === 1 ? '' : 's'}</div>
              <div class="acts">${btn('<i class="ph ph-download-simple"></i>Download', 'button-small button-secondary')}${btn('<i class="ph ph-copy"></i>', 'button-small button-ghost icon-only', 'aria-label="Copy caption" title="Copy caption"')}</div>
            </div>
          </div>`).join('')}
        <button class="vnew" data-open-modal><i class="ph ph-plus"></i>Make another video</button>
      </div>
    </section>` : ''}

    <section class="card" style="padding:0">
      <div class="sec-h"><h3>Your invites</h3><span>Templates you publish${creator ? ' and videos you post' : ''} carry your link too</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Friend</th><th>Came from</th><th>Status</th><th style="text-align:right">Credits</th><th style="text-align:right">Cash</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr class="${r.isnew ? 'isnew' : ''}">
            <td><div class="who">${r.who}${r.pro ? '<span class="badge warn">PRO</span>' : ''}</div><div class="sub">${r.date}</div></td>
            <td>${r.video !== undefined
              ? `<span class="badge video"><i class="ph-fill ph-video-camera"></i>Your video</span><div class="sub">${r.via} · “${VIDEOS[r.video].hook.split(' ').slice(0, 4).join(' ')}…”</div>`
              : `<span class="via">${r.via}</span>`}</td>
            <td>${r.credits ? '<span class="badge good">First deck made</span><div class="sub">200 credits each</div>' : '<span class="badge neutral">Signed up</span><div class="sub">Credits arrive after their first deck</div>'}</td>
            <td class="r" style="color:var(--text-primary)">${r.credits ? '+' + r.credits : '·'}</td>
            <td class="r" style="color:var(--gray-500)">·</td>
          </tr>`).join('')}</tbody>
      </table></div>
    </section>

    <section class="rules">
      <h3>How rewards work</h3>
      <ul>
        <li>Credits for both of you land when your friend makes a first deck, not at sign-up.</li>
        <li>Up to 2,000 referral credits a year (10 friends). Referral credits don’t expire while your account is active.</li>
        <li>Cash: 10% of your friend’s first annual plan payment if they buy within 90 days. Pass, Mobile Weekly and API purchases don’t count.</li>
        <li>Cash is pending for 30 days in case of a refund, then available. Payouts from ₹1,500, within 10 working days.</li>
        <li>Your own accounts, shared cards or devices don’t count. We void rewards from refunds and from abuse.</li>
        <li>Friends who start from your Community template count as your referrals.</li>
        <li class="new"><span class="tag-new">NEW</span>Friends who sign up from a video you posted count as your referrals.</li>
      </ul>
    </section>`;

  $('#review').innerHTML = '<span>Review</span>' + [['new', 'No videos yet'], ['creator', 'Has videos']]
    .map(([k, l]) => `<button data-state="${k}" class="${state === k ? 'on' : ''}">${l}</button>`).join('');
}
const $ = s => document.querySelector(s);

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.state) { state = t.dataset.state; render(); }
  else if ('openModal' in t.dataset) {
    // In the product this opens the creator modal (creator-modal.html in this folder).
    const was = t.innerHTML; t.innerHTML = '<i class="ph ph-arrow-square-out"></i>Opens the creator modal'; setTimeout(() => t.innerHTML = was, 1400);
  }
  else if ('copy' in t.dataset) {
    navigator.clipboard?.writeText(LINK).catch(() => {});
    const was = t.innerHTML; t.innerHTML = '<i class="ph ph-check"></i>Copied'; setTimeout(() => t.innerHTML = was, 1400);
  }
});
render();
</script>
</body>
</html>
