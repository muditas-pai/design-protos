<!DOCTYPE html>
<!-- exploration · brand-kit FTUE (first-time setup) · Mudita · 12 Jun 2026
     flow: zero state → add sources → live reveal → land in filled kit + sample deck
     demo: a workspace sets up its first kit by pasting patagonia.com (reuses Patagonia data) -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>" />
  <title>Brand Kit — set up · design-protos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --surface-2: #f5f5f5;
      --fg: #171717; --fg-2: #525252; --fg-3: #a3a3a3;
      --brand: #005eff; --brand-tint: #e6efff; --ink: #0b0f14;
      --line: rgba(11,15,20,0.09); --line-strong: rgba(11,15,20,0.20);
      --sel: rgba(22,30,39,0.08);
      --d1: rgba(11,15,20,0.06); --d2: rgba(11,15,20,0.09); --inner: rgba(255,255,255,0.8);
      --ease: cubic-bezier(0.23, 1, 0.32, 1); --gold: #f5a623;
      --pata: #1F4A38;  /* the demo brand */
      --sh-card: 0 1px 2px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
      --sh-card-hover: 0 10px 28px -8px var(--d2), 0 2px 6px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
      --sh-btn: 0 1px 2px 1px var(--d1), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased; }
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* sidebar */
    .sidebar { width: 260px; min-width: 260px; background: var(--bg); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; }
    .ws { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    .ws-avatar { width: 28px; height: 28px; border-radius: 5px; flex-shrink: 0;
      background: linear-gradient(135deg, #2c6a4f, #163d2c); box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--line);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
    .ws-name { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws .caret { color: var(--fg-2); font-size: 18px; }
    .back-home { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 16px; color: var(--fg-2);
      text-decoration: none; font: 500 13px "Inter"; border: 0; border-bottom: 1px solid var(--line);
      background: none; text-align: left; cursor: pointer; }
    .back-home i { font-size: 16px; }
    .rail-head { padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
    .rail-head .t { font-size: 15px; font-weight: 600; }
    .rail-head .t span { color: var(--fg-3); font-weight: 500; margin-left: 6px; }
    .btn-new { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 8px;
      background: var(--ink); color: #fff; border: 0; border-radius: 6px; font: 500 12px "Inter"; cursor: pointer; }
    .btn-new i { font-size: 14px; }
    .kit-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .kit-row { display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 6px; cursor: pointer; }
    .kit-row.active { background: var(--sel); }
    .kit-empty { color: var(--fg-3); font-size: 13px; padding: 8px; line-height: 1.5; }
    .mark { width: 36px; height: 36px; border-radius: 7px; flex-shrink: 0; display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden; }
    .kit-row .name { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kit-row .star { color: var(--gold); font-size: 14px; }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 8px; }
    .nav-item { display: flex; align-items: center; gap: 8px; height: 36px; padding: 8px; border-radius: 6px;
      color: var(--fg-2); cursor: pointer; }
    .nav-item i { font-size: 20px; }

    /* main + topbar */
    .main { flex: 1; min-width: 0; height: 100%; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 24px; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent;
      color: var(--fg-2); border-radius: 4px; cursor: pointer; font-size: 20px; }
    .avatar { width: 28px; height: 28px; border-radius: 999px; margin-left: 4px; flex-shrink: 0;
      background: url("https://i.pravatar.cc/56?img=32") center/cover, var(--surface-2);
      box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--line); }
    .stage { flex: 1; min-height: 0; overflow-y: auto; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 20px;
      border: 0; border-radius: 6px; font: 600 14px "Inter"; cursor: pointer; transition: transform 120ms var(--ease), filter 120ms var(--ease); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { filter: brightness(1.3); }
    .btn-ghost { background: var(--surface); color: var(--fg); box-shadow: var(--sh-btn); }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn i { font-size: 17px; }

    /* ── ZERO STATE ─────────────────────────────────────────────── */
    .zero { height: 100%; display: grid; place-items: center; padding: 24px; }
    .zero-card { max-width: 460px; text-align: center; }
    .zero-ic { width: 64px; height: 64px; border-radius: 11px; margin: 0 auto 20px; display: grid; place-items: center;
      background: var(--brand-tint); color: var(--brand); font-size: 30px; }
    .zero h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
    .zero p { color: var(--fg-2); font-size: 15px; line-height: 1.55; margin: 0 0 22px; }

    /* ── ADD SOURCES ────────────────────────────────────────────── */
    .sources { max-width: 560px; margin: 0 auto; padding: 56px 24px; }
    .sources h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
    .sources .lead { color: var(--fg-2); margin: 0 0 26px; line-height: 1.5; }
    .url-field { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px;
      background: var(--surface); border-radius: 7px; box-shadow: var(--sh-btn); }
    .url-field > i { color: var(--fg-3); font-size: 18px; }
    .url-field input { flex: 1; border: 0; outline: none; font: 400 16px "Inter"; color: var(--fg); background: none; }
    .url-field input::placeholder { color: var(--fg-3); }
    .or { display: flex; align-items: center; gap: 12px; color: var(--fg-3); font-size: 12px; margin: 18px 0; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .dropzone { border: 1.5px dashed var(--line-strong); border-radius: 7px; padding: 26px; text-align: center;
      color: var(--fg-2); cursor: pointer; transition: background 130ms var(--ease); }
    .dropzone:hover { background: var(--surface-2); }
    .dropzone i { font-size: 24px; color: var(--fg-3); display: block; margin-bottom: 8px; }
    .dropzone b { color: var(--fg); font-weight: 600; }
    .dropzone span { font-size: 12px; display: block; margin-top: 4px; }
    .sources-foot { margin-top: 26px; display: flex; justify-content: flex-end; }

    /* ── LIVE REVEAL ────────────────────────────────────────────── */
    .reveal { max-width: 560px; margin: 0 auto; padding: 52px 24px; }
    .reveal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .reveal-spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--brand-tint);
      border-top-color: var(--brand); animation: spin 700ms linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .reveal h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .reveal h1 .dom { color: var(--brand); }
    .reveal .sub { color: var(--fg-2); margin: 2px 0 20px 34px; font-size: 13px; }
    .pbar { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 0 0 22px; }
    .pbar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width 500ms var(--ease); }
    .ritem { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line);
      opacity: 0.4; transition: opacity 300ms var(--ease); }
    .ritem.on { opacity: 1; }
    .rdot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      background: var(--surface-2); color: var(--fg-3); font-size: 13px; margin-top: 1px; }
    .ritem.on .rdot { background: var(--pata); color: #fff; }
    .ritem .rlabel { font-weight: 500; }
    .ritem .rmeta { color: var(--fg-2); font-size: 12.5px; margin-top: 4px; min-height: 0; }
    .rmeta .sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; margin-right: 4px;
      vertical-align: -3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .rmeta .thumb { display: inline-block; width: 26px; height: 18px; border-radius: 3px; margin-right: 4px;
      vertical-align: -4px; background-size: cover; background-position: center; background-color: var(--surface-2);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .rmeta .vchip { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--surface-2);
      font-size: 11px; margin-right: 5px; }
    .rmeta .logobit { display:inline-grid; place-items:center; width: 46px; height: 22px; border-radius: 5px;
      background: var(--pata); vertical-align: middle; }
    .rmeta .logobit .lm { width: 80%; height: 60%; background:#fff;
      -webkit-mask: var(--lmask) center/contain no-repeat; mask: var(--lmask) center/contain no-repeat; }

    /* ── LANDED — success banner + sample deck + filled kit ──────── */
    .landed { padding-bottom: 60px; }
    .banner { margin: 16px 24px 0; padding: 14px 18px; border-radius: 9px; display: flex; align-items: center; gap: 12px;
      background: linear-gradient(100deg, rgba(31,74,56,0.10), rgba(62,124,94,0.06)); box-shadow: inset 0 0 0 1px rgba(31,74,56,0.18); }
    .banner .bi { width: 30px; height: 30px; border-radius: 6px; background: var(--pata); color: #fff; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
    .banner .bt { flex: 1; }
    .banner .bt b { font-weight: 600; } .banner .bt span { color: var(--fg-2); font-size: 13px; }
    .banner .bx { color: var(--fg-3); font-size: 18px; cursor: pointer; }

    .proof { margin: 22px 24px 0; }
    .proof-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .proof-head .pt { font-size: 15px; font-weight: 600; }
    .proof-head .ps { color: var(--fg-2); font-size: 12.5px; }
    .deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 860px; }
    .ss { border-radius: 6px; overflow: hidden; box-shadow: var(--sh-card); }   /* preview only — not interactive, no hover */
    .proof-actions { margin-top: 16px; display: flex; gap: 10px; }

    /* sample slides + mood preview: fixed 320x180 in <foreignObject>, scaled by viewBox */
    .slide-svg { display: block; width: 100%; height: auto; }
    .sl { width: 320px; height: 180px; position: relative; overflow: hidden; box-sizing: border-box;
      font-family: "Inter", sans-serif; }
    .sl .fr { font-family: "Fraunces", Georgia, serif; }
    .sl-cover { background: var(--pata); color: #fff; padding: 24px 28px; display: flex; flex-direction: column; justify-content: flex-end; }
    .sl-cover .eb { position: absolute; top: 22px; left: 28px; font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase; opacity: 0.7; }
    .sl-cover h3 { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 600; width: 80%; }
    .sl-cover .lm { position: absolute; top: 20px; right: 26px; width: 70px; height: 22px; background: rgba(255,255,255,0.95);
      -webkit-mask: var(--lmask) center/contain no-repeat; mask: var(--lmask) center/contain no-repeat; }
    .sl-statement { background: #E4DAC4; color: #2a2018; padding: 28px; display: flex; align-items: center; }
    .sl-statement h3 { margin: 0; font-size: 26px; line-height: 1.18; font-weight: 600; }
    .sl-stat { background: #fff; color: var(--fg); padding: 26px 28px; display: flex; flex-direction: column; justify-content: center; }
    .sl-stat .big { font-size: 64px; line-height: 0.9; font-weight: 600; color: var(--pata); letter-spacing: -2px; }
    .sl-stat .lab { font-size: 14px; color: var(--fg-2); margin-top: 12px; width: 78%; line-height: 1.3; }
    .sl-stat .rule { width: 46px; height: 4px; background: #3E7C5E; margin-top: 14px; }
    .sl-points { background: #fff; color: var(--fg); padding: 24px 28px; }
    .sl-points h3 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
    .sl-points .cols { display: flex; gap: 16px; }
    .sl-points .col { flex: 1; }
    .sl-points .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pata); margin-bottom: 8px; }
    .sl-points .col:nth-child(2) .dot { background: #3E7C5E; } .sl-points .col:nth-child(3) .dot { background: #9C6B3F; }
    .sl-points .ct { font-weight: 600; font-size: 12.5px; } .sl-points .cb { font-size: 11px; color: var(--fg-2); margin-top: 3px; line-height: 1.35; }
    .sl-closing { background: var(--pata); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .sl-closing .lm { width: 120px; height: 30px; background: #fff; -webkit-mask: var(--lmask) center/contain no-repeat; mask: var(--lmask) center/contain no-repeat; }
    .sl-closing .ty { font-size: 22px; font-weight: 600; } .sl-closing .web { font-size: 11px; opacity: 0.7; letter-spacing: 0.5px; }
    /* chart slide — grouped columns */
    .sl-chart { background: #fff; color: var(--fg); padding: 20px 24px 16px; display: flex; flex-direction: column; }
    .sl-chart h3 { margin: 0 0 5px; font-size: 17px; font-weight: 600; }
    .sl-chart .leg { display: flex; gap: 14px; font-size: 10px; color: var(--fg-2); margin-bottom: 8px; }
    .sl-chart .leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .sl-chart .bars { flex: 1; display: flex; gap: 16px; }
    .sl-chart .grp { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
    .sl-chart .bar { width: 13px; border-radius: 2px 2px 0 0; }
    .sl-chart .xl { display: flex; gap: 16px; margin-top: 6px; }
    .sl-chart .xl span { flex: 1; text-align: center; font-size: 9.5px; color: var(--fg-3); }
    /* diagram slide — lighthouse illustration + content */
    .sl-diagram { background: #E4DAC4; color: #2a2018; padding: 22px 24px; display: flex; align-items: center; gap: 8px; }
    .sl-diagram .dx { flex: 1; }
    .sl-diagram .eb { font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: #8a7c63; margin-bottom: 8px; }
    .sl-diagram h3 { margin: 0 0 8px; font-size: 20px; line-height: 1.12; font-weight: 600; }
    .sl-diagram p { margin: 0; font-size: 11px; color: #6a5f4d; line-height: 1.4; width: 94%; }
    .sl-diagram .art { width: 92px; flex-shrink: 0; display: grid; place-items: center; }
    /* team slide — circular avatars */
    .sl-team { background: #fff; color: var(--fg); padding: 22px 24px; display: flex; flex-direction: column; }
    .sl-team h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
    .sl-team .row { display: flex; gap: 12px; }
    .sl-team .m { flex: 1; text-align: center; }
    .sl-team .av { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 7px; object-fit: cover; display: block;
      background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .sl-team .mn { font-size: 11px; font-weight: 600; }
    .sl-team .mr { font-size: 9.5px; color: var(--fg-2); margin-top: 1px; }

    /* filled kit (accordions) */
    .kit-head { display: flex; align-items: center; gap: 16px; padding: 26px 24px 18px; }
    .mark-lg { width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
      background: var(--pata); overflow: hidden; }
    .mark-lg .lm { width: 74%; height: 52%; background: #fff; -webkit-mask: var(--lmask) center/contain no-repeat; mask: var(--lmask) center/contain no-repeat; }
    .kit-head h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    .kit-head .row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .badge-default { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-tint); color: var(--brand);
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
    .badge-default i { font-size: 11px; }
    .accs { padding: 4px 24px 0; display: flex; flex-direction: column; gap: 10px; }
    /* accordions as cards — they read as tappable surfaces */
    .acc { background: var(--surface); border-radius: 12px; box-shadow: var(--sh-card); overflow: hidden;
      transition: box-shadow 180ms var(--ease), transform 180ms var(--ease); }
    .acc:not(.open):hover { box-shadow: var(--sh-card-hover); transform: translateY(-1px); }
    .acc-head { width: 100%; display: flex; align-items: center; gap: 9px; padding: 17px 20px; background: none; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--fg); }
    .acc-caret { font-size: 13px; color: var(--fg-3); transition: transform 220ms var(--ease); }
    .acc.open .acc-caret { transform: rotate(90deg); }
    .acc-label { font-weight: 600; }
    /* summary now sits right beside the title (proximity) — a middot separates it */
    .acc-sum { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 12px; }
    .acc-sum::before { content: "·"; margin-right: 3px; color: var(--fg-3); }
    .acc.open .acc-sum { display: none; }  /* hide the mini-summary once expanded */
    .acc-sum .dots i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-left: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 280ms var(--ease); }
    .acc.open .acc-body { grid-template-rows: 1fr; }
    .acc-body > .inner { overflow: hidden; }
    .acc-content { padding: 2px 20px 22px 20px; }
    .org-grid { display: grid; grid-template-columns: 150px 1fr; gap: 4px 16px; max-width: 660px; font-size: 13.5px; }
    .org-grid dt { color: var(--fg-3); font-weight: 500; padding: 5px 0; }
    .org-grid dd { margin: 0; padding: 5px 0; color: var(--fg); }
    .lf2 { display: flex; flex-direction: column; gap: 22px; }
    .lf-top { display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; }
    .lf-deck .sub { margin-bottom: 12px; }
    .sub { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg-3); margin-bottom: 7px; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { width: 34px; height: 34px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10); }
    .lf-block { position: relative; }
    /* typography — one specimen card (real title + body), with an edit affordance */
    .typo-card { position: relative; background: var(--surface); border-radius: 10px; box-shadow: var(--sh-card); padding: 16px 18px; max-width: 380px; }
    .typo-row + .typo-row { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); }
    .typo-row .tl { font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
    .tp-title { font-family: "Fraunces", Georgia, serif; font-size: 27px; font-weight: 600; color: var(--fg); line-height: 1.08; }
    .tp-body { font-family: "Inter", sans-serif; font-size: 13.5px; color: var(--fg-2); line-height: 1.5; }
    /* small edit affordance — shared by typography + colour */
    .lf-edit { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 4px; border: 0; cursor: pointer;
      background: var(--surface-2); color: var(--fg-2); font: inherit; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 99px;
      transition: background 130ms var(--ease), color 130ms var(--ease); }
    .lf-edit:hover { background: var(--sel); color: var(--fg); }
    .lf-edit i { font-size: 11px; }
    /* colour palette — an add (+) tile */
    .swatch-add { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; cursor: pointer;
      box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--fg-3); background: transparent; padding: 0;

    function dimsHTML() {

    function lexTokens(kind) {

    // re-render the voice panel after a structural change (chip / word add or delete) -----------
    function refreshVoice(focusNew, which) {
      var root = document.getElementById("voiceBody");
      if (!root) return;
      root.innerHTML = renderVoiceBody();
      if (!focusNew) return;
      var list = which.indexOf("lex:") === 0 ? root.querySelectorAll('.vtoks[data-lex="' + which.slice(4) + '"] .ltext')
        : root.querySelectorAll('.vchipset[data-set="' + which + '"] .ctext');
      var el = list[list.length - 1];
      if (!el) return;
      el.focus();
      var rng = document.createRange(); rng.selectNodeContents(el); rng.collapse(false);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);
    }

    // delegated listeners bound ONCE on the persistent #voiceBody (survive innerHTML swaps) ---
    function wireVoice() {
      var root = document.getElementById("voiceBody");
      if (!root || root._wired) return;
      root._wired = true;
      root.addEventListener("input", function (e) {
        var r = e.target.closest(".vrange"); if (!r) return;
        var k = r.getAttribute("data-dim"), v = +r.value;
        KIT.voice.dims[k] = v;
        var vdim = r.closest(".vdim");
        vdim.querySelector(".vline").style.background = trackBg(v);
        var ends = vdim.querySelector(".vdim-ends");
        ends.querySelector(".lo").classList.toggle("on", v < 2);
        ends.querySelector(".hi").classList.toggle("on", v >= 2);
        document.getElementById("vpFrame").innerHTML = voicePreviewSlide();
      });
      root.addEventListener("click", function (e) {
        var del = e.target.closest("[data-del]");
        if (del) { KIT.voice[del.getAttribute("data-del")].splice(+del.getAttribute("data-i"), 1); refreshVoice(); return; }
        var add = e.target.closest("[data-add]");
        if (add) { var s = add.getAttribute("data-add"); KIT.voice[s].push(""); refreshVoice(true, s); return; }
        var dellex = e.target.closest("[data-dellex]");
        if (dellex) { KIT.voice.lexicon[dellex.getAttribute("data-dellex")].splice(+dellex.getAttribute("data-i"), 1); refreshVoice(); return; }
        var addlex = e.target.closest("[data-addlex]");
        if (addlex) { var kind = addlex.getAttribute("data-addlex"); KIT.voice.lexicon[kind].push(""); refreshVoice(true, "lex:" + kind); }
      });
      root.addEventListener("blur", function (e) {
        var ct = e.target.closest(".ctext");
        if (ct) {
          var set = ct.getAttribute("data-set"), i = +ct.getAttribute("data-i"), val = ct.textContent.trim();
          if (!val) { KIT.voice[set].splice(i, 1); refreshVoice(); } else { KIT.voice[set][i] = val; }
          return;
        }
        var lt = e.target.closest(".ltext");
        if (lt) {
          var kind = lt.getAttribute("data-lex"), li = +lt.getAttribute("data-i"), lv = lt.textContent.trim();
          if (!lv) { KIT.voice.lexicon[kind].splice(li, 1); refreshVoice(); } else { KIT.voice.lexicon[kind][li] = lv; }
        }
      }, true);   // capture — blur doesn't bubble
      root.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
      });
    }

    }

    function acc(label, sum, body, open) {
      return '<section class="acc' + (open ? " open" : "") + '"><button class="acc-head"><i class="ph ph-caret-right acc-caret"></i>' +
        '<span class="acc-label">' + label + '</span><span class="acc-sum">' + sum + '</span></button>' +
        '<div class="acc-body"><div class="inner"><div class="acc-content">' + body + '</div></div></div></section>';
    }

    // ── kit modules: each renders its own body (filled or empty); CRUD is all in-memory ──
    var DEFAULT_FONTS = { title: "Fraunces", body: "Inter" };
    var LOGO_VARIANTS = [
      { cap: "Full colour", bg: "#fff", fg: KIT.color, cc: "#a3a3a3" },
      { cap: "On brand", bg: KIT.color, fg: "#fff", cc: "rgba(255,255,255,.6)" },
      { cap: "Mono dark", bg: "#fff", fg: "#111", cc: "#a3a3a3" },
      { cap: "Mono light", bg: "#1b1b1b", fg: "rgba(255,255,255,.92)", cc: "rgba(255,255,255,.5)" }
    ];
    function emptyState(icon, title, sub, cta, addKey) {
      return '<div class="empty"><div class="ei"><i class="ph ' + icon + '"></i></div>' +
        '<div class="et">' + title + '</div><div class="es">' + sub + '</div>' +
        '<button class="ecta" type="button" data-add="' + addKey + '"><i class="ph ph-plus"></i>' + cta + '</button></div>';
    }
    function typoRow(kind, label, font, cls, sample) {
      if (font) return '<div class="typo-row"><div class="tl">' + label + ' — ' + font +
        ' <button class="row-x" type="button" data-del="typo:' + kind + '" title="Remove font"><i class="ph ph-x"></i></button></div>' +
        '<div class="' + cls + '" style="font-family:\'' + font + '\'">' + sample + '</div></div>';
      return '<div class="typo-row"><button class="typo-ghost" type="button" data-add="typo:' + kind + '"><i class="ph ph-plus"></i>Add ' + label.toLowerCase() + ' font</button></div>';
    }
    function renderTypo() {
      var f = KIT.fonts, head = '<div class="sub">Typography</div>';
      if (!f.title && !f.body) return head + emptyState("ph-text-aa", "No fonts set",
        "Choose a title and body typeface, or let us pull them from your brand.", "Add fonts", "typo");
      return head + '<div class="typo-card">' +
        '<button class="lf-edit" type="button"><i class="ph ph-pencil-simple"></i>Edit</button>' +
        typoRow("title", "Title", f.title, "tp-title", "Built to last.") +
        typoRow("body", "Body", f.body, "tp-body", "Repairs keep good gear in use, not in landfill — that’s the whole idea.") +
        '</div>';
    }
    function renderColours() {
      var head = '<div class="sub">Colour palette</div>';
      if (!KIT.colors.length) return head + emptyState("ph-palette", "No colours yet",
        "Add the colours that define your brand, or pull them from your site.", "Add a colour", "colour");
      return head + '<div class="swatches">' +
        KIT.colors.map(function (c, i) {
          return '<span class="tile-wrap"><span class="swatch" style="background:' + c + '"></span>' +
            '<button class="tile-x" type="button" data-del="colour:' + i + '" title="Remove"><i class="ph ph-x"></i></button></span>';
        }).join("") +
        '<button class="swatch-add" type="button" data-add="colour" title="Add a colour"><i class="ph ph-plus"></i></button></div>';
    }
    function renderLogos() {
      if (!KIT.hasLogo) return emptyState("ph-image-square", "No logo yet",
        "Upload your logo — we’ll generate on-brand, mono and reversed variants automatically.", "Upload a logo", "logo");
      return '<div class="tiles">' + LOGO_VARIANTS.map(function (v) {
        return '<div class="logo-tile" style="background:' + v.bg + '"><span class="lm" style="background:' + v.fg + '"></span><span class="cap" style="color:' + v.cc + '">' + v.cap + '</span></div>';
      }).join("") + '</div>' +
      '<button class="mod-add" type="button" data-del="logo"><i class="ph ph-trash"></i>Remove logo</button>';
    }
    function renderDocs() {
      if (!DOCS.length) return emptyState("ph-files", "No documents yet",
        "Add brand books, past decks or internal docs — they power Brand knowledge for every deck.", "Add documents", "doc");
      return '<div class="kb-intro">The documents you added stay here — we keep pulling from them to inform every deck you make.</div>' +
        '<div class="kb-docs">' + DOCS.map(function (d, i) {
          return '<div class="kb-doc"><i class="ph ph-file-text"></i><span class="dn">' + d + '</span>' +
            '<button class="row-x" type="button" data-del="doc:' + i + '" title="Remove"><i class="ph ph-x"></i></button></div>';
        }).join("") + '</div>' +
        '<button class="mod-add" type="button" data-add="doc"><i class="ph ph-plus"></i>Add documents</button>';
    }
    function renderOrg() {
      if (!KIT.org.length) return emptyState("ph-identification-card", "No company info yet",
        "Add details like positioning, audience and proof points to ground the AI’s content.", "Add a field", "org");
      return '<div class="org-list">' + KIT.org.map(function (f, i) {
        return '<div class="org-row"><div class="ok" contenteditable="true" data-orgk="' + i + '">' + f.k + '</div>' +
          '<div class="ov" contenteditable="true" data-orgv="' + i + '">' + f.v + '</div>' +
          '<button class="row-x" type="button" data-del="org:' + i + '" title="Remove"><i class="ph ph-x"></i></button></div>';
      }).join("") + '</div>' +
      '<button class="mod-add" type="button" data-add="org"><i class="ph ph-plus"></i>Add a field</button>';
    }
    function renderImages() {
      if (!KIT.images.length) return emptyState("ph-images", "No images yet",
        "Upload brand photography, or scrape your site to build an image library.", "Add images", "image");
      return '<div class="asset-grid">' + KIT.images.map(function (seed, i) {
        return '<span class="tile-wrap asset-wrap"><img class="asset" loading="lazy" alt="" src="https://picsum.photos/seed/' + seed + '/200" onerror="this.style.opacity=.4;this.removeAttribute(\'src\')">' +
          '<button class="tile-x" type="button" data-del="image:' + i + '" title="Remove"><i class="ph ph-x"></i></button></span>';
      }).join("") + '</div>' +
      '<button class="mod-add" type="button" data-add="image"><i class="ph ph-plus"></i>Add images</button>';
    }
    var ACT2MOD = { colour: "colours", doc: "docs", org: "org", image: "images", logo: "logos", typo: "typo" };
    var MODB = { typo: renderTypo, colours: renderColours, logos: renderLogos, docs: renderDocs, org: renderOrg, images: renderImages };
    function refreshMod(id) { var el = document.getElementById("mod-" + id); if (el) el.innerHTML = MODB[id](); }
    function kitAdd(a) {
      var p = a.split(":"), k = p[0];
      if (k === "colour") KIT.colors.push("#8A8F98");
      else if (k === "doc") DOCS.push("New document.pdf");
      else if (k === "image") KIT.images.push("add" + (KIT.images.length + 1) + "x" + KIT.colors.length);
      else if (k === "logo") KIT.hasLogo = true;
      else if (k === "org") KIT.org.push({ k: "New field", v: "" });
      else if (k === "typo") {
        if (p[1] === "title") KIT.fonts.title = DEFAULT_FONTS.title;
        else if (p[1] === "body") KIT.fonts.body = DEFAULT_FONTS.body;
        else { KIT.fonts.title = DEFAULT_FONTS.title; KIT.fonts.body = DEFAULT_FONTS.body; }
      } else return;
      refreshMod(ACT2MOD[k]);
    }
    function kitDel(a) {
      var p = a.split(":"), k = p[0], id = p[1];
      if (k === "colour") KIT.colors.splice(+id, 1);
      else if (k === "doc") DOCS.splice(+id, 1);
      else if (k === "image") KIT.images.splice(+id, 1);
      else if (k === "org") KIT.org.splice(+id, 1);
      else if (k === "logo") KIT.hasLogo = false;
      else if (k === "typo") { if (id === "title") KIT.fonts.title = ""; else if (id === "body") KIT.fonts.body = ""; }
      else return;
      refreshMod(ACT2MOD[k]);
    }

    function renderLanded() {
      var deck = SAMPLE.map(function (s) { return '<div class="ss">' + slide(s) + '</div>'; }).join("");

      // look & feel — typography + colour modules (each re-renderable), then the sample deck
      var lf = '<div class="lf2"><div class="lf-top">' +
          '<div class="lf-block" id="mod-typo">' + renderTypo() + '</div>' +
          '<div class="lf-block" id="mod-colours">' + renderColours() + '</div>' +
        '</div>' +
        '<div class="lf-deck"><div class="sub">A sample deck in this mood</div><div class="deck">' + deck + '</div></div></div>';

      var voices = '<div id="voiceBody" style="--vacc:' + KIT.color + '">' + renderVoiceBody() + '</div>';
      var dots = '<span class="dots">' + KIT.colors.slice(0,5).map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + '</span>';

      stage.innerHTML = '<div class="landed">' +
        '<div class="lhead"><div><h1 class="lh-title">Your brand kit is ready</h1>' +
          '<div class="lh-sub">Built from your site — here’s the look &amp; feel, voice, logos and more.</div></div></div>' +
        '<div class="accs">' +
          acc("Look &amp; feel", '<span class="moodbit"></span>Editorial · Fraunces ' + dots, lf, true) +
          acc("Brand voice", "Plainspoken · Principled · Rugged", voices, false) +
          acc("Logos", "4 variants", '<div id="mod-logos">' + renderLogos() + '</div>', false) +
          acc('Brand knowledge <span class="tag-gold"><i class="ph-fill ph-crown-simple"></i>Gold</span>', DOCS.length + ' documents', '<div id="mod-docs">' + renderDocs() + '</div>', false) +
          acc("Org info", "Company · positioning · proof…", '<div id="mod-org">' + renderOrg() + '</div>', false) +
          acc("Images", KIT.images.length + ' images', '<div id="mod-images">' + renderImages() + '</div>', false) +
        '</div></div>';

      var accsEl = stage.querySelector(".accs");
      accsEl.addEventListener("click", function (e) {
        var crud = e.target.closest("[data-add],[data-del]");
        if (crud && !crud.closest("#voiceBody")) {     // kit CRUD — voice panel handles its own
          e.stopPropagation();
          var add = crud.getAttribute("data-add");
          if (add) kitAdd(add); else kitDel(crud.getAttribute("data-del"));
          return;
        }
        var h = e.target.closest(".acc-head"); if (h) h.parentNode.classList.toggle("open");
      });
      accsEl.addEventListener("blur", function (e) {   // org inline edits (capture — blur doesn't bubble)
        var ov = e.target.closest("[data-orgv]"); if (ov) { KIT.org[+ov.getAttribute("data-orgv")].v = ov.textContent.trim(); return; }
        var ok = e.target.closest("[data-orgk]"); if (ok) { KIT.org[+ok.getAttribute("data-orgk")].k = ok.textContent.trim(); }
      }, true);
      accsEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target.isContentEditable && e.target.closest(".org-row")) { e.preventDefault(); e.target.blur(); }
      });
      wireVoice();   // voice panel binds its own delegated listeners on #voiceBody
    }

    function render() {
      renderSidebar();
      if (STATE === "zero") renderZero();
      else if (STATE === "pricing") renderPricing();
      else if (STATE === "extracting") renderExtracting();
      else renderLanded();
      stage.scrollTop = 0;
    }
    render();
  </script>
</body>
</html>
