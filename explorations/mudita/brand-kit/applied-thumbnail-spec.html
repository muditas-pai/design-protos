<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>" />
  <title>Applied thumbnail — spec · design-protos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../design-system/pai.tailwind.js"></script>
  <link rel="stylesheet" href="../../../design-system/pai.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #F4F5F7; -webkit-font-smoothing: antialiased; }
    .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-secondary);
      margin-bottom: 18px; transition: color 150ms var(--ease-out-strong); }
    .back:hover { color: var(--text-primary); }
    .meta { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; flex-wrap: wrap; }
    .meta a { color: var(--text-brand); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    /* neutral status pill — this is a scoping doc, not eng-ready */
    .tag-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
      line-height: 1; color: #475569; background: rgba(71,85,105,0.12); padding: 3px 8px; border-radius: 999px; }
    .tag-status i { font-size: 11px; }
    /* document surface */
    .doc { background: var(--bg-elevated); border-radius: 14px; box-shadow: var(--shadow-elevation-02); padding: 30px 36px; }
    /* rendered markdown */
    .md-body { color: var(--text-primary); font-size: 15px; line-height: 1.62; text-wrap: pretty; }
    .md-body > :first-child { margin-top: 0; }
    .md-body h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; }
    .md-body h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-tertiary); margin: 34px 0 10px; }
    .md-body h3 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; }
    .md-body p { margin: 10px 0; }
    .md-body ul, .md-body ol { margin: 10px 0; padding-left: 22px; }
    .md-body li { margin: 5px 0; }
    .md-body strong { font-weight: 600; }
    .md-body hr { border: 0; border-top: 1px solid var(--border-secondary); margin: 26px 0; }
    .md-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
      background: var(--bg-tertiary); padding: 1.5px 5px; border-radius: 5px; }
    .md-body pre { background: var(--bg-tertiary); padding: 16px 18px; border-radius: 10px; overflow: auto;
      line-height: 1.5; }
    .md-body pre code { background: none; padding: 0; font-size: 12.5px; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
    .md-body th, .md-body td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--border-secondary); vertical-align: top; }
    .md-body th { font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border-primary); }
    .md-body tr:last-child td { border-bottom: 0; }
    .md-body a { color: var(--text-brand); }
  </style>
</head>
<body class="pai">
  <main style="max-width: 780px; margin: 0 auto; padding: 48px 24px 96px;">
    <a class="back text-body-sm-medium" href="../index.html"><i class="ph ph-arrow-left"></i>Mudita</a>
    <div class="meta">
      <span class="tag-status"><i class="ph ph-compass"></i>Spec</span>
      <a class="text-body-sm-medium" href="editor-theme-panel.html">Proto ↗</a>
      <a class="text-body-sm-medium" href="grounding.html">Grounding ↗</a>
      <a class="text-body-sm-medium" href="applied-thumbnail-spec.md">Raw .md ↗</a>
    </div>
    <div class="doc"><div class="md-body" id="md">Loading spec…</div></div>
  </main>

  <script>
    // Renders the sibling markdown so the .md stays the single source of truth.
    var DOC = "./applied-thumbnail-spec.md";
    var el = document.getElementById("md");
    fetch(DOC)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) {
        el.innerHTML = marked.parse(t);
        var h1 = el.querySelector("h1");
        if (h1) document.title = h1.textContent + " · design-protos";
      })
      .catch(function () {
        el.innerHTML = '<p>Couldn’t load the markdown here — browsers block <code>file://</code> fetches. ' +
          'View this page on <a href="https://muditas-pai.github.io/design-protos/">GitHub Pages</a>, ' +
          'or open <a href="' + DOC + '">the raw .md</a>.</p>';
      });
  </script>
</body>
</html>
