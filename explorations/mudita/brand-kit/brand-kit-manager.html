<!DOCTYPE html>
<!-- exploration · brand-kit manager (dashboard touchpoint) · filled state · Mudita · 9 Jun 2026
     shell reused from key-screens/dashboard.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>" />
  <title>Brand Kits · design-protos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Inter+Tight:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --surface-2: #f5f5f5;
      --fg: #171717; --fg-2: #525252; --fg-3: #a3a3a3;
      --brand: #005eff; --brand-tint: #e6efff;
      --brand-100: #b6daff; --brand-300: #0095ff; --brand-600: #0059ff; --brand-900: #002464;
      --brand-gradient: radial-gradient(162.36% 178.84% at 13.64% -1.28%,
        var(--brand-100) 0%, var(--brand-300) 31.73%, var(--brand-600) 76.78%, var(--brand-900) 100%);
      --ink: #0b0f14;
      --line: rgba(11,15,20,0.09); --line-strong: rgba(11,15,20,0.20);
      --sel: rgba(22,30,39,0.08);
      --d1: rgba(11,15,20,0.06); --d2: rgba(11,15,20,0.09); --inner: rgba(255,255,255,0.8);
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
      --gold: #f5a623;
      --sh-card: 0 1px 2px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
      --sh-card-hover: 0 8px 24px -6px var(--d2), 0 2px 6px 0 var(--d2), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
      --sh-btn: 0 1px 2px 1px var(--d1), 0 0 0 1px var(--d2), inset 0 0 0 1px var(--inner);
    }
    @supports (color: color(display-p3 1 1 1)) {
      :root { --brand-100: color(display-p3 0.7608 0.8471 1); --brand-300: color(display-p3 0.3216 0.5686 1);
        --brand-600: color(display-p3 0 0.3333 0.9294); --brand-900: color(display-p3 0 0.1333 0.3608); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased; }
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ── sidebar (from dashboard) ─────────────────────────────────────────── */
    .sidebar { width: 260px; min-width: 260px; background: var(--bg); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; }
    .ws { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    .ws-avatar { width: 28px; height: 28px; border-radius: 5px; flex-shrink: 0;
      background: linear-gradient(135deg, #5b53e0, #322c9e); box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--line);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
    .ws-name { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-flex; align-items: center; justify-content: center; background: var(--brand-tint);
      color: var(--brand); font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 34px; line-height: 1.33; }
    .ws .caret { color: var(--fg-2); font-size: 18px; }
    .nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-label { padding: 8px 8px 2px; color: var(--fg-2); }
    .nav-item { display: flex; align-items: center; gap: 8px; height: 36px; padding: 8px; border-radius: 6px;
      color: var(--fg-2); cursor: pointer; text-decoration: none; transition: background 140ms var(--ease); }
    .nav-item i { font-size: 20px; flex-shrink: 0; }
    .nav-item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-item:hover { background: var(--sel); }
    .nav-item.is-active { background: var(--sel); color: var(--fg); font-weight: 600; }
    .divider { height: 1px; background: var(--line); margin: 6px 0; box-shadow: 0 1px 0 0 var(--inner); }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 8px; }

    /* ── main / topbar ────────────────────────────────────────────────────── */
    .main { flex: 1; min-width: 0; height: 100%; background: var(--surface);
      display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end;
      gap: 10px; padding: 0 24px; }
    .trial { display: flex; align-items: center; gap: 8px; height: 36px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 6px; padding: 4px 4px 4px 10px; }
    .trial-text { font-weight: 500; white-space: nowrap; }
    .btn-upgrade { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 14px;
      background: var(--brand); color: #fff; border: 0; border-radius: 4px; font: 500 14px "Inter"; cursor: pointer; }
    .btn-upgrade i { font-size: 16px; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent;
      color: var(--fg-2); border-radius: 4px; cursor: pointer; font-size: 20px; transition: background 140ms var(--ease); }
    .icon-btn:hover { background: var(--sel); }
    .avatar { width: 28px; height: 28px; border-radius: 999px; margin-left: 4px; flex-shrink: 0;
      background: url("https://i.pravatar.cc/56?img=12") center/cover, var(--surface-2);
      box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--line); }

    /* ── brand-kits: the sidebar IS the kit nav; main = detail ────────────── */
    .back-home { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 16px; color: var(--fg-2);
      text-decoration: none; font: 500 13px "Inter"; border: 0; border-bottom: 1px solid var(--line);
      background: none; text-align: left; cursor: pointer; transition: color 130ms var(--ease); }
    .back-home i { font-size: 16px; }
    .back-home:hover { color: var(--fg); }
    .bk-rail-head { padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
    .bk-rail-head .t { font-size: 15px; font-weight: 600; }
    .bk-rail-head .t #kitCount { color: var(--fg-3); font-weight: 500; margin-left: 6px; }
    .btn-new { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 8px;
      background: var(--ink); color: #fff; border: 0; border-radius: 6px; font: 500 12px "Inter"; cursor: pointer;
      transition: transform 120ms var(--ease), filter 120ms var(--ease); }
    .btn-new i { font-size: 14px; }
    .btn-new:hover { filter: brightness(1.25); } .btn-new:active { transform: scale(0.97); }
    .kit-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .kit-row { display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 10px; cursor: pointer;
      transition: background 130ms var(--ease); }
    .kit-row:hover { background: var(--sel); }
    .kit-row.active { background: var(--sel); }
    .kit-row.active .name { color: var(--fg); }
    .mark { width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden; }
    .mark.pictogram { background: var(--surface-2); color: var(--fg-3); }
    .mark.pictogram i { font-size: 19px; }
    .kit-row .name { flex: 1; min-width: 0; font-weight: 500; color: var(--fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kit-row .star { color: var(--gold); font-size: 14px; flex-shrink: 0; }

    /* detail */
    .bk-detail { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; }
    .kit-head { display: flex; align-items: center; gap: 16px; padding: 26px 32px 20px; }
    .mark-lg { width: 56px; height: 56px; border-radius: 13px; flex-shrink: 0; display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 24px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden; }
    .mark-lg.pictogram { background: var(--surface-2); color: var(--fg-3); }
    .mark-lg.pictogram i { font-size: 28px; }
    .kit-head .htext h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    .kit-head .htext .row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .badge-default { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-tint);
      color: var(--brand); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
    .badge-default i { font-size: 11px; }
    .link-btn { background: none; border: 0; color: var(--fg-2); font: 500 12px "Inter"; cursor: pointer;
      padding: 0; transition: color 120ms var(--ease); }
    .link-btn:hover { color: var(--fg); }
    .kit-head .spacer { flex: 1; }
    .kit-head .more { width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent;
      color: var(--fg-2); cursor: pointer; font-size: 20px; display: grid; place-items: center; }
    .kit-head .more:hover { background: var(--sel); }

    /* accordions */
    .accs { padding: 4px 32px 56px; }
    .acc { border-top: 1px solid var(--line); }
    .acc:last-child { border-bottom: 1px solid var(--line); }
    .acc-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 16px 2px; background: none;
      border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--fg); }
    .acc-caret { font-size: 13px; color: var(--fg-3); transition: transform 220ms var(--ease); }
    .acc.open .acc-caret { transform: rotate(90deg); }
    .acc-label { font-weight: 600; }
    .acc-sum { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--fg-2);
      font-size: 12px; min-width: 0; }
    .acc-sum .dots { display: inline-flex; gap: 3px; }
    .acc-sum .dots i { width: 11px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .acc-sum .chips { display: inline-flex; gap: 4px; }
    .acc-sum .chips i { width: 22px; height: 15px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);
      background-size: cover; }
    .acc-sum .moodthumb { width: 26px; border-radius: 3px; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10); flex-shrink: 0; }
    .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 280ms var(--ease); }
    .acc.open .acc-body { grid-template-rows: 1fr; }
    .acc-body > .inner { overflow: hidden; }
    .acc-content { padding: 2px 2px 24px 26px; }

    /* org info */
    .org-text { background: var(--surface-2); border-radius: 12px; padding: 16px 18px; line-height: 1.62;
      font-size: 14px; max-width: 660px; color: var(--fg); }
    .field-foot { display: flex; gap: 12px; margin-top: 10px; }

    /* look & feel */
    .lf { display: flex; gap: 28px; flex-wrap: wrap; }
    .lf-controls { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; max-width: 460px; }
    .sub { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg-3);
      margin-bottom: 8px; }
    .mood-row { display: flex; align-items: center; gap: 12px; }
    .mood-thumb { width: 96px; border-radius: 8px; overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--line); flex-shrink: 0; }
    .mood-row .mname { font-weight: 600; } .mood-row .msub { font-size: 12px; color: var(--fg-2); margin-top: 1px; }
    .pill-btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px;
      background: var(--surface); border-radius: 8px; box-shadow: var(--sh-btn); font: 500 12px "Inter";
      color: var(--fg); cursor: pointer; transition: background 130ms var(--ease); }
    .pill-btn:hover { background: var(--surface-2); }
    .pill-btn i { font-size: 14px; color: var(--fg-2); }
    .font-row { display: flex; gap: 10px; }
    .font-card { flex: 1; background: var(--surface); border-radius: 10px; box-shadow: var(--sh-btn);
      padding: 12px 14px; }
    .font-card .glyph { font-size: 26px; line-height: 1; color: var(--fg); }
    .font-card .fl { font-size: 11px; color: var(--fg-3); margin-top: 8px; }
    .font-card .fn { font-size: 13px; font-weight: 500; margin-top: 1px; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .swatch { width: 34px; height: 34px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10); }
    .swatch.add { display: grid; place-items: center; background: var(--surface); box-shadow: var(--sh-btn);
      color: var(--fg-3); cursor: pointer; font-size: 16px; }
    .lf-preview { width: 320px; flex-shrink: 0; }
    .lf-preview .cap { font-size: 11px; color: var(--fg-3); margin-bottom: 8px; }
    .lf-preview .frame { border-radius: 12px; overflow: hidden; box-shadow: var(--sh-card); }

    /* ── mood slides: realistic mini-slides drawn at 320×180 inside an SVG
       <foreignObject> and scaled by the viewBox — crisp at any thumbnail size,
       HTML text still wraps. Tinted with the kit palette (--brand/--c1/--c2) + --tf. */
    .mslide-svg { display: block; width: 100%; height: auto; }
    .ms { width: 320px; height: 180px; position: relative; overflow: hidden; box-sizing: border-box;
      font-family: "Inter", sans-serif; }
    .ms .eb { position: absolute; z-index: 2; font-weight: 600; }
    .ms .hd { position: relative; z-index: 2; }
    /* Classic — editorial title slide on the brand colour */
    .ms.classic { background: var(--brand); color: #fff; padding: 26px 30px; display: flex; flex-direction: column; justify-content: center; }
    .ms.classic .eb { top: 22px; left: 30px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.82; }
    .ms.classic .hd { font-family: var(--tf), serif; font-weight: 700; font-size: 32px; line-height: 1.04; }
    .ms.classic .rl { position: relative; z-index: 2; width: 64px; height: 4px; background: rgba(255,255,255,0.9); margin-top: 13px; }
    .ms.classic .pg { position: absolute; z-index: 2; bottom: 20px; right: 30px; font-size: 10px; opacity: 0.7; }
    .ms.classic .orb { position: absolute; z-index: 1; right: -30px; top: -44px; width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    /* Mono — dark canvas, grotesk, minimal */
    .ms.mono { background: #0b0b0d; color: #fff; padding: 26px 30px; display: flex; flex-direction: column; justify-content: flex-end; }
    .ms.mono .grid { position: absolute; z-index: 0; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 40px); }
    .ms.mono .eb { top: 22px; left: 30px; font-size: 10px; letter-spacing: 1.6px; color: rgba(255,255,255,0.5); }
    .ms.mono .hd { font-family: var(--tf), sans-serif; font-weight: 700; font-size: 36px; line-height: 1.0; letter-spacing: -0.6px; }
    .ms.mono .ac { position: relative; z-index: 2; width: 42px; height: 5px; background: var(--c2); margin-top: 12px; }
    /* Minimal — white, airy, an accent dot */
    .ms.minimal { background: #fff; color: #11343f; padding: 26px 30px; display: flex; flex-direction: column; justify-content: center; }
    .ms.minimal .eb { top: 24px; left: 30px; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase; color: #9aaab2; }
    .ms.minimal .hd { font-family: var(--tf), sans-serif; font-weight: 600; font-size: 27px; line-height: 1.16; color: var(--brand); max-width: 76%; }
    .ms.minimal .dot { position: absolute; z-index: 2; top: 26px; right: 30px; width: 15px; height: 15px; border-radius: 50%; background: var(--brand); }
    .ms.minimal .rl { position: relative; z-index: 2; width: 46px; height: 4px; background: var(--c1); margin-top: 14px; }

    /* logos */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 660px; }
    .logo-tile { aspect-ratio: 16/10; border-radius: 12px; display: grid; place-items: center; position: relative;
      box-shadow: inset 0 0 0 1px var(--line); }
    .logo-tile .wm { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
    /* a single-path brand logo, recolored per variant via mask + background-color */
    .logo-mask { display: block; width: 74%; height: 52%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
    .logo-mask-tile { width: 62%; height: 46%; }
    .logo-tile .cap { position: absolute; bottom: 7px; left: 10px; font-size: 10px; }
    .tile-add { aspect-ratio: 16/10; border-radius: 12px; border: 1px dashed var(--line-strong); display: grid;
      place-items: center; color: var(--fg-3); cursor: pointer; gap: 4px; background: var(--surface); }
    .tile-add i { font-size: 18px; } .tile-add span { font-size: 11px; }
    .empty { color: var(--fg-2); font-size: 13px; background: var(--surface-2); border-radius: 12px;
      padding: 14px 16px; max-width: 660px; display: flex; align-items: center; gap: 10px; }
    .empty i { font-size: 18px; color: var(--fg-3); }

    /* voices */
    .voice { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border-radius: 12px;
      box-shadow: var(--sh-card); margin-bottom: 10px; max-width: 660px; }
    .voice .vi { width: 30px; height: 30px; border-radius: 8px; background: var(--brand-tint); color: var(--brand);
      display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
    .voice .vname { font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .voice .vname .star { color: var(--gold); font-size: 12px; }
    .voice .vdesc { color: var(--fg-2); font-size: 13px; margin-top: 2px; line-height: 1.45; }
    .voice .vmore { color: var(--fg-3); font-size: 18px; cursor: pointer; }
    .add-row { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 13px;
      font-weight: 500; cursor: pointer; padding: 8px 2px; }
    .add-row i { font-size: 16px; }

    /* templates + assets */
    .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; max-width: 760px; }
    .tpl { border-radius: 10px; overflow: hidden; box-shadow: var(--sh-card); cursor: pointer;
      transition: transform 160ms var(--ease), box-shadow 200ms var(--ease); }
    .tpl:hover { transform: translateY(-2px); box-shadow: var(--sh-card-hover); }
    .tcover { position: relative; }
    .tpl .tname { padding: 8px 11px; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 10px; max-width: 760px; }
    .asset { aspect-ratio: 1; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); object-fit: cover;
      display: block; width: 100%; background-size: cover; background-position: center; }
    .viewall { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--brand);
      font-size: 13px; font-weight: 500; cursor: pointer; }
    .viewall i { font-size: 15px; }

    /* plan tags */
    .tag-pro { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
      text-transform: uppercase; color: var(--brand); background: var(--brand-tint); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }
    .tag-gold { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
      text-transform: uppercase; color: #8a5a00; background: rgba(245,166,35,0.18); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }
    .tag-gold i { font-size: 10px; }

    /* org info — structured blocks */
    .org-grid { display: grid; grid-template-columns: 152px 1fr; gap: 3px 16px; max-width: 680px; font-size: 13.5px; }
    .org-grid dt { color: var(--fg-3); font-weight: 500; padding: 5px 0; }
    .org-grid dd { margin: 0; padding: 5px 0; color: var(--fg); }

    /* brand voice — authentic + presentation levers + live preview */
    .bv { display: flex; gap: 28px; flex-wrap: wrap; }
    .bv-controls { flex: 1; min-width: 330px; max-width: 540px; display: flex; flex-direction: column; gap: 20px; }
    .vchips { display: flex; gap: 6px; flex-wrap: wrap; }
    .vchip { padding: 4px 10px; border-radius: 99px; background: var(--surface-2); font-size: 12px; font-weight: 500; }
    .vex { color: var(--fg); font-size: 14px; font-style: italic; line-height: 1.5; margin-top: 10px; }
    .vavoid { color: var(--fg-2); font-size: 12.5px; margin-top: 8px; }
    .vavoid b { color: var(--fg-3); font-weight: 600; }
    .lever-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
    .lever-row .ll { width: 96px; font-size: 12px; color: var(--fg-2); font-weight: 500; flex-shrink: 0; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; }
    .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font: 500 12px "Inter"; color: var(--fg-2);
      cursor: pointer; transition: background 120ms var(--ease); }
    .seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--sh-btn); }
    .bv-preview { width: 320px; flex-shrink: 0; }
    .bv-preview .cap { font-size: 11px; color: var(--fg-3); margin-bottom: 8px; }
    .bv-preview .frame { border-radius: 12px; overflow: hidden; box-shadow: var(--sh-card); }
    /* the preview content-slide (re-renders from the levers) */
    .vp { width: 320px; height: 180px; background: #fff; padding: 22px 24px; box-sizing: border-box; position: relative;
      overflow: hidden; display: flex; flex-direction: column; }
    .vp .eb { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--vbrand); font-weight: 700; margin-bottom: 8px; }
    .vp .ti { font-family: var(--vtf), sans-serif; color: var(--vbrand); font-weight: 700; font-size: 19px; line-height: 1.12; }
    .vp .st { color: #6b6b6b; font-size: 11px; margin-top: 5px; }
    .vp ul { margin: 11px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .vp li { font-size: 11px; color: #2a2a2a; padding-left: 13px; position: relative; line-height: 1.3; }
    .vp li::before { content: ""; position: absolute; left: 0; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--vbrand); }

    /* brand knowledge (Gold) */
    .kb-intro { color: var(--fg-2); font-size: 13.5px; line-height: 1.55; max-width: 640px; margin-bottom: 14px; }
    .kb-docs { display: flex; flex-direction: column; gap: 8px; max-width: 640px; margin-bottom: 12px; }
    .kb-doc { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 10px; box-shadow: var(--sh-card); }
    .kb-doc > i { color: var(--fg-2); font-size: 18px; }
    .kb-doc .dn { flex: 1; font-size: 13px; font-weight: 500; }
    .kb-doc .dx { color: var(--fg-3); font-size: 16px; cursor: pointer; }
    .kb-drop { border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 16px; text-align: center;
      color: var(--fg-2); font-size: 13px; cursor: pointer; max-width: 640px; }
    .kb-drop i { font-size: 18px; color: var(--fg-3); display: block; margin-bottom: 6px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- sidebar -->
    <aside class="sidebar">
      <div class="ws">
        <div class="ws-avatar">A</div><span class="ws-name">Atlas Studio</span>

      <button class="back-home" type="button"><i class="ph ph-arrow-left"></i>Back to Home</button>

        <div class="t">Brand Kits <span id="kitCount"></span> <span class="tag-pro">Pro</span></div>

        </nav>
      </div>
    </aside>

    <!-- main -->
    <main class="main">

          <button class="btn-upgrade"><i class="ph ph-rocket-launch"></i>Upgrade</button></div>
        <button class="icon-btn"><i class="ph ph-magnifying-glass"></i></button>
        <button class="icon-btn"><i class="ph ph-question"></i></button>

        <div class="avatar"></div>

      <div class="bk-detail" id="kitDetail"></div>
    </main>
  </div>

  <script>
    var INK = "#0b0f14";
    // gradient helpers for mock covers / assets
    function g(a, b) { return "linear-gradient(135deg," + a + "," + b + ")"; }

    var KITS = [
      {
        id: "coke", name: "Coca-Cola", color: "#E61A27", initial: "C", logo: "assets/coca-cola.svg", isDefault: true,
        org: {
          "Company": "Coca-Cola — the world's most recognized beverage brand",
          "Field": "Beverages · CPG",
          "Who you serve": "Consumers worldwide; retail & bottling partners",
          "Tagline": "Real Magic.",
          "Positioning": "Moments of happiness and refreshment.",
          "Proof points": "200+ countries · 1.9B servings a day · #1 brand recall"
        },
        mood: { name: "Classic", sub: "Red canvas · confident wordmark" },
        fonts: { title: "Montserrat", body: "Inter" },
        colors: ["#E61A27", "#000000", "#FFFFFF", "#F40009", "#F7CED0"],
        logos: true,
        voice: {
          traits: ["Optimistic", "Inclusive", "Warm"],
          example: "“There's a Coke for that.”",
          avoid: "cynicism · jargon · negativity",
          levers: { title: "takeaway", case: "title", section: "editorial", body: "balanced", bullet: "fragments", lead: "free" }
        },
        knowledge: { count: 14, docs: ["Masterbrand Guidelines 2026.pdf", "Q4 Earnings.pdf", "Sustainability Report 2025.pdf", "Global Brand Playbook.pdf"] },
        templates: [
          { t: "Masterbrand Guidelines", grad: g("#E61A27", "#9c0d18") },
          { t: "‘Real Magic’ Campaign Launch", grad: g("#F40009", "#7a0b12") },
          { t: "Retail & Channel Deck", grad: g("#111111", "#3a0a0d") },
          { t: "Sustainability Report", grad: g("#1c1917", "#3a352f") },
          { t: "Investor Update", grad: g("#5a0c12", "#1a0405") }
        ],
        assetCount: 24
      },
      {
        id: "patagonia", name: "Patagonia", color: "#1F4A38", initial: "P", logo: "assets/patagonia.svg", isDefault: false,
        org: {
          "Company": "Patagonia — outdoor apparel & gear",
          "Field": "Apparel · outdoor · retail",
          "Who you serve": "Consumers; outdoor & climbing communities",
          "Tagline": "Don't buy this jacket.",
          "Positioning": "In business to save our home planet.",
          "Proof points": "1% for the Planet since 1985 · B-Corp · Worn Wear"
        },
        mood: { name: "Editorial", sub: "Earthy canvas · serif headlines" },
        fonts: { title: "Fraunces", body: "Inter" },
        colors: ["#1F4A38", "#3E7C5E", "#E4DAC4", "#2A2A26", "#FFFFFF"],
        logos: true,
        voice: {
          traits: ["Plainspoken", "Principled", "Rugged"],
          example: "“The cleanest shirt is the one you already own.”",
          avoid: "hype · greenwashing · superlatives",
          levers: { title: "topic", case: "sentence", section: "minimal", body: "sparse", bullet: "fragments", lead: "metric" }
        },
        knowledge: { count: 9, docs: ["2025 Impact Report.pdf", "Worn Wear Playbook.pdf", "Materials & Supply Chain.pdf"] },
        templates: [
          { t: "Brand Guidelines", grad: g("#1F4A38", "#0e2a20") },
          { t: "Worn Wear Campaign", grad: g("#3E7C5E", "#1f4030") },
          { t: "Environmental Impact Report", grad: g("#2A2A26", "#14140f") },
          { t: "Retail Lookbook", grad: g("#9C6B3F", "#5a3a1f") }
        ],
        assetCount: 20
      },
      {
        id: "smartwater", name: "smartwater", color: "#0095D9", initial: "s", isDefault: false,
        org: {
          "Company": "smartwater — premium vapour-distilled water",
          "Field": "Beverages · premium water",
          "Who you serve": "Consumers; premium & wellness retail",
          "Positioning": "Clean, modern, aspirational."
        },
        mood: { name: "Minimal", sub: "White space · cool blue accents" },
        fonts: { title: "Inter Tight", body: "Inter" },
        colors: ["#0095D9", "#7FD3F2", "#1B2A33", "#FFFFFF", "#E6F4FB"],
        logos: false,                 // ← not set up yet → pictogram identity + empty logos state
        voice: {
          traits: ["Clean", "Modern", "Confident"],
          example: "“Distilled. Simply.”",
          avoid: "clutter · hyperbole",
          levers: { title: "topic", case: "sentence", section: "minimal", body: "sparse", bullet: "fragments", lead: "free" }
        },
        knowledge: { count: 0, docs: [] },
        templates: [
          { t: "Brand Story", grad: g("#0095D9", "#055e86") },
          { t: "Retail One-Pager", grad: g("#1B2A33", "#0a151b") },
          { t: "Wellness Partnership", grad: g("#7FD3F2", "#0095D9") }
        ],
        assetCount: 6
      }
    ];

    var ASSET_GRADS = [
      g("#3b82f6","#1e3a8a"), g("#f59e0b","#b45309"), g("#10b981","#065f46"), g("#ef4444","#7f1d1d"),
      g("#8b5cf6","#4c1d95"), g("#06b6d4","#155e75"), g("#ec4899","#831843"), g("#64748b","#1e293b"),
      g("#84cc16","#3f6212"), g("#f97316","#7c2d12")
    ];

    var sel = "coke";

    function markEl(kit, cls) {
      if (kit.logo) return '<div class="' + cls + '" style="background:' + kit.color + '">' +
        '<span class="logo-mask" style="-webkit-mask-image:url(' + kit.logo + ');mask-image:url(' + kit.logo + ');background-color:#fff"></span></div>';
      if (kit.logos) return '<div class="' + cls + '" style="background:' + kit.color + '">' + kit.initial + '</div>';
      return '<div class="' + cls + ' pictogram"><i class="ph ph-swatches"></i></div>';
    }

    function renderRail() {
      document.getElementById("kitCount").textContent = KITS.length;
      document.getElementById("kitList").innerHTML = KITS.map(function (k) {
        return '<div class="kit-row' + (k.id === sel ? " active" : "") + '" data-kit="' + k.id + '">' +
          markEl(k, "mark") +
          '<span class="name">' + k.name + '</span>' +
          (k.isDefault ? '<i class="ph-fill ph-star star" title="Default"></i>' : '') +
        '</div>';
      }).join("");
    }

    function acc(label, sumHtml, bodyHtml, open) {
      return '<section class="acc' + (open ? " open" : "") + '">' +
        '<button class="acc-head"><i class="ph ph-caret-right acc-caret"></i>' +
        '<span class="acc-label">' + label + '</span>' +
        '<span class="acc-sum">' + sumHtml + '</span></button>' +
        '<div class="acc-body"><div class="inner"><div class="acc-content">' + bodyHtml + '</div></div></div>' +
      '</section>';
    }
    function dots(colors) { return '<span class="dots">' + colors.slice(0,5).map(function(c){return '<i style="background:'+c+'"></i>';}).join("") + '</span>'; }

    // A realistic mini-slide reflecting the kit's mood, tinted with its palette + title font.
    function slideHTML(kit, opts) {
      opts = opts || {};
      var m = (kit.mood.name || "").toLowerCase();
      var cls = m === "mono" ? "mono" : m === "minimal" ? "minimal" : "classic";
      var c = kit.colors;
      var st = "--brand:" + kit.color + ";--tf:" + kit.fonts.title +
        ";--c1:" + (c[1] || kit.color) + ";--c2:" + (c[2] || c[1] || kit.color);
      var eb = opts.eyebrow != null ? opts.eyebrow : kit.name;
      var hd = opts.title != null ? opts.title : "A headline set in the brand voice";
      var deco = cls === "classic" ? '<div class="orb"></div><div class="rl"></div><div class="pg">01</div>'
               : cls === "mono" ? '<div class="grid"></div><div class="ac"></div>'
               : '<div class="dot"></div><div class="rl"></div>';
      return '<svg class="mslide-svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
        '<foreignObject x="0" y="0" width="320" height="180">' +
        '<div xmlns="http://www.w3.org/1999/xhtml" class="ms ' + cls + '" style="' + st + '">' +
        '<div class="eb">' + eb + '</div><div class="hd">' + hd + '</div>' + deco + '</div>' +
        '</foreignObject></svg>';
    }

    // ── brand-voice live preview: a content slide rewritten from the levers ──
    var VP_BASE = [
      { metric: "+4 pts", verb: "Raise", topic: "gross margin", sentence: "Raise gross margin by four points." },
      { metric: "$12M", verb: "Capture", topic: "pricing upside", sentence: "Capture $12M through pricing." },
      { metric: "18 mo", verb: "Reach", topic: "to payback", sentence: "Reach payback within 18 months." }
    ];
    function vpTitle(lv) {
      var t = lv.title === "takeaway" ? "We can lift margin four points by 2027"
            : lv.title === "question" ? "Where's the margin?" : "Margin opportunity";
      return lv.case === "title" ? t.replace(/\b\w/g, function (c) { return c.toUpperCase(); }) : t;
    }
    function vpBullet(b, lv) {
      if (lv.bullet === "sentences") return b.sentence;
      if (lv.lead === "metric") return b.metric + " " + b.topic;
      if (lv.lead === "verb") return b.verb + " " + b.topic;
      return b.topic.charAt(0).toUpperCase() + b.topic.slice(1) + " · " + b.metric;
    }
    function vpEyebrow(lv) {
      return lv.section === "numbered" ? "01 — Strategy"
           : lv.section === "editorial" ? "Where the margin is" : "Strategy";
    }
    function voicePreviewSlide(k) {
      var lv = k.voice.levers;
      var sub = lv.body === "sparse" ? "" : '<div class="st">Three moves to a four-point gain.</div>';
      var bullets = VP_BASE.map(function (b) { return '<li>' + vpBullet(b, lv) + '</li>'; }).join("");
      var st = "--vbrand:" + k.color + ";--vtf:" + k.fonts.title;
      return '<svg class="mslide-svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
        '<foreignObject x="0" y="0" width="320" height="180"><div xmlns="http://www.w3.org/1999/xhtml" class="vp" style="' + st + '">' +
        '<div class="eb">' + vpEyebrow(lv) + '</div><div class="ti">' + vpTitle(lv) + '</div>' + sub +
        '<ul>' + bullets + '</ul></div></foreignObject></svg>';
    }
    function seg(lv, key, opts) {
      return '<div class="seg" data-lever="' + key + '">' + opts.map(function (o) {
        return '<button data-val="' + o[0] + '"' + (lv[key] === o[0] ? ' class="on"' : '') + '>' + o[1] + '</button>';
      }).join("") + '</div>';
    }

    function renderDetail() {
      var k = KITS.filter(function (x) { return x.id === sel; })[0];

      // Org info (structured blocks)
      var orgBody = '<dl class="org-grid">' + Object.keys(k.org).map(function (key) {
        return '<dt>' + key + '</dt><dd>' + k.org[key] + '</dd>';
      }).join("") + '</dl><div class="field-foot"><button class="pill-btn"><i class="ph ph-pencil-simple"></i>Edit</button></div>';
      var orgSum = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;display:inline-block">' + k.org.Company + '</span>';

      // Look & feel
      var swHtml = k.colors.map(function (c) { return '<span class="swatch" style="background:' + c + '"></span>'; }).join("") +
        '<span class="swatch add"><i class="ph ph-plus"></i></span>';
      var lfBody =
        '<div class="lf"><div class="lf-controls">' +
          '<div><div class="sub">Mood</div><div class="mood-row">' +
            '<div class="mood-thumb">' + slideHTML(k, { eyebrow: k.mood.name, title: "Section title" }) + '</div>' +
            '<div style="flex:1"><div class="mname">' + k.mood.name + '</div><div class="msub">' + k.mood.sub + '</div></div>' +
            '<button class="pill-btn"><i class="ph ph-swap"></i>Change</button>' +
          '</div></div>' +
          '<div><div class="sub">Typography</div><div class="font-row">' +
            '<div class="font-card"><div class="glyph" style="font-family:\'' + k.fonts.title + '\'">Ag</div><div class="fl">Title</div><div class="fn">' + k.fonts.title + '</div></div>' +
            '<div class="font-card"><div class="glyph" style="font-family:\'' + k.fonts.body + '\'">Ag</div><div class="fl">Body</div><div class="fn">' + k.fonts.body + '</div></div>' +
          '</div></div>' +
          '<div><div class="sub">Color palette</div><div class="swatches">' + swHtml + '</div></div>' +
        '</div>' +
        '<div class="lf-preview"><div class="cap">Live preview · mood + brand applied</div>' +
          '<div class="frame">' + slideHTML(k, { title: "A headline in the brand voice" }) + '</div>' +
        '</div></div>';
      var lfSum = '<span class="moodthumb">' + slideHTML(k, { eyebrow: "", title: "" }) + '</span>' + k.mood.name + ' · ' + k.fonts.title + ' ' + dots(k.colors);

      // Logos
      var logoBody, logoSum;
      if (k.logos) {
        var variants = [
          { cap: "Full colour", bg: "#ffffff", fg: k.color, capc: "#a3a3a3" },
          { cap: "On brand", bg: k.color, fg: "#ffffff", capc: "rgba(255,255,255,.6)" },
          { cap: "Mono dark", bg: "#ffffff", fg: "#111111", capc: "#a3a3a3" },
          { cap: "Mono light", bg: INK, fg: "rgba(255,255,255,.92)", capc: "rgba(255,255,255,.5)" }
        ];
        logoBody = '<div class="tiles">' + variants.map(function (v) {
          var glyph = k.logo
            ? '<span class="logo-mask logo-mask-tile" style="-webkit-mask-image:url(' + k.logo + ');mask-image:url(' + k.logo + ');background-color:' + v.fg + '"></span>'
            : '<span class="wm" style="color:' + v.fg + '">' + k.name.split(" ")[0] + '</span>';
          return '<div class="logo-tile" style="background:' + v.bg + '">' + glyph + '<span class="cap" style="color:' + v.capc + '">' + v.cap + '</span></div>';
        }).join("") + '<div class="tile-add"><i class="ph ph-upload-simple"></i><span>Upload</span></div></div>';
        logoSum = '<span class="chips">' + variants.slice(0,4).map(function (v) { return '<i style="background:' + v.bg + '"></i>'; }).join("") + '</span>' + variants.length;
      } else {
        logoBody = '<div class="empty"><i class="ph ph-image"></i>No logos yet — upload a colour, dark and mono version so decks pick the right one per background.</div>' +
          '<div class="tiles" style="margin-top:12px"><div class="tile-add"><i class="ph ph-upload-simple"></i><span>Upload logo</span></div></div>';
        logoSum = '<span style="color:var(--fg-3)">None yet</span>';
      }

      // Brand voice — authentic + presentation levers + live preview
      var lv = k.voice.levers;
      var authentic =
        '<div><div class="sub">How it sounds</div>' +
          '<div class="vchips">' + k.voice.traits.map(function (t) { return '<span class="vchip">' + t + '</span>'; }).join("") + '</div>' +
          '<div class="vex">' + k.voice.example + '</div>' +
          '<div class="vavoid"><b>Avoid</b> · ' + k.voice.avoid + '</div></div>';
      var leversBlock =
        '<div><div class="sub">Presentation levers</div>' +
          '<div class="lever-row"><span class="ll">Slide titles</span>' + seg(lv, "title", [["takeaway","Takeaway"],["topic","Topic"],["question","Question"]]) + seg(lv, "case", [["title","Title Case"],["sentence","Sentence"]]) + '</div>' +
          '<div class="lever-row"><span class="ll">Section breaks</span>' + seg(lv, "section", [["numbered","Numbered"],["editorial","Editorial"],["minimal","Minimal"]]) + '</div>' +
          '<div class="lever-row"><span class="ll">Slide bodies</span>' + seg(lv, "body", [["sparse","Sparse"],["balanced","Balanced"],["detailed","Detailed"]]) + '</div>' +
          '<div class="lever-row"><span class="ll">Bullets</span>' + seg(lv, "bullet", [["fragments","Fragments"],["sentences","Sentences"]]) + seg(lv, "lead", [["verb","Verb"],["metric","Metric"],["free","Free"]]) + '</div></div>';
      var voiceBody =
        '<div class="bv"><div class="bv-controls">' + authentic + leversBlock + '</div>' +
          '<div class="bv-preview"><div class="cap">Live preview · watch the deck re-write</div>' +
            '<div class="frame" id="vpFrame">' + voicePreviewSlide(k) + '</div></div></div>';
      var voiceSum = k.voice.traits.join(" · ");

      // Brand knowledge (Gold)
      var kn = k.knowledge, knBody, knSum;
      if (kn.count > 0) {
        knBody = '<div class="kb-intro">Drop in the company’s documents — reports, decks, product docs, case studies. We use them to inform every deck, pulling in what’s relevant per slide.</div>' +
          '<div class="kb-docs">' + kn.docs.map(function (d) {
            return '<div class="kb-doc"><i class="ph ph-file-text"></i><span class="dn">' + d + '</span><i class="ph ph-dots-three dx"></i></div>';
          }).join("") + '</div>' +
          (kn.count > kn.docs.length ? '<div class="viewall" style="margin:0 0 12px">View all ' + kn.count + ' <i class="ph ph-arrow-right"></i></div>' : '') +
          '<div class="kb-drop"><i class="ph ph-upload-simple"></i>Add documents — PDF · DOCX · PPTX</div>';
        knSum = kn.count + ' documents';
      } else {
        knBody = '<div class="kb-intro">Share the company’s documents — reports, decks, product docs — and every deck gets informed by what your company actually knows.</div>' +
          '<div class="kb-drop"><i class="ph ph-upload-simple"></i>Add documents to get started</div>';
        knSum = '<span style="color:var(--fg-3)">Not set up</span>';
      }

      // Templates
      var tplBody = '<div class="tpl-grid">' + k.templates.map(function (t) {
        return '<div class="tpl"><div class="tcover">' + slideHTML(k, { eyebrow: "Template", title: t.t }) + '</div>' +
          '<div class="tname">' + t.t + '</div></div>';
      }).join("") + '</div>';
      var tplSum = '<span class="chips">' + k.templates.slice(0,3).map(function (t) { return '<i style="background:' + t.grad + '"></i>'; }).join("") + '</span>' + k.templates.length;

      // Assets
      var shown = Math.min(k.assetCount, 10);
      var assetBody = '<div class="asset-grid">' + Array.apply(null, { length: shown }).map(function (_, i) {
        var fb = ASSET_GRADS[i % ASSET_GRADS.length];
        return '<img class="asset" loading="lazy" alt="" src="https://picsum.photos/seed/' + k.id + (i + 1) + '/240" ' +
          'data-fb="' + fb + '" onerror="this.style.background=this.getAttribute(\'data-fb\');this.removeAttribute(\'src\')">';
      }).join("") + '</div>' +
        (k.assetCount > shown ? '<div class="viewall">View all ' + k.assetCount + ' <i class="ph ph-arrow-right"></i></div>' : '');
      var assetSum = '<span class="chips">' + ASSET_GRADS.slice(0,4).map(function (gr) { return '<i style="background:' + gr + '"></i>'; }).join("") + '</span>' + k.assetCount;

      document.getElementById("kitDetail").innerHTML =
        '<div class="kit-head">' + markEl(k, "mark-lg") +
          '<div class="htext"><h1>' + k.name + '</h1><div class="row">' +
            (k.isDefault
              ? '<span class="badge-default"><i class="ph-fill ph-star"></i>Default kit</span>'
              : '<button class="link-btn">Set as default</button>') +
            '<span style="color:var(--fg-3);font-size:12px">·</span>' +
            '<span style="color:var(--fg-2);font-size:12px">Used on ' + (k.isDefault ? "all new decks" : "select decks") + '</span>' +
          '</div></div>' +
          '<div class="spacer"></div>' +
          '<button class="more"><i class="ph ph-dots-three"></i></button>' +
        '</div>' +
        '<div class="accs">' +
          acc("Org info", orgSum, orgBody, true) +
          acc("Look &amp; feel", lfSum, lfBody, false) +
          acc("Logos", logoSum, logoBody, false) +
          acc("Brand voice", voiceSum, voiceBody, false) +
          acc('Brand knowledge <span class="tag-gold"><i class="ph-fill ph-crown-simple"></i>Gold</span>', knSum, knBody, false) +
          acc("Templates", tplSum, tplBody, false) +
          acc("Assets", assetSum, assetBody, false) +
        '</div>';
    }

    // events
    document.getElementById("kitList").addEventListener("click", function (e) {
      var row = e.target.closest(".kit-row"); if (!row) return;
      sel = row.getAttribute("data-kit"); renderRail(); renderDetail();
      document.getElementById("kitDetail").scrollTop = 0;
    });
    document.getElementById("kitDetail").addEventListener("click", function (e) {
      var segBtn = e.target.closest(".seg button");
      if (segBtn) {
        var s = segBtn.closest(".seg");
        var k = KITS.filter(function (x) { return x.id === sel; })[0];
        k.voice.levers[s.getAttribute("data-lever")] = segBtn.getAttribute("data-val");
        [].forEach.call(s.querySelectorAll("button"), function (b) { b.classList.toggle("on", b === segBtn); });
        var f = document.getElementById("vpFrame");
        if (f) f.innerHTML = voicePreviewSlide(k);
        return;
      }
      var head = e.target.closest(".acc-head"); if (!head) return;
      head.parentNode.classList.toggle("open");
    });

    renderRail(); renderDetail();
  </script>
</body>
</html>
