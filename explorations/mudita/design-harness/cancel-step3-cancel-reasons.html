<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cancel flow · Step 3 · Cancel reasons</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="../../../design-system/pai.css" />
  <style>
    /* Figma shadow ramp tokens (shadow/drop-1..3, shadow/inner-1) */
    :root{
      --shadow-drop-1:rgba(11,15,20,0.06);
      --shadow-drop-2:rgba(11,15,20,0.09);
      --shadow-drop-3:rgba(11,15,20,0.20);
      --shadow-inner-1:rgba(255,255,255,0.80);
      /* elevation-4 · not yet in pai.css; transcribed from the Figma effect style */
      --shadow-elevation-04:
        0 0 0 1px var(--shadow-drop-2),
        0 1px 2px 0 var(--shadow-drop-2),
        0 4px 6px 0 var(--shadow-drop-2),
        0 40px 40px -24px var(--shadow-drop-2),
        0 56px 56px -32px var(--shadow-drop-3),
        0 24px 40px 0 var(--shadow-drop-2),
        inset 0 0 0 1.5px var(--shadow-inner-1);
    }

    /* pai.css ships no reset; the app it was translated from is border-box */
    *,*::before,*::after{ box-sizing:border-box; }

    html, body{ height:100%; }
    body.pai{
      margin:0;
      min-height:100vh;
      background:var(--bg-tertiary);
      overflow-x:hidden;
    }

    /* the dimmed app behind the modal */
    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }

    .modal{
      position:relative;
      width:480px;
      height:580px;
      max-width:calc(100vw - 32px);
      border-radius:8px;
      background:var(--bg-primary);
      box-shadow:var(--shadow-elevation-04);
      overflow:hidden;
      transition:height 240ms var(--ease-out-strong);
    }
    /* "Other" unchecked · the detail field folds away and the card follows */
    .modal.is-collapsed{ height:495px; }

    .modal-body{
      position:absolute;
      left:30px;
      top:30px;
      width:420px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    .modal-copy{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
      width:100%;
      word-break:break-word;
    }
    .modal-title{
      margin:0;
      font-size:24px;
      line-height:32px;
      letter-spacing:0;
      font-weight:500;
      color:var(--text-primary);
    }
    .modal-sub{
      margin:0;
      color:var(--text-secondary);
    }

    .reason-list{
      margin-top:20px;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
    }
    .reason{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
      padding:2px 0;
    }
    .reason-row{
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
    }
    .reason-label{
      padding:4px 0;
      color:var(--text-primary);
    }

    .other-detail{ width:100%; }
    .other-detail .pai-textarea{
      display:block;
      height:77px;
      min-height:77px;
      padding:12px;
      resize:none;
    }
    .modal.is-collapsed .other-detail{ display:none; }

    .modal-actions{
      position:absolute;
      right:30px;
      bottom:30px;
      width:420px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .modal-actions .button-style{
      flex:1 0 0;
      min-width:0;
    }

    @media (prefers-reduced-motion: reduce){
      .modal{ transition:none; }
    }
  </style>
</head>
<body class="pai">
  <div class="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="step3-title" data-node-id="160:2139">
      <div class="modal-body">
        <div class="modal-copy" data-node-id="160:2140">
          <p class="modal-title" id="step3-title">Mind sharing why you're cancelling?</p>
          <p class="modal-sub text-body-base-regular">It helps us improve. Pick any that apply.</p>
        </div>

        <div class="reason-list" data-node-id="160:2146">
          <div class="reason" data-node-id="160:2147">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" checked />
              <span class="reason-label text-body-base-regular">Too expensive</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2149">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" checked />
              <span class="reason-label text-body-base-regular">Not using it enough</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2151">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" />
              <span class="reason-label text-body-base-regular">Missing features I need</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2153">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" />
              <span class="reason-label text-body-base-regular">Found a better alternative</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2155">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" />
              <span class="reason-label text-body-base-regular">Technical issues or bugs</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2157">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" />
              <span class="reason-label text-body-base-regular">Taking a temporary break</span>
            </label>
          </div>

          <div class="reason" data-node-id="160:2159">
            <label class="reason-row">
              <input type="checkbox" class="pai-checkbox" id="reason-other" checked />
              <span class="reason-label text-body-base-regular">Other</span>
            </label>
            <div class="other-detail" data-node-id="160:2161">
              <textarea class="pai-textarea" id="other-detail-field" aria-label="Other" placeholder="Share details to help is improve..."></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-actions" data-node-id="160:2143">
        <button type="button" class="button-style button-large button-tertiary">Continue to cancel</button>
        <button type="button" class="button-style button-large button-primary">Keep my plan</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var modal = document.getElementById('modal');
      var other = document.getElementById('reason-other');
      var field = document.getElementById('other-detail-field');

      function sync(focus) {
        modal.classList.toggle('is-collapsed', !other.checked);
        if (other.checked && focus) field.focus();
      }

      other.addEventListener('change', function () { sync(true); });
      sync(false);
    })();
  </script>
</body>
</html>
