<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cancel flow · Step 1 · Renewal reminder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="../../../design-system/pai.css" />
  <style>
    /* Figma shadow ramp tokens (shadow/drop-1..3, shadow/inner-1) */
    :root{
      --shadow-drop-1:rgba(11,15,20,0.06);
      --shadow-drop-2:rgba(11,15,20,0.09);
      --shadow-drop-3:rgba(11,15,20,0.20);
      --shadow-inner-1:rgba(255,255,255,0.80);
      /* elevation-4 · not yet in pai.css; transcribed from the Figma effect style */
      --shadow-elevation-04:
        0 0 0 1px var(--shadow-drop-2),
        0 1px 2px 0 var(--shadow-drop-2),
        0 4px 6px 0 var(--shadow-drop-2),
        0 40px 40px -24px var(--shadow-drop-2),
        0 56px 56px -32px var(--shadow-drop-3),
        0 24px 40px 0 var(--shadow-drop-2),
        inset 0 0 0 1.5px var(--shadow-inner-1);
    }

    html, body{ height:100%; }
    body.pai{
      margin:0;
      min-height:100vh;
      background:var(--bg-tertiary);
      overflow-x:hidden;
    }

    /* the dimmed app behind the modal */
    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }

    .modal{
      position:relative;
      width:480px;
      height:270px;
      max-width:calc(100vw - 32px);
      border-radius:8px;
      background:var(--bg-primary);
      box-shadow:var(--shadow-elevation-04);
      overflow:hidden;
    }

    .modal-copy{
      position:absolute;
      left:30px;
      top:30px;
      width:420px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:8px;
      word-break:break-word;
    }
    .modal-title{
      margin:0;
      font-size:24px;
      line-height:32px;
      letter-spacing:0;
      font-weight:500;
      color:var(--text-primary);
    }
    .modal-sub{
      margin:0;
      color:var(--text-secondary);
    }

    .modal-actions{
      position:absolute;
      right:30px;
      bottom:30px;
      width:420px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .modal-actions .button-style{
      flex:1 0 0;
      min-width:0;
    }
  </style>
</head>
<body class="pai">
  <div class="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="step1-title" data-node-id="160:2312">
      <div class="modal-copy">
        <p class="modal-title" id="step1-title">Worried about being charged next year without notice?</p>
        <p class="modal-sub text-body-base-regular">Keep your plan and we'll email you a reminder before your renewal, so there are no surprises.</p>
      </div>

      <div class="modal-actions">
        <button type="button" class="button-style button-large button-tertiary">Continue to cancel</button>
        <button type="button" class="button-style button-large button-primary">Keep my plan</button>
      </div>
    </div>
  </div>
</body>
</html>
