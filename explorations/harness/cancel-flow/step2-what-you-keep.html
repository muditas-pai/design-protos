<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔵</text></svg>" />
<title>Cancel flow, step 2 (what you keep) · design-protos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="../../../design-system/pai.css" />
<style>
  /* Figma tokens with no pai.css equivalent yet */
  :root{
    --bg-success-inverted:#F0FDF4;
    --text-success-secondary:#16A34A;
    /* elevation-4, straight from the Figma effect style on the dialog */
    --shadow-elevation-04:
      0 0 0 1px rgba(11,15,20,0.09),
      0 1px 2px 0 rgba(11,15,20,0.09),
      0 4px 6px 0 rgba(11,15,20,0.09),
      0 40px 40px -24px rgba(11,15,20,0.09),
      0 56px 56px -32px rgba(11,15,20,0.20),
      0 24px 40px 0 rgba(11,15,20,0.09),
      inset 0 0 0 1.5px rgba(255,255,255,0.80);
  }

  html,body{height:100%;}
  body.pai{margin:0;background:var(--bg-tertiary);overflow-x:hidden;}

  .frame{position:relative;width:100%;min-height:100vh;}

  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  }

  .dialog{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:480px;height:540px;
    background:var(--bg-primary);
    border-radius:8px;overflow:hidden;
    box-shadow:var(--shadow-elevation-04);
  }

  /* ---- header ---- */
  .head{
    position:absolute;left:30px;top:30px;width:420px;
    display:flex;flex-direction:column;gap:8px;
    word-break:break-word;
  }
  .head h1{
    margin:0;
    font-size:24px;line-height:32px;font-weight:500;letter-spacing:normal;
    color:var(--text-primary);
  }
  .head p{margin:0;color:var(--text-secondary);}

  /* ---- retained-benefit rows ---- */
  .rows{
    position:absolute;left:30px;top:162px;width:420px;
    display:flex;flex-direction:column;gap:10px;
  }
  .row{
    display:flex;align-items:center;
    padding:12px;
    background:var(--bg-primary);
    border:1px solid var(--border-secondary);
    border-radius:4px;
    overflow:hidden;
  }
  .row-inner{
    flex:1 0 0;min-width:0;
    display:flex;align-items:center;justify-content:space-between;
  }
  .row-lead{display:flex;align-items:center;gap:10px;width:232px;flex-shrink:0;}
  .row-label{margin:0;color:var(--text-primary);white-space:nowrap;}

  .tile{position:relative;width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;}

  /* row 1: stacked slide thumbnails */
  .tile-slides .slide{position:absolute;border:1px solid var(--border-secondary);border-radius:2px;}
  .tile-slides .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2px;pointer-events:none;}
  .tile-slides .s-back{left:4px;top:20px;width:40px;height:22px;}
  .tile-slides .s-mid {left:2px;top:14px;width:44px;height:24px;}
  .tile-slides .s-front{left:0;top:7px;width:48px;height:27px;}

  /* row 2: pen + signature illustration */
  .tile-decks{background:#F2E7FE;}
  .tile-decks .abs{position:absolute;}
  .tile-decks img{display:block;max-width:none;width:100%;height:100%;}
  .d-v189{width:29.286px;height:9.516px;left:calc(50% - 0.36px);top:22px;transform:translateX(-50%);}
  .d-v189 .leaf{position:absolute;inset:-7.88% -2.56%;}
  .d-v190{width:16.531px;height:7.591px;left:calc(50% - 6.73px);top:23.93px;transform:translateX(-50%);}
  .d-v190 .leaf{position:absolute;inset:-9.88% -4.54%;}
  .d-pen{
    width:48.764px;height:67.595px;
    left:calc(50% + 19.38px);top:calc(50% - 21.2px);transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
  }
  .d-pen .leaf{flex:none;transform:rotate(7.34deg);width:41.067px;height:62.862px;}
  .d-rect{
    width:46.559px;height:17.994px;left:19px;top:23.93px;
    display:flex;align-items:center;justify-content:center;
  }
  .d-rect .leaf{flex:none;transform:rotate(-4.3deg);width:45.592px;height:14.617px;position:relative;}
  .d-rect .leaf span{position:absolute;inset:-19.05% -6.11%;display:block;}

  /* row 3: credits illustration */
  .tile-credits img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;object-fit:cover;pointer-events:none;}

  /* ---- "Till …" pill ---- */
  .pill{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:4px 10px;border-radius:100px;flex-shrink:0;
    background:var(--bg-success-inverted);
    color:var(--text-success-secondary);
  }
  .pill i{font-size:16px;line-height:1;display:block;}

  /* ---- actions ---- */
  .actions{
    position:absolute;right:30px;bottom:30px;width:420px;
    display:flex;align-items:center;gap:10px;
  }
  .actions .button-style{flex:1 0 0;min-width:0;}
  /* the Figma button/rest effect is elevation-02, not pai.css's default tertiary shadow */
  .actions .button-tertiary{box-shadow:var(--shadow-elevation-02);}

  @media (max-height:600px){
    .frame{min-height:600px;}
  }
</style>
</head>
<body class="pai">

<div class="frame">
  <div class="overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="step2-title">

      <div class="head">
        <h1 id="step2-title">Nothing changes today, you're on Pro until 10 Jul 2027</h1>
        <p class="text-body-base-regular">Cancelling only stops next year's renewal. You keep full Pro access until then, here's what stays yours:</p>
      </div>

      <div class="rows">

        <div class="row">
          <div class="row-inner">
            <div class="row-lead">
              <div class="tile tile-slides">
                <div class="slide s-back"><img src="assets/thumb-3.png" alt="" /></div>
                <div class="slide s-mid"><img src="assets/thumb-2.png" alt="" /></div>
                <div class="slide s-front"><img src="assets/thumb-1.png" alt="" /></div>
              </div>
              <p class="row-label text-body-lg-regular">4 Presentations</p>
            </div>
            <div class="pill">
              <i class="ph-fill ph-check-circle" aria-hidden="true"></i>
              <span class="text-body-sm-regular">Till 10 Jul 2027</span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="row-inner">
            <div class="row-lead">
              <div class="tile tile-decks">
                <div class="abs d-v189"><span class="leaf"><img src="assets/deck-v189.svg" alt="" /></span></div>
                <div class="abs d-v190"><span class="leaf"><img src="assets/deck-v190.svg" alt="" /></span></div>
                <div class="abs d-pen"><span class="leaf"><img src="assets/deck-pen.svg" alt="" /></span></div>
                <div class="abs d-rect"><span class="leaf"><span><img src="assets/deck-rect.svg" alt="" /></span></span></div>
              </div>
              <p class="row-label text-body-lg-regular">Generating New Decks</p>
            </div>
            <div class="pill">
              <i class="ph-fill ph-check-circle" aria-hidden="true"></i>
              <span class="text-body-sm-regular">Till 10 Jul 2027</span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="row-inner">
            <div class="row-lead">
              <div class="tile tile-credits">
                <img src="assets/credits.png" alt="" />
              </div>
              <p class="row-label text-body-lg-regular">3,320 Unused Credits</p>
            </div>
            <div class="pill">
              <i class="ph-fill ph-check-circle" aria-hidden="true"></i>
              <span class="text-body-sm-regular">Till 10 Jul 2027</span>
            </div>
          </div>
        </div>

      </div>

      <div class="actions">
        <button type="button" class="button-style button-large button-tertiary">Continue to cancel</button>
        <button type="button" class="button-style button-large button-primary">Keep my plan</button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
