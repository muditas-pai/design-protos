<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />
  <title>Cancel flow · step 5 · renewal cancelled</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="../../../design-system/pai.css" />

  <style>
    /* Figma "elevation-4" · not yet in pai.css, transcribed from the node's effect stack.
       Topmost listed shadow paints first, matching Figma's effect order. */
    :root {
      --shadow-elevation-04:
        0 0 0 1px var(--border-secondary),
        0 1px 2px 0 var(--border-secondary),
        0 4px 6px 0 var(--border-secondary),
        0 40px 40px -24px var(--border-secondary),
        0 56px 56px -32px rgba(11, 15, 20, 0.20),
        0 24px 40px 0 var(--border-secondary);
      --inner-hairline: rgba(255, 255, 255, 0.80);
    }

    html, body { margin: 0; }

    body.pai {
      min-height: 100vh;
      background: var(--bg-tertiary);
    }

    /* Scrim over the (blurred) app behind the modal */
    .scrim {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .modal {
      position: relative;
      box-sizing: border-box;
      width: 550px;
      max-width: 100%;
      padding: 30px;
      border-radius: 8px;
      background: var(--bg-primary);
      box-shadow: var(--shadow-elevation-04);
    }
    /* Inner 1.5px light hairline sits above the card fill, below the content */
    .modal::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1.5px var(--inner-hairline);
    }

    .modal-body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .modal-copy {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* 64px glyph in a 66px line box, matching the Figma text node's height.
       The system emoji font's default line box is ~84px, which would push the
       whole card 18px taller than the design. */
    .wave {
      font-size: 64px;
      line-height: 66px;
      font-weight: 500;
    }

    .copy-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .modal-title {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
      line-height: 32px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .modal-text {
      margin: 0;
      color: var(--text-primary);
      word-break: break-word;
    }

    .accent { color: var(--app-500); }
    .accent-strong { color: var(--app-500); font-weight: 500; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      width: 100%;
    }

    .modal-actions .button-style {
      width: 240px;
      flex: 0 1 240px;
    }

    .button-style:focus-visible {
      outline: none;
      box-shadow: var(--shadow-elevation-focused);
    }

    @media (max-width: 600px) {
      .modal { padding: 24px; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .button-style { width: 100%; flex: 0 0 auto; }
    }
  </style>
</head>

<body class="pai">
  <div class="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="step5-title">
      <div class="modal-body">
        <div class="modal-copy">
          <div class="wave" role="img" aria-label="Waving hand">👋</div>

          <div class="copy-stack">
            <h2 class="modal-title" id="step5-title">
              Renewal cancelled, you're still on<br />
              Pro until <span class="accent">10 Jul 2027</span>
            </h2>

            <p class="modal-text text-body-lg-regular">
              Auto-renewal is off, so you won't be charged again. Your Pro plan stays fully active until 10 Jul 2027, then moves to Free. Your <span class="accent-strong">20% discount</span> stays reserved, turn renewal back on any time to keep it.
            </p>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="button-style button-large button-tertiary">Done</button>
          <button type="button" class="button-style button-large button-primary">Re-enable renewal at 20% off</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
